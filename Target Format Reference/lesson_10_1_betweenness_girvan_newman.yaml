# Worksheet 10.1 — Community discovery I: betweenness and the Girvan-Newman method.
#
# SOURCES AND THEIR AUTHORITY, stated because this lesson's hierarchy is unusual.
#
# ⚠ THE CHAPTER IS E&K SECTION 3.6, NOT 3.7. §3.7 is the chapter's EXERCISES —
# measured, c3.pdf page 32 (book p. 74). Girvan-Newman lives in §3.6, "Advanced
# Material: Betweenness Measures and Graph Partitioning", book pp. 62-74.
# ⚠ AND `claude_code/AUTHORING.md` IS STALE WHERE IT SAYS COMMUNITY DISCOVERY HAS
# NO CHAPTER — it does, and §3.6 carries the whole algorithm.
#
# ⚠ FROM-PDF vs FROM-TXT, tagged because the equation-loss risk is live (this is
# the L9 §18.7 failure, where OCR dropped every equation and three artifacts were
# built on the loss):
#   FROM-TXT  — §3.6's PROSE is intact in c3.txt: the betweenness definition, the
#               three-step method, the divide-by-2 argument, the "edge OR EDGES of
#               highest betweenness" wording. All verified by reading it.
#   FROM-PDF  — every FIGURE. c3.txt renders Figures 3.18/3.19/3.20 as loose
#               scattered label tokens with NO edges and NO numbers, so the sample
#               network, the shortest-path counts and the flow values exist ONLY in
#               the PDF read as page images. `agraph`/`bfs_tree_a` are FROM-PDF.
#   ⚠ E&K IS SILENT ON MODULARITY. §3.6 never defines Q. Every modularity claim
#               here is NO-BOOK: derived from Hari's lecture notes + worksheet and
#               flagged in WORKSHEET_REVIEW.md.
#
# ⚠ 16 EDGES IN E&K FIG 3.18(a), NOT 17 — there is no C-D edge. C sits directly
# above D and the C-A DIAGONAL reads as a C-D vertical at 150 dpi; settled at 420
# dpi, and corroborated by the book's own Fig 3.18(b), which draws B-C as a
# same-layer non-tree edge and draws no C-D. The mistake would have been INVISIBLE
# to the Fig 3.19/3.20 cross-check (a same-layer edge changes neither the
# shortest-path counts nor the flows out of A), so no item is posed on this
# graph's full betweenness.
#
# ⚠ THE MODULARITY BOUND IS THE TIGHT ONE, [-1/2, 1), EVERYWHERE IN THIS LESSON —
# AND THE SOURCES NOW AGREE. ws1 Prob 9 originally keyed the bipartite example at
# Q = -1; MEASURED, it scores exactly -1/2, and so does EVERY bipartite graph
# split along its two sides (K_{2,3}, the alternating 6-cycle, Hari's own figure
# — all -1/2). The reason is one line: with no edge inside either side, each
# side's degree total is exactly m, so Q = -(m^2+m^2)/(4m^2) = -1/2. That is the
# true minimum (Brandes et al. 2008); -1 comes from bounding Q's two terms
# SEPARATELY and is never attained.
# ⚠ HARI RULED TIGHT, AND THE SOURCES MOVED WITH THE WORKSHEET (2026-08-10): ws1
# Prob 9's prompt, key and figure caption, ws1.tex:187, and lecture1.tex:106 all
