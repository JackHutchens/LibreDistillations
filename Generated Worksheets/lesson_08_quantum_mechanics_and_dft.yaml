    takeaway_markdown: '**Key Takeaway:** Outside $r \ge r_c$ (the bonding region), $\Psi_{\text{pseudo}}(r)$ and $\Psi_{\text{AE}}(r)$
      are **identical**. Increasing $r_c$ makes the pseudopotential "softer" (requiring fewer plane waves and a lower kinetic
      cutoff $E_{\text{cut}} = \frac{\hbar^2}{2m}G_{\max}^2$), whereas a smaller $r_c$ is "harder" (higher $E_{\text{cut}}$)
      but more transferable across shortened high-pressure bonds.'
  - id: q34_dft_in_practice_real_vs_reciprocal
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_pseudopotentials_and_planewaves
    prompt_markdown: In a modern plane-wave DFT code using Fast Fourier Transforms (FFTs, the reference notes, p. 37), which
      energy terms are evaluated in **reciprocal ($\mathbf{G}$) space** and which are evaluated in **real ($\mathbf{r}$) space**?
    hint_markdown: Read the sub-bullets under Step 3.
    options:
    - id: a
      text: Kinetic energy and Hartree electrostatic energy are evaluated in reciprocal space (where nabla^2 and Poisson's
        equation are diagonal in G), while exchange-correlation and local external potentials are evaluated in real space.
    - id: b
      text: All terms are evaluated exclusively in real space without using reciprocal space.
    - id: c
      text: Kinetic energy is evaluated in real space while LDA exchange-correlation is evaluated analytically in reciprocal
        space.
    - id: d
      text: Fast Fourier Transforms scale as O(N^4) and are avoided in plane-wave codes.
    correct: a
    rationale_markdown: In a plane-wave basis $e^{i(\\mathbf{k}+\\mathbf{G})\\cdot\\mathbf{r}}$, the Laplacian $-\\frac{1}{2}\\nabla^2$
      is diagonal in reciprocal space ($\\frac{1}{2}|\\mathbf{k}+\\mathbf{G}|^2$), and the Hartree Poisson equation $\\nabla^2
      V_H = -4\\pi\\rho$ simplifies to $V_H(\\mathbf{G}) = \\frac{4\\pi\\rho(\\mathbf{G})}{G^2}$. Conversely, $V_{\\text{xc}}(\\rho(\\mathbf{r}))$
      is diagonal in real space $\\mathbf{r}$. FFTs switch between the two spaces in $\\mathcal{O}(N_G \\log N_G)$ time.
  - id: q35_al_pseudopotential_valence_count_numeric
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_pseudopotentials_and_planewaves
    prompt_markdown: an all-electron Aluminum atom ($\text{Al}, Z = 13$) has core states $1s^2$ ($-1512\text{ eV}$), $2s^2$
      ($-108\text{ eV}$), and $2p^6$ ($-69.8\text{ eV}$), and valence states $3s^2$ ($-7.8\text{ eV}$) and $3p^1$ ($-2.7\text{
      eV}$). When the inner shells are frozen into a pseudopotential ("Pseudo Al"), what is the effective valence ionic charge
      $Z_{\text{pseudo}}$ (number of active valence electrons per Al atom)?
    hint_markdown: Subtract the 10 frozen core electrons (1s^2 2s^2 2p^6) from Z = 13, or read 'Pseudo Al Z =...'.
    correct:
      value: 3
      tolerance: 0.1
    rationale_markdown: Freezing the $10$ Neon-core electrons ($1s^2 2s^2 2p^6$) into the ionic pseudopotential leaves only
      the $3$ outer valence electrons ($3s^2 3p^1$), so Pseudo-Al has $Z = 3$.
  - id: q36_pseudopotential_matching_outside_rc
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by:
    - sec_pseudopotentials_and_planewaves
    - concept_pseudopotential_smoothing
    prompt_markdown: how do the pseudo-wavefunction $\Psi_{\text{pseudo}}(r)$ and pseudopotential $V_{\text{pseudo}}(r)$ compare
      to the all-electron wavefunction $\Psi_{\text{AE}}(r)$ and Coulomb potential $V(r) \sim -Z/r$ **inside** ($r < r_c$)
      versus **outside** ($r \ge r_c$) the core cutoff radius $r_c$?
    hint_markdown: Examine the red (pseudo) and dashed blue (real) curves inside and outside the vertical black line r_c.
    options:
    - id: a
      text: Inside r < r_c, V_pseudo is smooth/finite and Psi_pseudo is smooth and nodeless (removing core oscillations);
        outside r >= r_c, Psi_pseudo(r) and V_pseudo(r) are identical to the true all-electron wavefunction and potential.
    - id: b
      text: Outside r >= r_c, Psi_pseudo(r) is set to zero while inside r < r_c it oscillates faster than Psi_AE(r).
    - id: c
      text: V_pseudo(r) diverges as -Z^2/r^3 at r -> 0.
    - id: d
      text: Psi_pseudo(r) has twice as many radial nodes inside r < r_c as Psi_AE(r).
    correct: a
    rationale_markdown: illustrates that inside $r < r_c$, the rapid core oscillations of $\\Psi_{\\text{AE}}$ and the $-Z/r$
      singularity are replaced by smooth, nodeless red curves ($\\Psi_{\\text{pseudo}}, V_{\\text{pseudo}}$). Outside $r \\ge
      r_c$ (where chemical bonding occurs), the red and blue curves coincide **identically**.
  - id: q37_nonlocal_pseudopotential_orthogonality
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_pseudopotentials_and_planewaves
    prompt_markdown: Why do **non-local pseudopotentials** require different effective radial potentials $V_l(r)$ for different
      angular momentum channels ($s, p, d$)?
    hint_markdown: Read the two bullet points regarding states that have a core shell below them with the same angular momentum
      l.
    options:
    - id: a
      text: Electron states with different angular momenta l scatter differently from the core; specifically, valence states
        that have a core shell below them of the SAME angular momentum l feel stronger effective repulsion due to the Pauli
        orthogonality constraint.
    - id: b
      text: Because s, p, and d electrons have different electric charges.
    - id: c
      text: Because only d-electrons experience nuclear attraction outside r_c.
    - id: d
      text: Because spherical harmonics Y_{lm} are not orthogonal to one another.
    correct: a
    rationale_markdown: Orthogonality between a valence orbital and an inner core orbital of the **same** angular momentum
      $l$ (whose spherical harmonics $Y_{lm}$ are identical!) must be achieved through radial nodes, which raises the radial
      kinetic energy and acts as an effective repulsive pseudopotential in that $l$-channel.
  - id: q38_basis_set_molecules_vs_solids
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_pseudopotentials_and_planewaves
    prompt_markdown: which basis set is most natural for **isolated molecules** versus **periodic crystalline solids**, and
      how do we systematically converge a basis-set calculation toward completeness?
    hint_markdown: Check the bullet points under 'Basis set choices' and 'Convergence'.
    options:
    - id: a
      text: Localized atomic orbitals or Gaussians are typically used for isolated molecules, whereas periodic plane waves
        (sines and cosines) with Bloch's theorem and k-point sampling are used for periodic solids; convergence is achieved
        by systematically increasing the basis set size (e.g. G_max / E_cut) and k-point mesh.
    - id: b
      text: Single plane waves are used for isolated molecules in vacuum, whereas non-periodic polynomials are used for bulk
        crystals.
    - id: c
      text: Reducing the basis set size to a single function per unit cell guarantees exact completeness.
    - id: d
      text: k-point sampling is only required for isolated gas-phase atoms.
    correct: a
    rationale_markdown: Molecules are localized in space (favoring atom-centered Gaussians/localized orbitals), whereas crystals
      have translational periodicity $[\hat{\mathcal{H}}, \hat{\mathcal{T}}_{\mathbf{R}}] = 0$ (favoring plane waves $\\sum_{|\\mathbf{G}|
      \\le G_{\\max}} c_{n\\mathbf{k}}(\\mathbf{G})e^{i\\mathbf{G}\\cdot\\mathbf{r}}$ combined with Brillouin-zone $\\mathbf{k}$-point
      sampling).
  - id: sec_bloch_band_structure_and_dft_failures
    type: markdown_section
    title: 6. Bloch's Theorem, Crystal Band Gaps & Successes/Failures of DFT
    body_markdown: "### Bloch's Theorem and Reciprocal Space\nIn a periodic crystal defined by Bravais lattice vectors $\\\
      {\\mathbf{a}_1, \\mathbf{a}_2, \\mathbf{a}_3\\}$, the Hamiltonian commutes with lattice translations ($[\\hat{\\mathcal{H}},\
      \ \\hat{\\mathcal{T}}_{\\mathbf{R}}] = 0$). By **Bloch's Theorem**, the eigenstates take the form of a plane wave modulated\
      \ by a lattice-periodic function $u_{n\\mathbf{k}}(\\mathbf{r} + \\mathbf{R}) = u_{n\\mathbf{k}}(\\mathbf{r})$:\n$$\\\
      boxed{\\varphi_{n\\mathbf{k}}(\\mathbf{r}) = u_{n\\mathbf{k}}(\\mathbf{r})\\exp(i\\mathbf{k}\\cdot\\mathbf{r}) \\quad\
      \ \\Longleftrightarrow \\quad \\psi(\\mathbf{r} + \\mathbf{R}) = \\psi(\\mathbf{r})\\exp(i\\mathbf{k}\\cdot\\mathbf{R})}$$\n\
      Expanding $u_{n\\mathbf{k}}(\\mathbf{r}) = \\sum_{|\\mathbf{G}| \\le G_{\\max}} c_{n\\mathbf{k}}(\\mathbf{G})\\exp(i\\\
      mathbf{G}\\cdot\\mathbf{r})$ over reciprocal lattice vectors $\\mathbf{G}$ generated by:\n$$\\mathbf{b}_k = 2\\pi \\\
      frac{\\mathbf{a}_l \\times \\mathbf{a}_m}{\\mathbf{a}_k \\cdot (\\mathbf{a}_l \\times \\mathbf{a}_m)}$$\nallows us to\
      \ restrict the crystal wavevector $\\mathbf{k}$ to the **First Brillouin Zone** — the **Wigner–Seitz cell of the reciprocal\
      \ lattice**.\n\n### Physical Origin of the Electronic Band Gap: Bragg Diffraction Picture\nWhy do energy gaps open in\
      \ periodic crystals? Consider a 1D crystal with lattice constant $a$:\n- An electron wave undergoes **Bragg diffraction**\
      \ when $n\\lambda = 2a \\implies k = \\frac{2\\pi}{\\lambda} = \\pm \\frac{n\\pi}{a}$ (at the Brillouin-zone boundary\
      \ $k = \\pm\\frac{\\pi}{a}$ for $n=1$).\n- At $k = \\frac{\\pi}{a}$, the forward-traveling incident wave $\\psi_i =\
      \ e^{i\\pi x/a}$ and the backward-diffracted wave $\\psi_r = e^{-i\\pi x/a}$ are degenerate and mix equally to form\
      \ **two standing waves** (no traveling wave solution exists!):\n $$\\psi_+(x) = \\psi_i + \\psi_r = 2\\cos\\left(\\\
      frac{\\pi x}{a}\\right), \\qquad \\psi_-(x) = \\psi_i - \\psi_r = 2i\\sin\\left(\\frac{\\pi x}{a}\\right)$$\n- **Energy\
      \ Splitting $\\Delta E = E_{\\text{gap}} = 2U$:**\n - $|\\psi_+(x)|^2 \\propto \\cos^2(\\pi x/a)$ piles electron probability\
      \ density **directly on top of the positive ion cores** ($x = 0, \\pm a, \\pm 2a, \\dots$), lowering its potential energy\
      \ by $-U$: $E_+ = E_{\\text{free}} - U$.\n - $|\\psi_-(x)|^2 \\propto \\sin^2(\\pi x/a)$ piles electron density **in\
      \ between the ions** ($x = \\pm\\frac{a}{2}, \\pm\\frac{3a}{2}, \\dots$), raising its energy by $+U$: $E_- = E_{\\text{free}}\
      \ + U$.\n - Thus, interaction with the periodic ion potential $U$ opens a **band gap** at $k = \\pm\\frac{\\pi}{a}$:\n\
      \ $$\\boxed{E_{\\text{gap}} = E_- - E_+ = (E_{\\text{free}} + U) - (E_{\\text{free}} - U) = 2U}$$\n - Near the diffraction\
      \ condition ($k \\to \\pm\\pi/a$), the band dispersion $E(k)$ curves parabolically ($\\frac{dE}{dk} = 0$ at the band\
      \ edges), so electrons behave as \"free\" quasiparticles with a modified **effective mass** $m^* = \\hbar^2\\left(\\\
      frac{d^2E}{dk^2}\\right)^{-1}$!\n\n### Metallic vs. Semiconducting Band Structures: $\\text{Cu}$ vs. $\\text{Si}$\n\
      - In **Copper ($\\text{Cu}$)**, a wide, nearly-free-electron $4s$ band is intersected at intermediate energies ($-2\\\
      text{ to }-5\\text{ eV}$ below $E_F$) by narrow, atomic-like $3d$ bands, leading to **$s\\text{–}d$ hybridization**\
      \ and **necking of the Fermi surface along $\\langle 111\\rangle$ ($L$-point) directions** (which drives **Hume-Rothery\
      \ alloy phase stabilization**!).\n\n### Quantitative Successes & Failures of Kohn–Sham DFT\n1. **Structural & Elastic\
      \ Properties:** Lattice parameters are typically accurate to **within $1\\text{–}3\\%$** (often better than $1\\%$),\
      \ and **bulk moduli / elastic constants** are within **$\\sim 10\\%$**.\n2. **Vibrational / Phonon Properties:** Atomic\
      \ **forces** ($\\mathbf{F} = -\\nabla E$, 1st derivatives) are accurate to **better than $10\\%$** (similar to elastic\
      \ constants). Because **vibrational phonon frequencies** $\\omega \\propto \\sqrt{k}$ are proportional to the square\
      \ root of the 2nd derivative of energy ($\\frac{\\delta\\omega}{\\omega} \\approx \\frac{1}{2}\\frac{\\delta k}{k}$),\
      \ phonon frequencies have about **$1/2$ the relative error of forces — i.e., $\\sim 5\\%$ accuracy** (vastly outperforming\
      \ empirical EAM potentials in $\\text{Ni}$)!\n3. **Point Defect Energies:** Vacancy and interstitial formation energies\
      \ in metals are highly accurate (**within $\\sim 0.1\\text{ eV}$**), but for covalent **self-interstitial defects in\
      \ Silicon**, DFT-LDA/GGA underestimates the formation energy by **$\\sim 1\\text{ eV}$** (predicting $3\\text{–}3.5\\\
      text{ eV}$ vs. $4.5\\text{ eV}$ from experiment and QMC).\n4. **The DFT Band-Gap Problem:** Because Kohn–Sham DFT is\
      \ strictly a **ground-state** theory and local/semi-local functionals (LDA/GGA) suffer from residual self-interaction\
      \ error and lack the exact derivative discontinuity when adding an electron, **LDA and GGA underestimate semiconductor\
      \ band gaps by $20\\text{–}50\\%$**!\n - In narrow-gap semiconductors like **$\\text{Ge}$** ($E_{\\text{exp}} = 0.74\\\
      text{ eV}$) and **$\\text{InAs}$** ($E_{\\text{exp}} = 0.41\\text{ eV}$, where LDA gives $-0.42\\text{ eV}$ and GGA-PBE\
      \ gives $-0.13\\text{ eV}$), **LDA and GGA falsely predict a metallic ground state (negative/zero band gap)!**\n - **Solutions:**\
      \ **Hybrid functionals** (B3LYP, HSE06 gives $0.39\\text{ eV}$ for $\\text{InAs}$, $\\sim 10\\%$ accuracy) or many-body\
      \ excited-state theories like the **$GW$ approximation** and **Quantum Monte Carlo (QMC)**."
  - id: concept_bloch_bandgap_and_dft
    type: concept_cell
    title: 'Interactive Explorer: Brillouin-Zone Band Gap Opening & The DFT Band-Gap Problem'
    description_markdown: Adjust the periodic crystal potential strength $U$ (in $\text{eV}$) to watch Bragg diffraction open
      a band gap $E_{\text{gap}} = 2U$ at the 1st Brillouin-zone boundary $k = \pm\pi/a$, or switch to the **DFT vs. $GW$
      Semiconductor Band-Gap Benchmark** (matching ).
    render_function: render_bloch_bandgap_and_dft
    layout: figure_left
    controls:
    - name: u_ev
      label: Periodic ion potential U (eV)
      kind: slider
      min: 0.0
      max: 1.5
      step: 0.1
      default: 0.65
    - name: view_mode
      label: Visualization Mode
      kind: dropdown
      default: brillouin_zone
      options:
      - label: 1D Brillouin Zone Dispersion E(k) & Gap 2U
        value: brillouin_zone
      - label: 'DFT Band-Gap Problem: LDA vs. GW vs. Experiment'
        value: dft_bandgap_comparison
    takeaway_markdown: '**Key Takeaway:** At $k = \pm\pi/a$, Bragg reflection converts traveling waves into standing waves
      $\psi_+ \propto \cos(\pi x/a)$ (density on ions, energy $E_{\text{free}} - U$) and $\psi_- \propto \sin(\pi x/a)$ (density
      between ions, energy $E_{\text{free}} + U$), opening $E_{\text{gap}} = 2U$. In Kohn–Sham DFT, LDA/GGA underestimates
      $E_{\text{gap}}$ by $20\text{–}50\%$, turning narrow-gap semiconductors ($\text{InAs}, \text{Ge}$) into false metals
      unless hybrid functionals (HSE) or $GW$ corrections are applied.'
  - id: q39_bloch_theorem_and_brillouin_zone
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_bloch_band_structure_and_dft_failures
    prompt_markdown: what is **Bloch's Theorem** for an electron in a crystal with Bravais lattice translation vector $\mathbf{R}$,
      and how is the **First Brillouin Zone** geometrically defined?
    hint_markdown: Read the second and fifth bullet points.
    options:
    - id: a
      text: Bloch's theorem states that psi(r + R) = psi(r) * exp(i k. R) (or phi(r) = u_nk(r) * exp(i k. R) with periodic
        u_nk); the Brillouin zone is the Wigner-Seitz primitive cell of the reciprocal lattice.
    - id: b
      text: Bloch's theorem states that psi(r + R) = 0 for all lattice vectors R; the Brillouin zone is the real-space unit
        cell.
    - id: c
      text: Bloch's theorem applies only to amorphous glasses and liquids.
    - id: d
      text: The Brillouin zone is a sphere of radius 1 Bohr in real space.
    correct: a
    rationale_markdown: Because the crystal Hamiltonian commutes with lattice translations ($[\\hat{\\mathcal{H}}, \\hat{\\mathcal{T}}_{\\mathbf{R}}]
      = 0$), eigenstates satisfy $\\psi(\\mathbf{r}+\\mathbf{R}) = e^{i\\mathbf{k}\\cdot\\mathbf{R}}\\psi(\\mathbf{r})$. Wavevectors
      $\\mathbf{k}$ differing by a reciprocal lattice vector $\\mathbf{G}$ are equivalent, so all unique $\\mathbf{k}$ states
      lie inside the **Wigner–Seitz cell of the reciprocal lattice**, called the First Brillouin Zone.
  - id: q40_reciprocal_lattice_1d_zone_boundary
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by:
    - sec_bloch_band_structure_and_dft_failures
    - concept_bloch_bandgap_and_dft
    prompt_markdown: In a 1D crystal with real-space lattice spacing $a$, the fundamental reciprocal lattice vector has magnitude
      $\Delta k = G_1 = \frac{2\pi}{a}$. At what wavevectors $k$ do the boundaries of the **First Brillouin Zone** (where
      lowest-order $n=1$ Bragg diffraction occurs) lie?
    hint_markdown: Check the horizontal axis of the E(k) plot or the Bragg condition k = n*pi/a for n = +/- 1.
    options:
    - id: a
      text: k = -pi/a and k = +pi/a (so the total width of the 1st Brillouin zone is Delta k = 2*pi/a)
    - id: b
      text: k = 0 and k = +4*pi/a
    - id: c
      text: k = -a/pi and k = +a/pi
    - id: d
      text: k = -1/a and k = +1/a
    correct: a
    rationale_markdown: The Wigner–Seitz cell around $k = 0$ extends halfway to the nearest reciprocal lattice points $G =
      \\pm \\frac{2\\pi}{a}$, placing the 1st Brillouin-zone boundaries at $k = \\pm \\frac{\\pi}{a}$ (where $n=1$ Bragg diffraction
      $\\lambda = 2a$ occurs).
  - id: q41_standing_waves_origin_of_gap
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_bloch_band_structure_and_dft_failures
    - concept_bloch_bandgap_and_dft
    prompt_markdown: 'At the Brillouin-zone boundary $k = \frac{\pi}{a}$, the incident wave $\psi_i = e^{i\pi x/a}$ and reflected
      wave $\psi_r = e^{-i\pi x/a}$ superpose to form two standing waves: $\psi_+(x) = 2\cos(\pi x/a)$ and $\psi_-(x) = 2i\sin(\pi
      x/a)$. Why do these two states have different energies $E = E_{\text{free}} \mp U$ in the presence of the periodic ion
      potential $U$?'
    hint_markdown: Compare where |cos(pi*x/a)|^2 peaks (at x = 0, a, 2a on the positive ions) versus where |sin(pi*x/a)|^2
      peaks (at x = a/2, 3a/2 between the ions).
    options:
    - id: a
      text: psi_+(x) = 2*cos(pi*x/a) concentrates electron density on the attractive ion cores (lowering energy to E_free
        - U), whereas psi_-(x) = 2i*sin(pi*x/a) concentrates electron density between the ions (raising energy to E_free +
        U), opening a band gap E_gap = 2U.
    - id: b
      text: psi_+(x) and psi_-(x) have different free-electron kinetic energies hbar^2 k^2 / (2m).
    - id: c
      text: psi_+(x) travels to the right at speed v_F while psi_-(x) travels to the left at speed 2*v_F.
    - id: d
      text: Only psi_+(x) satisfies Bloch's theorem.
    correct: a
    rationale_markdown: Both standing waves have the same kinetic energy $E_{\\text{free}} = \\frac{\\hbar^2(\\pi/a)^2}{2m}$
      and zero group velocity (no traveling wave solution). However, $|\\psi_+|^2 \\propto \\cos^2(\\pi x/a)$ peaks at the
      lattice sites $x = m a$ (on the positive ions), while $|\\psi_-|^2 \\propto \\sin^2(\\pi x/a)$ has nodes at the ions
      and peaks between them, splitting their potential energies by $(E_{\\text{free}} + U) - (E_{\\text{free}} - U) = 2U$.
  - id: q42_bragg_bandgap_numeric
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by:
    - sec_bloch_band_structure_and_dft_failures
    - concept_bloch_bandgap_and_dft
    prompt_markdown: In the nearly-free-electron diffraction model, if the free-electron kinetic energy at $k = \pi/a$ is
      $E_{\text{free}} = 4.20\text{ eV}$ and the periodic ion potential perturbation has amplitude $U = 0.65\text{ eV}$, what
      is the magnitude of the resulting energy band gap $E_{\text{gap}} = E_- - E_+$ at $k = \pi/a$ (in $\text{eV}$)?
    hint_markdown: Use E_gap = (E_free + U) - (E_free - U) = 2 * U.
    correct:
      value: 1.3
      tolerance: 0.02
    rationale_markdown: At the zone boundary $k = \\pi/a$, the lower band edge is at $E_+ = E_{\\text{free}} - U = 3.55\\text{
      eV}$ and the upper band edge is at $E_- = E_{\\text{free}} + U = 4.85\\text{ eV}$, so the band gap is $E_{\\text{gap}}
      = 2U = 2 \\times 0.65 = 1.30\\text{ eV}$.
  - id: q43_copper_band_structure_features
    type: problem
    question_type: multi_select
    difficulty: medium
    taught_by: sec_bloch_band_structure_and_dft_failures
    prompt_markdown: In the Wien2k DFT band structure and Fermi surface of **Copper ($\text{Cu}$)**, which of the following
      physical features are observed? *(Select all that apply.)*
    hint_markdown: Read the four bullet points and inspect the yellow shaded band region.
    options:
    - id: a
      text: A wide, nearly-free-electron 4s band dominates at low (-10 to -5 eV) and high (> -1 eV) energies.
    - id: b
      text: Strong hybridization occurs between the nearly-free 4s band and narrow, atomic-like 3d bands at intermediate energies
        (-5 to -2 eV, yellow shaded region).
    - id: c
      text: The Fermi surface develops 'necks' touching the Brillouin-zone boundary along the [111] (L-point) directions,
        which drives Hume-Rothery alloy phase stabilization.
    - id: d
      text: Copper has a 5.0 eV insulating band gap at the Fermi level E_F = 0.
    correct:
    - a
    - b
    - c
    rationale_markdown: 'highlights all three classic features of noble-metal ($\text{Cu}$) electronic structure: a wide parabolic
      $4s$ band, flat $3d$ bands hybridizing with $4s$ from $-2$ to $-5\text{ eV}$, and $\langle 111\rangle$ Fermi-surface
      necking at the $L$ zone boundary (Hume-Rothery stabilization). Because the $4s$ band crosses $E_F = 0$, $\text{Cu}$
      is a metal with no band gap at $E_F$.'
  - id: q44_dft_structural_and_phonon_accuracy
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_bloch_band_structure_and_dft_failures
    prompt_markdown: standard Kohn–Sham DFT predicts atomic **forces** (1st derivatives of energy) and **elastic constants
      / bulk moduli** (2nd derivatives) to within $\sim 10\%$. Why are DFT **vibrational phonon frequencies** typically accurate
      to **$\sim 5\%$** (about $1/2$ the relative error of the forces/force constants)?
    hint_markdown: 'Recall that harmonic vibrational frequency scales as the square root of the 2nd-derivative force constant:
      omega = sqrt(k / M). Propagate a 10% relative error in k through the square root!'
    options:
    - id: a
      text: Because vibrational frequencies omega = sqrt(k / M) scale as the square root of the 2nd-derivative force constants
        k, so a ~10% relative error in k (and forces) produces a relative frequency error delta_omega / omega approx (1/2)
        * (delta_k / k) approx 5%.
    - id: b
      text: Because phonon frequencies depend only on nuclear masses and not on the interatomic potential energy.
    - id: c
      text: Because DFT uses empirical EAM force constants to compute phonon dispersions.
    - id: d
      text: Because the 2nd derivative of any DFT energy functional is zero.
    correct: a
    rationale_markdown: Since $\\omega \\propto k^{1/2}$, logarithmic differentiation gives $\\frac{\\delta\\omega}{\\omega}
      = \\frac{1}{2}\\frac{\\delta k}{k}$. Thus a $\\sim 10\\%$ error in the interatomic force constants $k$ (and forces)
      translates into only a $\\sim 5\\%$ error in vibrational frequencies $\\omega$ (demonstrated by the excellent agreement
      of PW91 DFT with neutron diffraction for $\\text{fcc Ni}$).
  - id: q45_dft_defect_energies_silicon_interstitial
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_bloch_band_structure_and_dft_failures
    prompt_markdown: how accurate is standard DFT (LDA/GGA) for point defect formation energies in **metals** versus **self-interstitial
      defects in Silicon**?
    hint_markdown: Read the two bullet points under 'Defect energies'.
    options:
    - id: a
      text: In metals, vacancy and interstitial formation energies are highly accurate (within ~0.1 eV); however, for self-interstitials
        in silicon, DFT is too low by ~1 eV (predicting 3-3.5 eV instead of the 4.5 eV from experiment and QMC).
    - id: b
      text: In metals, DFT defect energies are off by 10 eV, whereas in silicon they are exact to 0.001 eV.
    - id: c
      text: DFT always predicts negative formation energies for all vacancies in metals.
    - id: d
      text: Quantum Monte Carlo (QMC) cannot be applied to point defects in silicon.
    correct: a
    rationale_markdown: notes that while metallic vacancy and interstitial energies are typically accurate within $\\sim 0.1\\text{
      eV}$, silicon self-interstitials involve localized mid-gap/strained covalent states where DFT-LDA/GGA underestimates
      the formation energy by $\\sim 1\\text{ eV}$ ($3\\text{–}3.5\\text{ eV}$ vs. $4.5\\text{ eV}$ in experiment and QMC).
  - id: q46_dft_bandgap_problem_inas_and_ge
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_bloch_band_structure_and_dft_failures
    - concept_bloch_bandgap_and_dft
    prompt_markdown: As demonstrated for **$\text{InAs}$** (experimental band gap $0.41\text{ eV}$) and **$\text{Ge}$** (experimental
      band gap $0.74\text{ eV}$), what is the **"band-gap problem" of DFT**, and which computational methods resolve it?
    hint_markdown: Compare the LDA (-0.42 eV), PBE (-0.13 eV), B3LYP/HSE (0.39-0.54 eV), and GW band gaps.
    options:
    - id: a
      text: Standard Kohn-Sham LDA and GGA fail for excited states and underestimate semiconductor band gaps by 20-50%, falsely
        predicting narrow-gap semiconductors like InAs and Ge to be metallic (zero/negative gap); Hybrid functionals (B3LYP,
        HSE) and the GW approximation / QMC restore accurate band gaps.
    - id: b
      text: LDA and GGA overestimate the band gap of InAs as 4.1 eV instead of 0.41 eV.
    - id: c
      text: The GW approximation predicts all semiconductors and insulators (including Diamond and MgO) to be metals.
    - id: d
      text: Adding a larger plane-wave cutoff E_cut in LDA fixes the InAs band gap to 0.41 eV.
    correct: a
    rationale_markdown: Because Kohn–Sham eigenvalues are ground-state auxiliary quantities lacking the exchange-correlation
      derivative discontinuity, LDA and GGA underestimate band gaps by $20\text{–}50\\%$ across all semiconductors and insulators,
      inverting the $\\Gamma$-point conduction and valence bands in $\\text{InAs}$ ($-0.42\\text{ eV}$ in LDA, $-0.13\\text{
      eV}$ in PBE) and $\\text{Ge}$ to produce a false metallic ground state. Hybrid functionals (HSE/B3LYP) and the $GW$
      quasiparticle approximation accurately open the gap.
