  takeaway_markdown: '**Key Takeaway:** Because DPD forces depend only on relative velocities $\mathbf{v}_{ij}$ and obey $\mathbf{F}_{ij}
    = -\mathbf{F}_{ji}$, DPD is Galilean invariant and reproduces the exact parabolic Navier–Stokes velocity profile. A global
    Langevin thermostat destroys local momentum conservation and flattens the parabolic profile into unphysical Brinkman plug
    flow.'
- id: q28_dpd_momentum_conservation_reason
  type: problem
  question_type: single_select
  difficulty: easy
  taught_by:
  - sec_dpd_and_hydrodynamics
  - concept_langevin_vs_dpd
  prompt_markdown: Why does Dissipative Particle Dynamics (DPD) rigorously conserve both total linear momentum and total angular
    momentum, unlike a standard Langevin thermostat?
  hint_markdown: Look at the symmetry $\mathbf{F}_{ij} = -\mathbf{F}_{ji}$ and the direction $\hat{\mathbf{r}}_{ij}$ of the
    DPD forces.
  options:
  - id: a
    text: Because DPD applies equal-and-opposite friction and random forces (F_ij = -F_ji) to each interacting pair along
      their central line of centers r̂_ij, depending only on relative velocities v_ij.
  - id: b
    text: Because DPD sets both the friction coefficient and the random force to zero whenever particles move.
  - id: c
    text: Because DPD rescales all particle velocities globally every 100 steps to zero out the total momentum.
  - id: d
    text: Because DPD solves the Schrödinger equation for explicit solvent electrons.
  correct: a
  rationale_markdown: In DPD, every force component (conservative, dissipative, and random) acts pairwise with $\mathbf{F}_{ij}
    = -\mathbf{F}_{ji}$ (conserving linear momentum locally) and points along the central unit vector $\hat{\mathbf{r}}_{ij}$
    (so $\mathbf{r}_{ij}\times\mathbf{F}_{ij} = \mathbf{0}$, conserving angular momentum).
- id: q29_langevin_hydrodynamic_screening_artifact
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by:
  - sec_dpd_and_hydrodynamics
  - concept_langevin_vs_dpd
  prompt_markdown: What unphysical hydrodynamic artifact occurs if you use a global Langevin thermostat ($-\zeta\mathbf{v}_i$)
    to simulate pressure-driven Poiseuille flow or vortex relaxation in a fluid?
  hint_markdown: Inspect how damping absolute velocity $\mathbf{v}_i$ affects Galilean invariance and the parabolic Poiseuille
    profile in the interactive explorer.
  options:
  - id: a
    text: The drag -ζv_i acts on absolute laboratory velocity, breaking Galilean invariance, screening out hydrodynamic momentum
      fluxes, and flattening the parabolic Navier–Stokes profile into plug flow.
  - id: b
    text: The fluid viscosity drops to zero and the flow accelerates to infinite velocity.
  - id: c
    text: Total angular momentum increases exponentially while linear momentum remains exactly conserved.
  - id: d
    text: The fluid spontaneously crystallizes into a body-centered cubic solid at any temperature.
  correct: a
  rationale_markdown: Damping absolute velocity $-\zeta\mathbf{v}_i$ violates Galilean invariance and acts like an artificial
    porous-medium drag throughout the bulk fluid, screening momentum transport and destroying the parabolic Navier–Stokes
    velocity profile.
- id: q30_dpd_weight_function_fdt
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by: sec_dpd_and_hydrodynamics
  prompt_markdown: In DPD, the pairwise dissipative force has mean $\langle \zeta_{ij} \rangle = -\gamma w^D(r_{ij})(\mathbf{v}_{ij}\cdot\hat{\mathbf{r}}_{ij})$
    and the random force has variance $\langle \zeta_{ij}^2 \rangle = \sigma^2 [w^R(r_{ij})]^2$. What relation between the
    spatial weight functions $w^D(r)$ and $w^R(r)$ and amplitudes $\gamma, \sigma$ is required so that the steady state is
    the exact canonical Boltzmann distribution?
  hint_markdown: Check the Español–Warren DPD fluctuation-dissipation condition on the 'Dissipative Particle Dynamics (DPD)'
    slide.
  options:
  - id: a
    text: w^D(r) = [w^R(r)]² and σ² = 2 γ k_B T
  - id: b
    text: w^D(r) = w^R(r) and σ = γ k_B T
  - id: c
    text: w^D(r) = 1 / w^R(r) and σ² = γ / (2 k_B T)
  - id: d
    text: w^D(r) = 0 and w^R(r) = (1 - r/r_c)²
  correct: a
  rationale_markdown: For the Fokker–Planck operator of DPD to vanish on the canonical distribution $e^{-\beta H}$, each pair
    distance $r_{ij}$ must independently satisfy the fluctuation-dissipation balance $\sigma^2 [w^R(r)]^2 = 2 \gamma k_B T
    w^D(r)$, which gives $w^D(r) = [w^R(r)]^2$ and $\sigma^2 = 2\gamma k_B T$.
- id: q31_dpd_noise_amplitude_numeric
  type: problem
  question_type: numeric
  difficulty: medium
  taught_by: sec_dpd_and_hydrodynamics
  prompt_markdown: A DPD simulation is parameterized with pairwise friction coefficient $\gamma = 4.5$ and thermal energy
    $k_B T = 1.0$ (in reduced DPD units). According to the DPD fluctuation–dissipation theorem $\sigma^2 = 2 \gamma k_B T$,
    what must the random force noise amplitude $\sigma$ be set to?
  hint_markdown: Compute $\sigma = \sqrt{2 \gamma k_B T} = \sqrt{2 \times 4.5 \times 1.0}$.
  correct:
    value: 3.0
    tolerance: 0.02
  rationale_markdown: From $\sigma^2 = 2\gamma k_B T = 2 \times 4.5 \times 1.0 = 9.0$, the required random force amplitude
    is $\sigma = \sqrt{9.0} = 3.0$.
- id: q32_dpd_cutoff_weight_numeric
  type: problem
  question_type: numeric
  difficulty: easy
  taught_by: sec_dpd_and_hydrodynamics
  prompt_markdown: Using the randomized force cutoff function $\omega(r) = (1 - r/r_c)^2$ for $r < r_c$  with $r_c = 1.0$
    and $k_B T = 1.5$, calculate the variance $\langle \zeta^2 \rangle = 2 k_B T \omega^2(r_{ij})$ for a pair of DPD beads
    separated by $r_{ij} = 0.50$.
  hint_markdown: First compute $\omega(0.50) = (1 - 0.50)^2 = 0.25$, then square it to get $\omega^2(0.50) = 0.0625$, and
    multiply by $2 k_B T = 3.0$.
  correct:
    value: 0.1875
    tolerance: 0.002
  rationale_markdown: At $r_{ij} = 0.50 r_c$, $\omega(r_{ij}) = (1 - 0.50)^2 = 0.25$, so $\omega^2(r_{ij}) = (0.25)^2 = 0.0625$.
    Thus $\langle \zeta^2 \rangle = 2 k_B T \omega^2(r_{ij}) = 2(1.5)(0.0625) = 0.1875$.
- id: q33_dpd_verlet_self_consistent
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by: sec_dpd_and_hydrodynamics
  prompt_markdown: Why can't the standard explicit Verlet leapfrog step $\mathbf{v}(t + \Delta t/2) = \mathbf{v}(t - \Delta
    t/2) + \Delta t\,\mathbf{f}(t)/m$ be evaluated in a single direct pass in Dissipative Particle Dynamics?
  hint_markdown: Check what $\mathbf{f}(t)$ depends on in DPD.
  options:
  - id: a
    text: Because the dissipative force f(t) depends on the instantaneous velocity v(t) = ½[v(t + Δt/2) + v(t - Δt/2)], so
      v(t + Δt/2) appears implicitly on both sides and must be solved self-consistently.
  - id: b
    text: Because the conservative force f^C(r) depends on the third time derivative of position (jerk).
  - id: c
    text: Because the particle masses m_i change randomly at every half-step.
  - id: d
    text: Because Verlet integration can only be applied to 1D lattice gases.
  correct: a
  rationale_markdown: In DPD, $\mathbf{f}(t)$ contains the velocity-dependent dissipative force $\mathbf{F}_{ij}^D(\mathbf{v}_{ij}(t))$.
    Since $\mathbf{v}(t) = \frac{1}{2}[\mathbf{v}(t + \Delta t/2) + \mathbf{v}(t - \Delta t/2)]$, the unknown $\mathbf{v}(t
    + \Delta t/2)$ enters both sides of the Verlet equation and must be solved self-consistently (which also restores time-reversibility
    of the deterministic step).
- id: q34_dpd_pair_dissipative_force_sign
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by: sec_dpd_and_hydrodynamics
  prompt_markdown: In DPD, suppose two particles $i$ and $j$ within $r_{ij} < r_c$ are moving directly *toward* each other
    along their line of centers, so that $(\mathbf{v}_i - \mathbf{v}_j)\cdot(\mathbf{r}_i - \mathbf{r}_j) < 0$ (i.e., $\mathbf{v}_{ij}\cdot\hat{\mathbf{r}}_{ij}
    < 0$). In what direction does the dissipative force $\mathbf{F}_{ij}^D = -\gamma w^D(r_{ij})(\mathbf{v}_{ij}\cdot\hat{\mathbf{r}}_{ij})\hat{\mathbf{r}}_{ij}$
    act on particle $i$?
  hint_markdown: Check the sign of $-\gamma w^D(r_{ij})(\mathbf{v}_{ij}\cdot\hat{\mathbf{r}}_{ij})$ when $\mathbf{v}_{ij}\cdot\hat{\mathbf{r}}_{ij}
    < 0$.
  options:
  - id: a
    text: Along +r̂_ij (repulsive, pushing particle i away from particle j to oppose their relative approach).
  - id: b
    text: Along -r̂_ij (attractive, accelerating particle i toward particle j).
  - id: c
    text: Perpendicular to r̂_ij, causing the pair to rotate around their center of mass.
  - id: d
    text: The dissipative force is identically zero whenever two particles move toward each other.
  correct: a
  rationale_markdown: Since $\mathbf{v}_{ij}\cdot\hat{\mathbf{r}}_{ij} < 0$ when the particles approach each other, $-\gamma
    w^D(r_{ij})(\mathbf{v}_{ij}\cdot\hat{\mathbf{r}}_{ij}) > 0$, so $\mathbf{F}_{ij}^D$ points along $+\hat{\mathbf{r}}_{ij}
    = (\mathbf{r}_i - \mathbf{r}_j)/r_{ij}$, opposing their relative approach.
- id: q35_dpd_pure_rotation_dissipation
  type: problem
  question_type: numeric
  difficulty: medium
  taught_by: sec_dpd_and_hydrodynamics
  prompt_markdown: Two DPD particles $i$ and $j$ separated by $r_{ij} = 0.6 r_c$ undergo rigid-body rotation around their
    midpoint so that their relative velocity $\mathbf{v}_{ij} = \mathbf{v}_i - \mathbf{v}_j$ (with magnitude $|\mathbf{v}_{ij}|
    = 5.0$) is strictly perpendicular to the interparticle unit vector $\hat{\mathbf{r}}_{ij}$ ($\mathbf{v}_{ij} \perp \hat{\mathbf{r}}_{ij}$).
    What is the magnitude $|\mathbf{F}_{ij}^D|$ of the DPD dissipative force between them?
  hint_markdown: Evaluate the dot product $\mathbf{v}_{ij} \cdot \hat{\mathbf{r}}_{ij}$ when $\mathbf{v}_{ij} \perp \hat{\mathbf{r}}_{ij}$.
  correct:
    value: 0.0
    tolerance: 0.001
  rationale_markdown: Because the central DPD dissipative force $\mathbf{F}_{ij}^D = -\gamma w^D(r_{ij})(\mathbf{v}_{ij}\cdot\hat{\mathbf{r}}_{ij})\hat{\mathbf{r}}_{ij}$
    depends only on the radial projection $\mathbf{v}_{ij}\cdot\hat{\mathbf{r}}_{ij}$, purely tangential relative motion ($\mathbf{v}_{ij}\cdot\hat{\mathbf{r}}_{ij}
    = 0$) experiences zero pair dissipation ($|\mathbf{F}_{ij}^D| = 0$), which is essential for conserving angular momentum
    during rigid rotation!
- id: sec_synthesis_comparison
  type: markdown_section
  title: '7. Synthesis: Choosing the Right Mesoscale Dynamics Method'
  body_markdown: '### Summary Comparison Across Dynamics & Sampling Methods


    | Method | Momentum $\mathbf{p}_i$ Retained? | Local Momentum Conserved? | Hydrodynamics Captured? | Scaling per Step
    | Primary Use Case |

    |:--- |:---: |:---: |:---: |:---: |:--- |

    | **All-Atom MD** | Yes | Yes | Yes (explicit solvent) | $\mathcal{O}(N_{\text{all}})$ | Femtosecond–nanosecond atomic
    trajectories |

    | **Langevin Dynamics** | Yes | **No** ($-\zeta\mathbf{p}_i$ global drag) | **No** (screened) | $\mathcal{O}(N_{\text{solute}})$
    | NVT thermostatting & single-molecule inertial barrier crossing |

    | **Free-Draining Brownian** | No (overdamped) | **No** | **No** | $\mathcal{O}(N_{\text{solute}})$ | Overdamped diffusion
    where hydrodynamics is negligible |

    | **Brownian + Oseen** | No (overdamped) | Implicit via $\underline{\mathbf{D}}_{ij}$ | Yes (linear $1/r$ Stokes) | **$\mathcal{O}(N_{\text{solute}}^3)$**
    | Dilute polymers/colloids needing far-field Stokes coupling |

    | **Hybrid Smart MC** | No | No | Optional | $\mathcal{O}(N_{\text{solute}})$ | Exact canonical Boltzmann sampling at
    arbitrary $\tau$ |

    | **DPD** | Yes | **Yes** ($\mathbf{F}_{ij} = -\mathbf{F}_{ji}$) | **Yes** (Navier–Stokes) | $\mathcal{O}(N_{\text{beads}})$
    | Mesoscale complex fluids, shear flow, vesicles, block copolymers |'
- id: q36_method_selection_hydrodynamic_shear
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by: sec_synthesis_comparison
  prompt_markdown: You want to simulate $N = 10^5$ coarse-grained polymer beads undergoing shear flow in a microchannel where
    preserving Navier–Stokes hydrodynamics is critical, and an $\mathcal{O}(N^3)$ Cholesky decomposition is computationally
    prohibitive. Which method from this lesson is best suited?
  hint_markdown: Compare the scaling and momentum conservation of Oseen Brownian Dynamics, Langevin Dynamics, and DPD.
  options:
  - id: a
    text: Dissipative Particle Dynamics (DPD), which conserves local momentum via short-range O(N) pairwise forces and recovers
      Navier–Stokes hydrodynamics without explicit solvent atoms.
  - id: b
    text: Brownian Dynamics with dense Oseen tensor Cholesky factorization at every step.
  - id: c
    text: Global Langevin Dynamics with a large friction coefficient ζ to damp absolute velocities.
  - id: d
    text: Metropolis Monte Carlo with non-local cluster flips.
  correct: a
  rationale_markdown: DPD uses short-ranged ($r < r_c$) pairwise forces that scale as $\mathcal{O}(N)$ with neighbor lists
    while strictly conserving local linear and angular momentum, recovering Navier–Stokes hydrodynamics without the $\mathcal{O}(N^3)$
    cost of Oseen Cholesky factorization.
- id: q37_generalized_trotter_three_operators
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by: sec_trotter_and_smart_mc
  prompt_markdown: According to the Generalized Trotter Formula for three operators $\hat{A}, \hat{B}, \hat{C}$ that are each
    bounded below, how can the Boltzmann/propagator operator $\hat{\rho} = e^{-\beta(\hat{A} + \hat{B} + \hat{C})}$ be written
    in terms of $\tau = \beta/n$?
  hint_markdown: Recall 'Generalized Trotter Formula'.
  options:
  - id: a
    text: ρ̂ = lim_{n→∞} [ e^(-τÂ) e^(-τB̂) e^(-τĈ) ]^n
  - id: b
    text: ρ̂ = e^(-βÂ) + e^(-βB̂) + e^(-βĈ) for any finite β
  - id: c
    text: ρ̂ = lim_{n→∞} [ e^(-βÂ) + e^(-βB̂) + e^(-βĈ) ] / n
  - id: d
    text: Trotter's theorem only holds for at most two operators and fails for three operators.
  correct: a
  rationale_markdown: 'The generalized Trotter product formula holds for any finite number of operators bounded below: $e^{-\beta(\hat{A}+\hat{B}+\hat{C})}
    = \lim_{n\to\infty}[e^{-\tau\hat{A}}e^{-\tau\hat{B}}e^{-\tau\hat{C}}]^n$ with $\tau = \beta/n$.'
- id: q38_cholesky_operation_ratio_numeric
  type: problem
  question_type: numeric
  difficulty: easy
  taught_by: sec_hydrodynamic_interactions_oseen
  prompt_markdown: Because Cholesky decomposition of the $3N \times 3N$ Oseen diffusion tensor scales as $\mathcal{O}(N^3)$,
    by what factor does the Cholesky CPU cost per step increase if the number of colloidal particles $N$ is quadrupled from
    $N = 250$ to $N = 1{,}000$?
  hint_markdown: Compute $(1000 / 250)^3 = 4^3$.
  correct:
    value: 64.0
    tolerance: 0.1
  rationale_markdown: Since Cholesky factorization scales as $N^3$, increasing $N$ by a factor of $4$ increases the factorization
    cost by $4^3 = 64$.
- id: q39_generalized_langevin_memory
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by: sec_langevin_dynamics_and_fdt
  prompt_markdown: When a solute particle is comparable in size/timescale to the solvent molecules so that the solvent does
    not relax instantaneously, the white-noise delta correlation $\langle p_{\text{solvent}}(t)p_{\text{solvent}}(t') \rangle
    = 2mk_B T\zeta\delta(t-t')$ is replaced by a time-dependent memory function $\langle p_{\text{solvent}}(t)p_{\text{solvent}}(t')
    \rangle = C(t - t')$. What physical feature does this non-Markovian correlation represent?
  hint_markdown: Think about time-delayed feedback from the surrounding solvent.
  options:
  - id: a
    text: Time-delayed solvent memory effects (viscoelastic/hydrodynamic history where past motion of the solute continues
      to exert correlated forces at later times).
  - id: b
    text: A breakdown of energy conservation that heats the system to infinite temperature.
  - id: c
    text: Instantaneous quantum tunneling of the heavy solute across the simulation box.
  - id: d
    text: Elimination of all conservative interatomic forces F(r).
  correct: a
  rationale_markdown: When solvent relaxation is not instantaneous relative to solute motion, the random solvent force has
    finite correlation time $\langle p_{\text{solvent}}(t)p_{\text{solvent}}(t') \rangle = C(t-t')$, paired by the second
    fluctuation-dissipation theorem with a time-delayed friction memory kernel.
- id: q40_overall_method_properties_multiselect
  type: problem
  question_type: multi_select
  difficulty: hard
  taught_by:
  - sec_smoluchowski_and_moments
  - sec_trotter_and_smart_mc
  - sec_dpd_and_hydrodynamics
  prompt_markdown: Which of the following statements accurately describe Brownian Dynamics, Smart Monte Carlo, Langevin Dynamics,
    and Dissipative Particle Dynamics? *(Select all that apply.)*
  hint_markdown: Verify each statement against the Smoluchowski equation, Smart MC acceptance, Oseen Cholesky scaling, and
    DPD conservation laws.
  options:
  - id: a
    text: The zero-flux stationary solution of the Smoluchowski equation is strictly the canonical Boltzmann distribution
      ρ_eq(R) ∝ exp(-βV(R)).
  - id: b
    text: In Hybrid Brownian / Smart MC, enforcing Metropolis rejections guarantees exact canonical static averages for any
      step size τ, while accurate dynamics requires an acceptance ratio near 1 (~99%).
  - id: c
    text: In DPD, pairwise random and dissipative forces act along the central vector r̂_ij with F_ij = -F_ji, conserving
      both linear and angular momentum.
  - id: d
    text: A global Langevin thermostat strictly conserves local fluid momentum and leaves parabolic Poiseuille channel flow
      completely unaltered at high ζ.
  correct:
  - a
  - b
  - c
  rationale_markdown: 'Statements (a), (b), and (c) are foundational principles of Smoluchowski dynamics, Smart MC, and DPD.
    Statement (d) is false: a global Langevin thermostat damps absolute velocities ($-\zeta\mathbf{v}_i$), destroying local
    momentum conservation and screening out Poiseuille flow.'
