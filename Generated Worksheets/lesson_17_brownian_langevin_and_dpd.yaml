- id: q11_trotter_splitting_purpose
  type: problem
  question_type: single_select
  difficulty: easy
  taught_by:
  - sec_trotter_and_smart_mc
  - concept_smoluchowski_trotter
  prompt_markdown: Why do we need Trotter's formula $e^{(\hat{A}+\hat{B})t} = \lim_{n\to\infty}[e^{(t/n)\hat{A}}e^{(t/n)\hat{B}}]^n$
    to construct the short-time propagator for Brownian dynamics in an external potential $V(\mathbf{r})$?
  hint_markdown: Consider whether the diffusion operator $\hat{A} = D\nabla^2$ and the position-dependent drift operator $\hat{B}
    = -\beta D\nabla\cdot(\mathbf{F}(\mathbf{r})\,\cdot)$ commute.
  options:
  - id: a
    text: Because the diffusion operator A = D∇² and the position-dependent force-drift operator B do not commute ([A, B]
      ≠ 0), so their exponentials can only be factored independently over infinitesimal time steps τ = t/n.
  - id: b
    text: Because the diffusion operator D∇² has no eigenfunctions in three dimensions.
  - id: c
    text: Because Trotter splitting converts a first-order differential equation in time into a fourth-order Runge–Kutta integrator.
  - id: d
    text: Because the drift operator alone already generates the exact Gaussian heat kernel without needing the Laplacian.
  correct: a
  rationale_markdown: When $\mathbf{F}(\mathbf{r})$ depends on position, $\hat{A} = D\nabla^2$ and $\hat{B} = -\beta D\nabla\cdot(\mathbf{F}(\mathbf{r})\,\cdot)$
    do not commute. Trotter's theorem allows us to evaluate the exact Green's function of each operator separately and alternate
    their effects over small time steps $\tau = t/n$.
- id: q12_diffusion_greens_function_eigenbasis
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by: sec_trotter_and_smart_mc
  prompt_markdown: When deriving the 3D free-diffusion Green's function $\langle \mathbf{r} | e^{-\tau \hat{T}} | \mathbf{r}'
    \rangle$ for $\hat{T} = -D\nabla^2$, we expand in plane-wave eigenfunctions $\phi_{\mathbf{k}}(\mathbf{r}) = \Omega^{-1/2}e^{-i\mathbf{k}\cdot\mathbf{r}}$.
    What is the eigenvalue of $\hat{T}$ acting on $\phi_{\mathbf{k}}(\mathbf{r})$, and what real-space propagator results
    after Fourier integration?
  hint_markdown: Apply $-D\nabla^2$ to $e^{-i\mathbf{k}\cdot\mathbf{r}}$ and take the Gaussian Fourier transform of $e^{-\tau
    D k^2}$.
  options:
  - id: a
    text: Eigenvalue Dk², yielding the Gaussian kernel (4πDτ)^(-3/2) exp(-|r - r'|² / (4Dτ)).
  - id: b
    text: Eigenvalue -Dk², yielding an oscillatory cosine kernel cos(|r - r'| / √(Dτ)).
  - id: c
    text: Eigenvalue D|k|, yielding a Lorentzian Cauchy kernel 1 / (|r - r'|² + (Dτ)²)².
  - id: d
    text: Eigenvalue D²k⁴, yielding a uniform hard-sphere step inside radius √(2Dτ).
  correct: a
  rationale_markdown: Since $\nabla^2 e^{-i\mathbf{k}\cdot\mathbf{r}} = -k^2 e^{-i\mathbf{k}\cdot\mathbf{r}}$, $\hat{T}\phi_{\mathbf{k}}
    = -D\nabla^2\phi_{\mathbf{k}} = Dk^2\phi_{\mathbf{k}}$. Completing the square in the 3D Gaussian Fourier integral $\int
    \frac{d^3k}{(2\pi)^3} e^{i\mathbf{k}\cdot(\mathbf{r}'-\mathbf{r}) - \tau D k^2}$ yields $(4\pi D\tau)^{-3/2} \exp(-|\mathbf{r}-\mathbf{r}'|^2/(4D\tau))$.
- id: q13_drift_operator_greens_function
  type: problem
  question_type: single_select
  difficulty: easy
  taught_by: sec_trotter_and_smart_mc
  prompt_markdown: For the 1D pure drift equation $\frac{\partial \rho(x, t)}{\partial t} = -v_d \frac{\partial \rho(x, t)}{\partial
    x}$ with constant drift velocity $v_d = \beta D F$ and initial profile $\rho(x, 0) = h(x)$, what is the exact time-evolved
    solution $\rho(x, t)$?
  hint_markdown: Check how a pure advection operator translates the initial shape $h(x)$.
  options:
  - id: a
    text: ρ(x, t) = h(x - v_d t), a rigid translation of the probability distribution in the direction of F without spreading.
  - id: b
    text: ρ(x, t) = h(x) exp(-v_d t), an exponential decay in amplitude at fixed position.
  - id: c
    text: ρ(x, t) = h(x + v_d t²), a uniformly accelerated wave packet.
  - id: d
    text: ρ(x, t) = (4π v_d t)^(-1/2) exp(-x² / (4 v_d t)), pure diffusive spreading with zero mean shift.
  correct: a
  rationale_markdown: The first-order advection equation $(\partial_t + v_d \partial_x)\rho = 0$ has characteristics $x -
    v_d t = \text{const}$, so $\rho(x, t) = h(x - v_d t)$ translates the distribution rigidly in the direction of the force
    $\mathbf{F}$.
- id: q14_smart_mc_linear_potential_acceptance
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by:
  - sec_trotter_and_smart_mc
  - concept_smoluchowski_trotter
  prompt_markdown: In Smart Monte Carlo (Hybrid Brownian MC), a trial displacement $\Delta \mathbf{r} = \tau\beta\mathbf{F}(\mathbf{r})
    + \boldsymbol{\delta}$ (with $\langle \delta^2 \rangle = 2\tau$, setting $D=1$) is proposed from the displaced Gaussian
    $T(\mathbf{r}\to\mathbf{r}')$. What is the Metropolis acceptance probability $A(\mathbf{r}\to\mathbf{r}')$ if the potential
    $V(\mathbf{r}) = V_0 - \mathbf{F}_0 \cdot \mathbf{r}$ is strictly linear (such as a uniform gravitational or electric
    field on a colloid)?
  hint_markdown: Substitute $\mathbf{F}(\mathbf{r}') = \mathbf{F}(\mathbf{r}) = \mathbf{F}_0$ and $V(\mathbf{r}') - V(\mathbf{r})
    = -\mathbf{F}_0 \cdot (\mathbf{r}' - \mathbf{r})$ into the Smart MC acceptance exponent.
  options:
  - id: a
    text: A(r → r') = 1 identically for every trial move and any step size τ.
  - id: b
    text: A(r → r') = exp(-β F₀² τ / 2), decaying exponentially with step size τ.
  - id: c
    text: A(r → r') = 0.50 because half of the Gaussian steps move uphill against F₀.
  - id: d
    text: A(r → r') = min(1, exp(-β[V(r') - V(r)])), identical to unshifted Metropolis MC.
  correct: a
  rationale_markdown: When the potential is linear, $\mathbf{F}(\mathbf{r}') = \mathbf{F}(\mathbf{r}) = \mathbf{F}_0$ and
    $V(\mathbf{r}') - V(\mathbf{r}) = -\mathbf{F}_0 \cdot (\mathbf{r}' - \mathbf{r})$. In the Smart MC exponent, $V(\mathbf{r}')
    - V(\mathbf{r}) + \frac{1}{2}(\mathbf{F}(\mathbf{r}')+\mathbf{F}(\mathbf{r}))\cdot(\mathbf{r}'-\mathbf{r}) = 0$, so $A(\mathbf{r}\to\mathbf{r}')
    = e^0 = 1$ exactly!
- id: q15_smart_mc_acceptance_exponent_numeric
  type: problem
  question_type: numeric
  difficulty: hard
  taught_by: sec_trotter_and_smart_mc
  prompt_markdown: 'Consider a 1D Smart Monte Carlo step with $\beta = 1$ and $\tau = D\Delta t = 0.20$ in a harmonic potential
    $V(x) = \frac{1}{2}k x^2$ with spring constant $k = 2.0$ (so $F(x) = -2x$). Starting from the minimum $x = 0.0$ (where
    $V(0.0) = 0.0$ and $F(0.0) = 0.0$), a trial move lands at $x'' = 1.0$ (where $V(1.0) = 1.0$ and $F(1.0) = -2.0$). Using
    the Smart MC acceptance formula:


    $$A(x \to x'') = \min\left(1,\; \exp\left\{ -\beta\left[ V(x'') - V(x) + \frac{F(x'') + F(x)}{2}\left( (x'' - x) + \frac{\tau\beta}{2}(F(x'')
    - F(x)) \right) \right] \right\}\right)$$


    calculate the acceptance probability $A(0.0 \to 1.0)$ (round to 3 decimal places).'
  hint_markdown: Substitute $V(x')-V(x) = +1.0$, $(F(x')+F(x))/2 = -1.0$, $x'-x = +1.0$, and $(\tau\beta/2)(F(x')-F(x)) =
    0.10 \times (-2.0 - 0.0) = -0.20$.
  correct:
    value: 0.819
    tolerance: 0.005
  rationale_markdown: 'Evaluating the bracket inside the exponent: $V(x'') - V(x) = 1.0 - 0.0 = 1.0$. The average force is
    $\frac{F(x'') + F(x)}{2} = \frac{-2.0 + 0.0}{2} = -1.0$. The displacement factor is $(x'' - x) + \frac{\tau\beta}{2}(F(x'')
    - F(x)) = 1.0 + 0.10(-2.0 - 0.0) = 0.80$. Multiplying gives $(-1.0)(0.80) = -0.80$. Adding $V(x'') - V(x) = 1.0$ gives
    $1.0 - 0.80 = 0.20$. Thus $A(0.0 \to 1.0) = \exp(-0.20) \approx 0.8187 \approx 0.819$ (whereas standard unshifted Metropolis
    MC would have accepted with only $e^{-1} \approx 0.368$!).'
- id: q16_hybrid_brownian_acceptance_target
  type: problem
  question_type: single_select
  difficulty: easy
  taught_by:
  - sec_trotter_and_smart_mc
  - concept_smoluchowski_trotter
  prompt_markdown: In the Hybrid Brownian / Smart Monte Carlo algorithm, enforcing the Metropolis acceptance test guarantees
    the exact canonical Boltzmann steady state for any step size $\tau$. Why do we still restrict the time step $\tau$ so
    that the acceptance ratio is very close to $1$ (typically $\sim 99\%$)?
  hint_markdown: Distinguish between static equilibrium averages and time-dependent dynamical trajectories.
  options:
  - id: a
    text: Because rejected moves artificially halt particle motion and distort time correlation functions; high acceptance
      (~99%) is required to keep the dynamical trajectory faithful to the Smoluchowski equation.
  - id: b
    text: Because the canonical partition function Z diverges whenever the acceptance rate drops below 95%.
  - id: c
    text: Because random number generators cannot sample Gaussian distributions when τ > 0.01.
  - id: d
    text: Because detailed balance is violated whenever a single trial move is rejected.
  correct: a
  rationale_markdown: While Metropolis rejections guarantee exact static equilibrium averages for any $\tau$, every rejection
    replaces a continuous Brownian step with $\Delta\mathbf{r} = \mathbf{0}$, distorting transport coefficients and time-dependent
    relaxation unless the acceptance ratio is close to $1$ ($\sim 99\%$).
- id: sec_hydrodynamic_interactions_oseen
  type: markdown_section
  title: 4. Hydrodynamic Interactions, the Oseen Tensor, and Cholesky Noise Sampling
  body_markdown: "### Why Simple Brownian Dynamics Misses Long-Time Hydrodynamic Correlations\nIn simple (free-draining) Brownian\
    \ dynamics, each particle $i$ is assigned an independent scalar diffusivity $D_0 = \\frac{k_B T}{6\\pi\\eta r_0}$ (Stokes–Einstein\
    \ relation for a sphere of radius $r_0$ in a solvent of viscosity $\\eta$) and uncorrelated thermal noise. However, in\
    \ a real fluid, **when particle $i$ moves, it drags the surrounding solvent, creating a long-range velocity field that\
    \ pushes particle $j$**.\n\n### The Oseen Hydrodynamic Mobility Tensor\nWithin linear Stokes hydrodynamics (low Reynolds\
    \ number), the velocity perturbation at distance $r_{ij}$ from a point force in an incompressible fluid of viscosity $\\\
    eta$ decays as **$1/r_{ij}$**. Perturbation theory yields the **Oseen diffusion tensor** $\\underline{\\mathbf{D}}_{ij}(\\\
    mathbf{r}_{ij})$:\n\n$$\\underline{\\mathbf{D}}_{ij} = \\frac{k_B T}{\\pi \\eta} \\begin{cases} \\dfrac{1}{6 r_0}\\mathbf{I}\
    \ &: i = j \\\\[10pt] \\dfrac{1}{8 r_{ij}} \\left( \\mathbf{I} + \\dfrac{\\mathbf{r}_{ij}\\mathbf{r}_{ij}}{r_{ij}^2} \\\
    right) &: i \\ne j \\end{cases}$$\n\nNotice the directional anisotropy for a pair separated along unit vector $\\hat{\\\
    mathbf{r}}_{ij} = \\mathbf{r}_{ij}/r_{ij}$:\n* **Longitudinal coupling** (motion parallel to $\\hat{\\mathbf{r}}_{ij}$,\
    \ where $\\hat{\\mathbf{r}}_{ij}\\cdot(\\mathbf{I} + \\hat{\\mathbf{r}}_{ij}\\hat{\\mathbf{r}}_{ij})\\cdot\\hat{\\mathbf{r}}_{ij}\
    \ = 2$):\n $$D_{\\parallel}(r_{ij}) = \\frac{k_B T}{4\\pi\\eta r_{ij}} = \\frac{3 r_0}{2 r_{ij}} D_0$$\n* **Transverse\
    \ coupling** (motion perpendicular to $\\hat{\\mathbf{r}}_{ij}$, where $\\hat{\\mathbf{e}}_\\perp\\cdot(\\mathbf{I} +\
    \ \\hat{\\mathbf{r}}_{ij}\\hat{\\mathbf{r}}_{ij})\\cdot\\hat{\\mathbf{e}}_\\perp = 1$):\n $$D_{\\perp}(r_{ij}) = \\frac{k_B\
    \ T}{8\\pi\\eta r_{ij}} = \\frac{3 r_0}{4 r_{ij}} D_0 = \\frac{1}{2} D_{\\parallel}(r_{ij})$$\n\n---\n\n### Generating\
    \ Correlated Thermal Noise via Cholesky Decomposition\nBecause the $3N \\times 3N$ diffusion matrix $\\underline{\\mathbf{D}}(\\\
    mathbf{R})$ couples different particles ($i \\ne j$), the Fluctuation–Dissipation theorem requires that the **stochastic\
    \ Brownian displacements $\\boldsymbol{\\eta}_i$ and $\\boldsymbol{\\eta}_j$ must be correlated**:\n\n$$\\langle \\boldsymbol{\\\
    eta}_i \\boldsymbol{\\eta}_j^T \\rangle = 2 \\underline{\\mathbf{D}}_{ij}(\\mathbf{R}) \\Delta t$$\n\nTo sample a $3N$-dimensional\
    \ correlated Gaussian vector $\\boldsymbol{\\eta}$ from a vector $\\boldsymbol{\\xi}$ of independent standard normal variates\
    \ ($\\langle \\xi_\\mu \\xi_\\nu \\rangle = \\delta_{\\mu\\nu}$), we factorize the $3N \\times 3N$ matrix $\\underline{\\\
    mathbf{D}}$ via **Cholesky decomposition**:\n\n$$\\underline{\\mathbf{D}}(\\mathbf{R}) = \\mathbf{S}\\mathbf{S}^T \\implies\
    \ \\boldsymbol{\\eta} = \\sqrt{2\\Delta t}\\,\\mathbf{S}\\boldsymbol{\\xi}$$\n\n**Important limitations of Oseen Brownian\
    \ Dynamics:**\n1. **$\\mathcal{O}(N^3)$ scaling bottleneck:** Because $\\underline{\\mathbf{D}}_{ij} \\propto 1/r_{ij}$\
    \ is dense and depends on instantaneous positions $\\mathbf{R}(t)$, Cholesky factorization costs $\\mathcal{O}((3N)^3)\
    \ = \\mathcal{O}(N^3)$ operations every time $\\underline{\\mathbf{D}}$ is updated.\n2. **Linear approximation:** The\
    \ Oseen tensor is only a far-field linear approximation ($r_{ij} \\gg r_0$) and can fail to be positive-definite when\
    \ particles overlap unless regularized (e.g., via the Rotne–Prager–Yamakawa tensor).\n3. **Transport coefficients are\
    \ inputs, not outputs:** Unlike MD, both $D_0$ and the solvent viscosity $\\eta$ must be supplied as **external inputs**\
    \ to a Brownian simulation rather than emerging automatically from microscopic collisions."
- id: concept_oseen_coupling
  type: concept_cell
  title: 'Interactive Explorer: Hydrodynamic Oseen Tensor & Directional Coupling'
  description_markdown: Explore how the solvent-mediated pair diffusivity $D_{ij}/D_0$ decays as $1/r_{ij}$ and depends on
    the angle $\theta$ between the displacement direction and the interparticle axis $\hat{\mathbf{r}}_{ij}$.
  render_function: render_oseen_hydrodynamic_coupling
  layout: figure_left
  controls:
    angle_deg:
      kind: slider
      label: Displacement Angle θ to Pair Axis (deg)
      min: 0
      max: 90
      step: 5
      default: 0
    show_rpy:
      kind: dropdown
      label: Near-Field Regularization
      default: 1
      options:
      - label: Show Rotne–Prager–Yamakawa O(a/r)³ Correction
        value: 1
      - label: Pure Oseen Tensor Only (∝ 1/r)
        value: 0
  takeaway_markdown: '**Key Takeaway:** Longitudinal hydrodynamic coupling ($\theta = 0^\circ$) is exactly twice as strong
    as transverse coupling ($\theta = 90^\circ$). Because $1/r_{ij}$ is long-ranged, all $N$ particles are hydrodynamically
    coupled through the dense $3N \times 3N$ diffusion matrix.'
- id: q17_oseen_tensor_decay_and_ratio
  type: problem
  question_type: single_select
  difficulty: easy
  taught_by:
  - sec_hydrodynamic_interactions_oseen
  - concept_oseen_coupling
  prompt_markdown: According to the Oseen tensor $\underline{\mathbf{D}}_{ij}(\mathbf{r}_{ij}) = \frac{k_B T}{8\pi\eta r_{ij}}(\mathbf{I}
    + \hat{\mathbf{r}}_{ij}\hat{\mathbf{r}}_{ij})$ for $i \ne j$, how does the hydrodynamic coupling decay with interparticle
    distance $r_{ij}$, and what is the ratio of longitudinal ($D_\parallel$) to transverse ($D_\perp$) pair diffusivity?
  hint_markdown: Evaluate $\hat{\mathbf{u}}\cdot(\mathbf{I} + \hat{\mathbf{r}}_{ij}\hat{\mathbf{r}}_{ij})\cdot\hat{\mathbf{u}}$
    for $\hat{\mathbf{u}} \parallel \hat{\mathbf{r}}_{ij}$ and $\hat{\mathbf{u}} \perp \hat{\mathbf{r}}_{ij}$.
  options:
  - id: a
    text: It decays as 1/r_ij, and longitudinal coupling is twice as large as transverse coupling (D_∥ / D_⊥ = 2).
  - id: b
    text: It decays as 1/r_ij³, and longitudinal coupling is equal to transverse coupling (D_∥ / D_⊥ = 1).
  - id: c
    text: It decays exponentially as exp(-κ r_ij), and D_∥ / D_⊥ = 1/2.
  - id: d
    text: It decays as 1/r_ij^6 like dispersion forces, and D_∥ / D_⊥ = 4.
  correct: a
  rationale_markdown: In the Oseen tensor, the prefactor scales as $1/r_{ij}$. Along the line of centers ($\hat{\mathbf{u}}
    = \hat{\mathbf{r}}_{ij}$), $\hat{\mathbf{r}}_{ij}\cdot(\mathbf{I} + \hat{\mathbf{r}}_{ij}\hat{\mathbf{r}}_{ij})\cdot\hat{\mathbf{r}}_{ij}
    = 1 + 1 = 2$, whereas perpendicular to $\hat{\mathbf{r}}_{ij}$ it equals $1 + 0 = 1$, giving $D_\parallel / D_\perp =
    2$.
- id: q18_oseen_longitudinal_value_numeric
  type: problem
  question_type: numeric
  difficulty: medium
  taught_by:
  - sec_hydrodynamic_interactions_oseen
  - concept_oseen_coupling
  prompt_markdown: Two identical spherical colloids of hydrodynamic radius $r_0 = 50\text{ nm}$ have a single-particle Stokes–Einstein
    diffusivity $D_0 = \frac{k_B T}{6\pi\eta r_0} = 4.0\text{ }\mu\text{m}^2/\text{s}$. When their center-to-center separation
    is $r_{12} = 300\text{ nm}$ ($r_{12}/r_0 = 6$), what is the longitudinal Oseen cross-diffusivity $D_{12,\parallel} = \frac{k_B
    T}{4\pi\eta r_{12}} = \frac{3 r_0}{2 r_{12}} D_0$ in $\mu\text{m}^2/\text{s}$?
  hint_markdown: Substitute $r_0 / r_{12} = 1/6$ into $D_{12,\parallel} = \frac{3}{2}(r_0 / r_{12}) D_0$.
  correct:
    value: 1.0
    tolerance: 0.02
  rationale_markdown: Using $D_{12,\parallel} = \frac{3 r_0}{2 r_{12}} D_0 = \frac{3}{2} \times \frac{50}{300} \times 4.0
    = 0.25 \times 4.0 = 1.0\text{ }\mu\text{m}^2/\text{s}$.
- id: q19_cholesky_sampling_complexity
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by: sec_hydrodynamic_interactions_oseen
  prompt_markdown: Why does incorporating Oseen hydrodynamic interactions into Brownian dynamics increase the per-step computational
    complexity from $\mathcal{O}(N)$ (or $\mathcal{O}(N^2)$) to $\mathcal{O}(N^3)$?
  hint_markdown: Consider how correlated thermal noise $\boldsymbol{\eta} = \sqrt{2\Delta t}\,\mathbf{S}\boldsymbol{\xi}$
    is generated from the dense $3N \times 3N$ diffusion matrix $\underline{\mathbf{D}}$.
  options:
  - id: a
    text: Because the thermal noise on all N particles is correlated through the dense 3N × 3N Oseen matrix D, requiring an
      O(N³) Cholesky decomposition D = S S^T to sample the noise.
  - id: b
    text: Because the Oseen tensor requires summing over all triplets (i, j, k) of solvent molecules.
  - id: c
    text: Because the 1D drift operator must be inverted using a 3D Fast Fourier Transform of size N × N × N.
  - id: d
    text: Because the Metropolis acceptance rate drops to O(N^-3) whenever viscosity η is nonzero.
  correct: a
  rationale_markdown: When $\underline{\mathbf{D}}_{ij} \ne \mathbf{0}$ for $i \ne j$, the Fluctuation–Dissipation theorem
    requires correlated noise with covariance $2\underline{\mathbf{D}}\Delta t$. Factoring the dense $3N \times 3N$ matrix
    $\underline{\mathbf{D}} = \mathbf{S}\mathbf{S}^T$ via Cholesky decomposition scales as $\mathcal{O}((3N)^3) = \mathcal{O}(N^3)$.
- id: q20_oseen_divergence_free_property
  type: problem
  question_type: single_select
  difficulty: hard
  taught_by: sec_hydrodynamic_interactions_oseen
  prompt_markdown: In the Smoluchowski mean drift formula $\langle d\mathbf{R}_i/dt \rangle = \sum_j \nabla_{\mathbf{r}_j}
    \cdot \underline{\mathbf{D}}_{ij} + \beta \sum_j \underline{\mathbf{D}}_{ij}\mathbf{F}_j$, what happens to the divergence
    drift term $\nabla_{\mathbf{r}_j} \cdot \underline{\mathbf{D}}_{ij}(\mathbf{r}_{ij})$ for the 3D Oseen tensor $\underline{\mathbf{D}}_{ij}
    \propto \frac{1}{r_{ij}}(\mathbf{I} + \hat{\mathbf{r}}_{ij}\hat{\mathbf{r}}_{ij})$ ($i \ne j$)?
  hint_markdown: Recall that the Oseen tensor is the Green's function of an *incompressible* fluid ($\nabla \cdot \mathbf{v}
    = 0$).
  options:
  - id: a
    text: It vanishes identically (∇_r_j · D_ij = 0 for i ≠ j) because the Oseen velocity field describes an incompressible
      fluid (∇·v = 0).
  - id: b
    text: It diverges as 1/r_ij² and dominates over all conservative forces at large distances.
  - id: c
    text: It equals a constant vector pointing toward the center of mass of the simulation box.
  - id: d
    text: It is proportional to the particle mass m_i divided by the timestep Δt.
  correct: a
  rationale_markdown: For the 3D Oseen tensor $\mathbf{T}(\mathbf{r}) \propto \frac{1}{r}(\mathbf{I} + \frac{\mathbf{r}\mathbf{r}}{r^2})$,
    direct differentiation gives $\partial_\beta T_{\alpha\beta} \propto \partial_\beta(r^{-1}\delta_{\alpha\beta} + r_\alpha
    r_\beta r^{-3}) = -r_\alpha r^{-3} + (3 r_\alpha r^{-3} + r_\alpha r^{-3} - 3 r_\alpha r^{-3}) = 0$. Physically, this
    reflects the incompressibility ($\nabla \cdot \mathbf{v} = 0$) of the Stokes flow.
- id: q21_brownian_input_vs_output
  type: problem
  question_type: single_select
  difficulty: easy
  taught_by: sec_hydrodynamic_interactions_oseen
  prompt_markdown: In an all-atom Molecular Dynamics simulation, the diffusion coefficient $D$ and shear viscosity $\eta$
    are emergent *outputs* measured via Green–Kubo or Einstein relations. How are $D_0$ and $\eta$ treated in a Brownian Dynamics
    simulation?
  hint_markdown: Check the last bullet on the 'Hydrodynamical effects' lecture slide.
  options:
  - id: a
    text: D₀ and η are phenomenological inputs supplied to the simulation, not emergent outputs.
  - id: b
    text: D₀ and η are computed automatically from the electronic wavefunction at each Brownian step.
  - id: c
    text: D₀ and η are always set to zero in Brownian dynamics.
  - id: d
    text: D₀ is an output of the Metropolis rejection step, whereas η is fixed at infinity.
  correct: a
  rationale_markdown: Because the solvent degrees of freedom have been integrated out, Brownian Dynamics cannot derive solvent
    viscosity $\eta$ or bare diffusivity $D_0$ from microscopic collisions; instead, $D_0$ and $\eta$ must be provided as
    **inputs** to the simulation.
- id: sec_langevin_dynamics_and_fdt
  type: markdown_section
  title: 5. The Langevin Equation, Inertial Regimes, and Fluctuation–Dissipation
  body_markdown: "### Retaining Particle Momentum: The Langevin Equation\nBrownian dynamics assumes the **overdamped limit**\
    \ where particle inertia $m\\ddot{\\mathbf{r}}$ is completely negligible. If we want more realistic short-time dynamics—or\
    \ need to thermostat an atomic/molecular system while retaining particle velocities—we keep the momentum $\\mathbf{p}_i\
    \ = m\\mathbf{v}_i$ of the heavy particle and model the eliminated solvent via a **viscous friction $-\\zeta \\mathbf{p}_i$**\
    \ plus a **stochastic solvent force $\\mathbf{p}_{\\text{solvent}}(t)$** (often written $\\boldsymbol{\\eta}_i(t)$):\n\
    \n$$\\frac{d\\mathbf{r}}{dt} = \\frac{\\mathbf{p}}{m}, \\qquad \\frac{d\\mathbf{p}}{dt} = \\mathbf{F}(\\mathbf{r}) - \\\
    zeta \\mathbf{p} + \\mathbf{p}_{\\text{solvent}}(t)$$\n\nwhere $\\zeta$ (with units of $\\text{time}^{-1}$) is the friction\
    \ coefficient (collision frequency).\n\n### The Fluctuation–Dissipation Theorem (Detailed Balance in Phase Space)\nFriction\
    \ $-\\zeta\\mathbf{p}$ continuously drains kinetic energy from the particle, whereas the random force $\\mathbf{p}_{\\\
    text{solvent}}(t)$ continuously injects kinetic energy. To maintain canonical thermal equilibrium at temperature $T$ ($\\\
    langle \\frac{p_\\alpha^2}{2m} \\rangle = \\frac{1}{2}k_B T$) and satisfy detailed balance, the random force variance\
    \ **must** be locked to the friction $\\zeta$ via the **Fluctuation–Dissipation relation**:\n\n$$\\langle \\mathbf{p}_{\\\
    text{solvent}}(t) \\rangle = \\mathbf{0}, \\qquad \\left\\langle p_{\\text{solvent},\\alpha}(t)\\, p_{\\text{solvent},\\\
    beta}(t') \\right\\rangle = 2 m k_B T \\zeta \\, \\delta_{\\alpha\\beta}\\,\\delta(t - t')$$\n\nIf the solvent has a finite\
    \ relaxation time (non-Markovian bath), the delta function is generalized to a memory kernel $\\langle p_{\\text{solvent}}(t)p_{\\\
    text{solvent}}(t') \\rangle = C(t - t')$ in the **Generalized Langevin Equation (GLE)**.\n\n---\n\n### Asymptotic Regimes\
    \ of the Langevin Equation\nThe friction coefficient $\\zeta$ defines the **momentum relaxation time** $\\tau_p = \\zeta^{-1}$:\n\
    1. **Zero-Friction Limit ($\\zeta \\to 0$):** Both friction and random noise vanish ($\\sigma_{\\text{noise}} \\propto\
    \ \\sqrt{\\zeta} \\to 0$), and **deterministic Newtonian Molecular Dynamics (NVE)** is exactly recovered.\n2. **Short-Time\
    \ Inertial / Ballistic Regime ($t \\ll \\zeta^{-1}$):** Before solvent collisions damp its initial velocity, a particle\
    \ moves ballistically:\n $$C_{vv}(t) = \\frac{k_B T}{m} e^{-\\zeta t} \\approx \\frac{k_B T}{m}(1 - \\zeta t), \\qquad\
    \ \\langle \\Delta \\mathbf{r}^2(t) \\rangle \\approx \\frac{3 k_B T}{m} t^2 \\propto t^2$$\n3. **Long-Time / High-Friction\
    \ Overdamped Limit ($t \\gg \\zeta^{-1}$ or $\\zeta \\to \\infty$):** Momentum relaxes quasi-instantaneously ($\\frac{d\\\
    mathbf{p}}{dt} \\approx \\mathbf{0}$), and the Langevin equation reduces to the **Smoluchowski / Brownian Dynamics** equation\
    \ with Einstein diffusivity:\n $$D = \\int_0^\\infty C_{vv}(t)\\,dt = \\frac{k_B T}{m} \\int_0^\\infty e^{-\\zeta t}\\\
    ,dt = \\frac{k_B T}{m \\zeta}, \\qquad \\langle \\Delta \\mathbf{r}^2(t) \\rangle \\simeq 6 D t = \\frac{6 k_B T}{m\\\
    zeta} t$$\n\n*(Note on Velocity Autocorrelation Functions in dense liquids, Allen & Tildesley Ch. 6: In an explicit dense\
    \ liquid near the triple point, $C_{vv}(t)$ exhibits a negative \"backscattering\" cage rebound at $t \\sim 0.2\\text{\
    \ ps}$ before decaying, and in anisotropic molecules like $\\text{CS}_2$, parallel and perpendicular diffusive components\
    \ $D_\\parallel \\ne D_\\perp$ split across temperatures.)*"
- id: concept_langevin_regimes
  type: concept_cell
  title: 'Interactive Explorer: Langevin Friction Regimes (Ballistic vs. Overdamped Brownian)'
  description_markdown: Vary the Langevin friction coefficient $\zeta$ and switch between the log-log Mean Square Displacement
    $\langle \Delta \mathbf{r}^2(t) \rangle$ and the Velocity Autocorrelation Function $C_{vv}(t)$ to observe the crossover
    at $\tau_p = \zeta^{-1}$.
  render_function: render_langevin_friction_regimes
  layout: figure_left
