    $D = k_B T / (m\zeta)$). In a harmonic trap, increasing $\zeta$ above $2\omega_0$ suppresses oscillatory ringing and enters
    the overdamped Smoluchowski regime.'
- id: q22_langevin_fdt_relation
  type: problem
  question_type: single_select
  difficulty: easy
  taught_by:
  - sec_langevin_dynamics_and_fdt
  - concept_langevin_regimes
  prompt_markdown: In the Langevin equation $\frac{d\mathbf{p}}{dt} = \mathbf{F} - \zeta\mathbf{p} + \mathbf{p}_{\text{solvent}}(t)$,
    what autocorrelation must the stochastic force $\mathbf{p}_{\text{solvent}}(t)$ satisfy per Cartesian component to maintain
    canonical detailed balance at temperature $T$?
  hint_markdown: Check the Fluctuation–Dissipation formula on the 'Langevin Equation' lecture slide.
  options:
  - id: a
    text: ⟨p_solvent(t) p_solvent(t')⟩ = 2 m k_B T ζ δ(t - t')
  - id: b
    text: ⟨p_solvent(t) p_solvent(t')⟩ = (k_B T / ζ) δ(t - t')
  - id: c
    text: ⟨p_solvent(t) p_solvent(t')⟩ = 2 m² ζ² δ(t - t') independent of temperature T
  - id: d
    text: ⟨p_solvent(t) p_solvent(t')⟩ = 0 for all t and t'
  correct: a
  rationale_markdown: The Fluctuation–Dissipation theorem requires $\langle p_{\text{solvent}}(t)p_{\text{solvent}}(t') \rangle
    = 2 m k_B T \zeta \delta(t - t')$ so that the thermal power injected by the random kicks exactly balances the viscous
    energy dissipated by $-\zeta\mathbf{p}$ at temperature $T$.
- id: q23_langevin_asymptotic_limits
  type: problem
  question_type: single_select
  difficulty: easy
  taught_by:
  - sec_langevin_dynamics_and_fdt
  - concept_langevin_regimes
  prompt_markdown: 'What happens to the Langevin equation in the two opposite asymptotic limits of the friction coefficient:
    (i) $\zeta \to 0$ and (ii) $\zeta \to \infty$ (overdamped limit)?'
  hint_markdown: Inspect how the inertial term $dp/dt$ behaves in both limits.
  options:
  - id: a
    text: As ζ → 0, deterministic Newtonian MD is recovered; as ζ → ∞, the overdamped Smoluchowski (Brownian dynamics) equation
      is recovered.
  - id: b
    text: As ζ → 0, the Smoluchowski equation is recovered; as ζ → ∞, energy-conserving NVE MD is recovered.
  - id: c
    text: In both limits ζ → 0 and ζ → ∞, particles freeze motionless at their initial coordinates.
  - id: d
    text: As ζ → 0, Kinetic Monte Carlo is recovered; as ζ → ∞, Path-Integral MC is recovered.
  correct: a
  rationale_markdown: When $\zeta \to 0$, both the drag $-\zeta\mathbf{p}$ and the noise variance $2mk_B T\zeta$ vanish, recovering
    Hamiltonian/Newtonian MD. When $\zeta \to \infty$ (or $t \gg \zeta^{-1}$), momentum relaxes immediately ($d\mathbf{p}/dt
    \approx 0$) and the position evolution obeys the Smoluchowski equation.
- id: q24_langevin_einstein_diffusivity_numeric
  type: problem
  question_type: numeric
  difficulty: medium
  taught_by:
  - sec_langevin_dynamics_and_fdt
  - concept_langevin_regimes
  prompt_markdown: "In a Langevin simulation run in reduced units where particle mass $m = 2.0$, thermal energy $k_B T = 1.5$,\
    \ and friction coefficient $\\zeta = 0.50\\text{ }\tau_0^{-1}$, what is the long-time self-diffusion coefficient $D =\
    \ \\frac{k_B T}{m\\zeta}$?"
  hint_markdown: Compute $D = 1.5 / (2.0 \times 0.50)$.
  correct:
    value: 1.5
    tolerance: 0.02
  rationale_markdown: By the Einstein / Green–Kubo relation for Langevin dynamics, $D = \int_0^\infty C_{vv}(t)\,dt = \frac{k_B
    T}{m\zeta} = \frac{1.5}{2.0 \times 0.50} = 1.5$.
- id: q25_langevin_discrete_noise_std_numeric
  type: problem
  question_type: numeric
  difficulty: medium
  taught_by: sec_langevin_dynamics_and_fdt
  prompt_markdown: When integrating the 1D Langevin momentum equation $\Delta p = F\Delta t - \zeta p \Delta t + \Delta W_p$
    over a small timestep $\Delta t = 0.01$, the discrete momentum kick $\Delta W_p = \int_t^{t+\Delta t} p_{\text{solvent}}(t')\,dt'$
    has variance $\langle (\Delta W_p)^2 \rangle = 2 m k_B T \zeta \Delta t$. For $m = 1.0$, $k_B T = 2.0$, and $\zeta = 4.0$,
    what is the standard deviation $\sigma_{\Delta W_p} = \sqrt{2 m k_B T \zeta \Delta t}$ of the Gaussian momentum kick per
    step?
  hint_markdown: Evaluate $\sqrt{2 \times 1.0 \times 2.0 \times 4.0 \times 0.01}$.
  correct:
    value: 0.4
    tolerance: 0.01
  rationale_markdown: The variance of the integrated white-noise impulse over $\Delta t$ is $\langle (\Delta W_p)^2 \rangle
    = 2 m k_B T \zeta \Delta t = 2(1.0)(2.0)(4.0)(0.01) = 0.16$, so its standard deviation is $\sqrt{0.16} = 0.40$.
- id: q26_vacf_dense_liquid_cage_effect
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by:
  - sec_langevin_dynamics_and_fdt
  - concept_langevin_regimes
  prompt_markdown: Compare the velocity autocorrelation function $C_{vv}(t)$ of a free memoryless Langevin particle ($C_{vv}(t)
    \propto e^{-\zeta t} > 0$) against the MD velocity autocorrelation function of a dense Lennard-Jones liquid near its triple
    point (Allen & Tildesley Ch. 6). Why does the dense liquid $C_{vv}(t)$ dip below zero ($C_{vv}(t) < 0$) at intermediate
    times before decaying to zero?
  hint_markdown: Think about what happens when an atom in a dense liquid collides with its cage of nearest neighbors.
  options:
  - id: a
    text: 'Cage backscattering: atoms rebound off their surrounding shell of nearest neighbors, reversing their velocity direction
      on average before escaping.'
  - id: b
    text: Violation of energy conservation in the Verlet integrator at low temperatures.
  - id: c
    text: The diffusion coefficient D = ∫₀^∞ C_vv(t) dt is strictly negative in the liquid phase.
  - id: d
    text: Periodic boundary conditions force every atom to reverse direction when crossing x = L/2.
  correct: a
  rationale_markdown: In a dense liquid near the triple point, an atom is transiently trapped in a cage of surrounding neighbors;
    colliding with this cage reverses its velocity, producing a negative backscattering lobe in $C_{vv}(t)$ (which can only
    be captured in Langevin dynamics if a memory kernel $C(t-t')$ or restoring trap is included).
- id: q27_langevin_msd_ballistic_vs_diffusive
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by:
  - sec_langevin_dynamics_and_fdt
  - concept_langevin_regimes
  prompt_markdown: On a log–log plot of the 3D mean-square displacement $\langle \Delta \mathbf{r}^2(t) \rangle$ versus time
    $t$ for a free Langevin particle, what are the power-law slopes $\alpha$ (where $\langle \Delta \mathbf{r}^2(t) \rangle
    \propto t^\alpha$) in the short-time inertial regime ($t \ll \zeta^{-1}$) and the long-time Brownian regime ($t \gg \zeta^{-1}$)?
  hint_markdown: Compare $\langle \Delta \mathbf{r}^2 \rangle \approx (3k_B T/m)t^2$ at short times with $\langle \Delta \mathbf{r}^2
    \rangle \approx 6Dt$ at long times.
  options:
  - id: a
    text: Slope α = 2 at short times (ballistic regime) transitioning at t ~ ζ⁻¹ to slope α = 1 at long times (diffusive regime).
  - id: b
    text: Slope α = 1 at short times transitioning to slope α = 2 at long times.
  - id: c
    text: Slope α = 1/2 at all times.
  - id: d
    text: Slope α = 3 at short times transitioning to slope α = 0 at long times.
  correct: a
  rationale_markdown: For $t \ll \zeta^{-1}$, $\Delta \mathbf{r}(t) \approx \mathbf{v}(0)t$, giving $\langle \Delta \mathbf{r}^2(t)
    \rangle = \frac{3k_B T}{m}t^2$ (log-log slope $2$). For $t \gg \zeta^{-1}$, multiple collisions randomize velocity and
    yield normal Einstein diffusion $\langle \Delta \mathbf{r}^2(t) \rangle = 6Dt$ (log-log slope $1$).
- id: sec_dpd_and_hydrodynamics
  type: markdown_section
  title: 6. Dissipative Particle Dynamics (DPD) and Momentum-Conserving Hydrodynamics
  body_markdown: "### Why Global Langevin and Andersen Thermostats Destroy Hydrodynamics\nIn standard Langevin dynamics (or\
    \ an Andersen stochastic collision thermostat), the friction force $-\\zeta \\mathbf{p}_i$ and random kick $\\boldsymbol{\\\
    eta}_i$ act on each particle's **absolute laboratory velocity** $\\mathbf{v}_i$ independently:\n\n$$\\sum_{i=1}^N \\mathbf{F}_i^{\\\
    text{Langevin}} = -\\zeta \\sum_{i=1}^N \\mathbf{p}_i + \\sum_{i=1}^N \\boldsymbol{\\eta}_i(t) \\ne \\mathbf{0}$$\n\n\
    Because **total momentum is not conserved locally**, a Langevin thermostat breaks **Galilean invariance**:\n* Any macroscopic\
    \ flow profile $\\mathbf{u}(\\mathbf{r}, t)$ or hydrodynamic vortex experiences an unphysical body drag $-\\rho\\zeta\\\
    mathbf{u}$ against the stationary simulation box frame.\n* Long-wavelength shear waves and hydrodynamic wakes are screened\
    \ out beyond the Brinkman length $\\ell_B = \\sqrt{\\eta/(\\rho\\zeta)}$, turning parabolic Poiseuille channel flow into\
    \ flat plug flow and suppressing the long-time $t^{-3/2}$ hydrodynamic tail.\n\n---\n\n### Dissipative Particle Dynamics\
    \ (DPD): Pairwise Momentum Conservation\n**Dissipative Particle Dynamics (DPD)** (Hoogerbrugge & Koelman 1992; Español\
    \ & Warren 1995; Frenkel & Smit p. 465) solves this problem without explicit solvent atoms by making both the **dissipative\
    \ (friction)** and **random** forces act **pairwise and centrally** between particles $i$ and $j$ within a cutoff radius\
    \ $r_c$:\n\n$$\\mathbf{F}_i = \\sum_{j \\ne i} \\left( \\mathbf{F}_{ij}^C + \\mathbf{F}_{ij}^D + \\mathbf{F}_{ij}^R \\\
    right) = \\sum_{j \\ne i} \\left[ f(r_{ij})\\hat{\\mathbf{r}}_{ij} + \\zeta_{ij}\\hat{\\mathbf{r}}_{ij} \\right]$$\n\n\
    where $\\mathbf{r}_{ij} = \\mathbf{r}_i - \\mathbf{r}_j$, $\\hat{\\mathbf{r}}_{ij} = \\mathbf{r}_{ij}/r_{ij}$, and $\\\
    mathbf{v}_{ij} = \\mathbf{v}_i - \\mathbf{v}_j$ is the **relative velocity**:\n\n1. **Conservative Force $\\mathbf{F}_{ij}^C\
    \ = f(r_{ij})\\hat{\\mathbf{r}}_{ij}$:** Typically a soft, finite repulsive potential cut off at $r_c$ allowing large\
    \ timesteps.\n2. **Pairwise Dissipative Force $\\mathbf{F}_{ij}^D$:** Depends only on the relative velocity projected\
    \ along the line of centers:\n $$\\langle \\zeta_{ij} \\rangle \\hat{\\mathbf{r}}_{ij} = \\mathbf{F}_{ij}^D = -\\gamma\
    \ w^D(r_{ij}) \\left( \\mathbf{v}_{ij} \\cdot \\hat{\\mathbf{r}}_{ij} \\right) \\hat{\\mathbf{r}}_{ij}$$\n3. **Pairwise\
    \ Random Force $\\mathbf{F}_{ij}^R$:** Symmetric Gaussian noise $\\theta_{ij} = \\theta_{ji}$ applied equally and oppositely\
    \ along $\\hat{\\mathbf{r}}_{ij}$:\n $$\\mathbf{F}_{ij}^R = \\sigma w^R(r_{ij}) \\theta_{ij} \\Delta t^{-1/2} \\hat{\\\
    mathbf{r}}_{ij}$$\n\n*(In the compact notation where $\\gamma = 1$ and $\\omega(r) = w^R(r)$: $\\langle \\zeta_{ij} \\\
    rangle = -\\omega^2(r_{ij})(\\mathbf{v}_{ij}\\cdot\\hat{\\mathbf{r}}_{ij})$ and $\\langle \\zeta_{ij}^2 \\rangle = 2 k_B\
    \ T \\omega^2(r_{ij})$.)*\n\n#### Why DPD Recovers Macroscopic Navier–Stokes Hydrodynamics\n* **Linear Momentum Conservation:**\
    \ Because $\\mathbf{v}_{ij} = -\\mathbf{v}_{ji}$, $\\hat{\\mathbf{r}}_{ij} = -\\hat{\\mathbf{r}}_{ji}$, and $\\theta_{ij}\
    \ = \\theta_{ji}$, every pair interaction satisfies Newton's third law **$\\mathbf{F}_{ij} = -\\mathbf{F}_{ji}$** identically!\
    \ Thus $\\sum_i \\mathbf{F}_i = \\mathbf{0}$ in every region of fluid.\n* **Angular Momentum Conservation:** Because all\
    \ three forces act strictly along the central vector $\\hat{\\mathbf{r}}_{ij}$, $\\mathbf{r}_{ij} \\times \\mathbf{F}_{ij}\
    \ = \\mathbf{0}$, so local angular momentum is also rigorously conserved.\n* **DPD Fluctuation–Dissipation Theorem:**\
    \ As proved by Español & Warren (1995), the Fokker–Planck equation of DPD has the **canonical Boltzmann distribution**\
    \ $\\rho_{\\text{eq}} \\propto \\exp[-\\beta(\\sum_i \\frac{p_i^2}{2m} + V(\\mathbf{R}))]$ as its unique stationary state\
    \ if and only if the weight functions and amplitudes obey:\n $$w^D(r) = \\left[ w^R(r) \\right]^2 = \\omega^2(r), \\qquad\
    \ \\sigma^2 = 2 \\gamma k_B T$$\n where a common cutoff envelope is $\\omega(r) = (1 - r/r_c)^2$ (or $1 - r/r_c$) for\
    \ $r < r_c$ and $0$ for $r \\ge r_c$.\n\n---\n\n### Integrating the DPD Equations of Motion\nIn the standard leapfrog\
    \ / Verlet algorithm:\n\n$$\\mathbf{v}(t + \\Delta t/2) = \\mathbf{v}(t - \\Delta t/2) + \\frac{\\Delta t}{m}\\mathbf{f}(t),\
    \ \\qquad \\mathbf{r}(t + \\Delta t) = \\mathbf{r}(t) + \\Delta t\\,\\mathbf{v}(t + \\Delta t/2)$$\n\nBecause the dissipative\
    \ force $\\mathbf{F}_{ij}^D$ depends on the velocities $\\mathbf{v}(t)$ at time $t$:\n\n$$\\mathbf{v}(t) = \\frac{1}{2}\\\
    left[ \\mathbf{v}(t + \\Delta t/2) + \\mathbf{v}(t - \\Delta t/2) \\right]$$\n\n$\\mathbf{v}(t + \\Delta t/2)$ appears\
    \ on **both sides** of the velocity update! To preserve time-reversibility and accurate temperature control, we must **solve\
    \ the coupled equations self-consistently** (or use a Hybrid / Lowe–Andersen / Shardlow scheme to enforce detailed balance)."
- id: concept_langevin_vs_dpd
  type: concept_cell
  title: 'Interactive Explorer: Poiseuille Channel Flow — Global Langevin vs. Momentum-Conserving DPD'
  description_markdown: Compare the steady-state velocity profile $v_x(y)$ of a fluid driven through a channel of width $2H$
    under a global Langevin thermostat (which damps absolute velocity $\mathbf{v}_i$) versus Dissipative Particle Dynamics
    (which damps only relative velocity $\mathbf{v}_{ij}$).
  render_function: render_langevin_vs_dpd_hydrodynamics
  layout: figure_left
  controls:
    zeta_langevin:
      kind: slider
      label: Global Langevin Friction ζ
      min: 0.0
      max: 4.0
      step: 0.25
      default: 1.5
      format: .2f
    dpd_gamma:
      kind: slider
