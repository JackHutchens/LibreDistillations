    hint_markdown: Read the headline and plateau highlighted on slide 16.
    options:
    - id: a
      text: The variance of the potential energy is relatively insensitive to step size across a wide acceptable range ($0.1 < \text{a.r.} < 0.9$), showing that MC is a robust method that does not require delicate fine-tuning of $\Delta$.
      text_markdown: The variance of the potential energy is relatively insensitive to step size across a wide acceptable range ($0.1 < \text{a.r.} < 0.9$), showing that MC is a robust method that does not require delicate fine-tuning of $\Delta$.
    - id: b
      text: The potential energy variance is a sharp delta-function minimum at $\Delta/\sigma = 0.200$ and blows up if $\Delta$ changes by $5\%$.
      text_markdown: The potential energy variance is a sharp delta-function minimum at $\Delta/\sigma = 0.200$ and blows up if $\Delta$ changes by $5\%$.
    - id: c
      text: The potential energy variance decreases monotonically as $\Delta/\sigma \to 0$.
      text_markdown: The potential energy variance decreases monotonically as $\Delta/\sigma \to 0$.
    - id: d
