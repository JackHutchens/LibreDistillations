  - id: sec_detailed_balance
    type: markdown_section
    title: 4. Detailed Balance (Microscopic Reversibility) & Rejection
    body_markdown: "In our reliability example, we were *given* the transition matrix $P(s \\to s')$ and had to solve for its unknown stationary distribution $\\pi(s)$. In **Metropolis Monte Carlo**, the problem is inverted:\n- We **know** the target equilibrium distribution we want to sample—for example, the canonical Boltzmann distribution:\n  $$\\pi(s) = \\frac{1}{Z} e^{-\\beta E(s)}$$\n- We want to **construct** a transition matrix $P(s \\to s')$ that is guaranteed to have $\\pi(s)$ as its unique stationary eigenvector ($\\pi P = \\pi$).\n\n### The Three Key Concepts of the Metropolis Algorithm\n1. **Sample phase space by using an ergodic random walk.**\n2. **Guarantee the desired equilibrium state $\\pi(s)$ by enforcing detailed balance.**\n3. **Achieve detailed balance by rejecting trial moves.**\n\n### Detailed Balance vs. Global Balance\nThe global stationarity condition (master equation in steady state) requires that the total probability flowing *into* state $s'$ equals $\\pi(s')$:\n\
      $$\\pi(s') = \\sum_{s} \\pi(s)\\, P(s \\to s')$$\nSolving this coupled sum over all $s$ simultaneously is difficult. Instead, we impose a stronger pairwise condition called **detailed balance** (or **microscopic reversibility**), which equates the steady-state transition rate $K(s \\to s') \\equiv \\pi(s)P(s \\to s')$ from $s$ to $s'$ with the reverse rate $K(s' \\to s)$ from $s'$ to $s$:\n$$\\pi(s)\\, P(s \\to s') = \\pi(s')\\, P(s' \\to s) \\qquad \\forall\\, s, s'$$\n\n### Proof that Detailed Balance Implies Stationarity ($\\pi = \\pi P$)\nSumming both sides of the detailed balance equation over all states $s$ and applying row normalization $\\sum_s P(s' \\to s) = 1$ immediately proves that $\\pi(s)$ is a stationary eigenvector of $P$:\n$$\\sum_{s} \\pi(s)\\, P(s \\to s') = \\sum_{s} \\pi(s')\\, P(s' \\to s) = \\pi(s') \\underbrace{\\sum_{s} P(s' \\to s)}_{=\\, 1} = \\pi(s')$$\n- **Sufficient, not strictly necessary:** Detailed balance is a *sufficient* condition for $\\pi = \\\
      pi P$ (and guarantees that $P$ has real eigenvalues because $\\pi^{1/2} P \\pi^{-1/2}$ is symmetric), though as we will see in Lesson 16, sequential menus of moves can satisfy global balance without satisfying detailed balance.\n- **Self-transitions from rejections:** Because off-diagonal moves to higher-energy states are sometimes rejected, there is a nonzero probability of remaining in the same state $s$:\n  $$P(s \\to s) = 1 - \\sum_{s' \\ne s} P(s \\to s')$$\n"
  - id: q15_17_detailed_balance_definition
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_detailed_balance
    prompt_markdown: Which equation expresses the **detailed balance** condition for a Markov chain with transition matrix $P(s \to s')$ and target equilibrium distribution $\pi(s)$?
    hint_markdown: Equate the joint one-step transition flux $K(s \to s')$ from $s$ to $s'$ with the reverse flux $K(s' \to s)$.
    options:
    - id: a
      text: $\pi(s)\, P(s \to s') = \pi(s')\, P(s' \to s)$ for every pair of states $(s, s')$
      text_markdown: $\pi(s)\, P(s \to s') = \pi(s')\, P(s' \to s)$ for every pair of states $(s, s')$
    - id: b
      text: $P(s \to s') = P(s' \to s)$ for every pair of states $(s, s')$
      text_markdown: $P(s \to s') = P(s' \to s)$ for every pair of states $(s, s')$
    - id: c
      text: $\pi(s) = \pi(s')$ for every pair of states $(s, s')$
      text_markdown: $\pi(s) = \pi(s')$ for every pair of states $(s, s')$
    - id: d
      text: $\sum_{s'} \pi(s')\, P(s \to s') = 1$ for every state $s$
      text_markdown: $\sum_{s'} \pi(s')\, P(s \to s') = 1$ for every state $s$
    correct: a
    rationale_markdown: Detailed balance equates the unconditional probability flux from $s$ to $s'$, $K(s \to s') = \pi(s)P(s \to s')$, with the reverse flux $K(s' \to s) = \pi(s')P(s' \to s)$.
  - id: q15_18_detailed_balance_canonical_ratio
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_detailed_balance
    prompt_markdown: When sampling the canonical Boltzmann distribution $\pi(s) = \frac{1}{Z}e^{-\beta E(s)}$, what ratio of forward-to-reverse transition probabilities $P(s \to s') / P(s' \to s)$ is required by detailed balance?
    hint_markdown: Rearrange $\pi(s)P(s \to s') = \pi(s')P(s' \to s)$ for $P(s \to s') / P(s' \to s)$.
    options:
    - id: a
      text: $\dfrac{P(s \to s')}{P(s' \to s)} = \dfrac{\pi(s')}{\pi(s)} = \exp\big(-\beta[E(s') - E(s)]\big)$
      text_markdown: $\dfrac{P(s \to s')}{P(s' \to s)} = \dfrac{\pi(s')}{\pi(s)} = \exp\big(-\beta[E(s') - E(s)]\big)$
    - id: b
      text: $\dfrac{P(s \to s')}{P(s' \to s)} = \dfrac{\pi(s)}{\pi(s')} = \exp\big(+\beta[E(s') - E(s)]\big)$
      text_markdown: $\dfrac{P(s \to s')}{P(s' \to s)} = \dfrac{\pi(s)}{\pi(s')} = \exp\big(+\beta[E(s') - E(s)]\big)$
    - id: c
      text: $\dfrac{P(s \to s')}{P(s' \to s)} = 1$
      text_markdown: $\dfrac{P(s \to s')}{P(s' \to s)} = 1$
    - id: d
      text: $\dfrac{P(s \to s')}{P(s' \to s)} = \dfrac{E(s)}{E(s')}$
      text_markdown: $\dfrac{P(s \to s')}{P(s' \to s)} = \dfrac{E(s)}{E(s')}$
    correct: a
    rationale_markdown: Detailed balance requires $\frac{P(s \to s')}{P(s' \to s)} = \frac{\pi(s')}{\pi(s)} = \frac{e^{-\beta E(s')}/Z}{e^{-\beta E(s)}/Z} = e^{-\beta[E(s') - E(s)]}$, favoring transitions toward lower-energy states.
  - id: q15_19_detailed_vs_global_balance
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_detailed_balance
    prompt_markdown: What is the exact logical relationship between **detailed balance** ($\pi(s)P(s \to s') = \pi(s')P(s' \to s)$) and **global stationary balance** ($\pi(s') = \sum_s \pi(s)P(s \to s')$)?
    hint_markdown: Consider whether summing detailed balance over $s$ gives global balance, and whether probability currents can circulate in closed loops at steady state.
    options:
    - id: a
      text: Detailed balance is a **sufficient** condition for global stationary balance, but it is **not strictly necessary** (a chain with steady-state probability currents around cycles can still preserve $\pi = \pi P$).
      text_markdown: Detailed balance is a **sufficient** condition for global stationary balance, but it is **not strictly necessary** (a chain with steady-state probability currents around cycles can still preserve $\pi = \pi P$).
    - id: b
      text: Detailed balance is both necessary and sufficient; no Markov chain can have $\pi = \pi P$ without satisfying detailed balance.
      text_markdown: Detailed balance is both necessary and sufficient; no Markov chain can have $\pi = \pi P$ without satisfying detailed balance.
    - id: c
      text: Global stationary balance implies detailed balance, but detailed balance does not imply global balance.
      text_markdown: Global stationary balance implies detailed balance, but detailed balance does not imply global balance.
    - id: d
      text: Detailed balance only applies to 2-state chains and fails for $N > 2$ states.
      text_markdown: Detailed balance only applies to 2-state chains and fails for $N > 2$ states.
    correct: a
    rationale_markdown: Summing $\pi(s)P(s \to s') = \pi(s')P(s' \to s)$ over $s$ always yields $\sum_s \pi(s)P(s \to s') = \pi(s')$, so detailed balance is sufficient for stationarity. However, non-reversible chains (e.g., deterministic sequential sweeps) can satisfy global balance without pairwise detailed balance.
  - id: q15_20_self_transition_probability
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_detailed_balance
    prompt_markdown: A system in state $s$ can propose moves to three neighboring states $s_1, s_2, s_3$. Suppose the actual off-diagonal transition probabilities (proposal $\times$ acceptance) are $P(s \to s_1) = 0.25$, $P(s \to s_2) = 0.15$, and $P(s \to s_3) = 0.05$. What is the self-transition probability $P(s \to s)$ that the system remains in state $s$ due to move rejection?
