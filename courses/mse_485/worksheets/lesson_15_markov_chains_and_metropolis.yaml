      text_markdown: Accept the move with probability $A_M = 1$ if no spheres overlap ($r_{ij}' \ge \sigma$), and reject with probability $A_M = 0$ if any pair overlaps ($r_{ij}' < \sigma$), independent of temperature.
    - id: b
      text: Accept every move with probability $0.5$ regardless of overlaps.
      text_markdown: Accept every move with probability $0.5$ regardless of overlaps.
    - id: c
      text: Accept overlapping moves with probability $e^{-\beta \sigma}$.
      text_markdown: Accept overlapping moves with probability $e^{-\beta \sigma}$.
    - id: d
      text: Hard spheres cannot be simulated with Metropolis MC because the force $-\nabla v(r)$ is a delta function.
      text_markdown: Hard spheres cannot be simulated with Metropolis MC because the force $-\nabla v(r)$ is a delta function.
    correct: a
    rationale_markdown: Starting from a valid configuration ($E(s) = 0$), any non-overlapping trial state has $\Delta E = 0 \implies A_M = e^0 = 1$, while any overlapping trial state has $\Delta E = +\infty \implies A_M = e^{-\infty} = 0$.
  - id: sec_single_particle_and_bugs
    type: markdown_section
    title: 6. Single-Particle Trial Moves & The Two Classic MCMC Bugs
    body_markdown: "### How to Sample Continuous Coordinates: The Cube Move\nIn a continuous fluid or solid of $N$ atoms, how should we propose a trial move $s \\to s'$?\nAs shown on slide 12 of the lecture notes, we select **one particle $i$ at a time** and displace its position uniformly inside a cube of side length $\\Delta$ centered on its current coordinate $\\mathbf{r}_i$:\n$$\\mathbf{r}_i^{\\text{new}} = \\mathbf{r}_i^{\\text{old}} + \\Delta \\cdot (\\text{sprng}() - 0.5)$$\nwhere $\\text{sprng}()$ returns $3$ independent uniform random numbers on $(0, 1)$, so each Cartesian component shifts by $\\delta x, \\delta y, \\delta z \\in [-\\Delta/2, +\\Delta/2]$. Inside the cube, $T(\\mathbf{r}_i \\to \\mathbf{r}_i') = 1/\\Delta^3 = \\text{constant}$ (symmetric!).\n\n### Why Move One Particle at a Time Instead of All $N$ Particles?\n1. **$\\mathcal{O}(1)$ Local Energy Difference:** When only particle $i$ moves ($\\mathbf{r}_i \\to \\mathbf{r}_i'$ while $\\mathbf{r}_j' = \\mathbf{r}_j$\
      \ for all $j \\ne i$), all pair interactions $v(r_{jk})$ not involving particle $i$ cancel out of $\\Delta V = V(s') - V(s)$:\n   $$A(s \\to s') = \\min\\!\\left\\{1,\\; \\exp\\!\\left[-\\beta \\sum_{j \\ne i} \\big(v(|\\mathbf{r}_i' - \\mathbf{r}_j|) - v(|\\mathbf{r}_i - \\mathbf{r}_j|)\\big)\\right]\\right\\}$$\n   For a short-range potential with cutoff $r_c$, evaluating this sum requires checking only the $\\mathcal{O}(1)$ neighbors inside the cutoff sphere of atom $i$, rather than $\\mathcal{O}(N^2)$ pairs!\n2. **Much Higher Acceptance Ratio for the Same Displacement $\\Delta$:** If all $N$ particles are displaced simultaneously by cube width $\\Delta$, the typical energy change scales as $\\Delta E \\sim \\mathcal{O}(\\sqrt{N})$ (or $\\mathcal{O}(N)$), forcing the acceptance rate $e^{-\\beta \\Delta E}$ to plummet exponentially with $N$ unless $\\Delta$ is shrunk as $\\Delta \\propto N^{-1/2}$.\n\n### Structure of a General Monte Carlo Code (Slide 13)\n```python\ninitstate(s_old)\n\
      E_old = action(s_old)                  # Initialize the state and energy\nwhile True:\n    sample(s_old, s_new, T_new, 1)     # Propose s_new and get T_new = T(s_old -> s_new)\n    E_new = action(s_new)              # Compute trial energy/action\n    sample(s_new, s_old, T_old, 0)     # Find reverse prob T_old = T(s_new -> s_old) without moving!\n    A = exp(-E_new + E_old) * (T_old / T_new)\n    if A > sprng():                    # Accept the move with prob min(1, A)\n        s_old = s_new\n        E_old = E_new\n        naccept = naccept + 1\n    averages(s_old)                    # Collect statistics AFTER the if-block (counts rejected states too!)\n```\n\n### The Two Classic Errors in MCMC Implementations (Slide 14)\n1. **Violating Proposal Reversibility ($T(s \\to s') > 0$ while $T(s' \\to s) = 0$):**\n   If you can propose a move from $s$ to $s'$, **the reverse move from $s'$ to $s$ must also be possible!** For example, if a cube move is asymmetrically defined as $x' \\in [x,\
      \ x + \\Delta]$ (only positive shifts) or if $\\Delta(s)$ changes with state without overlapping $s$ from $s'$, then $T(s' \\to s) = 0$ and detailed balance $\\pi(s)T(s \\to s')A(s \\to s') = \\pi(s')T(s' \\to s)A(s' \\to s)$ is broken unless $A(s \\to s') = 0$. You should explicitly test that `sample(s_new, s_old, T_old, 0)` returns $T_{\\text{old}} > 0$.\n2. **Forgetting that Accepted and Rejected States Count the Same!**\n   Notice in the code above that `averages(s_old)` is called **outside** the `if A > sprng():` block! When a trial move $s_n \\to s'$ is **rejected**, the Markov chain advances to step $n+1$ with $s_{n+1} = s_n$, and **`s_old` must be accumulated into all ensemble averages again with full weight**. If you accidentally put `averages(s_old)` *inside* the `if` statement (accumulating only when a move is accepted), low-energy states—which reject uphill trial moves most often—are systematically under-counted, biasing $\\langle E \\rangle$ to artificially high values!\n"
  - id: concept_rejected_state_bug
    type: concept_cell
    title: 'Interactive Demo: Why Omitting Rejected States Destroys the Boltzmann Distribution'
    description_markdown: Vary the trial displacement width $\Delta$ and inverse temperature $\beta$ for a particle in a 1D harmonic trap $V(x) = \frac{1}{2}x^2$. Compare the exact Boltzmann distribution $\pi(x) \propto e^{-\beta V(x)}$ against a correct MCMC accumulator (which re-counts $s_{n+1} = s_n$ on rejection) and the buggy accumulator (which only records accepted moves).
    render_function: render_rejected_state_bug_demo
    layout: figure_left
    controls:
    - name: delta_step
      label: Proposal Half-Width Delta
      kind: slider
      min: 0.3
      max: 3.0
      step: 0.15
      default: 1.8
      format: .2f
    - name: beta
      label: Inverse Temperature beta = 1/(k_B T)
      kind: slider
      min: 0.4
      max: 2.5
      step: 0.1
      default: 1.0
      format: .2f
    takeaway_markdown: '**Key Takeaway:** At the bottom of a potential well ($x \approx 0$), almost every large trial displacement goes uphill in energy and is rejected. Counting only accepted moves starves the ground state of its rightful residence time $P(s \to s) = 1 - \sum_{s''\ne s} P(s \to s'')$, flattening the distribution and artificially inflating $\langle E \rangle$.'
  - id: q15_31_single_particle_cube_volume
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_single_particle_and_bugs
    prompt_markdown: 'In a 3D canonical Monte Carlo simulation, a single particle at $\mathbf{r}_i$ is displaced uniformly inside a cube of side length $\Delta = 0.50\text{ Å}$ via $\mathbf{r}_i'' = \mathbf{r}_i + \Delta(\mathbf{u} - 0.5)$. What is the constant proposal probability density $T(\mathbf{r}_i \to \mathbf{r}_i'') = 1/\Delta^3$ (in $\text{Å}^{-3}$) for any point $\mathbf{r}_i''$ inside that cube?

      '
    hint_markdown: Compute $1 / (0.50)^3$.
    correct:
      value: 8.0
      tolerance: 0.01
    rationale_markdown: The volume of the 3D trial cube is $\Delta^3 = (0.50\text{ Å})^3 = 0.125\text{ Å}^3$, so the uniform probability density inside the cube is $T(\mathbf{r}_i \to \mathbf{r}_i') = 1 / 0.125 = 8.0\text{ Å}^{-3}$.
  - id: q15_32_why_move_one_particle
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_single_particle_and_bugs
    prompt_markdown: Why do standard canonical Monte Carlo simulations of dense fluids move **one particle at a time** rather than displacing all $N$ particles simultaneously in a single trial step?
    hint_markdown: Consider both the computational cost of $\Delta V = V(s') - V(s)$ with a cutoff and how the acceptance ratio behaves when $N$ particles move at once.
    options:
    - id: a
      text: Moving one particle requires computing only $\mathcal{O}(1)$ local pair-energy differences within the cutoff range and maintains a much larger acceptance ratio for a given step size $\Delta$.
      text_markdown: Moving one particle requires computing only $\mathcal{O}(1)$ local pair-energy differences within the cutoff range and maintains a much larger acceptance ratio for a given step size $\Delta$.
    - id: b
      text: Moving more than one particle at a time violates the Markov property and detailed balance.
      text_markdown: Moving more than one particle at a time violates the Markov property and detailed balance.
    - id: c
      text: Moving all $N$ particles simultaneously always gives an acceptance probability of $A = 1.0$, which prevents rejection.
      text_markdown: Moving all $N$ particles simultaneously always gives an acceptance probability of $A = 1.0$, which prevents rejection.
    - id: d
      text: Single-particle moves allow exact calculation of real-time phonon dispersion curves.
      text_markdown: Single-particle moves allow exact calculation of real-time phonon dispersion curves.
    correct: a
    rationale_markdown: In a single-particle move, all pair terms $v(r_{jk})$ with $j,k \ne i$ cancel out of $\Delta V$, reducing the energy evaluation with a cutoff to $\mathcal{O}(1)$ operations, and avoiding the $\Delta E \sim \sqrt{N}$ acceptance collapse of global $N$-particle random displacements.
  - id: q15_33_mc_code_t_old_over_t_new
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_single_particle_and_bugs
    prompt_markdown: 'In the general Monte Carlo pseudocode from slide 13:

      ```python

      sample(s_old, s_new, T_new, 1)

      E_new = action(s_new)

      sample(s_new, s_old, T_old, 0)

      A = exp(-E_new + E_old) * (T_old / T_new)

      ```

      What is the purpose of the second call `sample(s_new, s_old, T_old, 0)` with flag `0`?

      '
    hint_markdown: Look at how `T_old` is used in `A = exp(-E_new + E_old) * (T_old / T_new)`.
    options:
    - id: a
      text: It evaluates the reverse proposal probability $T_{\text{old}} = T(s_{\text{new}} \to s_{\text{old}})$ without generating a new state, which is needed in the numerator of $A(s_{\text{old}} \to s_{\text{new}})$ whenever $T$ is asymmetric.
      text_markdown: It evaluates the reverse proposal probability $T_{\text{old}} = T(s_{\text{new}} \to s_{\text{old}})$ without generating a new state, which is needed in the numerator of $A(s_{\text{old}} \to s_{\text{new}})$ whenever $T$ is asymmetric.
    - id: b
      text: It immediately undoes the move and resets the coordinates back to `s_old` before testing acceptance.
      text_markdown: It immediately undoes the move and resets the coordinates back to `s_old` before testing acceptance.
    - id: c
      text: It sets the temperature $T_{\text{old}}$ to absolute zero ($0\text{ K}$).
      text_markdown: It sets the temperature $T_{\text{old}}$ to absolute zero ($0\text{ K}$).
    - id: d
      text: It computes the partition function $Z$ of the old configuration.
      text_markdown: It computes the partition function $Z$ of the old configuration.
    correct: a
    rationale_markdown: In `sample(s_old, s_new, T_new, 1)`, flag `1` samples `s_new` and computes $T_{\text{new}} = T(s_{\text{old}} \to s_{\text{new}})$. Flag `0` in `sample(s_new, s_old, T_old, 0)` queries the reverse transition probability density $T_{\text{old}} = T(s_{\text{new}} \to s_{\text{old}})$ so the asymmetric Metropolis-Hastings factor $T_{\text{old}} / T_{\text{new}}$ can be formed.
  - id: q15_34_bug_omitting_rejected_states_numeric
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_single_particle_and_bugs
    - concept_rejected_state_bug
    prompt_markdown: 'Suppose a post-equilibration MCMC trajectory runs for $5$ steps starting at energy $E_1 = 1.0\text{ eV}$:

      - Step 1: starts at $E_1 = 1.0\text{ eV}$.

      - Step 2: proposes $E'' = 4.0\text{ eV}$ $\to$ **REJECTED** ($s_2 = s_1$).

      - Step 3: proposes $E'' = 4.0\text{ eV}$ $\to$ **REJECTED** ($s_3 = s_2$).

      - Step 4: proposes $E'' = 2.0\text{ eV}$ $\to$ **ACCEPTED** ($s_4$ has $E_4 = 2.0\text{ eV}$).

      - Step 5: proposes $E'' = 5.0\text{ eV}$ $\to$ **REJECTED** ($s_5 = s_4$).


      What is the **correct** 5-step MCMC sample average of the energy $\langle E \rangle = \frac{1}{5}\sum_{n=1}^5 E(s_n)$ (in $\text{eV}$)?

      '
    hint_markdown: Write out the sequence of actual Markov states $(E(s_1), E(s_2), E(s_3), E(s_4), E(s_5)) = (1.0, 1.0, 1.0, 2.0, 2.0)$ and average all 5 values.
    correct:
      value: 1.4
      tolerance: 0.001
    rationale_markdown: Because rejected moves repeat the current state ($s_{n+1} = s_n$), the 5 states visited by the Markov chain have energies $(1.0, 1.0, 1.0, 2.0, 2.0)\text{ eV}$, giving $\langle E \rangle = (1.0 + 1.0 + 1.0 + 2.0 + 2.0)/5 = 7.0/5 = 1.40\text{ eV}$ (whereas the buggy accepted-only average of $1.0$ and $2.0$ would give $1.50\text{ eV}$).
  - id: q15_35_bug_omitting_rejected_bias_direction
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_single_particle_and_bugs
    - concept_rejected_state_bug
    prompt_markdown: If a student places `averages(s_old)` *inside* the `if A > sprng():` block so that properties are accumulated **only when a trial move is accepted**, what systematic error occurs in the measured canonical energy distribution $P(E)$?
    hint_markdown: 'Ask which states experience the highest rejection rate: deep energy minima or high-energy states?'
    options:
    - id: a
      text: Low-energy states (which reject a large fraction of uphill trial moves) are systematically under-weighted relative to high-energy states, shifting $P(E)$ and $\langle E \rangle$ toward artificially high energies.
      text_markdown: Low-energy states (which reject a large fraction of uphill trial moves) are systematically under-weighted relative to high-energy states, shifting $P(E)$ and $\langle E \rangle$ toward artificially high energies.
    - id: b
      text: High-energy states are under-weighted, causing the system to freeze into the $T = 0$ ground state.
      text_markdown: High-energy states are under-weighted, causing the system to freeze into the $T = 0$ ground state.
    - id: c
      text: No bias occurs in $\langle E \rangle$; it only reduces the number of samples and slightly increases the statistical error bar.
      text_markdown: No bias occurs in $\langle E \rangle$; it only reduces the number of samples and slightly increases the statistical error bar.
    - id: d
      text: The acceptance ratio becomes greater than $1.0$.
      text_markdown: The acceptance ratio becomes greater than $1.0$.
    correct: a
    rationale_markdown: In the correct Markov chain, a state $s$ with average acceptance probability $\bar{A}(s) < 1$ remains in place for a geometric mean residence time $1/\bar{A}(s)$ steps per visit. Recording only accepted entries gives every visit weight $1$ instead of $1/\bar{A}(s)$, starving low-energy states where $\bar{A}(s)$ is smallest.
  - id: q15_36_bug_non_reversible_proposal
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_single_particle_and_bugs
    prompt_markdown: A student writes a trial move in 1D as `x_new = x_old + Delta * sprng()` (forgetting the `- 0.5` offset, where `sprng()` $\in (0, 1)$), and then uses the standard symmetric acceptance test `A = min(1, exp(-beta * (E_new - E_old)))`. Which fundamental MCMC rule is violated?
    hint_markdown: If $x_{\text{new}} > x_{\text{old}}$, can this proposal ever generate $x_{\text{old}}$ starting from $x_{\text{new}}$?
    options:
    - id: a
      text: 'Proposal reversibility: $T(x \to x'') > 0$ for $x'' > x$, but the reverse proposal probability $T(x'' \to x) = 0$, violating detailed balance and driving an unphysical one-way drift.'
      text_markdown: 'Proposal reversibility: $T(x \to x'') > 0$ for $x'' > x$, but the reverse proposal probability $T(x'' \to x) = 0$, violating detailed balance and driving an unphysical one-way drift.'
    - id: b
      text: 'Row normalization: $\int T(x \to x'')\,dx''$ is no longer equal to $1$.'
      text_markdown: 'Row normalization: $\int T(x \to x'')\,dx''$ is no longer equal to $1$.'
    - id: c
      text: 'Energy conservation: potential energy is no longer a function of $x$.'
      text_markdown: 'Energy conservation: potential energy is no longer a function of $x$.'
    - id: d
      text: Nothing is violated as long as periodic boundary conditions are used.
      text_markdown: Nothing is violated as long as periodic boundary conditions are used.
    correct: a
    rationale_markdown: 'Slide 14''s Common Error #1 states: *''If you can move from $s$ to $s''$, the reverse move must also be possible.''* Without `- 0.5`, $x'' - x \in (0, \Delta)$ is strictly positive, so $T(x'' \to x) = 0$ and detailed balance $\pi(x)P(x \to x'') = \pi(x'')P(x'' \to x)$ is completely violated.'
  - id: sec_step_size_and_md_vs_mc
    type: markdown_section
    title: 7. Optimizing Step Size $\Delta$ & Comparing Monte Carlo vs. Molecular Dynamics
    body_markdown: "### How to Choose the Maximum Displacement Step Size $\\Delta$\nIn a single-particle cube move $\\mathbf{r}_i' = \\mathbf{r}_i + \\Delta(\\mathbf{u} - 0.5)$, the step size $\\Delta$ controls the average **acceptance ratio** ($\\text{a.r.}$):\n- **If $\\Delta \\to 0$ (tiny steps):** $\\Delta E \\to 0$, so the acceptance ratio approaches $\\text{a.r.} \\to 1.0$ ($100\\%$). However, the particles barely move at each step, so phase-space diffusion $\\langle \\Delta r^2 \\rangle \\propto \\Delta^2$ is extremely slow and serial correlation time $\\kappa$ is huge!\n- **If $\\Delta \\to \\infty$ (huge steps):** Almost every trial move lands on top of another atom's repulsive core ($\\Delta E \\gg k_B T$), so the acceptance ratio plummets to $\\text{a.r.} \\to 0$. The system stays frozen in the same state for thousands of steps!\n- **Practical Rule (Slide 15):**\n  - **Always measure the acceptance ratio!** Keep it inside the safe operating window:\n    $$0.1 < \\text{a.r.} <\
      \ 0.9$$\n  - **Rule of thumb:** Adjust $\\Delta$ during equilibration so that the acceptance ratio is roughly $\\text{a.r.} \\approx 0.5$.\n  - **Liquid Argon Benchmark (Slides 15–16):** In dense Lennard-Jones liquid Argon (Figs. 1–4 of the lecture notes), the $50\\%$ acceptance rule corresponds to $\\Delta/\\sigma \\approx 0.16$. However, measuring the 100-step mean-squared displacement $\\langle (\\mathbf{r}(i) - \\mathbf{r}(i+100))^2 \\rangle$ (Fig. 3) reveals that **a $20\\%$ acceptance ratio ($\\Delta/\\sigma \\approx 0.36$) actually achieves significantly faster spatial diffusion than a $50\\%$ acceptance ratio!**\n  - **Robustness of Local Quantities (Slide 16):** Meanwhile, the variance of a local quantity like the total potential energy $\\sigma_V$ (Fig. 4) is relatively insensitive to step size across a broad plateau $0.12 \\le \\Delta/\\sigma \\le 0.42$. *MC is a robust method—you don't need to fine-tune $\\Delta$ to three decimal places!*\n\n### Comprehensive Comparison:\
      \ Molecular Dynamics (MD) vs. Monte Carlo (MC)\nWhich method is better—MD or MC? As summarized on slide 18, **you need both!**\n\n| Feature / Capability | Molecular Dynamics (MD) | Metropolis Monte Carlo (MC) |\n| :--- | :--- | :--- |\n| **Real-time physical dynamics** | **Yes** — integrates Newton's equations to compute transport coefficients, time correlations $C(t)$, and vibrations. | **No** — generates stochastic Markov \"kinetics\" (useful for long-term diffusive processes in KMC, but not inertial dynamics). |\n| **Time-step / discretization error** | **Yes** — finite $\\Delta t$ causes symplectic shadow-Hamiltonian drift $\\mathcal{O}(\\Delta t^2)$ or $\\mathcal{O}(\\Delta t^4)$. | **Exact!** — no time-step truncation error for any step size $\\Delta > 0$! |\n| **Force evaluation required?** | **Yes** — requires $-\\nabla V(\\mathbf{R})$ at every step. | **No** — Classic Metropolis needs only energy differences $\\Delta V$ (simpler code, handles discontinuous hard spheres/square\
      \ wells). |\n| **Natural ensemble** | Microcanonical ($NVE$); requires thermostats/barostats for $NVT$/$NPT$. | Direct, exact simulation of **canonical ($NVT$)**, isothermal-isobaric ($NPT$), and **grand canonical ($\\mu VT$)** ensembles. |\n| **Discrete degrees of freedom** | **No** — requires continuous, differentiable coordinates. | **Yes** — naturally handles Ising spins, lattice gas models, alloy site swaps, and quantum Monte Carlo. |\n| **Ergodicity & non-physical moves** | Can be trapped by energy barriers or harmonic KAM tori; **however, collective MD is sometimes very effective in highly constrained/dense molecular systems.** | Ergodicity is provable in principle; **you can invent clever non-local transition rules** (atom swaps, cluster flips) to make $\\text{CPU time} / \\text{equilibration}$ orders of magnitude faster. |\n\n> **Best Practice (Slide 18):** Build **both MC and MD into the same simulation code** so you can **use MC (including non-local moves) to rapidly warm\
      \ up and equilibrate the configuration, then switch to MD to compute real-time dynamics!**\n"
  - id: concept_step_size_optimizer
    type: concept_cell
    title: 'Interactive Explorer: Step Size $\Delta/\sigma$, Acceptance Ratio & Diffusion Efficiency'
    description_markdown: 'Vary the trial cube width $\Delta/\sigma$ and temperature scale to explore the liquid-Argon tradeoff from slides 15–16: compare the acceptance ratio $A(\Delta/\sigma)$ against the 100-step mean-squared displacement $\langle \Delta r^2(100) \rangle$, comparing the $A = 0.50$ rule of thumb with the $A \approx 0.20$ peak diffusion regime.'
    render_function: render_metropolis_step_size_optimizer
    layout: figure_left
    controls:
    - name: delta_over_sigma
      label: Trial Cube Width Delta / sigma
      kind: slider
      min: 0.04
      max: 0.56
      step: 0.02
      default: 0.24
      format: .2f
    - name: temp_scale
      label: Relative Temperature Scale T / T_ref
      kind: slider
      min: 0.5
      max: 2.0
      step: 0.25
      default: 1.0
      format: .2f
    takeaway_markdown: '**Key Takeaway:** Neither $\Delta \to 0$ ($A \to 1$) nor $\Delta \to \infty$ ($A \to 0$) diffuses efficiently. While $A \approx 0.5$ ($\Delta/\sigma \approx 0.16$) is a safe rule of thumb, pushing $\Delta/\sigma \approx 0.36$ ($A \approx 0.20$) maximizes mean-squared displacement per CPU step in dense Lennard-Jones Argon.'
  - id: q15_37_step_size_extremes
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by:
    - sec_step_size_and_md_vs_mc
    - concept_step_size_optimizer
    prompt_markdown: Why is an acceptance ratio of $99.9\%$ ($\text{a.r.} = 0.999$) in a continuous-space Metropolis simulation just as undesirable as an acceptance ratio of $0.1\%$ ($\text{a.r.} = 0.001$)?
    hint_markdown: Ask how large the trial displacement $\Delta$ must be to get $99.9\%$ acceptance in a dense fluid.
    options:
    - id: a
      text: An acceptance ratio of $99.9\%$ means the trial step size $\Delta$ is tiny, so consecutive states are nearly identical and the random walk diffuses through phase space extremely slowly.
      text_markdown: An acceptance ratio of $99.9\%$ means the trial step size $\Delta$ is tiny, so consecutive states are nearly identical and the random walk diffuses through phase space extremely slowly.
    - id: b
      text: An acceptance ratio above $90\%$ violates detailed balance and produces a uniform distribution instead of a Boltzmann distribution.
      text_markdown: An acceptance ratio above $90\%$ violates detailed balance and produces a uniform distribution instead of a Boltzmann distribution.
    - id: c
      text: High acceptance ratios cause a finite-step-size truncation error $\mathcal{O}(\Delta^2)$ in the equilibrium ensemble.
      text_markdown: High acceptance ratios cause a finite-step-size truncation error $\mathcal{O}(\Delta^2)$ in the equilibrium ensemble.
    - id: d
      text: When $\text{a.r.} > 0.9$, the partition function $Z$ no longer cancels out.
      text_markdown: When $\text{a.r.} > 0.9$, the partition function $Z$ no longer cancels out.
    correct: a
    rationale_markdown: Detailed balance holds for any $\Delta > 0$ (no truncation error!), but $\text{a.r.} \approx 1$ occurs only when $\Delta \ll \sigma$, making the mean-squared displacement per step $\sim A(\Delta)\Delta^2$ tiny and the correlation time $\kappa$ huge.
  - id: q15_38_liquid_argon_diffusion_vs_50pct
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_step_size_and_md_vs_mc
    - concept_step_size_optimizer
    prompt_markdown: According to the liquid Argon benchmarks on slides 15–16 of the lecture notes, how does a $20\%$ acceptance ratio ($\Delta/\sigma \approx 0.36$) compare to the conventional $50\%$ rule-of-thumb acceptance ratio ($\Delta/\sigma \approx 0.16$)?
    hint_markdown: Compare Fig. 1 (acceptance probability) and Fig. 3 ($\langle (\mathbf{r}(i) - \mathbf{r}(i+100))^2 \rangle$) on slide 15.
    options:
    - id: a
      text: The $20\%$ acceptance ratio achieves higher 100-step mean-squared displacement (faster spatial diffusion) than the $50\%$ acceptance ratio because each accepted step covers more than twice the distance ($\Delta^2$ is $\sim 5\times$ larger).
      text_markdown: The $20\%$ acceptance ratio achieves higher 100-step mean-squared displacement (faster spatial diffusion) than the $50\%$ acceptance ratio because each accepted step covers more than twice the distance ($\Delta^2$ is $\sim 5\times$ larger).
    - id: b
      text: The $20\%$ acceptance ratio gives zero diffusion because $80\%$ of moves are rejected.
      text_markdown: The $20\%$ acceptance ratio gives zero diffusion because $80\%$ of moves are rejected.
    - id: c
      text: The $50\%$ acceptance ratio always maximizes diffusion in every physical system.
      text_markdown: The $50\%$ acceptance ratio always maximizes diffusion in every physical system.
    - id: d
      text: The variance of the potential energy $\sigma_V$ diverges at $20\%$ acceptance.
      text_markdown: The variance of the potential energy $\sigma_V$ diverges at $20\%$ acceptance.
    correct: a
    rationale_markdown: Because diffusive displacement scales roughly as $A(\Delta)\Delta^2$, increasing $\Delta/\sigma$ from $0.16$ ($A \approx 0.52$) to $0.36$ ($A \approx 0.20$) multiplies $\Delta^2$ by $(0.36/0.16)^2 \approx 5.06$ while $A$ drops by only a factor of $\sim 2.5$, yielding a higher net mean-squared displacement $\langle \Delta r^2(100) \rangle$.
  - id: q15_39_local_energy_variance_sensitivity
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_step_size_and_md_vs_mc
