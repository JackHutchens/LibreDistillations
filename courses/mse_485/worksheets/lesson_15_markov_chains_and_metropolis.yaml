  - id: sec_metropolis_hastings
    type: markdown_section
    title: 5. The Metropolis–Hastings Algorithm, Barker Rule & Peskun's Theorem
    body_markdown: "### Factoring Transition Probability into Proposal and Acceptance\nTo construct $P(s \\to s')$ in practice, the **Metropolis–Hastings method** factors each off-diagonal transition ($s' \\ne s$) into two stages:\n$$P(s \\to s') = T(s \\to s')\\, A(s \\to s')$$\n1. **Sampling / Proposal distribution $T(s \\to s')$:** The conditional probability of *generating* a trial state $s'$ given current state $s$ (with $\\sum_{s'} T(s \\to s') = 1$).\n2. **Acceptance probability $A(s \\to s') \\in [0, 1]$:** The conditional probability of *accepting* the proposed move $s \\to s'$. If rejected (with probability $1 - A(s \\to s')$), the system stays at $s_{n+1} = s$.\n\nSubstituting $P(s \\to s') = T(s \\to s') A(s \\to s')$ into the detailed balance condition $\\pi(s) P(s \\to s') = \\pi(s') P(s' \\to s)$ gives:\n$$\\frac{A(s \\to s')}{A(s' \\to s)} = \\frac{T(s' \\to s)\\, \\pi(s')}{T(s \\to s')\\, \\pi(s)} \\equiv q(s \\to s')$$\n\n### The Generalized Metropolis–Hastings Acceptance\
      \ Formula\nTo maximize the acceptance of moves while respecting $0 \\le A \\le 1$, Metropolis et al. (1953) and Hastings (1970) set the larger of $A(s \\to s')$ and $A(s' \\to s)$ to $1$, yielding:\n$$A_M(s \\to s') = \\min\\!\\left\\{1,\\; \\frac{T(s' \\to s)\\, \\pi(s')}{T(s \\to s')\\, \\pi(s)}\\right\\} = \\min\\{1, q\\}$$\n- **Crucial Property — Partition Function $Z$ Cancels!** Because $\\pi(s)$ enters only through the ratio $\\pi(s')/\\pi(s) = e^{-\\beta[E(s') - E(s)]}$, the intractable canonical partition function $Z = \\sum_s e^{-\\beta E(s)}$ **cancels out completely**!\n- **Classic Metropolis (Symmetric Proposal $T(s \\to s') = T(s' \\to s)$):** When the proposal distribution is symmetric (e.g., uniform displacement in a cube around the current position), $T(s' \\to s)/T(s \\to s') = 1$ and the acceptance probability simplifies to:\n  $$A_M(s \\to s') = \\min\\!\\left\\{1,\\; \\frac{\\pi(s')}{\\pi(s)}\\right\\} = \\min\\!\\left\\{1,\\; e^{-\\beta \\Delta E}\\right\\}, \\\
      qquad \\Delta E = E(s') - E(s)$$\n\n### Practical Implementation of the Rejection Step\nGiven $\\Delta E = E(s') - E(s)$ (for a symmetric proposal):\n- If $\\Delta E \\le 0$ (the trial move lowers or preserves energy), $e^{-\\beta \\Delta E} \\ge 1 \\implies A_M = 1$: **always accept**.\n- If $\\Delta E > 0$ (the trial move increases energy), draw a uniform random number $u_n \\in (0, 1)$:\n  - If $u_n < e^{-\\beta \\Delta E}$, **accept** the move ($s_{n+1} = s'$).\n  - If $u_n > e^{-\\beta \\Delta E}$, **reject** the move ($s_{n+1} = s$).\n\n### Alternative Solutions to Detailed Balance: Barker Rule & Peskun's Theorem\nDetailed balance only fixes the *ratio* $A(s \\to s')/A(s' \\to s) = q$. Other valid choices exist! Most famously, **Barker's (1965) / two-state Heat-Bath rule** sets:\n$$A_B(s \\to s') = \\frac{q}{1 + q} = \\frac{T(s' \\to s)\\pi(s')}{T(s \\to s')\\pi(s) + T(s' \\to s)\\pi(s')} \\xrightarrow{T\\text{ sym}} \\frac{\\pi(s')}{\\pi(s) + \\pi(s')} = \\frac{1}{1 + e^{\\\
      beta \\Delta E}}$$\nNotice that at $\\Delta E = 0$ ($q = 1$), Barker accepts only $A_B(1) = \\frac{1}{2}$ of neutral moves, whereas Metropolis accepts $A_M(1) = 1$. In fact, for every $q > 0$:\n$$A_M(q) = \\min(1, q) > \\frac{q}{1 + q} = A_B(q)$$\nBy **Peskun's Theorem (1973)**, because the Metropolis rule $A_M$ dominates every other valid pairwise acceptance rule element-by-element on all off-diagonal transitions ($P_M(s \\to s') \\ge P(s \\to s')$ for all $s \\ne s'$), **Metropolis minimizes the asymptotic variance of MCMC estimators** for any fixed proposal matrix $T$.\n"
  - id: concept_metropolis_vs_barker
