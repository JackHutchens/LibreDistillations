  - id: q15_22_why_partition_function_not_needed
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_metropolis_hastings
    prompt_markdown: Why can the Metropolis algorithm sample the canonical distribution $\pi(s) = \frac{1}{Z}e^{-\beta E(s)}$ without ever computing the partition function $Z = \sum_s e^{-\beta E(s)}$?
    hint_markdown: Inspect how $\pi(s)$ appears inside the acceptance formula $A(s \to s') = \min\left(1, \frac{T(s'\to s)\pi(s')}{T(s\to s')\pi(s)}\right)$.
    options:
    - id: a
      text: Because $A(s \to s')$ depends only on the ratio $\pi(s')/\pi(s)$, so the state-independent normalization constant $1/Z$ cancels out between numerator and denominator.
      text_markdown: Because $A(s \to s')$ depends only on the ratio $\pi(s')/\pi(s)$, so the state-independent normalization constant $1/Z$ cancels out between numerator and denominator.
    - id: b
      text: Because $Z = 1$ identically at all temperatures in the canonical ensemble.
      text_markdown: Because $Z = 1$ identically at all temperatures in the canonical ensemble.
    - id: c
      text: Because the proposal matrix $T(s \to s')$ is normalized by $Z$.
      text_markdown: Because the proposal matrix $T(s \to s')$ is normalized by $Z$.
    - id: d
      text: Because rejected moves automatically compute $Z$ at the end of the run.
      text_markdown: Because rejected moves automatically compute $Z$ at the end of the run.
    correct: a
    rationale_markdown: In $\frac{\pi(s')}{\pi(s)} = \frac{e^{-\beta E(s')}/Z}{e^{-\beta E(s)}/Z} = e^{-\beta[E(s') - E(s)]}$, the unknown normalization factor $Z$ cancels out identically.
  - id: q15_23_classic_metropolis_acceptance_calc
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_metropolis_hastings
    prompt_markdown: In a classic Metropolis simulation with a symmetric proposal ($T(s \to s') = T(s' \to s)$) at temperature $k_B T = 0.050\text{ eV}$, a trial move increases the system energy by $\Delta E = E(s') - E(s) = +0.075\text{ eV}$. What is the Metropolis acceptance probability $A_M(s \to s')$?
    hint_markdown: Compute $\beta \Delta E = \Delta E / (k_B T) = 0.075 / 0.050 = 1.5$ and evaluate $\exp(-1.5)$.
    correct:
      value: 0.2231
      tolerance: 0.002
    rationale_markdown: Here $\beta \Delta E = 0.075 / 0.050 = 1.5 > 0$, so $A_M = \min(1, e^{-1.5}) = e^{-1.5} \approx 0.2231$.
  - id: q15_24_downhill_move_acceptance
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_metropolis_hastings
    prompt_markdown: If a symmetric-proposal Metropolis move **lowers** the potential energy by $\Delta E = E(s') - E(s) = -0.12\text{ eV}$ at $k_B T = 0.025\text{ eV}$, what is the acceptance probability $A_M(s \to s')$?
    hint_markdown: Recall that $A_M = \min(1, e^{-\beta \Delta E})$ and probabilities cannot exceed $1$.
    correct:
      value: 1.0
      tolerance: 0.0001
    rationale_markdown: Since $\Delta E < 0$, $e^{-\beta \Delta E} = e^{+4.8} > 1$, so $A_M = \min(1, e^{-\beta \Delta E}) = 1.0$ (downhill moves are always accepted).
  - id: q15_25_udrn_rejection_criterion
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by:
    - sec_metropolis_hastings
    - concept_metropolis_vs_barker
    prompt_markdown: A trial move has $\beta \Delta E = +1.0$, giving $e^{-\beta \Delta E} \approx 0.3679$. The pseudorandom number generator returns a uniform variate $u_n = 0.52$ on $(0, 1)$. What does the Metropolis algorithm do?
    hint_markdown: Compare $u_n$ against $e^{-\beta \Delta E}$ using slide 11 of the lecture notes.
    options:
    - id: a
      text: Reject the move (since $u_n > e^{-\beta \Delta E}$), keeping $s_{n+1} = s_n$.
      text_markdown: Reject the move (since $u_n > e^{-\beta \Delta E}$), keeping $s_{n+1} = s_n$.
    - id: b
      text: Accept the move (since $u_n > e^{-\beta \Delta E}$), setting $s_{n+1} = s'$.
      text_markdown: Accept the move (since $u_n > e^{-\beta \Delta E}$), setting $s_{n+1} = s'$.
    - id: c
      text: Redraw $u_n$ repeatedly until $u_n < e^{-\beta \Delta E}$.
      text_markdown: Redraw $u_n$ repeatedly until $u_n < e^{-\beta \Delta E}$.
    - id: d
      text: Accept half of the displacement vector $\Delta \mathbf{r} / 2$.
      text_markdown: Accept half of the displacement vector $\Delta \mathbf{r} / 2$.
    correct: a
    rationale_markdown: To accept with probability $A = e^{-\beta \Delta E} \approx 0.3679$, we accept when $u_n < e^{-\beta \Delta E}$ and reject when $u_n > e^{-\beta \Delta E}$. Since $0.52 > 0.3679$, the move is rejected and $s_{n+1} = s_n$.
  - id: q15_26_asymmetric_metropolis_hastings_calc
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_metropolis_hastings
    prompt_markdown: 'In a generalized Metropolis–Hastings move with an **asymmetric** proposal distribution $T(s \to s'') \ne T(s'' \to s)$, suppose:

      - The forward proposal probability is $T(s \to s'') = 0.40$,

      - The reverse proposal probability is $T(s'' \to s) = 0.20$, and

      - The Boltzmann weight ratio is $\pi(s'')/\pi(s) = e^{-\beta \Delta E} = 1.50$.


      What is the Metropolis–Hastings acceptance probability $A_M(s \to s'')$?

      '
    hint_markdown: Evaluate $A_M(s \to s') = \min\!\left(1,\, \frac{T(s' \to s)\pi(s')}{T(s \to s')\pi(s)}\right)$.
    correct:
      value: 0.75
      tolerance: 0.001
    rationale_markdown: Substituting into the generalized ratio gives $q = \frac{T(s' \to s)}{T(s \to s')} \frac{\pi(s')}{\pi(s)} = \frac{0.20}{0.40} \times 1.50 = 0.50 \times 1.50 = 0.75$. Thus $A_M = \min(1, 0.75) = 0.75$. Even though the energy decreased ($\pi(s')/\pi(s) > 1$), the move can still be rejected because the forward proposal was twice as likely as the reverse proposal!
  - id: q15_27_barker_acceptance_calc
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_metropolis_hastings
    - concept_metropolis_vs_barker
    prompt_markdown: For a symmetric proposal $T(s \to s') = T(s' \to s)$ and an uphill energy change $\beta \Delta E = \ln(3) \approx 1.0986$ (so that $\pi(s')/\pi(s) = e^{-\beta \Delta E} = 1/3$), what is the acceptance probability $A_B(s \to s')$ under **Barker's acceptance rule** $A_B = \frac{\pi(s')}{\pi(s) + \pi(s')}$?
    hint_markdown: Evaluate $q / (1 + q)$ for $q = 1/3$.
    correct:
      value: 0.25
      tolerance: 0.001
    rationale_markdown: With $q = \pi(s')/\pi(s) = 1/3$, Barker's acceptance rule gives $A_B = \frac{q}{1 + q} = \frac{1/3}{1 + 1/3} = \frac{1}{4} = 0.25$ (compared to $A_M = 1/3 \approx 0.333$ for Metropolis).
  - id: q15_28_peskun_theorem_advantage
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_metropolis_hastings
    - concept_metropolis_vs_barker
    prompt_markdown: Consider a move between two degenerate states of identical energy ($\Delta E = 0$, symmetric proposal $T$). By how much does the Metropolis acceptance probability $A_M$ exceed the Barker acceptance probability $A_B$, and what does **Peskun's theorem** conclude from $A_M(q) \ge A_B(q)$?
    hint_markdown: Compare $A_M(1) = \min(1, 1)$ with $A_B(1) = 1/(1+1)$.
    options:
    - id: a
      text: $A_M = 1.0$ vs. $A_B = 0.5$ (twice as high at $\Delta E = 0$); by maximizing all off-diagonal transition probabilities $P(s \to s')$, Metropolis minimizes the asymptotic variance of sample averages for a fixed proposal $T$.
      text_markdown: $A_M = 1.0$ vs. $A_B = 0.5$ (twice as high at $\Delta E = 0$); by maximizing all off-diagonal transition probabilities $P(s \to s')$, Metropolis minimizes the asymptotic variance of sample averages for a fixed proposal $T$.
    - id: b
      text: $A_M = 0.5$ vs. $A_B = 1.0$; Barker's rule is always twice as fast as Metropolis.
      text_markdown: $A_M = 0.5$ vs. $A_B = 1.0$; Barker's rule is always twice as fast as Metropolis.
    - id: c
      text: $A_M$ and $A_B$ are identical at $\Delta E = 0$ and only differ when $\Delta E \to \infty$.
      text_markdown: $A_M$ and $A_B$ are identical at $\Delta E = 0$ and only differ when $\Delta E \to \infty$.
    - id: d
      text: Metropolis violates detailed balance at $\Delta E = 0$, whereas Barker satisfies it.
      text_markdown: Metropolis violates detailed balance at $\Delta E = 0$, whereas Barker satisfies it.
    correct: a
    rationale_markdown: At $\Delta E = 0$ ($q = 1$), $A_M(1) = 1$ while $A_B(1) = 0.5$. Because $A_M(q) \ge A_B(q)$ for all $q > 0$, Peskun's theorem proves that the Metropolis rule produces higher off-diagonal mobility and lower estimator variance than Barker's rule.
  - id: q15_29_infinite_temperature_limit
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_metropolis_hastings
    prompt_markdown: For a finite-energy system with a symmetric proposal $T(s \to s') = T(s' \to s)$ inside a periodic box, how does the Metropolis acceptance probability $A_M(s \to s') = \min(1, e^{-\beta \Delta E})$ behave in the high-temperature limit $T \to \infty$ ($\beta \to 0^+$) and low-temperature limit $T \to 0^+$ ($\beta \to \infty$)?
    hint_markdown: Evaluate $e^{-\beta \Delta E}$ as $\beta \to 0$ and as $\beta \to \infty$.
    options:
    - id: a
      text: As $T \to \infty$ ($\beta \to 0$), $A_M \to 1$ for all finite-energy moves (unbiased random walk); as $T \to 0$ ($\beta \to \infty$), $A_M \to 0$ for uphill moves ($\Delta E > 0$) and $A_M = 1$ for downhill moves ($\Delta E \le 0$, greedy quench).
      text_markdown: As $T \to \infty$ ($\beta \to 0$), $A_M \to 1$ for all finite-energy moves (unbiased random walk); as $T \to 0$ ($\beta \to \infty$), $A_M \to 0$ for uphill moves ($\Delta E > 0$) and $A_M = 1$ for downhill moves ($\Delta E \le 0$, greedy quench).
    - id: b
      text: As $T \to \infty$, $A_M \to 0$; as $T \to 0$, $A_M \to 1$ for all moves.
      text_markdown: As $T \to \infty$, $A_M \to 0$; as $T \to 0$, $A_M \to 1$ for all moves.
    - id: c
      text: As $T \to \infty$, $A_M \to 0.5$; as $T \to 0$, $A_M \to 0.5$.
      text_markdown: As $T \to \infty$, $A_M \to 0.5$; as $T \to 0$, $A_M \to 0.5$.
    - id: d
      text: Temperature has no effect on $A_M$ because $\beta$ cancels out with $Z$.
      text_markdown: Temperature has no effect on $A_M$ because $\beta$ cancels out with $Z$.
    correct: a
    rationale_markdown: When $\beta \to 0$, $e^{-\beta \Delta E} \to 1$ so all non-infinite-energy moves are accepted. When $\beta \to \infty$, $e^{-\beta \Delta E} \to 0$ for any $\Delta E > 0$, reducing Metropolis to steepest-descent energy minimization.
  - id: q15_30_hard_sphere_metropolis
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_metropolis_hastings
    prompt_markdown: In the original 1953 Metropolis et al. study of a **hard-sphere liquid** ($v(r) = \infty$ if $r < \sigma$, and $v(r) = 0$ if $r \ge \sigma$), what does the canonical acceptance rule $A_M(s \to s') = \min(1, e^{-\beta \Delta E})$ reduce to?
    hint_markdown: In a hard-sphere fluid Starting from a valid non-overlapping state, a trial move either creates an overlap ($\Delta E = +\infty$) or no overlap ($\Delta E = 0$).
    options:
    - id: a
