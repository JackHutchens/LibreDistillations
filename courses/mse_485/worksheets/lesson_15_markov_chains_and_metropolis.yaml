      text_markdown: All eigenvalues of $P$ become strictly negative ($\varepsilon_\lambda < 0$).
    - id: c
      text: The largest eigenvalue exceeds unity ($\varepsilon_0 = 3$).
      text_markdown: The largest eigenvalue exceeds unity ($\varepsilon_0 = 3$).
    - id: d
      text: The transition matrix $P$ has no eigenvectors at all.
      text_markdown: The transition matrix $P$ has no eigenvectors at all.
    correct: a
    rationale_markdown: When state space decomposes into $k$ disconnected ergodic components, each component has its own stationary eigenvector with eigenvalue $\varepsilon = 1$, making $\varepsilon = 1$ $k$-fold degenerate.
