      text_markdown: Local energy variance can only be measured in Molecular Dynamics, not Monte Carlo.
    correct: a
    rationale_markdown: 'Slide 16 emphasizes that the variance of the potential energy (a local quantity) exhibits a broad flat plateau across $0.12 \le \Delta/\sigma \le 0.42$: *''Variance of energy (local quantity) is not as sensitive to step size. MC is a robust method! You don''t need to fine tune things!''*'
  - id: q15_40_no_timestep_error_in_mc
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_step_size_and_md_vs_mc
    prompt_markdown: In Molecular Dynamics, increasing the time step $\Delta t$ introduces systematic $\mathcal{O}(\Delta t^2)$ discretization errors into equilibrium averages. If you double the trial cube width $\Delta$ in an ergodic Metropolis Monte Carlo simulation (say from $\Delta = 0.15\sigma$ to $\Delta = 0.30\sigma$), what systematic discretization error is introduced into the converged equilibrium average $\langle A \rangle$?
    hint_markdown: Does the detailed balance equation $\pi(s)P(s \to s') = \pi(s')P(s' \to s)$ make any small-$\Delta$ Taylor approximation?
    options:
    - id: a
      text: 'Zero systematic discretization error: Metropolis MC is exact for any ergodic step size $\Delta > 0$ because the acceptance test enforces exact detailed balance for the true Boltzmann distribution $\pi(s)$.'
      text_markdown: 'Zero systematic discretization error: Metropolis MC is exact for any ergodic step size $\Delta > 0$ because the acceptance test enforces exact detailed balance for the true Boltzmann distribution $\pi(s)$.'
    - id: b
      text: The systematic error quadruples as $\mathcal{O}(\Delta^2)$, just like Verlet MD.
      text_markdown: The systematic error quadruples as $\mathcal{O}(\Delta^2)$, just like Verlet MD.
    - id: c
      text: The systematic error doubles as $\mathcal{O}(\Delta)$.
      text_markdown: The systematic error doubles as $\mathcal{O}(\Delta)$.
    - id: d
      text: Doubling $\Delta$ doubles the simulated temperature $T$.
      text_markdown: Doubling $\Delta$ doubles the simulated temperature $T$.
    correct: a
    rationale_markdown: 'As stated on slides 14 and 18 (*''Exact: no time step error''*), detailed balance $\pi(s)T(s \to s'')A(s \to s'') = \pi(s'')T(s'' \to s)A(s'' \to s)$ holds **exactly** for any finite displacement width $\Delta$. Changing $\Delta$ only affects the statistical correlation time $\kappa$, never the exactness of the stationary distribution $\pi(s)$.'
  - id: q15_41_md_vs_mc_capabilities
    type: problem
    question_type: multi_select
    difficulty: medium
    taught_by: sec_step_size_and_md_vs_mc
    prompt_markdown: 'Select **all** accurate statements comparing **Metropolis Monte Carlo (MC)** and **Molecular Dynamics (MD)** from slide 18:'
    hint_markdown: Check each statement against the MD vs. MC comparison on slide 18.
    options:
    - id: a
      text: MD computes true physical real-time dynamics (e.g., velocity autocorrelation and vibrations), whereas MC generates stochastic Markov kinetics.
      text_markdown: MD computes true physical real-time dynamics (e.g., velocity autocorrelation and vibrations), whereas MC generates stochastic Markov kinetics.
    - id: b
      text: Classic MC is simpler than MD because it requires no forces (only energy differences), has no time-step discretization error, and directly samples the canonical ($NVT$) ensemble.
      text_markdown: Classic MC is simpler than MD because it requires no forces (only energy differences), has no time-step discretization error, and directly samples the canonical ($NVT$) ensemble.
    - id: c
      text: MC is more general for discrete degrees of freedom (such as Ising spin models, alloy species swaps, and grand canonical particle insertions) where continuous MD forces are undefined.
      text_markdown: MC is more general for discrete degrees of freedom (such as Ising spin models, alloy species swaps, and grand canonical particle insertions) where continuous MD forces are undefined.
    - id: d
      text: Combining both in the same code allows you to use fast, non-local MC moves to warm up (equilibrate) the structure and then switch to MD to measure real-time dynamics.
      text_markdown: Combining both in the same code allows you to use fast, non-local MC moves to warm up (equilibrate) the structure and then switch to MD to measure real-time dynamics.
    correct:
    - a
    - b
    - c
    - d
    rationale_markdown: 'All four statements are key takeaways from slide 18: MD gives real-time dynamics (and excels in highly constrained collective motion), while MC is exact (no $\Delta t$ error), force-free, handles discrete/grand-canonical variables, allows custom transition rules, and serves as an ideal warmup engine for MD.'
  - id: q15_42_preview_force_bias_idea
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_step_size_and_md_vs_mc
    prompt_markdown: 'On slide 17 (*"Optimizing the moves"*), we preview how to go beyond blind uniform cube moves by expanding the potential around the current position $\mathbf{r}_0$:

      $$V(\mathbf{r}) \approx V(\mathbf{r}_0) - \mathbf{F}(\mathbf{r}_0)\cdot(\mathbf{r} - \mathbf{r}_0)$$

      and choosing a biased proposal distribution $T(s \to s'') \propto \exp\big[\lambda \beta \mathbf{F}(\mathbf{r}_0)\cdot(\mathbf{r} - \mathbf{r}_0)\big]$. Why must we use the **generalized** Metropolis–Hastings acceptance formula $A(s \to s'') = \min\!\left(1, \frac{T(s''\to s)\pi(s'')}{T(s\to s'')\pi(s)}\right)$ when we do this?

      '
    hint_markdown: Ask whether $T(\mathbf{r}_0 \to \mathbf{r})$ equals $T(\mathbf{r} \to \mathbf{r}_0)$ when the proposal is pushed along the local force $\mathbf{F}$.
    options:
    - id: a
      text: Because biasing the proposal in the direction of the downhill force makes $T(s \to s') \ne T(s' \to s)$ asymmetric, so the proposal ratio $T(s' \to s)/T(s \to s')$ must be included in $A(s \to s')$ to preserve exact detailed balance.
      text_markdown: Because biasing the proposal in the direction of the downhill force makes $T(s \to s') \ne T(s' \to s)$ asymmetric, so the proposal ratio $T(s' \to s)/T(s \to s')$ must be included in $A(s \to s')$ to preserve exact detailed balance.
    - id: b
      text: Because any use of forces in Monte Carlo makes the partition function $Z$ depend on the step number $n$.
      text_markdown: Because any use of forces in Monte Carlo makes the partition function $Z$ depend on the step number $n$.
    - id: c
      text: Because $T(s \to s')$ is still symmetric ($T(s \to s') = T(s' \to s)$), so the $T$ factors cancel out anyway.
      text_markdown: Because $T(s \to s')$ is still symmetric ($T(s \to s') = T(s' \to s)$), so the $T$ factors cancel out anyway.
    - id: d
      text: Because Force-Bias Monte Carlo does not use rejections.
      text_markdown: Because Force-Bias Monte Carlo does not use rejections.
    correct: a
    rationale_markdown: Pushing proposals downhill along $\mathbf{F}(\mathbf{r}_0)$ makes forward downhill moves much more probable to propose than reverse uphill moves ($T(s \to s') > T(s' \to s)$). Including $T(s' \to s)/T(s \to s')$ in the Metropolis-Hastings acceptance test compensates for this bias and restores exact Boltzmann sampling—the central theme of Lesson 16!
