worksheet:
  id: lesson_15_markov_chains_and_metropolis
  title: 'MSE 485 · Lesson 15: Markov Chains, Detailed Balance & Metropolis Monte Carlo'
  estimated_minutes: 115
  learning_objectives:
  - Explain why direct importance sampling fails exponentially as exp(-aN) in high-dimensional configuration space and how Markov Chain Monte Carlo (MCMC) overcomes this barrier.
  - Formulate a discrete-time Markov chain via a stochastic transition matrix P(s -> s') and evolve state distributions using the master equation f_{n+1} = f_n P.
  - Connect the eigenvalue spectrum of P to stationary equilibrium (eps_0 = 1), geometric convergence (|eps_1|^n), equilibration time tau_eq, and the three failure modes of ergodicity.
  - Solve the 2-state computer reliability Markov chain analytically and iteratively for its transient evolution, stationary distribution pi(infinity), and spectral gap.
  - Derive the Metropolis-Hastings acceptance criterion from detailed balance, compare it with Barker/Heat-Bath acceptance via Peskun's theorem, and explain why the partition function Z cancels.
  - Analyze single-particle canonical trial moves, diagnose the two classic MCMC implementation bugs, tune step size Delta for optimal phase-space diffusion, and contrast MC with MD.
  sections:
  - id: sec_markov_master
    type: markdown_section
    title: 1. Why Direct Sampling Fails & The Markov Chain Master Equation
    body_markdown: "In Lesson 14 we saw that Monte Carlo integration estimates high-dimensional expectation values by drawing configurations from a probability distribution. However, in statistical mechanics we almost never know how to sample the canonical Boltzmann distribution $\\pi(s) = \\frac{1}{Z}e^{-\\beta E(s)}$ directly when $3N \\gg 1$.\n\n### The Exponential Overlap Catastrophe in Direct Sampling\nSuppose we attempt **direct importance sampling** by drawing configurations independently from a simpler reference distribution $g(s)$ (such as a uniform distribution or an ideal gas) and reweighting by $\\pi(s)/g(s)$. Because configuration space has $3N$ degrees of freedom, the overlap between any tractable reference distribution $g(s)$ and the true interacting Boltzmann distribution $\\pi(s)$ decays **exponentially with system size**:\n$$\\text{Overlap}(\\pi, g) \\sim \\exp(-a N)$$\nwhere $a > 0$ is an intensive constant related to the excess free energy per particle. Consequently,\
      \ almost every randomly generated configuration lands in a region of core overlap where $e^{-\\beta E(s)} \\approx 0$, and the statistical error bars grow **exponentially** as $\\sim e^{+aN/2}$.\n\n### Markov Chains: Memoryless Random Walks Through Phase Space\nIntroduced by **Metropolis, Rosenbluth, Rosenbluth, Teller, and Teller (1953)** on the Los Alamos MANIAC computer to calculate the equation of state of a 2D hard-sphere liquid, **Markov Chain Monte Carlo (MCMC)** replaces independent guessing with an importance-weighted **random walk** through configuration space:\n$$s_1 \\to s_2 \\to s_3 \\to \\cdots \\to s_n \\to s_{n+1} \\to \\cdots$$\nHere $s$ denotes a complete microstate of the system (e.g., all $3N$ particle coordinates $\\mathbf{R} = \\{\\mathbf{r}_1, \\dots, \\mathbf{r}_N\\}$ or all $N$ lattice spins).\n\nBy definition, a discrete-time **Markov chain** is governed by a time-independent conditional **transition probability** $P(s \\to s')$: the probability distribution\
      \ of the next state $s_{n+1}$ depends **only** on the current state $s_n$ and not on any earlier history $s_1, \\dots, s_{n-1}$ (*\"a drunkard has no memory!\"*).\n\n### Properties of the Stochastic Transition Matrix $P$\nThe matrix $P$ with entries $P_{s,s'} = P(s \\to s')$ is a **right stochastic matrix**, meaning it must satisfy two fundamental axioms:\n1. **Non-negativity:** Every transition probability is real and non-negative:\n   $$P(s \\to s') \\ge 0 \\quad \\forall\\, s, s'$$\n2. **Row Normalization (Conservation of Probability):** From any starting state $s$, the system must transition *somewhere* (including possibly staying in the same state $s' = s$) with total probability $1$:\n   $$\\sum_{s'} P(s \\to s') = 1 \\quad \\forall\\, s$$\n\n### The Discrete-Time Master Equation\nLet $f_n(s)$ denote the probability that the system occupies microstate $s$ after $n$ steps of the random walk (represented as a **row vector** $f_n$). After one additional step, the probability distribution\
      \ $f_{n+1}(s')$ is obtained by summing over all possible predecessor states $s$:\n$$f_{n+1}(s') = \\sum_{s} f_n(s)\\, P(s \\to s') \\qquad \\Longleftrightarrow \\qquad f_{n+1} = f_n P$$\nIterating this **master equation** $n$ times from an initial distribution $f_0$ yields:\n$$f_n = f_0 P^n$$\nwhere $P^n$ is the $n$-step transition matrix. Stationary (invariant) states of the random walk are **left eigenvectors** $\\phi$ of $P$:\n$$\\phi P = \\varepsilon \\phi$$\nwith eigenvalue $\\varepsilon = 1$. Notice simultaneously that the column vector of ones $\\mathbf{1} = (1, 1, \\dots, 1)^T$ is always a **right eigenvector** of $P$ with eigenvalue $1$ because $\\sum_{s'} P(s \\to s')\\cdot 1 = 1$.\n"
  - id: q15_01_direct_sampling_overlap
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_markov_master
    prompt_markdown: Why does direct importance sampling from a non-interacting reference distribution $g(s)$ fail for a dense fluid of $N \sim 10^3$ interacting atoms?
    hint_markdown: Consider how the probability overlap between two different many-body distributions scales with the number of particles $N$.
    options:
    - id: a
      text: The overlap between the reference distribution and the true Boltzmann distribution decays exponentially as $\exp(-aN)$, causing variance and error bars to blow up exponentially with $N$.
      text_markdown: The overlap between the reference distribution and the true Boltzmann distribution decays exponentially as $\exp(-aN)$, causing variance and error bars to blow up exponentially with $N$.
    - id: b
      text: Random number generators cannot produce more than $3N$ independent uniform variates without repeating their period.
      text_markdown: Random number generators cannot produce more than $3N$ independent uniform variates without repeating their period.
    - id: c
      text: Direct sampling violates Liouville's theorem because it does not integrate Newton's equations of motion.
      text_markdown: Direct sampling violates Liouville's theorem because it does not integrate Newton's equations of motion.
    - id: d
      text: The normalization constant of a uniform reference distribution $g(s) = V^{-N}$ cannot be computed analytically.
      text_markdown: The normalization constant of a uniform reference distribution $g(s) = V^{-N}$ cannot be computed analytically.
    correct: a
    rationale_markdown: In a $3N$-dimensional configuration space, each independent coordinate contributes a multiplicative factor $< 1$ to the overlap between $g(s)$ and $\pi(s)$, yielding an overlap of order $\exp(-aN)$ and exponentially growing error bars as $N$ increases.
  - id: q15_02_markov_memoryless_property
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_markov_master
    prompt_markdown: Which mathematical statement defines the **Markov property** (*'a drunkard has no memory'*) for a sequence of states $s_1 \to s_2 \to \cdots \to s_n \to s_{n+1}$?
    hint_markdown: Condition the probability of $s_{n+1}$ on the entire history $s_1, s_2, \dots, s_n$.
    options:
    - id: a
      text: $\mathbb{P}(s_{n+1} \mid s_n, s_{n-1}, \dots, s_1) = \mathbb{P}(s_{n+1} \mid s_n) = P(s_n \to s_{n+1})$
      text_markdown: $\mathbb{P}(s_{n+1} \mid s_n, s_{n-1}, \dots, s_1) = \mathbb{P}(s_{n+1} \mid s_n) = P(s_n \to s_{n+1})$
    - id: b
      text: $\mathbb{P}(s_{n+1} \mid s_n) = \mathbb{P}(s_{n+1})$ independent of $s_n$
      text_markdown: $\mathbb{P}(s_{n+1} \mid s_n) = \mathbb{P}(s_{n+1})$ independent of $s_n$
    - id: c
      text: $P(s \to s') = P(s' \to s)$ for all pairs of states $s, s'$
      text_markdown: $P(s \to s') = P(s' \to s)$ for all pairs of states $s, s'$
    - id: d
      text: $s_{n+1}$ is never allowed to equal $s_n$ or $s_{n-1}$
      text_markdown: $s_{n+1}$ is never allowed to equal $s_n$ or $s_{n-1}$
    correct: a
    rationale_markdown: A Markov chain is defined by the conditional independence of the next state $s_{n+1}$ from all past states $s_1, \dots, s_{n-1}$ given the present state $s_n$.
  - id: q15_03_stochastic_matrix_normalization
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_markov_master
    prompt_markdown: In the convention where $f_n$ is a row vector evolving via $f_{n+1}(s') = \sum_s f_n(s) P(s \to s')$, which normalization condition must every valid transition matrix $P(s \to s')$ satisfy?
    hint_markdown: Sum over all possible destination states $s'$ starting from a fixed current state $s$.
    options:
    - id: a
      text: $P(s \to s') \ge 0$ and $\sum_{s'} P(s \to s') = 1$ for every initial state $s$ (row normalization).
      text_markdown: $P(s \to s') \ge 0$ and $\sum_{s'} P(s \to s') = 1$ for every initial state $s$ (row normalization).
    - id: b
      text: $P(s \to s') \ge 0$ and $\sum_{s} P(s \to s') = 1$ for every final state $s'$ (column normalization).
      text_markdown: $P(s \to s') \ge 0$ and $\sum_{s} P(s \to s') = 1$ for every final state $s'$ (column normalization).
    - id: c
      text: $\sum_{s, s'} P(s \to s') = 1$ across the entire matrix.
      text_markdown: $\sum_{s, s'} P(s \to s') = 1$ across the entire matrix.
    - id: d
      text: $\sum_{s} [P(s \to s')]^2 = 1$ (unitary normalization).
      text_markdown: $\sum_{s} [P(s \to s')]^2 = 1$ (unitary normalization).
    correct: a
    rationale_markdown: 'Because the system in state $s$ must transition to some state $s''$ (including $s''=s$) on step $n+1$, the outgoing probabilities across each row $s$ must be non-negative and sum to $1$: $\sum_{s''} P(s \to s'') = 1$.'
  - id: q15_04_probability_conservation_proof
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_markov_master
    prompt_markdown: Suppose $\sum_s f_n(s) = 1$. When we sum the master equation $f_{n+1}(s') = \sum_s f_n(s) P(s \to s')$ over all destination states $s'$, why is total probability $\sum_{s'} f_{n+1}(s') = 1$ automatically conserved at step $n+1$?
    hint_markdown: Interchange the order of summation over $s$ and $s'$.
    options:
    - id: a
      text: Because $\sum_{s'} f_{n+1}(s') = \sum_s f_n(s) \left[\sum_{s'} P(s \to s')\right] = \sum_s f_n(s) \cdot 1 = 1$.
      text_markdown: Because $\sum_{s'} f_{n+1}(s') = \sum_s f_n(s) \left[\sum_{s'} P(s \to s')\right] = \sum_s f_n(s) \cdot 1 = 1$.
    - id: b
      text: Because $P(s \to s')$ is always a symmetric matrix ($P = P^T$).
      text_markdown: Because $P(s \to s')$ is always a symmetric matrix ($P = P^T$).
    - id: c
      text: Because the trace of $P$ equals $1$ ($\operatorname{Tr}(P) = 1$).
      text_markdown: Because the trace of $P$ equals $1$ ($\operatorname{Tr}(P) = 1$).
    - id: d
      text: Because $\det(P) = 1$ for every stochastic matrix.
      text_markdown: Because $\det(P) = 1$ for every stochastic matrix.
    correct: a
    rationale_markdown: Summing over $s'$ first uses row normalization $\sum_{s'} P(s \to s') = 1$ for every $s$, leaving $\sum_s f_n(s) = 1$. Neither symmetry ($P=P^T$) nor $\det(P)=1$ is required.
  - id: q15_05_missing_matrix_entry
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_markov_master
    prompt_markdown: 'A 3-state Markov chain has the transition matrix:

      $$P = \begin{pmatrix} 0.50 & 0.35 & p_{13} \\ 0.20 & 0.60 & 0.20 \\ 0.10 & 0.40 & 0.50 \end{pmatrix}$$

      What must the value of $p_{13} = P(1 \to 3)$ be for $P$ to be a valid stochastic matrix?

      '
    hint_markdown: Apply row normalization $\sum_{s'=1}^3 P(1 \to s') = 1$ to the first row.
    correct:
      value: 0.15
      tolerance: 0.001
    rationale_markdown: Row normalization requires $0.50 + 0.35 + p_{13} = 1.00$, so $p_{13} = 1.00 - 0.85 = 0.15$.
  - id: q15_06_left_vs_right_eigenvector
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_markov_master
    prompt_markdown: For a general asymmetric stochastic matrix $P(s \to s')$, how do the **left** and **right** eigenvectors corresponding to the unit eigenvalue $\varepsilon_0 = 1$ differ physically?
    hint_markdown: Compare $\pi P = \pi$ (row vector) with $P \mathbf{1} = \mathbf{1}$ (column vector).
    options:
    - id: a
      text: The left eigenvector $\pi P = \pi$ gives the stationary probability distribution over states, whereas the right eigenvector $P \mathbf{1} = \mathbf{1}$ is trivially the uniform column vector of ones expressing row normalization.
      text_markdown: The left eigenvector $\pi P = \pi$ gives the stationary probability distribution over states, whereas the right eigenvector $P \mathbf{1} = \mathbf{1}$ is trivially the uniform column vector of ones expressing row normalization.
    - id: b
      text: The right eigenvector gives the stationary distribution, whereas the left eigenvector is always uniform.
      text_markdown: The right eigenvector gives the stationary distribution, whereas the left eigenvector is always uniform.
    - id: c
      text: The left and right eigenvectors of $P$ are always identical because every stochastic matrix is Hermitian.
      text_markdown: The left and right eigenvectors of $P$ are always identical because every stochastic matrix is Hermitian.
    - id: d
      text: The right eigenvector gives the relaxation rate, whereas the left eigenvector gives the partition function $Z$.
      text_markdown: The right eigenvector gives the relaxation rate, whereas the left eigenvector gives the partition function $Z$.
    correct: a
    rationale_markdown: Row normalization $\sum_{s'} P(s \to s') = 1$ means $P \mathbf{1} = \mathbf{1}$ for any right stochastic matrix, whereas the non-trivial equilibrium distribution $\pi(s)$ is the left eigenvector satisfying $\sum_s \pi(s) P(s \to s') = \pi(s')$ ($\pi P = \pi$).
  - id: sec_ergodicity_spectrum
    type: markdown_section
    title: 2. Spectral Decomposition, Convergence Rate & Ergodicity
    body_markdown: "How do we know whether iterating $f_{n+1} = f_n P$ will actually converge to the desired equilibrium distribution $\\pi(s)$, and how many \"warmup\" (equilibration) steps are required?\n\n### Spectral Decomposition of the Master Equation\nExpanding the initial probability distribution $f_0(s)$ in the basis of left eigenvectors $\\phi_\\lambda(s)$ of $P$ (where $\\phi_\\lambda P = \\varepsilon_\\lambda \\phi_\\lambda$), the state distribution after $n$ steps is:\n$$f_n(s) = \\pi(s) + \\sum_{\\lambda \\ge 1} \\varepsilon_\\lambda^n\\, c_\\lambda\\, \\phi_\\lambda(s)$$\nBecause $P(s \\to s') \\ge 0$ and $\\sum_{s'} P(s \\to s') = 1$, the **Perron–Frobenius theorem** guarantees that:\n- All eigenvalues satisfy $|\\varepsilon_\\lambda| \\le 1$.\n- Every stationary equilibrium distribution corresponds to an eigenvalue $\\varepsilon = 1$.\n- If the Markov chain is **ergodic**, then $\\varepsilon_0 = 1$ is **non-degenerate** (unique), and every other eigenvalue satisfies the\
      \ strict inequality:\n  $$1 = \\varepsilon_0 > |\\varepsilon_1| \\ge |\\varepsilon_2| \\ge \\cdots$$\n\n### Geometric Convergence & Warmup Time $\\tau_{\\text{eq}}$\nWhen $|\\varepsilon_\\lambda| < 1$ for all $\\lambda \\ge 1$, the transient terms $\\varepsilon_\\lambda^n$ decay **geometrically** to zero as $n \\to \\infty$, so $f_n(s) \\to \\pi(s)$ from *any* initial state $f_0(s)$. At large $n$, convergence is controlled by the **second-largest eigenvalue in magnitude**, $|\\varepsilon_1|$:\n$$|f_n(s) - \\pi(s)| \\sim |\\varepsilon_1|^n = \\exp\\!\\left(n \\ln|\\varepsilon_1|\\right) = \\exp\\!\\left(-\\frac{n}{\\tau_{\\text{eq}}}\\right)$$\nDefining the characteristic **relaxation (or equilibration) time** $\\tau_{\\text{eq}}$ in units of Markov steps gives:\n$$\\tau_{\\text{eq}} = -\\frac{1}{\\ln|\\varepsilon_1|} \\approx \\frac{1}{1 - |\\varepsilon_1|} \\quad \\text{(when } |\\varepsilon_1| \\to 1^-\\text{)}$$\nIf $|\\varepsilon_1|$ is very close to $1$ (a small **spectral gap**\
      \ $1 - |\\varepsilon_1| \\ll 1$, typical of high free-energy barriers or phase coexistence), $\\tau_{\\text{eq}}$ becomes enormous and the walk suffers from **slow mixing** (critical or glassy slowing down).\n\n### The Three Conditions for Ergodicity (and Their Failure Modes)\nIn contrast to deterministic Molecular Dynamics (where proving ergodicity for a general Hamiltonian is notoriously difficult, as shown by the FPU paradox and KAM theorem), **ergodicity of a Markov chain can be proven rigorously** if three conditions hold:\n1. **Irreducibility (Connectedness / No Infinite Barriers):** One can move from any state $s$ to any other state $s'$ in a finite number of steps with non-zero probability ($P^k(s \\to s') > 0$ for some finite $k$).\n   - *Failure Mode 1 (Reducible / Disconnected Space):* If phase space is split into disconnected pockets by infinite energy barriers or restrictive move rules, the eigenvalue $\\varepsilon = 1$ becomes **degenerate** (multiple linearly independent\
      \ stationary distributions), and the final distribution depends permanently on where the walk was initialized!\n2. **Aperiodicity (Non-Periodic Transition Rules):** The return times to any state are not restricted to integer multiples of a period $p \\ge 2$.\n   - *Failure Mode 2 (Bipartite / Periodic Oscillation):* If a particle only hops between nearest neighbors on a bipartite lattice with zero probability of staying in place ($P(s \\to s) = 0$), the chain has an eigenvalue $\\varepsilon = -1$ (or complex roots of unity $|\\varepsilon| = 1$). Then $\\varepsilon^n = (-1)^n$ oscillates forever without decaying! Note that in Metropolis MC, nonzero rejection probabilities $P(s \\to s) > 0$ automatically break periodicity.\n3. **Positive Recurrence (Finite Mean Return Time):** The average number of steps required to return to any state is finite.\n   - *Failure Mode 3 (Null Recurrence / \"Expanding Universe\"):* In an unbounded infinite volume (e.g., an unconfined random walk in $\\\
      mathbb{R}^3$), particles can diffuse away to infinity so the mean return time diverges and no normalizable stationary distribution exists. This is never a problem in a finite system or a periodic simulation box.\n"
  - id: concept_markov_convergence
    type: concept_cell
    title: 'Interactive Explorer: Markov Chain Eigenvalues, Relaxation & Ergodicity Traps'
    description_markdown: Select different 2-state Markov transition matrices $P$ and vary the initial probability $f_0(0)$ to observe geometric convergence inside the spectral envelope $\pi(0) \pm |\varepsilon_1|^n$, slow mixing when $\varepsilon_1 \to 1$, and ergodicity breakdowns under periodicity ($\varepsilon_1 = -1$) or reducibility ($\varepsilon_1 = +1$).
    render_function: render_markov_eigenvalue_convergence
    layout: figure_left
    controls:
    - name: chain_type
      label: Markov Chain Regime
      kind: dropdown
      default: reliability
      options:
      - label: 'Computer Reliability: P = [[0.6, 0.4], [0.3, 0.7]] (eps_1 = 0.3)'
        value: reliability
      - label: 'Slow-Mixing Bottleneck: P = [[0.94, 0.06], [0.04, 0.96]] (eps_1 = 0.9)'
        value: bottleneck
      - label: 'Periodic Bipartite Trap: P = [[0, 1], [1, 0]] (eps_1 = -1.0)'
        value: bipartite
      - label: 'Reducible Infinite Barrier: P = [[1, 0], [0, 1]] (degenerate eps = 1)'
        value: reducible
    - name: f0_s0
      label: Initial Probability f_0(0)
      kind: slider
      min: 0.0
      max: 1.0
      step: 0.05
      default: 1.0
      format: .2f
    - name: n_steps
      label: Number of Markov Steps n
      kind: slider
      min: 5
      max: 40
      step: 1
      default: 20
    takeaway_markdown: '**Key Takeaway:** An ergodic chain has a unique $\varepsilon_0 = 1$ and $|\varepsilon_1| < 1$, guaranteeing geometric decay of initial-state memory on timescale $\tau_{\mathrm{eq}} = -1/\ln|\varepsilon_1|$. If $|\varepsilon_1| = 1$ (either $+1$ from disconnected barriers or $-1$ from bipartite periodicity), the walk never equilibrates to a unique stationary state.'
  - id: sec_reliability_example
    type: markdown_section
    title: '3. Worked Example: The 2-State Computer Reliability Markov Chain'
    body_markdown: "Following Allen & Tildesley (pp. 110–123) and the lecture notes, consider a computer whose daily reliability follows a 2-state Markov chain between state $1 = \\text{Up}$ and state $2 = \\text{Down}$:\n- If the computer is **Up** today, it has a $60\\%$ chance of remaining **Up** tomorrow and a $40\\%$ chance of going **Down**.\n- If the computer is **Down** today, it has a $70\\%$ chance of remaining **Down** tomorrow and a $30\\%$ chance of coming back **Up**.\n\nThis defines the stochastic transition matrix:\n$$P(s \\to s') = \\begin{pmatrix} 0.6 & 0.4 \\\\ 0.3 & 0.7 \\end{pmatrix}$$\n\n### Step-by-Step Transient Evolution\nSuppose on day $1$ the computer is equally likely to be Up or Down:\n$$\\pi(1) = (0.5,\\; 0.5)$$\n- **Day 2 distribution:**\n  $$\\pi(2) = \\pi(1) P = (0.5,\\; 0.5)\\begin{pmatrix} 0.6 & 0.4 \\\\ 0.3 & 0.7 \\end{pmatrix} = \\big(0.5(0.6) + 0.5(0.3),\\; 0.5(0.4) + 0.5(0.7)\\big) = (0.45,\\; 0.55)$$\n- **Day 3 distribution:**\n  $$\\pi(3) = \\pi(2)\
      \ P = (0.45,\\; 0.55)\\begin{pmatrix} 0.6 & 0.4 \\\\ 0.3 & 0.7 \\end{pmatrix} = \\big(0.45(0.6) + 0.55(0.3),\\; 0.45(0.4) + 0.55(0.7)\\big) = (0.435,\\; 0.565)$$\n\n### Exact Stationary State $\\pi(\\infty)$ & Eigenvalues\nIn the limit $n \\to \\infty$, $\\pi(\\infty) = (\\pi_{\\text{Up}}, \\pi_{\\text{Dn}})$ satisfies the left eigenvalue equation $\\pi = \\pi P$ with $\\pi_{\\text{Up}} + \\pi_{\\text{Dn}} = 1$:\n$$0.6\\,\\pi_{\\text{Up}} + 0.3\\,\\pi_{\\text{Dn}} = \\pi_{\\text{Up}} \\quad \\Longrightarrow \\quad 0.4\\,\\pi_{\\text{Up}} = 0.3\\,\\pi_{\\text{Dn}} \\quad \\Longrightarrow \\quad \\frac{\\pi_{\\text{Up}}}{\\pi_{\\text{Dn}}} = \\frac{3}{4}$$\nNormalizing gives the unique equilibrium distribution:\n$$\\pi(\\infty) = \\left(\\frac{3}{7},\\; \\frac{4}{7}\\right) \\approx (0.4286,\\; 0.5714)$$\nWhat about the eigenvalues of $P$? Since $\\varepsilon_0 = 1$ and the sum of eigenvalues equals the matrix trace $\\operatorname{Tr}(P) = 0.6 + 0.7 = 1.3$:\n$$\\varepsilon_0 + \\varepsilon_1\
      \ = 1.3 \\quad \\Longrightarrow \\quad \\varepsilon_1 = 0.3$$\nIndeed, at every step the deviation from equilibrium $\\pi(n) - \\pi(\\infty)$ shrinks by an exact factor of $\\varepsilon_1 = 0.3$:\n$$\\pi_{\\text{Up}}(1) - \\frac{3}{7} = \\frac{1}{14}, \\qquad \\pi_{\\text{Up}}(2) - \\frac{3}{7} = 0.3 \\times \\frac{1}{14} = \\frac{3}{140}, \\qquad \\pi_{\\text{Up}}(3) - \\frac{3}{7} = 0.3^2 \\times \\frac{1}{14} = \\frac{9}{1400}$$\n"
  - id: q15_07_perron_frobenius_bounds
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_ergodicity_spectrum
    prompt_markdown: For an ergodic Markov chain with transition matrix $P$ and eigenvalues $\varepsilon_0, \varepsilon_1, \varepsilon_2, \dots$, which condition on the eigenvalue spectrum guarantees convergence to a **unique** stationary distribution $\pi(s)$?
    hint_markdown: Check the spectral expansion $f_n(s) = \pi(s) + \sum_{\lambda \ge 1} \varepsilon_\lambda^n c_\lambda \phi_\lambda(s)$ as $n \to \infty$.
    options:
    - id: a
      text: A single non-degenerate eigenvalue $\varepsilon_0 = 1$, and all other eigenvalues strictly inside the unit circle ($|\varepsilon_\lambda| < 1$ for all $\lambda \ge 1$).
      text_markdown: A single non-degenerate eigenvalue $\varepsilon_0 = 1$, and all other eigenvalues strictly inside the unit circle ($|\varepsilon_\lambda| < 1$ for all $\lambda \ge 1$).
    - id: b
      text: All eigenvalues equal to $+1$ ($\varepsilon_\lambda = 1$ for all $\lambda$).
      text_markdown: All eigenvalues equal to $+1$ ($\varepsilon_\lambda = 1$ for all $\lambda$).
    - id: c
      text: At least one eigenvalue with $\varepsilon_\lambda > 1$ so that equilibrium states grow exponentially.
      text_markdown: At least one eigenvalue with $\varepsilon_\lambda > 1$ so that equilibrium states grow exponentially.
    - id: d
      text: All eigenvalues equal to $0$ ($\varepsilon_\lambda = 0$ for all $\lambda$).
      text_markdown: All eigenvalues equal to $0$ ($\varepsilon_\lambda = 0$ for all $\lambda$).
    correct: a
    rationale_markdown: The stationary state requires $\varepsilon_0 = 1$; uniqueness requires $\varepsilon_0 = 1$ to be non-degenerate; and decay of all transient components $\varepsilon_\lambda^n \to 0$ requires $|\varepsilon_\lambda| < 1$ for every $\lambda \ge 1$.
  - id: q15_08_relaxation_time_calculation
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_ergodicity_spectrum
    - concept_markov_convergence
    prompt_markdown: A Markov chain sampling a double-well potential has a second-largest eigenvalue $\varepsilon_1 = 0.95$. Calculate the characteristic relaxation (warmup) time $\tau_{\text{eq}} = -1/\ln|\varepsilon_1|$ in Markov steps.
    hint_markdown: Evaluate $-1 / \ln(0.95)$.
    correct:
      value: 19.496
      tolerance: 0.15
    rationale_markdown: Using $\tau_{\text{eq}} = -1 / \ln(0.95) = -1 / (-0.051293) \approx 19.50$ steps (close to the asymptotic approximation $1/(1 - 0.95) = 20$ steps).
  - id: q15_09_ergodicity_three_conditions
    type: problem
    question_type: multi_select
    difficulty: medium
    taught_by: sec_ergodicity_spectrum
    prompt_markdown: 'Select **all** conditions that are required to prove that a Markov chain is **ergodic** and converges to a unique stationary distribution:'
    hint_markdown: Recall the three properties listed on slide 4 of the lecture notes.
    options:
    - id: a
      text: 'Irreducibility (no infinite barriers): the system can move from any state to any other state in a finite number of steps with non-zero probability.'
      text_markdown: 'Irreducibility (no infinite barriers): the system can move from any state to any other state in a finite number of steps with non-zero probability.'
    - id: b
      text: 'Aperiodicity: the transition rules are non-periodic (e.g., not trapped in deterministic alternating hops on a bipartite lattice).'
      text_markdown: 'Aperiodicity: the transition rules are non-periodic (e.g., not trapped in deterministic alternating hops on a bipartite lattice).'
    - id: c
      text: 'Positive recurrence: the average return time to any state is finite (no ''expanding universe'' escape to infinity).'
      text_markdown: 'Positive recurrence: the average return time to any state is finite (no ''expanding universe'' escape to infinity).'
    - id: d
      text: 'Zero rejection rate: every proposed trial move must be accepted with probability $A = 1$.'
      text_markdown: 'Zero rejection rate: every proposed trial move must be accepted with probability $A = 1$.'
    correct:
    - a
    - b
    - c
    rationale_markdown: Ergodicity requires irreducibility (no barriers), aperiodicity (non-periodic transition rules), and finite mean return time (positive recurrence). Rejections ($A < 1$) do not break ergodicity; in fact, nonzero self-transition probability $P(s \to s) > 0$ helps guarantee aperiodicity!
  - id: q15_10_reducible_degenerate_eigenvalues
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_ergodicity_spectrum
    - concept_markov_convergence
    prompt_markdown: Suppose a simulation of a crystal has an infinite energy barrier separating $k = 3$ disconnected symmetry-broken domains that the MC move set can never cross. How does this ergodicity failure manifest in the eigenvalue spectrum of the transition matrix $P$?
    hint_markdown: Each disconnected domain supports its own independent stationary equilibrium distribution.
    options:
    - id: a
      text: The unit eigenvalue $\varepsilon = 1$ becomes $3$-fold degenerate, so the limiting distribution $f_\infty$ is not unique and depends on the initial state $f_0$.
      text_markdown: The unit eigenvalue $\varepsilon = 1$ becomes $3$-fold degenerate, so the limiting distribution $f_\infty$ is not unique and depends on the initial state $f_0$.
    - id: b
