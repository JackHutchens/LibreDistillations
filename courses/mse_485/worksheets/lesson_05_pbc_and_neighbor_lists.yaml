    prompt_markdown: 'Which of the following correctly summarizes the asymptotic time complexity of (1) Naive all-pairs force evaluation, (2) Force evaluation using a pre-built Verlet neighbor table, and (3) Neighbor table construction using the Cell Linked-List method, for a short-range potential at fixed density $\rho$?

      '
    hint_markdown: Review slides 6, 7, and 10 of `05.PBC-neighbors.pdf`.
    options:
    - id: a
      text: '(1) All-pairs: $\mathcal{O}(N^2)$ · (2) Force step with neighbor table: $\mathcal{O}(N)$ · (3) Cell Linked-List construction: $\mathcal{O}(N)$'
      text_markdown: '(1) All-pairs: $\mathcal{O}(N^2)$ · (2) Force step with neighbor table: $\mathcal{O}(N)$ · (3) Cell Linked-List construction: $\mathcal{O}(N)$'
    - id: b
      text: '(1) All-pairs: $\mathcal{O}(N^2)$ · (2) Force step with neighbor table: $\mathcal{O}(N \log N)$ · (3) Cell Linked-List construction: $\mathcal{O}(N^2)$'
      text_markdown: '(1) All-pairs: $\mathcal{O}(N^2)$ · (2) Force step with neighbor table: $\mathcal{O}(N \log N)$ · (3) Cell Linked-List construction: $\mathcal{O}(N^2)$'
    - id: c
      text: '(1) All-pairs: $\mathcal{O}(N^{3/2})$ · (2) Force step with neighbor table: $\mathcal{O}(N)$ · (3) Cell Linked-List construction: $\mathcal{O}(N \log N)$'
      text_markdown: '(1) All-pairs: $\mathcal{O}(N^{3/2})$ · (2) Force step with neighbor table: $\mathcal{O}(N)$ · (3) Cell Linked-List construction: $\mathcal{O}(N \log N)$'
    - id: d
      text: '(1) All-pairs: $\mathcal{O}(N^3)$ · (2) Force step with neighbor table: $\mathcal{O}(N^2)$ · (3) Cell Linked-List construction: $\mathcal{O}(N)$'
      text_markdown: '(1) All-pairs: $\mathcal{O}(N^3)$ · (2) Force step with neighbor table: $\mathcal{O}(N^2)$ · (3) Cell Linked-List construction: $\mathcal{O}(N)$'
    correct: a
