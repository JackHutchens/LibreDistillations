      text_markdown: Only on steps when the neighbor table is being rebuilt
    correct: a
    rationale_markdown: 'The Verlet list records all neighbors within $r_v = r_c + \Delta$. On each timestep, pairs currently in the buffer zone $r_c < r_{ij} \le r_v$ do not interact, so the inner loop must still test `if r2 > rcutoff2: continue`.'
  - id: q26_pure_verlet_asymptotic_complexity
