  - id: q35_cell_vs_sphere_volume_ratio
    type: problem
    question_type: numeric
    difficulty: hard
    taught_by:
    - sec_cell_linked_lists
    prompt_markdown: In 3D, suppose the cell size equals the cutoff radius ($l_c = r_c$). The 27 neighbor cells searched around an atom have total volume $V_{\text{cells}} = 27 r_c^3$, whereas the actual interaction sphere has volume $V_{\text{sphere}} = \frac{4}{3}\pi r_c^3$. Calculate the ratio $V_{\text{cells}} / V_{\text{sphere}}$ to two decimal places (e.g., `6.45`).
    hint_markdown: Compute the ratio between the total volume of the 27 cubic search cells and the volume of the interaction sphere.
    correct:
      value: 6.45
      tolerance: 0.05
    rationale_markdown: $V_{\text{cells}} / V_{\text{sphere}} = 27 / (\frac{4}{3}\pi) = 81 / (4\pi) \approx 6.4458 \approx 6.45$. Thus only $\sim 15.5\%$ of the particles inside the 27-cell cube actually lie within distance $r_c$!
