  - id: q32_linked_list_trace_head
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_cell_linked_lists
    - concept_cell_linked_list
    prompt_markdown: 'Suppose `head` is initialized to `-1` for all cells. While looping `i = 0, 1, ..., 9` in ascending order, particles `i = 2`, `i = 5`, and `i = 8` are the only particles that map to cell `c = 3` using:

      ```python

      list[i] = head[c]

      head[c] = i

      ```

      After the loop finishes, what integer value is stored in `head[3]`?

      '
    hint_markdown: Each insertion prepends the new particle to the front (head) of the linked list (LIFO order).
    correct:
      value: 8
      tolerance: 0.1
    rationale_markdown: 'Initially `head[3] = -1`. When `i = 2`: `list[2] = -1, head[3] = 2`. When `i = 5`: `list[5] = 2, head[3] = 5`. When `i = 8`: `list[8] = 5, head[3] = 8`. Thus `head[3] = 8`.'
