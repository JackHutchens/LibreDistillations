worksheet:
  id: lesson_05_pbc_and_neighbor_lists
  title: 'MSE 485 · Lesson 05: Spatial Boundary Conditions, Minimum Image Convention & Neighbor Lists'
  estimated_minutes: 95
  learning_objectives:
  - Quantify the surface-to-volume scaling ($\propto N^{-1/3}$) of finite 3D atomic clusters and explain why Periodic Boundary Conditions (PBC) are essential for simulating bulk phases.
  - Identify physical artifacts that persist under PBC—including long-wavelength phonon cutoff ($\lambda > L$), periodic self-interaction, nucleation suppression, and cubic box anisotropy.
  - Apply coordinate wrapping and the Minimum Image Convention (MIC) in 1D and 3D, and prove why the radial cutoff must strictly satisfy $r_c < L/2$.
  - Compare potential truncation schemes (raw cutoff, shifted potential, and shifted-force potential) and their effects on energy conservation in Molecular Dynamics.
  - Analyze the $\mathcal{O}(N^2)$ bottleneck of all-pairs distance checking and reduce force evaluations to $\mathcal{O}(N)$ using Verlet skin lists ($r_v = r_c + \Delta$, rebuild trigger $d_1 + d_2 \ge \Delta$) and $\mathcal{O}(N)$ Cell Linked-Lists (`head` and `list` arrays).
  sections:
  - id: sec_surface_pbc_intro
    type: markdown_section
    title: 1. Spatial Boundary Conditions & The Tyranny of Surfaces
    body_markdown: 'Macroscopic materials contain $\mathcal{O}(10^{23})$ atoms, whereas atomistic Molecular Dynamics (MD) and Monte Carlo (MC) simulations typically track $N \sim 10^3\text{–}10^7$ atoms. Because spatial scales are limited, our choice of **spatial boundary conditions** fundamentally determines whether the simulation represents a nanoscale cluster or a macroscopic bulk phase.


      ### Free Boundaries vs. Bulk Scaling

      In a 3D cluster of $N = n^3$ atoms with **free boundaries** (e.g., an isolated droplet or nanoparticle in vacuum), any atom within a surface shell of thickness $d$ atomic layers experiences an under-coordinated, non-bulk environment. The number of strictly interior (bulk) atoms is:

      $$N_{\text{bulk}} = (n - 2d)^3 = \left(N^{1/3} - 2d\right)^3$$

      Expanding for large $N$, the fraction of atoms residing in the surface layer scales slowly as an inverse cube root:

      $$\frac{N_{\text{surf}}}{N} = 1 - \left(1 - \frac{2d}{N^{1/3}}\right)^3 \approx \frac{6d}{N^{1/3}} \propto N^{-1/3}$$

      - For a $N = 10^3 = 1000$ atom cube with a 1-atom surface layer ($d=1$), $N_{\text{bulk}} = 8^3 = 512$, leaving **$488$ atoms ($48.8\%$) on the surface**!

      - Even for $N = 10^6 = (100)^3$ atoms with a $d=5$ atom thick surface interaction region, $1 - (90/100)^3 = 27.1\%$ (roughly **a quarter of all atoms**) are still dominated by surface forces!


      ### Types of Boundary Conditions

      1. **Free boundaries:** Isolated cluster, droplet, or protein in vacuum.

      2. **Periodic Boundary Conditions (PBC):** The primary simulation box of side $L$ is replicated infinitely in all directions. When a particle leaves through one face, its periodic image simultaneously enters through the opposite face. PBC **completely eliminates free surfaces**, allowing small $N$ to probe bulk solids, liquids, gases, and plasmas.

      3. **Mixed (Slab) boundaries:** Periodic in $x$ and $y$, but free (or reflective/wall-bounded) in $z$—ideal for studying free surfaces, thin films, or solid-liquid interfaces.

      4. **Coupled / Embedded boundaries:** Embedding an atomistic quantum or MD region inside a continuum elastic or coarse-grained bath via boundary forces and displacements.


      ### Remaining Finite-Size Artifacts Under PBC

      Although PBC removes free surfaces, the system is still periodic with period $L$, NOT truly infinite:

      - **Long-wavelength cutoff ($\lambda > L$):** Any collective excitation (phonon, acoustic wave, or capillary wave) must be commensurate with the box: $\mathbf{k} = \frac{2\pi}{L}(n_x, n_y, n_z)$, suppressing wavelengths $\lambda > L$.

      - **Periodic image self-interaction:** A defect (dislocation, vacancy cluster, or charged ion) interacts elastically or electrostatically with its own periodic images separated by $L$.

      - **Suppressed critical fluctuations & nucleation:** Phase transitions or critical fluctuations whose correlation length $\xi \gtrsim L$ are artificially stabilized or suppressed.

      - **Cubic box anisotropy:** The periodic lattice of images has cubic symmetry rather than true isotropic rotational invariance.

      '
  - id: concept_surface_scaling
    type: concept_cell
    title: 'Interactive Explorer: Surface Atom Fraction in Finite 3D Clusters'
    description_markdown: Adjust the cubic cluster side length $n$ ($N = n^3$ atoms) and the surface interaction shell thickness $d$ (in atomic layers) to see why free boundaries cannot approximate bulk behavior without millions of atoms.
    render_function: render_surface_vs_bulk_scaling
    layout: figure_left
    controls:
      n_side:
        kind: slider
        label: Cube Side n (Atoms per edge)
        min: 6
        max: 100
        step: 2
        default: 10
      d_surf:
        kind: slider
        label: Surface Shell Thickness d (layers)
        min: 1
        max: 5
        step: 1
        default: 1
    takeaway_markdown: '**Key Takeaway:** Because surface fraction decays only as $N^{-1/3}$, eliminating surface artifacts by brute-force cluster size is computationally prohibitive. Periodic Boundary Conditions (PBC) eliminate surfaces entirely at any $N$.'
  - id: q01_surface_fraction_1000
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by:
    - sec_surface_pbc_intro
    - concept_surface_scaling
    prompt_markdown: 'Consider a 3D simple cubic nanocrystal containing $N = 1000$ atoms arranged as a $10 \times 10 \times 10$ cube in vacuum (free boundary conditions). If the outermost single layer of atoms ($d = 1$) on all six faces is considered the surface shell, what **percentage** of the atoms in this cluster are surface atoms? (Enter a number between 0 and 100, e.g., `48.8`.)

      '
    hint_markdown: Determine the number of atoms remaining in the interior core by stripping the surface thickness from both boundaries along each Cartesian dimension.
    correct:
      value: 48.8
      tolerance: 0.2
    rationale_markdown: The interior bulk cube contains $(10 - 2)^3 = 8^3 = 512$ atoms. Therefore, $1000 - 512 = 488$ atoms lie on the surface, which is $488 / 1000 = 48.8\%$ of the entire system.
  - id: q02_surface_fraction_million
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_surface_pbc_intro
    - concept_surface_scaling
    prompt_markdown: 'As discussed in the lecture notes, suppose a simulated droplet has $N = 10^6 = (100)^3$ atoms on a cubic grid, and the surface region affected by under-coordination is $d = 5$ atomic layers thick on every face. Calculate the **exact percentage** of atoms that lie within this 5-atom-thick surface region.

      '
    hint_markdown: Consider the dimensions of the unaffected interior core after subtracting the under-coordinated boundary thickness from opposing faces along each axis.
    correct:
      value: 27.1
      tolerance: 0.5
    rationale_markdown: "The unaffected core has $(100 - 2 \\times 5)^3 = 90^3 = 729,000$ atoms. The surface shell therefore contains $1,000,000 - 729,000 = 271,000$ atoms, or $27.1\\%$ (often approximated as $\\approx 25\text{–}30\\%$ via $6d/n = 30\\%$)."
  - id: q03_surface_scaling_exponent
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by:
    - sec_surface_pbc_intro
    prompt_markdown: 'In a $D$-dimensional cluster of $N$ particles with free boundaries, the surface-to-volume ratio (fraction of atoms near the surface) scales asymptotically with particle count $N$ as:

      '
    hint_markdown: Relate the surface area and volume of a $D$-dimensional object to its characteristic linear scale, and express that linear scale in terms of particle number.
    options:
    - id: a
      text: $N^{-1/3}$ in 3D (and $N^{-1/D}$ in $D$ dimensions)
      text_markdown: $N^{-1/3}$ in 3D (and $N^{-1/D}$ in $D$ dimensions)
    - id: b
      text: $N^{-1}$ in all dimensions
      text_markdown: $N^{-1}$ in all dimensions
    - id: c
      text: $N^{-2/3}$ in 3D
      text_markdown: $N^{-2/3}$ in 3D
    - id: d
      text: $N^{-1/2}$ in 3D
      text_markdown: $N^{-1/2}$ in 3D
    correct: a
    rationale_markdown: In $D$ dimensions, $N \propto L^D \implies L \propto N^{1/D}$. The surface region contains $N_{\text{surf}} \propto L^{D-1} \propto N^{(D-1)/D}$ atoms, so the surface fraction $N_{\text{surf}}/N \propto N^{-1/D}$ ($N^{-1/3}$ in 3D). Reducing the surface fraction by $10\times$ in 3D requires $1000\times$ more atoms!
  - id: q04_pbc_purpose
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by:
    - sec_surface_pbc_intro
    prompt_markdown: 'What is the primary physical motivation for applying 3D Periodic Boundary Conditions (PBC) in an atomistic simulation of $N = 4000$ liquid Argon atoms?

      '
    hint_markdown: Consider what happens to atoms near the boundary of the primary simulation cell.
    options:
    - id: a
      text: To eliminate free surfaces so that every atom experiences a bulk-like local environment despite small $N$
      text_markdown: To eliminate free surfaces so that every atom experiences a bulk-like local environment despite small $N$
    - id: b
      text: To make the total number of degrees of freedom strictly infinite in computer memory
      text_markdown: To make the total number of degrees of freedom strictly infinite in computer memory
    - id: c
      text: To force all interatomic forces to vanish beyond $r = L$
      text_markdown: To force all interatomic forces to vanish beyond $r = L$
    - id: d
      text: To prevent atoms from ever crossing the walls of the primary simulation box
      text_markdown: To prevent atoms from ever crossing the walls of the primary simulation box
    correct: a
    rationale_markdown: Under 3D PBC, the primary box is surrounded by periodic replicas, completely eliminating free surfaces and allowing a small sample of $10^3\text{–}10^4$ atoms to reproduce bulk thermodynamic properties.
  - id: q05_mixed_boundary_selection
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by:
    - sec_surface_pbc_intro
    prompt_markdown: 'You want to use Molecular Dynamics to measure the surface tension and inward surface relaxation of a Copper $(001)$ crystal facet exposed to vacuum. Which spatial boundary condition setup is most appropriate?

      '
    hint_markdown: You want an infinite macroscopic crystal plane along $x$ and $y$, but an exposed free surface normal to $z$.
    options:
    - id: a
      text: 'Mixed (slab) boundaries: periodic in $x$ and $y$, free boundaries (vacuum gap) in $z$'
      text_markdown: 'Mixed (slab) boundaries: periodic in $x$ and $y$, free boundaries (vacuum gap) in $z$'
    - id: b
      text: 3D Periodic Boundary Conditions with zero vacuum gap in $x$, $y$, and $z$
      text_markdown: 3D Periodic Boundary Conditions with zero vacuum gap in $x$, $y$, and $z$
    - id: c
      text: Free boundary conditions in all three directions ($x$, $y$, and $z$)
      text_markdown: Free boundary conditions in all three directions ($x$, $y$, and $z$)
    - id: d
      text: Spherical boundary conditions on a 4D hypersphere
      text_markdown: Spherical boundary conditions on a 4D hypersphere
    correct: a
    rationale_markdown: A slab geometry applies PBC in the in-plane directions ($x, y$) to mimic an infinite crystal plane while leaving the $z$-direction free (or separated by a wide vacuum layer) so that two flat $(001)$ surfaces are exposed without edge/corner artifacts.
  - id: q06_pbc_remaining_artifacts
    type: problem
    question_type: multi_select
    difficulty: medium
    taught_by:
    - sec_surface_pbc_intro
    prompt_markdown: 'Even though 3D Periodic Boundary Conditions eliminate free surfaces, finite-size artifacts remain in a cubic simulation box of side length $L$. Select **all** true finite-size artifacts that can occur under 3D PBC:

      '
    hint_markdown: Think about acoustic wavelengths, defect fields, and critical fluctuations relative to box length $L$.
    options:
    - id: a
      text: Phonons and capillary waves with wavelengths $\lambda > L$ are suppressed because wavevectors must satisfy $\mathbf{k} = \frac{2\pi}{L}(n_x, n_y, n_z)$
      text_markdown: Phonons and capillary waves with wavelengths $\lambda > L$ are suppressed because wavevectors must satisfy $\mathbf{k} = \frac{2\pi}{L}(n_x, n_y, n_z)$
    - id: b
      text: A point defect, dislocation, or charged ion can interact spuriously with its own periodic images across the box length $L$
      text_markdown: A point defect, dislocation, or charged ion can interact spuriously with its own periodic images across the box length $L$
    - id: c
      text: Phase nucleation or critical fluctuations with correlation length $\xi > L$ cannot form properly
      text_markdown: Phase nucleation or critical fluctuations with correlation length $\xi > L$ cannot form properly
    - id: d
      text: Approximately $49\%$ of the atoms in a $N=1000$ periodic box lose half their coordination partners at the box faces
      text_markdown: Approximately $49\%$ of the atoms in a $N=1000$ periodic box lose half their coordination partners at the box faces
    correct:
    - a
    - b
    - c
    rationale_markdown: 'Options (A), (B), and (C) are classic PBC finite-size artifacts: long-wavelength modes ($\lambda > L$) are cut off, defects feel their own periodic image fields, and correlation lengths $\xi > L$ are truncated. Option (D) is false because atoms near a PBC face interact seamlessly across the boundary with periodic images, retaining full bulk coordination.'
  - id: q07_max_phonon_wavelength
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_surface_pbc_intro
    prompt_markdown: 'A 3D periodic simulation cell of crystalline Silicon has cubic side length $L = 5.43\text{ nm}$. What is the **longest non-zero acoustic phonon wavelength** $\lambda_{\max}$ (in $\text{nm}$) that can propagate parallel to the $[100]$ axis ($x$-axis) in this simulation?

      '
    hint_markdown: Consider how the periodic boundary condition constrains the allowed normal-mode wavevectors along an edge of the simulation domain.
    correct:
      value: 5.43
      tolerance: 0.05
    rationale_markdown: Because the displacement field must satisfy $u(x + L) = u(x)$, the allowed wavevectors along $x$ are $k_x = 2\pi n_x / L$ for integer $n_x \ge 1$. The fundamental mode ($n_x = 1$) has wavelength $\lambda_{\max} = 2\pi / k_{\min} = L = 5.43\text{ nm}$.
  - id: sec_mic_and_cutoffs
    type: markdown_section
    title: 2. Coordinate Wrapping, Minimum Image Convention & Potential Truncation
    body_markdown: "In a periodic cubic box of side length $L$ spanning $[0, L)^3$, we must distinguish between two fundamental operations: **wrapping particle coordinates** back into the primary box, and computing the **Minimum Image Convention (MIC) displacement vector** between a pair of particles.\n\n### 1. Coordinate Wrapping (Keeping Particles in $[0, L)$)\nWhen a particle moves outside $[0, L)$ during an integration step, its position is wrapped back into the primary cell using the **floor** function (or modulo operator `%` in Python):\n$$x_{\\text{wrapped}} = x - L \\lfloor x / L \\rfloor \\quad \\in [0, L)$$\n\n### 2. Minimum Image Convention (MIC) for Pair Displacements\nTo compute the force between particle $i$ at $\\mathbf{r}_i$ and particle $j$ at $\\mathbf{r}_j$, particle $i$ must interact only with the **single closest periodic image** of particle $j$:\n$$|\\mathbf{r}_{ij}|_{\\text{M}} = \\min_{\\mathbf{n} \\in \\mathbb{Z}^3} |\\mathbf{r}_i - \\mathbf{r}_j + \\mathbf{n}L|$$\n\
      Component-wise along each axis $d \\in \\{x, y, z\\}$, with $\\Delta x = x_i - x_j$:\n$$\\Delta x_{\\text{mic}} = \\Delta x - L \\cdot \\operatorname{nint}\\!\\left(\\frac{\\Delta x}{L}\\right) \\quad \\in \\left[-\\frac{L}{2}, +\\frac{L}{2}\\right]$$\nwhere $\\operatorname{nint}(u)$ rounds $u$ to the **nearest integer**. If $x_i, x_j \\in [0, L)$ are already wrapped, this is equivalently implemented with conditional shifts:\n```python\ndx = x[i] - x[j]\nfor d in range(3):\n    if dx[d] >  L[d] / 2: dx[d] -= L[d]\n    if dx[d] < -L[d] / 2: dx[d] += L[d]\n```\n\n### 3. The Strict Cutoff Condition: $r_c < L/2$\nFor a spherically truncated short-range potential ($V_c(r) = 0$ for $r > r_c$), the cutoff radius $r_c$ must be **strictly less than half the box length**:\n$$r_c < \\frac{L}{2}$$\nWhy? The region of space closer to $\\mathbf{r}_i$ than to any of its periodic images is a cube of side $L$ centered at $\\mathbf{r}_i$, spanning $[-L/2, +L/2]^3$. The largest sphere inscribed inside\
      \ this cube has radius $L/2$. If $r_c \\ge L/2$, the cutoff sphere extends outside the minimum-image cube, allowing particle $i$ to interact simultaneously with **two or more periodic images of the same particle $j$** (or causing discontinuous jumps in force as a particle crosses the $\\pm L/2$ midplane).\n\n### 4. Handling the Tail of the Potential at $r = r_c$\nSimply setting $V(r) = 0$ for $r > r_c$ creates a step discontinuity $\\Delta V = -V(r_c)$ at $r = r_c$, which corresponds to an infinite delta-function impulse force $-\\nabla V$ whenever a pair crosses $r_c$, destroying energy conservation in NVE MD! Three standard remedies exist:\n1. **Shifted Potential (Continuous $V$, Discontinuous $F$):**\n   $$V_c(r) = V(r) - V(r_c) \\quad (r \\le r_c)$$\n   Removes the jump in potential energy at $r_c$, though the force $F(r_c) = -V'(r_c) \\ne 0$ still has a small jump.\n2. **Shifted-Force Potential (Continuous $V$ and Continuous $F$):**\n   $$V_{\\text{sf}}(r) = V(r) - V(r_c) - \\\
      left.\\frac{dV}{dr}\\right|_{r_c}(r - r_c) \\quad (r \\le r_c)$$\n   Both $V_{\\text{sf}}(r_c) = 0$ and $F_{\\text{sf}}(r_c) = 0$ vanish smoothly at the cutoff, yielding excellent MD energy conservation.\n3. **Long-Range Image Potential (Ewald Summation):**\n   For potentials that decay as $r^{-\\alpha}$ with $\\alpha \\le d$ (such as Coulomb $1/r$ in 3D), the tail integral $\\int_{r_c}^\\infty 4\\pi r^2 V(r)\\,dr$ diverges! One cannot truncate Coulomb interactions; instead, one sums over all periodic images $V_{\\text{image}}(\\mathbf{r}_{ij}) = \\sum_{\\mathbf{n}} V(\\mathbf{r}_i - \\mathbf{r}_j + \\mathbf{n}L)$ using **Ewald summation** ($\\mathcal{O}(N^{3/2})$ or $\\mathcal{O}(N\\log N)$ with PME) or the **Fast Multipole Method** ($\\mathcal{O}(N)$).\n"
  - id: concept_minimum_image
    type: concept_cell
    title: 'Interactive Explorer: Minimum Image Convention & The $r_c < L/2$ Limit'
    description_markdown: Move target particle $j$'s coordinates $(x_j, y_j)$ inside the primary box $[0, L]^2$ and vary the cutoff radius $r_c / L$. Compare the dashed gray primary-box vector $\Delta\mathbf{r}_{\mathrm{raw}}$ against the green Minimum Image vector $\Delta\mathbf{r}_{\mathrm{mic}}$, and observe what happens when $r_c \ge 0.50L$.
    render_function: render_minimum_image_explorer
    layout: figure_left
    controls:
      xj:
        kind: slider
        label: Particle j Position x_j / L
        min: 0.05
        max: 0.95
        step: 0.05
        default: 0.85
      yj:
        kind: slider
        label: Particle j Position y_j / L
        min: 0.05
        max: 0.95
        step: 0.05
        default: 0.8
      rc:
        kind: slider
        label: Cutoff Radius r_c / L
        min: 0.2
        max: 0.65
        step: 0.02
        default: 0.42
    takeaway_markdown: '**Key Takeaway:** Whenever $|x_i - x_j| > L/2$, the closest image of particle $j$ lives in an adjacent periodic tile rather than the primary box. Keeping $r_c < L/2$ guarantees that the cutoff circle stays strictly inside the yellow $L \times L$ minimum-image square.'
  - id: q08_wrap_vs_mic_formula
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by:
    - sec_mic_and_cutoffs
    prompt_markdown: 'In a 1D periodic box of length $L$ spanning $[0, L)$, which pair of formulas correctly distinguishes **wrapping a coordinate $x$ into $[0, L)$** from **computing the Minimum Image displacement $\Delta x_{\text{mic}} \in [-L/2, L/2]$**?

      '
    hint_markdown: Coordinate wrapping maps into $[0, L)$ using `floor`, whereas minimum-image displacement maps into $[-L/2, L/2]$ using nearest integer `nint`/`round`.
    options:
    - id: a
      text: 'Wrap: $x \leftarrow x - L\lfloor x/L \rfloor$; Minimum Image: $\Delta x \leftarrow \Delta x - L\operatorname{nint}(\Delta x/L)$'
      text_markdown: 'Wrap: $x \leftarrow x - L\lfloor x/L \rfloor$; Minimum Image: $\Delta x \leftarrow \Delta x - L\operatorname{nint}(\Delta x/L)$'
    - id: b
      text: 'Wrap: $x \leftarrow x - L\operatorname{nint}(x/L)$; Minimum Image: $\Delta x \leftarrow \Delta x - L\lfloor \Delta x/L \rfloor$'
      text_markdown: 'Wrap: $x \leftarrow x - L\operatorname{nint}(x/L)$; Minimum Image: $\Delta x \leftarrow \Delta x - L\lfloor \Delta x/L \rfloor$'
    - id: c
      text: Both operations use $u \leftarrow u - L\lfloor u/L \rfloor$
      text_markdown: Both operations use $u \leftarrow u - L\lfloor u/L \rfloor$
    - id: d
      text: Both operations use $u \leftarrow u - L\lceil u/L \rceil$
      text_markdown: Both operations use $u \leftarrow u - L\lceil u/L \rceil$
    correct: a
    rationale_markdown: '`floor(x/L)` maps any real coordinate $x$ into $[0, L)$, whereas `nint(dx/L)` (nearest integer rounding) maps a pair displacement $\Delta x$ into the symmetric interval $[-L/2, +L/2]$.'
  - id: q09_coordinate_wrapping_calc
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by:
    - sec_mic_and_cutoffs
    prompt_markdown: 'A cubic simulation box has side length $L = 10.0\text{ Å}$ spanning $[0, 10.0)\text{ Å}$. After a Verlet position update, an atom''s $x$-coordinate is $x = -2.3\text{ Å}$. What is its wrapped $x$-coordinate (in $\text{Å}$) inside the primary box $[0, L)$?

      '
    hint_markdown: Determine which integer multiple of the periodic box dimension must be added to map a coordinate into the half-open primary interval $[0, L)$.
    correct:
      value: 7.7
      tolerance: 0.02
    rationale_markdown: Using $x_{\text{wrapped}} = -2.3 - 10.0 \times \lfloor -2.3 / 10.0 \rfloor = -2.3 - 10.0 \times (-1) = 7.7\text{ Å}$.
  - id: q10_mic_1d_displacement
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by:
    - sec_mic_and_cutoffs
    - concept_minimum_image
    prompt_markdown: 'In a 1D periodic box of length $L = 10.0\text{ Å}$, particle $i$ is at $x_i = 1.2\text{ Å}$ and particle $j$ is at $x_j = 8.9\text{ Å}$. What is the signed Minimum Image displacement $\Delta x_{\text{mic}} = (x_i - x_j)_{\text{mic}}$ in $\text{Å}$? (Include the correct sign!)

      '
    hint_markdown: Apply the minimum image convention to find the shortest periodic displacement along the coordinate axis, shifting by $\pm L$ if the raw separation exceeds half the box length.
    correct:
      value: 2.3
      tolerance: 0.02
    rationale_markdown: The raw displacement is $\Delta x = 1.2 - 8.9 = -7.7\text{ Å}$. Because $-7.7 < -5.0$, the closest periodic image of particle $j$ is at $x_j - L = -1.1\text{ Å}$, giving $\Delta x_{\text{mic}} = -7.7 + 10.0 = +2.3\text{ Å}$.
  - id: q11_mic_3d_distance
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_mic_and_cutoffs
    - concept_minimum_image
    prompt_markdown: 'In a 3D cubic periodic box of side length $L = 10.0\text{ Å}$, atom $A$ is at $\mathbf{r}_A = (1.0, 9.0, 2.0)\text{ Å}$ and atom $B$ is at $\mathbf{r}_B = (8.0, 2.0, 6.0)\text{ Å}$. Calculate the Minimum Image distance $|\mathbf{r}_{AB}|_{\text{M}}$ in $\text{Å}$.

      '
    hint_markdown: Evaluate the minimum-image displacement vector along each Cartesian component individually before computing the Euclidean distance.
    correct:
      value: 5.831
      tolerance: 0.05
    rationale_markdown: 'Raw differences $\mathbf{r}_A - \mathbf{r}_B = (-7.0, +7.0, -4.0)\text{ Å}$. Applying MIC ($L=10$): $\Delta x_{\text{mic}} = -7.0 + 10 = +3.0\text{ Å}$, $\Delta y_{\text{mic}} = 7.0 - 10 = -3.0\text{ Å}$, and $\Delta z_{\text{mic}} = -4.0\text{ Å}$ (already within $[-5, 5]$). Thus $|\mathbf{r}_{AB}|_{\text{M}} = \sqrt{3.0^2 + (-3.0)^2 + (-4.0)^2} = \sqrt{9 + 9 + 16} = \sqrt{34} \approx 5.831\text{ Å}$.'
  - id: q12_cutoff_half_box_limit
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_mic_and_cutoffs
    - concept_minimum_image
    prompt_markdown: 'Why must the spherical potential cutoff radius $r_c$ strictly satisfy $r_c < L/2$ when using the Minimum Image Convention in a cubic periodic box of side length $L$?

      '
    hint_markdown: 'Look at the interactive explorer when $r_c > 0.5L$: how many images of particle $j$ can fall inside $r_c$?'
    options:
    - id: a
      text: If $r_c \ge L/2$, a particle's cutoff sphere extends beyond the $[-L/2, L/2]^3$ Wigner-Seitz cell and can include multiple periodic images of the same neighbor
      text_markdown: If $r_c \ge L/2$, a particle's cutoff sphere extends beyond the $[-L/2, L/2]^3$ Wigner-Seitz cell and can include multiple periodic images of the same neighbor
    - id: b
      text: If $r_c \ge L/2$, the Lennard-Jones potential becomes repulsive at all distances
      text_markdown: If $r_c \ge L/2$, the Lennard-Jones potential becomes repulsive at all distances
    - id: c
      text: If $r_c \ge L/2$, coordinates can no longer be wrapped into $[0, L)$ using `floor`
      text_markdown: If $r_c \ge L/2$, coordinates can no longer be wrapped into $[0, L)$ using `floor`
    - id: d
      text: If $r_c \ge L/2$, Newton's third law $\mathbf{F}_{ij} = -\mathbf{F}_{ji}$ is violated inside $r < L/4$
      text_markdown: If $r_c \ge L/2$, Newton's third law $\mathbf{F}_{ij} = -\mathbf{F}_{ji}$ is violated inside $r < L/4$
    correct: a
    rationale_markdown: The Minimum Image Convention checks only the single nearest image of particle $j$ inside the cube $[-L/2, L/2]^3$. The largest sphere that fits inside a cube of side $L$ has radius $L/2$. If $r_c \ge L/2$, two periodic images of $j$ can lie within distance $r_c$ of $i$, violating consistent single-image truncation.
  - id: q13_min_fcc_atoms_for_cutoff
    type: problem
    question_type: numeric
    difficulty: hard
    taught_by:
    - sec_mic_and_cutoffs
    prompt_markdown: You are setting up a 3D periodic FCC Argon crystal with conventional cubic lattice constant $a = 1.55\,\sigma$ ($4$ atoms per conventional cubic unit cell) and a Lennard-Jones cutoff of $r_c = 2.5\,\sigma$. To strictly satisfy $r_c < L/2$ for an $M \times M \times M$ supercell of FCC unit cells (where $L = M a$), what is the **minimum total number of atoms** required in the simulation supercell?
    hint_markdown: Ensure the cubic box length strictly satisfies the minimum image criterion relative to the cutoff radius, and calculate the total atoms in the resulting supercell.
    correct:
      value: 256
      tolerance: 0.5
    rationale_markdown: We require $L = M a > 2 r_c = 5.0\,\sigma \implies M > 5.0 / 1.55 = 3.226$. Since $M$ must be an integer number of unit cells per edge, the smallest valid supercell is $M = 4$ ($L = 6.2\,\sigma > 5.0\,\sigma$). An FCC supercell with $M = 4$ contains $N = 4 M^3 = 4 \times 4^3 = 256$ atoms.
  - id: q14_max_mic_corner_distance
    type: problem
