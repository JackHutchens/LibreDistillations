      tolerance: 0.1
    rationale_markdown: We require $l_c = L / M \ge 3.0\,\sigma \implies M \le 22.0 / 3.0 = 7.333$. Since $M$ must be an integer, $M = 7$ cells per axis (giving $7^3 = 343$ cells of side $l_c = 3.143\,\sigma \ge 3.0\,\sigma$).
