    prompt_markdown: 'In the Cell Method (when used directly for force evaluation with cutoff $r_c$, or when building a Verlet list with cutoff $r_v = r_c + \Delta$), what condition must the cell edge length $l_c = L / M$ satisfy so that we only need to search a particle''s own cell and immediately adjacent cells?

      '
    hint_markdown: If a neighbor cell is separated by one full cell width $l_c$ between non-adjacent cells, we need $l_c$ to be at least the interaction/list cutoff.
    options:
    - id: a
      text: $l_c \ge r_c$ (or $l_c \ge r_c + \Delta$ when constructing a Verlet list), so $M = \lfloor L / r_c \rfloor$
      text_markdown: $l_c \ge r_c$ (or $l_c \ge r_c + \Delta$ when constructing a Verlet list), so $M = \lfloor L / r_c \rfloor$
    - id: b
