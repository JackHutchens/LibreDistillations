  - id: q15_potential_truncation_schemes
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_mic_and_cutoffs
    prompt_markdown: 'In the lecture notes on handling the tail of a short-range potential at $r = r_c$, the **continuous potential and continuous force** (shifted-force) modification for $r \le r_c$ is defined as:

      '
    hint_markdown: Subtract a first-order Taylor linear term at $r_c$ so both $V_c(r_c) = 0$ and $V_c'(r_c) = 0$.
    options:
    - id: a
      text: $V_c(r) = V(r) - V(r_c) - \left.\frac{dV}{dr}\right|_{r_c}(r - r_c)$
      text_markdown: $V_c(r) = V(r) - V(r_c) - \left.\frac{dV}{dr}\right|_{r_c}(r - r_c)$
    - id: b
      text: $V_c(r) = V(r) - V(r_c)$
      text_markdown: $V_c(r) = V(r) - V(r_c)$
    - id: c
      text: $V_c(r) = V(r) + \left.\frac{dV}{dr}\right|_{r_c} r$
      text_markdown: $V_c(r) = V(r) + \left.\frac{dV}{dr}\right|_{r_c} r$
    - id: d
      text: $V_c(r) = V(r) \cdot \exp(-r / r_c)$
      text_markdown: $V_c(r) = V(r) \cdot \exp(-r / r_c)$
    correct: a
    rationale_markdown: Subtracting $V(r_c) + V'(r_c)(r - r_c)$ ensures $V_c(r_c) = 0$ and $-dV_c/dr|_{r_c} = -V'(r_c) + V'(r_c) = 0$, eliminating both the potential step and the force discontinuity at $r = r_c$.
  - id: q16_lj_shift_value
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_mic_and_cutoffs
    prompt_markdown: 'For a Lennard-Jones 12-6 potential $V(r) = 4\varepsilon\left[(\sigma/r)^{12} - (\sigma/r)^6\right]$ truncated and shifted at $r_c = 2.5\,\sigma$ so that $V_c(r) = V(r) - V(r_c)$, what is the value of the potential energy at the cutoff prior to shifting, $V(r_c)/\varepsilon$? (Include the negative sign, e.g., `-0.0163`.)

      '
    hint_markdown: Evaluate the standard 12-6 Lennard-Jones potential directly at the cutoff separation distance $r = r_c$ in reduced units.
    correct:
      value: -0.0163
      tolerance: 0.001
    rationale_markdown: At $r_c = 2.5\,\sigma$, $(1/2.5)^6 = 0.4^6 = 0.004096$ and $(1/2.5)^{12} = 1.6777 \times 10^{-5}$. Thus $V(2.5\,\sigma)/\varepsilon = 4(0.00001678 - 0.004096) = -0.016317$.
  - id: q17_force_loop_code_analysis
    type: problem
    question_type: multi_select
    difficulty: medium
    taught_by:
    - sec_mic_and_cutoffs
    prompt_markdown: "Inspect the Lennard-Jones force loop from the lecture slides:\n```python\nfor i in range(Natoms):\n    for j in range(i+1, Natoms):\n        dx = x[i] - x[j]\n        for d in range(3):\n            if dx[d] >  L[d]/2: dx[d] -= L[d]\n            if dx[d] < -L[d]/2: dx[d] += L[d]\n        r2 = sum(dx*dx)\n        if r2 > rcutoff2: continue\n        ...\n        F[i] = F[i] + rforce * dx\n        F[j] = F[j] - rforce * dx\n```\nSelect **all** true statements about the computational design of this loop:\n"
    hint_markdown: Look at the loop bounds `j in range(i+1, Natoms)`, the `r2 > rcutoff2` check, and the updates to `F[i]` and `F[j]`.
    options:
    - id: a
      text: Starting the inner loop at `j = i + 1` and updating both `F[i]` and `F[j]` exploits Newton's 3rd Law ($\mathbf{F}_{ij} = -\mathbf{F}_{ji}$), halving the number of pair evaluations to $N(N-1)/2$
      text_markdown: Starting the inner loop at `j = i + 1` and updating both `F[i]` and `F[j]` exploits Newton's 3rd Law ($\mathbf{F}_{ij} = -\mathbf{F}_{ji}$), halving the number of pair evaluations to $N(N-1)/2$
    - id: b
      text: Comparing squared distances ($r^2 > r_{\text{cut}}^2$) avoids computing an expensive square root $\sqrt{r^2}$ for every pair.
      text_markdown: Comparing squared distances ($r^2 > r_{\text{cut}}^2$) avoids computing an expensive square root $\sqrt{r^2}$ for every pair.
    - id: c
      text: Before entering the outer `for i` loop at each MD step, the force array and potential energy must be zeroed (`F.fill(0)`, `pot = 0`)
      text_markdown: Before entering the outer `for i` loop at each MD step, the force array and potential energy must be zeroed (`F.fill(0)`, `pot = 0`)
    - id: d
      text: Because of the cutoff check ($r^2 > r_{\text{cut}}^2$), the total complexity of this nested loop is $\mathcal{O}(N)$.
      text_markdown: Because of the cutoff check ($r^2 > r_{\text{cut}}^2$), the total complexity of this nested loop is $\mathcal{O}(N)$.
    correct:
    - a
    - b
    - c
    rationale_markdown: 'Statements (A), (B), and (C) are all key optimizations highlighted in the lecture slides. Statement (D) is false: even though `continue` skips the LJ arithmetic outside $r_c$, the nested loop still computes `dx`, MIC shifts, and `r2` for all $N(N-1)/2 = \mathcal{O}(N^2)$ pairs!'
  - id: q18_long_range_potentials_complexity
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_mic_and_cutoffs
    prompt_markdown: 'Why can''t a Coulomb interaction $V(r) = q_i q_j / r$ in 3D simply be truncated at $r_c < L/2$ like a Lennard-Jones potential, and what is the scaling of standard Ewald summation vs. the Fast Multipole Method (FMM)?

      '
    hint_markdown: In 3D, a shell at radius $r$ has volume $4\pi r^2 dr$, so the tail integral $\int r^2 (1/r) dr$ diverges; check slide 6 of `05.PBC-neighbors.pdf` for Ewald and FMM scaling.
    options:
    - id: a
      text: The $1/r$ tail integral diverges in 3D; standard Ewald summation scales as $\mathcal{O}(N^{3/2})$ while Fast Multipole Algorithms scale as $\mathcal{O}(N)$ for very large $N$
      text_markdown: The $1/r$ tail integral diverges in 3D; standard Ewald summation scales as $\mathcal{O}(N^{3/2})$ while Fast Multipole Algorithms scale as $\mathcal{O}(N)$ for very large $N$
    - id: b
      text: The $1/r$ potential is short-ranged; Ewald summation scales as $\mathcal{O}(N^3)$ and FMM scales as $\mathcal{O}(N^2)$
      text_markdown: The $1/r$ potential is short-ranged; Ewald summation scales as $\mathcal{O}(N^3)$ and FMM scales as $\mathcal{O}(N^2)$
    - id: c
      text: Coulomb forces violate Newton's third law; Ewald summation scales as $\mathcal{O}(\log N)$
      text_markdown: Coulomb forces violate Newton's third law; Ewald summation scales as $\mathcal{O}(\log N)$
    - id: d
      text: Truncation works accurately for $1/r$ as long as $r_c = 2.5\,\sigma$; Ewald summation is only used for hard spheres
      text_markdown: Truncation works accurately for $1/r$ as long as $r_c = 2.5\,\sigma$; Ewald summation is only used for hard spheres
    correct: a
    rationale_markdown: Because $1/r$ decays slower than $r^{-3}$ in 3D, truncating it causes severe electrostatic artifacts. Summing over periodic images via Ewald summation with optimal real/reciprocal space cutoffs scales as $\mathcal{O}(N^{3/2})$ (or $\mathcal{O}(N\log N)$ with mesh FFTs), while Fast Multipole Algorithms achieve $\mathcal{O}(N)$ for very large $N$.
  - id: sec_verlet_neighbor_lists
    type: markdown_section
    title: '3. $\mathcal{O}(N^2) \to \mathcal{O}(N)$: Verlet Neighbor Lists & Skin Depth $\Delta$'
    body_markdown: "### The $\\mathcal{O}(N^2)$ All-Pairs Bottleneck\nIn a system of $N$ atoms with a short-range potential ($V_c(r) = 0$ for $r > r_c$), each atom interacts on average with only:\n$$m \\approx \\frac{4}{3}\\pi r_c^3 \\rho$$\nneighbors inside its cutoff sphere, where $\\rho = N/V$ is the number density. Crucially, **$m$ is independent of system size $N$** (typically $m \\sim 30\\text{–}80$ in a liquid or solid). Yet the naive double loop checks all $\\frac{1}{2}N(N-1) \\approx \\mathcal{O}(N^2)$ pairs just to discover that almost all of them have $r_{ij} > r_c$!\n\n### Verlet Neighbor Lists (Explicit Neighbor Tables)\nIntroduced by Loup Verlet (1967), a **Verlet neighbor list** stores a table of nearby neighbor indices for each atom $i$.\n- Instead of cutting off the table at $r_c$, we construct the neighbor table using a slightly larger **Verlet sphere radius**:\n  $$r_v = r_c + \\Delta$$\n  where $\\Delta$ is the **skin depth** (buffer thickness).\n- **During force evaluation\
      \ steps:** We loop *only* over the pre-stored neighbor table (averaging $m_v \\approx \\frac{4}{3}\\pi (r_c + \\Delta)^3 \\rho$ entries per atom), checking whether $r_{ij} \\le r_c$. This force evaluation step costs strictly **$\\mathcal{O}(m_v N) = \\mathcal{O}(N)$**!\n\n### Exact Rebuild Criterion ($d_1 + d_2 \\ge \\Delta$)\nBecause particles move slowly per timestep ($\\Delta r \\sim 0.01\\sigma$), a particle initially outside the Verlet sphere ($r_{ij}^{(0)} > r_c + \\Delta$) cannot penetrate inside the force cutoff sphere ($r_{ij}(t) < r_c$) until the combined distance traveled by the pair since the last table build reaches $\\Delta$.\n- Let $\\Delta\\mathbf{r}_i = \\mathbf{r}_i(t) - \\mathbf{r}_i(t_{\\text{build}})$ be the displacement of atom $i$ since the table was last constructed.\n- Track the **two largest displacements** across the entire system: $d_1 = \\max_i |\\Delta\\mathbf{r}_i|$ and $d_2 = \\text{second largest } |\\Delta\\mathbf{r}_j|$.\n- **Rebuild trigger:** Whenever\n\
      \  $$d_1 + d_2 \\ge \\Delta \\quad (\\text{or conservatively } 2 d_{\\max} \\ge \\Delta)$$\n  we must reconstruct the neighbor table!\n\n### The Skin Depth $\\Delta$ Optimization Trade-off\n- **If $\\Delta$ is too small:** Very few excess particles lie in the skin ($m_v \\approx m$), so each force step is fast, **but** $d_1 + d_2 \\ge \\Delta$ triggers almost every step! Since a pure Verlet table rebuild must check all pairs ($\\mathcal{O}(N^2)$), frequent rebuilds ruin performance.\n- **If $\\Delta$ is too large:** The table rarely needs rebuilding ($n_{\\text{reb}}$ is large), **but** the number of candidate pairs checked at every step grows cubically as $(r_c + \\Delta)^3$.\n- Modern MD codes dynamically optimize $\\Delta$ by timing blocks of steps, fitting CPU time $t(\\Delta)$ to a polynomial, and minimizing $t(\\Delta)$.\n"
  - id: concept_verlet_skin
    type: concept_cell
    title: 'Interactive Explorer: Verlet Neighbor List Skin Depth Optimization'
    description_markdown: Vary the system size $N$ and reduced temperature $T^*$ to see how the per-step force evaluation cost $\propto N(r_c + \Delta)^3$ competes against the amortized $\mathcal{O}(N^2)$ list rebuild cost $\propto N^2 / n_{\mathrm{reb}}(\Delta)$.
    render_function: render_verlet_skin_optimizer
    layout: figure_left
    controls:
      n_atoms:
        kind: slider
        label: System Size N (atoms)
        min: 500
        max: 8000
        step: 500
        default: 2000
      temp_star:
        kind: slider
        label: Reduced Temperature T*
        min: 0.2
        max: 3.0
        step: 0.2
        default: 1.0
    takeaway_markdown: '**Key Takeaway:** There is a well-defined optimal skin depth $\Delta^*/r_c$ (typically $0.15\text{–}0.35$, rebuilding every $10\text{–}25$ steps). Increasing $N$ or $T^*$ makes $\mathcal{O}(N^2)$ rebuilds more costly per step, shifting $\Delta^*$ to larger values.'
  - id: q19_all_pairs_count
