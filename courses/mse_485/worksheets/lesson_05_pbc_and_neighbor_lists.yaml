  - id: q28_steps_between_rebuilds_calc
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_verlet_neighbor_lists
    - concept_verlet_skin
    prompt_markdown: 'In a liquid MD simulation with timestep $\Delta t = 0.005\,\tau$ and skin depth $\Delta = 0.40\,\sigma$, the fastest atoms move at $v_{\max} = 4.0\,\sigma/\tau$. Assuming the worst-case bound where the two fastest atoms travel straight lines ($d_1 = d_2 = v_{\max} n \Delta t$), after how many timesteps $n$ will the rebuild condition $d_1 + d_2 \ge \Delta$ be triggered?

      '
    hint_markdown: Equate the maximum possible relative displacement between two approaching atoms to the skin buffer thickness, and solve for the integer step threshold.
    correct:
      value: 10
      tolerance: 0.5
    rationale_markdown: Each step increases $d_1 + d_2$ by at most $2 v_{\max} \Delta t = 2 \times 4.0 \times 0.005 = 0.04\,\sigma$. Reaching $\Delta = 0.40\,\sigma$ requires $n = 0.40 / 0.04 = 10$ timesteps.
  - id: sec_cell_linked_lists
    type: markdown_section
    title: 4. The Cell Linked-List (Bin Sort) Method & Hybrid $\mathcal{O}(N)$ Synergy
    body_markdown: "To eliminate the $\\mathcal{O}(N^2)$ cost of constructing neighbor tables, we partition the simulation box of side $L$ into a regular $M \\times M \\times M$ grid of cubic **cells (bins)** of side length:\n$$l_c = \\frac{L}{M} \\ge r_c \\quad (\\text{or } l_c \\ge r_c + \\Delta \\text{ when building a Verlet list})$$\nwhere $M = \\lfloor L / r_c \\rfloor$.\n\n### Why is the Cell Method Strictly $\\mathcal{O}(N)$?\n1. **Binning particles ($\\mathcal{O}(N)$):** Each particle $i$ is assigned to its cell index in $\\mathcal{O}(1)$ arithmetic operations via `cx = int(x[i] / lc)`, `cy = int(y[i] / lc)`, `cz = int(z[i] / lc)`.\n2. **Local cell stencil search ($\\mathcal{O}(N)$):** Because $l_c \\ge r_c$, any particle within distance $r_c$ of atom $i$ **must reside either in atom $i$'s own cell or in one of the immediately adjacent cells**:\n   - In **2D**: $3^2 = \\mathbf{9}$ cells total (or **5 cells** using Newton's 3rd Law half-stencil).\n   - In **3D**: $3^3 = \\mathbf{27}$\
      \ cells total (or $1 + \\frac{26}{2} = \\mathbf{14}$ cells using Newton's 3rd Law half-stencil).\n   Since each cell contains a constant average number of particles $N_c = N / M^3 \\approx \\rho r_c^3$, checking 27 cells per particle takes $\\mathcal{O}(1)$ work per particle $\\implies$ **strictly $\\mathcal{O}(N)$ total time**!\n\n### The `head[c]` and `list[i]` Linked-List Data Structure\nInstead of allocating variable-length 2D arrays for every cell, MD codes represent all cell contents using just **two 1D static integer arrays** (with `-1` denoting the end-of-list sentinel):\n- `head[c]` (length $M^d$): stores the index of the **first** (most recently inserted) particle in cell `c`, or `-1` if cell `c` is empty.\n- `list[i]` (length $N$): stores the index of the **next** particle in the same cell as particle `i`, or `-1` if `i` is the last particle in that cell.\n\n**$\\mathcal{O}(N)$ Construction Loop:**\n```python\nhead[:] = -1\nfor i in range(N):\n    c = cell_index(r[i])\n\
      \    list[i] = head[c]   # point i to previous head of cell c\n    head[c] = i         # make i the new head of cell c\n```\n- **Memory footprint:** Requires only $M^d + N = \\mathcal{O}(N)$ integers (rather than $\\mathcal{O}(mN)$ for an explicit Verlet table!), with zero dynamic memory allocation.\n\n### Hybrid Cell + Verlet Neighbor List (Best of Both Worlds)\nWhy do state-of-the-art MD codes (like LAMMPS and GROMACS) use **Cell Linked-Lists to build a Verlet Neighbor List** every $10\\text{–}20$ steps, rather than evaluating forces directly from the 27-cell stencil at every step?\n- Compare the **search volume** per atom:\n  - 27 cubic cells of side $l_c = r_c$ have volume $V_{\\text{cells}} = 27 r_c^3$.\n  - A spherical cutoff (or Verlet sphere) has volume $V_{\\text{sphere}} = \\frac{4}{3}\\pi r_c^3 \\approx 4.189 r_c^3$.\n  - Ratio:\n    $$\\frac{V_{\\text{cells}}}{V_{\\text{sphere}}} = \\frac{27 r_c^3}{\\frac{4}{3}\\pi r_c^3} = \\frac{81}{4\\pi} \\approx 6.45$$\n- Directly\
      \ scanning 27 cells checks **$6.45\\times$ more candidate pairs** than actually lie inside the sphere $r_c$! By using the $\\mathcal{O}(N)$ Cell Linked-List only once every $\\sim 15$ steps to populate a tight spherical Verlet list of radius $r_c + \\Delta$, both the rebuild step and the force step are **strictly $\\mathcal{O}(N)$** *and* we only check $\\sim (1 + \\Delta/r_c)^3 \\approx 1.7\\times$ the sphere volume on intermediate steps!\n"
  - id: concept_cell_linked_list
    type: concept_cell
    title: 'Interactive Explorer: 2D Cell Linked-List Pointer Chain & Stencil'
