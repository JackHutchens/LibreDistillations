    prompt_markdown: 'Consider two bulk liquid Argon simulations at the same number density $\rho = 0.84\,\sigma^{-3}$ and cutoff $r_c = 2.5\,\sigma$: System A has $N = 1000$ atoms and System B has $N = 1,000,000$ atoms. How does the average number of interacting neighbors $m$ inside $r_c$ for a single atom compare between System A and System B?

      '
    hint_markdown: Consider whether the local coordination number inside a fixed spherical cutoff radius depends on macroscopic system volume or on local particle density.
    options:
    - id: a
      text: $m$ is identical in both systems (approx. $55$ neighbors) because $m \approx \frac{4}{3}\pi r_c^3 \rho$ depends only on local density $\rho$ and $r_c$, not $N$
      text_markdown: $m$ is identical in both systems (approx. $55$ neighbors) because $m \approx \frac{4}{3}\pi r_c^3 \rho$ depends only on local density $\rho$ and $r_c$, not $N$
    - id: b
      text: $m$ is $1000\times$ larger in System B because $N$ is $1000\times$ larger
      text_markdown: $m$ is $1000\times$ larger in System B because $N$ is $1000\times$ larger
    - id: c
      text: $m$ is $10\times$ larger in System B because box length $L$ is $10\times$ larger
      text_markdown: $m$ is $10\times$ larger in System B because box length $L$ is $10\times$ larger
    - id: d
      text: $m$ is smaller in System B because periodic boundary conditions dilute the density
      text_markdown: $m$ is smaller in System B because periodic boundary conditions dilute the density
    correct: a
    rationale_markdown: For a short-range potential, the average number of neighbors inside the cutoff sphere is $m \approx \frac{4}{3}\pi r_c^3 \rho \approx \frac{4}{3}\pi (2.5)^3 (0.84) \approx 55$, which is intensive (independent of system size $N$). Once a neighbor table is available, force calculation therefore scales as $mN/2 = \mathcal{O}(N)$.
  - id: q21_verlet_rebuild_criterion
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_verlet_neighbor_lists
    - concept_verlet_skin
    prompt_markdown: 'In a Verlet neighbor list with force cutoff $r_c$ and skin depth $\Delta$ (outer list radius $r_v = r_c + \Delta$), let $d_1$ and $d_2$ be the two largest atomic displacements $|\mathbf{r}_i(t) - \mathbf{r}_i(t_{\text{build}})|$ accumulated **since the neighbor list was last built**. What is the exact condition that guarantees no unrecorded pair has entered $r < r_c$, and when must the list be rebuilt?

      '
    hint_markdown: In the worst case, two atoms initially just outside $r_c + \Delta$ move directly toward each other by distances $d_1$ and $d_2$.
    options:
    - id: a
      text: Rebuild as soon as $d_1 + d_2 \ge \Delta$ (or conservatively $2 d_1 \ge \Delta$), measured relative to positions at the last rebuild
      text_markdown: Rebuild as soon as $d_1 + d_2 \ge \Delta$ (or conservatively $2 d_1 \ge \Delta$), measured relative to positions at the last rebuild
    - id: b
      text: Rebuild only when $d_1 \ge r_c + \Delta$, measured over a single timestep $\Delta t$
      text_markdown: Rebuild only when $d_1 \ge r_c + \Delta$, measured over a single timestep $\Delta t$
    - id: c
      text: Rebuild when the average displacement $\langle d_i \rangle \ge \Delta / 2$
      text_markdown: Rebuild when the average displacement $\langle d_i \rangle \ge \Delta / 2$
    - id: d
      text: Rebuild only when the total system energy drifts by more than $\Delta$
      text_markdown: Rebuild only when the total system energy drifts by more than $\Delta$
    correct: a
    rationale_markdown: Two atoms $i$ and $j$ initially separated by $r_{ij}(t_{\text{build}}) > r_c + \Delta$ can decrease their separation by at most $|\Delta\mathbf{r}_i| + |\Delta\mathbf{r}_j| \le d_1 + d_2$. As long as $d_1 + d_2 < \Delta$, their current separation exceeds $r_c$; as soon as $d_1 + d_2 \ge \Delta$, the table must be rebuilt.
  - id: q22_verlet_displacement_reference_bug
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by:
    - sec_verlet_neighbor_lists
    prompt_markdown: 'A student implements a Verlet neighbor list rebuild check by computing `d_i = norm(r[i, t] - r[i, t - dt])` (the displacement during the *current single timestep* $\Delta t$) and rebuilding when `max1(d) + max2(d) >= Delta`. Why is this implementation **fundamentally buggy**?

      '
    hint_markdown: What happens if an atom moves by $0.05\,\Delta$ per step in the same direction for 15 consecutive steps?
    options:
    - id: a
      text: Displacements accumulate over multiple timesteps; checking only the single-step displacement $\mathbf{r}(t) - \mathbf{r}(t-\Delta t)$ misses atoms that drift steadily across the skin $\Delta$ over several steps
      text_markdown: Displacements accumulate over multiple timesteps; checking only the single-step displacement $\mathbf{r}(t) - \mathbf{r}(t-\Delta t)$ misses atoms that drift steadily across the skin $\Delta$ over several steps
    - id: b
      text: Single-step displacements are always larger than multi-step displacements, causing rebuilds on every step
      text_markdown: Single-step displacements are always larger than multi-step displacements, causing rebuilds on every step
    - id: c
      text: The rebuild check must use velocities $\mathbf{v}_i$ instead of positions
      text_markdown: The rebuild check must use velocities $\mathbf{v}_i$ instead of positions
    - id: d
      text: The skin depth $\Delta$ must be divided by $N$ when checking single-step displacements
      text_markdown: The skin depth $\Delta$ must be divided by $N$ when checking single-step displacements
    correct: a
    rationale_markdown: In a typical MD timestep, an atom moves only $\sim 0.01\,\sigma \ll \Delta$, so single-step $d_1 + d_2$ would *never* exceed $\Delta$, and the neighbor list would never rebuild! You must store reference positions `r_ref[i]` from the moment the table was last built and compute `d_i = norm(r[i] - r_ref[i])`.
  - id: q23_verlet_skin_volume_ratio
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_verlet_neighbor_lists
    - concept_verlet_skin
    prompt_markdown: In a 3D simulation with force cutoff $r_c = 2.5\,\sigma$ and Verlet skin thickness $\Delta = 0.5\,\sigma$ (so $r_v = r_c + \Delta = 3.0\,\sigma$), by what factor does the volume of the Verlet sphere (and thus the average number of neighbors stored in the list per atom) exceed the actual force cutoff sphere? (Enter a number to 3 decimal places, e.g., `1.728`.)
    hint_markdown: Relate the ratio of two spherical volumes to the ratio of their outer radii.
    correct:
      value: 1.728
      tolerance: 0.01
    rationale_markdown: The ratio of the Verlet sphere volume to the force cutoff sphere volume is $(r_v / r_c)^3 = ((2.5 + 0.5) / 2.5)^3 = (1.2)^3 = 1.728$. Thus, about $42\%$ of the pairs stored in the Verlet list lie in the skin shell $[r_c, r_v]$ and have zero force on any given step.
  - id: q24_verlet_skin_zero_limit
    type: problem
    question_type: single_select
    difficulty: medium
