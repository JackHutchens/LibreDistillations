  - id: q30_max_cells_1d_calc
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by:
    - sec_cell_linked_lists
    prompt_markdown: 'A 3D cubic periodic simulation box has side length $L = 22.0\,\sigma$, and you use the Cell Method to build a Verlet neighbor list of radius $r_v = r_c + \Delta = 3.0\,\sigma$. What is the **maximum number of cells per edge $M$** (where $l_c = L / M \ge r_v$) that you can partition the box into along each axis?

