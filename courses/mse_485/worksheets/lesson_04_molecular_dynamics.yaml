  - id: sec_timestep_selection_and_resonance
    type: markdown_section
    title: 4. Timestep Selection Criteria and the Verlet Resonance Instability
    body_markdown: '### How to Choose the Timestep $\Delta t$


      In atomic simulations, atoms vibrate around equilibrium lattice positions or molecular covalent bonds. The fastest motion
      in the system dictates the required integration timestep $\Delta t$.


      1. **Fastest Vibrational Period:** If the highest vibrational frequency in the system is $\omega_{\max}$ (e.g., C-H
      bond stretching with $\nu \approx 3000\text{ cm}^{-1} \approx 9\times 10^{13}\text{ s}^{-1}$, corresponding to period
      $T_{\text{vib}} \approx 11\text{ fs}$), the standard empirical rule of thumb is:


      $$\Delta t \approx \frac{T_{\text{vib}}}{20}$$


      For flexible C-H bonds, this mandates $\Delta t \approx 0.5\text{--}1.0\text{ fs}$. Constraining these fastest bonds
      with SHAKE/RATTLE allows $\Delta t$ to increase to $2.0\text{ fs}$ (governed by slower C-C stretching or bond angle
      bending).


      2. **Verlet Resonance Stability Limit:** Consider the harmonic oscillator $\ddot{x} + \omega^2 x = 0$ integrated by
      Verlet. The recurrence relation is:


      $$x_{n+1} - (2 - \omega^2 \Delta t^2) x_n + x_{n-1} = 0$$


      Setting $x_n = \lambda^n$ yields the characteristic equation $\lambda^2 - 2(1 - \frac{1}{2}\omega^2 \Delta t^2)\lambda
      + 1 = 0$. For stable bounded oscillations, the roots must be complex conjugates of unit magnitude ($|\lambda| = 1$),
      which requires:


      $$\left| 1 - \frac{1}{2}\omega^2 \Delta t^2 \right| < 1 \implies \omega \Delta t < 2 \iff \Delta t < \frac{2}{\omega}
      = \frac{T_{\text{vib}}}{\pi} \approx 0.318 T_{\text{vib}}$$


      If $\Delta t > T_{\text{vib}}/\pi$, the roots $\lambda$ become real and one root satisfies $|\lambda| > 1$, leading
      to **exponential numerical blowup**!'
  - id: concept_timestep_stability_frontier
    type: concept_cell
    title: 'Interactive Concept: Timestep Stability Frontier & The Verlet Resonance Limit'
    description_markdown: 'Explore how relative energy drift rate depends on the chosen timestep $\Delta t / T_{\text{vib}}$.

      Move the slider for `selected_dt` and observe the transition from safe quadratic scaling $\mathcal{O}(\Delta t^2)$,
      to elevated fluctuations, and finally to the catastrophic resonance divergence at $\Delta t_{\text{crit}} = T_{\text{vib}}/\pi
      \approx 0.318$.'
    render_function: render_timestep_stability_frontier
    layout:
      kind: matplotlib
      figsize:
      - 9
      - 5
    controls:
      selected_dt:
        kind: slider
        label: Timestep dt / T_vib
        min: 0.02
        max: 0.35
        step: 0.01
        default: 0.05
    takeaway_markdown: '**Key Insight:** Choosing $\Delta t \approx T_{\text{vib}}/20 = 0.05 T_{\text{vib}}$ places the simulation
      safely in the convergent regime where shadow Hamiltonian error is $< 10^{-4}$ and energy is conserved to within 0.01%.
      As $\Delta t$ approaches $T_{\text{vib}}/\pi \approx 0.318 T_{\text{vib}}$, resonance between the integrator step and
      physical vibration causes numerical instability.'
