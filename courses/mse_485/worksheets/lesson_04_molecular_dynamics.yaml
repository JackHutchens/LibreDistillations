worksheet:
  id: lesson_04_molecular_dynamics
  title: 'Lesson 04: Molecular Dynamics: Symplectic Integrators, Shadow Hamiltonians, Cutoffs, and Time Reversibility'
  estimated_minutes: 120
  learning_objectives:
  - Formulate Hamilton's equations of motion and understand Liouville's theorem of phase-space volume conservation.
  - Derive the basic Verlet, Leapfrog, and Velocity Verlet integration algorithms from forward and backward Taylor expansions.
  - Explain why symplectic integrators exhibit bounded, oscillatory energy fluctuations without secular drift via shadow (modified)
    Hamiltonians.
  - Contrast symplectic integrators with high-order non-symplectic integrators (Euler, Runge-Kutta 4th order, Gear predictor-corrector).
  - Apply physical timestep selection criteria based on fastest vibrational frequencies ($T_{\text{vib}}/20$) and identify
    the Verlet resonance instability at $\Delta t = T_{\text{vib}}/\pi$.
  - Demonstrate the algebraic time-reversibility of Velocity Verlet and assess the impact of finite-precision floating-point
    Lyapunov divergence.
  - Analyze truncated interatomic potentials, compute the impulsive force delta-spike at $r_c$, and implement potential shifting
    and force smoothing.
  sections:
  - id: sec_md_architecture_and_equations
    type: markdown_section
    title: 1. Classical Trajectories and Phase Space Flow in Molecular Dynamics
    body_markdown: '### The Molecular Dynamics Paradigm


      Molecular Dynamics (MD) simulates the deterministic time evolution of a classical $N$-body system by numerically integrating
      Newton''s (or Hamilton''s) equations of motion. Given particle positions $\mathbf{r}^N = \{\mathbf{r}_1, \dots, \mathbf{r}_N\}$
      and momenta $\mathbf{p}^N = \{\mathbf{p}_1, \dots, \mathbf{p}_N\}$ with interatomic potential $V(\mathbf{r}^N)$, the
      classical Hamiltonian is:


      $$\mathcal{H}(\mathbf{r}^N, \mathbf{p}^N) = \sum_{i=1}^N \frac{|\mathbf{p}_i|^2}{2m_i} + V(\mathbf{r}_1, \dots, \mathbf{r}_N)$$


      The equations of motion are given by Hamilton''s canonical equations:


      $$\dot{\mathbf{r}}_i = \frac{\partial \mathcal{H}}{\partial \mathbf{p}_i} = \frac{\mathbf{p}_i}{m_i} = \mathbf{v}_i,
      \qquad \dot{\mathbf{p}}_i = -\frac{\partial \mathcal{H}}{\partial \mathbf{r}_i} = -\nabla_i V = \mathbf{F}_i$$


      ### Liouville''s Theorem and Symplectic Geometry


      The phase space $\Gamma = (\mathbf{r}^N, \mathbf{p}^N)$ has dimension $6N$. Under exact Hamiltonian dynamics, the phase-space
      velocity field $\mathbf{u} = (\dot{\mathbf{r}}^N, \dot{\mathbf{p}}^N)$ has zero divergence:


      $$\nabla_\Gamma \cdot \mathbf{u} = \sum_{i=1}^N \left( \frac{\partial \dot{\mathbf{r}}_i}{\partial \mathbf{r}_i} + \frac{\partial
      \dot{\mathbf{p}}_i}{\partial \mathbf{p}_i} \right) = \sum_{i=1}^N \left( \frac{\partial^2 \mathcal{H}}{\partial \mathbf{r}_i
      \partial \mathbf{p}_i} - \frac{\partial^2 \mathcal{H}}{\partial \mathbf{p}_i \partial \mathbf{r}_i} \right) = 0$$


      By the divergence theorem, this implies **Liouville''s Theorem**: phase-space volume elements are strictly conserved
      along trajectories ($d\Omega / dt = 0$). More fundamentally, Hamiltonian flows preserve the differential 2-form $\omega
      = \sum_i d\mathbf{r}_i \wedge d\mathbf{p}_i$, a geometric property called **symplecticity**. A numerical integrator
      that preserves this geometric structure is called a **symplectic integrator**.'
  - id: sec_integrators_and_symplectic_geometry
    type: markdown_section
    title: '2. Finite-Difference Integrators: Verlet, Velocity Verlet, and Leapfrog'
    body_markdown: '### Derivation of the Verlet Algorithm


      Consider the Taylor expansions of position $\mathbf{r}(t)$ forward and backward by timestep $\Delta t$:


      $$\mathbf{r}(t + \Delta t) = \mathbf{r}(t) + \mathbf{v}(t)\Delta t + \frac{1}{2}\mathbf{a}(t)\Delta t^2 + \frac{1}{6}\mathbf{b}(t)\Delta
      t^3 + \mathcal{O}(\Delta t^4)$$

      $$\mathbf{r}(t - \Delta t) = \mathbf{r}(t) - \mathbf{v}(t)\Delta t + \frac{1}{2}\mathbf{a}(t)\Delta t^2 - \frac{1}{6}\mathbf{b}(t)\Delta
      t^3 + \mathcal{O}(\Delta t^4)$$


      Adding these two expansions cancels the odd-order terms (velocity and jerk $\mathbf{b}(t)$):


      $$\mathbf{r}(t + \Delta t) = 2\mathbf{r}(t) - \mathbf{r}(t - \Delta t) + \mathbf{a}(t)\Delta t^2 + \mathcal{O}(\Delta
      t^4)$$


      The local position truncation error is $\mathcal{O}(\Delta t^4)$, yielding an accumulated global position error of $\mathcal{O}(\Delta
      t^2)$ over time $T$.


      ### Velocities and the Velocity Verlet Formulation


      Subtracting the Taylor expansions yields a central-difference estimate for velocity with error $\mathcal{O}(\Delta t^2)$:


      $$\mathbf{v}(t) = \frac{\mathbf{r}(t + \Delta t) - \mathbf{r}(t - \Delta t)}{2\Delta t} + \mathcal{O}(\Delta t^2)$$


      However, the basic Verlet algorithm does not store $\mathbf{v}(t)$ explicitly, making kinetic energy evaluation lag
      by one step. Swope et al. (1982) introduced the mathematically equivalent **Velocity Verlet** scheme, which maintains
      positions and velocities synchronized at time $t$:


      1. Propagate velocity by half-step: $\mathbf{v}(t + \frac{1}{2}\Delta t) = \mathbf{v}(t) + \frac{1}{2}\mathbf{a}(t)\Delta
      t$

      2. Propagate position by full-step: $\mathbf{r}(t + \Delta t) = \mathbf{r}(t) + \mathbf{v}(t + \frac{1}{2}\Delta t)\Delta
      t = \mathbf{r}(t) + \mathbf{v}(t)\Delta t + \frac{1}{2}\mathbf{a}(t)\Delta t^2$

      3. Compute new forces: $\mathbf{a}(t + \Delta t) = \frac{1}{m}\mathbf{F}(\mathbf{r}(t + \Delta t))$

      4. Complete velocity step: $\mathbf{v}(t + \Delta t) = \mathbf{v}(t + \frac{1}{2}\Delta t) + \frac{1}{2}\mathbf{a}(t
      + \Delta t)\Delta t$


      Notice that each step requires exactly **one force evaluation** per particle.'
  - id: concept_integrator_shootout
    type: concept_cell
    title: 'Interactive Concept: Integrator Shootout (Verlet vs Euler vs RK4)'
    description_markdown: 'Compare numerical integrators on a 1D harmonic oscillator $\ddot{x} + \omega^2 x = 0$.

      Select the integrator (`velocity_verlet`, `verlet`, `euler`, `rk4`), adjust timestep $\Delta t$, and track phase space
      orbits and energy conservation.'
    render_function: render_integrator_shootout
    layout:
      kind: matplotlib
      figsize:
      - 9
      - 5
    controls:
      integrator:
        kind: dropdown
        label: Integrator Scheme
        options:
        - label: Velocity Verlet (Symplectic, O(dt^2))
          value: velocity_verlet
        - label: Standard Verlet (Symplectic, O(dt^2))
          value: verlet
        - label: Forward Euler (Explicit, Non-symplectic)
          value: euler
        - label: Runge-Kutta 4th Order (Non-symplectic, O(dt^4))
          value: rk4
        default: velocity_verlet
      dt:
        kind: slider
        label: Timestep dt
        min: 0.01
        max: 0.25
        step: 0.01
        default: 0.05
      n_periods:
        kind: slider
        label: Number of Periods
        min: 1
        max: 20
        step: 1
        default: 5
    takeaway_markdown: '**Key Insight:** Forward Euler spirals outward exponentially (violating phase-space volume conservation).
      RK4 produces extremely small short-term errors but accumulates steady secular energy drift over long simulations. In
      contrast, Velocity Verlet and Verlet bound energy fluctuations within a narrow band forever because they exactly conserve
      a shadow Hamiltonian.'
  - id: q04_01
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_md_architecture_and_equations
    prompt_markdown: What does Liouville's theorem state regarding Hamiltonian phase space flow?
    options:
    - id: a
      text_markdown: Total kinetic energy and potential energy are each independently conserved at every point in time.
      text: Total kinetic energy and potential energy are each independently conserved at every point in time.
    - id: b
      text_markdown: The volume of an ensemble of trajectories in $6N$-dimensional phase space is conserved over time ($d\Omega/dt
        = 0$).
      text: The volume of an ensemble of trajectories in $6N$-dimensional phase space is conserved over time ($d\Omega/dt
        = 0$).
    - id: c
      text_markdown: The distance between any two nearby trajectories in phase space remains strictly constant.
      text: The distance between any two nearby trajectories in phase space remains strictly constant.
    - id: d
      text_markdown: All microstates in phase space have zero momentum.
      text: All microstates in phase space have zero momentum.
    correct: b
    hint_markdown: Recall the divergence of the canonical phase-space velocity field $\nabla_\Gamma \cdot \mathbf{u} = 0$.
    rationale_markdown: Liouville's theorem states that the phase-space density along a trajectory is constant, meaning any
      volume element in $6N$-dimensional phase space $(\mathbf{r}^N, \mathbf{p}^N)$ preserves its volume under exact Hamiltonian
      evolution.
  - id: q04_02
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_integrators_and_symplectic_geometry
    prompt_markdown: In the derivation of the standard Verlet algorithm $\mathbf{r}(t+\Delta t) = 2\mathbf{r}(t) - \mathbf{r}(t-\Delta
      t) + \mathbf{a}(t)\Delta t^2$, why do the odd-power terms in $\Delta t$ vanish?
    options:
    - id: a
      text_markdown: The odd derivatives of potential energy are identically zero for all physical potentials.
      text: The odd derivatives of potential energy are identically zero for all physical potentials.
    - id: b
      text_markdown: Adding forward $\mathbf{r}(t+\Delta t)$ and backward $\mathbf{r}(t-\Delta t)$ Taylor expansions cancels
        all odd powers of $\Delta t$ by symmetry.
      text: Adding forward $\mathbf{r}(t+\Delta t)$ and backward $\mathbf{r}(t-\Delta t)$ Taylor expansions cancels all odd
        powers of $\Delta t$ by symmetry.
    - id: c
      text_markdown: Newton's second law sets odd time derivatives of position to zero.
      text: Newton's second law sets odd time derivatives of position to zero.
    - id: d
      text_markdown: The kinetic energy cancels out the odd terms.
      text: The kinetic energy cancels out the odd terms.
    correct: b
    hint_markdown: Consider $(+\Delta t)^n + (-\Delta t)^n$ for $n=1, 3, 5$.
    rationale_markdown: Because $(+\Delta t)^n + (-\Delta t)^n = 0$ for all odd $n$, summing $\mathbf{r}(t+\Delta t)$ and
      $\mathbf{r}(t-\Delta t)$ eliminates the $\mathbf{v}(t)\Delta t$ and $\frac{1}{6}\mathbf{b}(t)\Delta t^3$ terms, leaving
      only even powers.
  - id: q04_03
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_integrators_and_symplectic_geometry
    prompt_markdown: What are the local position truncation error and global position truncation error of the Verlet algorithm
      over a fixed simulation time $T$?
    options:
    - id: a
      text_markdown: Local error is $\mathcal{O}(\Delta t^2)$, global error is $\mathcal{O}(\Delta t)$.
      text: Local error is $\mathcal{O}(\Delta t^2)$, global error is $\mathcal{O}(\Delta t)$.
    - id: b
      text_markdown: Local error is $\mathcal{O}(\Delta t^3)$, global error is $\mathcal{O}(\Delta t^2)$.
      text: Local error is $\mathcal{O}(\Delta t^3)$, global error is $\mathcal{O}(\Delta t^2)$.
    - id: c
      text_markdown: Local error is $\mathcal{O}(\Delta t^4)$, global error is $\mathcal{O}(\Delta t^2)$.
      text: Local error is $\mathcal{O}(\Delta t^4)$, global error is $\mathcal{O}(\Delta t^2)$.
    - id: d
      text_markdown: Local error is $\mathcal{O}(\Delta t^4)$, global error is $\mathcal{O}(\Delta t^3)$.
      text: Local error is $\mathcal{O}(\Delta t^4)$, global error is $\mathcal{O}(\Delta t^3)$.
    correct: c
    hint_markdown: The lowest discarded term in the summed Taylor series is $\frac{2}{4!} \mathbf{r}^{(4)}(t)\Delta t^4$.
      Over $N_{\text{steps}} = T/\Delta t$ steps, how does error accumulate?
    rationale_markdown: The local truncation error is $\mathcal{O}(\Delta t^4)$. Integrating over $N_{\text{steps}} = T/\Delta
      t$ steps multiplies by $1/\Delta t^2$ in second-order ODEs (or accumulates $N$ errors of order $\Delta t^4 / \Delta
      t^2$), yielding global position error $\mathcal{O}(\Delta t^2)$.
  - id: q04_04
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_integrators_and_symplectic_geometry
    prompt_markdown: How many force evaluations per particle are required in each timestep of the Velocity Verlet algorithm?
    options:
    - id: a
      text_markdown: '1'
      text: '1'
    - id: b
      text_markdown: '2'
      text: '2'
    - id: c
      text_markdown: '3'
      text: '3'
    - id: d
      text_markdown: '4'
      text: '4'
    correct: a
    hint_markdown: Notice that the acceleration $\mathbf{a}(t)$ from the end of the previous step is reused at the beginning
      of the new step.
    rationale_markdown: Velocity Verlet computes $\mathbf{a}(t+\Delta t)$ exactly once per timestep (in Step 3). This acceleration
      is used to finish the current velocity update and then reused in Step 1 of the subsequent step.
  - id: q04_05
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: concept_integrator_shootout
    prompt_markdown: When running the forward Euler integrator on a 1D harmonic oscillator in the Concept Cell, what happens
      to the total energy and phase space orbit?
    options:
    - id: a
      text_markdown: Energy is exactly conserved and the orbit is a closed circle.
      text: Energy is exactly conserved and the orbit is a closed circle.
    - id: b
      text_markdown: Energy decreases monotonically and the orbit spirals into the origin $(0, 0)$.
      text: Energy decreases monotonically and the orbit spirals into the origin $(0, 0)$.
    - id: c
      text_markdown: Energy grows monotonically with each step ($E_{n+1} = E_n(1 + \omega^2 \Delta t^2)$), causing the phase
        orbit to spiral outward indefinitely.
      text: Energy grows monotonically with each step ($E_{n+1} = E_n(1 + \omega^2 \Delta t^2)$), causing the phase orbit
        to spiral outward indefinitely.
    - id: d
      text_markdown: Energy oscillates periodically with zero net drift.
      text: Energy oscillates periodically with zero net drift.
    correct: c
    hint_markdown: Calculate $x_{n+1}^2 + v_{n+1}^2$ using $x_{n+1} = x_n + v_n \Delta t$ and $v_{n+1} = v_n - \omega^2 x_n
      \Delta t$.
    rationale_markdown: For forward Euler, $x_{n+1}^2 + v_{n+1}^2/\omega^2 = (1 + \omega^2 \Delta t^2)(x_n^2 + v_n^2/\omega^2)$.
      Since the amplification factor $1 + \omega^2 \Delta t^2 > 1$, energy grows unboundedly and the orbit spirals outwards.
  - id: q04_06
    type: problem
    question_type: multi_select
    difficulty: medium
    taught_by: sec_integrators_and_symplectic_geometry
    prompt_markdown: Which of the following statements about the Leapfrog algorithm are TRUE? (Select all that apply)
    options:
    - id: a
      text_markdown: Velocities are evaluated at half-integer timesteps $t + \frac{1}{2}\Delta t$, while positions are evaluated
        at integer timesteps $t$.
      text: Velocities are evaluated at half-integer timesteps $t + \frac{1}{2}\Delta t$, while positions are evaluated at
        integer timesteps $t$.
    - id: b
      text_markdown: It requires four force evaluations per particle per timestep.
      text: It requires four force evaluations per particle per timestep.
    - id: c
      text_markdown: It produces mathematically identical position trajectories to the standard Verlet and Velocity Verlet
        algorithms.
      text: It produces mathematically identical position trajectories to the standard Verlet and Velocity Verlet algorithms.
    - id: d
      text_markdown: Kinetic energy and potential energy cannot be evaluated at the exact same instant without an interpolation
        step.
      text: Kinetic energy and potential energy cannot be evaluated at the exact same instant without an interpolation step.
    correct:
    - a
    - c
    - d
    hint_markdown: Think about where velocities live relative to positions in Leapfrog, and how many force calls are needed.
    rationale_markdown: Leapfrog evaluates $\mathbf{v}$ at half-steps and $\mathbf{r}$ at whole steps (making simultaneous
      $E_{\text{tot}} = K + V$ require interpolating $\mathbf{v}(t)$). It requires only 1 force evaluation per step and is
      mathematically equivalent to Verlet.
  - id: q04_07
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: concept_integrator_shootout
    prompt_markdown: How does Runge-Kutta 4th order (RK4) compare to Velocity Verlet for long-time ($10^6$ steps) molecular
      dynamics simulations?
    options:
    - id: a
      text_markdown: RK4 is superior for long simulations because its $\mathcal{O}(\Delta t^4)$ error guarantees zero energy
        drift forever.
      text: RK4 is superior for long simulations because its $\mathcal{O}(\Delta t^4)$ error guarantees zero energy drift
        forever.
    - id: b
      text_markdown: RK4 is non-symplectic, causing secular energy drift (energy continually ramps up or down) over long times,
        and it requires 4 force evaluations per step versus 1 for Verlet.
      text: RK4 is non-symplectic, causing secular energy drift (energy continually ramps up or down) over long times, and
        it requires 4 force evaluations per step versus 1 for Verlet.
    - id: c
      text_markdown: RK4 is identical to Velocity Verlet in both computational cost and symplecticity.
      text: RK4 is identical to Velocity Verlet in both computational cost and symplecticity.
    - id: d
      text_markdown: RK4 cannot be applied to systems with velocity-independent forces.
      text: RK4 cannot be applied to systems with velocity-independent forces.
    correct: b
    hint_markdown: Recall the distinction between local truncation error order and symplecticity (conservation of shadow Hamiltonian).
    rationale_markdown: Although RK4 has very low local error $\mathcal{O}(\Delta t^5)$, it is not symplectic. The phase space
      Jacobian does not equal 1, resulting in secular energy drift over long simulations. Furthermore, RK4 requires 4 force
      evaluations per step, making it ~4x more expensive per step.
  - id: q04_08
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_integrators_and_symplectic_geometry
    prompt_markdown: In Velocity Verlet, a particle starts at $x(0) = 1.0\text{ nm}$ with velocity $v(0) = 0.5\text{ nm/ps}$
      and constant acceleration $a = -2.0\text{ nm/ps}^2$. Using timestep $\Delta t = 0.1\text{ ps}$, calculate its position
      $x(\Delta t)$ in nm.
    correct: 1.04
    tolerance: 0.001
    unit: nm
    hint_markdown: Apply the first update step of the Velocity Verlet position algorithm using the initial position, velocity,
      and current acceleration.
    rationale_markdown: $x(0.1) = 1.0 + (0.5)(0.1) + 0.5(-2.0)(0.1)^2 = 1.0 + 0.05 - 0.01 = 1.04\text{ nm}$.
  - id: q04_09
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_integrators_and_symplectic_geometry
    prompt_markdown: Continuing from the previous problem, assuming the force remains constant so that $a(\Delta t) = -2.0\text{
      nm/ps}^2$, calculate the final velocity $v(\Delta t)$ in nm/ps after the step.
    correct: 0.3
    tolerance: 0.001
    unit: nm/ps
    hint_markdown: Evaluate the velocity update by integrating the average of the initial and final accelerations across the
      timestep.
    rationale_markdown: $v(0.1) = 0.5 + 0.5(-2.0 - 2.0)(0.1) = 0.5 - 0.2 = 0.30\text{ nm/ps}$.
  - id: q04_10
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_md_architecture_and_equations
    prompt_markdown: Let $\mathbf{M}$ be the Jacobian matrix of a single-step phase space transformation $(\mathbf{r}_{n+1},
      \mathbf{p}_{n+1}) = \Phi_{\Delta t}(\mathbf{r}_n, \mathbf{p}_n)$. What is the necessary and sufficient condition for
      $\Phi_{\Delta t}$ to be a symplectic map?
    options:
    - id: a
      text_markdown: $\mathbf{M}^T \mathbf{M} = \mathbf{I}$ (orthogonal matrix)
      text: $\mathbf{M}^T \mathbf{M} = \mathbf{I}$ (orthogonal matrix)
    - id: b
      text_markdown: $\mathbf{M}^T \mathbf{J} \mathbf{M} = \mathbf{J}$, where $\mathbf{J} = \begin{pmatrix} 0 & \mathbf{I}
        \\ -\mathbf{I} & 0 \end{pmatrix}$ is the standard symplectic matrix
      text: $\mathbf{M}^T \mathbf{J} \mathbf{M} = \mathbf{J}$, where $\mathbf{J} = \begin{pmatrix} 0 & \mathbf{I} \\ -\mathbf{I}
        & 0 \end{pmatrix}$ is the standard symplectic matrix
    - id: c
      text_markdown: $\text{Tr}(\mathbf{M}) = 0$
      text: $\text{Tr}(\mathbf{M}) = 0$
    - id: d
      text_markdown: All eigenvalues of $\mathbf{M}$ must be strictly real
      text: All eigenvalues of $\mathbf{M}$ must be strictly real
    correct: b
    hint_markdown: Symplectic maps preserve the canonical Poisson bracket structure and phase space 2-form $\omega$.
    rationale_markdown: By definition, a linear transformation (or tangent map $\mathbf{M}$) is symplectic if and only if
      $\mathbf{M}^T \mathbf{J} \mathbf{M} = \mathbf{J}$, which guarantees the preservation of the differential 2-form $\sum_i
      d\mathbf{r}_i \wedge d\mathbf{p}_i$ and implies $\det(\mathbf{M}) = 1$.
  - id: sec_shadow_hamiltonian_and_drift
    type: markdown_section
    title: 3. Symplectic Geometry, Shadow Hamiltonians, and Long-Term Stability
    body_markdown: '### Why Doesn''t Verlet Drift in Energy?


      In naive numerical integration of non-linear ODEs, one expects numerical errors to accumulate like a random walk or
      secular trend, causing the computed energy $E(t)$ to diverge systematically over long simulation times.


      Yet in MD simulations lasting millions of steps, Velocity Verlet exhibits **bounded energy oscillations** with **zero
      secular drift**. This remarkable property is explained by **backward error analysis**:


      A symplectic integrator does not follow the exact trajectory of the true Hamiltonian $\mathcal{H}(\mathbf{r}, \mathbf{p})$,
      but it follows the *exact* trajectory of a nearby **shadow Hamiltonian** (or modified Hamiltonian) $\widetilde{\mathcal{H}}$:


      $$\widetilde{\mathcal{H}}(\mathbf{r}, \mathbf{p}) = \mathcal{H}(\mathbf{r}, \mathbf{p}) + \Delta t^2 \mathcal{H}_2(\mathbf{r},
      \mathbf{p}) + \Delta t^4 \mathcal{H}_4(\mathbf{r}, \mathbf{p}) + \dots$$


      For a 1D harmonic oscillator with $\mathcal{H} = \frac{1}{2}p^2 + \frac{1}{2}\omega^2 x^2$, the shadow Hamiltonian conserved
      exactly by Velocity Verlet is:


      $$\widetilde{\mathcal{H}} = \frac{p^2}{2(1 - \frac{1}{4}\omega^2 \Delta t^2)} + \frac{1}{2}\omega^2 x^2$$


      Because $\widetilde{\mathcal{H}}$ is a true constant of motion for the discrete trajectory, the true energy $\mathcal{H}$
      cannot drift away! It merely oscillates around $\widetilde{\mathcal{H}}$ with amplitude $\mathcal{O}(\Delta t^2)$:


      $$|\mathcal{H}(t) - \widetilde{\mathcal{H}}| \le C \Delta t^2$$


      Non-symplectic integrators (such as standard Runge-Kutta or Euler) do not conserve any shadow Hamiltonian, which allows
      their energy to drift linearly with time $\sim t \Delta t^p$.'
  - id: concept_cutoff_discontinuity
    type: concept_cell
    title: 'Interactive Concept: Potential Truncation & Force Discontinuity'
    description_markdown: 'Examine the effect of truncating a Lennard-Jones potential at cutoff radius $r_c$.

      Compare the unshifted potential $V(r)$, the shifted potential $V_{\text{shift}}(r) = V(r) - V(r_c)$, and the force $F(r)
      = -dV/dr$. Notice the delta-function force impulse that occurs when an unshifted potential is cut off abruptly.'
    render_function: render_cutoff_discontinuity
    layout:
      kind: matplotlib
      figsize:
      - 9
      - 5
    controls:
      rc:
        kind: slider
        label: Cutoff Radius r_c (in sigma)
        min: 1.5
        max: 3.5
        step: 0.1
        default: 2.5
      show_force:
        kind: dropdown
        label: Display Mode
        options:
        - label: Potential Energy V(r)
          value: 0
        - label: Pair Force F(r)
          value: 1
        default: 0
    takeaway_markdown: '**Key Insight:** Abruptly truncating $V(r)$ at $r_c$ creates a discontinuous potential step $\Delta
      V = V(r_c) \ne 0$. Taking the negative gradient produces an infinite impulsive force $-V(r_c)\delta(r - r_c)$ whenever
      an atom crosses $r_c$, destroying energy conservation. Shifting the potential $V_{\text{shift}}(r) = V(r) - V(r_c)$
      eliminates the step in $V$, but leaves a jump in force $F(r_c^-) \ne 0$ unless force-shifting or switching functions
      are applied.'
  - id: q04_11
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_shadow_hamiltonian_and_drift
    prompt_markdown: Why do symplectic integrators like Velocity Verlet exhibit bounded energy fluctuations without long-term
      drift?
    options:
    - id: a
      text_markdown: They use variable timesteps that automatically shrink whenever energy starts to drift.
      text: They use variable timesteps that automatically shrink whenever energy starts to drift.
    - id: b
      text_markdown: They exactly conserve a nearby 'shadow' or modified Hamiltonian $\widetilde{\mathcal{H}} = \mathcal{H}
        + \mathcal{O}(\Delta t^2)$.
      text: They exactly conserve a nearby 'shadow' or modified Hamiltonian $\widetilde{\mathcal{H}} = \mathcal{H} + \mathcal{O}(\Delta
        t^2)$.
    - id: c
      text_markdown: Rounding errors from IEEE 754 floating point cancel out the integration truncation errors.
      text: Rounding errors from IEEE 754 floating point cancel out the integration truncation errors.
    - id: d
      text_markdown: They enforce an explicit Lagrange multiplier constraint on the total kinetic energy.
      text: They enforce an explicit Lagrange multiplier constraint on the total kinetic energy.
    correct: b
    hint_markdown: Look at backward error analysis and the modified Hamiltonian concept.
    rationale_markdown: Symplectic integrators exactly trace the continuous flow of an asymptotic modified Hamiltonian $\widetilde{\mathcal{H}}
      = \mathcal{H} + \Delta t^2 \mathcal{H}_2 + \dots$. Because $\widetilde{\mathcal{H}}$ is strictly conserved, the true
      Hamiltonian $\mathcal{H}$ oscillates within a narrow band of width $\mathcal{O}(\Delta t^2)$ and cannot secularly drift.
  - id: q04_12
    type: problem
    question_type: single_select
    difficulty: hard
