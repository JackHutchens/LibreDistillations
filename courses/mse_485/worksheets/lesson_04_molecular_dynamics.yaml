      the starting point to machine precision ($|x_f - x_0| \sim 10^{-14}$). However, introducing even a tiny perturbation
      $\epsilon \sim 10^{-5}$ causes chaotic trajectory divergence due to the positive Lyapunov exponent of the system.'
  - id: q04_31
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_reversibility_and_complexity
    prompt_markdown: In an $N$-body system with pair potentials, how many pair distances $r_{ij}$ must be computed in a naive
      direct double sum without neighbor lists?
    options:
    - id: a
      text_markdown: $N$
      text: $N$
    - id: b
      text_markdown: $N \log N$
      text: $N \log N$
    - id: c
      text_markdown: $\frac{N(N - 1)}{2} \approx \frac{N^2}{2}$
      text: $\frac{N(N - 1)}{2} \approx \frac{N^2}{2}$
    - id: d
      text_markdown: $N^3$
      text: $N^3$
    correct: c
    hint_markdown: How many distinct pairs can be chosen from $N$ items?
    rationale_markdown: A naive double sum pairs each particle $i$ with all particles $j > i$, requiring $\binom{N}{2} = \frac{N(N-1)}{2}
      = \mathcal{O}(N^2)$ force evaluations.
  - id: q04_32
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_reversibility_and_complexity
    prompt_markdown: In a Verlet neighbor list with cutoff $r_c$ and skin buffer $r_{\text{skin}}$ (so list radius $r_m =
      r_c + r_{\text{skin}}$), what is the criterion that guarantees no pair can enter $r_c$ before the neighbor list is rebuilt?
    options:
    - id: a
      text_markdown: The simulation has completed 100 timesteps.
      text: The simulation has completed 100 timesteps.
    - id: b
      text_markdown: The maximum displacement of any particle since the last update exceeds $r_{\text{skin}} / 2$ (or sum
        of maximum two displacements $> r_{\text{skin}}$).
      text: The maximum displacement of any particle since the last update exceeds $r_{\text{skin}} / 2$ (or sum of maximum
        two displacements $> r_{\text{skin}}$).
    - id: c
      text_markdown: The total kinetic energy changes by more than 5%.
      text: The total kinetic energy changes by more than 5%.
    - id: d
      text_markdown: At least one particle crosses a periodic boundary.
      text: At least one particle crosses a periodic boundary.
    correct: b
    hint_markdown: If particle $i$ moves by $\Delta r_i$ and particle $j$ moves by $\Delta r_j$, what is the maximum change
      in their separation distance $|\Delta r_{ij}|$?
    rationale_markdown: By the triangle inequality, the distance between particles $i$ and $j$ can decrease by at most $|\Delta\mathbf{r}_i|
      + |\Delta\mathbf{r}_j| \le 2 \Delta r_{\max}$. If $2 \Delta r_{\max} < r_{\text{skin}}$ (i.e. $\Delta r_{\max} < r_{\text{skin}}/2$),
      no pair outside $r_m$ could possibly have approached closer than $r_c$.
  - id: q04_33
