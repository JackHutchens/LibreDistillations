  - id: sec_reversibility_and_complexity
    type: markdown_section
    title: 5. Time-Reversibility, Lyapunov Instability, and Neighbor Lists
    body_markdown: '### Exact Algebraic Time-Reversibility


      Newton''s equations of motion are invariant under time reversal $t \to -t$ and $\mathbf{v} \to -\mathbf{v}$. An integrator
      is **time-reversible** if reversing the velocities $\mathbf{v} \to -\mathbf{v}$ causes the trajectory to trace back
      its steps in exact reverse order.


      In the Velocity Verlet algorithm:


      $$\mathbf{r}(t+\Delta t) = \mathbf{r}(t) + \mathbf{v}(t)\Delta t + \frac{1}{2}\mathbf{a}(t)\Delta t^2$$

      $$\mathbf{v}(t+\Delta t) = \mathbf{v}(t) + \frac{1}{2}[\mathbf{a}(t) + \mathbf{a}(t+\Delta t)]\Delta t$$


      Replacing $\Delta t$ with $-\Delta t$ yields the exact algebraic inverse mapping. However, in practical floating-point
      simulations, two factors limit numerical reversibility:


      1. **Finite-Precision Roundoff:** Non-associativity of IEEE 754 floating-point addition ($(a + b) + c \ne a + (b + c)$).

      2. **Lyapunov Instability:** Many-body systems are chaotic. Two trajectories separated initially by $\delta r(0)$ diverge
      exponentially:


      $$\delta r(t) \approx \delta r(0) e^{\lambda_{\text{max}} t}$$


      where $\lambda_{\text{max}} > 0$ is the maximal Lyapunov exponent. After a Lyapunov time $\tau_L \sim 1/\lambda_{\text{max}}$,
      microscopic roundoff error is amplified to macroscopic separation, preventing long-time trajectory reversal even though
      macroscopic thermodynamics remains exact!


      ### Computational Complexity of Force Evaluation


      A naive loop over all pairs in an $N$-atom system scales as $\mathcal{O}(N^2)$:


      $$N_{\text{pairs}} = \frac{N(N - 1)}{2} \approx \frac{N^2}{2}$$


      For short-range potentials truncated at $r_c$, two techniques reduce this complexity to $\mathcal{O}(N)$:


      - **Verlet Neighbor Lists:** Each atom maintains a list of neighbors within a larger sphere $r_m = r_c + r_{\text{skin}}$.
      The list is rebuilt only when the maximum particle displacement exceeds $r_{\text{skin}}/2$, amortizing the search cost
      over many steps.

      - **Cell Subdivision (Linked-Cell Lists):** The simulation box is divided into cells of width $d \ge r_c$. Each atom
      only checks neighbors in its own cell and the 26 adjacent neighboring cells, achieving strict $\mathcal{O}(N)$ scaling.'
  - id: concept_time_reversibility_lab
    type: concept_cell
    title: 'Interactive Concept: Time-Reversibility Lab & Velocity Inversion'
    description_markdown: 'Test the algebraic time-reversibility of the Velocity Verlet algorithm.

      The simulation integrates $N_{\text{forward}}$ steps forward, inverts all particle velocities $\mathbf{v} \to -\mathbf{v}$,
      and integrates $N_{\text{forward}}$ steps backward. Adjust $N_{\text{forward}}$, $\Delta t$, and add a tiny perturbation
      $\epsilon$ to observe the Lyapunov divergence.'
