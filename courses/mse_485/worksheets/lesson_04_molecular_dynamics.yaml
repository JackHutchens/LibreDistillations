    rationale_markdown: If $d \ge r_c$, any particle at distance $\le r_c$ from an atom located anywhere inside cell $(i,
      j, k)$ is guaranteed to lie either in cell $(i, j, k)$ or in one of the 26 neighboring cells sharing a face, edge, or
      corner. If $d < r_c$, particles in next-nearest cells could interact, requiring searches beyond the 26 nearest cells.
  - id: q04_35
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_reversibility_and_complexity
    prompt_markdown: Why are MD trajectories in a classical many-body liquid unable to retrace their forward path when velocities
      are reversed after a long time ($t > 100\text{ ps}$), despite Velocity Verlet being algebraically time-reversible?
    options:
    - id: a
      text_markdown: Verlet algorithm breaks time-reversal symmetry by having odd orders of $\Delta t$.
      text: Verlet algorithm breaks time-reversal symmetry by having odd orders of $\Delta t$.
    - id: b
      text_markdown: The positive Lyapunov exponent causes exponential growth $\sim e^{\lambda t}$ of tiny floating-point
        roundoff errors ($10^{-16}$), completely desynchronizing the microscopic reversed trajectory.
      text: The positive Lyapunov exponent causes exponential growth $\sim e^{\lambda t}$ of tiny floating-point roundoff
        errors ($10^{-16}$), completely desynchronizing the microscopic reversed trajectory.
    - id: c
      text_markdown: Newton's laws of motion are fundamentally not invariant under time reversal in three dimensions.
      text: Newton's laws of motion are fundamentally not invariant under time reversal in three dimensions.
    - id: d
      text_markdown: Potential cutoffs permanently delete particle information from memory.
      text: Potential cutoffs permanently delete particle information from memory.
    correct: b
    hint_markdown: Recall the discussion of chaos, Lyapunov instability, and roundoff error.
    rationale_markdown: Many-body classical systems are chaotic with positive Lyapunov exponents $\lambda > 0$. Microscopic
      roundoff errors of order $10^{-16}$ grow exponentially as $\delta(t) \approx \delta(0) e^{\lambda t}$. After several
      Lyapunov times, the error reaches macroscopic scale (~interatomic spacing), diverging from the exact time-reversed path.
  - id: q04_36
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_reversibility_and_complexity
    prompt_markdown: If chaotic divergence destroys exact microscopic time reversibility after a few picoseconds, why are
      equilibrium thermodynamic properties computed from MD simulations still valid?
    options:
    - id: a
      text_markdown: The shadowing lemma guarantees that the computed numerical trajectory remains uniformly close to *some*
        true physical trajectory with slightly different initial conditions.
      text: The shadowing lemma guarantees that the computed numerical trajectory remains uniformly close to *some* true physical
        trajectory with slightly different initial conditions.
    - id: b
      text_markdown: Thermodynamics only depends on the first timestep of a simulation.
      text: Thermodynamics only depends on the first timestep of a simulation.
    - id: c
      text_markdown: Chaos only affects the potential energy, not the kinetic energy.
      text: Chaos only affects the potential energy, not the kinetic energy.
    - id: d
      text_markdown: Floating point errors always average to zero identically.
      text: Floating point errors always average to zero identically.
    correct: a
    hint_markdown: Review the quote from Berendsen on slide 9 and the concept of 'shadowing'.
    rationale_markdown: As Berendsen noted, we do not need the *exact* trajectory from specific initial conditions; we only
      need a representative trajectory that samples the correct microcanonical phase-space distribution. By the shadowing
      lemma, the numerical trajectory stays close to a true trajectory of the physical system, preserving statistical ensemble
      averages.
  - id: q04_37
    type: problem
    question_type: numeric
    difficulty: hard
    taught_by: sec_reversibility_and_complexity
    prompt_markdown: In a liquid simulation with maximal Lyapunov exponent $\lambda_{\text{max}} = 0.5\text{ ps}^{-1}$, an
      initial floating-point roundoff error is $\delta_0 = 10^{-15}\text{ nm}$. Approximately how long in picoseconds (ps)
      will it take for the trajectory separation $\delta(t) = \delta_0 e^{\lambda_{\text{max}} t}$ to grow to the size of
      an atomic radius $\delta(t) = 0.1\text{ nm}$?
    correct: 64.5
    tolerance: 2.0
    unit: ps
    hint_markdown: Relate the elapsed time to the initial separation, target separation, and exponential growth rate via the
      Lyapunov divergence relation.
    rationale_markdown: $t = \frac{1}{0.5} \ln(0.1 / 10^{-15}) = 2 \times \ln(10^{14}) = 2 \times (14 \times 2.302585) = 2
      \times 32.236 = 64.47\text{ ps}$.
