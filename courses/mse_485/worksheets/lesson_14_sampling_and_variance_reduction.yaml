    taught_by: sec_importance_sampling_and_variance_trap
    prompt_markdown: 'Why is **over-sampling** the tails of an integrand (choosing an importance distribution $p(x)$ that is slightly broader/heavier-tailed than $|f(x)|$, such as $a = 1.0$) always much safer than **under-sampling** the tails (choosing $p(x)$ narrower than $\sqrt{|f(x)|}$, such as $a = 0.4$)?

      '
    hint_markdown: Review slide 17 ('Do not under-sample -- could cause infinite variance. Over-sampling -- loss in efficiency but not infinite variance.').
    options:
    - id: a
