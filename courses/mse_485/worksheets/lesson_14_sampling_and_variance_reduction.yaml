worksheet:
  id: lesson_14_sampling_and_variance_reduction
  title: 'MSE 485 · Lesson 14: Non-Uniform Sampling, Cholesky Gaussians & Importance Sampling Variance Reduction'
  estimated_minutes: 115
  learning_objectives:
  - Sample arbitrary discrete probability distributions p_k in O(log_2 K) steps by constructing a cumulative probability table c_k and applying binary bisection search.
  - Derive analytic inverse-CDF mappings x = C^{-1}(u) for exponential waiting times, power-law distributions, and Poisson decay counts.
  - Implement von Neumann rejection sampling with proposal envelope a q(x) >= p(x), prove that the acceptance efficiency equals 1/a, and explain its exponential collapse in high dimensions.
  - Generate 1D normal variates via the 12-uniform Central Limit composition trick, trigonometric Box-Muller, and rejection-based Polar Box-Muller, and transform them into D-dimensional correlated Gaussians via Cholesky factorization S S^T = T.
  - Optimize Monte Carlo efficiency zeta = 1/(v T) via Importance Sampling, derive the zero-variance optimal density p*(x) = |f(x)| / int |f|, and diagnose the infinite-variance tail trap (a <= 1/2) in Gaussian importance sampling.
  - Formulate correlated sampling for free-energy or parameter differences and prove why independent uniform sampling of the canonical partition function Z(beta) fails exponentially with particle count N.
  sections:
  - id: sec_discrete_and_inverse_mapping
    type: markdown_section
    title: '1. Transforming Uniform Draws: Discrete Bisection Tables & Continuous Inverse Mapping'
    body_markdown: "In Lesson 13 we learned how to generate a stream of independent **uniform random numbers** (`udrn`) $u \\sim U(0, 1)$. To simulate physical processes (such as Kinetic Monte Carlo event selection, Maxwell–Boltzmann velocities, or radioactive decay) or to reduce integration variance, we must transform $u \\in (0, 1)$ into draws from an arbitrary **non-uniform** distribution $p(x)$.\n\n### Discrete Distributions: Cumulative Table & Bisection Search\nSuppose an system can jump into one of $K$ discrete outcomes with normalized probabilities $p_1, p_2, \\dots, p_K$ ($\\sum_{i=1}^K p_i = 1$).\n1. **Precompute the Cumulative Table** before the simulation loop ($c_0 = 0$, $c_K = 1$):\n   $$c_k = \\sum_{i=1}^k p_i = c_{k-1} + p_k \\qquad (k = 1, 2, \\dots, K)$$\n2. **Sample $u \\in (0, 1)$** and locate the unique bin index $k$ satisfying:\n   $$c_{k-1} < u \\le c_k$$\n3. **Search Complexity:** Because $0 = c_0 \\le c_1 \\le \\dots \\le c_K = 1$ is monotonically sorted, we locate\
      \ $k$ by **bisection (binary search)** in **$\\mathcal{O}(\\log_2 K)$** steps instead of an $\\mathcal{O}(K)$ linear scan!\n\n### Continuous Distributions: The Inverse Mapping Method\nGeneralizing the cumulative sum to a continuous probability density $p(x)$ ($\\int_{-\\infty}^{\\infty} p(x)\\,dx = 1$), we define the **Cumulative Distribution Function (CDF)** $C(y)$ as the area under $p(x)$ to the left of $y$:\n$$C(y) = \\int_{-\\infty}^y p(x)\\,dx \\in [0, 1]$$\nSetting $C(x) = u \\sim U(0, 1)$ and inverting gives the **exact inverse mapping**:\n$$x = C^{-1}(u)$$\n*(Why does this work? Because $du = dC(x) = p(x)\\,dx$, a uniform density $du$ on $(0,1)$ maps directly onto the probability element $p(x)\\,dx$!)*\n\n#### Two Essential Analytic Inverse Mappings\n1. **Exponential Distribution (KMC Escape Times / Radioactive Decay):**\n   $$p(x) = a e^{-ax} \\quad (x > 0, \\; a > 0) \\implies C(x) = \\int_0^x a e^{-ay}\\,dy = 1 - e^{-ax} = u$$\n   Solving for $x$ (and noting that $1 - u$\
      \ has the exact same uniform distribution on $(0,1)$ as $u$):\n   $$x = -\\frac{\\ln(1 - u)}{a} \\equiv -\\frac{\\ln(u)}{a}$$\n2. **Power-Law Distribution on $[0, 1]$:**\n   $$p(x) = (a + 1)x^a \\quad (0 < x < 1, \\; a > -1) \\implies C(x) = \\int_0^x (a+1)y^a\\,dy = x^{a+1} = u \\implies x = u^{1/(a+1)}$$\n\n### Connection to the Poisson Distribution\nIn $N$ independent Bernoulli trials each with small success probability $p = \\nu / N$ (expected successes $\\nu = Np$), the binomial distribution $P_B(n|N) = \\frac{N!}{n!(N-n)!}p^n(1-p)^{N-n}$ converges as $N \\to \\infty$ to the **Poisson distribution**:\n$$P_{\\text{Poisson}}(n) = \\lim_{N\\to\\infty} \\frac{N!}{n!(N-n)!}\\left(\\frac{\\nu}{N}\\right)^n\\left(1 - \\frac{\\nu}{N}\\right)^{N-n} = \\frac{\\nu^n e^{-\\nu}}{n!}$$\nwhich peaks at $n = \\nu$. Because the waiting time between consecutive Poisson events at rate $a$ is exponentially distributed ($y_k = -\\ln(u_k)/a$), the number of events $n$ occurring within time interval\
      \ $t$ ($\\nu = at$) can be sampled either by inverting the discrete cumulative table $F(n) = \\sum_{m=0}^n \\frac{\\nu^m e^{-\\nu}}{m!}$ or by accumulating exponential waiting times until $\\sum_{k=1}^{n+1} y_k > t$ (equivalently, multiplying uniform draws until $\\prod_{k=1}^{n+1} u_k < e^{-at}$).\n"
  - id: q14_01_discrete_cumulative_table
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_discrete_and_inverse_mapping
    prompt_markdown: 'A Kinetic Monte Carlo site has $K = 4$ possible hopping events with normalized probabilities $p_1 = 0.15$, $p_2 = 0.35$, $p_3 = 0.30$, and $p_4 = 0.20$. You construct the cumulative table $c_k = \sum_{i=1}^k p_i$ ($c_1 = 0.15, c_2 = 0.50, c_3 = 0.80, c_4 = 1.00$) and draw a uniform random number $u = 0.62$. Which event index $k \in \{1, 2, 3, 4\}$ is selected by the rule $c_{k-1} < u \le c_k$?

      '
    hint_markdown: Find the interval $(c_{k-1}, c_k]$ that brackets $u = 0.62$.
    correct:
      value: 3
      tolerance: 0.01
    rationale_markdown: 'The cumulative table boundaries are $c_0 = 0.00$, $c_1 = 0.15$, $c_2 = 0.50$, $c_3 = 0.80$, $c_4 = 1.00$. Since $c_2 = 0.50 < 0.62 \le 0.80 = c_3$, the search selects event **$k = 3$**.

      '
  - id: q14_02_bisection_search_steps
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_discrete_and_inverse_mapping
    prompt_markdown: 'In a large lattice Kinetic Monte Carlo simulation, your cumulative probability table has $N = 1024$ possible discrete events. How many comparison steps are required to locate the selected event $c_{k-1} < u \le c_k$ using **bisection (binary search)**, compared to $1024$ worst-case steps for a naive linear scan?

      '
    hint_markdown: Consider how the search interval is halved at each step of a binary search until a single element remains.
    correct:
      value: 10
      tolerance: 0.1
    rationale_markdown: 'Bisection halves the search interval at every comparison, requiring exactly:

      $$\log_2(N) = \log_2(1024) = 10\text{ steps}$$

      which is over $100\times$ faster than a linear scan!

      '
  - id: q14_03_exponential_inverse_mapping
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_discrete_and_inverse_mapping
    prompt_markdown: You are sampling an exponential waiting-time distribution $p(x) = a e^{-ax}$ ($x > 0$) with rate parameter $a = 2.0\text{ ps}^{-1}$ via inverse transform sampling. If the uniform PRNG returns $u = e^{-3} \approx 0.049787$, what waiting time $x$ (in $\text{ps}$) is generated?
    hint_markdown: Invert the cumulative distribution function of the exponential distribution and evaluate at the given deviate.
    correct:
      value: 1.5
      tolerance: 0.01
    rationale_markdown: 'Using the analytic inverse CDF mapping for the exponential distribution:

      $$x = -\frac{\ln(u)}{a} = -\frac{\ln(e^{-3})}{2.0\text{ ps}^{-1}} = \frac{3}{2.0}\text{ ps} = 1.5\text{ ps}$$

      '
  - id: q14_04_power_law_inverse_mapping
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_discrete_and_inverse_mapping
    prompt_markdown: To sample the normalized power-law distribution $p(x) = (a + 1)x^a$ on $0 < x < 1$ with exponent $a = 2$ (so $p(x) = 3x^2$), you apply inverse transform sampling. If your uniform draw is $u = 0.125$, what value of $x$ is returned?
    hint_markdown: Integrate the power-law density to find the CDF on $[0, 1]$, invert for $x(u)$, and evaluate at the given uniform draw.
    correct:
      value: 0.5
      tolerance: 0.005
    rationale_markdown: 'For $p(x) = 3x^2$ ($a = 2$), the CDF is $C(x) = \int_0^x 3y^2\,dy = x^3 = u$. Inverting yields:

      $$x = u^{1/3} = (0.125)^{1/3} = 0.50$$

      '
  - id: q14_05_custom_linear_pdf_inversion
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_discrete_and_inverse_mapping
    prompt_markdown: 'Suppose you want to sample a radial coordinate $r \in [0, R]$ in 2D with probability density proportional to circumference, $p(r) = \frac{2r}{R^2}$ for $0 \le r \le R$. What is the exact inverse mapping $r(u)$ in terms of a uniform random number $u \in (0, 1)$?

      '
    hint_markdown: Find the cumulative distribution function by integrating $p(r)$ from 0 to $r$, then equate to $u$ and invert.
    options:
    - id: a
      text: $r = R\sqrt{u}$
      text_markdown: $r = R\sqrt{u}$
    - id: b
      text: $r = R u^2$
      text_markdown: $r = R u^2$
    - id: c
      text: $r = -R \ln(u)$
      text_markdown: $r = -R \ln(u)$
    - id: d
      text: $r = R u / 2$
      text_markdown: $r = R u / 2$
    correct: a
    rationale_markdown: 'This is a power-law distribution $p(r) \propto r^1$ ($a = 1$) scaled to $[0, R]$:

      $$C(r) = \int_0^r \frac{2r''}{R^2}\,dr'' = \frac{r^2}{R^2} = u \implies r = R\,u^{1/2} = R\sqrt{u}$$

      '
  - id: q14_06_poisson_limit_prob
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_discrete_and_inverse_mapping
    prompt_markdown: 'In the Poisson limit $P(n) = \frac{\nu^n e^{-\nu}}{n!}$ of $N \to \infty$ trials with expected successes $\nu = Np = 2.0$, what is the exact probability $P(n = 2)$ of observing $2$ events? (Enter as a decimal to 3 decimal places.)

      '
    hint_markdown: Evaluate the discrete Poisson distribution formula using the given mean event count.
    correct:
      value: 0.271
      tolerance: 0.003
    rationale_markdown: 'Substituting $\nu = 2.0$ and $n = 2$ into the Poisson distribution:

      $$P(2) = \frac{2^2 e^{-2}}{2!} = \frac{4 e^{-2}}{2} = 2 e^{-2} \approx 2 \times 0.135335 = 0.2707$$

      '
  - id: q14_07_inverse_mapping_limitation
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_discrete_and_inverse_mapping
    prompt_markdown: 'When is the direct continuous inverse mapping method $x = C^{-1}(u)$ **impractical** to use by itself?

      '
    hint_markdown: Think about high-dimensional distributions or 1D PDFs whose cumulative integral $C(y) = \int_{-\infty}^y p(x)dx$ cannot be inverted in closed form.
    options:
    - id: a
      text: When the cumulative integral $C(y)$ or its inverse $C^{-1}(u)$ has no closed-form analytic expression (or is too slow to evaluate numerically) and the problem is multi-dimensional.
      text_markdown: When the cumulative integral $C(y)$ or its inverse $C^{-1}(u)$ has no closed-form analytic expression (or is too slow to evaluate numerically) and the problem is multi-dimensional.
    - id: b
      text: Whenever the probability density $p(x)$ is positive ($p(x) > 0$).
      text_markdown: Whenever the probability density $p(x)$ is positive ($p(x) > 0$).
    - id: c
      text: Whenever $p(x)$ is an exponential distribution $a e^{-ax}$.
      text_markdown: Whenever $p(x)$ is an exponential distribution $a e^{-ax}$.
    - id: d
      text: Whenever the integral of $p(x)$ over all space equals $1$.
      text_markdown: Whenever the integral of $p(x)$ over all space equals $1$.
    correct: a
    rationale_markdown: 'Analytic inverse mapping requires integrating $p(x)$ to obtain $C(y)$ and algebraically solving $C(x) = u$ for $x = C^{-1}(u)$. For many common distributions (even a 1D Gaussian, where $C(y)$ involves $\text{erf}(y)$) and for coupled multi-dimensional densities $p(x_1, \dots, x_D)$, direct inversion is difficult or slow, motivating rejection, composition, and Markov chain methods.

      '
  - id: sec_rejection_composition_and_normals
    type: markdown_section
    title: 2. von Neumann Rejection, Composition Tricks, Box–Muller & Cholesky Gaussians
    body_markdown: "### The von Neumann Rejection Technique\nSuppose we want to sample from a normalized target density $p(x)\\,dx$, and we have a simpler **proposal (comparison) distribution** $q(x)\\,dx$ that we already know how to sample.\n1. Choose an envelope constant $a \\ge 1$ large enough that $a\\,q(x) \\ge p(x)$ everywhere, so the **acceptance probability** $c(x)$ satisfies:\n   $$c(x) = \\frac{p(x)}{a\\,q(x)} \\le 1 \\quad \\forall x \\qquad \\left(\\text{i.e., } a \\ge \\max_x \\frac{p(x)}{q(x)}\\right)$$\n   *(Note: Slide 5 of the lecture writes $c(x) = a_{\\text{slide}}\\,p(x)/q(x) \\le 1$ with $a_{\\text{slide}} \\le \\min[q/p]$ and then denotes the acceptance efficiency by $1/a$; both conventions express the exact same condition: the proposal envelope must bound $p(x)$ from above, and the overall fraction of accepted proposals is the ratio of the area under $p(x)$ to the area under the envelope!)*\n2. **Algorithm Loop:**\n   - Draw a candidate $x \\sim q(x)\\,dx$.\n   - Draw\
      \ a uniform random number $u \\sim U(0, 1)$.\n   - If $u \\le c(x)$, **accept** $x$; otherwise **reject** $x$ and repeat.\n3. **Proof & Efficiency:** The probability that a proposed $x$ lies in $[x, x+dx]$ *and* is accepted is $q(x)\\,dx \\cdot c(x) = \\frac{1}{a}p(x)\\,dx$. Integrating over all $x$ shows that the **overall acceptance probability (efficiency)** is:\n   $$\\text{Efficiency} = \\int_{-\\infty}^{\\infty} q(x) c(x)\\,dx = \\frac{1}{a}\\int_{-\\infty}^{\\infty} p(x)\\,dx = \\frac{1}{a}$$\n   - **Rule:** Choose $q(x)$ to match the shape of $p(x)$ as closely as possible so $a$ is close to $1$. In $D$ dimensions, rejection efficiency scales as $(1/a)^D$, collapsing exponentially for large $D$!\n\n### Composition Methods (Combining Uniform Draws)\n1. **Adding Uniforms (Central Limit Theorem Trick):** A single uniform $u_i \\in [0, 1]$ has mean $1/2$ and variance $1/12$. By the Central Limit Theorem, summing $12$ independent uniforms and subtracting $6$:\n   $$\\zeta = \\sum_{i=1}^{12}\
      \ u_i - 6$$\n   gives a fast, approximate **standard Gaussian** ($\\langle \\zeta \\rangle = 0$, $\\text{Var}(\\zeta) = 12 \\times \\frac{1}{12} = 1$) supported on $(-6, 6)$! *(Warning: Because it is strictly bounded on $[-6, 6]$, never use the 12-udrn trick when rare $>4\\sigma$ tail events matter!)*\n2. **Maximum of $k$ Uniforms:** Let $x = \\max(u_1, u_2, \\dots, u_k)$ where $u_i \\sim U(0, 1)$ are independent. The probability that all $k$ numbers are $\\le x$ is the CDF $C(x) = \\prod_{i=1}^k \\text{Prob}(u_i \\le x) = x^k$. Differentiating gives the exact PDF:\n   $$P(x) = \\frac{d}{dx}\\left(x^k\\right) = k\\,x^{k-1} \\quad (0 \\le x \\le 1)$$\n\n### Exact 1D Normal Distribution: Box–Muller & Polar Rejection\nInstead of inverting $\\text{erf}(y)$ for a single Gaussian $p(y) = (2\\pi)^{-1/2}e^{-y^2/2}$, we generate **two** independent standard normals $(y_1, y_2)$ at once in 2D polar coordinates $(r, \\theta)$:\n$$p(y_1, y_2)\\,dy_1\\,dy_2 = \\frac{1}{2\\pi}e^{-(y_1^2 + y_2^2)/2}\\\
      ,dy_1\\,dy_2 = \\left(\\frac{d\\theta}{2\\pi}\\right)\\left(\\frac{1}{2}e^{-v/2}\\,dv\\right), \\quad v = r^2$$\nSince $\\theta$ is uniform on $[0, 2\\pi)$ and $v = r^2$ is exponentially distributed with rate $a = 1/2$ ($v = -2\\ln x_1$), drawing $x_1, x_2 \\sim U(0, 1)$ yields the **Box–Muller transform**:\n$$y_1 = \\sqrt{-2\\ln x_1}\\cos(2\\pi x_2), \\qquad y_2 = \\sqrt{-2\\ln x_1}\\sin(2\\pi x_2)$$\n- **Polar Rejection Box–Muller (No Trig Functions!):** As shown in the lecture's Python code (slide 8), we eliminate slow $\\sin/\\cos$ calls by sampling $(x, y) = (\\text{udrn}-0.5, \\text{udrn}-0.5)$ inside the unit square $[-0.5, 0.5]^2$ and **rejecting** until $r^2 = x^2 + y^2 \\le 0.25$ (inscribed circle of radius $1/2$, area $\\pi/4$ inside square of area $1$). Then $x/\\sqrt{r^2} = \\cos\\theta$ and $y/\\sqrt{r^2} = \\sin\\theta$, so setting `radius = sigma * sqrt(-2 * ln(udrn) / r2)` produces two exact normal variates `x0 + x * radius` and `y0 + y * radius`!\n\n### Multivariate\
      \ Correlated Gaussians via Cholesky Decomposition\nHow do we sample a $D$-component Gaussian vector $\\mathbf{x} = (x_1, \\dots, x_D)^T$ with mean $\\mathbf{0}$ and target symmetric positive-definite covariance matrix $\\langle x_\\alpha x_\\beta \\rangle = T_{\\alpha\\beta}$?\n1. Compute the **Cholesky (\"square-root\") decomposition** of $\\mathbf{T}$:\n   $$\\mathbf{S}\\mathbf{S}^T = \\mathbf{T}$$\n   where $\\mathbf{S}$ is a **lower-triangular matrix** ($S_{\\alpha i} = 0$ for all entries above the diagonal, $i > \\alpha$).\n2. Generate $D$ independent standard normal variates $\\mathbf{y} = (y_1, \\dots, y_D)^T$ with $\\langle y_i y_j \\rangle = \\delta_{ij}$.\n3. Apply the linear transformation $\\mathbf{x} = \\mathbf{S}\\mathbf{y}$ (or $\\mathbf{x} = \\boldsymbol{\\mu} + \\mathbf{S}\\mathbf{y}$ for nonzero mean):\n   $$x_\\alpha = \\sum_{i=1}^\\alpha S_{\\alpha i} y_i \\implies \\langle x_\\alpha x_\\beta \\rangle = \\sum_{i,j} S_{\\alpha i} S_{\\beta j} \\underbrace{\\langle\
      \ y_i y_j \\rangle}_{\\delta_{ij}} = \\sum_i S_{\\alpha i} S_{\\beta i} = (\\mathbf{S}\\mathbf{S}^T)_{\\alpha\\beta} = T_{\\alpha\\beta}$$\n"
  - id: concept_rejection_sampling
    type: concept_cell
    title: 'Interactive Lab: von Neumann Rejection Sampling & Envelope Efficiency'
    description_markdown: 'Explore von Neumann rejection sampling on $[0, 1]$ using a uniform proposal $q(x) = 1$. Adjust the **Envelope Slack Factor** ($a / a_{\min} \ge 1$) and switch between target distributions $p(x)$ to observe how excess area between the red dashed envelope $a\,q(x)$ and the green target density $p(x)$ turns directly into rejected Monte Carlo proposals ($1/a$ efficiency).

      '
    render_function: render_rejection_sampling_lab
    layout: figure_left
    controls:
      target:
        kind: dropdown
        label: Target Probability Density p(x)
        default: semicircle
        options:
        - label: Wigner Semicircle p(x) = (8/pi)*sqrt(x*(1-x))
          value: semicircle
        - label: Bimodal Double-Peak Target p(x)
          value: bimodal
        - label: Skewed Beta Peak p(x) = 30*x^4*(1-x)
          value: beta_peak
      envelope_slack:
        kind: slider
        label: Envelope Multiplier Slack (a / a_min)
        min: 1.0
        max: 2.5
        step: 0.1
        default: 1.0
        format: .1f
      n_trials:
        kind: slider
        label: Number of Proposed Points N
        min: 100
        max: 1000
        step: 100
        default: 400
      seed:
        kind: slider
        label: Random Seed
        min: 1
        max: 30
        step: 1
        default: 11
    takeaway_markdown: '**Key Takeaway:** Every point below $p(x)$ (green) is accepted ($u \le p(x)/[a\,q(x)]$), while every point between $p(x)$ and $a\,q(x)$ (red) is rejected. The fraction of accepted proposals converges to the area ratio $\int p(x)dx / \int a\,q(x)dx = 1/a$. Making $a$ larger than necessary wastes random numbers without changing the accepted distribution, while setting $a < \max[p/q]$ clips the peaks and biases the sample!

      '
  - id: concept_cholesky_gaussian
    type: concept_cell
    title: 'Interactive Lab: Multivariate Correlated Gaussians via Cholesky Factorization'
    description_markdown: 'Tune the target standard deviations $(\sigma_1, \sigma_2)$ and correlation coefficient $\rho \in (-1, 1)$ of a 2D covariance matrix $\mathbf{T} = \begin{pmatrix} \sigma_1^2 & \rho\sigma_1\sigma_2 \\ \rho\sigma_1\sigma_2 & \sigma_2^2 \end{pmatrix}$. Watch how the lower-triangular Cholesky factor $\mathbf{S}$ ($\mathbf{S}\mathbf{S}^T = \mathbf{T}$) scales and shears an isotropic normal point cloud $\mathbf{y} \sim \mathcal{N}(\mathbf{0}, \mathbf{I})$ into the exact correlated Gaussian ellipse.

      '
    render_function: render_cholesky_multivariate_gaussian
    layout: figure_left
    controls:
      sigma1:
        kind: slider
        label: Standard Deviation sigma_1
        min: 0.5
        max: 2.5
        step: 0.25
        default: 1.5
        format: .2f
      sigma2:
        kind: slider
        label: Standard Deviation sigma_2
        min: 0.5
        max: 2.5
        step: 0.25
        default: 1.0
        format: .2f
      rho:
        kind: slider
        label: Correlation Coefficient rho
        min: -0.9
        max: 0.9
        step: 0.15
        default: 0.75
        format: .2f
      n_samples:
        kind: slider
        label: Sample Cloud Size N
        min: 100
        max: 800
        step: 100
        default: 400
    takeaway_markdown: '**Key Takeaway:** Because $\mathbf{S}$ is lower-triangular ($S_{12} = 0$), $x_1 = S_{11} y_1 = \sigma_1 y_1$ depends only on $y_1$, while $x_2 = S_{21} y_1 + S_{22} y_2 = \sigma_2(\rho y_1 + \sqrt{1-\rho^2}\,y_2)$ mixes $y_1$ and $y_2$ to produce the exact cross-correlation $\langle x_1 x_2 \rangle = \rho\sigma_1\sigma_2$.

      '
  - id: q14_08_rejection_acceptance_prob
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by:
    - sec_rejection_composition_and_normals
    - concept_rejection_sampling
    prompt_markdown: You use von Neumann rejection sampling to draw from a target density $p(x)$ on $[0, 1]$ using a uniform proposal density $q(x) = 1$. If the maximum value of $p(x)$ on $[0, 1]$ is $p_{\max} = 2.5$ and you choose the tightest valid envelope multiplier $a = 2.5$ so that $c(x) = p(x) / [a\,q(x)] \le 1$, what is the exact overall **acceptance efficiency** of the sampler? (Enter as a decimal.)
    hint_markdown: Relate the overall acceptance efficiency of von Neumann rejection sampling to the bounding envelope scale factor.
    correct:
      value: 0.4
      tolerance: 0.005
    rationale_markdown: 'When $a\,q(x) \ge p(x)$ everywhere and both $p(x)$ and $q(x)$ are normalized to $1$, the fraction of proposed points accepted is:

      $$\text{Efficiency} = \int_0^1 q(x) c(x)\,dx = \int_0^1 q(x)\frac{p(x)}{a\,q(x)}\,dx = \frac{1}{a} = \frac{1}{2.5} = 0.40 \ (40\%)$$

      '
  - id: q14_09_rejection_semicircle_envelope
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_rejection_composition_and_normals
    - concept_rejection_sampling
    prompt_markdown: 'Consider sampling the normalized Wigner semicircle distribution $p(x) = \frac{8}{\pi}\sqrt{x(1-x)}$ on $[0, 1]$ using a uniform proposal $q(x) = 1$ (the first preset in the Rejection Sampling lab above). What is the minimum valid envelope constant $a_{\min} = \max_{x \in [0,1]} [p(x) / q(x)]$ so that $c(x) \le 1$ for all $x \in [0, 1]$? (Enter to 3 decimal places.)

      '
    hint_markdown: Find the maximum value of the semicircle target distribution on the interval by evaluating the peak of $x(1-x)$.
    correct:
      value: 1.273
      tolerance: 0.005
    rationale_markdown: 'The maximum of $p(x) = \frac{8}{\pi}\sqrt{x(1-x)}$ occurs at the midpoint $x = 1/2$:

      $$a_{\min} = p(0.5) = \frac{8}{\pi}\sqrt{\frac{1}{2}\left(1 - \frac{1}{2}\right)} = \frac{4}{\pi} \approx 1.2732$$

      giving an acceptance efficiency of $1/a_{\min} = \pi/4 \approx 78.54\%$.

      '
  - id: q14_10_rejection_high_dim_curse
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_rejection_composition_and_normals
    - concept_rejection_sampling
    prompt_markdown: Suppose a 1D rejection sampler has an acceptance efficiency of $50\%$. If you apply the same independent factorized proposal envelope across $D = 10$ dimensions, what is the $10$-dimensional acceptance probability, expressed as a **percentage**? (Enter the number of percent, e.g. enter `0.0977` for $0.0977\%$.)
