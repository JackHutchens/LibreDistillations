  - id: q14_20_mc_efficiency_definition
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_importance_sampling_and_variance_trap
    prompt_markdown: 'How is the **Efficiency (figure of merit)** $\zeta$ of a Monte Carlo simulation defined in terms of the squared statistical error of the mean $v = \text{error}^2$ and the total CPU time $T$, and why is $\zeta$ independent of the total number of Monte Carlo steps $N$?

