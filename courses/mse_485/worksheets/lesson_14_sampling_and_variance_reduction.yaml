      text_markdown: $\zeta = \frac{1}{v T}$; because $v = \sigma^2 / N \propto N^{-1}$ and CPU time $T = N \tau_{\text{step}} \propto N$, the factors of $N$ cancel out in $v T = \sigma^2 \tau_{\text{step}}$.
