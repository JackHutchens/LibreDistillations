    prompt_markdown: "In the lecture's **Polar Box–Muller code** (slide 8 of `11.sampling.pdf`):\n```python\nwhile r2 > 0.25:\n    x, y = sprng() - 0.5, sprng() - 0.5\n    r2 = x*x + y*y\n```\npoints $(x, y)$ are sampled uniformly inside the $1 \\times 1$ square $[-0.5, 0.5]^2$ and accepted if they fall inside the circle of radius $R = 0.5$ ($r^2 \\le 0.25$). What is the probability $p_{\\text{accept}}$ that a single $(x, y)$ pair is accepted on any given iteration of the `while` loop? (Enter as a decimal to 3 decimal places.)\n"
