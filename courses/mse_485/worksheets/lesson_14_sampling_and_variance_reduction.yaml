  - id: q14_38_box_muller_single_pair_calc
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_rejection_composition_and_normals
    prompt_markdown: 'Using the standard trigonometric Box–Muller transform:

      $$y_1 = \sqrt{-2\ln x_1}\cos(2\pi x_2), \qquad y_2 = \sqrt{-2\ln x_1}\sin(2\pi x_2)$$

      if the uniform PRNG draws $x_1 = e^{-2} \approx 0.135335$ and $x_2 = 0.25$, what is the exact value of the **second** generated normal variate $y_2$?

      '
    hint_markdown: Evaluate the radial envelope term at $x_1 = e^{-2}$ and multiply by the sine of the angle corresponding to $x_2 = 0.25$.
    correct:
      value: 2.0
      tolerance: 0.01
    rationale_markdown: 'Substituting $x_1 = e^{-2}$ and $x_2 = 0.25$:

      $$r = \sqrt{-2\ln(e^{-2})} = \sqrt{-2(-2)} = \sqrt{4} = 2.0$$

      $$y_2 = r\sin(2\pi \times 0.25) = 2.0 \sin(\pi / 2) = 2.0 \times 1 = 2.0$$

      (while $y_1 = 2.0 \cos(\pi / 2) = 0.0$).

      '
  - id: q14_39_rejection_undersampling_bug
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_rejection_composition_and_normals
    - concept_rejection_sampling
    prompt_markdown: 'In von Neumann rejection sampling with acceptance ratio $c(x) = \frac{p(x)}{a\,q(x)}$, what happens if you choose the envelope constant $a$ **too small** such that $a\,q(x) < p(x)$ (i.e., $c(x) > 1$) near the peak of $p(x)$, or if you choose $q(x)$ way too small in a region where $p(x)$ is finite?

      '
    hint_markdown: Can a probability $u \le c(x)$ with $u \in [0, 1]$ ever exceed $1.0$ if $c(x) > 1$?
    options:
    - id: a
      text: If $a\,q(x) < p(x)$ ($c(x) > 1$), the acceptance probability is clipped at $1.0$, systematically truncating the peak of $p(x)$ and biasing the sampled distribution; conversely, if $q(x)$ under-samples a region ($q(x) \ll p(x)$), $a$ must be made enormous, collapsing the overall acceptance efficiency $1/a$.
      text_markdown: If $a\,q(x) < p(x)$ ($c(x) > 1$), the acceptance probability is clipped at $1.0$, systematically truncating the peak of $p(x)$ and biasing the sampled distribution; conversely, if $q(x)$ under-samples a region ($q(x) \ll p(x)$), $a$ must be made enormous, collapsing the overall acceptance efficiency $1/a$.
    - id: b
      text: Setting $a < \max[p/q]$ increases the efficiency above $100\%$ while still sampling $p(x)$ without bias.
      text_markdown: Setting $a < \max[p/q]$ increases the efficiency above $100\%$ while still sampling $p(x)$ without bias.
    - id: c
      text: The rejection algorithm automatically rescales $u$ to $[0, 10]$ so no bias occurs.
      text_markdown: The rejection algorithm automatically rescales $u$ to $[0, 10]$ so no bias occurs.
    - id: d
      text: The variance of the accepted points becomes zero.
      text_markdown: The variance of the accepted points becomes zero.
    correct: a
    rationale_markdown: 'Because a uniform test draw $u \in [0, 1]$ satisfies $\text{Prob}(u \le c(x)) = \min(1, c(x))$, any region where $c(x) = p(x)/[a\,q(x)] > 1$ is accepted with probability $1$ instead of $c(x)$, shaving off the top of the distribution $p(x)$! And if you avoid clipping by raising $a = \max_x [p(x)/q(x)]$ when $q(x)$ severely under-samples some region of $p(x)$, $a$ becomes huge and the efficiency $1/a$ plummets.

      '
