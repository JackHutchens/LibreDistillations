    rationale_markdown: 'With $P(x) = k x^{k-1} = 3x^2$ for $k = 3$:

      $$\langle x \rangle = \int_0^1 x\left(3x^2\right)dx = \left[\frac{3x^4}{4}\right]_0^1 = \frac{3}{4} = 0.75$$

      (In general, $\langle \max(u_1, \dots, u_k) \rangle = \frac{k}{k+1}$.)

      '
  - id: q14_14_box_muller_radial_distribution
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_rejection_composition_and_normals
    prompt_markdown: 'In the 2D Box–Muller derivation for two independent standard normals $(y_1, y_2)$, transforming $p(y_1, y_2)\,dy_1\,dy_2 = \frac{1}{2\pi}\exp(-r^2/2)\,r\,dr\,d\theta$ to the squared radius $v = r^2$ ($dv = 2r\,dr$) yields which probability distribution for $v$?

      '
    hint_markdown: 'Check slide 7 of `11.sampling.pdf`: $p(v)dv = \frac{1}{2}\exp(-v/2)dv$.'
    options:
    - id: a
      text: An exponential distribution $p(v) = \frac{1}{2}e^{-v/2}$ ($v \ge 0$) with rate parameter $a = 1/2$, which can be sampled analytically via $v = r^2 = -2\ln(x_1)$.
      text_markdown: An exponential distribution $p(v) = \frac{1}{2}e^{-v/2}$ ($v \ge 0$) with rate parameter $a = 1/2$, which can be sampled analytically via $v = r^2 = -2\ln(x_1)$.
    - id: b
      text: A uniform distribution $p(v) = 1$ on $[0, 1]$, sampled via $v = x_1$.
      text_markdown: A uniform distribution $p(v) = 1$ on $[0, 1]$, sampled via $v = x_1$.
    - id: c
      text: A Cauchy distribution $p(v) = \frac{1}{\pi(1 + v^2)}$.
      text_markdown: A Cauchy distribution $p(v) = \frac{1}{\pi(1 + v^2)}$.
    - id: d
      text: A Poisson distribution with discrete integer radii $v \in \{0, 1, 2, \dots\}$.
      text_markdown: A Poisson distribution with discrete integer radii $v \in \{0, 1, 2, \dots\}$.
    correct: a
    rationale_markdown: 'Because the 2D Jacobian contains $r\,dr = \frac{1}{2}d(r^2) = \frac{1}{2}dv$, the intractable 1D Gaussian integral turns into a simple 1D **exponential** distribution in $v = r^2$:

      $$p(v)\,dv = \frac{1}{2}e^{-v/2}\,dv \implies v = r^2 = -2\ln(x_1) \implies r = \sqrt{-2\ln(x_1)}$$

      '
  - id: q14_15_box_muller_polar_rejection_efficiency
