  - id: q14_23_optimal_p_star_formula
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_importance_sampling_and_variance_trap
    prompt_markdown: 'By functionally minimizing the importance sampling variance $v[p] = \int dx\,p(x)\left(\frac{f(x)}{p(x)}\right)^2 - I^2$ subject to $\int dx\,p(x) = 1$, what is the **optimal importance sampling distribution** $p^*(x)$, and why can we not simply use the exact $p^*(x)$ directly in every simulation?

      '
    hint_markdown: Review slide 12 of `11.sampling.pdf` ('Finding Optimal p*(x) for Sampling').
    options:
    - id: a
      text: $p^*(x) = \frac{|f(x)|}{\int dx'\,|f(x')|}$; we cannot sample $p^*(x)$ directly in general because its normalization constant $\int dx'\,|f(x')|$ IS the very integral we are trying to compute!
      text_markdown: $p^*(x) = \frac{|f(x)|}{\int dx'\,|f(x')|}$; we cannot sample $p^*(x)$ directly in general because its normalization constant $\int dx'\,|f(x')|$ IS the very integral we are trying to compute!
    - id: b
      text: $p^*(x) = \frac{1}{f(x)^2}$; we cannot use it because $f(x)^2$ is always negative.
      text_markdown: $p^*(x) = \frac{1}{f(x)^2}$; we cannot use it because $f(x)^2$ is always negative.
    - id: c
      text: $p^*(x) = \delta(x - x_0)$; we cannot use it because computers cannot store floating-point numbers.
      text_markdown: $p^*(x) = \delta(x - x_0)$; we cannot use it because computers cannot store floating-point numbers.
    - id: d
      text: $p^*(x) = 1$; we cannot use it because uniform distributions have infinite variance.
      text_markdown: $p^*(x) = 1$; we cannot use it because uniform distributions have infinite variance.
    correct: a
    rationale_markdown: 'Minimizing $\int [f(x)^2 / p(x)]\,dx - \lambda\left(\int p(x)\,dx - 1\right)$ gives $-f(x)^2 / p(x)^2 - \lambda = 0 \implies p^*(x) \propto |f(x)|$:

      $$p^*(x) = \frac{|f(x)|}{\int dx''\,|f(x'')|}$$

      Sampling or normalizing $p^*(x)$ exactly would require knowing $\int |f(x)|\,dx$ analytically. Instead, $p^*(x) \propto |f(x)|$ serves as the mathematical guide for choosing an approximate, easily sampled distribution $p(x) \approx |f(x)|/Z_p$.

      '
  - id: q14_24_zero_variance_and_sign_problem
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_importance_sampling_and_variance_trap
    prompt_markdown: 'Suppose $f(x)$ is an oscillatory function on $[-1, 1]$ such that $\int_{-1}^0 f(x)\,dx = -5$ (where $f(x) \le 0$) and $\int_0^1 f(x)\,dx = +7$ (where $f(x) \ge 0$), so the true integral is $I = +2$ and $\int_{-1}^1 |f(x)|\,dx = 12$. If you were somehow able to sample from the **exact optimal distribution** $p^*(x) = |f(x)| / 12$, what would be the variance $\sigma^2 = \langle (f(x)/p^*(x) - I)^2 \rangle_{p^*}$ of a single Monte Carlo draw?

      '
    hint_markdown: Determine the discrete values taken by the ratio $f(x)/p^*(x)$ for positive and negative regions of $f(x)$, and calculate $\langle g^2 \rangle - I^2$.
    options:
    - id: a
      text: $\sigma^2 = 12^2 - 2^2 = 140$ (non-zero! Because $f(x)$ changes sign, the estimator jumps between $+12$ and $-12$, illustrating the 'Sign Problem' where zero variance is impossible).
      text_markdown: $\sigma^2 = 12^2 - 2^2 = 140$ (non-zero! Because $f(x)$ changes sign, the estimator jumps between $+12$ and $-12$, illustrating the 'Sign Problem' where zero variance is impossible).
    - id: b
      text: $\sigma^2 = 0$ (because $p^*(x)$ always achieves zero variance even when $f(x)$ changes sign).
      text_markdown: $\sigma^2 = 0$ (because $p^*(x)$ always achieves zero variance even when $f(x)$ changes sign).
    - id: c
      text: $\sigma^2 = \infty$.
      text_markdown: $\sigma^2 = \infty$.
    - id: d
      text: $\sigma^2 = 2$.
      text_markdown: $\sigma^2 = 2$.
    correct: a
    rationale_markdown: 'For $p^*(x) = |f(x)| / \int |f|$, the estimator is:

      $$g(x) = \frac{f(x)}{p^*(x)} = \text{sign}\big(f(x)\big) \int_{-1}^1 |f(x'')|\,dx'' = \pm 12$$

      Thus $g(x)^2 = 12^2 = 144$ everywhere, giving a variance of:

      $$\sigma^2 = \langle g(x)^2 \rangle_{p^*} - I^2 = \left(\int |f|\,dx\right)^2 - \left(\int f\,dx\right)^2 = 144 - 4 = 140 > 0$$

      Zero variance ($\sigma^2 = 0$) is possible **only** when $f(x)$ has a single sign ($|f(x)| = f(x)$ or $-f(x)$ everywhere). For oscillatory or fermionic integrands where $\int |f| \gg |\int f|$, the variance explodes—the infamous **Monte Carlo Sign Problem** (*"Monte Carlo can add, but not subtract"*).

      '
  - id: q14_25_gaussian_is_finite_variance_bound
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_importance_sampling_and_variance_trap
    - concept_importance_sampling_trap
    prompt_markdown: 'In the lecture''s Gaussian importance sampling example (slides 13–15 of `11.sampling.pdf`), we integrate $f(x) = \frac{e^{-x^2/2}}{1+x^2}$ using the trial Gaussian density $p_a(x) = \frac{e^{-x^2/(2a)}}{\sqrt{2\pi a}}$. The estimator variance is:

      $$\sigma^2(a) = \int_{-\infty}^{\infty} dx\,\frac{\sqrt{2\pi a}}{(1+x^2)^2}\exp\!\left[-x^2\left(1 - \frac{1}{2a}\right)\right] - I^2$$

      What is the critical lower bound $a_{\text{crit}}$ such that $\sigma^2(a)$ is **finite** if and only if $a > a_{\text{crit}}$?

      '
    hint_markdown: Determine the condition on the Gaussian exponent that prevents the integrand from diverging at asymptotic distances $\pm\infty$.
    correct:
      value: 0.5
      tolerance: 0.005
    rationale_markdown: 'In the variance integrand $\frac{f(x)^2}{p_a(x)} \propto \frac{e^{-x^2}}{e^{-x^2/(2a)}} = \exp\!\left[-x^2\left(1 - \frac{1}{2a}\right)\right]$, convergence as $|x| \to \infty$ requires the exponent to decay:

      $$1 - \frac{1}{2a} > 0 \iff \frac{1}{2a} < 1 \iff a > \frac{1}{2} = 0.50$$

      Whenever $a \le 0.50$, the variance is **strictly infinite**!

      '
