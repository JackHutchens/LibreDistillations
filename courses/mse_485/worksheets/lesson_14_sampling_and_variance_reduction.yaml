  - id: q14_29_power_law_importance_sampling_calc
    type: problem
    question_type: numeric
    difficulty: hard
    taught_by: sec_importance_sampling_and_variance_trap
    prompt_markdown: 'Let''s calculate an exact variance reduction factor by hand! Suppose we want to integrate $f(x) = 3x^2$ on $[0, 1]$, whose exact integral is $I = \int_0^1 3x^2\,dx = 1$.

      - With **uniform sampling** $p_{\text{unif}}(x) = 1$, the per-sample variance is $\sigma_{\text{unif}}^2 = \int_0^1 (3x^2)^2\,dx - 1^2 = \frac{9}{5} - 1 = 0.80$.

      - Suppose instead we use **linear importance sampling** $p(x) = 2x$ on $[0, 1]$ (sampled via $x = \sqrt{u}$).

      What is the exact per-sample variance $\sigma_{\text{IS}}^2 = \int_0^1 \frac{f(x)^2}{p(x)}\,dx - I^2$ using $p(x) = 2x$? (Enter as a decimal to 3 decimal places.)

      '
    hint_markdown: Evaluate the second moment integral $\int_0^1 [f(x)^2 / p(x)] dx$ and subtract the squared true mean $I^2$.
    correct:
      value: 0.125
      tolerance: 0.002
    rationale_markdown: 'With $f(x) = 3x^2$ and $p(x) = 2x$, the estimator is $g(x) = \frac{f(x)}{p(x)} = \frac{3}{2}x$. Its variance is:

      $$\sigma_{\text{IS}}^2 = \int_0^1 p(x)\left(\frac{f(x)}{p(x)}\right)^2 dx - I^2 = \int_0^1 \frac{9x^4}{2x}\,dx - 1^2 = \frac{9}{2}\int_0^1 x^3\,dx - 1 = \frac{9}{8} - 1 = \frac{1}{8} = 0.125$$

      Simple linear importance sampling reduces the variance from $0.80$ to $0.125$—a **$6.4\times$ speedup**!

      '
  - id: sec_correlated_and_boltzmann_sampling
    type: markdown_section
    title: 4. Correlated Sampling & Why Independent Sampling Fails for the Boltzmann Distribution
    body_markdown: "### Correlated Sampling for Differences & Functions of Integrals\nOften we care less about an absolute integral $F_1 = \\int dx\\,f_1(x)$ than about a **small difference** (such as the energy difference $\\Delta E = F_1 - F_2$ between two slightly perturbed crystal structures) or a general smooth function $G(F_1, F_2)$.\n- If we evaluate $F_1$ and $F_2$ using **independent** random walks, their variances *add*: $\\text{Var}(F_1 - F_2) = \\text{Var}(F_1) + \\text{Var}(F_2)$, drowning a tiny physical difference $\\Delta E$ in statistical noise.\n- **Correlated Sampling:** Evaluate *both* integrals using the **exact same importance distribution $p(x)$ and the exact same sequence of random points $\\{x_i\\}$**:\n  $$\\widehat{\\Delta F} = \\frac{1}{N}\\sum_{i=1}^N \\frac{f_1(x_i) - f_2(x_i)}{p(x_i)}$$\n  Because the correlated noise cancels point-by-point when $f_1(x) \\approx f_2(x)$, the variance of the difference shrinks dramatically! For a general function $G(F_1, F_2)$,\
      \ linearizing $\\delta G = \\frac{\\partial G}{\\partial F_1}\\delta F_1 + \\frac{\\partial G}{\\partial F_2}\\delta F_2$ shows that the **optimal importance function** is a weighted combination of the two integrands (slide 18):\n  $$p^*(x) \\propto \\left| f_1(x)\\frac{\\partial G}{\\partial F_1} + f_2(x)\\frac{\\partial G}{\\partial F_2} \\right|$$\n\n### Sampling the Canonical Boltzmann Distribution in $3N$ Dimensions\nIn statistical mechanics, we want to compute thermal averages of many observables $\\{A_1(\\mathbf{R}), A_2(\\mathbf{R}), \\dots\\}$ across a $3N$-dimensional configuration space $\\mathbf{R} = (\\mathbf{r}_1, \\dots, \\mathbf{r}_N)$:\n$$\\langle A_i \\rangle = \\frac{\\int d\\mathbf{R}\\,A_i(\\mathbf{R})e^{-\\beta V(\\mathbf{R})}}{\\int d\\mathbf{R}\\,e^{-\\beta V(\\mathbf{R})}} = \\frac{\\int d\\mathbf{R}\\,A_i(\\mathbf{R})e^{-\\beta V(\\mathbf{R})}}{Z(\\beta)}$$\nApplying our optimal importance-sampling formula to $\\langle A_i \\rangle$ yields (slide 19):\n$$p_i^*(\\\
      mathbf{R}) \\propto \\left| e^{-\\beta V(\\mathbf{R})}\\big(A_i(\\mathbf{R}) - \\langle A_i \\rangle\\big) \\right|$$\nNotice the two factors:\n1. $e^{-\\beta V(\\mathbf{R})}$ varies by **hundreds of orders of magnitude** across configuration space and is **independent of the observable $A_i$**.\n2. $|A_i(\\mathbf{R}) - \\langle A_i \\rangle|$ varies slowly and depends on which observable we measure.\n\nBecause we want to calculate *many* physical properties from a single simulation trajectory, we choose the **Boltzmann distribution itself** as our universal importance sampling density:\n$$p_{\\text{Boltzmann}}(\\mathbf{R}) = \\frac{e^{-\\beta V(\\mathbf{R})}}{Z(\\beta)}$$\n\n### Why Independent (\"Hit-or-Miss\") Sampling of $e^{-\\beta V(\\mathbf{R})}$ Fails Exponentially at Large $N$\nWhy can't we just throw $N$ atoms at random uniform positions $\\mathbf{R} \\in [0, L]^{3N}$ ($P_{\\text{unif}}(\\mathbf{R}) = \\Omega^{-N} = 1$) and average their Boltzmann weights $e^{-\\beta V(\\\
      mathbf{R})}$ to estimate the partition function $Z(\\beta) = \\int d\\mathbf{R}\\,e^{-\\beta V(\\mathbf{R})} = e^{-\\beta F(\\beta)}$?\n\nLet's compute the exact variance of the uniform-sampling partition function estimator (slide 20):\n$$\\text{var}(Z) = \\int d\\mathbf{R}\\,\\left(e^{-\\beta V(\\mathbf{R})} - Z(\\beta)\\right)^2 = \\int d\\mathbf{R}\\,e^{-2\\beta V(\\mathbf{R})} - Z(\\beta)^2 = Z(2\\beta) - Z(\\beta)^2$$\nSince $Z(\\beta) = e^{-\\beta F(\\beta)}$ where $F(\\beta)$ is the Helmholtz free energy, the relative variance (the variance of the dimensionless free energy $\\beta F = -\\ln Z$) is:\n$$\\text{var}(\\beta F) = \\frac{\\text{var}(Z)}{Z(\\beta)^2} = \\frac{Z(2\\beta)}{Z(\\beta)^2} - 1 = \\frac{e^{-2\\beta F(2\\beta)}}{\\left(e^{-\\beta F(\\beta)}\\right)^2} - 1 = e^{2\\beta\\left[F(\\beta) - F(2\\beta)\\right]} - 1$$\nTaking the square root gives the per-sample statistical error of $\\beta F$:\n$$\\text{error}(\\beta F) \\approx \\exp\\!\\Big[\\beta\\big(F(\\beta)\
      \ - F(2\\beta)\\big)\\Big]$$\n\n> [!WARNING]\n> **Exponential Blowup in Particle Count $N$:** Because the Helmholtz free energy $F(\\beta) = N f(\\beta)$ is an **extensive** thermodynamic quantity (proportional to the number of particles $N$, with $F(\\beta) > F(2\\beta)$ because entropy $S = -\\partial F/\\partial T > 0$), the exponent $\\beta[F(\\beta) - F(2\\beta)] = c\\,N$ grows **linearly with $N$**! Therefore, the relative variance and required number of independent samples blow up **exponentially in $N$** ($\\sim e^{+c N}$), just as bad as a deterministic grid!\n\n#### Intuitive Hard-Sphere Picture (Slide 21)\n- Throw $N$ atoms at random into a box of area $A$; suppose the probability that no two atoms overlap is $q < 1$ (say $q = 10^{-3}$).\n- Throw $2N$ atoms into a box of area $2A$ (same density!): both halves must simultaneously avoid overlap, so the success probability is $q^2$.\n- Throw $mN$ atoms into a box of area $mA$: the probability of generating even a single non-overlapping\
      \ configuration is:\n  $$p_{\\text{success}} = q^m = \\exp\\!\\big(m \\ln q\\big) = \\exp(-\\text{const}\\cdot N)$$\nTo escape this exponential catastrophe, we must never draw independent random configurations from scratch—instead, we use **Markov chain random walks** (Metropolis Monte Carlo) to stay inside the tiny, exponentially peaked region where $e^{-\\beta V(\\mathbf{R})}$ is large!\n"
  - id: q14_30_correlated_sampling_optimal_p
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_correlated_and_boltzmann_sampling
    prompt_markdown: 'Suppose you want to compute the difference $G(F_1, F_2) = F_1 - F_2$ between two integrals $F_1 = \int dx\,f_1(x)$ and $F_2 = \int dx\,f_2(x)$ using **correlated sampling** (evaluating both integrals with the same random points $\{x_i\}$ drawn from a single distribution $p(x)$). According to the lecture formula $p^*(x) \propto \left|f_1(x)\frac{\partial G}{\partial F_1} + f_2(x)\frac{\partial G}{\partial F_2}\right|$, what is the optimal importance sampling distribution $p^*(x)$?

      '
    hint_markdown: For $G(F_1, F_2) = F_1 - F_2$, what are $\partial G / \partial F_1$ and $\partial G / \partial F_2$?
    options:
    - id: a
      text: $p^*(x) \propto |f_1(x) - f_2(x)|$ (sampling most heavily in regions where the difference between the two integrands is largest).
      text_markdown: $p^*(x) \propto |f_1(x) - f_2(x)|$ (sampling most heavily in regions where the difference between the two integrands is largest).
    - id: b
      text: $p^*(x) \propto f_1(x)^2 + f_2(x)^2$.
      text_markdown: $p^*(x) \propto f_1(x)^2 + f_2(x)^2$.
    - id: c
      text: $p^*(x) = 1$ (uniform sampling is always optimal for differences).
      text_markdown: $p^*(x) = 1$ (uniform sampling is always optimal for differences).
    - id: d
      text: $p^*(x) \propto |f_1(x) / f_2(x)|$.
      text_markdown: $p^*(x) \propto |f_1(x) / f_2(x)|$.
    correct: a
    rationale_markdown: 'For $G(F_1, F_2) = F_1 - F_2$, the partial derivatives are $\frac{\partial G}{\partial F_1} = +1$ and $\frac{\partial G}{\partial F_2} = -1$. Substituting into the slide 18 formula gives:

      $$p^*(x) \propto \left| f_1(x)(+1) + f_2(x)(-1) \right| = |f_1(x) - f_2(x)|$$

      which concentrates samples precisely where the perturbation $f_1(x) - f_2(x)$ is non-zero!

      '
  - id: q14_31_correlated_sampling_ratio_optimal_p
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_correlated_and_boltzmann_sampling
    prompt_markdown: 'In statistical mechanics, an ensemble average is a **ratio** of two integrals: $G(F_1, F_2) = \frac{F_1}{F_2}$, where $F_1 = \int dr\,A(r)e^{-\beta V(r)}$ and $F_2 = \int dr\,e^{-\beta V(r)}$ (so $\langle A \rangle = F_1 / F_2$). Applying the correlated sampling formula $p^*(r) \propto \left|f_1(r)\frac{\partial G}{\partial F_1} + f_2(r)\frac{\partial G}{\partial F_2}\right|$ with $\frac{\partial G}{\partial F_1} = \frac{1}{F_2}$ and $\frac{\partial G}{\partial F_2} = -\frac{F_1}{F_2^2} = -\frac{\langle A \rangle}{F_2}$ yields which optimal distribution $p^*(r)$ shown on slide 19?

      '
    hint_markdown: Substitute $f_1(r) = A(r)e^{-\beta V(r)}$ and $f_2(r) = e^{-\beta V(r)}$ into $|f_1/F_2 - f_2 \langle A \rangle / F_2|$ and factor out $e^{-\beta V(r)} / F_2$.
    options:
    - id: a
      text: $p^*(r) \propto \left| e^{-\beta V(r)}\big(A(r) - \langle A \rangle\big) \right|$
      text_markdown: $p^*(r) \propto \left| e^{-\beta V(r)}\big(A(r) - \langle A \rangle\big) \right|$
    - id: b
      text: $p^*(r) \propto e^{+\beta V(r)} / A(r)$
      text_markdown: $p^*(r) \propto e^{+\beta V(r)} / A(r)$
    - id: c
      text: $p^*(r) \propto \left| A(r) + \langle A \rangle \right|$ (independent of $V(r)$)
      text_markdown: $p^*(r) \propto \left| A(r) + \langle A \rangle \right|$ (independent of $V(r)$)
    - id: d
      text: $p^*(r) \propto e^{-2\beta V(r)}$
      text_markdown: $p^*(r) \propto e^{-2\beta V(r)}$
    correct: a
    rationale_markdown: 'Substituting $f_1(r) = A(r)e^{-\beta V(r)}$, $f_2(r) = e^{-\beta V(r)}$, $\frac{\partial G}{\partial F_1} = \frac{1}{F_2}$, and $\frac{\partial G}{\partial F_2} = -\frac{\langle A \rangle}{F_2}$ into slide 18''s general formula directly derives slide 19''s equation:

      $$p^*(r) \propto \left| \frac{A(r)e^{-\beta V(r)}}{F_2} - \frac{\langle A \rangle e^{-\beta V(r)}}{F_2} \right| \propto \left| e^{-\beta V(r)}\big(A(r) - \langle A \rangle\big) \right|$$

      '
  - id: q14_32_why_sample_boltzmann_factor_only
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_correlated_and_boltzmann_sampling
    prompt_markdown: 'Even though the optimal importance density for a single observable $A_i(\mathbf{R})$ is $p_i^*(\mathbf{R}) \propto |e^{-\beta V(\mathbf{R})}(A_i(\mathbf{R}) - \langle A_i \rangle)|$, why do standard canonical Monte Carlo simulations sample $p(\mathbf{R}) \propto e^{-\beta V(\mathbf{R})}$ (the first factor alone) rather than including $|A_i(\mathbf{R}) - \langle A_i \rangle|$?

      '
    hint_markdown: Check the bullet points on slide 19 of `11.sampling.pdf`.
    options:
    - id: a
      text: Because we want to measure a whole set of different physical averages $\langle A_1 \rangle, \langle A_2 \rangle, \dots$ from the same trajectory, and $e^{-\beta V(\mathbf{R})}$ is the universal, overwhelmingly peaked factor independent of $A_i$ (and avoids zero-density nodes where $A_i = \langle A_i \rangle$).
      text_markdown: Because we want to measure a whole set of different physical averages $\langle A_1 \rangle, \langle A_2 \rangle, \dots$ from the same trajectory, and $e^{-\beta V(\mathbf{R})}$ is the universal, overwhelmingly peaked factor independent of $A_i$ (and avoids zero-density nodes where $A_i = \langle A_i \rangle$).
    - id: b
      text: Because $A_i(\mathbf{R}) - \langle A_i \rangle$ is always equal to $1$ for every configuration $\mathbf{R}$.
      text_markdown: Because $A_i(\mathbf{R}) - \langle A_i \rangle$ is always equal to $1$ for every configuration $\mathbf{R}$.
    - id: c
      text: Because $e^{-\beta V(\mathbf{R})}$ is a flat uniform distribution.
      text_markdown: Because $e^{-\beta V(\mathbf{R})}$ is a flat uniform distribution.
    - id: d
      text: Because $\langle A_i \rangle$ is always known exactly before the simulation starts.
      text_markdown: Because $\langle A_i \rangle$ is always known exactly before the simulation starts.
    correct: a
    rationale_markdown: 'As explained on slide 19, $e^{-\beta V(\mathbf{R})}$ is **independent of $A_i$** and captures the extreme exponential peaking of the canonical ensemble across $3N$-dimensional space. Sampling $e^{-\beta V(\mathbf{R})}$ allows a single Markov chain trajectory to compute dozens of different observables $A_i$ simultaneously without under-sampling regions where one particular $A_i(\mathbf{R})$ happens to cross $\langle A_i \rangle$.

      '
  - id: q14_33_partition_function_variance_formula
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_correlated_and_boltzmann_sampling
    prompt_markdown: 'If you attempt to estimate the canonical partition function $Z(\beta) = \int d\mathbf{R}\,e^{-\beta V(\mathbf{R})} = e^{-\beta F(\beta)}$ by sampling configurations $\mathbf{R}$ **independently and uniformly** in the box ($P(\mathbf{R}) = 1$), what is the exact expression for the relative variance $\text{var}(\beta F) = \frac{\text{var}(Z)}{Z(\beta)^2}$ derived on slide 20?

      '
    hint_markdown: Recall $\int d\mathbf{R}\,(e^{-\beta V(\mathbf{R})})^2 = \int d\mathbf{R}\,e^{-2\beta V(\mathbf{R})} = Z(2\beta) = e^{-2\beta F(2\beta)}$.
    options:
    - id: a
      text: $\text{var}(\beta F) = \frac{Z(2\beta)}{Z(\beta)^2} - 1 = e^{2\beta[F(\beta) - F(2\beta)]} - 1$
      text_markdown: $\text{var}(\beta F) = \frac{Z(2\beta)}{Z(\beta)^2} - 1 = e^{2\beta[F(\beta) - F(2\beta)]} - 1$
    - id: b
      text: $\text{var}(\beta F) = \frac{1}{N}$
      text_markdown: $\text{var}(\beta F) = \frac{1}{N}$
    - id: c
      text: $\text{var}(\beta F) = 2\beta F(\beta)$
      text_markdown: $\text{var}(\beta F) = 2\beta F(\beta)$
    - id: d
      text: $\text{var}(\beta F) = 0$
      text_markdown: $\text{var}(\beta F) = 0$
    correct: a
    rationale_markdown: 'The second moment of the Boltzmann weight under uniform sampling is $\int d\mathbf{R}\,\left(e^{-\beta V(\mathbf{R})}\right)^2 = \int d\mathbf{R}\,e^{-2\beta V(\mathbf{R})} = Z(2\beta)$. Dividing $\text{var}(Z) = Z(2\beta) - Z(\beta)^2$ by $Z(\beta)^2$ and substituting $Z(\beta) = e^{-\beta F(\beta)}$ gives:

      $$\text{var}(\beta F) = \frac{Z(2\beta)}{Z(\beta)^2} - 1 = \frac{e^{-2\beta F(2\beta)}}{e^{-2\beta F(\beta)}} - 1 = e^{2\beta[F(\beta) - F(2\beta)]} - 1$$

      '
  - id: q14_34_free_energy_extensivity_blowup
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_correlated_and_boltzmann_sampling
    prompt_markdown: 'Why does the relative error $\text{error}(\beta F) = \exp\!\big[\beta(F(\beta) - F(2\beta))\big]$ of uniform independent Boltzmann sampling blow up **exponentially** with the number of particles $N$?

      '
    hint_markdown: What thermodynamic scaling property does the Helmholtz free energy $F(\beta)$ satisfy as system size $N$ increases?
    options:
    - id: a
      text: Because the Helmholtz free energy $F(\beta) = N f(\beta)$ is an extensive quantity (proportional to $N$, with $F(\beta) > F(2\beta)$), so the exponent $\beta[F(\beta) - F(2\beta)] \propto N$ grows linearly with $N$.
      text_markdown: Because the Helmholtz free energy $F(\beta) = N f(\beta)$ is an extensive quantity (proportional to $N$, with $F(\beta) > F(2\beta)$), so the exponent $\beta[F(\beta) - F(2\beta)] \propto N$ grows linearly with $N$.
    - id: b
      text: Because the inverse temperature $\beta = 1/(k_B T)$ is proportional to $N^3$.
      text_markdown: Because the inverse temperature $\beta = 1/(k_B T)$ is proportional to $N^3$.
    - id: c
      text: Because $F(\beta)$ is always equal to $F(2\beta)$.
      text_markdown: Because $F(\beta)$ is always equal to $F(2\beta)$.
    - id: d
      text: Because uniform random number generators stop working when $N > 12$.
      text_markdown: Because uniform random number generators stop working when $N > 12$.
    correct: a
    rationale_markdown: 'In thermodynamics, the Helmholtz free energy $F(T, V, N) = N f(T, \rho)$ is **extensive** ($\propto N$). Because $\frac{\partial (\beta F)}{\partial \beta} = E$, the difference $\beta[F(\beta) - F(2\beta)] = N \Delta(\beta f) > 0$ scales linearly with $N$. Consequently, $\text{error}(\beta F) \sim e^{+c N}$ grows **exponentially** with particle count $N$, requiring an exponentially large number of uniform sample points just like a naive grid method!

      '
  - id: q14_35_hard_sphere_overlap_scaling
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_correlated_and_boltzmann_sampling
    prompt_markdown: In the lecture's intuitive hard-sphere explanation, suppose placing $N = 10$ atoms at random into a sub-box of area $A$ has a non-overlap probability of $q = 0.10$. If you scale the system at constant density to $m = 10$ such independent sub-boxes ($100$ atoms total), what is $\log_{10}(1 / p)$, the base-10 logarithm of the average number of random configurations required to obtain a single non-overlapping state?
    hint_markdown: Multiply the number of sub-boxes by the logarithm of the inverse success probability per sub-box.
    correct:
      value: 10
      tolerance: 0.05
    rationale_markdown: 'For $m = 10$ independent sub-volumes each succeeding with probability $q = 0.10 = 10^{-1}$:

      $$p = q^m = (10^{-1})^{10} = 10^{-10} \implies \log_{10}\left(\frac{1}{p}\right) = 10$$

      You would need $10^{10}$ random throws just to find *one* non-overlapping 100-atom configuration (and $10^{100}$ throws for $1000$ atoms!), proving why Markov chain random walks are indispensable for condensed-matter simulations.

      '
  - id: q14_36_partition_function_error_numeric
    type: problem
    question_type: numeric
    difficulty: hard
    taught_by: sec_correlated_and_boltzmann_sampling
    prompt_markdown: 'Consider a system of $N = 50$ particles where the extensive free-energy difference per particle between $\beta$ and $2\beta$ is $\beta[f(\beta) - f(2\beta)] = 0.20$. Using the slide 20 formula $\text{error}(\beta F) = \exp\!\big[\beta(F(\beta) - F(2\beta))\big]$ with $F = N f$, what is the natural logarithm $\ln[\text{error}(\beta F)]$ of the single-sample statistical error of $\beta F$ under independent uniform sampling?

      '
    hint_markdown: Evaluate the product of the total particle number and the per-particle free-energy difference parameter.
    correct:
      value: 10
      tolerance: 0.05
    rationale_markdown: 'Since $F(\beta) = N f(\beta)$ is extensive:

      $$\ln\!\big[\text{error}(\beta F)\big] = \beta\big(F(\beta) - F(2\beta)\big) = N \cdot \beta\big(f(\beta) - f(2\beta)\big) = 50 \times 0.20 = 10.0$$

      meaning $\text{error}(\beta F) = e^{10} \approx 2.2 \times 10^4$, requiring $N_{\text{samples}} \sim e^{20} \approx 4.85 \times 10^8$ independent samples just to reduce the error on $\beta F$ to order $1$!

      '
