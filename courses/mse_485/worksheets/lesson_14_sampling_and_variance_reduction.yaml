    prompt_markdown: 'Why does the classic composition formula $\zeta = \sum_{i=1}^{12} u_i - 6$ (where $u_1, \dots, u_{12}$ are independent uniform random numbers on $[0, 1]$) specifically sum **$12$** uniform numbers and subtract **$6$**?

      '
    hint_markdown: Recall that a single uniform draw $u_i \in [0, 1]$ has mean $1/2$ and variance $1/12$.
    options:
    - id: a
      text: Because each $u_i$ has mean $1/2$ and variance $1/12$, so summing $12$ independent uniforms produces mean $12 \times (1/2) = 6$ (shifted to $0$ by subtracting $6$) and unit variance $12 \times (1/12) = 1$ without requiring a square-root scaling.
      text_markdown: Because each $u_i$ has mean $1/2$ and variance $1/12$, so summing $12$ independent uniforms produces mean $12 \times (1/2) = 6$ (shifted to $0$ by subtracting $6$) and unit variance $12 \times (1/12) = 1$ without requiring a square-root scaling.
    - id: b
      text: Because $12$ is the minimum integer for which $\zeta$ has infinite tails $(-\infty, \infty)$.
      text_markdown: Because $12$ is the minimum integer for which $\zeta$ has infinite tails $(-\infty, \infty)$.
    - id: c
      text: Because a 12-bit LCG has a period of $6$.
      text_markdown: Because a 12-bit LCG has a period of $6$.
    - id: d
      text: Because $\sum_{i=1}^{12} u_i - 6$ reproduces the exact Box–Muller cosine transform.
      text_markdown: Because $\sum_{i=1}^{12} u_i - 6$ reproduces the exact Box–Muller cosine transform.
    correct: a
    rationale_markdown: 'For $u_i \sim U(0, 1)$, $\langle u_i \rangle = 1/2$ and $\text{Var}(u_i) = 1/12$. By choosing $K = 12$, the sum $\sum_{i=1}^{12} u_i$ automatically has variance $12 \times (1/12) = 1.0$ and mean $12 \times (1/2) = 6.0$. Subtracting $6$ yields a fast, multiplication-free Central Limit Theorem approximation to $\mathcal{N}(0, 1)$ supported on $[-6, 6]$.

      '
  - id: q14_12_max_of_k_uniforms_pdf
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_rejection_composition_and_normals
    prompt_markdown: 'If you draw $k$ independent uniform random numbers $u_1, u_2, \dots, u_k \in [0, 1]$ and take their maximum, $x = \max(u_1, u_2, \dots, u_k)$, what is the probability density function $P(x)$ of $x$ on $[0, 1]$?

      '
    hint_markdown: The event $\max(u_1, \dots, u_k) \le x$ happens if and only if ALL $k$ independent draws satisfy $u_i \le x$, so the CDF is $C(x) = x^k$. Differentiate $C(x)$!
    options:
    - id: a
      text: $P(x) = k\,x^{k-1}$
      text_markdown: $P(x) = k\,x^{k-1}$
    - id: b
      text: $P(x) = x^k / k!$
      text_markdown: $P(x) = x^k / k!$
    - id: c
      text: $P(x) = k(1 - x)^{k-1}$
      text_markdown: $P(x) = k(1 - x)^{k-1}$
    - id: d
      text: $P(x) = -\ln(x) / k$
      text_markdown: $P(x) = -\ln(x) / k$
    correct: a
    rationale_markdown: 'Because the $k$ draws are independent and $\text{Prob}(u_i \le x) = x$ on $[0, 1]$:

      $$C(x) = \text{Prob}\big(\max(u_1, \dots, u_k) \le x\big) = \prod_{i=1}^k \text{Prob}(u_i \le x) = x^k$$

      Differentiating the CDF yields the exact power-law PDF:

      $$P(x) = \frac{dC(x)}{dx} = k\,x^{k-1}$$

      Notice that this gives a square-root/power-law sampler without calling `pow()` or `sqrt()`!

      '
  - id: q14_13_max_of_3_uniforms_mean
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_rejection_composition_and_normals
    prompt_markdown: 'Using the composition rule $x = \max(u_1, u_2, u_3)$ ($k = 3$, which has PDF $P(x) = 3x^2$ on $[0, 1]$), what is the exact expected value $\langle x \rangle = \int_0^1 x P(x)\,dx$? (Enter as a decimal.)

