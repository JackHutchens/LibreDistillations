    correct:
      value: 0.785
      tolerance: 0.005
    rationale_markdown: 'The acceptance probability is the ratio of the inscribed circle''s area to the bounding square''s area:

      $$p_{\text{accept}} = \frac{\pi R^2}{1 \times 1} = \frac{\pi (0.5)^2}{1} = \frac{\pi}{4} \approx 0.7854 \ (78.5\%)$$

      (Note: Slide 8 writes *"Efficiency of angle generation is $4/\pi \approx 1.273$"* referring to the average number of loop iterations $a = 1/p_{\text{accept}} = 4/\pi$ needed per accepted pair.)

      '
