      text_markdown: Because under-sampling causes $f(x)/p(x)$ to blow up in the tails, risking infinite variance ($\sigma^2 = \infty$), whereas over-sampling keeps $f(x)/p(x) \to 0$ bounded in the tails and only incurs a moderate, finite loss in efficiency.
    - id: b
      text: Because over-sampling violates conservation of energy.
      text_markdown: Because over-sampling violates conservation of energy.
    - id: c
      text: Because under-sampling always reduces the variance to zero.
      text_markdown: Because under-sampling always reduces the variance to zero.
    - id: d
