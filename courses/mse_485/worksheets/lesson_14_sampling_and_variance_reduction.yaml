  - id: q14_17_cholesky_matrix_equation
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by:
    - sec_rejection_composition_and_normals
    - concept_cholesky_gaussian
    prompt_markdown: 'To generate a $D$-dimensional correlated Gaussian vector $\mathbf{x}$ with target covariance matrix $T_{\alpha\beta} = \langle x_\alpha x_\beta \rangle$ from an independent standard normal vector $\mathbf{y}$ ($\langle y_i y_j \rangle = \delta_{ij}$) via $\mathbf{x} = \mathbf{S}\mathbf{y}$, which matrix equation must the lower-triangular Cholesky matrix $\mathbf{S}$ satisfy?

      '
    hint_markdown: Substitute $x_\alpha = \sum_i S_{\alpha i} y_i$ into $\langle x_\alpha x_\beta \rangle = T_{\alpha\beta}$.
    options:
    - id: a
      text: $\mathbf{S}\mathbf{S}^T = \mathbf{T}$
      text_markdown: $\mathbf{S}\mathbf{S}^T = \mathbf{T}$
    - id: b
      text: $\mathbf{S} + \mathbf{S}^T = \mathbf{T}^{-1}$
      text_markdown: $\mathbf{S} + \mathbf{S}^T = \mathbf{T}^{-1}$
    - id: c
      text: $\mathbf{S}^2 = \mathbf{I}$
      text_markdown: $\mathbf{S}^2 = \mathbf{I}$
    - id: d
      text: $\det(\mathbf{S}) = 0$
      text_markdown: $\det(\mathbf{S}) = 0$
    correct: a
    rationale_markdown: 'As derived on slide 9:

      $$\langle x_\alpha x_\beta \rangle = \sum_{i,j} S_{\alpha i} S_{\beta j} \langle y_i y_j \rangle = \sum_{i,j} S_{\alpha i} S_{\beta j} \delta_{ij} = \sum_i S_{\alpha i} S_{\beta i} = (\mathbf{S}\mathbf{S}^T)_{\alpha\beta} = T_{\alpha\beta}$$

      '
  - id: q14_18_cholesky_2x2_entry_s22
    type: problem
    question_type: numeric
    difficulty: hard
    taught_by:
    - sec_rejection_composition_and_normals
    - concept_cholesky_gaussian
    prompt_markdown: 'Suppose you want to generate a 2D correlated Gaussian $(x_1, x_2)$ with covariance matrix:

      $$\mathbf{T} = \begin{pmatrix} 4.0 & 2.4 \\ 2.4 & 2.25 \end{pmatrix}$$

      ($\sigma_1 = 2.0$, $\sigma_2 = 1.5$, $\rho = 0.8$). You write the lower-triangular Cholesky factor as $\mathbf{S} = \begin{pmatrix} S_{11} & 0 \\ S_{21} & S_{22} \end{pmatrix}$ with $S_{11}, S_{22} > 0$. From $\mathbf{S}\mathbf{S}^T = \mathbf{T}$, we have $S_{11}^2 = 4.0 \implies S_{11} = 2.0$ and $S_{11}S_{21} = 2.4 \implies S_{21} = 1.2$. What is the value of the diagonal entry **$S_{22}$**? (You can also check this by setting $\sigma_1=2.0, \sigma_2=1.5$ in the Cholesky lab!)

      '
    hint_markdown: Equate the $(2,2)$ element of the matrix product $\mathbf{S}\mathbf{S}^T$ to $T_{22}$ and solve for $S_{22}$.
    correct:
      value: 0.9
      tolerance: 0.01
    rationale_markdown: 'Multiplying out $\mathbf{S}\mathbf{S}^T = \mathbf{T}$ for a $2\times 2$ lower-triangular matrix gives:

      $$\begin{pmatrix} S_{11}^2 & S_{11}S_{21} \\ S_{11}S_{21} & S_{21}^2 + S_{22}^2 \end{pmatrix} = \begin{pmatrix} 4.0 & 2.4 \\ 2.4 & 2.25 \end{pmatrix}$$

      Solving row by row:

      1. $S_{11} = \sqrt{4.0} = 2.0$

      2. $S_{21} = 2.4 / S_{11} = 2.4 / 2.0 = 1.2$

      3. $S_{22} = \sqrt{T_{22} - S_{21}^2} = \sqrt{2.25 - 1.44} = \sqrt{0.81} = 0.90$

      '
  - id: q14_19_cholesky_positive_definite
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_rejection_composition_and_normals
    prompt_markdown: 'What mathematical property must a real symmetric matrix $\mathbf{T}$ possess in order to represent a valid physical covariance matrix and admit a real Cholesky factorization $\mathbf{S}\mathbf{S}^T = \mathbf{T}$?

      '
    hint_markdown: For any non-zero vector $\mathbf{c}$, the variance of the linear combination $\mathbf{c}^T \mathbf{x}$ is $\mathbf{c}^T \mathbf{T} \mathbf{c} > 0$.
    options:
    - id: a
      text: "$\\mathbf{T}$ must be positive-definite (all eigenvalues $> 0$, or $|\rho| < 1$ with $\\sigma_i > 0$), so that $\\mathbf{c}^T \\mathbf{T} \\mathbf{c} > 0$ for all non-zero vectors $\\mathbf{c}$."
      text_markdown: "$\\mathbf{T}$ must be positive-definite (all eigenvalues $> 0$, or $|\rho| < 1$ with $\\sigma_i > 0$), so that $\\mathbf{c}^T \\mathbf{T} \\mathbf{c} > 0$ for all non-zero vectors $\\mathbf{c}$."
    - id: b
      text: $\mathbf{T}$ must be antisymmetric ($T_{ij} = -T_{ji}$) with zeros on the diagonal.
      text_markdown: $\mathbf{T}$ must be antisymmetric ($T_{ij} = -T_{ji}$) with zeros on the diagonal.
    - id: c
      text: $\mathbf{T}$ must have negative diagonal entries ($T_{ii} < 0$).
      text_markdown: $\mathbf{T}$ must have negative diagonal entries ($T_{ii} < 0$).
    - id: d
      text: $\mathbf{T}$ must be an orthogonal permutation matrix.
      text_markdown: $\mathbf{T}$ must be an orthogonal permutation matrix.
    correct: a
    rationale_markdown: 'Because the variance of any non-trivial linear combination $\sum_\alpha c_\alpha x_\alpha$ must be strictly positive, $\langle (\mathbf{c}^T\mathbf{x})^2 \rangle = \mathbf{c}^T\mathbf{T}\mathbf{c} > 0$. This is the definition of a **symmetric positive-definite** matrix, which is the exact necessary and sufficient condition for a real Cholesky factor $\mathbf{S}$ with positive diagonal entries to exist.

      '
  - id: sec_importance_sampling_and_variance_trap
    type: markdown_section
    title: 3. Monte Carlo Efficiency, Importance Sampling & The Infinite-Variance Tail Trap
    body_markdown: "### The Figure of Merit: Simulation Efficiency $\\zeta$\nBecause the statistical error of a Monte Carlo mean decays as $\\text{error} = \\sqrt{\\text{variance} / N} \\propto (\\text{computer time})^{-1/2}$, the product of the **squared error of the mean** $v = \\text{error}^2 = \\sigma^2 / N$ and the **total CPU time** $T = N \\tau_{\\text{step}}$ is independent of run length $N$! We therefore define the fundamental **Efficiency (Figure of Merit)** of a Monte Carlo algorithm as:\n$$\\text{Efficiency} = \\zeta = \\frac{1}{v\\,T}$$\nTo maximize $\\zeta$, we can write a faster code (smaller $\\tau_{\\text{step}}$), buy a faster computer, or **reduce the per-sample variance $\\sigma^2$** via **Importance Sampling** and **Correlated Sampling**.\n\n### Importance Sampling & The Zero-Variance Principle\nSuppose we want to evaluate the multidimensional integral $I = \\int dx\\,f(x)$. Instead of sampling $x$ uniformly, we introduce a normalized **importance sampling probability\
      \ density** $p(x) > 0$ ($\\int dx\\,p(x) = 1$):\n$$I = \\int dx\\,p(x)\\left(\\frac{f(x)}{p(x)}\\right) = \\left\\langle \\frac{f(x)}{p(x)} \\right\\rangle_p$$\nDrawing $N$ samples $x_i \\sim p(x)\\,dx$, our unbiased **estimator** is $g(x) = f(x)/p(x)$. Its **mean** is always $I$ (independent of $p(x)$!), but its **variance** depends strongly on $p(x)$:\n$$v \\approx \\sigma^2 = \\left\\langle \\left(\\frac{f(x)}{p(x)} - I\\right)^2 \\right\\rangle_p = \\int dx\\,p(x)\\left(\\frac{f(x)}{p(x)}\\right)^2 - I^2 = \\int dx\\,\\frac{f(x)^2}{p(x)} - I^2$$\nMinimizing $\\sigma^2$ with respect to $p(x)$ subject to the normalization constraint $\\int dx\\,p(x) = 1$ (e.g., via Lagrange multipliers or parameterizing $p(x) = [q(x)]^2 / \\int [q]^2$) yields the **Optimal Importance Function**:\n$$p^*(x) = \\frac{|f(x)|}{\\int dx'\\,|f(x')|}, \\qquad \\text{Estimator: } \\frac{f(x)}{p^*(x)} = \\text{sign}\\big(f(x)\\big)\\int dx'\\,|f(x')|$$\n1. **Zero-Variance Principle:** If $f(x)$ does not change\
      \ sign ($f(x) \\ge 0$ everywhere), the estimator $f(x)/p^*(x) = I$ is a **constant**, so its variance is **identically zero** ($\\sigma^2 = 0$)!\n2. **Practical Guide:** Of course, we cannot normalize $p^*(x)$ directly without already knowing $I = \\int |f(x)|dx$—if we could, we would have solved the problem analytically! Instead, we choose a solvable trial function $p_a(x)$ whose shape mimics $|f(x)|$ where $|f(x)|$ is large.\n3. **The Sign Problem:** If $f(x)$ oscillates between positive and negative values, $\\text{sign}(f(x))$ jumps between $+1$ and $-1$, so **zero variance is impossible** even with $p^*(x)$! As the lecture notes: *\"Monte Carlo can add, but not subtract.\"*\n\n### Lecture Case Study: Gaussian Importance Sampling & The Infinite-Variance Trap\nConsider the lecture's classic 1D integral (slides 13–16 of `11.sampling.pdf`):\n$$f(x) = \\frac{e^{-x^2/2}}{1 + x^2}, \\qquad \\text{sampled with trial Gaussian } p_a(x) = \\frac{e^{-x^2/(2a)}}{\\sqrt{2\\pi a}} \\quad (a\
      \ > 0)$$\n- **Unbiased Mean:** For any $a > 0$, $\\langle f(x)/p_a(x) \\rangle_{p_a} = \\int dx\\,f(x) = I \\approx 1.6436$ is independent of $a$.\n- **Variance Integral:** Substituting $f(x)$ and $p_a(x)$ into $\\sigma^2(a) = \\int dx\\,\\frac{f(x)^2}{p_a(x)} - I^2$ gives:\n  $$\\sigma^2(a) = \\int_{-\\infty}^{\\infty} dx\\,\\frac{\\sqrt{2\\pi a}}{(1 + x^2)^2}\\,\\exp\\!\\left[-x^2\\left(1 - \\frac{1}{2a}\\right)\\right] - I^2$$\n- **Condition for Finite Variance ($a > 1/2$):** Look at the Gaussian exponent $-x^2\\left(1 - \\frac{1}{2a}\\right)$ as $|x| \\to \\infty$:\n  - If **$a \\le 1/2$** ($1 - \\frac{1}{2a} \\le 0$), the exponential **blows up** as $|x| \\to \\infty$! The variance integral diverges ($\\sigma^2(a) = \\infty$). In a simulation (slide 16), drawing a rare point in the tail $|x| \\gg 1$ where $p_a(x) \\ll f(x)$ produces gigantic **Pareto spikes** ($f(x_i)/p_a(x_i) \\gg 1$) and long power-law tails that ruin convergence!\n  - If **$a = 1$** (the \"obvious\" choice\
      \ matching the numerator $e^{-x^2/2}$), variance is finite ($\\sigma^2(1) \\approx 0.17$).\n  - **Optimal Value ($a^* \\approx 0.6$):** Because the denominator $1 + x^2$ makes $f(x)$ narrower than $e^{-x^2/2}$ near the origin, narrowing the Gaussian slightly to **$a \\approx 0.6$** minimizes $\\sigma^2(a)$ and cuts CPU time by more than a factor of $6$ compared to $a = 1$!\n  -*(Note: If the integrand were a pure Gaussian $f(x) = e^{-x^2/2}$ without the $1/(1+x^2)$ factor, the exact same exponent $1 - 1/(2a) > 0$ requires $a > 1/2$ for finite variance, while $a = 1$ would give zero variance! And if one tried to evaluate the unweighted average $\\langle 1/p_a(x) \\rangle$, the integral would diverge unless $p_a$ were wider still; slide 15 notes the three regimes: $a > 0$ for $p(x)$ to exist, $a > 0.5$ for finite variance, $a = 0.6$ optimal, and $a = 1$ obvious!)*\n\n> [!CAUTION]\n> **Golden Rule of Importance Sampling:** **Never under-sample the tails!** Over-sampling the tails ($a\
      \ > 0.6$, broader $p(x)$) causes only a mild, smooth loss of efficiency, whereas under-sampling the tails ($a \\le 0.5$, narrower $p(x)$ than $\\sqrt{|f(x)|}$) causes **infinite variance** and catastrophic spikes!\n"
