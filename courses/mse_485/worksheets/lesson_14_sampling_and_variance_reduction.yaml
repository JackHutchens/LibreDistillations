  - id: q14_41_poisson_exponential_product_rule
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_discrete_and_inverse_mapping
    prompt_markdown: 'Because the waiting times $y_k = -\ln(u_k)/a$ between consecutive events in a Poisson process of rate $a$ are independent exponential random variables, the number of events $n$ occurring in time interval $t$ (mean $\nu = at$) is the largest integer $n$ such that $\sum_{k=1}^n y_k \le t < \sum_{k=1}^{n+1} y_k$. Substituting $y_k = -\ln(u_k)/a$ and exponentiating both sides gives which fast multiplication-only rule for generating a Poisson integer $n \sim P_\nu(n)$ from uniform draws $u_k \sim U(0, 1)$?

      '
    hint_markdown: Rewrite $\sum_{k=1}^{n+1} (-\ln u_k / a) > t$ as $\ln(\prod_{k=1}^{n+1} u_k) < -at$ and exponentiate!
    options:
    - id: a
      text: Multiply independent uniform draws $u_1 u_2 \cdots$ until the product first drops below $e^{-\nu} = e^{-at}$ at step $n + 1$ ($\prod_{k=1}^n u_k \ge e^{-\nu} > \prod_{k=1}^{n+1} u_k$), and return $n$.
      text_markdown: Multiply independent uniform draws $u_1 u_2 \cdots$ until the product first drops below $e^{-\nu} = e^{-at}$ at step $n + 1$ ($\prod_{k=1}^n u_k \ge e^{-\nu} > \prod_{k=1}^{n+1} u_k$), and return $n$.
    - id: b
      text: Add $12$ uniform draws and subtract $e^{-\nu}$.
      text_markdown: Add $12$ uniform draws and subtract $e^{-\nu}$.
    - id: c
      text: Take $\max(u_1, \dots, u_n)$ and divide by $n!$.
      text_markdown: Take $\max(u_1, \dots, u_n)$ and divide by $n!$.
    - id: d
      text: Reject $u_k$ whenever $u_k > \nu$.
      text_markdown: Reject $u_k$ whenever $u_k > \nu$.
    correct: a
    rationale_markdown: 'Using the logarithm identity $\sum_{k=1}^{n+1} \left(-\frac{\ln u_k}{a}\right) = -\frac{1}{a}\ln\!\left(\prod_{k=1}^{n+1} u_k\right) > t$:

      $$\ln\!\left(\prod_{k=1}^{n+1} u_k\right) < -at = -\nu \iff \prod_{k=1}^{n+1} u_k < e^{-\nu}$$

      This classic Knuth algorithm generates exact Poisson variates directly from exponential inter-arrival times without evaluating a single logarithm inside the loop!

      '
