    correct: a
    hint_markdown: In 3D, $S(k) \propto k^{-4}$; in 2D, $S(k) \propto k^{-3}$.
    rationale_markdown: Porod's law states that scattering from sharp, thin interfaces of area per unit volume $\Sigma$ produces an asymptotic power-law tail $S(k) \propto \Sigma k^{-(d+1)}$. In 2D ($d=2$), this gives $S(k) \propto k^{-3}$; in 3D ($d=3$), it gives $S(k) \propto k^{-4}$.
