    - id: d
      text_markdown: Because the exchange parameter $J$ becomes complex.
      text: Because the exchange parameter $J$ becomes complex.
    correct: a
    hint_markdown: Try assigning $\pm 1$ to three vertices of a triangle such that every edge has opposite spins.
    rationale_markdown: On a triangle, choosing two spins antiparallel ($+1$ and $-1$) forces the third spin to be parallel to one of them, frustrating that bond. Gregory Wannier (1950) proved that the triangular AFM has macroscopic ground state degeneracy with residual zero-point entropy $S_0 / N k_B \approx 0.323$.
  - id: q22_35
    type: problem
    question_type: numeric
