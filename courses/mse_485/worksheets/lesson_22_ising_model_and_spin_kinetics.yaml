    prompt_markdown: How is the magnetic susceptibility $\chi_T$ related to the fluctuations of the total magnetization $M$ in the canonical ensemble at $h = 0$?
    options:
    - id: a
      text_markdown: $\chi_T = \frac{N}{k_B T} \left( \langle M^2 \rangle - \langle M \rangle^2 \right)$
      text: $\chi_T = \frac{N}{k_B T} \left( \langle M^2 \rangle - \langle M \rangle^2 \right)$
    - id: b
      text_markdown: $\chi_T = \langle M \rangle^2$
      text: $\chi_T = \langle M \rangle^2$
    - id: c
      text_markdown: $\chi_T = \frac{1}{N} \sum s_i$
      text: $\chi_T = \frac{1}{N} \sum s_i$
    - id: d
      text_markdown: $\chi_T = -k_B T \ln M$
      text: $\chi_T = -k_B T \ln M$
    correct: a
    hint_markdown: Differentiate $\langle M \rangle = \frac{1}{N}\frac{\partial \ln Z}{\partial(\beta h)}$ with respect to $h$.
    rationale_markdown: By the fluctuation-dissipation theorem, $\chi_T = \frac{\partial \langle M \rangle}{\partial h} = \beta N (\langle M^2 \rangle - \langle M \rangle^2) = \frac{N}{k_B T}\mathrm{Var}(M)$.
  - id: q22_39
    type: problem
