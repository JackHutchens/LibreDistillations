  - id: sec_critical_slowing_down_and_swendsen_wang
    type: markdown_section
    title: 5. Critical Slowing Down and the Swendsen-Wang Cluster Algorithm
    body_markdown: '### Critical Slowing Down


      Near the critical temperature $T_c$, the correlation length diverges as $\xi \propto |T - T_c|^{-\nu}$. Fluctuations become correlated over enormous spatial domains. In local single-spin-flip algorithms (Metropolis or Glauber), propagating information across a domain of size $\xi$ requires a random walk of domain walls, causing the **autocorrelation time** $\tau$ to diverge:


      $$\tau \propto \xi^z \propto |T - T_c|^{-z\nu}$$


      where $z$ is the **dynamic critical exponent**. For local single-spin-flip Metropolis in 2D, $z \approx 2.17$. On a lattice of size $L \approx \xi$, the computational effort per independent sample scales as:


      $$\text{CPU Time} \sim L^d \times \tau \sim L^{d + z} \approx L^{4.17}$$


      Simulating $L = 1024$ near $T_c$ with local flips becomes completely intractable due to this **critical slowing down**.


      ### The Fortuin-Kasteleyn Mapping and Swendsen-Wang


      In 1987, Robert Swendsen and Jian-Sheng Wang eliminated critical slowing down by mapping the Ising spin model to the **Fortuin-Kasteleyn random cluster model**. Instead of flipping single spins, whole correlated clusters are flipped simultaneously.


      **Swendsen-Wang Algorithm Steps:**

      1. **Bond Activation:** Iterate over all nearest-neighbor pairs $\langle i, j \rangle$. If the spins are parallel ($s_i = s_j$), activate a bond between them with probability:


      $$p = 1 - e^{-2\beta J}$$


      If the spins are antiparallel ($s_i \ne s_j$), no bond is formed ($p = 0$).

      2. **Cluster Identification:** Find all connected components of sites linked by active bonds (using Hoshen-Kopelman or Disjoint-Set / Union-Find).

      3. **Cluster Spin Flip:** For each connected cluster independently, choose a new spin orientation $s_{\text{cluster}} \in \{-1, +1\}$ with equal probability $1/2$ (or with field-dependent probability if $h \ne 0$). Assign this orientation to all spins in the cluster.


      ### Wolff Single-Cluster Algorithm


      Ulli Wolff (1989) refined the technique: pick a random seed spin and recursively grow a single cluster by adding parallel neighbors with probability $p = 1 - e^{-2\beta J}$, then flip the cluster unconditionally. Cluster algorithms dramatically slash the dynamic exponent in 2D from $z \approx 2.17$ down to $z_{\text{SW}} \approx 0.35$, completely eradicating critical slowing down!'
