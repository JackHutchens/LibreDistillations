  - id: q22_33
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_ising_hamiltonian_and_mappings
    prompt_markdown: For an antiferromagnetic Ising model ($J < 0$) on a bipartite lattice (e.g. square lattice) with $h = 0$, how can the model be mapped onto a ferromagnetic model ($J > 0$)?
    options:
    - id: a
      text_markdown: By applying an infinite magnetic field.
      text: By applying an infinite magnetic field.
    - id: b
      text_markdown: 'By performing a gauge transformation that flips the sign of all spins on one of the two sublattices: $s_i \to -s_i$ for $i \in B$.'
      text: 'By performing a gauge transformation that flips the sign of all spins on one of the two sublattices: $s_i \to -s_i$ for $i \in B$.'
    - id: c
      text_markdown: By rotating the lattice by 45 degrees.
      text: By rotating the lattice by 45 degrees.
    - id: d
      text_markdown: An antiferromagnet cannot be mapped to a ferromagnet.
      text: An antiferromagnet cannot be mapped to a ferromagnet.
    correct: b
    hint_markdown: On a bipartite lattice, every neighbor of sublattice A is in sublattice B. If $s_i \to -s_i$ for $i \in B$, what happens to $s_i s_j$?
    rationale_markdown: Because every bond connects a site in sublattice A to a site in sublattice B, transforming $s_j \to -s_j$ for all $j \in B$ flips the sign of every bond product $s_i s_j \to -s_i s_j$. The Hamiltonian $-J \sum s_i s_j$ with $J < 0$ becomes $-|J|\sum s_i s_j$, proving the two models are exactly isomorphic.
  - id: q22_34
    type: problem
