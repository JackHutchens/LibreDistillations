  - id: sec_glauber_vs_kawasaki_kinetics
    type: markdown_section
    title: '4. Spin Kinetics: Glauber vs. Kawasaki Dynamics and Domain Coarsening'
    body_markdown: '### Non-Equilibrium Quenches and Phase Separation


      When an Ising system is rapidly quenched from a high temperature $T \gg T_c$ to below $T_c$, the uniform disordered state becomes thermodynamically unstable. Microscopic domains of up-spins and down-spins nucleate and grow through **coarsening** (domain growth).


      The physical mechanism and rate of coarsening depend critically on whether the order parameter is conserved:


      ### Glauber Dynamics (Model A: Non-Conserved Order Parameter)


      - **Elementary Move:** A single spin $s_i$ is chosen at random and flipped: $s_i \to -s_i$.

      - **Conservation:** The total magnetization $M = \frac{1}{N}\sum s_i$ is **not conserved** ($\dot{M} \ne 0$).

      - **Physics:** Models magnetic materials where domain walls move freely under external and internal magnetic fields.

      - **Coarsening Law (Lifshitz-Allen-Cahn):** Domain wall motion is driven by local interface curvature $\kappa$:


      $$v_n \propto -\kappa$$


      Since curvature scales as $\kappa \sim 1/L(t)$ and velocity is $dL/dt$, we have $dL/dt \sim 1/L$, yielding the parabolic growth law:


      $$L(t) \propto t^{1/2}$$


      ### Kawasaki Dynamics (Model B: Conserved Order Parameter)


      - **Elementary Move:** Two nearest-neighbor spins with opposite signs ($s_i = +1, s_j = -1$) are **exchanged**: $s_i \leftrightarrow s_j$.

      - **Conservation:** The total magnetization $M = \frac{1}{N}\sum s_i$ is **strictly conserved** at its initial value.

      - **Physics:** Models binary alloys ($A-B$ segregation) and liquid-gas phase separation, where particle numbers of each species are fixed.

      - **Coarsening Law (Lifshitz-Slyozov-Wagner / LSW):** Domain growth proceeds via **Ostwald ripening** (small domains evaporate and diffuse through the matrix to deposit onto larger domains) and interfacial diffusion:


      $$L(t) \propto t^{1/3}$$


      Because mass must diffuse across domains, growth under Kawasaki dynamics is significantly slower ($t^{1/3}$) than curvature-driven Glauber growth ($t^{1/2}$).'
  - id: concept_glauber_vs_kawasaki_coarsening
    type: concept_cell
    title: 'Interactive Concept: Domain Coarsening (Glauber t^(1/2) vs. Kawasaki t^(1/3))'
    description_markdown: 'Compare non-conserved Glauber dynamics with conserved Kawasaki dynamics following a deep quench to $T = 0.5 T_c$.

      Switch between the two dynamical modes, adjust quench time $t$, and observe domain structure and characteristic domain size $L(t)$.'
    render_function: render_glauber_vs_kawasaki_coarsening
    layout:
      kind: matplotlib
      figsize:
      - 9
      - 5
    controls:
      dynamics_mode:
        kind: dropdown
        label: Kinetics Mechanism
        options:
        - label: Kawasaki Dynamics (Conserved Order Parameter, Model B)
          value: kawasaki
        - label: Glauber Dynamics (Non-Conserved Order Parameter, Model A)
          value: glauber
        default: kawasaki
      quench_time:
        kind: slider
        label: Quench Evolution Time t
        min: 5
        max: 100
        step: 5
        default: 40
      initial_magnetization:
        kind: slider
        label: Initial Magnetization M_0
        min: 0.0
        max: 0.5
        step: 0.05
        default: 0.15
    takeaway_markdown: '**Key Insight:** Glauber dynamics rapidly collapses isolated minority clusters through curvature-driven shrinkage ($L(t) \sim t^{1/2}$), rapidly magnetizing the entire lattice. Kawasaki dynamics maintains fixed total composition, forcing the system to form interconnected bicontinuous structures (spinodal decomposition) that coarsen via slow diffusive ripening ($L(t) \sim t^{1/3}$).'
  - id: q22_11
    type: problem
