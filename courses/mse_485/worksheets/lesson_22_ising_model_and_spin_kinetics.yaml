worksheet:
  id: lesson_22_ising_model_and_spin_kinetics
  title: 'Lesson 22: The Ising Model: Exact Solutions, Phase Transitions, Spin Kinetics & Coarsening'
  estimated_minutes: 120
  learning_objectives:
  - Define the Ising Hamiltonian, understand the discrete $\mathbb{Z}_2$ inversion symmetry, and map spins to lattice gases and binary alloys.
  - Solve the 1D Ising model using the transfer matrix method and explain why continuous 1D systems with short-range interactions cannot exhibit a finite-temperature phase transition.
  - Analyze Onsager's exact 2D solution, calculate the critical temperature $k_B T_c / J = 2 / \ln(1+\sqrt{2}) \approx 2.269$, and identify 2D critical exponents ($\alpha=0, \beta=1/8, \gamma=7/4, \nu=1$).
  - Examine the finite-size magnetization probability distribution $P_L(M)$ and quantify the interfacial free energy barrier $\Delta F = 2\sigma L^{d-1}$ separating broken-symmetry ground states.
  - Differentiate Glauber single-spin-flip dynamics (non-conserved order parameter, Model A, $L(t) \sim t^{1/2}$) from Kawasaki spin-exchange dynamics (conserved order parameter, Model B, $L(t) \sim t^{1/3}$).
  - Explain critical slowing down ($\tau \sim \xi^z$) and implement the Swendsen-Wang and Wolff cluster algorithms based on the Fortuin-Kasteleyn random cluster mapping ($p = 1 - e^{-2\beta J}$).
  sections:
  - id: sec_ising_hamiltonian_and_mappings
    type: markdown_section
    title: 1. The Ising Model, Lattice Gases, and Binary Alloys
    body_markdown: '### The Ising Hamiltonian


      Proposed by Wilhelm Lenz (1920) and solved in 1D by Ernst Ising (1925), the Ising model represents discrete magnetic dipoles on a $d$-dimensional lattice. Each site $i \in \{1, \dots, N\}$ carries a scalar spin variable $s_i \in \{-1, +1\}$. The Hamiltonian is:


      $$\mathcal{H}(\{s_i\}) = -J \sum_{\langle i, j \rangle} s_i s_j - h \sum_{i=1}^N s_i$$


      where $J > 0$ favors ferromagnetic alignment, $\langle i, j \rangle$ denotes distinct nearest-neighbor pairs, and $h$ is an external magnetic field. When $h = 0$, the Hamiltonian possesses a global discrete $\mathbb{Z}_2$ **inversion symmetry**: flipping all spins $s_i \to -s_i$ leaves $\mathcal{H}$ invariant.


      ### The Lattice Gas Mapping (Liquid-Gas Coexistence)


      The Ising model maps isomorphically to a lattice gas of fluid molecules. Let $n_i \in \{0, 1\}$ denote the occupation number of site $i$ ($n_i = 1$ if occupied, $0$ if empty). Relating the spin to occupation via:


      $$s_i = 2n_i - 1 \iff n_i = \frac{1 + s_i}{2}$$


      The lattice gas grand canonical Hamiltonian with nearest-neighbor attraction $-\epsilon$ and chemical potential $\mu$ is:


      $$\mathcal{H}_{\text{LG}} = -\epsilon \sum_{\langle i, j \rangle} n_i n_j - \mu \sum_i n_i$$


      Substituting $n_i = (s_i + 1)/2$ maps this directly to the Ising Hamiltonian with:


      $$J = \frac{\epsilon}{4}, \qquad h = \frac{\mu - \mu_0}{2}$$


      where $\mu_0 = -z\epsilon / 2$ is the chemical potential at liquid-gas coexistence ($z$ being the lattice coordination number). The spontaneous magnetization $M = \frac{1}{N}\sum s_i$ corresponds to the density difference between liquid and vapor phases:


      $$\rho - \rho_c = \frac{1}{2} M$$


      ### Binary Alloy Mapping (Order-Disorder Transition)


      In a binary alloy (e.g. Cu-Au or Fe-Al), let $s_i = +1$ denote an atom of species $A$ and $s_i = -1$ denote species $B$. Pair interactions $V_{AA}, V_{BB}, V_{AB}$ map onto the Ising model with effective exchange parameter:


      $$J = \frac{1}{4}(2 V_{AB} - V_{AA} - V_{BB})$$


      If $J > 0$, unlike neighbors are favored (ordering alloy / antiferromagnet); if $J < 0$, like neighbors are favored (phase-separating mixture).'
  - id: sec_exact_solutions_and_onsager
    type: markdown_section
    title: '2. Exact Solutions: 1D Transfer Matrix and 2D Onsager Theorem'
    body_markdown: '### The 1D Ising Chain and the Transfer Matrix


      For a 1D chain of $N$ spins with periodic boundary conditions ($s_{N+1} = s_1$) in field $h$, the partition function is:


      $$Z = \sum_{\{s_i\}} \prod_{i=1}^N \exp\left[ \beta J s_i s_{i+1} + \frac{1}{2}\beta h (s_i + s_{i+1}) \right] = \text{Tr}\left( \mathbf{T}^N \right)$$


      where $\mathbf{T}$ is the $2 \times 2$ **transfer matrix**:


      $$\mathbf{T} = \begin{pmatrix} e^{\beta(J + h)} & e^{-\beta J} \\ e^{-\beta J} & e^{\beta(J - h)} \end{pmatrix}$$


      The eigenvalues of $\mathbf{T}$ for $h = 0$ are $\lambda_1 = 2\cosh(\beta J)$ and $\lambda_2 = 2\sinh(\beta J)$. In the thermodynamic limit $N \to \infty$, the partition function is dominated by the largest eigenvalue:


      $$Z = \lambda_1^N + \lambda_2^N = \lambda_1^N \left[ 1 + \left( \frac{\lambda_2}{\lambda_1} \right)^N \right] \approx \lambda_1^N = (2\cosh\beta J)^N$$


      The spin-spin correlation function is:


      $$\langle s_i s_{i+r} \rangle = \left( \frac{\lambda_2}{\lambda_1} \right)^r = (\tanh\beta J)^r = e^{-r / \xi}$$


      where the correlation length is $\xi = -1 / \ln(\tanh\beta J) \approx \frac{1}{2} e^{2\beta J}$ as $T \to 0$. Because $\lambda_1 > \lambda_2 > 0$ for all $T > 0$, the free energy is strictly analytic: **there is no phase transition at any finite temperature in 1D!**


      ### Onsager''s Exact 2D Solution (1944)


      Lars Onsager solved the zero-field 2D square lattice Ising model exactly. The critical coupling satisfies:


      $$\sinh(2\beta_c J) = 1 \implies \beta_c J = \frac{1}{2} \ln(1 + \sqrt{2}) \approx 0.440687$$


      which yields the exact critical temperature:


      $$\frac{k_B T_c}{J} = \frac{2}{\ln(1 + \sqrt{2})} \approx 2.269185$$


      C. N. Yang (1952) subsequently derived the exact spontaneous magnetization below $T_c$:


      $$M_0(T) = \left[ 1 - \frac{1}{[\sinh(2\beta J)]^4} \right]^{1/8} \quad (T < T_c)$$


      Near $T_c$, $M_0(T) \propto (T_c - T)^{\beta}$ with critical exponent $\beta = 1/8 = 0.125$ (distinct from mean-field $\beta_{\text{MF}} = 1/2$).'
  - id: sec_magnetization_distribution_and_interfaces
    type: markdown_section
    title: 3. The Finite-Size Magnetization Distribution and Interfacial Tension
    body_markdown: '### The Order Parameter Distribution $P_L(M)$


      In a finite lattice of linear dimension $L$ ($N = L^d$ spins), the total magnetization per spin is $M = \frac{1}{N}\sum_{i=1}^N s_i$. The probability density $P_L(M)$ reveals the underlying Landau effective free energy $\mathcal{F}_L(M) = -k_B T \ln P_L(M)$:


      1. **High-Temperature Disordered Phase ($T > T_c$):** Spins are largely uncorrelated ($\xi \ll L$). By the Central Limit Theorem, $P_L(M)$ is a single Gaussian centered at $M = 0$:


      $$P_L(M) \propto \exp\left( -\frac{N M^2}{2 k_B T \chi_T} \right)$$


      2. **Critical Point ($T = T_c$):** Fluctuations occur on all length scales up to $L$ ($\xi \sim L$). The Gaussian term vanishes, and $P_L(M)$ flattens into a non-Gaussian distribution governed by the quartic term:


      $$P_L(M) \propto \exp\left( -u L^{d - 4\beta/\nu} M^4 \right)$$


      3. **Low-Temperature Ordered Phase ($T < T_c$):** Spontaneous symmetry breaking splits $P_L(M)$ into **two symmetric peaks** at $M \approx \pm M_0(T)$. Configurations near $M = 0$ must contain two system-spanning domain walls separating regions of spin up and spin down.


      ### Interfacial Free Energy Barrier


      The free energy penalty to create two flat domain walls of cross-sectional area $L^{d-1}$ is:


      $$\Delta \mathcal{F}_L = 2 \sigma(T) L^{d-1}$$


      where $\sigma(T)$ is the surface tension between $+M_0$ and $-M_0$ phases. Consequently, the probability of visiting $M = 0$ is suppressed exponentially:


      $$\frac{P_L(M = 0)}{P_L(M = M_0)} \approx \exp\left( -2\beta \sigma(T) L^{d-1} \right)$$


      In Monte Carlo simulations with local single-spin flips, tunneling between $+M_0$ and $-M_0$ requires an astronomically long Kramers time $\tau_{\text{tunnel}} \sim \exp(2\beta \sigma L^{d-1})$, trapping the system in a single broken-symmetry state.'
  - id: concept_ising_magnetization_pdf
    type: concept_cell
    title: 'Interactive Concept: Magnetization Distribution P_L(M) and Barrier'
    description_markdown: 'Explore the magnetization probability distribution $P_L(M)$ and Landau free energy profile $\mathcal{F}(M) = -\ln P_L(M)$.

      Adjust temperature ratio $T/T_c$, lattice size $L$, and external magnetic field $h$ to observe bimodal splitting and field tilt.'
    render_function: render_ising_magnetization_pdf
    layout:
      kind: matplotlib
      figsize:
      - 9
      - 5
    controls:
      temp_ratio:
        kind: slider
        label: Temperature Ratio T / T_c
        min: 0.4
        max: 1.6
        step: 0.05
        default: 0.85
      box_size:
        kind: dropdown
        label: Lattice Size L
        options:
        - label: L = 8 (N = 64)
          value: 8
        - label: L = 16 (N = 256)
          value: 16
        - label: L = 32 (N = 1024)
          value: 32
        - label: L = 64 (N = 4096)
          value: 64
        default: 16
      magnetic_field:
        kind: slider
        label: Magnetic Field h / J
        min: -0.5
        max: 0.5
        step: 0.05
        default: 0.0
      view_mode:
        kind: dropdown
        label: Display View
        options:
        - label: Probability Density P_L(M)
          value: pdf
        - label: Landau Free Energy F(M) = -ln P
          value: free_energy
        default: pdf
    takeaway_markdown: '**Key Insight:** Below $T_c$, $P_L(M)$ splits into two sharp peaks at $\pm M_0$. As $L$ increases, the barrier at $M = 0$ scales as $2\sigma L$, exponentially suppressing transitions between ground states. Adding a magnetic field $h > 0$ tilts the potential, exponentially stabilizing the $+M_0$ phase.'
  - id: q22_01
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_ising_hamiltonian_and_mappings
    prompt_markdown: What discrete global symmetry does the zero-field ($h = 0$) Ising Hamiltonian possess?
    options:
    - id: a
      text_markdown: Continuous rotational symmetry $O(3)$
      text: Continuous rotational symmetry $O(3)$
    - id: b
      text_markdown: 'Discrete spin-inversion symmetry $\mathbb{Z}_2$: invariance under $s_i \to -s_i$ for all $i$'
      text: 'Discrete spin-inversion symmetry $\mathbb{Z}_2$: invariance under $s_i \to -s_i$ for all $i$'
    - id: c
      text_markdown: Gauge symmetry $U(1)$
      text: Gauge symmetry $U(1)$
    - id: d
      text_markdown: Lorentz invariance
      text: Lorentz invariance
    correct: b
    hint_markdown: 'Consider what happens to the product $s_i s_j$ when every spin changes sign: $(-s_i)(-s_j) = s_i s_j$.'
    rationale_markdown: Because $(-s_i)(-s_j) = s_i s_j$, the exchange energy is unchanged when all spins are simultaneously inverted. This discrete up-down symmetry is isomorphic to the cyclic group $\mathbb{Z}_2$.
  - id: q22_02
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_ising_hamiltonian_and_mappings
    prompt_markdown: Under the mapping from the Ising model to the lattice gas ($s_i = 2n_i - 1$), what physical quantity in the fluid corresponds to the Ising magnetization $M = \frac{1}{N}\sum s_i$?
    options:
    - id: a
      text_markdown: Total kinetic energy of the fluid
      text: Total kinetic energy of the fluid
    - id: b
      text_markdown: 'Deviation of fluid density from the critical density: $\rho - \rho_c = \frac{1}{2} M$'
      text: 'Deviation of fluid density from the critical density: $\rho - \rho_c = \frac{1}{2} M$'
    - id: c
      text_markdown: The viscosity of the fluid
      text: The viscosity of the fluid
    - id: d
      text_markdown: The temperature of the fluid
      text: The temperature of the fluid
    correct: b
    hint_markdown: Relate $\rho = \frac{1}{N}\sum n_i$ to $M = \frac{1}{N}\sum s_i$.
    rationale_markdown: Since $n_i = (1 + s_i)/2$, the average density is $\rho = \langle n_i \rangle = \frac{1}{2}(1 + M) = \rho_c + \frac{1}{2}M$, where $\rho_c = 1/2$. Thus $M = 2(\rho - \rho_c)$.
  - id: q22_03
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_exact_solutions_and_onsager
    prompt_markdown: Using Onsager's exact formula $\frac{k_B T_c}{J} = \frac{2}{\ln(1 + \sqrt{2})}$, calculate the critical temperature $k_B T_c / J$ for the 2D square lattice Ising model to 3 decimal places.
    correct: 2.269
    tolerance: 0.005
    hint_markdown: Evaluate $2 / \ln(1 + 1.414214)$.
    rationale_markdown: $\ln(1 + \sqrt{2}) = \ln(2.4142136) \approx 0.8813736$. Then $2 / 0.8813736 \approx 2.269185 \approx 2.269$.
  - id: q22_04
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_exact_solutions_and_onsager
    prompt_markdown: Why cannot a 1D Ising chain with finite-range interactions undergo a spontaneous phase transition at any temperature $T > 0$?
    options:
    - id: a
      text_markdown: Because creating a domain wall (kink) costs a finite energy $\Delta E = 2J$, but introduces an entropic contribution $-T \Delta S = -k_B T \ln N$ that diverges logarithmically as $N \to \infty$, making domain walls spontaneously populate the chain.
      text: Because creating a domain wall (kink) costs a finite energy $\Delta E = 2J$, but introduces an entropic contribution $-T \Delta S = -k_B T \ln N$ that diverges logarithmically as $N \to \infty$, making domain walls spontaneously populate the chain.
    - id: b
      text_markdown: Because the transfer matrix has zero eigenvalues.
      text: Because the transfer matrix has zero eigenvalues.
    - id: c
      text_markdown: Because spins cannot be flipped in one dimension.
      text: Because spins cannot be flipped in one dimension.
    - id: d
      text_markdown: Because the 1D lattice has no nearest neighbors.
      text: Because the 1D lattice has no nearest neighbors.
    correct: a
    hint_markdown: Think about the free energy $\Delta F = \Delta E - T \Delta S$ to insert a single domain boundary in a chain of $N$ sites.
    rationale_markdown: Inserting a domain wall costs a fixed energy $\Delta E = 2J$. However, the wall can be placed at any of $N$ positions, giving entropy $\Delta S = k_B \ln N$. Thus $\Delta F = 2J - k_B T \ln N$. For any $T > 0$, $\Delta F \to -\infty$ as $N \to \infty$, destroying long-range order (Peierls argument in 1D).
  - id: q22_05
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_exact_solutions_and_onsager
    prompt_markdown: What is the critical exponent $\beta$ governing spontaneous magnetization $M_0 \propto (T_c - T)^{\beta}$ in the 2D Ising model according to Yang's exact solution, and how does it compare to Mean-Field Theory?
    options:
    - id: a
      text_markdown: $\beta = 1/8$ in 2D Onsager, whereas Mean-Field Theory predicts $\beta_{\text{MF}} = 1/2$.
      text: $\beta = 1/8$ in 2D Onsager, whereas Mean-Field Theory predicts $\beta_{\text{MF}} = 1/2$.
    - id: b
      text_markdown: $\beta = 1/2$ in both 2D and Mean-Field.
      text: $\beta = 1/2$ in both 2D and Mean-Field.
    - id: c
      text_markdown: $\beta = 0$ in 2D, meaning magnetization jumps discontinuously.
      text: $\beta = 0$ in 2D, meaning magnetization jumps discontinuously.
    - id: d
      text_markdown: $\beta = 1$ in 2D.
      text: $\beta = 1$ in 2D.
    correct: a
    hint_markdown: Recall Yang's formula $M_0 = [1 - \sinh^{-4}(2\beta J)]^{1/8}$.
    rationale_markdown: C. N. Yang's exact 1952 derivation demonstrated that the spontaneous magnetization approaches zero with critical exponent $\beta = 1/8 = 0.125$. Mean-field theory neglects critical fluctuations and predicts $\beta_{\text{MF}} = 1/2 = 0.50$.
  - id: q22_06
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: concept_ising_magnetization_pdf
    prompt_markdown: In the concept cell, at $T/T_c = 0.85$ and $h = 0$, what is the qualitative shape of the probability density function $P_L(M)$?
    options:
    - id: a
      text_markdown: A single narrow delta peak centered at $M = 0$
      text: A single narrow delta peak centered at $M = 0$
    - id: b
      text_markdown: A symmetric bimodal distribution with two distinct peaks at $M \approx +M_0$ and $M \approx -M_0$, separated by a deep valley at $M = 0$
      text: A symmetric bimodal distribution with two distinct peaks at $M \approx +M_0$ and $M \approx -M_0$, separated by a deep valley at $M = 0$
    - id: c
      text_markdown: A uniform flat line from $M = -1$ to $M = +1$
      text: A uniform flat line from $M = -1$ to $M = +1$
    - id: d
      text_markdown: An exponentially decaying curve starting at $M = -1$
      text: An exponentially decaying curve starting at $M = -1$
    correct: b
    hint_markdown: Look at the plot in the concept cell for $T < T_c$.
    rationale_markdown: Below $T_c$, spontaneous symmetry breaking causes the system to prefer states with non-zero net alignment $+M_0$ or $-M_0$. In a finite system with $h=0$, both states have equal probability, producing two symmetric peaks separated by a minimum at $M=0$.
  - id: q22_07
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_magnetization_distribution_and_interfaces
    prompt_markdown: In a 2D square lattice of size $L = 32$, two straight domain walls span the periodic box. If each wall has length $L = 32$ and surface tension $\beta \sigma = 0.15$ per unit length, calculate the total dimensionless interfacial free energy penalty $\Delta \mathcal{F} / k_B T = 2 \beta \sigma L$.
    correct: 9.6
    tolerance: 0.1
    hint_markdown: Multiply $2 \times 0.15 \times 32$.
    rationale_markdown: $\Delta \mathcal{F} / k_B T = 2 \times 0.15 \times 32 = 9.6$.
  - id: q22_08
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_magnetization_distribution_and_interfaces
    prompt_markdown: Why do periodic boundary conditions require a minimum of TWO domain walls (rather than one) to transition from a fully up-spin state to a fully down-spin state?
    options:
    - id: a
      text_markdown: Because spins can only flip in pairs.
      text: Because spins can only flip in pairs.
    - id: b
      text_markdown: Because periodic boundaries identify $x = 0$ with $x = L$; a slice of down-spins embedded in an up-spin bulk necessarily has an entry boundary ($+ \to -$) and an exit boundary ($- \to +$).
      text: Because periodic boundaries identify $x = 0$ with $x = L$; a slice of down-spins embedded in an up-spin bulk necessarily has an entry boundary ($+ \to -$) and an exit boundary ($- \to +$).
    - id: c
      text_markdown: Because energy must be conserved.
      text: Because energy must be conserved.
    - id: d
      text_markdown: Because the magnetic field is always zero.
      text: Because the magnetic field is always zero.
    correct: b
    hint_markdown: Draw a closed loop on a torus where spins go $+1 \to -1 \to +1$.
    rationale_markdown: On a torus (periodic boundary conditions), any region of reversed spins is enclosed by a closed contour. A flat slab spanning the box must wrap around, creating two parallel interfaces separated by the slab thickness.
  - id: q22_09
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: concept_ising_magnetization_pdf
    prompt_markdown: When a positive external magnetic field $h > 0$ is applied in the concept cell, how does the magnetization distribution $P_L(M)$ respond?
    options:
    - id: a
      text_markdown: The two peaks remain exactly symmetric.
      text: The two peaks remain exactly symmetric.
    - id: b
      text_markdown: The peak at $+M_0$ grows substantially while the peak at $-M_0$ is exponentially suppressed by the Zeeman energy factor $e^{2\beta N h M_0}$.
      text: The peak at $+M_0$ grows substantially while the peak at $-M_0$ is exponentially suppressed by the Zeeman energy factor $e^{2\beta N h M_0}$.
    - id: c
      text_markdown: Both peaks shift immediately to $M = 0$.
      text: Both peaks shift immediately to $M = 0$.
    - id: d
      text_markdown: The temperature of the system drops to zero.
      text: The temperature of the system drops to zero.
    correct: b
    hint_markdown: Recall the Zeeman energy term $-h \sum s_i = -N h M$.
    rationale_markdown: The external field adds a term $-N h M$ to the Hamiltonian, favoring the $+M$ state by a Boltzmann factor ratio of $e^{2\beta N h M_0}$. Even a tiny field $h > 0$ completely suppresses the $-M$ peak in macroscopic systems.
