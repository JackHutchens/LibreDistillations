  - id: q22_20_periodic_boundary_two_domain_walls
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_order_parameter_distribution_and_interfaces
    prompt_markdown: In a simulation cell with periodic boundary conditions, why does traversing the configuration space from a state dominated by positive magnetization to one dominated by negative magnetization require the creation of at least two domain walls rather than a single interface?
    hint_markdown: Consider the topology of a flat torus formed by periodic boundaries, and trace any continuous closed coordinate path that crosses an embedded slab of reversed spins.
    options:
    - id: a
      text: Because periodic boundary conditions identify coordinate x = 0 with x = L; any slab of reversed spins embedded in the bulk must have both an entry interface (+ to -) and an exit interface (- to +) to satisfy cyclic continuity.
    - id: b
      text: Because spins are only permitted to flip in pairs by the Pauli exclusion principle.
    - id: c
      text: Because single domain walls violate energy conservation during Monte Carlo steps.
    - id: d
      text: Because the transfer matrix has two distinct eigenvalues.
    correct: a
    rationale_markdown: Periodic boundary conditions endow the simulation lattice with the topology of a torus. If a slab of down-spins is embedded inside an up-spin background, wrapping around the torus requires entering the down-spin phase across one domain wall and returning to the up-spin phase across a second domain wall. A single isolated domain wall cannot satisfy periodic boundary conditions.
  - id: q22_21_interfacial_free_energy_numeric
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_order_parameter_distribution_and_interfaces
    prompt_markdown: In a Monte Carlo simulation of a 2D square-lattice Ising ferromagnet on an $L \times L$ grid with periodic boundary conditions ($L = 48$), the system is cooled to an ordered state where the dimensionless interfacial free energy per unit length is $\beta \sigma = 0.125$. Under periodic boundaries, the minimum free energy configuration at zero net magnetization ($M = 0$) consists of two flat system-spanning domain walls. Calculate the total dimensionless free energy barrier $\beta \Delta \mathcal{F}_L$ separating the two degenerate ferromagnetic ground states.
    hint_markdown: Account for the cross-sectional length of each system-spanning interface in two dimensions and the total number of independent interfaces mandated by periodic boundary conditions.
    correct:
      value: 12.0
      tolerance: 0.1
    rationale_markdown: In two dimensions ($d = 2$), each system-spanning domain wall has length $L = 48$. Periodic boundary conditions require two such interfaces to form a slab configuration at $M = 0$. The total dimensionless interfacial barrier is $\beta \Delta \mathcal{F}_L = 2 (\beta \sigma) L = 2 \times 0.125 \times 48 = 12.0$. The probability of observing $M = 0$ is suppressed by $e^{-12.0} \approx 6.1 \times 10^{-6}$ relative to the peak maxima.
  - id: q22_22_zeeman_field_exponential_suppression
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_order_parameter_distribution_and_interfaces
    - concept_ising_magnetization_pdf
    prompt_markdown: When an external magnetic field $h > 0$ is applied to an Ising ferromagnet below $T_c$ in the interactive concept visualizer, how does the ratio of probabilities between the two broken-symmetry states, $P_L(+M_0) / P_L(-M_0)$, scale with the total number of lattice sites $N$?
    hint_markdown: Evaluate the Zeeman energy difference Delta E_h between a state with total magnetization +N*M_0 and a state with total magnetization -N*M_0 in the canonical Boltzmann distribution.
    options:
    - id: a
      text: It scales exponentially as exp(2 * beta * N * h * M_0), completely suppressing the minority -M_0 state in macroscopic systems even for infinitesimal positive fields.
    - id: b
      text: It scales linearly with N as (1 + 2 * beta * h * M_0).
    - id: c
      text: It remains equal to 1 because discrete Z_2 symmetry cannot be broken by a magnetic field.
    - id: d
      text: It decreases as 1 / N due to finite-size rounding.
    correct: a
    rationale_markdown: The external field adds a Zeeman energy term $-h \sum s_i = -N h M$ to the Hamiltonian. The energy difference between the state with magnetization $+M_0$ and the state with $-M_0$ is $\Delta E = -N h (+M_0) - (-N h (-M_0)) = -2 N h M_0$. By the Boltzmann distribution, the ratio of probabilities is $\frac{P(+M_0)}{P(-M_0)} = \exp(2 \beta N h M_0)$. For any macroscopic system ($N \sim 10^{23}$ or even $N \sim 10^4$ in simulations), this factor is astronomical, causing the system to reside exclusively in the $+M_0$ state.
  - id: q22_23_binder_cumulant_crossing_method
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_order_parameter_distribution_and_interfaces
    prompt_markdown: Why is the Binder fourth-order cumulant $U_4(T, L) = 1 - \frac{\langle M^4 \rangle_L}{3 \langle M^2 \rangle_L^2}$ one of the most powerful computational tools for locating continuous phase transitions in finite-size Monte Carlo simulations?
    hint_markdown: Consider how the dimensionless ratio of moments behaves under finite-size scaling when the correlation length xi is replaced by system size L right at T = Tc.
    options:
    - id: a
      text: Because U_4 is a dimensionless ratio whose leading-order scaling function is scale-invariant at T = Tc, causing curves of U_4(T, L) for different box sizes L to intersect at a common crossing point that pinpoints Tc.
    - id: b
      text: Because U_4 is strictly zero at all temperatures except exactly at T = Tc where it diverges to infinity.
    - id: c
      text: Because U_4 eliminates the need to perform Monte Carlo sampling by computing the partition function analytically.
    - id: d
      text: Because U_4 only requires measuring single-spin flip probabilities.
    correct: a
    rationale_markdown: According to finite-size scaling, the fourth-order cumulant obeys $U_4(T, L) = \widetilde{U}((T - T_c)L^{1/\nu})$. Exactly at $T = T_c$, the argument $(T - T_c)L^{1/\nu} = 0$ vanishes, making $U_4(T_c, L) = \widetilde{U}(0) = U^*$ a universal constant independent of $L$ (to leading order). Consequently, plotting $U_4$ versus $T$ for multiple lattice sizes $L_1, L_2, L_3$ produces curves that intersect at $T_c$, allowing critical temperatures to be determined with high precision without prior knowledge of critical exponents.
  - id: q22_24_susceptibility_finite_size_scaling
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_order_parameter_distribution_and_interfaces
    prompt_markdown: In an infinite system, the magnetic susceptibility diverges as $\chi_T \propto |T - T_c|^{-\gamma}$. In a finite 2D simulation cell of linear dimension $L$, how does the maximum peak value of the susceptibility $\chi_{\max}(L)$ scale with $L$?
    hint_markdown: 'Apply finite-size scaling: replace the diverging correlation length xi ~ |T - Tc|^(-nu) with the system size cutoff L in the susceptibility divergence relation.'
    options:
    - id: a
      text: chi_max(L) ~ L^(gamma / nu) = L^(1.75 / 1) = L^1.75
    - id: b
      text: chi_max(L) ~ L^0 = constant
    - id: c
      text: chi_max(L) ~ L^2
    - id: d
      text: chi_max(L) ~ exp(-L)
    correct: a
    rationale_markdown: Under finite-size scaling, the singular part of the susceptibility scales as $\chi(T, L) = L^{\gamma / \nu} \widetilde{\chi}((T - T_c)L^{1/\nu})$. In a finite box, the divergence is rounded into a peak of height $\chi_{\max}(L) \propto L^{\gamma / \nu}$. Substituting the exact 2D Ising exponents $\gamma = 7/4 = 1.75$ and $\nu = 1$ gives $\chi_{\max}(L) \propto L^{1.75}$.
  - id: q22_25_fluctuation_dissipation_susceptibility
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_order_parameter_distribution_and_interfaces
    prompt_markdown: In a canonical Monte Carlo simulation of an Ising model at zero external field ($h = 0$), how is the static isothermal susceptibility $\chi_T = \lim_{h \to 0} \frac{\partial \langle M \rangle}{\partial h}$ computed from sampled equilibrium configurations?
    hint_markdown: Differentiate the canonical ensemble average of magnetization with respect to external field h using the definition of the partition function.
    options:
    - id: a
      text: 'Via the fluctuation-dissipation theorem relating response to variance: chi_T = (N / (k_B * T)) * ( <M^2> - <M>^2 ).'
    - id: b
      text: By computing the time derivative of total energy dE/dt.
    - id: c
      text: By evaluating the square root of the mean magnetization sqrt(<M>).
    - id: d
      text: From the inverse of the transfer matrix trace 1 / Tr(T^N).
    correct: a
    rationale_markdown: By the fluctuation-dissipation theorem, differentiating $\langle M \rangle = \frac{1}{N Z} \sum_s M(s) e^{-\beta \mathcal{H}(s)}$ with respect to $h$ (where $\frac{\partial \mathcal{H}}{\partial h} = -N M$) yields $\frac{\partial \langle M \rangle}{\partial h} = \beta N (\langle M^2 \rangle - \langle M \rangle^2) = \frac{N}{k_B T}\mathrm{Var}(M)$. This allows static response functions to be extracted directly from equilibrium thermal fluctuations without applying perturbing external fields.
  - id: sec_spin_kinetics_coarsening_and_ripening
    type: markdown_section
    title: '5. Spin Kinetics: Glauber vs. Kawasaki Dynamics, Domain Coarsening, and Ripening'
    body_markdown: '### Non-Equilibrium Quenches and Phase Separation Kinetics

      When an Ising system is rapidly quenched from a high-temperature disordered state ($T \gg T_c$) to below $T_c$, the uniform state becomes unstable. Microscopic domains of up and down spins nucleate, coalesce, and grow through **coarsening** (domain growth). The kinetic mechanism and growth law depend profoundly on whether the order parameter is conserved:


      ### Glauber Dynamics (Model A: Non-Conserved Order Parameter)

      - **Elementary Move:** A single spin $s_i$ is randomly selected and flipped: $s_i \to -s_i$.

      - **Conservation:** The total magnetization $M = \frac{1}{N}\sum s_i$ is **not conserved** ($\dot{M} \ne 0$).

      - **Physical Context:** Models magnetic domains in ferromagnets where atomic magnetic moments rotate under local molecular fields.

      - **Lifshitz-Allen-Cahn Growth Law:** Domain wall velocity is driven strictly by local interface curvature $\kappa$:

      $$v_n = -\Gamma \sigma \kappa$$

      Because the characteristic curvature scales inversely with domain radius $\kappa \sim 1/L(t)$ and velocity is $dL/dt$, we have:

      $$\frac{dL}{dt} \sim \frac{1}{L} \implies L(t)^2 - L(0)^2 \propto t \implies L(t) \propto t^{1/2}$$


      ### Kawasaki Dynamics (Model B: Conserved Order Parameter)

      - **Elementary Move:** Two nearest-neighbor spins with opposite signs ($s_i = +1, s_j = -1$) are **exchanged**: $s_i \leftrightarrow s_j$.

      - **Conservation:** The total magnetization $M = \frac{1}{N}\sum s_i$ (i.e. atomic composition) is **strictly conserved** at its initial value.

      - **Physical Context:** Models binary alloy phase separation (precipitation, spinodal decomposition) and liquid-gas demixing, where solute atoms must diffuse through the lattice.

      - **Lifshitz-Slyozov-Wagner (LSW) Growth Law:** Because mass is conserved, domains cannot grow simply by local boundary movement. Solute must diffuse through the matrix from shrinking high-curvature droplets to larger low-curvature droplets (**Ostwald ripening**). The chemical potential gradient drives a diffusive flux scaling as:

      $$\frac{dL}{dt} \sim \frac{D \sigma}{L^2} \implies L(t)^3 - L(0)^3 \propto t \implies L(t) \propto t^{1/3}$$

      Mass conservation suppresses domain coarsening from $t^{1/2}$ down to $t^{1/3}$.


      ### Dynamical Scaling and Porod''s Law

      During late-stage coarsening, the domain morphology exhibits statistical self-similarity governed by the **dynamical scaling hypothesis**. The equal-time structure factor $S(k, t) = \langle |\hat{s}(\mathbf{k}, t)|^2 \rangle$ collapses onto a universal scaling function:

      $$S(k, t) = L(t)^d F(k L(t))$$

      At large wavevectors ($k L(t) \gg 1$), scattering from sharp, thin interfaces produces the universal power-law tail known as **Porod''s Law**:

      $$S(k, t) \propto \Sigma(t) k^{-(d+1)}$$

      where $\Sigma(t) \propto 1/L(t)$ is the total interfacial area per unit volume. In $d = 2$, $S(k) \propto k^{-3}$; in $d = 3$, $S(k) \propto k^{-4}$.'
