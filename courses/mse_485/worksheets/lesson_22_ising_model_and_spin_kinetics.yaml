    prompt_markdown: At the 2D Ising critical point where $\beta_c J = \frac{1}{2}\ln(1 + \sqrt{2}) \approx 0.440687$, calculate the exact bond probability $p_c = 1 - e^{-2\beta_c J}$ to 4 decimal places.
