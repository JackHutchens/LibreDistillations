  - id: q22_26_glauber_vs_kawasaki_conservation
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_spin_kinetics_coarsening_and_ripening
    prompt_markdown: What fundamental conservation constraint distinguishes Kawasaki spin kinetics from Glauber spin kinetics, and what class of physical phenomena does each model represent?
    hint_markdown: 'Compare the elementary trial move of each algorithm: flipping a single spin versus swapping two nearest-neighbor spins.'
    options:
    - id: a
      text: Kawasaki kinetics strictly conserves total magnetization M = (1/N) sum s_i (modeling diffusive mass transport and phase separation in binary alloys), whereas Glauber kinetics allows M to vary freely (modeling domain wall motion in magnetic materials).
    - id: b
      text: Kawasaki kinetics conserves total energy, whereas Glauber kinetics operates in the microcanonical ensemble.
    - id: c
      text: Glauber kinetics strictly conserves momentum, whereas Kawasaki kinetics includes hydrodynamic turbulence.
    - id: d
      text: Kawasaki dynamics is deterministic Newton's motion, whereas Glauber dynamics is stochastic Brownian motion.
    correct: a
    rationale_markdown: In Glauber dynamics, single spins flip $s_i \to -s_i$, changing total magnetization $\sum s_i$ (non-conserved Model A). In Kawasaki dynamics, trial moves swap adjacent opposite spins ($s_i \leftrightarrow s_j$), keeping the total counts of up-spins and down-spins strictly invariant (conserved Model B). This maps directly to atomic diffusion in binary alloys where species concentrations are conserved.
  - id: q22_27_allen_cahn_curvature_scaling
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_spin_kinetics_coarsening_and_ripening
    prompt_markdown: In non-conserved (Glauber / Model A) domain coarsening, what physical driving force governs the migration velocity of domain walls, and what temporal growth law $L(t)$ does it produce?
    hint_markdown: Relate interface velocity to local curvature kappa ~ 1/L, and integrate the resulting first-order differential equation for domain size L(t).
    options:
    - id: a
      text: Interface velocity is driven by local mean curvature v_n = -Gamma * sigma * kappa ~ -1/L, yielding the parabolic Lifshitz-Allen-Cahn growth law L(t) ~ t^(1/2).
    - id: b
      text: Interface velocity is driven by bulk chemical potential gradients, producing linear growth L(t) ~ t.
    - id: c
      text: Interface velocity is limited by long-range volume diffusion, producing L(t) ~ t^(1/3).
    - id: d
      text: Interface velocity is logarithmic L(t) ~ ln(t) due to random pinning impurities.
    correct: a
    rationale_markdown: In non-conserved order-parameter dynamics (Model A / Allen-Cahn), domain wall migration minimizes total interfacial area without mass conservation constraints. The normal velocity is proportional to local curvature $v_n = dL/dt \propto -\kappa \propto -1/L$. Integrating $L \, dL = C \, dt$ yields $L(t)^2 \propto t$, or $L(t) \propto t^{1/2}$.
  - id: q22_28_kawasaki_domain_growth_numeric
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_spin_kinetics_coarsening_and_ripening
    prompt_markdown: A binary alloy undergoing phase separation under conserved Kawasaki spin-exchange kinetics (Model B) is monitored during isothermal annealing. At an early observation time $t_1 = 50\text{ MCS}$, the average precipitate domain size is measured to be $L_1 = 6.0\text{ nm}$. Assuming domain growth is governed by the universal Lifshitz-Slyozov-Wagner scaling regime, calculate the expected domain size $L_2$ (in nm) at time $t_2 = 400\text{ MCS}$.
    hint_markdown: Recall the universal temporal growth power-law exponent characteristic of conserved order parameter dynamics driven by long-range diffusive transport between domains, and apply that scaling ratio between the two observation times.
    correct:
      value: 12.0
      tolerance: 0.2
    unit: nm
    rationale_markdown: Under conserved Kawasaki dynamics (Model B / Lifshitz-Slyozov-Wagner), domain growth is diffusion-limited with power law $L(t) \propto t^{1/3}$. Therefore, $\frac{L_2}{L_1} = \left(\frac{t_2}{t_1}\right)^{1/3}$. Given $t_1 = 50\text{ MCS}$ and $t_2 = 400\text{ MCS}$, the time ratio is $400 / 50 = 8.0$. Then $L_2 = 6.0\text{ nm} \times (8.0)^{1/3} = 6.0 \times 2.0 = 12.0\text{ nm}$.
  - id: q22_29_glauber_domain_growth_numeric
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_spin_kinetics_coarsening_and_ripening
    prompt_markdown: In a second experiment, a magnetic thin film is quenched below its Curie temperature and coarsens via non-conserved Glauber single-spin-flip dynamics (Model A). If the average magnetic domain diameter is measured to be $L_1 = 4.0\text{ nm}$ at $t_1 = 25\text{ MCS}$, calculate the expected domain diameter $L_2$ (in nm) at $t_2 = 225\text{ MCS}$ under the Lifshitz-Allen-Cahn curvature-driven growth regime.
    hint_markdown: Consider how the growth exponent differs when domain boundary migration is governed strictly by local interface curvature rather than mass conservation, and scale the domain size by the corresponding time ratio.
    correct:
      value: 12.0
      tolerance: 0.2
    unit: nm
    rationale_markdown: Under non-conserved Glauber dynamics (Model A / Allen-Cahn), domain growth is curvature-driven with scaling $L(t) \propto t^{1/2}$. Therefore, $\frac{L_2}{L_1} = \left(\frac{t_2}{t_1}\right)^{1/2}$. With $t_1 = 25\text{ MCS}$ and $t_2 = 225\text{ MCS}$, the ratio is $225 / 25 = 9.0$. Thus $L_2 = 4.0\text{ nm} \times (9.0)^{1/2} = 4.0 \times 3.0 = 12.0\text{ nm}$.
  - id: q22_30_ostwald_ripening_gibbs_thomson
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_spin_kinetics_coarsening_and_ripening
    prompt_markdown: Why does Ostwald ripening occur during late-stage conserved phase separation, and what thermodynamic relation establishes the chemical potential driving force?
    hint_markdown: Recall how boundary curvature affects the local equilibrium solute solubility or vapor pressure at a curved interface.
    options:
    - id: a
      text: By the Gibbs-Thomson relation mu(R) = mu_flat + 2 * gamma * Omega / R, smaller droplets have higher interfacial curvature and elevated surface chemical potential, creating a concentration gradient that drives diffusive flux toward larger droplets.
    - id: b
      text: Gravitational settling forces smaller particles to sink and aggregate onto larger particles.
    - id: c
      text: Smaller domains have lower surface-to-volume ratio, making them thermodynamically more stable.
    - id: d
      text: Kawasaki dynamics introduces an artificial mechanical pressure that squeezes small domains.
    correct: a
    rationale_markdown: The Gibbs-Thomson effect dictates that the equilibrium chemical potential at the surface of a particle of radius $R$ is $\mu(R) = \mu_\infty + \frac{(d-1)\sigma \Omega}{R}$. Small particles have higher surface curvature and greater equilibrium matrix solubility than larger particles. This establishes a concentration gradient in the matrix that drives net solute diffusion from small particles (which dissolve) to large particles (which grow), lowering the system's total interfacial free energy.
  - id: q22_31_spinodal_vs_nucleation
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_spin_kinetics_coarsening_and_ripening
    prompt_markdown: In the phase diagram of a binary mixture or Ising lattice gas below $T_c$, what thermodynamic criterion separates the metastable regime (nucleation and growth) from the spontaneously unstable regime (spinodal decomposition)?
    hint_markdown: Examine the sign of the second derivative of the local free energy density f(M) with respect to composition or magnetization.
    options:
    - id: a
      text: The spinodal line where d^2 f / dM^2 = 0; inside the spinodal (d^2 f / dM^2 < 0), the homogeneous phase is barrierlessly unstable to infinitesimal long-wavelength concentration fluctuations.
    - id: b
      text: The binodal line where chemical potentials equalize, regardless of curvature.
    - id: c
      text: The zero-entropy contour S = 0.
    - id: d
      text: The line where the latent heat of transition vanishes.
    correct: a
    rationale_markdown: 'Thermodynamic stability against continuous fluctuations requires $\frac{\partial^2 f}{\partial M^2} > 0$. The inflection curve $\frac{\partial^2 f}{\partial M^2} = 0$ defines the spinodal boundary. Between the binodal (coexistence line) and spinodal, $\frac{\partial^2 f}{\partial M^2} > 0$: the state is metastable, requiring finite nucleation droplets to overcome the interfacial free energy barrier. Inside the spinodal, $\frac{\partial^2 f}{\partial M^2} < 0$: the effective diffusion coefficient is negative ($D < 0$, ''uphill diffusion''), causing spontaneous, barrierless spinodal decomposition into interconnected bicontinuous domains.'
  - id: q22_32_porods_law_scattering
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_spin_kinetics_coarsening_and_ripening
    prompt_markdown: In X-ray or neutron scattering experiments monitoring late-stage phase separation in a $d$-dimensional material, Porod's law describes the asymptotic power-law decay of the structure factor $S(k, t)$ at high wavevectors ($k L(t) \gg 1$). What is the exact mathematical power law in spatial dimension $d$?
    hint_markdown: Consider Fourier transforming the step-discontinuity across sharp domain interfaces of dimension d-1 embedded in d-dimensional space.
    options:
    - id: a
      text: S(k, t) ~ k^(-(d + 1)), yielding k^(-3) in 2D and k^(-4) in 3D.
    - id: b
      text: S(k, t) ~ k^(-d), yielding k^(-2) in 2D and k^(-3) in 3D.
    - id: c
      text: S(k, t) ~ exp(-k^2 * L(t)^2)
    - id: d
      text: S(k, t) ~ k^(d - 1)
    correct: a
    rationale_markdown: Porod's law arises from scattering across mathematically sharp interfaces where the density or order parameter jumps discontinuously. Fourier transforming a step discontinuity across a boundary of area $\Sigma$ produces an asymptotic intensity envelope scaling as $S(k) \propto \Sigma k^{-(d+1)}$. For a 2D thin film ($d = 2$), $S(k) \propto k^{-3}$. For a 3D bulk alloy ($d = 3$), $S(k) \propto k^{-4}$.
  - id: sec_critical_slowing_down_and_cluster_mc
    type: markdown_section
    title: 6. Critical Slowing Down and Cluster Monte Carlo Algorithms
    body_markdown: '### Critical Slowing Down in Local Spin-Flip Algorithms

      Near a continuous phase transition ($T \approx T_c$), spatial correlations extend over macroscopically large domains of size $\xi \propto |T - T_c|^{-\nu}$. In standard single-spin-flip algorithms (Metropolis or Glauber), propagating information across a correlated domain requires a diffusive random walk of domain walls. Consequently, the **autocorrelation time** $\tau$ diverges as:

      $$\tau \propto \xi^z \propto |T - T_c|^{-z\nu}$$

      where $z$ is the **dynamic critical exponent**. In a finite simulation box at $T = T_c$ where $\xi \sim L$, $\tau \propto L^z$. For local single-spin-flip Metropolis in 2D, $z \approx 2.17$. Generating an independent configuration requires $\mathcal{O}(\tau)$ sweeps, so the total computational effort per independent sample scales as:

      $$\text{CPU Effort} \sim L^d \times L^z = L^{d + z} \approx L^{4.17} \quad (d = 2)$$

      Doubling the lattice size from $L = 64$ to $L = 128$ increases sampling cost by a factor of $2^{4.17} \approx 18\times$. Simulating large systems near $T_c$ with local flips is severely bottlenecked by this **critical slowing down**.


      ### The Fortuin-Kasteleyn Mapping and Swendsen-Wang Cluster Algorithm

      In 1987, Robert Swendsen and Jian-Sheng Wang solved this computational bottleneck by mapping the Ising spin model onto the **Fortuin-Kasteleyn (FK) random cluster model**. Instead of flipping single spins, correlated clusters of spins are identified and updated simultaneously.


      **Swendsen-Wang Algorithm Procedure:**

      1. **Bond Activation:** Inspect all nearest-neighbor pairs $\langle i, j \rangle$. If the spins are parallel ($s_i = s_j$), activate a virtual bond between them with probability:

      $$p = 1 - e^{-2\beta J}$$

      If the spins are antiparallel ($s_i \ne s_j$), no bond can form ($p = 0$).

      2. **Cluster Identification:** Find all connected components of sites linked by active bonds using a linear-time graph labeling algorithm (Disjoint-Set / Union-Find with path compression, or Hoshen-Kopelman).

      3. **Cluster Spin Flip:** For each connected cluster independently, pick a new spin orientation $s_{\text{cluster}} \in \{-1, +1\}$ with equal probability $1/2$ (for $h = 0$). Assign this spin orientation to all sites in that cluster.


      ### Wolff Single-Cluster Algorithm

      In 1989, Ulli Wolff introduced a single-cluster variation that avoids decomposing the entire lattice:

      1. Select a random seed site $i$ on the lattice.

      2. Recursively grow a cluster around $i$ by inspecting all neighboring sites $j$ of current cluster sites. If $s_j = s_i$ and the bond has not been tested, add site $j$ to the cluster with probability $p = 1 - e^{-2\beta J}$.

      3. Invert all spins in the cluster: $s_k \to -s_k$.


      Because large clusters have more sites, a randomly selected seed site is chosen with probability proportional to cluster size, automatically focusing computational effort where it is most needed. Cluster algorithms dramatically slash the dynamic critical exponent in 2D from $z \approx 2.17$ down to $z_{\text{SW}} \approx 0.35$ (and $z_{\text{Wolff}} \approx 0.25$), virtually eradicating critical slowing down!'
