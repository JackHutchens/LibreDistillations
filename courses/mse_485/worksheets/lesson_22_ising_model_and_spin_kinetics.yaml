  - id: q22_33_critical_slowing_down_origin
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_critical_slowing_down_and_cluster_mc
    prompt_markdown: Why does the autocorrelation time $\tau$ of local single-spin-flip Monte Carlo algorithms diverge near continuous phase transitions (critical slowing down)?
    hint_markdown: Consider how information about a spin flip propagates across a spatial distance equal to the diverging correlation length xi when updates are strictly local.
    options:
    - id: a
      text: Because spatial correlations diverge (xi ~ |T - Tc|^(-nu)); rearranging a correlated domain of size xi using local single-spin flips requires a diffusive random walk of domain walls, causing relaxation time to scale as tau ~ xi^z.
    - id: b
      text: Because the pseudorandom number generator runs out of entropy at Tc.
    - id: c
      text: Because the acceptance probability of single spin flips drops to zero.
    - id: d
      text: Because the system runs out of accessible microstates.
    correct: a
    rationale_markdown: Near $T_c$, spins are correlated over distances of order $\xi$. Flipping an entire correlated region using single-spin updates requires nucleating, diffusing, and sweeping domain boundaries across the cluster. Because domain wall propagation is diffusive, the time required scales as $\tau \sim \xi^z$, where $z \approx 2.17$ in 2D. As $\xi \to \infty$, consecutive Monte Carlo samples become highly correlated, requiring millions of sweeps per independent sample.
  - id: q22_34_fk_critical_bond_probability_numeric
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_critical_slowing_down_and_cluster_mc
    prompt_markdown: In the Fortuin-Kasteleyn representation underlying the Swendsen-Wang and Wolff cluster algorithms, adjacent parallel spins are dynamically connected by bonds with probability $p = 1 - e^{-2\beta J}$. At the exact 2D square-lattice critical coupling where $\sinh(2\beta_c J) = 1$, calculate the numerical value of the critical bond activation probability $p_c$ to 4 decimal places.
    hint_markdown: Relate exp(-2*beta_c*J) to the algebraic value of exp(2*beta_c*J) obtained from the critical hyperbolic condition sinh(2*beta_c*J) = 1, and evaluate the resulting bond activation probability.
    correct:
      value: 0.5858
      tolerance: 0.002
    rationale_markdown: From $\sinh(2\beta_c J) = 1$, we have $\frac{1}{2}(e^{2\beta_c J} - e^{-2\beta_c J}) = 1$. Let $x = e^{2\beta_c J} > 1$. Then $x - 1/x = 2 \implies x^2 - 2x - 1 = 0$, giving $x = 1 + \sqrt{2}$. Then $e^{-2\beta_c J} = \frac{1}{1 + \sqrt{2}} = \sqrt{2} - 1$. The critical bond probability is $p_c = 1 - e^{-2\beta_c J} = 1 - (\sqrt{2} - 1) = 2 - \sqrt{2} \approx 0.585786 \approx 0.5858$.
  - id: q22_35_swendsen_wang_spin_assignment
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_critical_slowing_down_and_cluster_mc
    prompt_markdown: In the Swendsen-Wang algorithm, once all connected clusters have been identified via active Fortuin-Kasteleyn bonds at zero external field ($h = 0$), how is the new spin configuration generated?
    hint_markdown: Consider how global discrete Z_2 symmetry applies independently to each disconnected subgraph in the random cluster representation.
    options:
    - id: a
      text: For each connected cluster independently, a new collective spin orientation (+1 or -1) is chosen with equal probability 1/2 and assigned to all sites in that cluster.
    - id: b
      text: All clusters are inverted deterministically to their opposite orientation.
    - id: c
      text: Only the single largest cluster is flipped, while all smaller clusters retain their old spins.
    - id: d
      text: Spins inside clusters are randomized site-by-site without regard to cluster connectivity.
    correct: a
    rationale_markdown: In the Fortuin-Kasteleyn representation, all spin configurations compatible with a given bond configuration have identical Boltzmann weights. Because disconnected clusters share no active bonds, their orientations are mutually independent. Setting each cluster's collective orientation to $+1$ or $-1$ with equal probability $1/2$ satisfies detailed balance and ergodicity while updating the entire lattice in a single global step.
  - id: q22_36_wolff_seed_selection_bias
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_critical_slowing_down_and_cluster_mc
    prompt_markdown: Why is the Wolff single-cluster algorithm often more efficient in practice than the full Swendsen-Wang multi-cluster algorithm?
    hint_markdown: Consider how picking a single random lattice site as a seed affects the probability that a cluster of size C is selected for growth and flipping.
    options:
    - id: a
      text: Selecting a random seed site automatically selects clusters with probability proportional to their size C / N, focusing computational effort on flipping large, dominant clusters while avoiding the overhead of decomposing tiny 1-site clusters in disordered regions.
    - id: b
      text: Wolff algorithm does not require calculating the bond probability p.
    - id: c
      text: Wolff algorithm operates entirely without random numbers.
    - id: d
      text: Wolff algorithm completely avoids cluster recursion.
    correct: a
    rationale_markdown: In Swendsen-Wang, decomposing the entire lattice requires identifying thousands of tiny 1-site and 2-site clusters, which contributes little to reducing critical correlation time. Wolff selects a single seed site uniformly at random; because a cluster of size $C$ contains $C$ sites, the probability of selecting that cluster is $C / N$. This built-in importance sampling naturally focuses updates on large, critically correlated clusters, achieving $z_{\text{Wolff}} \approx 0.25$ with lower per-step computational overhead.
  - id: q22_37_cluster_speedup_numeric
    type: problem
    question_type: numeric
    difficulty: hard
    taught_by: sec_critical_slowing_down_and_cluster_mc
    prompt_markdown: In a 2D Ising simulation performed directly at the critical point $T_c$, single-spin Metropolis dynamics exhibits an autocorrelation time scaling as $\tau_{\text{local}} \sim L^{z_{\text{local}}}$ with $z_{\text{local}} \approx 2.17$, while the Swendsen-Wang cluster algorithm exhibits $\tau_{\text{SW}} \sim L^{z_{\text{SW}}}$ with $z_{\text{SW}} \approx 0.35$. On a lattice of linear size $L = 64$, calculate the theoretical algorithmic speedup ratio $\tau_{\text{local}} / \tau_{\text{SW}}$ in autocorrelation time.
    hint_markdown: Express the speedup ratio as a power of the lattice dimension using the difference between the two dynamic critical exponents.
    correct:
      value: 1940.0
      tolerance: 80.0
    rationale_markdown: The speedup ratio scales as $\frac{\tau_{\text{local}}}{\tau_{\text{SW}}} = L^{z_{\text{local}} - z_{\text{SW}}} = L^{2.17 - 0.35} = L^{1.82}$. For $L = 64 = 2^6$, we evaluate $64^{1.82} = (2^6)^{1.82} = 2^{10.92} = 2^{10} \times 2^{0.92} = 1024 \times 1.8921 \approx 1937.5 \approx 1940$. The cluster algorithm generates statistically independent configurations nearly 2,000 times faster on a $64 \times 64$ grid!
  - id: q22_38_cluster_algorithm_limitations
    type: problem
    question_type: multi_select
    difficulty: hard
    taught_by: sec_critical_slowing_down_and_cluster_mc
    prompt_markdown: Under which physical conditions do the Swendsen-Wang and Wolff cluster algorithms LOSE their immense efficiency advantage over local Metropolis sampling? *(Select all that apply.)*
    hint_markdown: Consider how the presence of external magnetic fields or competing frustrated interactions affects cluster growth and the cluster acceptance/flip criteria.
    options:
    - id: a
      text: In the presence of a strong external magnetic field h != 0, where clusters grow to encompass the entire box and collective flips are heavily penalized by the Zeeman energy.
    - id: b
      text: In geometrically frustrated systems (e.g., antiferromagnets on triangular lattices or spin glasses) with competing positive and negative exchange bonds.
    - id: c
      text: In standard zero-field ferromagnetic models near Tc.
    - id: d
      text: When measuring the Binder cumulant at the crossing point.
    correct:
    - a
    - b
    rationale_markdown: Swendsen-Wang and Wolff rely fundamentally on global $\mathbb{Z}_2$ symmetry and unfrustrated ferromagnetic coupling. When $h \ne 0$, cluster flips must be accepted or rejected based on the change in Zeeman energy, which scales with cluster volume and causes rejection rates to approach 100%. In frustrated systems (spin glasses, triangular AFM), competing couplings cannot be satisfied simultaneously, leading to percolation of clusters that lock the system rather than decorrelating it.
  - id: q22_39_union_find_complexity
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_critical_slowing_down_and_cluster_mc
    prompt_markdown: What data structure and algorithm is standardly used to identify all connected components in Swendsen-Wang in near-linear time $\mathcal{O}(N \alpha(N))$, where $\alpha$ is the inverse Ackermann function?
    hint_markdown: Recall the classic disjoint-set forest data structure equipped with union-by-rank and path compression heuristics.
    options:
    - id: a
      text: Disjoint-Set (Union-Find) with path compression and union-by-rank, or the Hoshen-Kopelman algorithm.
    - id: b
      text: Dijkstra's single-source shortest path algorithm using a Fibonacci heap.
    - id: c
      text: Floyd-Warshall all-pairs shortest path matrix decomposition.
    - id: d
      text: Fast Fourier Transform spectral clustering.
    correct: a
    rationale_markdown: Identifying connected clusters formed by active bonds is equivalent to computing connected components of a random graph. The Disjoint-Set (Union-Find) data structure with path compression and union-by-rank, as well as the Hoshen-Kopelman algorithm, processes all $N$ sites and $zN/2$ bonds in nearly linear $\mathcal{O}(N \alpha(N))$ time, where $\alpha(N) \le 4$ for all physically realizable universe sizes.
  - id: q22_40_fortuin_kasteleyn_percolation_mapping
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_critical_slowing_down_and_cluster_mc
    prompt_markdown: What is the mathematical connection between the Fortuin-Kasteleyn random cluster representation of the Ising model and standard random bond percolation?
    hint_markdown: Notice that when the number of states q in the Potts/random-cluster model is taken to q = 1, the cluster weight simplifies to uncorrelated bond probabilities.
    options:
    - id: a
      text: The Ising model corresponds to the q = 2 random cluster model where each connected component carries a statistical weight factor of 2, whereas standard uncorrelated percolation corresponds to the mathematical limit q -> 1.
    - id: b
      text: Standard percolation only occurs in one dimension, whereas the Ising model only exists in two dimensions.
    - id: c
      text: The Ising model and percolation are completely unrelated and share no mathematical similarities.
    - id: d
      text: Fortuin-Kasteleyn mapping replaces spins with continuous Gaussian random walks.
    correct: a
    rationale_markdown: The Fortuin-Kasteleyn transformation maps the general $q$-state Potts model (with $q = 2$ being the Ising model) onto a random cluster representation where a configuration of active bonds $G$ has probability weight $W(G) = p^{|E(G)|}(1-p)^{|B|-|E(G)|} q^{C(G)}$, where $C(G)$ is the number of connected clusters. For the Ising model ($q = 2$), each cluster contributes a factor of 2 (up or down). When $q \to 1$, the cluster factor $q^{C(G)} = 1$ drops out, recovering standard uncorrelated random bond percolation.
  - id: q22_41_porod_law_scattering_tail
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_spin_kinetics_coarsening_and_ripening
    prompt_markdown: In a phase-separating mixture or coarsening Ising domain structure characterized by sharp, smooth spatial interfaces, how does the high-wavevector tail of the spherically averaged structure factor $S(k, t)$ decay with wavenumber $k$ in $d$ spatial dimensions (Porod's law)?
    hint_markdown: Consider the Fourier transform of a spatial correlation function across an abrupt step-discontinuity interface of finite total surface area.
    options:
    - id: a
      text_markdown: $S(k, t) \propto k^{-(d+1)}$ as $k \to \infty$
      text: $S(k, t) \propto k^{-(d+1)}$ as $k \to \infty$
    - id: b
      text_markdown: $S(k, t) \propto k^{-(d-1)}$ as $k \to \infty$
      text: $S(k, t) \propto k^{-(d-1)}$ as $k \to \infty$
    - id: c
      text_markdown: $S(k, t) \propto e^{-k^2 \xi^2}$ as $k \to \infty$
      text: $S(k, t) \propto e^{-k^2 \xi^2}$ as $k \to \infty$
    - id: d
      text_markdown: $S(k, t) \propto k^{-d/2}$ as $k \to \infty$
      text: $S(k, t) \propto k^{-d/2}$ as $k \to \infty$
    correct: a
    rationale_markdown: Porod's law states that scattering from sharp, thin interfaces of area per unit volume $\Sigma$ produces an asymptotic high-$k$ power-law tail $S(k, t) \propto \Sigma k^{-(d+1)}$. In $d=2$ dimensions this yields $k^{-3}$, whereas in $d=3$ it yields $k^{-4}$. A faster exponential decay would correspond to diffuse, Gaussian-smoothed interfaces.
  - id: q22_42_metropolis_autocorrelation_scaling_numeric
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_critical_slowing_down_and_cluster_mc
    prompt_markdown: In a 2D Ising simulation right at the critical temperature $T_c$ using local single-spin Metropolis updates ($z = 2.17$), the integrated autocorrelation time for a lattice of linear dimension $L = 64$ is measured to be $\tau = 10,000\text{ sweeps}$. Based on dynamical finite-size scaling, predict the autocorrelation time in sweeps when the lattice size is doubled to $L = 128$. *(Round to the nearest 1000 sweeps.)*
    hint_markdown: Scale the baseline autocorrelation time by the system dimension expansion ratio raised to the dynamical critical exponent.
    correct: 45000.0
    tolerance: 1000.0
    rationale_markdown: At the critical point where the bulk correlation length is cut off by the system boundaries ($\xi \sim L$), the autocorrelation time diverges as $\tau(L) \propto L^z$. Doubling the linear dimension yields $\tau(128) = \tau(64) \times (128 / 64)^{2.17} = 10,000 \times 2^{2.17} \approx 10,000 \times 4.5002 \approx 45,000\text{ sweeps}$.
