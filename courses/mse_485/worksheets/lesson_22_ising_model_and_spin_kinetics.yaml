worksheet:
  id: lesson_22_ising_model_and_spin_kinetics
  title: 'MSE 485 · Lesson 22: The Ising Model — Exact Solutions, Phase Transitions, Spin Kinetics & Cluster Monte Carlo'
  estimated_minutes: 120
  learning_objectives:
  - Formulate the Ising Hamiltonian, prove discrete Z_2 spin-inversion symmetry, and derive exact isomorphisms to lattice gases (liquid-gas coexistence) and binary alloys (order-disorder transitions).
  - Solve the 1D Ising chain using the transfer matrix method, calculate the spin-spin correlation function, and apply the Peierls kink argument to prove the absence of finite-temperature phase transitions in 1D.
  - Analyze Onsager's exact 2D square-lattice solution, Kramers-Wannier duality, the critical temperature k_B T_c / J, and the 2D critical exponents governing spontaneous magnetization, susceptibility, and specific heat.
  - Investigate the finite-size order parameter distribution P_L(M), quantify the interfacial free energy barrier Delta F = 2 sigma L^(d-1), and apply Binder cumulant crossings to locate critical points.
  - Differentiate non-conserved Glauber dynamics (Model A, curvature-driven domain growth) from conserved Kawasaki dynamics (Model B, diffusion-limited spinodal decomposition and Ostwald ripening).
  - Quantify critical slowing down tau ~ xi^z, derive the Fortuin-Kasteleyn random cluster representation, and implement non-local Swendsen-Wang and Wolff cluster Monte Carlo algorithms.
  sections:
  - id: sec_ising_hamiltonian_and_mappings
    type: markdown_section
    title: 1. The Ising Hamiltonian, Global Z_2 Symmetry, Lattice Gases, and Binary Alloys
    body_markdown: 'The Ising model represents discrete scalar degrees of freedom (magnetic moments or atomic species) residing on the sites of a $d$-dimensional crystal lattice. Each site $i \in \{1, 2, \dots, N\}$ carries a spin variable $s_i \in \{-1, +1\}$. In the presence of a uniform external magnetic field $h$, the total energy of a configuration $\{s_i\}$ is governed by the Hamiltonian:

      $$\mathcal{H}(\{s_i\}) = -J \sum_{\langle i, j \rangle} s_i s_j - h \sum_{i=1}^N s_i$$

      where $\langle i, j \rangle$ denotes a sum over all distinct nearest-neighbor pairs, and $J$ is the exchange coupling constant. When $J > 0$, neighboring spins lower their energy by aligning parallel (ferromagnetism); when $J < 0$, antiparallel alignment is favored (antiferromagnetism).


      ### Global Discrete Symmetry and Spontaneous Symmetry Breaking

      In the absence of an external field ($h = 0$), the Hamiltonian is invariant under the global spin inversion operation:

      $$s_i \to -s_i \quad \forall i \in \{1, \dots, N\} \implies \mathcal{H}(\{-s_i\}) = \mathcal{H}(\{s_i\})$$

      This invariance constitutes a discrete $\mathbb{Z}_2$ symmetry. At high temperatures ($T > T_c$), thermal fluctuations preserve this symmetry in the thermodynamic limit, producing zero net magnetization:

      $$\langle M \rangle = \frac{1}{N}\sum_{i=1}^N \langle s_i \rangle = 0$$

      Below a critical temperature $T_c$ (for dimensions $d \ge 2$), the system undergoes **spontaneous symmetry breaking**, collapsing into one of two degenerate macroscopic phases characterized by non-zero spontaneous magnetization $\pm M_0(T)$.


      ### Isomorphism 1: The Lattice Gas (Liquid-Gas Coexistence)

      The Ising model maps rigorously onto a classical lattice model of a simple fluid. Let site $i$ have occupation number $n_i \in \{0, 1\}$, where $n_i = 1$ denotes the presence of a fluid molecule and $n_i = 0$ denotes an empty site (vacancy). Multiple occupancy is prohibited by hard-core exclusion. If neighboring occupied sites experience an attractive dispersion well $-\epsilon$ ($\epsilon > 0$) and the system is held at chemical potential $\mu$, the grand canonical Hamiltonian is:

      $$\mathcal{H}_{\text{LG}} = -\epsilon \sum_{\langle i, j \rangle} n_i n_j - \mu \sum_{i=1}^N n_i$$

      Applying the linear coordinate transformation $s_i = 2n_i - 1 \iff n_i = \frac{1 + s_i}{2}$ maps $\mathcal{H}_{\text{LG}}$ directly onto the Ising Hamiltonian with parameters:

      $$J = \frac{\epsilon}{4}, \qquad h = \frac{\mu - \mu_0}{2}, \qquad \mu_0 = -\frac{z\epsilon}{2}$$

      where $z$ is the lattice coordination number. The magnetic transition at $h = 0$ corresponds to liquid-gas phase coexistence along the saturation line $\mu = \mu_0$. The spontaneous magnetization $M$ directly represents the density discontinuity across the first-order liquid-gas coexistence curve:

      $$\rho - \rho_c = \frac{1}{2} M, \qquad \rho_c = \frac{1}{2}$$


      ### Isomorphism 2: Binary Alloys (Order-Disorder Transitions)

      In a crystalline binary alloy comprising atomic species $A$ and $B$ (such as Cu-Au or Fe-Al), let $s_i = +1$ represent an $A$ atom and $s_i = -1$ represent a $B$ atom on site $i$. The nearest-neighbor interaction energies are $V_{AA}$, $V_{BB}$, and $V_{AB}$. The configurational energy is isomorphic to the Ising model with effective exchange parameter:

      $$J = \frac{1}{4}(2 V_{AB} - V_{AA} - V_{BB})$$

      - If $J < 0$ (i.e., $2 V_{AB} > V_{AA} + V_{BB}$), like bonds ($A-A$ and $B-B$) are energetically favored, driving low-temperature **phase separation** (clustering/precipitation) into $A$-rich and $B$-rich domains.

      - If $J > 0$ (i.e., $2 V_{AB} < V_{AA} + V_{BB}$), unlike bonds ($A-B$) are energetically favored, driving low-temperature **chemical ordering** into an interpenetrating superlattice (antiferromagnetic order).'
  - id: q22_01_sublattice_gauge_transformation
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_ising_hamiltonian_and_mappings
    prompt_markdown: Consider an antiferromagnetic Ising model with coupling $J_{\text{AFM}} = -J < 0$ on a bipartite lattice (e.g., a simple cubic or square lattice) partitioned into interpenetrating sublattices $\mathcal{A}$ and $\mathcal{B}$, in zero external magnetic field. Which exact local transformation maps this antiferromagnet onto an equivalent ferromagnetic Ising Hamiltonian with coupling $+J$?
    hint_markdown: 'Examine the topology of a bipartite graph: every nearest-neighbor bond connects a site in one sublattice to a site in the other sublattice. Consider how an operation acting exclusively on one sublattice alters the sign of each nearest-neighbor product.'
    options:
    - id: a
      text: 'A sublattice spin-inversion gauge transformation: invert all spins on sublattice B (s_j -> -s_j for j in B) while keeping spins on sublattice A unchanged.'
    - id: b
      text: 'A global uniform spin inversion: invert every spin on the entire lattice simultaneously (s_i -> -s_i for all i).'
    - id: c
      text: A 90-degree spatial rotation of the lattice coordinate axes that transposes nearest neighbors into next-nearest neighbors.
    - id: d
      text: 'An imaginary Wick rotation of the temperature variable: beta -> i * beta.'
    correct: a
    rationale_markdown: 'On a bipartite lattice, every nearest-neighbor pair $\langle i, j \rangle$ connects site $i \in \mathcal{A}$ to site $j \in \mathcal{B}$. Under the sublattice gauge transformation $s_i \to s_i$ for $i \in \mathcal{A}$ and $s_j \to -s_j$ for $j \in \mathcal{B}$, every bond product changes sign: $s_i s_j \to -s_i s_j$. The interaction term becomes $-(-J) \sum_{\langle i, j \rangle} (-s_i s_j) = -J \sum_{\langle i, j \rangle} s_i s_j$, mapping the antiferromagnet exactly onto a ferromagnet with coupling $+J$ at $h = 0$.'
  - id: q22_02_geometric_frustration
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_ising_hamiltonian_and_mappings
    prompt_markdown: If the same nearest-neighbor antiferromagnetic Ising interaction ($J < 0$) is placed on a triangular lattice rather than a square lattice, the bipartite sublattice mapping fails completely, leading to geometric frustration. What is the fundamental physical consequence of this frustration on the $T = 0$ ground state?
    hint_markdown: Attempt to assign discrete binary spin values to the three vertices of a single elementary triangle such that every edge simultaneously minimizes the antiferromagnetic exchange energy, and consider the multiplicity of configurations.
    options:
    - id: a
      text: The ground state possesses extensive macroscopic degeneracy, resulting in non-zero residual entropy S_0 > 0 at absolute zero and suppressing conventional long-range Néel order.
    - id: b
      text: The system collapses into a unique collinear ferromagnetic state to minimize total bond strain.
    - id: c
      text: The critical temperature Tc shifts to infinity because triangular loops amplify thermal correlations.
    - id: d
      text: The discrete Z_2 symmetry is dynamically broken into continuous SU(2) gauge symmetry.
    correct: a
    rationale_markdown: On an elementary triangular plaquette, it is mathematically impossible to arrange three binary spins ($s_i = \pm 1$) such that all three adjacent pairs are simultaneously antiparallel. At least one bond per triangle is frustrated (satisfied only by parallel alignment). As Gregory Wannier proved in 1950, this competition yields an extensive ground-state degeneracy with non-zero residual zero-point entropy $S_0 / (N k_B) \approx 0.323$, preventing conventional magnetic ordering down to absolute zero.
  - id: q22_03_lattice_gas_coexistence_chemical_potential
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_ising_hamiltonian_and_mappings
    prompt_markdown: In the lattice gas mapping, fluid molecules occupy lattice sites with attractive nearest-neighbor interaction $-\epsilon$ and chemical potential $\mu$. Liquid-gas phase coexistence at temperatures below the critical point corresponds to the zero-field line ($h = 0$) in the Ising ferromagnet. What is the analytical value of the coexistence chemical potential $\mu_0$ on a lattice with coordination number $z$?
    hint_markdown: Substitute the spin transformation into the lattice gas grand canonical energy expression and identify the linear single-site term that corresponds to the external Zeeman field h in the Ising Hamiltonian.
    options:
    - id: a
      text: mu_0 = -z * epsilon / 2
    - id: b
      text: mu_0 = -z * epsilon
    - id: c
      text: mu_0 = +z * epsilon / 4
    - id: d
      text: mu_0 = 0
    correct: a
    rationale_markdown: Expressing $n_i = (1 + s_i)/2$ in $\mathcal{H}_{\text{LG}} = -\epsilon \sum_{\langle i, j \rangle} n_i n_j - \mu \sum_i n_i$ gives the pairwise term $-\frac{\epsilon}{4}\sum (1 + s_i + s_j + s_i s_j)$. Summing over all $N z / 2$ bonds, each site appears in $z$ bonds, producing a linear spin coefficient of $-\frac{z\epsilon}{4} - \frac{\mu}{2}$. Matching this to the Ising field term $-h s_i$ yields $h = \frac{1}{2}(\mu + \frac{z\epsilon}{2})$. Setting $h = 0$ identifies the coexistence chemical potential as $\mu_0 = -\frac{z\epsilon}{2}$.
  - id: q22_04_binary_alloy_ordering_condition
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_ising_hamiltonian_and_mappings
    prompt_markdown: In a crystalline binary alloy with nearest-neighbor bond energies $V_{AA}$, $V_{BB}$, and $V_{AB}$, the configurational energy maps to an Ising model with effective exchange parameter $J = \frac{1}{4}(2 V_{AB} - V_{AA} - V_{BB})$. Which thermodynamic behavior occurs when $2 V_{AB} < V_{AA} + V_{BB}$ at low temperatures?
    hint_markdown: Evaluate the sign of the effective coupling parameter J under this inequality, and consider whether bonds between like atoms or bonds between unlike atoms are energetically preferred.
    options:
    - id: a
      text: The alloy forms an ordered interpenetrating superlattice (chemical ordering) because unlike A-B pairs have lower energy than like A-A and B-B pairs.
    - id: b
      text: The alloy phase-separates into macroscopic A-rich and B-rich domains (miscibility gap) because like pairs are energetically favored.
    - id: c
      text: The alloy remains an ideal random solid solution down to absolute zero with zero heat of mixing.
    - id: d
      text: The lattice becomes mechanically unstable and undergoes a martensitic shear collapse.
    correct: a
    rationale_markdown: When $2 V_{AB} < V_{AA} + V_{BB}$, the reaction $A-A + B-B \to 2 A-B$ is exothermic ($\Delta V < 0$), meaning heteronuclear $A-B$ bonds are energetically favored over homonuclear bonds. In the Ising mapping, this corresponds to $J > 0$ (antiferromagnetic-like atomic ordering when spins represent species alternation), driving the formation of an ordered superlattice (e.g., CuAu or CsCl-type ordering).
  - id: q22_05_ground_state_energy_numeric
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_ising_hamiltonian_and_mappings
    prompt_markdown: A square-lattice Ising ferromagnet containing $N = 250$ sites with periodic boundary conditions has nearest-neighbor exchange coupling $J = 2.4\text{ meV}$ and zero external magnetic field. Determine the total ground state energy $E_{\text{ground}}$ in meV when all spins are fully aligned.
    hint_markdown: Consider how many total nearest-neighbor bonds exist on a square lattice with periodic boundaries where each site has four nearest neighbors, and account for the energy contributed by each parallel bond.
    correct:
      value: -1200.0
      tolerance: 1.0
    unit: meV
    rationale_markdown: On a square lattice with periodic boundary conditions, each site has coordination number $z = 4$. Because each bond connects 2 sites, the total number of distinct nearest-neighbor pairs is $N_{\text{bonds}} = \frac{1}{2} z N = \frac{1}{2}(4)(250) = 500$. In the fully aligned ground state, $s_i s_j = (+1)(+1) = +1$ for every bond. The total energy is $E_{\text{ground}} = -J N_{\text{bonds}} = -2.4\text{ meV} \times 500 = -1200.0\text{ meV}$.
  - id: q22_06_single_spin_flip_energy_numeric
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_ising_hamiltonian_and_mappings
    prompt_markdown: For the ferromagnet in the preceding problem ($N = 250$, $J = 2.4\text{ meV}$, square lattice), starting from the fully aligned ground state, a single spin in the interior of the crystal is flipped antiparallel to its neighbors. Calculate the resulting change in system energy $\Delta E$ in meV.
    hint_markdown: Identify how many nearest-neighbor bonds have their relative spin alignment altered by flipping one interior spin, and evaluate the difference in bond energy between an antiparallel pair and a parallel pair.
    correct:
      value: 19.2
      tolerance: 0.2
    unit: meV
    rationale_markdown: Flipping a single site $k$ affects exactly its $z = 4$ nearest-neighbor bonds. Before the flip, each bond contributed $-J$ to the energy; after the flip, each bond has antiparallel spins and contributes $+J$. The change per bond is $+J - (-J) = +2J$. For $z = 4$ bonds, the net energy change is $\Delta E = 2 z J = 2(4)(2.4\text{ meV}) = 19.2\text{ meV}$.
  - id: q22_07_lattice_gas_compressibility_relation
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_ising_hamiltonian_and_mappings
    prompt_markdown: Under the lattice gas isomorphism, how does the isothermal compressibility $\kappa_T = -\frac{1}{V}\left(\frac{\partial V}{\partial P}\right)_T = \frac{1}{\rho^2}\left(\frac{\partial \rho}{\partial \mu}\right)_T$ of the fluid behave as the liquid-gas critical point is approached along the critical isochore?
    hint_markdown: Relate the density derivative with respect to chemical potential to the magnetic susceptibility chi_T = (partial M / partial h)_T in the Ising model, and recall the behavior of magnetic susceptibility at second-order phase transitions.
    options:
    - id: a
      text: It diverges to infinity with critical exponent gamma, mirroring the divergence of the magnetic susceptibility chi_T in the Ising ferromagnet.
    - id: b
      text: It drops discontinuously to zero because liquid and vapor densities equalize.
    - id: c
      text: It remains strictly constant and equal to 1 / (rho_c * k_B * T).
    - id: d
      text: It develops an imaginary component associated with mechanical cavitation.
    correct: a
    rationale_markdown: In the lattice gas mapping, fluid density is $\rho = \frac{1}{2}(1 + M)$ and chemical potential is related to magnetic field by $d\mu = 2 dh$. Differentiating gives $\left(\frac{\partial \rho}{\partial \mu}\right)_T = \frac{1}{4}\left(\frac{\partial M}{\partial h}\right)_T = \frac{1}{4}\chi_T$. Because the isothermal compressibility is proportional to $\left(\frac{\partial \rho}{\partial \mu}\right)_T$, $\kappa_T$ diverges near the critical point as $|T - T_c|^{-\gamma}$. This massive density fluctuation divergence is the physical origin of **critical opalescence**.
  - id: sec_exact_solutions_and_transfer_matrix
    type: markdown_section
    title: '2. Exact Solutions: The 1D Transfer Matrix and Non-Existence of 1D Phase Transitions'
    body_markdown: '### The 1D Ising Chain and the Transfer Matrix Method

      Consider a linear chain of $N$ spins with periodic boundary conditions ($s_{N+1} = s_1$) in a uniform field $h$. The Hamiltonian is:

      $$\mathcal{H} = -J \sum_{i=1}^N s_i s_{i+1} - \frac{h}{2} \sum_{i=1}^N (s_i + s_{i+1})$$

      The canonical partition function factorizes over the bonds:

      $$Z_N = \sum_{s_1=\pm 1} \dots \sum_{s_N=\pm 1} \prod_{i=1}^N T(s_i, s_{i+1}) = \text{Tr}\left(\mathbf{T}^N\right)$$

      where $\mathbf{T}$ is the $2 \times 2$ **transfer matrix** with elements $T(s, s'') = \exp\left[\beta J s s'' + \frac{1}{2}\beta h (s + s'')\right]$:

      $$\mathbf{T} = \begin{pmatrix} e^{\beta(J + h)} & e^{-\beta J} \\ e^{-\beta J} & e^{\beta(J - h)} \end{pmatrix}$$

      In zero external field ($h = 0$), the eigenvalues are found from $\det(\mathbf{T} - \lambda \mathbf{I}) = 0$:

      $$\lambda_1 = 2\cosh(\beta J), \qquad \lambda_2 = 2\sinh(\beta J)$$

      Since $\beta J > 0$, $\lambda_1 > \lambda_2 > 0$ strictly for all finite temperatures ($T > 0$). In the thermodynamic limit ($N \to \infty$), the partition function and free energy per spin are determined entirely by the largest eigenvalue:

      $$f(T, 0) = -\lim_{N \to \infty} \frac{k_B T}{N} \ln Z_N = -k_B T \ln \lambda_1 = -k_B T \ln(2\cosh\beta J)$$


      ### Spin-Spin Correlation Function and Correlation Length

      The zero-field spin-spin correlation function between two sites separated by distance $r$ lattice units is computed by inserting Pauli $\sigma_z$ operators into the trace:

      $$\langle s_i s_{i+r} \rangle = \frac{\lambda_1^{N-r} \lambda_2^r + \lambda_2^{N-r} \lambda_1^r}{\lambda_1^N + \lambda_2^N} \xrightarrow{N \to \infty} \left(\frac{\lambda_2}{\lambda_1}\right)^r = (\tanh\beta J)^r$$

      Writing this in the standard exponential decay form $\langle s_i s_{i+r} \rangle = \exp(-r / \xi)$ yields the exact correlation length:

      $$\xi(T) = -\frac{1}{\ln(\tanh\beta J)}$$

      At low temperatures ($T \to 0$, $\beta J \to \infty$), $\tanh(\beta J) \approx 1 - 2e^{-2\beta J}$, giving $\xi(T) \approx \frac{1}{2} e^{2\beta J}$. The correlation length diverges only at $T = 0$, confirming that long-range order cannot persist at any non-zero temperature in one dimension.


      ### The Peierls Kink (Domain Wall) Argument in 1D

      Why can no 1D system with short-range interactions order at $T > 0$? Consider a fully aligned ferromagnetic ground state ($s_i = +1$ for all $i$). Inserting a single domain wall (kink) that flips all spins to the right of position $k$ into $s_i = -1$ disrupts exactly one nearest-neighbor bond:

      - **Energetic Cost:** $\Delta E = 2J$ (a finite, constant energy independent of system size $N$).

      - **Entropic Gain:** The domain wall can be placed between any of the $N$ pairs of adjacent sites. The configurational entropy is $\Delta S = k_B \ln N$.

      - **Free Energy Change:**

      $$\Delta F = \Delta E - T \Delta S = 2J - k_B T \ln N$$

      For any temperature $T > 0$, as $N \to \infty$, the entropic term $-k_B T \ln N \to -\infty$ completely overwhelms the finite energetic barrier $\Delta E = 2J$. Therefore, domain walls spontaneously proliferate at any non-zero temperature, destroying long-range order.'
  - id: q22_08_transfer_matrix_eigenvalues
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_exact_solutions_and_transfer_matrix
    prompt_markdown: In the transfer matrix solution of the 1D Ising model with periodic boundary conditions, why does the free energy per spin $f(T) = -k_B T \lim_{N \to \infty} \frac{1}{N}\ln Z_N$ depend exclusively on the largest eigenvalue $\lambda_1$ in the thermodynamic limit?
    hint_markdown: Factor lambda_1^N out of the partition function expression Z_N = lambda_1^N + lambda_2^N and examine the behavior of the remaining term as N approaches infinity.
    options:
    - id: a
      text: Because factoring Z_N = lambda_1^N [1 + (lambda_2 / lambda_1)^N] reveals that (lambda_2 / lambda_1)^N vanishes exponentially as N -> infinity when lambda_1 > lambda_2.
    - id: b
      text: Because the trace of a matrix is mathematically identical to its largest eigenvalue.
    - id: c
      text: Because the second eigenvalue lambda_2 is strictly zero at all temperatures.
    - id: d
      text: Because quantum tunneling forces all lower eigenstates to collapse.
    correct: a
    rationale_markdown: The partition function is $Z_N = \text{Tr}(\mathbf{T}^N) = \lambda_1^N + \lambda_2^N = \lambda_1^N \left[1 + \left(\frac{\lambda_2}{\lambda_1}\right)^N\right]$. Taking $\frac{1}{N}\ln Z_N = \ln \lambda_1 + \frac{1}{N}\ln\left[1 + \left(\frac{\lambda_2}{\lambda_1}\right)^N\right]$. Since $\lambda_1 > \lambda_2$, the ratio $\frac{\lambda_2}{\lambda_1} < 1$, so $\left(\frac{\lambda_2}{\lambda_1}\right)^N \to 0$ exponentially as $N \to \infty$. The correction to the free energy scales as $\mathcal{O}\left(\frac{1}{N}\right)$, making $f(T) = -k_B T \ln \lambda_1$ exact in the thermodynamic limit.
  - id: q22_09_correlation_function_eigenvalue_ratio
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_exact_solutions_and_transfer_matrix
    prompt_markdown: For the zero-field 1D Ising chain, the spin-spin correlation function between two spins separated by $r$ lattice sites is $\langle s_i s_{i+r} \rangle = (\lambda_2 / \lambda_1)^r$. In terms of the exchange coupling $J$ and temperature $T$, what is the exact algebraic ratio $\lambda_2 / \lambda_1$?
    hint_markdown: Evaluate the ratio of the two zero-field eigenvalues lambda_2 = 2 sinh(beta J) and lambda_1 = 2 cosh(beta J).
    options:
    - id: a
      text: tanh(beta * J)
    - id: b
      text: coth(beta * J)
    - id: c
      text: exp(-2 * beta * J)
    - id: d
      text: sech(beta * J)
    correct: a
    rationale_markdown: The zero-field eigenvalues of the transfer matrix are $\lambda_1 = 2\cosh(\beta J)$ and $\lambda_2 = 2\sinh(\beta J)$. Their ratio is simply $\frac{\lambda_2}{\lambda_1} = \frac{2\sinh(\beta J)}{2\cosh(\beta J)} = \tanh(\beta J)$.
  - id: q22_10_correlation_length_numeric
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_exact_solutions_and_transfer_matrix
    prompt_markdown: For a 1D Ising chain in zero magnetic field governed by nearest-neighbor coupling $J$, transfer matrix analysis establishes that the spin-spin correlation function decays exponentially as $\langle s_i s_{i+r} \rangle = e^{-r / \xi}$. At an elevated temperature where the nearest-neighbor spin correlation parameter is measured to be $\tanh(\beta J) = 0.82$, calculate the spatial correlation length $\xi$ in units of the lattice spacing.
    hint_markdown: Relate the spatial decay rate of the spin correlation function across r lattice sites to the natural logarithm of the transfer matrix eigenvalue ratio lambda_2 / lambda_1 = tanh(beta J).
    correct:
      value: 5.04
      tolerance: 0.05
    rationale_markdown: Matching the correlation function forms gives $(\tanh\beta J)^r = e^{-r / \xi}$, which implies $\ln(\tanh\beta J) = -1/\xi$, or $\xi = -\frac{1}{\ln(\tanh\beta J)}$. For $\tanh(\beta J) = 0.82$, we evaluate $\ln(0.82) \approx -0.19845$. Thus $\xi = -\frac{1}{-0.19845} \approx 5.039 \approx 5.04$ lattice units.
  - id: q22_11_peierls_kink_argument
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_exact_solutions_and_transfer_matrix
    prompt_markdown: In the Peierls argument for the 1D Ising chain, why does the free energy change to create a single domain boundary, $\Delta F = 2J - k_B T \ln N$, guarantee the destruction of spontaneous magnetization at any finite temperature $T > 0$ as $N \to \infty$, whereas the corresponding argument in $d = 2$ allows stable ferromagnetic order?
    hint_markdown: Compare how the energetic cost of an enclosing domain boundary scales with its geometric perimeter/area versus how the number of possible boundary configurations (entropy) scales in one dimension versus two dimensions.
    options:
    - id: a
      text: In 1D, the energetic barrier Delta E = 2J is independent of system size while entropy grows as ln N, driving Delta F -> -infinity. In 2D, enclosing a domain of linear size L costs energy scaling with perimeter (Delta E ~ 2 sigma L), which overwhelms boundary configurational entropy at sufficiently low temperatures.
    - id: b
      text: In 1D, spins are prohibited by quantum uncertainty from having discrete values, whereas 2D spins are classical vectors.
    - id: c
      text: In 2D, domain walls cannot form closed loops due to topological conservation laws.
    - id: d
      text: The 1D transfer matrix has imaginary eigenvalues, which destabilizes boundary walls.
    correct: a
    rationale_markdown: In 1D, a domain wall is a zero-dimensional point separating two semi-infinite domains. Its energy cost is constant ($\Delta E = 2J$), but its entropy $\Delta S = k_B \ln N$ diverges as $N \to \infty$, meaning $\Delta F = 2J - k_B T \ln N < 0$ for any $T > 0$. In 2D, an island of reversed spins is enclosed by a 1D contour of perimeter $P$. The energy cost grows linearly with perimeter ($\Delta E = 2 J P$), while the number of self-avoiding closed contours of perimeter $P$ scales as $\mu^P$. The free energy change is $\Delta F \ge (2J - k_B T \ln \mu) P$. For $T < T_c \approx 2J / (k_B \ln \mu)$, $\Delta F > 0$ and increases with perimeter, suppressing large domain fluctuations and stabilizing spontaneous order.
  - id: q22_12_specific_heat_schottky_anomaly
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_exact_solutions_and_transfer_matrix
    prompt_markdown: How does the zero-field specific heat capacity $C_V(T) = -T \frac{\partial^2 f}{\partial T^2}$ of the 1D Ising chain behave as a function of temperature?
    hint_markdown: Differentiate the 1D free energy per spin f = -k_B T ln(2 cosh(beta J)) twice with respect to temperature and observe whether any mathematical singularity arises at non-zero T.
    options:
    - id: a
      text: It exhibits a broad, perfectly analytic Schottky-like peak that drops smoothly to zero both as T -> 0 and as T -> infinity, with no mathematical singularity at any non-zero temperature.
    - id: b
      text: It diverges logarithmically C_V ~ ln|T - T_c| at a finite critical temperature.
    - id: c
      text: It undergoes a discontinuous jump of Delta C_V = 3/2 k_B as predicted by mean-field theory.
    - id: d
      text: It remains strictly zero at all temperatures because 1D chains cannot absorb thermal energy.
    correct: a
    rationale_markdown: The internal energy per spin is $u = -J \tanh(\beta J)$. Differentiating with respect to $T$ yields $C_V = k_B (\beta J)^2 \operatorname{sech}^2(\beta J)$. This function is strictly analytic for all $T > 0$. It forms a smooth Schottky maximum near $k_B T \approx 0.83 J$ and decays smoothly to zero at both $T \to 0$ and $T \to \infty$, confirming the complete absence of a thermodynamic phase transition.
  - id: q22_13_boundary_condition_invariance
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_exact_solutions_and_transfer_matrix
    prompt_markdown: Consider solving the 1D Ising chain with open boundary conditions ($s_1$ and $s_N$ have only one neighbor) versus periodic boundary conditions ($s_{N+1} = s_1$). How does the choice of boundary conditions affect the free energy per spin in the thermodynamic limit $N \to \infty$?
    hint_markdown: Consider the fraction of total bonds that are modified when transitioning from periodic to open boundaries in a chain of length N.
    options:
    - id: a
      text: The free energy per spin is strictly identical in the thermodynamic limit because the boundary contributes an energy of order O(1), which vanishes when divided by N as N -> infinity.
    - id: b
      text: Open boundary conditions induce a finite-temperature phase transition, whereas periodic boundaries prevent it.
    - id: c
      text: Periodic boundaries double the critical temperature relative to open boundaries.
    - id: d
      text: The free energy per spin diverges under open boundaries due to boundary spin unbinding.
    correct: a
    rationale_markdown: Changing from periodic to open boundaries alters exactly one interaction bond (the $s_N s_1$ term), changing the total energy by at most $2J$. In the thermodynamic limit, the difference in free energy per spin is $\Delta f = \frac{\mathcal{O}(J)}{N} \to 0$ as $N \to \infty$. Bulk intensive thermodynamic properties are completely independent of boundary conditions in the thermodynamic limit.
  - id: sec_onsager_solution_and_critical_phenomena
    type: markdown_section
    title: 3. Onsager's Exact 2D Solution & Critical Phenomena
    body_markdown: '### Kramers-Wannier Duality and Onsager''s Critical Point

      In 1941, Hendrik Kramers and Gregory Wannier discovered an exact duality relating the high-temperature and low-temperature expansions of the 2D square-lattice Ising model on dual lattices. High-temperature graphs of $\tanh(\beta J)$ map directly onto low-temperature domain wall graphs of $e^{-2\beta^* J}$. The self-dual transformation condition:

      $$\sinh(2\beta J) \sinh(2\beta^* J) = 1$$

      identifies the unique self-dual point $\beta = \beta^* = \beta_c$, which must be the critical point if only a single phase transition exists:

      $$\sinh(2\beta_c J) = 1 \implies 2\beta_c J = \ln(1 + \sqrt{2}) \approx 0.8813736$$

      Inverting this yields Lars Onsager''s celebrated 1944 exact critical temperature:

      $$\frac{k_B T_c}{J} = \frac{2}{\ln(1 + \sqrt{2})} \approx 2.269185$$


      ### Spontaneous Magnetization and Critical Exponents

      Onsager announced and C. N. Yang (1952) rigorously derived the exact spontaneous magnetization below $T_c$:

      $$M_0(T) = \left[ 1 - \frac{1}{[\sinh(2\beta J)]^4} \right]^{1/8} \quad (T < T_c)$$

      Near $T_c$, expanding $\sinh(2\beta J)$ yields $M_0(T) \propto (T_c - T)^{\beta}$ with the exact order-parameter critical exponent $\beta = 1/8 = 0.125$. The complete set of exact 2D Ising critical exponents is:

      - **Specific Heat:** $C_V \propto -\ln|1 - T/T_c| \implies \alpha = 0$ (logarithmic divergence)

      - **Spontaneous Magnetization:** $M_0 \propto (T_c - T)^{\beta} \implies \beta = 1/8 = 0.125$

      - **Isothermal Susceptibility:** $\chi_T \propto |T - T_c|^{-\gamma} \implies \gamma = 7/4 = 1.75$

      - **Correlation Length:** $\xi \propto |T - T_c|^{-\nu} \implies \nu = 1$

      - **Critical Correlation Decay:** $G(r) \propto r^{-(d - 2 + \eta)} = r^{-\eta} \implies \eta = 1/4 = 0.25$


      ### Hyperscaling Relations and Breakdown of Mean-Field Theory

      These exponents satisfy the universal scaling relations derived from the renormalization group:

      - **Rushbrooke Equality:** $\alpha + 2\beta + \gamma = 0 + 2(1/8) + 7/4 = 2$

      - **Josephson Hyperscaling:** $d\nu = 2 - \alpha \implies 2(1) = 2 - 0 = 2$

      - **Fisher Relation:** $\gamma = \nu(2 - \eta) \implies 7/4 = 1(2 - 1/4) = 7/4$

      By contrast, Landau Mean-Field Theory predicts $\alpha_{\text{MF}} = 0$ (step discontinuity), $\beta_{\text{MF}} = 1/2$, $\gamma_{\text{MF}} = 1$, and $\nu_{\text{MF}} = 1/2$. Mean-field theory completely fails in $d = 2$ because it neglects local thermal fluctuations. By the Ginzburg criterion, mean-field critical exponents only become quantitatively exact above the **upper critical dimension** $d_u = 4$.'
  - id: q22_14_kramers_wannier_duality
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_onsager_solution_and_critical_phenomena
    prompt_markdown: How did Kramers and Wannier pinpoint the exact critical coupling of the 2D square-lattice Ising model prior to Onsager's full solution of the partition function?
    hint_markdown: Consider how a high-temperature expansion in terms of closed loop bonds on a lattice maps onto a low-temperature expansion in terms of domain wall boundaries on the dual lattice.
    options:
    - id: a
      text: By establishing an exact mathematical duality relating the high-temperature expansion on the square lattice to the low-temperature domain wall expansion on its dual lattice, and identifying the self-dual fixed point sinh(2*beta*J) = 1.
    - id: b
      text: By performing high-precision Monte Carlo simulations on mechanical vacuum tube computers.
    - id: c
      text: By diagonalizing infinite-dimensional Toeplitz determinants using Wiener-Hopf techniques.
    - id: d
      text: By applying the Hartree-Fock self-consistent field approximation to the spin density.
    correct: a
    rationale_markdown: Kramers and Wannier demonstrated that the high-temperature series expansion of the square-lattice partition function (formulated in terms of graphs of $\tanh \beta J$) is mathematically isomorphic to the low-temperature series expansion (formulated in terms of domain walls of $e^{-2\beta^* J}$) on the dual lattice. Because the square lattice is self-dual (its dual lattice is also a square lattice), assuming a single phase transition implies the critical point must occur at the self-dual condition $\sinh(2\beta_c J) = 1$.
  - id: q22_15_onsager_tc_numeric
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_onsager_solution_and_critical_phenomena
    prompt_markdown: Onsager's exact analytical solution for the 2D square-lattice Ising ferromagnet establishes that the critical point is determined by the self-dual Kramers-Wannier relation $\sinh(2\beta_c J) = 1$, where $\beta_c = 1/(k_B T_c)$. Calculate the dimensionless critical temperature $k_B T_c / J$ to 3 decimal places.
    hint_markdown: Use the inverse hyperbolic sine relation or express sinh(x) in terms of exponentials to solve for the critical argument 2*beta_c*J, and subsequently invert the thermal coupling to obtain the reduced temperature.
    correct:
      value: 2.269
      tolerance: 0.005
    rationale_markdown: From $\sinh(2\beta_c J) = 1$, we have $2\beta_c J = \operatorname{arsinh}(1) = \ln(1 + \sqrt{1^2 + 1}) = \ln(1 + \sqrt{2}) \approx 0.8813736$. Therefore, $\beta_c J = \frac{1}{2}\ln(1 + \sqrt{2})$, which gives $\frac{k_B T_c}{J} = \frac{1}{\beta_c J} = \frac{2}{\ln(1 + \sqrt{2})} = \frac{2}{0.8813736} \approx 2.269185 \approx 2.269$.
  - id: q22_16_spontaneous_magnetization_exponent
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_onsager_solution_and_critical_phenomena
    prompt_markdown: Below $T_c$, Yang's exact formula demonstrates that the spontaneous magnetization vanishes as $M_0(T) \propto (T_c - T)^{\beta}$. How does the exact 2D critical exponent $\beta$ compare to the value predicted by classical Mean-Field Theory?
    hint_markdown: Recall Yang's eighth-root formula for spontaneous magnetization versus the square-root dependence derived from truncating the Landau free energy at fourth order.
    options:
    - id: a
      text: beta = 1/8 = 0.125 in the 2D Ising model, which is four times smaller than the mean-field prediction of beta_MF = 1/2 = 0.50, causing magnetization to rise much more sharply below Tc.
    - id: b
      text: beta = 1/2 in both 2D and mean-field theory because critical exponents are strictly dimension-independent.
    - id: c
      text: beta = 1/4 in 2D and beta_MF = 1/8 in mean-field theory.
    - id: d
      text: beta = 1 in 2D, indicating a linear decrease of magnetization to zero.
    correct: a
    rationale_markdown: 'In 2D, intense critical fluctuations steepen the onset of order: $\beta = 1/8 = 0.125$. In Landau mean-field theory, minimizing $f(m) = a(T-T_c)m^2 + b m^4$ yields $m_0 = \sqrt{-a(T-T_c)/(2b)} \propto (T_c - T)^{1/2}$, yielding $\beta_{\text{MF}} = 1/2$. The true 2D magnetization rises far more abruptly below $T_c$ than mean-field predicts.'
  - id: q22_17_2d_critical_exponents_multiselect
    type: problem
    question_type: multi_select
    difficulty: hard
    taught_by: sec_onsager_solution_and_critical_phenomena
    prompt_markdown: Which of the following statements correctly specify the exact critical exponents and scaling properties of the 2D Ising universality class? *(Select all that apply.)*
    hint_markdown: Check each exponent against Onsager's exact solution and verify whether the hyperscaling relation d*nu = 2 - alpha is satisfied.
    options:
    - id: a
      text: The correlation length exponent is nu = 1, meaning the spatial correlation length diverges as xi ~ |T - Tc|^(-1).
    - id: b
      text: The magnetic susceptibility exponent is gamma = 7/4 = 1.75, far stronger than the mean-field divergence of gamma_MF = 1.
    - id: c
      text: The specific heat exponent alpha = 0 corresponds to a symmetric logarithmic divergence C_V ~ -ln|T - Tc| rather than a power law.
    - id: d
      text: The critical correlation function at T = Tc decays as G(r) ~ r^(-1/4), giving anomalous dimension eta = 1/4.
    - id: e
      text: The upper critical dimension is d_u = 2, so mean-field exponents are exact in two dimensions.
    correct:
    - a
    - b
    - c
    - d
    rationale_markdown: 'The exact 2D Ising exponents are $\alpha = 0$ (logarithmic singularity), $\beta = 1/8$, $\gamma = 7/4$, $\nu = 1$, and $\eta = 1/4$. They satisfy all scaling and hyperscaling laws (e.g., $d\nu = 2(1) = 2 - \alpha$). Option e is false: the upper critical dimension is $d_u = 4$; mean-field theory fails dramatically in $d = 2$.'
  - id: q22_18_rushbrooke_scaling_law
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_onsager_solution_and_critical_phenomena
    prompt_markdown: Thermodynamic stability requires that the magnetic susceptibility, specific heat, and spontaneous magnetization satisfy the Rushbrooke scaling relation. What is the universal algebraic relationship between the critical exponents $\alpha$, $\beta$, and $\gamma$?
    hint_markdown: Differentiate the singular part of the free energy scaling hypothesis f_sing ~ |T - Tc|^(2 - alpha) twice with respect to temperature and magnetic field.
    options:
    - id: a
      text: alpha + 2*beta + gamma = 2
    - id: b
      text: alpha + beta + gamma = 1
    - id: c
      text: alpha * beta * gamma = 2
    - id: d
      text: 2*alpha + beta - gamma = 0
    correct: a
    rationale_markdown: 'The Rushbrooke scaling equality $\alpha + 2\beta + \gamma = 2$ follows from thermodynamic stability (the non-negativity of isothermal compressibility/susceptibility and specific heat) and the Widom scaling hypothesis. Substituting the 2D Ising values: $\alpha = 0$, $\beta = 1/8$, and $\gamma = 7/4$ yields $0 + 2(1/8) + 7/4 = 1/4 + 7/4 = 8/4 = 2$, identically verifying the equality.'
  - id: q22_19_upper_critical_dimension
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_onsager_solution_and_critical_phenomena
    prompt_markdown: According to the Ginzburg criterion, what is the upper critical dimension $d_u$ for the Ising universality class, and what physical change occurs when spatial dimension $d \ge d_u$?
    hint_markdown: Consider the spatial dimension above which order-parameter fluctuations become negligible compared to mean-field thermal averages over a correlation volume xi^d.
    options:
    - id: a
      text: d_u = 4; above four dimensions, thermal fluctuations on length scales xi become negligible over correlation volumes, rendering Landau mean-field critical exponents exact.
    - id: b
      text: d_u = 2; above two dimensions, phase transitions cease to exist.
    - id: c
      text: d_u = 3; systems in three dimensions always have mean-field exponents.
    - id: d
      text: d_u = infinity; fluctuations dominate in all finite dimensions.
    correct: a
    rationale_markdown: The Ginzburg criterion balances order parameter variance against the square of the mean order parameter over a correlation volume $\xi^d$. In dimensions $d < 4$, fluctuations diverge faster than the mean, altering the critical exponents away from mean-field values. At and above the upper critical dimension $d_u = 4$, phase space is sufficiently high-dimensional that fluctuations do not alter critical scaling, making mean-field exponents ($\alpha=0, \beta=1/2, \gamma=1, \nu=1/2$) exact (up to logarithmic corrections at $d=4$).
  - id: sec_order_parameter_distribution_and_interfaces
    type: markdown_section
    title: 4. Finite-Size Order Parameter Distributions, Interfacial Tension & Binder Cumulants
    body_markdown: '### The Order Parameter Distribution $P_L(M)$

      In a finite lattice of linear dimension $L$ ($N = L^d$ spins), the total magnetization per spin is $M = \frac{1}{N}\sum_{i=1}^N s_i$. The probability density $P_L(M)$ provides a direct window into the finite-size Landau free energy landscape $\mathcal{F}_L(M) = -k_B T \ln P_L(M)$:

      1. **Disordered Phase ($T > T_c$):** Thermal fluctuations are uncorrelated across distances greater than $\xi \ll L$. By the Central Limit Theorem, $P_L(M)$ is a single Gaussian centered at $M = 0$ with variance $\sigma_M^2 = k_B T \chi_T / N$.

      2. **Critical Point ($T = T_c$):** Fluctuations become scale-invariant ($\xi \sim L$). The Gaussian quadratic coefficient vanishes, and $P_L(M)$ flattens into a non-Gaussian distribution governed by the quartic term:

      $$P_L(M) \propto \exp\left( -u L^{d - 4\beta/\nu} M^4 \right)$$

      3. **Ordered Phase ($T < T_c$):** Spontaneous symmetry breaking splits $P_L(M)$ into **two symmetric peaks** centered near $\pm M_0(T)$. In a finite box with $h = 0$, exact $\mathbb{Z}_2$ inversion symmetry ensures $\langle M \rangle = 0$, but the peaks are separated by a deep free energy barrier at $M = 0$.


      ### Interfacial Tension and Periodic Domain Walls

      To sample configurations with $M \approx 0$ at $T < T_c$, the simulation box must form coexistence between $+M_0$ and $-M_0$ phases. Under periodic boundary conditions, topological closure requires an even number of interfaces: a minimum of **two flat domain walls** of cross-sectional area $L^{d-1}$ spanning the periodic boundary. The excess free energy penalty is:

      $$\Delta \mathcal{F}_L = 2 \sigma(T) L^{d-1}$$

      where $\sigma(T)$ is the interfacial free energy per unit area. The probability ratio between the minimum at $M = 0$ and the peaks at $\pm M_0$ scales as:

      $$\frac{P_L(0)}{P_L(M_0)} \propto \exp\left( -\frac{\Delta \mathcal{F}_L}{k_B T} \right) = \exp\left( -\frac{2 \sigma(T) L^{d-1}}{k_B T} \right)$$

      As $L \to \infty$, this barrier diverges, causing spontaneous ergodicity breaking in the thermodynamic limit.


      ### The Binder Fourth-Order Cumulant

      Kurt Binder (1981) introduced a dimensionless cumulant that cleanly locates critical points independently of unknown non-universal constants:

      $$U_4(T, L) = 1 - \frac{\langle M^4 \rangle_L}{3 \langle M^2 \rangle_L^2}$$

      - At $T \gg T_c$, Gaussian statistics yield $\langle M^4 \rangle = 3 \langle M^2 \rangle^2 \implies U_4 \to 0$.

      - At $T \ll T_c$, bimodal delta peaks at $\pm M_0$ yield $\langle M^4 \rangle = \langle M^2 \rangle^2 = M_0^4 \implies U_4 \to 2/3$.

      - Right at $T = T_c$, by finite-size scaling, $U_4(T_c, L) = U^*$ is **invariant with respect to $L$** (up to corrections to scaling). Plotting $U_4(T, L)$ versus $T$ for various system sizes produces curves that intersect at a single invariant crossing point identifying $T_c$.'
