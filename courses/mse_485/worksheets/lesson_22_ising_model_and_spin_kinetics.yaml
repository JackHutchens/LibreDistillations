  - id: q22_37
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_ising_hamiltonian_and_mappings
    prompt_markdown: Starting from the fully aligned ground state ($E = -200\text{ meV}$), flipping a single spin $s_k \to -1$ in the bulk breaks $z = 4$ bonds. What is the energy change $\Delta E$ in meV?
    correct: 8.0
    tolerance: 0.1
    unit: meV
    hint_markdown: 'Each of the 4 bonds changes from $-J$ to $+J$, costing $2J$ per bond: $\Delta E = 2 z J$.'
