worksheet:
  id: lesson_03_statistical_mechanics
  title: 'Lesson 03: Basics of Statistical Mechanics, Phase Space, and Classical Ensembles'
  topic: Phase Space, Ergodic Hypothesis, Liouville's Theorem, Microcanonical vs Canonical Ensembles, Equipartition, and Clausius
    Virial Pressure
  estimated_minutes: 120
  learning_objectives:
  - Define classical 6N-dimensional phase space and articulate the Ergodic Hypothesis.
  - Derive Liouville's Theorem from Hamilton's equations and explain phase-space incompressibility.
  - Contrast the Microcanonical (NVE) and Canonical (NVT) ensembles and evaluate the Gibbs factor N!.
  - Explain the Lyapunov instability, predictability horizons, and why MD ensemble averages remain valid.
  - Apply the Equipartition Theorem to estimate instantaneous kinetic temperature.
  - Compute macroscopic bulk pressure using the Clausius Virial Theorem in periodic boundary conditions.
  sections:
  - id: sec_intro_statmech
    type: markdown_section
    title: Phase Space, Ergodicity, and Classical Ensembles
    body_markdown: 'In atomic-scale simulations, we track the microscopic positions $\mathbf{r}^N = (\mathbf{r}_1, \dots,
      \mathbf{r}_N)$ and conjugate momenta $\mathbf{p}^N = (\mathbf{p}_1, \dots, \mathbf{p}_N)$ of $N$ classical particles.
      Together, these form a single state point $\boldsymbol{\Gamma} = (\mathbf{r}^N, \mathbf{p}^N)$ in a $6N$-dimensional
      **phase space**.


      The fundamental postulate connecting microscopic simulation trajectories to macroscopic thermodynamic observables (like
      temperature $T$, pressure $P$, and internal energy $E$) is the **Ergodic Hypothesis**:


      $$\lim_{t_{\text{obs}} \to \infty} \frac{1}{t_{\text{obs}}} \int_0^{t_{\text{obs}}} A(\boldsymbol{\Gamma}(t))\, dt =
      \langle A \rangle_{\text{ensemble}} = \int A(\boldsymbol{\Gamma})\, \rho(\boldsymbol{\Gamma})\, d\boldsymbol{\Gamma}$$


      That is, the infinite-time average along a single physical trajectory equals the ensemble average over all accessible
      phase-space microstates weighted by the probability density $\rho(\boldsymbol{\Gamma})$. Ergodicity requires that a
      trajectory can explore all parts of the constant-energy surface without being partitioned by infinite energy barriers
      or constrained by hidden invariants of motion (such as in the celebrated Fermi-Pasta-Ulam-Tsingou chain at low energy).'
  - id: q01_phase_space_dimension
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_intro_statmech
    prompt_markdown: For a three-dimensional classical simulation of $N = 500$ argon atoms, what is the total dimensionality
      of the classical phase space $(\mathbf{r}^N, \mathbf{p}^N)$?
    hint_markdown: Each atom has 3 spatial coordinates and 3 momentum components.
    correct:
      value: 3000
      tolerance: 0.01
    rationale_markdown: Each particle in 3D has 3 position degrees of freedom $(x_i, y_i, z_i)$ and 3 momentum degrees of
      freedom $(p_{ix}, p_{iy}, p_{iz})$. For $N = 500$ particles, the phase space has dimension $6N = 6 \times 500 = 3000$.
  - id: q02_ergodic_hypothesis_definition
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_intro_statmech
    prompt_markdown: Which statement precisely expresses the classical **Ergodic Hypothesis**?
    options:
    - id: a
      text: The time average of an observable along a single trajectory equals its phase-space ensemble average as observation
        time approaches infinity.
      text_markdown: The time average of an observable along a single trajectory equals its phase-space ensemble average as
        observation time approaches infinity.
    - id: b
      text: The kinetic energy of every particle is strictly constant and equal to $\frac{3}{2} k_B T$ at every instant.
      text_markdown: The kinetic energy of every particle is strictly constant and equal to $\frac{3}{2} k_B T$ at every instant.
    - id: c
      text: Every microstate in phase space is visited at least once during any finite molecular dynamics run.
      text_markdown: Every microstate in phase space is visited at least once during any finite molecular dynamics run.
    - id: d
      text: Phase-space volume contracts exponentially under dissipative friction forces.
      text_markdown: Phase-space volume contracts exponentially under dissipative friction forces.
    correct: a
    hint_markdown: Think about equating time integration to phase-space integration.
    rationale_markdown: The Ergodic Hypothesis asserts that the infinite-time average along a single dynamical trajectory
      equals the ensemble average over phase space. A finite MD simulation never visits every continuous state (option c is
      impossible in a continuum), kinetic energy fluctuates instantaneous around its mean (option b is wrong), and conservative
      Hamiltonian flows preserve volume rather than contracting (option d is wrong).
  - id: q03_fpu_nonergodicity
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_intro_statmech
    prompt_markdown: In 1953, Fermi, Pasta, Ulam, and Tsingou (FPU) simulated a 1D chain of 32 particles with weak cubic/quartic
      anharmonic spring interactions, expecting rapid thermalization into all normal modes. What did they actually discover?
    options:
    - id: a
      text: Energy remained trapped in the lowest few normal modes and exhibited quasi-periodic recurrence (FPU recurrence),
        failing to reach equipartition and violating naive ergodicity.
      text_markdown: Energy remained trapped in the lowest few normal modes and exhibited quasi-periodic recurrence (FPU recurrence),
        failing to reach equipartition and violating naive ergodicity.
    - id: b
      text: The chain disintegrated instantly because the equations of motion were unstable.
      text_markdown: The chain disintegrated instantly because the equations of motion were unstable.
    - id: c
      text: All 32 modes reached equal energy within 5 vibrational periods.
      text_markdown: All 32 modes reached equal energy within 5 vibrational periods.
    - id: d
      text: The total energy grew exponentially due to round-off error.
      text_markdown: The total energy grew exponentially due to round-off error.
    correct: a
    hint_markdown: Think about why the FPU experiment is famous in nonlinear dynamics and soliton theory.
    rationale_markdown: FPU expected that even tiny nonlinearities would cause rapid mode-mixing and equipartition. Instead,
      energy sloshed quasi-periodically back into the initial low-frequency mode (FPU recurrence). Below a critical stochasticity
      threshold, KAM tori and solitary waves prevent chaotic mixing, demonstrating that mechanical systems are not automatically
      ergodic.
  - id: q04_ergodicity_breaking_examples
    type: problem
    question_type: multi_select
    difficulty: medium
    taught_by: sec_intro_statmech
    prompt_markdown: Which of the following physical situations lead to broken or broken-in-practice ergodicity in atomistic
      simulations?
    options:
    - id: a
      text: A purely harmonic crystal, where normal modes are completely decoupled and never exchange energy.
      text_markdown: A purely harmonic crystal, where normal modes are completely decoupled and never exchange energy.
    - id: b
      text: A supercooled liquid trapped in a deep metastable free-energy basin below the glass transition temperature.
      text_markdown: A supercooled liquid trapped in a deep metastable free-energy basin below the glass transition temperature.
    - id: c
      text: A dense Lennard-Jones liquid at high temperature simulated for 10^7 steps.
      text_markdown: A dense Lennard-Jones liquid at high temperature simulated for 10^7 steps.
    - id: d
      text: A solid-state vacancy diffusion simulation where the hop barrier is 2.5 eV and the temperature is 300 K.
      text_markdown: A solid-state vacancy diffusion simulation where the hop barrier is 2.5 eV and the temperature is 300
        K.
    correct:
    - a
    - b
    - d
    hint_markdown: Identify which systems cannot explore all accessible phase space on simulation timescales.
    rationale_markdown: A purely harmonic crystal (a) has decoupled normal modes that conserve their individual energies forever.
      Glasses (b) are kinetically arrested in local free-energy basins for astronomical times. High-barrier rare events (d)
      like a 2.5 eV hop at 300 K take years per hop in standard MD, so MD samples only a single basin. In contrast, a hot
      LJ liquid (c) decorrelates within picoseconds and samples ergodically.
  - id: sec_liouville_markdown
    type: markdown_section
    title: Liouville's Theorem and Phase-Space Incompressibility
    body_markdown: 'Hamilton''s classical equations of motion for coordinates $q_k$ and momenta $p_k$ are:


      $$\dot{q}_k = \frac{\partial \mathcal{H}}{\partial p_k}, \quad \dot{p}_k = -\frac{\partial \mathcal{H}}{\partial q_k}$$


      The time evolution of an ensemble probability density $\rho(\mathbf{q}, \mathbf{p}, t)$ satisfies the continuity equation
      in phase space:


      $$\frac{\partial \rho}{\partial t} + \sum_{k=1}^{3N} \left[ \frac{\partial}{\partial q_k}(\rho \dot{q}_k) + \frac{\partial}{\partial
      p_k}(\rho \dot{p}_k) \right] = 0$$


      Using the product rule and substituting Hamilton''s equations, the phase-space velocity field divergence vanishes identically:


      $$\sum_{k=1}^{3N} \left[ \frac{\partial \dot{q}_k}{\partial q_k} + \frac{\partial \dot{p}_k}{\partial p_k} \right] =
      \sum_{k=1}^{3N} \left[ \frac{\partial^2 \mathcal{H}}{\partial q_k \partial p_k} - \frac{\partial^2 \mathcal{H}}{\partial
      p_k \partial q_k} \right] = 0$$


      This yields **Liouville''s Theorem**:


      $$\frac{d\rho}{dt} = \frac{\partial \rho}{\partial t} + \sum_{k=1}^{3N} \left( \dot{q}_k \frac{\partial \rho}{\partial
      q_k} + \dot{p}_k \frac{\partial \rho}{\partial p_k} \right) = 0$$


      The convective derivative of phase-space density along any trajectory is zero. Consequently, **phase-space volume is
      strictly conserved** under Hamiltonian time evolution: an initial volume $\Omega(0)$ evolves into $\Omega(t)$ with $\Omega(t)
      = \Omega(0)$ for all $t$.'
  - id: concept_liouville_flow
    type: concept_cell
    title: Liouville Phase-Space Incompressibility and Filamentation
    render_function: render_liouville_phase_space
    layout: figure_left
    controls:
      potential_type:
        kind: dropdown
        label: Potential Type
        options:
        - harmonic
        - quartic
        - pendulum
        default: quartic
      time_t:
        kind: slider
        label: Evolution Time t
        min: 0.2
        max: 6.0
        step: 0.2
        default: 2.4
      anharmonicity:
        kind: slider
        label: Anharmonicity alpha
        min: 0.0
        max: 1.5
        step: 0.1
        default: 0.6
    description_markdown: Watch how a closed cloud of initial microstates deforms in $(q, p)$ phase space under Hamiltonian
      dynamics. While the exact polygon area is strictly conserved (Liouville's theorem), anharmonicity causes energy-dependent
      orbital frequencies, shearing the patch into long, thin filaments whose coarse-grained bounding box expands.
    takeaway_markdown: 'Hamiltonian phase-space flow behaves as an incompressible fluid: $\Omega(t) = \Omega(0)$ exactly.
      Fine-grained Gibbs entropy $S = -k_B \int \rho \ln \rho$ is constant in time, but coarse-grained entropy increases as
      filamentation mixes states across phase space.'
  - id: q05_liouville_divergence
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_liouville_markdown
    prompt_markdown: What mathematical property of Hamilton's equations guarantees that the phase-space velocity field $\mathbf{v}_{\boldsymbol{\Gamma}}
      = (\dot{\mathbf{q}}, \dot{\mathbf{p}})$ is divergence-free ($\nabla_{\boldsymbol{\Gamma}} \cdot \mathbf{v}_{\boldsymbol{\Gamma}}
      = 0$)?
    options:
    - id: a
      text: 'Equality of mixed second partial derivatives: $\frac{\partial^2 H}{\partial q_k \partial p_k} = \frac{\partial^2
        H}{\partial p_k \partial q_k}$.'
      text_markdown: 'Equality of mixed second partial derivatives: $\frac{\partial^2 H}{\partial q_k \partial p_k} = \frac{\partial^2
        H}{\partial p_k \partial q_k}$.'
    - id: b
      text: The kinetic energy is quadratic in momenta.
      text_markdown: The kinetic energy is quadratic in momenta.
    - id: c
      text: The total energy is strictly negative.
      text_markdown: The total energy is strictly negative.
    - id: d
      text: All particles have identical masses.
      text_markdown: All particles have identical masses.
    correct: a
    hint_markdown: Substitute Hamilton's equations into the divergence expression.
    rationale_markdown: The divergence in phase space is $\sum_k (\partial \dot{q}_k / \partial q_k + \partial \dot{p}_k /
      \partial p_k) = \sum_k (\partial^2 \mathcal{H}/\partial q_k \partial p_k - \partial^2 \mathcal{H}/\partial p_k \partial
      q_k) = 0$, which vanishes identically by Clairaut's theorem on the equality of mixed second partial derivatives of $\mathcal{H}$.
  - id: q06_fine_vs_coarse_entropy
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: concept_liouville_flow
    prompt_markdown: Because Liouville's theorem states that $d\rho/dt = 0$, the fine-grained Gibbs entropy $S_{\text{Gibbs}}
      = -k_B \int \rho \ln \rho\, d\boldsymbol{\Gamma}$ is strictly constant in time for any isolated Hamiltonian system.
      How then can the Second Law of Thermodynamics (entropy increases) be reconciled with classical mechanics?
    options:
    - id: a
      text: Nonlinear filamentation stretches the fine-grained distribution into thin filaments, causing any coarse-grained
        (finite-resolution) entropy to increase to its equilibrium maximum.
      text_markdown: Nonlinear filamentation stretches the fine-grained distribution into thin filaments, causing any coarse-grained
        (finite-resolution) entropy to increase to its equilibrium maximum.
    - id: b
      text: Liouville's theorem is violated whenever $N > 10$.
      text_markdown: Liouville's theorem is violated whenever $N > 10$.
    - id: c
      text: The fine-grained Gibbs entropy is not defined for systems with potential energy.
      text_markdown: The fine-grained Gibbs entropy is not defined for systems with potential energy.
    - id: d
      text: Hamilton's equations only hold at $T = 0\text{ K}$.
      text_markdown: Hamilton's equations only hold at $T = 0\text{ K}$.
    correct: a
    hint_markdown: Consider what happens when you observe a filamented ink drop in water with finite optical resolution.
    rationale_markdown: Like stirring an ink drop in water, Hamiltonian flow shears the initial microstate patch into convoluted
      filaments throughout the energy shell. While the exact fine-grained volume (Gibbs entropy) remains constant, any finite-resolution
      coarse-grained density $\bar{\rho}$ averages over the gaps, causing the observable coarse-grained entropy $\bar{S} =
      -k_B \int \bar{\rho} \ln \bar{\rho}$ to increase monotonically toward the equilibrium maximum.
  - id: q07_fpu_concept_coupling
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_intro_statmech
    prompt_markdown: In the concept demonstration of the FPU chain, what happens to the mode energies as the specific energy
      $\epsilon$ is raised above the stochasticity threshold?
    options:
    - id: a
      text: Energy spreads irreversibly across all normal modes toward the equipartition value 1/N.
      text_markdown: Energy spreads irreversibly across all normal modes toward the equipartition value 1/N.
    - id: b
      text: All energy condenses entirely into the highest-frequency mode.
      text_markdown: All energy condenses entirely into the highest-frequency mode.
    - id: c
      text: The recurrence period between mode 1 and mode 2 approaches zero.
      text_markdown: The recurrence period between mode 1 and mode 2 approaches zero.
    - id: d
      text: The kinetic energy decays to zero while potential energy diverges.
      text_markdown: The kinetic energy decays to zero while potential energy diverges.
    correct: a
    hint_markdown: Review the concept takeaway regarding high energy in the FPU chain.
    rationale_markdown: Above the Chirikov stochasticity threshold, overlapping nonlinear resonances destroy KAM tori, enabling
      chaotic phase-space mixing that drives all normal modes toward the equipartition limit $\langle E_k \rangle = E_{\text{tot}}
      / N = 1/32$.
  - id: sec_chaos_and_lyapunov
    type: markdown_section
    title: Lyapunov Instability, Chaos, and Poincaré Recurrence
    body_markdown: "Two foundational paradoxes arise in classical statistical mechanics:\n\n1. **Poincaré Recurrence Theorem\
      \ (1890)**: Any bounded Hamiltonian system will eventually return arbitrarily close to its initial microstate after\
      \ a finite recurrence time $\\tau_{\\text{rec}}$. However, for a macroscopic system ($N \\sim 10^{23}$), Boltzmann showed\
      \ that $\\tau_{\\text{rec}} \\sim 10^{10^{23}}$ years—vastly exceeding the age of the universe!\n2. **Lyapunov Instability\
      \ (Chaos)**: Many-body trajectories are exponentially sensitive to initial conditions. If two trajectories begin separated\
      \ by a tiny distance $|\\Delta \\mathbf{R}(0)| = \\varepsilon_0$, their separation grows as:\n\n$$|\\Delta \\mathbf{R}(t)|\
      \ \\approx \\varepsilon_0\\, e^{\\lambda t}$$\n\nwhere $\\lambda > 0$ is the maximal **Lyapunov exponent** (typically\
      \ $\\lambda \\sim 1\\text{ ps}^{-1}$ in dense liquids). \n\nBecause of this exponential growth, any perturbation $\\\
      varepsilon_0 \\sim 10^{-16}$ (such as machine-precision floating-point roundoff) grows to macroscopic interatomic distances\
      \ $|\\Delta \\mathbf{R}| \\sim \\sigma$ within a **predictability horizon**:\n\n$$t^* \\approx \\frac{1}{\\lambda} \\\
      ln \\left( \\frac{\\sigma}{\\varepsilon_0} \\right) \\sim \\frac{\\ln(10^{16})}{1\\text{ ps}^{-1}} \\approx 37\\text{\
      \ ps}$$\n\nBeyond $t^*$, MD trajectories do not represent the exact deterministic path of the original initial condition,\
      \ yet **ensemble averages remain completely reliable** because the computed trajectory remains on the correct constant-energy\
      \ surface (shadowing lemma)."
  - id: concept_lyapunov_divergence
    type: concept_cell
    title: Lyapunov Instability and Predictability Horizon
    render_function: render_lyapunov_chaos
    layout: figure_left
    controls:
      log10_eps:
        kind: slider
        label: log10(Initial Perturbation)
        min: -16.0
        max: -4.0
        step: 1.0
        default: -12.0
      lyapunov_lambda:
        kind: slider
        label: Lyapunov Exponent lambda (1/ps)
        min: 0.5
        max: 3.0
        step: 0.25
        default: 1.5
      roughness:
        kind: slider
        label: Potential Roughness
        min: 0.2
        max: 2.0
        step: 0.2
        default: 1.0
    description_markdown: Explore the exponential divergence between two trajectories starting from nearly identical initial
      conditions. Adjust the initial separation $\varepsilon_0 = 10^{\log_{10}\varepsilon}$ and Lyapunov exponent $\lambda$
      to observe how rapidly the trajectory deviation saturates at interatomic scales.
    takeaway_markdown: Because $\lambda > 0$ in liquids and dense gases, individual trajectories are intrinsically chaotic
      and unrepeatable across different floating-point platforms after tens of picoseconds. However, statistical mechanics
      guarantees that macrostate averages (temperature, pressure, structure) are robust.
  - id: q08_lyapunov_horizon_calculation
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_chaos_and_lyapunov
    prompt_markdown: In a liquid Argon simulation with Lyapunov exponent $\lambda = 2.0\text{ ps}^{-1}$, two runs differ by
      a numerical roundoff error of $\varepsilon_0 = 10^{-14}\sigma$. At what time $t^*$ (in picoseconds) will their trajectory
      separation grow to the interatomic spacing $\sigma$?
    hint_markdown: Relate the exponential separation rate of chaotic trajectories to the initial perturbation magnitude and
      the macroscopic divergence threshold.
    correct:
      value: 16.12
      tolerance: 0.2
    rationale_markdown: Using $1 = \varepsilon_0 e^{\lambda t^*}$, we find $t^* = \frac{1}{\lambda} \ln(1/\varepsilon_0) =
      \frac{\ln(10^{14})}{2.0\text{ ps}^{-1}} = \frac{14 \times 2.302585}{2.0} \approx 16.12\text{ ps}$.
  - id: q09_poincare_vs_age_universe
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_chaos_and_lyapunov
    prompt_markdown: Why does the Poincaré Recurrence Theorem not contradict the observation of irreversible thermodynamic
      behavior in macroscopic materials?
    options:
    - id: a
      text: For N ~ 10^23 particles, the recurrence time is doubly exponential in N (~ 10^(10^23) years), far exceeding the
        age of the universe.
      text_markdown: For N ~ 10^23 particles, the recurrence time is doubly exponential in N (~ 10^(10^23) years), far exceeding
        the age of the universe.
    - id: b
      text: Poincaré's theorem only applies to 1-particle systems.
      text_markdown: Poincaré's theorem only applies to 1-particle systems.
    - id: c
      text: Thermal noise always destroys phase space.
      text_markdown: Thermal noise always destroys phase space.
    - id: d
      text: Recurrence only occurs at negative absolute temperatures.
      text_markdown: Recurrence only occurs at negative absolute temperatures.
    correct: a
    hint_markdown: Consider the magnitude of the recurrence time for 1 mole of gas.
    rationale_markdown: Poincaré recurrence guarantees eventual return, but the recurrence time scales with the hyper-volume
      of phase space, roughly $\tau_{\text{rec}} \sim t_0 \exp(S/k_B) \sim \exp(10^{23})$. For any system with $N > 100$,
      $\tau_{\text{rec}}$ is overwhelmingly greater than the 13.8 billion-year age of the universe, rendering recurrence physically
      unobservable.
  - id: q10_shadowing_lemma
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_chaos_and_lyapunov
    prompt_markdown: If a numerical MD trajectory diverges exponentially from the exact analytical trajectory after only ~20
      ps, why are MD thermodynamic properties scientifically valid? Which mathematical theorem provides this justification?
    options:
    - id: a
      text: 'The Shadowing Lemma: for hyperbolic/chaotic dynamical systems, there exists a true, exact trajectory starting
        from a slightly different initial state that stays uniformly close (''shadows'') the numerical trajectory for long
        times.'
      text_markdown: 'The Shadowing Lemma: for hyperbolic/chaotic dynamical systems, there exists a true, exact trajectory
        starting from a slightly different initial state that stays uniformly close (''shadows'') the numerical trajectory
        for long times.'
    - id: b
      text: The Central Limit Theorem guarantees that numerical errors cancel to zero at every integration step.
      text_markdown: The Central Limit Theorem guarantees that numerical errors cancel to zero at every integration step.
    - id: c
      text: Liouville's theorem states that coordinates do not matter for statistical averages.
      text_markdown: Liouville's theorem states that coordinates do not matter for statistical averages.
    - id: d
      text: Equipartition theorem eliminates floating-point errors.
      text_markdown: Equipartition theorem eliminates floating-point errors.
    correct: a
    hint_markdown: Look for the concept of 'shadowing' true trajectories.
    rationale_markdown: The Shadowing Lemma in dynamical systems proves that although a numerical trajectory with finite precision
      diverges from the exact trajectory with the *same* initial condition, there exists a nearby true trajectory with a slightly
      shifted initial condition that closely shadows the numerical path. Since ensemble averages depend on the phase-space
      distribution rather than individual identities, the averages remain exact.
  - id: sec_ensembles_and_partition_function
    type: markdown_section
    title: Microcanonical (NVE) vs. Canonical (NVT) Ensembles
    body_markdown: 'Classical statistical mechanics formulates thermodynamic states through distinct statistical ensembles:


      ### 1. Microcanonical Ensemble ($NVE$)

      An isolated system with fixed particle number $N$, volume $V$, and total energy $E$:


      $$\rho_{NVE}(\boldsymbol{\Gamma}) = \frac{1}{\Omega(N, V, E)}\, \delta(H(\boldsymbol{\Gamma}) - E)$$


      The microcanonical density of states is $\Omega(N, V, E) = \frac{1}{h^{3N} N!} \int d\mathbf{r}^N d\mathbf{p}^N \, \delta(H(\boldsymbol{\Gamma})
      - E)$, and Boltzmann entropy is:


      $$S = k_B \ln \Omega(N, V, E)$$


      The $N!$ (Gibbs factor) corrects for the indistinguishability of identical particles, eliminating the Gibbs paradox
      of non-extensive entropy of mixing.


      ### 2. Canonical Ensemble ($NVT$)

      A closed system with fixed $N$ and $V$ in thermal contact with a heat bath at temperature $T$ (inverse temperature $\beta
      = 1/(k_B T)$):


      $$\rho_{NVT}(\boldsymbol{\Gamma}) = \frac{e^{-\beta H(\boldsymbol{\Gamma})}}{Z(N, V, T)}$$


      The canonical partition function factors into ideal kinetic and excess configurational integrals:


      $$Z(N, V, T) = \frac{1}{h^{3N} N!} \int d\mathbf{p}^N e^{-\beta \sum \frac{p_i^2}{2m}} \int d\mathbf{r}^N e^{-\beta
      V(\mathbf{r}^N)} = \frac{1}{N!\, \Lambda^{3N}} \, Q(N, V, T)$$


      where $\Lambda = \sqrt{\frac{h^2}{2\pi m k_B T}}$ is the **thermal de Broglie wavelength**, and $Q(N, V, T) = \int d\mathbf{r}^N
      e^{-\beta V(\mathbf{r}^N)}$ is the **configurational integral**.


      The bridge to thermodynamics is the **Helmholtz Free Energy**:


      $$F(N, V, T) = -k_B T \ln Z(N, V, T) = E - TS$$'
  - id: q11_thermal_de_broglie
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_ensembles_and_partition_function
    prompt_markdown: What criterion determines whether classical mechanics is valid for an atomistic simulation, or whether
      quantum effects must be considered?
    options:
    - id: a
      text: The thermal de Broglie wavelength must be much smaller than the average interatomic spacing ($\Lambda \ll a$).
      text_markdown: The thermal de Broglie wavelength must be much smaller than the average interatomic spacing ($\Lambda
        \ll a$).
    - id: b
      text: The temperature must be below 10 K.
      text_markdown: The temperature must be below 10 K.
    - id: c
      text: The kinetic energy must equal the potential energy.
      text_markdown: The kinetic energy must equal the potential energy.
    - id: d
      text: The number of particles must be odd.
      text_markdown: The number of particles must be odd.
    correct: a
    hint_markdown: Think about wave-packet overlap between neighboring atoms.
    rationale_markdown: Classical mechanics treats atoms as localized point particles. When the thermal de Broglie wavelength
      $\Lambda = h/\sqrt{2\pi m k_B T}$ is comparable to or larger than the interatomic distance $a = \rho^{-1/3}$ ($\Lambda
      \gtrsim a$), wavepackets overlap, producing quantum exchange and diffraction effects (e.g. Liquid Helium, low-T Hydrogen,
      or high-frequency zero-point vibrational modes).
  - id: q12_helium_vs_argon_quantum
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_ensembles_and_partition_function
    prompt_markdown: Liquid Helium-4 has molar mass $4\text{ g/mol}$ while liquid Argon has $40\text{ g/mol}$. At $T = 20\text{
      K}$, how does the thermal de Broglie wavelength of Helium ($\Lambda_{\text{He}}$) compare to that of Argon ($\Lambda_{\text{Ar}}$)?
    options:
    - id: a
      text: $\Lambda_{\text{He}}$ is $\sqrt{10} \approx 3.16$ times larger than $\Lambda_{\text{Ar}}$.
      text_markdown: $\Lambda_{\text{He}}$ is $\sqrt{10} \approx 3.16$ times larger than $\Lambda_{\text{Ar}}$.
    - id: b
      text: $\Lambda_{\text{He}}$ is $10$ times smaller than $\Lambda_{\text{Ar}}$.
      text_markdown: $\Lambda_{\text{He}}$ is $10$ times smaller than $\Lambda_{\text{Ar}}$.
    - id: c
      text: $\Lambda_{\text{He}}$ equals $\Lambda_{\text{Ar}}$ because both are noble gases.
      text_markdown: $\Lambda_{\text{He}}$ equals $\Lambda_{\text{Ar}}$ because both are noble gases.
    - id: d
      text: $\Lambda_{\text{He}}$ is $100$ times larger.
      text_markdown: $\Lambda_{\text{He}}$ is $100$ times larger.
    correct: a
    hint_markdown: Recall how thermal momentum scales with atomic mass in the de Broglie wavelength definition.
    rationale_markdown: Since $\Lambda = \sqrt{h^2 / (2\pi m k_B T)} \propto m^{-1/2}$, we have $\Lambda_{\text{He}} / \Lambda_{\text{Ar}}
      = \sqrt{m_{\text{Ar}} / m_{\text{He}}} = \sqrt{40 / 4} = \sqrt{10} \approx 3.162$. Helium's light mass makes its quantum
      delocalization over 3 times larger, explaining why Helium remains a quantum liquid down to absolute zero.
  - id: q13_gibbs_factor_factorial
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_ensembles_and_partition_function
    prompt_markdown: Why must the classical partition function $Z(N, V, T)$ include the factor of $1/N!$?
    options:
    - id: a
      text: To account for the indistinguishability of identical particles, preventing the Gibbs paradox of non-extensive
        entropy.
      text_markdown: To account for the indistinguishability of identical particles, preventing the Gibbs paradox of non-extensive
        entropy.
    - id: b
      text: To convert energy from Joules to electron-volts.
      text_markdown: To convert energy from Joules to electron-volts.
    - id: c
      text: To guarantee that kinetic energy is always positive.
      text_markdown: To guarantee that kinetic energy is always positive.
    - id: d
      text: Because MD uses an N-step numerical integrator.
      text_markdown: Because MD uses an N-step numerical integrator.
    correct: a
    hint_markdown: Think about what happens to entropy when two identical volumes of the same gas are mixed.
    rationale_markdown: Permuting $N$ identical particles produces $N!$ microstates that are physically identical. Without
      the $1/N!$ factor, mixing two containers of identical gas at the same $T$ and $P$ would predict a spurious entropy increase
      $\Delta S = 2 N k_B \ln 2$ (the Gibbs paradox). The $1/N!$ factor ensures entropy $S$ and free energy $F$ are extensive
      thermodynamic properties.
  - id: q14_canonical_energy_fluctuations
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_ensembles_and_partition_function
    prompt_markdown: In the canonical ensemble ($NVT$), total energy $E$ is not strictly fixed but fluctuates through heat
      exchange with the reservoir. How do the relative energy fluctuations $\sigma_E / \langle E \rangle$ scale with system
      size $N$?
    options:
    - id: a
      text: $\sigma_E / \langle E \rangle \propto 1 / \sqrt{N}$, vanishing in the thermodynamic limit $N \to \infty$ where
        NVT and NVE become equivalent.
      text_markdown: $\sigma_E / \langle E \rangle \propto 1 / \sqrt{N}$, vanishing in the thermodynamic limit $N \to \infty$
        where NVT and NVE become equivalent.
    - id: b
      text: $\sigma_E / \langle E \rangle$ is constant and independent of $N$.
      text_markdown: $\sigma_E / \langle E \rangle$ is constant and independent of $N$.
    - id: c
      text: $\sigma_E / \langle E \rangle$ grows as $\sqrt{N}$.
      text_markdown: $\sigma_E / \langle E \rangle$ grows as $\sqrt{N}$.
    - id: d
      text: $\sigma_E / \langle E \rangle$ decays as $1/N^2$.
      text_markdown: $\sigma_E / \langle E \rangle$ decays as $1/N^2$.
    correct: a
    hint_markdown: Relate total energy variance to the constant-volume heat capacity via canonical partition function derivatives,
      and consider how extensive quantities scale with system size.
    rationale_markdown: The canonical variance is $\langle \Delta E^2 \rangle = k_B T^2 C_V$. Because $C_V \propto N$ and
      $\langle E \rangle \propto N$, the root-mean-square relative fluctuation is $\frac{\sigma_E}{\langle E \rangle} = \frac{\sqrt{k_B
      T^2 C_V}}{\langle E \rangle} \propto \frac{\sqrt{N}}{N} = \frac{1}{\sqrt{N}}$. For macroscopic $N \sim 10^{23}$, relative
      fluctuations are $\sim 10^{-11.5}$ (utterly negligible), proving that $NVT$ and $NVE$ ensembles yield identical thermodynamics
      in the thermodynamic limit.
  - id: sec_equipartition_and_virial
    type: markdown_section
    title: Equipartition Theorem and the Clausius Virial Pressure
    body_markdown: "Two fundamental theorems link mechanical microscopic variables to thermodynamic state variables:\n\n###\
      \ 1. Equipartition Theorem\nFor any generalized coordinate or momentum $x_i$ appearing quadratically in the Hamiltonian\
      \ $\\mathcal{H}$:\n\n$$\\left\\langle x_i \\frac{\\partial \\mathcal{H}}{\\partial x_j} \\right\\rangle = k_B T \\,\
      \ \\delta_{ij} \\implies \\left\\langle \\frac{p_{i\\alpha}^2}{2m_i} \\right\\rangle = \\frac{1}{2} k_B T$$\n\nEach\
      \ quadratic degree of freedom carries $\\frac{1}{2}k_B T$ of thermal energy. In molecular dynamics, this provides the\
      \ **instantaneous kinetic temperature estimator**:\n\n$$T_{\\text{kin}}(t) = \\frac{1}{N_{\\text{dof}} k_B} \\sum_{i=1}^N\
      \ m_i |\\mathbf{v}_i(t)|^2$$\n\nFor $N$ particles in 3D with periodic boundary conditions and fixed total momentum $\\\
      sum m_i \\mathbf{v}_i = \\mathbf{0}$, the number of degrees of freedom is $N_{\\text{dof}} = 3N - 3$.\n\n### 2. Clausius\
      \ Virial Theorem and Pressure Estimator\nApplying the generalized equipartition identity to coordinates $\\sum_i \\\
      langle \\mathbf{r}_i \\cdot \\nabla_{\\mathbf{r}_i} \\mathcal{H}\\rangle = 3N k_B T$ and separating external container\
      \ wall forces from internal interatomic forces $\\mathbf{F}_{ij}$ yields the **Clausius Virial Equation of State**:\n\
      \n$$P = \\rho k_B T + \\frac{1}{3V} \\left\\langle \\sum_{i < j} \\mathbf{r}_{ij} \\cdot \\mathbf{F}_{ij} \\right\\\
      rangle$$\n\nwhere $\\rho = N/V$ is number density.\n- $\\rho k_B T$ is the **ideal gas kinetic pressure** (momentum\
      \ transfer).\n- $\\frac{1}{3V} \\langle \\sum \\mathbf{r}_{ij} \\cdot \\mathbf{F}_{ij} \\rangle$ is the **internal virial\
      \ contribution**:\n - Positive ($P > P_{\\text{id}}$) when dominated by repulsive core collisions (e.g. Dense liquids).\n\
      \ - Negative ($P < P_{\\text{id}}$) when dominated by long-range attractive dispersion forces (e.g. Moderately dense\
      \ gases)."
  - id: concept_virial_pressure
    type: concept_cell
    title: Virial Pressure and Energy Fluctuations
    render_function: render_virial_pressure_and_fluctuations
    layout: figure_left
    controls:
      temperature:
        kind: slider
        label: Reduced Temperature T*
        min: 0.4
        max: 2.5
        step: 0.1
        default: 1.2
