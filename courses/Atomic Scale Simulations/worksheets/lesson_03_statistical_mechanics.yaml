    correct:
    - a
    - b
    - d
    hint_markdown: Consider how pressure is computed in PBC and what sign attractions produce.
    rationale_markdown: 'Statements a, b, and d are all standard: the virial formula avoids walls in PBC by using minimum
      image displacements $\mathbf{r}_{ij}$ and pair forces $\mathbf{F}_{ij}$. Statement c is false: the entire purpose of
      the virial term is to account for non-ideal interactions.'
  - id: q29_liouville_harmonic_oscillator_area
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_liouville_markdown
    prompt_markdown: A 1D harmonic oscillator with mass $m = 1$ and spring constant $k = 1$ starts with an initial circular
      phase-space patch of radius $r = 0.5$ (initial area $\Omega(0) = \pi r^2 = 0.25\pi \approx 0.7854$). According to Liouville's
      theorem, what is the exact area $\Omega(t)$ at $t = 10.0$?
    hint_markdown: Liouville's theorem states phase-space volume is strictly conserved.
    correct:
      value: 0.7854
      tolerance: 0.01
    rationale_markdown: Under conservative Hamiltonian flow, phase space is strictly incompressible ($d\Omega/dt = 0$). For
      a harmonic oscillator, the circular patch merely rotates as a rigid disk with angular frequency $\omega = \sqrt{k/m}
      = 1$, preserving its area $\pi (0.5)^2 \approx 0.7854$ exactly.
  - id: q30_lyapunov_exponent_units
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_chaos_and_lyapunov
    prompt_markdown: What are the dimensional physical units of the maximal Lyapunov exponent $\lambda$?
    options:
    - id: a
      text: Inverse time (1/s or 1/ps)
      text_markdown: Inverse time (1/s or 1/ps)
    - id: b
      text: Length (nm or Angstrom)
      text_markdown: Length (nm or Angstrom)
    - id: c
      text: Energy (J or eV)
      text_markdown: Energy (J or eV)
    - id: d
      text: Dimensionless
      text_markdown: Dimensionless
    correct: a
    hint_markdown: In exp(lambda * t), the exponent lambda * t must be dimensionless.
    rationale_markdown: Since $\lambda t$ appears as a dimensionless exponent in $|\Delta \mathbf{R}(t)| \sim e^{\lambda t}$,
      $\lambda$ must have dimensions of inverse time ($[\text{time}]^{-1}$, typically $\text{ps}^{-1}$ in atomistic simulations).
  - id: q31_partition_function_ideal_gas_scaling
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_ensembles_and_partition_function
    prompt_markdown: For an ideal gas of $N$ classical particles in volume $V$ at temperature $T$, what is the exact expression
      for the canonical partition function $Z(N, V, T)$?
    options:
    - id: a
      text: $Z = \frac{V^N}{N! \Lambda^{3N}}$
      text_markdown: $Z = \frac{V^N}{N! \Lambda^{3N}}$
    - id: b
      text: $Z = \frac{V}{\Lambda N!}$
      text_markdown: $Z = \frac{V}{\Lambda N!}$
    - id: c
      text: $Z = \exp(-\beta N k_B T)$
      text_markdown: $Z = \exp(-\beta N k_B T)$
    - id: d
      text: $Z = (3N)! (k_B T)^N$
      text_markdown: $Z = (3N)! (k_B T)^N$
    correct: a
    hint_markdown: Integrate d^3 r for each particle independently, giving V^N, divided by N! * Lambda^(3N).
    rationale_markdown: For non-interacting particles, $V(\mathbf{r}^N) = 0$, so the configurational integral is $Q = \int
      d\mathbf{r}^N = V^N$. Including the $1/(N!\Lambda^{3N})$ prefactor yields $Z = \frac{V^N}{N!\Lambda^{3N}}$.
  - id: q32_anharmonic_filamentation_entropy
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: concept_liouville_flow
    prompt_markdown: In the concept demonstration of Liouville's theorem, why does an anharmonic potential ($V(x) = \frac{1}{2}x^2
      + \frac{1}{4}\alpha x^4$) distort the circular phase-space patch into thin spirals, whereas a harmonic oscillator keeps
      the patch circular?
    options:
    - id: a
      text: In an anharmonic potential, the oscillation frequency depends on energy (higher energy orbits faster or slower),
        causing shear between inner and outer orbits.
      text_markdown: In an anharmonic potential, the oscillation frequency depends on energy (higher energy orbits faster
        or slower), causing shear between inner and outer orbits.
    - id: b
      text: Anharmonic potentials violate Newton's third law.
      text_markdown: Anharmonic potentials violate Newton's third law.
    - id: c
      text: The harmonic oscillator violates Liouville's theorem.
      text_markdown: The harmonic oscillator violates Liouville's theorem.
    - id: d
      text: Friction forces are present in anharmonic potentials.
      text_markdown: Friction forces are present in anharmonic potentials.
    correct: a
    hint_markdown: Recall whether a pendulum's period is independent of amplitude for large swings.
    rationale_markdown: 'A harmonic oscillator is isochronous: every orbit has identical period $T = 2\pi/\omega$ regardless
      of amplitude or energy, rotating the patch rigidly. In an anharmonic potential, period and orbital velocity depend on
      energy $\mathcal{H}$, causing points at different energies to orbit at different angular speeds, shearing the patch
      into spiral filaments.'
  - id: q33_kinetic_temperature_sampling_distribution
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_equipartition_and_virial
    prompt_markdown: Because the instantaneous kinetic energy $K = \sum_{i=1}^{3N-3} \frac{p_i^2}{2m}$ is a sum of $N_{\text{dof}}
      = 3N-3$ independent squared Gaussian variables, what statistical distribution does the instantaneous kinetic temperature
      $T_{\text{kin}}$ follow in the canonical ensemble?
    options:
    - id: a
      text: A $\chi^2$ distribution with $N_{\text{dof}}$ degrees of freedom (approaching a narrow Gaussian for large $N$
        by the Central Limit Theorem).
      text_markdown: A $\chi^2$ distribution with $N_{\text{dof}}$ degrees of freedom (approaching a narrow Gaussian for large
        $N$ by the Central Limit Theorem).
    - id: b
      text: A uniform distribution between 0 and 2 T.
      text_markdown: A uniform distribution between 0 and 2 T.
    - id: c
      text: A Cauchy-Lorentzian distribution with infinite variance.
      text_markdown: A Cauchy-Lorentzian distribution with infinite variance.
    - id: d
      text: A Poisson distribution.
      text_markdown: A Poisson distribution.
    correct: a
    hint_markdown: The sum of squared independent standard normals follows a chi-squared distribution.
    rationale_markdown: Each normalized momentum component $p_i / \sqrt{m k_B T}$ is an independent standard normal variable
      $\mathcal{N}(0, 1)$. The sum of $N_{\text{dof}}$ squared standard normals follows a $\chi^2$ distribution with mean
      $N_{\text{dof}}$ and variance $2 N_{\text{dof}}$, giving relative temperature fluctuations $\sigma_T / T = \sqrt{2 /
      N_{\text{dof}}}$.
  - id: q34_compressibility_factor_z
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_equipartition_and_virial
    prompt_markdown: An MD simulation of liquid argon at density $\rho^* = 0.84$ and temperature $T^* = 1.0$ yields a measured
      total pressure $P^* = 2.52$. What is the compressibility factor $Z = P / (\rho k_B T)$?
    hint_markdown: Recall how the dimensionless compressibility factor measures the ratio of total measured pressure to the
      kinetic ideal-gas pressure.
    correct:
      value: 3.0
      tolerance: 0.05
    rationale_markdown: $Z = \frac{P^*}{\rho^* T^*} = \frac{2.52}{0.84 \times 1.0} = 3.00$. The pressure is 3 times higher
      than an ideal gas at the same density and temperature, indicating strong repulsive core interactions.
  - id: q35_microcanonical_density_of_states_integral
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_ensembles_and_partition_function
    prompt_markdown: The microcanonical partition function $\Omega(E)$ is related to the canonical partition function $Z(\beta)$
      by which mathematical transform?
    options:
    - id: a
      text: 'Laplace transform: $Z(\beta) = \int_0^\infty \Omega(E) e^{-\beta E}\,dE$'
      text_markdown: 'Laplace transform: $Z(\beta) = \int_0^\infty \Omega(E) e^{-\beta E}\,dE$'
    - id: b
      text: Fourier cosine transform
      text_markdown: Fourier cosine transform
    - id: c
      text: Legendre transform of coordinates
      text_markdown: Legendre transform of coordinates
    - id: d
      text: $Z(\beta) = \Omega(E)^2$
      text_markdown: $Z(\beta) = \Omega(E)^2$
    correct: a
    hint_markdown: Write the phase-space integral in terms of an energy integral over the density of states.
    rationale_markdown: $Z(\beta) = \int d\boldsymbol{\Gamma} e^{-\beta H(\boldsymbol{\Gamma})} = \int_0^\infty dE \left[
      \int d\boldsymbol{\Gamma}\, \delta(H(\boldsymbol{\Gamma})-E) \right] e^{-\beta E} = \int_0^\infty \Omega(E) e^{-\beta
      E} dE$. Thus the canonical partition function is the two-sided/one-sided Laplace transform of the microcanonical density
      of states $\Omega(E)$.
  - id: q36_ensemble_equivalence_limit
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_ensembles_and_partition_function
    prompt_markdown: Under what condition are the Microcanonical ($NVE$), Canonical ($NVT$), and Isobaric-Isothermal ($NPT$)
      ensembles guaranteed to yield identical thermodynamic equations of state?
    options:
    - id: a
      text: In the thermodynamic limit ($N \to \infty, V \to \infty$ with $N/V = \text{const}$) away from first-order phase
        transitions.
      text_markdown: In the thermodynamic limit ($N \to \infty, V \to \infty$ with $N/V = \text{const}$) away from first-order
        phase transitions.
    - id: b
      text: Only at the critical point.
      text_markdown: Only at the critical point.
    - id: c
      text: Only when $N < 100$.
      text_markdown: Only when $N < 100$.
    - id: d
      text: They never yield identical properties.
      text_markdown: They never yield identical properties.
    correct: a
    hint_markdown: Consider how relative fluctuations scale with N.
    rationale_markdown: In the thermodynamic limit $N \to \infty$, relative fluctuations in energy, volume, and particle number
      scale as $1/\sqrt{N} \to 0$. Away from phase transitions, the probability distributions become infinitely sharp delta
      functions, making microcanonical, canonical, and grand canonical ensembles thermodynamically equivalent.
  - id: q37_virial_estimator_three_dimensions
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_equipartition_and_virial
    prompt_markdown: In a $D$-dimensional simulation box of volume $V = L^D$, what is the general prefactor on the internal
      virial sum in the pressure equation $P = \rho k_B T + \dots$?
    options:
    - id: a
      text: 1 / (D * V)
      text_markdown: 1 / (D * V)
    - id: b
      text: 1 / (2 * V)
      text_markdown: 1 / (2 * V)
    - id: c
      text: D / V
      text_markdown: D / V
    - id: d
      text: 3 / V regardless of D
      text_markdown: 3 / V regardless of D
    correct: a
    hint_markdown: Trace of the pressure tensor in D dimensions divides by D.
    rationale_markdown: In $D$ dimensions, the trace of the pressure tensor is $D P = \sum_{\alpha=1}^D P_{\alpha\alpha}$,
      yielding $P = \rho k_B T + \frac{1}{D V} \left\langle \sum_{i<j} \mathbf{r}_{ij} \cdot \mathbf{F}_{ij} \right\rangle$.
      For 2D simulations (monolayers), the prefactor is $\frac{1}{2A}$; for 3D, it is $\frac{1}{3V}$.
  - id: q38_conserved_momentum_temperature_correction
    type: problem
