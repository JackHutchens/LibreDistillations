  - id: q39_liouville_operator_propagator
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_liouville_markdown
    prompt_markdown: In operator notation, Liouville's theorem can be written using the Liouville operator $i \hat{L} = \dot{\mathbf{q}}\cdot\nabla_\mathbf{q}
      + \dot{\mathbf{p}}\cdot\nabla_\mathbf{p} = \{\cdot, \mathcal{H}\}$. What is the formal solution for the time-evolved
      state $\boldsymbol{\Gamma}(t)$ in terms of the initial state $\boldsymbol{\Gamma}(0)$?
    options:
    - id: a
      text: $\Gamma(t) = \exp(i \mathcal{L} t) \Gamma(0)$
      text_markdown: $\Gamma(t) = \exp(i \mathcal{L} t) \Gamma(0)$
    - id: b
      text: Gamma(t) = Gamma(0) + i * L * t
      text_markdown: Gamma(t) = Gamma(0) + i * L * t
    - id: c
      text: $\Gamma(t) = \ln(i \mathcal{L} t) \Gamma(0)$
      text_markdown: $\Gamma(t) = \ln(i \mathcal{L} t) \Gamma(0)$
    - id: d
      text: $\Gamma(t) = \exp(-H / (k_B T)) \Gamma(0)$
      text_markdown: $\Gamma(t) = \exp(-H / (k_B T)) \Gamma(0)$
    correct: a
    hint_markdown: The formal solution to dA/dt = i L A is A(t) = exp(i L t) A(0).
    rationale_markdown: The equation of motion for any phase-space variable $A$ is $\frac{dA}{dt} = i\hat{L}A = \{A, \mathcal{H}\}$.
      The formal unitary solution is the exponential propagator $A(t) = e^{i\hat{L}t}A(0)$, which serves as the exact foundation
      for symplectic Trotter/Verlet integrators.
  - id: q40_lyapunov_exponential_divergence_summary
    type: problem
    question_type: multi_select
    difficulty: medium
    taught_by: sec_chaos_and_lyapunov
    prompt_markdown: Which of the following are consequences of the positive Lyapunov exponent (chaos) in many-body MD simulations?
    options:
    - id: a
      text: Reversing velocities after ~50 ps of MD integration will not return the system to its initial state due to accumulated
        roundoff errors.
      text_markdown: Reversing velocities after ~50 ps of MD integration will not return the system to its initial state due
        to accumulated roundoff errors.
    - id: b
      text: The exact same simulation run on two different CPU architectures (e.g. X86 vs. ARM) will produce diverging atomic
        coordinates after tens of picoseconds.
      text_markdown: The exact same simulation run on two different CPU architectures (e.g. X86 vs. ARM) will produce diverging
        atomic coordinates after tens of picoseconds.
    - id: c
      text: Macroscopic properties like pressure, RDF, and diffusion coefficients are completely invalid and cannot be trusted.
      text_markdown: Macroscopic properties like pressure, RDF, and diffusion coefficients are completely invalid and cannot
        be trusted.
    - id: d
      text: Macroscopic averages converge to the correct ensemble values despite individual trajectory divergence.
      text_markdown: Macroscopic averages converge to the correct ensemble values despite individual trajectory divergence.
    correct:
    - a
    - b
    - d
    hint_markdown: Consider both the microscopic unpredictability and the macroscopic statistical validity.
    rationale_markdown: 'Statements a, b, and d are all hallmarks of deterministic chaos in MD: finite-precision floating-point
      roundoff amplifies exponentially, making microscopic paths uninvertible and non-reproducible across compilers/CPUs after
      tens of picoseconds. However, statement c is completely false: statistical thermodynamics guarantees that ensemble averages
      remain accurate.'
