        default: 256
      density_rho:
        kind: slider
        label: Reduced Density rho*
        min: 0.1
        max: 0.9
        step: 0.05
        default: 0.65
    description_markdown: Decompose the total pressure into its kinetic ideal-gas component $P_{\text{id}} = \rho k_B T$ and
      the interatomic virial component $P_{\text{vir}} = \frac{1}{3V}\langle \sum \mathbf{r}_{ij}\cdot\mathbf{F}_{ij}\rangle$.
      Observe the transition from attraction-dominated ($P_{\text{vir}} < 0$) to repulsive-core-dominated ($P_{\text{vir}}
      > 0$) as density increases.
    takeaway_markdown: The virial estimator allows exact computation of bulk pressure in periodic boundary conditions without
      simulating physical container walls. At high liquid densities, the repulsive core virial dominates, causing total pressure
      $P$ to rise steeply above the ideal gas law ($Z = P/(\rho k_B T) \gg 1$).
  - id: q15_degrees_of_freedom_pbc
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_equipartition_and_virial
    prompt_markdown: In an MD simulation of $N = 250$ atoms with periodic boundary conditions and fixed total center-of-mass
      momentum ($\sum m_i \mathbf{v}_i = \mathbf{0}$), what is the exact number of independent degrees of freedom $N_{\text{dof}}$
      that must be used in the equipartition temperature estimator $T = 2 K / (N_{\text{dof}} k_B)$?
    hint_markdown: 3N coordinates minus 3 conserved center-of-mass momentum components.
    correct:
      value: 747
      tolerance: 0.01
    rationale_markdown: 'A 3D system of $N$ particles has $3N$ velocity components. Conserving the 3 components of total linear
      momentum removes 3 constraints: $N_{\text{dof}} = 3N - 3 = 3(250) - 3 = 747$.'
  - id: q16_virial_sign_meaning
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_equipartition_and_virial
    prompt_markdown: In a simulation of a Lennard-Jones gas at moderate density, the measured total pressure is $P = 0.8\rho
      k_B T$ (so the compressibility factor is $Z = 0.8 < 1$). What does this indicate about the internal virial term $\frac{1}{3V}\langle
      \sum \mathbf{r}_{ij} \cdot \mathbf{F}_{ij}\rangle$?
    options:
    - id: a
      text: The virial term is negative, meaning that attractive intermolecular forces dominate over core repulsions, pulling
        atoms inward.
      text_markdown: The virial term is negative, meaning that attractive intermolecular forces dominate over core repulsions,
        pulling atoms inward.
    - id: b
      text: The virial term is zero, meaning particles behave as an ideal gas.
      text_markdown: The virial term is zero, meaning particles behave as an ideal gas.
    - id: c
      text: The virial term is positive, meaning particles are colliding violently.
      text_markdown: The virial term is positive, meaning particles are colliding violently.
    - id: d
      text: The kinetic energy was measured incorrectly.
      text_markdown: The kinetic energy was measured incorrectly.
    correct: a
    hint_markdown: Consider whether attractive intermolecular forces act to increase or decrease the total pressure relative
      to a non-interacting gas at the same density.
    rationale_markdown: Since $P = \rho k_B T + P_{\text{vir}}$, having $P < \rho k_B T$ requires $P_{\text{vir}} < 0$. Intermolecular
      attractions produce forces directed toward each other ($\mathbf{r}_{ij} \cdot \mathbf{F}_{ij} < 0$), acting like an
      internal tension that reduces the outward pressure exerted on the box.
  - id: q17_pair_force_virial_simplification
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_equipartition_and_virial
    prompt_markdown: For central pairwise interatomic forces derived from a potential $V(r_{ij})$, the force on atom $i$ from
      atom $j$ is $\mathbf{F}_{ij} = -\frac{dV}{dr_{ij}} \frac{\mathbf{r}_{ij}}{r_{ij}}$. What is the scalar value of $\mathbf{r}_{ij}
      \cdot \mathbf{F}_{ij}$?
    options:
    - id: a
      text: $-r_{ij} \frac{dV}{dr_{ij}}$
      text_markdown: $-r_{ij} \frac{dV}{dr_{ij}}$
    - id: b
      text: $+r_{ij}^2 \frac{dV}{dr_{ij}}$
      text_markdown: $+r_{ij}^2 \frac{dV}{dr_{ij}}$
    - id: c
      text: $-\frac{1}{r_{ij}} \frac{dV}{dr_{ij}}$
      text_markdown: $-\frac{1}{r_{ij}} \frac{dV}{dr_{ij}}$
    - id: d
      text: 0, because force is always perpendicular to separation
      text_markdown: 0, because force is always perpendicular to separation
    correct: a
    hint_markdown: Take the dot product of r_ij with -(dV/dr_ij) * (r_ij / r_ij). Note that r_ij. R_ij = r_ij^2.
    rationale_markdown: $\mathbf{r}_{ij} \cdot \mathbf{F}_{ij} = \mathbf{r}_{ij} \cdot \left( -\frac{dV}{dr_{ij}} \frac{\mathbf{r}_{ij}}{r_{ij}}
      \right) = -\frac{dV}{dr_{ij}} \frac{|\mathbf{r}_{ij}|^2}{r_{ij}} = -r_{ij} \frac{dV}{dr_{ij}}$. This simple scalar product
      is accumulated directly during the pairwise force loop.
