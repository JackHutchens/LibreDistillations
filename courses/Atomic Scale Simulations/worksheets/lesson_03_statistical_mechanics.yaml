  - id: q18_microcanonical_estimator_c_v
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_ensembles_and_partition_function
    prompt_markdown: In the microcanonical ensemble ($NVE$), total energy cannot fluctuate ($\sigma_E = 0$). How can the constant-volume
      heat capacity $C_V$ be calculated from an $NVE$ simulation (Lebowitz-Percus-Verlet formula)?
    options:
    - id: a
      text: 'From the kinetic energy fluctuations: $\langle \Delta K^2 \rangle_{\text{NVE}} / \langle K \rangle^2 = \frac{2}{3N}
        \left(1 - \frac{3N k_B}{2 C_V}\right)$.'
      text_markdown: 'From the kinetic energy fluctuations: $\langle \Delta K^2 \rangle_{\text{NVE}} / \langle K \rangle^2
        = \frac{2}{3N} \left(1 - \frac{3N k_B}{2 C_V}\right)$.'
    - id: b
      text: It cannot be calculated from NVE under any circumstances.
      text_markdown: It cannot be calculated from NVE under any circumstances.
    - id: c
      text: By measuring the volume fluctuations.
      text_markdown: By measuring the volume fluctuations.
    - id: d
      text: By differentiating total energy with respect to simulation time.
      text_markdown: By differentiating total energy with respect to simulation time.
    correct: a
    hint_markdown: Although total energy E = K + V is constant, kinetic energy K and potential energy V exchange fluctuations.
    rationale_markdown: 'In $NVE$, total energy is strictly conserved, but kinetic and potential energies exchange: $\Delta
      K = -\Delta V$. Lebowitz, Percus, and Verlet derived that the relative variance of kinetic energy directly yields the
      microcanonical heat capacity: $\frac{\langle \Delta K^2 \rangle}{\langle K \rangle^2} = \frac{2}{3N} \left( 1 - \frac{3N
      k_B}{2 C_V} \right)$.'
  - id: q19_ideal_gas_law_from_virial
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_equipartition_and_virial
    prompt_markdown: In the macroscopic virial equation of state, total pressure is decomposed into kinetic and configurational
      pair contributions. When intermolecular interactions vanish identically (non-interacting particles), which thermodynamic
      relation is recovered?
    options:
    - id: a
      text: $P = \rho k_B T$ (the ideal gas law $P V = N k_B T$).
      text_markdown: $P = \rho k_B T$ (the ideal gas law $P V = N k_B T$).
    - id: b
      text: $P = 0$, because pressure requires forces.
      text_markdown: $P = 0$, because pressure requires forces.
    - id: c
      text: $P = \infty$.
      text_markdown: $P = \infty$.
    - id: d
      text: $P = \frac{3}{2 k_B T}$.
      text_markdown: $P = \frac{3}{2 k_B T}$.
    correct: a
    hint_markdown: Consider the contribution of interatomic forces to the internal virial stress when the potential energy
      is identically zero.
    rationale_markdown: When interatomic forces $\mathbf{F}_{ij} = 0$, the internal virial vanishes, yielding $P = \rho k_B
      T = \frac{N k_B T}{V} \implies P V = N k_B T$, which is exactly the ideal gas law.
  - id: q20_momentum_maxwell_boltzmann
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_ensembles_and_partition_function
    prompt_markdown: In classical canonical statistical mechanics, why does the momentum distribution factor completely independently
      from the spatial coordinate distribution, regardless of how complex or non-ideal the interatomic potential $V(\mathbf{r}^N)$
      is?
    options:
    - id: a
      text: 'Because the classical Hamiltonian separates into a sum of purely momentum-dependent kinetic energy and purely
        coordinate-dependent potential energy: H(r, p) = K(p) + V(r).'
      text_markdown: 'Because the classical Hamiltonian separates into a sum of purely momentum-dependent kinetic energy and
        purely coordinate-dependent potential energy: H(r, p) = K(p) + V(r).'
    - id: b
      text: Because momentum is conserved by Newton's third law.
      text_markdown: Because momentum is conserved by Newton's third law.
    - id: c
      text: Because particles do not interact in momentum space.
      text_markdown: Because particles do not interact in momentum space.
    - id: d
      text: Because temperature is independent of velocity.
      text_markdown: Because temperature is independent of velocity.
    correct: a
    hint_markdown: Consider exp(-beta H) when H = K(p) + V(r).
    rationale_markdown: Since $\mathcal{H}(\mathbf{r}^N, \mathbf{p}^N) = \sum_i \frac{p_i^2}{2m} + V(\mathbf{r}^N)$, the Boltzmann
      weight factors into $e^{-\beta \mathcal{H}} = e^{-\beta K(\mathbf{p}^N)} e^{-\beta V(\mathbf{r}^N)}$. The momentum integral
      is a product of uncoupled 1D Gaussians, yielding the universal Maxwell-Boltzmann distribution for any classical fluid,
      solid, or gas.
  - id: q21_gibbs_entropy_formula
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_ensembles_and_partition_function
    prompt_markdown: For any statistical ensemble with phase-space probability density $\rho(\boldsymbol{\Gamma})$, what is
      the general Gibbs definition of ensemble entropy?
    options:
    - id: a
      text: $S = -k_B \int \rho(\Gamma) \ln \rho(\Gamma)\,d\Gamma$
      text_markdown: $S = -k_B \int \rho(\Gamma) \ln \rho(\Gamma)\,d\Gamma$
    - id: b
      text: $S = +k_B \int \rho(\Gamma)^2\,d\Gamma$
      text_markdown: $S = +k_B \int \rho(\Gamma)^2\,d\Gamma$
    - id: c
      text: $S = k_B T \ln Z$
      text_markdown: $S = k_B T \ln Z$
    - id: d
      text: $S = \int H(\Gamma) \rho(\Gamma)\,d\Gamma$
      text_markdown: $S = \int H(\Gamma) \rho(\Gamma)\,d\Gamma$
    correct: a
    hint_markdown: Recall the information-theoretic Shannon/Gibbs entropy formula.
    rationale_markdown: The Gibbs entropy is $S = -k_B \langle \ln \rho \rangle = -k_B \int \rho(\boldsymbol{\Gamma}) \ln
      \rho(\boldsymbol{\Gamma})\, d\boldsymbol{\Gamma}$. For the microcanonical ensemble ($\rho = 1/\Omega$), this yields
      Boltzmann's $S = k_B \ln \Omega$; for the canonical ensemble, it yields $S = (\langle E \rangle - F)/T$.
  - id: q22_kinetic_temperature_fluctuation_nve
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_equipartition_and_virial
    prompt_markdown: In an $NVE$ molecular dynamics run of a liquid, why does the instantaneous kinetic temperature $T_{\text{kin}}(t)
      = \frac{2 K(t)}{N_{\text{dof}} k_B}$ fluctuate from step to step, even though the total energy $E = K(t) + V(t)$ is
      strictly conserved?
    options:
    - id: a
      text: As particles move, collisions convert kinetic energy into potential energy and vice versa; only their sum is constant.
      text_markdown: As particles move, collisions convert kinetic energy into potential energy and vice versa; only their
        sum is constant.
    - id: b
      text: The integrator has a bug that fails to conserve kinetic energy.
      text_markdown: The integrator has a bug that fails to conserve kinetic energy.
    - id: c
      text: The periodic boundary conditions create artificial velocity shocks.
      text_markdown: The periodic boundary conditions create artificial velocity shocks.
    - id: d
      text: Equipartition only holds at t = 0.
      text_markdown: Equipartition only holds at t = 0.
    correct: a
    hint_markdown: What happens to particle velocities when two atoms climb a repulsive potential hill?
    rationale_markdown: Conservative Newtonian dynamics preserves total energy $E = K + V$. When atoms climb up potential
      energy walls during repulsive collisions, kinetic energy drops ($K \downarrow$, $V \uparrow$); when they fall into attractive
      wells, kinetic energy increases ($K \uparrow$, $V \downarrow$). Thus $T_{\text{kin}}(t)$ fluctuates naturally around
      its thermodynamic mean.
  - id: q23_helmholtz_from_partition_function
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_ensembles_and_partition_function
    prompt_markdown: What fundamental relation connects the canonical partition function $Z(N, V, T)$ to the Helmholtz free
      energy $F$?
    options:
    - id: a
      text: $F = -k_B T \ln Z$
      text_markdown: $F = -k_B T \ln Z$
    - id: b
      text: $F = +k_B T Z$
      text_markdown: $F = +k_B T Z$
    - id: c
      text: $F = -\frac{1}{k_B T} \ln Z$
      text_markdown: $F = -\frac{1}{k_B T} \ln Z$
    - id: d
      text: $F = \frac{dZ}{dT}$
      text_markdown: $F = \frac{dZ}{dT}$
    correct: a
    hint_markdown: Recall the fundamental thermodynamic bridge relation connecting the canonical partition function to thermodynamic
      free energy.
    rationale_markdown: 'The bridge between statistical mechanics and thermodynamics in the canonical ensemble is $F = -k_B
      T \ln Z$. From $F$, all other thermodynamic variables follow: $P = -(\partial F/\partial V)_{N,T}$, $S = -(\partial
      F/\partial T)_{N,V}$, and $\mu = (\partial F/\partial N)_{V,T}$.'
  - id: q24_virial_cutoff_correction
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_equipartition_and_virial
    prompt_markdown: When interatomic potentials are truncated at cutoff radius $r_c$, what long-range tail correction must
      be added to the pressure $P_{\text{tail}}$ (assuming $g(r) \approx 1$ for $r > r_c$)?
    options:
    - id: a
      text: $P_{\text{tail}} = -\frac{2\pi\rho^2}{3}\int_{r_c}^\infty r^3 \frac{dV}{dr}\,dr$
      text_markdown: $P_{\text{tail}} = -\frac{2\pi\rho^2}{3}\int_{r_c}^\infty r^3 \frac{dV}{dr}\,dr$
    - id: b
      text: $P_{\text{tail}} = +4\pi\rho \int_{r_c}^\infty V(r)\,dr$
      text_markdown: $P_{\text{tail}} = +4\pi\rho \int_{r_c}^\infty V(r)\,dr$
    - id: c
      text: $P_{\text{tail}} = 0$, because forces beyond $r_c$ are exactly zero.
      text_markdown: $P_{\text{tail}} = 0$, because forces beyond $r_c$ are exactly zero.
    - id: d
      text: $P_{\text{tail}} = \rho k_B T e^{-r_c}$
      text_markdown: $P_{\text{tail}} = \rho k_B T e^{-r_c}$
    correct: a
    hint_markdown: Integrate the virial kernel -r * (dV/dr) * 4 pi r^2 rho dr from r_c to infinity.
    rationale_markdown: Integrating the virial sum $\frac{1}{3V} \sum \mathbf{r}_{ij} \cdot \mathbf{F}_{ij}$ over the uniform
      fluid background $g(r) \approx 1$ beyond $r_c$ gives $P_{\text{tail}} = -\frac{2\pi\rho^2}{3} \int_{r_c}^\infty r^3
      \frac{dV}{dr} dr$. For Lennard-Jones $12-6$, this tail correction is negative and scales as $r_c^{-3}$.
  - id: q25_lyapunov_divergence_measure
    type: problem
    question_type: numeric
