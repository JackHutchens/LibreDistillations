      text_markdown: It can be applied to periodic boundary conditions using minimum-image pair vectors $\mathbf{r}_{ij}$.
    - id: c
      text: It is valid only for ideal gases and fails when interatomic forces exist.
      text_markdown: It is valid only for ideal gases and fails when interatomic forces exist.
    - id: d
