    - id: c
      text: Entropy would be halved.
      text_markdown: Entropy would be halved.
    - id: d
      text: Entropy would become negative.
      text_markdown: Entropy would become negative.
    correct: a
    hint_markdown: Consider ln(V^N) vs ln(V^N / N!).
    rationale_markdown: Without $N!$, $\ln(V^N) = N \ln V$. When $N \to 2N$ and $V \to 2V$, $2N \ln(2V) = 2(N \ln V) + 2N
      \ln 2$. The extra non-extensive term $2N k_B \ln 2$ is the Gibbs paradox, cured by subtracting $\ln N! \approx N \ln
      N - N$.
  - id: q28_pressure_estimator_virial_ideal
    type: problem
    question_type: multi_select
    difficulty: medium
    taught_by: sec_equipartition_and_virial
    prompt_markdown: Which of the following statements about the virial pressure estimator are correct?
    options:
    - id: a
      text: It computes the bulk macroscopic pressure directly from internal pair coordinates and forces without needing physical
        walls.
      text_markdown: It computes the bulk macroscopic pressure directly from internal pair coordinates and forces without
        needing physical walls.
    - id: b
