  - id: q29_collective_vs_self_green_kubo
    type: problem
    taught_by: sec_green_kubo_transport_and_hydro_tails
    difficulty: medium
    question_type: single_select
    prompt_markdown: Why can the self-diffusion coefficient $D$ be averaged over all
      $N$ individual particles ($D = \frac{1}{3N}\sum_{i=1}^N \int_0^\infty \langle
      \mathbf{v}_i(t)\cdot\mathbf{v}_i(0)\rangle dt$, giving $N$ independent samples
      per snapshot), whereas the shear viscosity $\eta = \frac{\Omega}{k_B T}\int_0^\infty
      \langle \sigma_{xy}(t)\sigma_{xy}(0)\rangle dt$ and thermal conductivity $\lambda_T$
      have much larger statistical noise for the same trajectory length?
    hint_markdown: Is $\sigma_{xy}(t)$ a single-particle property or a single collective
      box-wide observable?
    options:
    - id: a
      text: Because viscosity cannot be computed in 3D.
      text_markdown: Because viscosity cannot be computed in 3D.
    - id: b
      text: Because $\sigma_{xy}(t)$ is only defined for $N = 1$ particle.
      text_markdown: Because $\sigma_{xy}(t)$ is only defined for $N = 1$ particle.
    - id: c
      text: Because the velocity autocorrelation function never decays to zero.
      text_markdown: Because the velocity autocorrelation function never decays to
        zero.
    - id: d
      text: Because self-diffusion is a single-particle property (allowing averaging
        over all $N$ atoms), whereas $\sigma_{xy}(t)$, $\mathbf{J}^Q(t)$, and $\mathbf{J}^e(t)$
        are collective global observables of the entire box (providing only $1$ sample
        per time origin).
      text_markdown: Because self-diffusion is a single-particle property (allowing
        averaging over all $N$ atoms), whereas $\sigma_{xy}(t)$, $\mathbf{J}^Q(t)$,
        and $\mathbf{J}^e(t)$ are collective global observables of the entire box
        (providing only $1$ sample per time origin).
    correct: d
    rationale_markdown: Self-diffusion tracks individual tagged particles $\mathbf{v}_i(t)$,
      so a single simulation of $N$ atoms gives $N$ nearly independent velocity autocorrelation
      trajectories. In contrast, the stress tensor $\sigma_{xy}(t)$ and heat current
      $\mathbf{J}^Q(t)$ are collective sums over the entire box, providing only a
      single scalar time series and therefore requiring roughly $N\times$ longer trajectories
      for comparable relative error (**A**).
  - id: q30_nemd_thermostat_requirement
    type: problem
    taught_by: sec_green_kubo_transport_and_hydro_tails
    difficulty: medium
    question_type: single_select
    prompt_markdown: when evaluating a transport coefficient via a **non-equilibrium
      simulation (NEMD)**—for example, by applying a continuous external electric
      field $\mathbf{E}$ or continuous shear rate $\dot{\gamma}$—why is it mandatory
      to couple the system to a **thermostat**?
    hint_markdown: What happens to the internal energy and temperature when an external
      force continuously does dissipative work ($P_{\text{diss}} = \sigma_{\text{el}}
      E^2 > 0$ or $\eta \dot{\gamma}^2 > 0$) on a closed system?
    options:
    - id: a
      text: Because the external driving field continuously performs irreversible
        work (viscous or Joule heating) on the system; without a thermostat to extract
        this heat, the energy and temperature would drift upward indefinitely instead
        of reaching a steady state.
      text_markdown: Because the external driving field continuously performs irreversible
        work (viscous or Joule heating) on the system; without a thermostat to extract
        this heat, the energy and temperature would drift upward indefinitely instead
        of reaching a steady state.
    - id: b
      text: Because without a thermostat, all particles stop moving immediately when
        an electric field is applied.
      text_markdown: Because without a thermostat, all particles stop moving immediately
