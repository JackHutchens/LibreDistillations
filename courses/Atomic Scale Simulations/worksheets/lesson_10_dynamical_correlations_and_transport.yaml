      = e^{-D k^2 t}$. What is the shape and half-width at half-maximum (HWHM) $\Gamma(k)$
      of the corresponding self-dynamical structure factor $S_s(k, \omega) = \int_{-\infty}^\infty
      \frac{dt}{2\pi} e^{i\omega t} F_s(k, t)$?
    hint_markdown: The Fourier transform of a two-sided exponential $e^{-D k^2 |t|}$
      is a Lorentzian $\frac{1}{\pi}\frac{D k^2}{\omega^2 + (D k^2)^2}$.
    options:
    - id: a
      text: A Lorentzian peak centered at $\omega = 0$ whose half-width at half-maximum
        scales quadratically with wavevector, $\Gamma(k) = D k^2$.
      text_markdown: A Lorentzian peak centered at $\omega = 0$ whose half-width at
        half-maximum scales quadratically with wavevector, $\Gamma(k) = D k^2$.
    - id: b
      text: Two sharp delta functions at $\omega = \pm D k$.
      text_markdown: Two sharp delta functions at $\omega = \pm D k$.
    - id: c
      text: A Gaussian whose width is independent of $k$.
      text_markdown: A Gaussian whose width is independent of $k$.
    - id: d
      text: A step function that vanishes for all $|\omega| < D k^2$.
      text_markdown: A step function that vanishes for all $|\omega| < D k^2$.
    correct: a
    rationale_markdown: Because $F_s(k, t) = e^{-D k^2 |t|}$ decays exponentially
      with rate $\Gamma(k) = D k^2$, its temporal Fourier transform is a Lorentzian
      quasielastic peak centered at $\omega = 0$ with HWHM $\Gamma(k) = D k^2$ (**A**).
      Inelastic/quasielastic neutron scattering experiments measure $D$ directly by
      plotting the Lorentzian linewidth $\Gamma(k)$ vs. $k^2$.
  - id: q36_isf_decay_time_numeric
    type: problem
    taught_by: sec_synthesis_and_advanced_problems
    difficulty: medium
    question_type: numeric
    prompt_markdown: A liquid has self-diffusion coefficient $D = 0.25\,\text{Å}^2/\text{ps}$.
      At wavevector $k = 0.40\,\text{Å}^{-1}$ in the diffusive regime where the self-intermediate
      scattering function follows $F_s(k, t) = \exp(-D k^2 t)$, what is the relaxation
      time $\tau_k$ (in $\text{ps}$) required for $F_s(k, t)$ to decay to $1/e$ of
      its initial value?
    hint_markdown: Determine the characteristic time constant for an exponential decay
      governed by the diffusive wavevector decay rate.
    correct:
      value: 25.0
      tolerance: 0.2
    rationale_markdown: |-
      The diffusive relaxation rate at $k = 0.40\,\text{Å}^{-1}$ is:
      $$\Gamma(k) = D k^2 = 0.25\,\text{Å}^2/\text{ps} \times (0.40\,\text{Å}^{-1})^2 = 0.25 \times 0.16 = 0.04\,\text{ps}^{-1}$$
      The $1/e$ decay time is therefore $\tau_k = \frac{1}{0.04\,\text{ps}^{-1}} = 25.0\,\text{ps}$.
  - id: q37_green_kubo_viscosity_numeric
