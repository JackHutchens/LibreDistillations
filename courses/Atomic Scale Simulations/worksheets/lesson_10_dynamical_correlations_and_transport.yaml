    hint_markdown: 'Look at the two labels next to Fick''s equations: ''Linear response
      + Conservation of mass''.'
    options:
    - id: a
      text: Newton's third law and the ideal gas equation of state.
      text_markdown: Newton's third law and the ideal gas equation of state.
    - id: b
      text: Fick's First Law of linear response ($\mathbf{j} = -D\nabla\rho$) and
        local conservation of mass (the continuity equation $\frac{\partial \rho}{\partial
        t} = -\nabla\cdot\mathbf{j}$).
      text_markdown: Fick's First Law of linear response ($\mathbf{j} = -D\nabla\rho$)
        and local conservation of mass (the continuity equation $\frac{\partial \rho}{\partial
        t} = -\nabla\cdot\mathbf{j}$).
    - id: c
