      $$\int_0^\infty dt\, \left\langle \sigma_{xy}(t)\, \sigma_{xy}(0) \right\rangle = 0.0024$$
      (in reduced units of $\text{pressure}^2 \times \text{time}$). Using the Green-Kubo formula $\eta = \frac{\Omega}{k_B T}\int_0^\infty dt\,\langle \sigma_{xy}(t)\sigma_{xy}(0)\rangle$, calculate the shear viscosity $\eta$ in reduced units.
