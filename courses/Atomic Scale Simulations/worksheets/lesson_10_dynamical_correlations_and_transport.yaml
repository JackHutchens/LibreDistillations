      text_markdown: The Debye-Waller factor and Lindemann's melting criterion.
    - id: d
      text: Quantum detailed balance and the virial pressure theorem.
      text_markdown: Quantum detailed balance and the virial pressure theorem.
    correct: b
    rationale_markdown: Substituting the linear constitutive relation $\mathbf{j}(\mathbf{r},
      t) = -D\nabla\rho(\mathbf{r}, t)$ (Fick's 1st law) into the mass continuity
      equation $\frac{\partial \rho}{\partial t} = -\nabla\cdot\mathbf{j}$ yields
      $\frac{\partial \rho}{\partial t} = D\nabla^2\rho$ (**A**).
  - id: q15_einstein_dimension_prefactor
    type: problem
    taught_by: sec_diffusion_einstein_and_green_kubo
    difficulty: easy
    question_type: single_select
    prompt_markdown: In a $d$-dimensional isotropic fluid, how do the geometric dimensionality
      prefactors relate the self-diffusion coefficient $D$ to the mean-squared displacement
      $\langle |\mathbf{r}(t) - \mathbf{r}(0)|^2 \rangle$ and the velocity autocorrelation
      integral $\int_0^\infty \langle \mathbf{v}(t)\cdot\mathbf{v}(0)\rangle dt$ for
      a **2D monolayer** ($d=2$) versus a **3D bulk fluid** ($d=3$)?
    hint_markdown: Consider the number of independent spatial dimensions contributing
      to the total particle displacement and velocity vector dot product.
    options:
    - id: a
      text: 'In 2D: $\text{MSD} = 2 D t$; in 3D: $\text{MSD} = 3 D t$.'
      text_markdown: 'In 2D: $\text{MSD} = 2 D t$; in 3D: $\text{MSD} = 3 D t$.'
    - id: b
      text: 'In both 2D and 3D: $\text{MSD} = 6 D t$ and $D = \frac{1}{3}\int_0^\infty
        \langle \mathbf{v}(t)\cdot\mathbf{v}(0)\rangle dt$.'
      text_markdown: 'In both 2D and 3D: $\text{MSD} = 6 D t$ and $D = \frac{1}{3}\int_0^\infty
        \langle \mathbf{v}(t)\cdot\mathbf{v}(0)\rangle dt$.'
    - id: c
      text: 'In 2D: $\text{MSD} = 4 D t$ and $D = \frac{1}{2}\int_0^\infty \langle
        \mathbf{v}(t)\cdot\mathbf{v}(0)\rangle dt$; in 3D: $\text{MSD} = 6 D t$ and
        $D = \frac{1}{3}\int_0^\infty \langle \mathbf{v}(t)\cdot\mathbf{v}(0)\rangle
        dt$.'
      text_markdown: 'In 2D: $\text{MSD} = 4 D t$ and $D = \frac{1}{2}\int_0^\infty
        \langle \mathbf{v}(t)\cdot\mathbf{v}(0)\rangle dt$; in 3D: $\text{MSD} = 6
        D t$ and $D = \frac{1}{3}\int_0^\infty \langle \mathbf{v}(t)\cdot\mathbf{v}(0)\rangle
        dt$.'
    - id: d
      text: 'In 2D: $\text{MSD} = 4 D t^2$; in 3D: $\text{MSD} = 6 D t^2$.'
      text_markdown: 'In 2D: $\text{MSD} = 4 D t^2$; in 3D: $\text{MSD} = 6 D t^2$.'
    correct: c
    rationale_markdown: Each independent Cartesian coordinate ($x, y, \dots$) contributes
      $2Dt$ to the mean-squared displacement and $D$ to the velocity integral $\int_0^\infty
      \langle v_\alpha(t)v_\alpha(0)\rangle dt$. Hence in $d=2$, $\text{MSD} = 4Dt$
      and $D = \frac{1}{2}\int_0^\infty \langle \mathbf{v}(t)\cdot\mathbf{v}(0)\rangle
      dt$, whereas in $d=3$, $\text{MSD} = 6Dt$ and $D = \frac{1}{3}\int_0^\infty
      \langle \mathbf{v}(t)\cdot\mathbf{v}(0)\rangle dt$ (**A**).
  - id: q16_msd_short_time_ballistic
    type: problem
    taught_by:
    - sec_diffusion_einstein_and_green_kubo
    - concept_vacf_msd_duality
    difficulty: medium
    question_type: single_select
    prompt_markdown: At very short times $t \ll \tau_c$ (before a particle experiences
      significant collisions with its neighbors), how does the 3D mean-squared displacement
      $\langle |\mathbf{r}_i(t) - \mathbf{r}_i(0)|^2 \rangle$ scale with time $t$
      and temperature $T$?
    hint_markdown: At $t \to 0$, $\mathbf{r}_i(t) - \mathbf{r}_i(0) \approx \mathbf{v}_i(0)
      t$. Use equipartition $\langle v^2 \rangle = 3 k_B T / m$.
    options:
    - id: a
      text: 'Inversely with time: $\langle |\Delta\mathbf{r}(t)|^2 \rangle \propto
        t^{-3/2}$.'
      text_markdown: 'Inversely with time: $\langle |\Delta\mathbf{r}(t)|^2 \rangle
        \propto t^{-3/2}$.'
    - id: b
      text: 'Linearly in time: $\langle |\Delta\mathbf{r}(t)|^2 \rangle = 6 D t$ even
        at $t \to 0$.'
      text_markdown: 'Linearly in time: $\langle |\Delta\mathbf{r}(t)|^2 \rangle =
        6 D t$ even at $t \to 0$.'
    - id: c
      text: 'Exponentially in time: $\langle |\Delta\mathbf{r}(t)|^2 \rangle \propto
        e^{t/\tau_c}$.'
      text_markdown: 'Exponentially in time: $\langle |\Delta\mathbf{r}(t)|^2 \rangle
        \propto e^{t/\tau_c}$.'
    - id: d
      text: 'Ballistically (quadratically in time): $\langle |\Delta\mathbf{r}(t)|^2
        \rangle \approx \langle v^2 \rangle t^2 = \left(\frac{3 k_B T}{m}\right) t^2$.'
      text_markdown: 'Ballistically (quadratically in time): $\langle |\Delta\mathbf{r}(t)|^2
        \rangle \approx \langle v^2 \rangle t^2 = \left(\frac{3 k_B T}{m}\right) t^2$.'
    correct: d
    rationale_markdown: For $t \ll \tau_c$, velocity hasn't changed yet ($\mathbf{v}_i(t)
      \approx \mathbf{v}_i(0)$), so $\Delta\mathbf{r}_i(t) \approx \mathbf{v}_i(0)
      t$. Squaring and averaging with classical equipartition $\frac{1}{2}m\langle
      v^2\rangle = \frac{3}{2}k_B T$ gives the ballistic law $\langle |\Delta\mathbf{r}(t)|^2\rangle
      = \frac{3k_B T}{m} t^2$ (**A**).
  - id: q17_einstein_msd_slope_numeric
    type: problem
    taught_by:
    - sec_diffusion_einstein_and_green_kubo
    - concept_vacf_msd_duality
    difficulty: easy
