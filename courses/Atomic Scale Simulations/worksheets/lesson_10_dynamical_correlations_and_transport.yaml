    rationale_markdown: |-
      Substituting $\Omega = 1000$, $k_B T = 0.80$, and the integral $0.0024$:
      $$\eta = \frac{1000}{0.80} \times 0.0024 = 1250 \times 0.0024 = 3.0$$
  - id: q38_vacf_piecewise_integral_numeric
    type: problem
    taught_by:
    - sec_diffusion_einstein_and_green_kubo
    - concept_vacf_msd_duality
    difficulty: hard
    question_type: numeric
    prompt_markdown: |-
      In a 3D dense liquid, the velocity autocorrelation function $C_{vv}(t) = \langle \mathbf{v}_i(t)\cdot\mathbf{v}_i(0) \rangle$ has a positive initial lobe over $0 \le t \le t_1$ with area:
      $$\int_0^{t_1} C_{vv}(t)\, dt = +1.80\,\text{Å}^2/\text{ps}$$
      followed by a negative cage-backscattering lobe over $t > t_1$ with area:
      $$\int_{t_1}^\infty C_{vv}(t)\, dt = -0.60\,\text{Å}^2/\text{ps}$$
      Using the 3D Green-Kubo relation $D = \frac{1}{3}\int_0^\infty C_{vv}(t)\, dt$, what is the asymptotic self-diffusion coefficient $D$ in $\text{Å}^2/\text{ps}$?
    hint_markdown: Combine the integrals over the two time intervals to find the total
      area under the velocity autocorrelation curve before applying the Green-Kubo
      prefactor.
    correct:
      value: 0.4
      tolerance: 0.01
    rationale_markdown: |-
      The net time integral of the 3D VACF is $+1.80 - 0.60 = 1.20\,\text{Å}^2/\text{ps}$. Dividing by $3$ gives:
      $$D = \frac{1}{3}(1.80 - 0.60) = \frac{1.20}{3} = 0.40\,\text{Å}^2/\text{ps}$$
      Notice how cage backscattering reduces the final diffusivity from its peak running value $1.80/3 = 0.60\,\text{Å}^2/\text{ps}$ down to $0.40\,\text{Å}^2/\text{ps}$.
  - id: q39_nernst_einstein_electrical_conductivity
    type: problem
    taught_by:
    - sec_green_kubo_transport_and_hydro_tails
    - sec_synthesis_and_advanced_problems
    difficulty: hard
    question_type: single_select
    prompt_markdown: |-
      The Green-Kubo formula for electrical conductivity substitutes the total electric current $\mathbf{J}(t) = \sum_{i=1}^N q_i \mathbf{v}_i(t)$ into $\sigma_{\text{el}} = \frac{1}{3\Omega k_B T}\int_0^\infty dt\, \langle \mathbf{J}(t)\cdot\mathbf{J}(0)\rangle$. Expanding the double sum over ions $i$ and $j$ gives:
      $$\sigma_{\text{el}} = \frac{1}{3\Omega k_B T} \sum_{i=1}^N q_i^2 \int_0^\infty \langle \mathbf{v}_i(t)\cdot\mathbf{v}_i(0)\rangle dt + \frac{1}{3\Omega k_B T} \sum_{i \neq j} q_i q_j \int_0^\infty \langle \mathbf{v}_i(t)\cdot\mathbf{v}_j(0)\rangle dt$$
      If distinct ions move independently so that the cross-velocity correlations $\langle \mathbf{v}_i(t)\cdot\mathbf{v}_j(0)\rangle = 0$ for $i \neq j$, and all $N$ ions carry charge magnitude $|q_i| = q$ and have self-diffusion coefficient $D$, what does $\sigma_{\text{el}}$ simplify to?
    hint_markdown: Express the uncorrelated single-particle velocity integrals in
      terms of the self-diffusion coefficient and the ion number density.
    options:
    - id: a
      text: $\sigma_{\text{el}} = 0$ because positive and negative charges cancel
        in $q_i^2$.
      text_markdown: $\sigma_{\text{el}} = 0$ because positive and negative charges
        cancel in $q_i^2$.
    - id: b
      text: The Nernst-Einstein relation $\sigma_{\text{el}} = \frac{\rho q^2 D}{k_B
        T}$ (where $\rho = N/\Omega$).
      text_markdown: The Nernst-Einstein relation $\sigma_{\text{el}} = \frac{\rho
        q^2 D}{k_B T}$ (where $\rho = N/\Omega$).
    - id: c
      text: $\sigma_{\text{el}} = \frac{k_B T}{\rho q^2 D}$.
      text_markdown: $\sigma_{\text{el}} = \frac{k_B T}{\rho q^2 D}$.
    - id: d
      text: $\sigma_{\text{el}} = N^2 q^2 D$.
      text_markdown: $\sigma_{\text{el}} = N^2 q^2 D$.
    correct: b
    rationale_markdown: Since $q_i^2 = (+q)^2 = (-q)^2 = q^2 > 0$ for both cations
      and anions, and $\frac{1}{3}\int_0^\infty \langle \mathbf{v}_i(t)\cdot\mathbf{v}_i(0)\rangle
      dt = D$, the self-term sum gives $\frac{N q^2 D}{\Omega k_B T} = \frac{\rho
      q^2 D}{k_B T}$, which is the celebrated **Nernst-Einstein equation** (**A**).
      Deviations from Nernst-Einstein in concentrated electrolytes or ionic liquids
      arise directly from the cross-correlation terms ($i \neq j$, e.g., cation-anion
      pair association).
  - id: q40_finite_size_cutoff_hydro_tail
    type: problem
    taught_by:
    - sec_green_kubo_transport_and_hydro_tails
    - concept_alder_wainwright_explorer
    difficulty: hard
    question_type: single_select
    prompt_markdown: In a finite periodic MD box of side length $L$ with sound speed
      $c_s$, up to what maximum time $t_{\max}$ can you observe the true infinite-system
      Alder–Wainwright hydrodynamic tail $C_{vv}(t) \propto t^{-d/2}$ before periodic
      boundary artifacts corrupt the correlation function?
    hint_markdown: How long does it take an acoustic compression wave traveling at
      speed $c_s$ to cross the periodic box of length $L$ and re-enter from the opposite
      side?
    options:
    - id: a
      text: Out to $t = \infty$ regardless of how small $L$ is.
      text_markdown: Out to $t = \infty$ regardless of how small $L$ is.
    - id: b
      text: Only for $t < \Delta t$ (a single MD integration step).
      text_markdown: Only for $t < \Delta t$ (a single MD integration step).
    - id: c
      text: Up to the acoustic traversal time $t_{\max} \sim L / c_s$, when the hydrodynamic
        sound/vortex wave wraps around the periodic box and interferes with the particle.
      text_markdown: Up to the acoustic traversal time $t_{\max} \sim L / c_s$, when
        the hydrodynamic sound/vortex wave wraps around the periodic box and interferes
        with the particle.
    - id: d
      text: Only when $L = 0$.
      text_markdown: Only when $L = 0$.
    correct: c
    rationale_markdown: A moving particle launches an acoustic compression wave at
      speed $c_s$ and a shear vortex wave. Once $t \gtrsim L / c_s$, the sound pulse
      crosses the periodic boundary of the box of side $L$ and strikes the particle
      artificially from behind, corrupting $C_{vv}(t)$ for $t > L/c_s$ (**A**). This
      is why Alder and Wainwright needed large hard-sphere systems to cleanly resolve
      the $t^{-d/2}$ regime.
  - id: q41_time_correlation_symmetry_even
    type: problem
    taught_by: sec_static_perturbation_and_time_correlations
    difficulty: medium
    question_type: single_select
    prompt_markdown: For a classical real observable $A$ whose microscopic value is
