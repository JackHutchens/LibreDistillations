      text_markdown: Stress tensor $\sigma_{xy}(t)$ for $\lambda_T$, and particle
        density $\rho_{\mathbf{k}}(t)$ for $\sigma_{\text{el}}$.
    - id: c
      text: Microscopic energy (heat) current $\mathbf{J}^Q(t)$ for $\lambda_T$, and
        total electrical current $\mathbf{J}(t) = \sum_i q_i \mathbf{v}_i(t)$ for
