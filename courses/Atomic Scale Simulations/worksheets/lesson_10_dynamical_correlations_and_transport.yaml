  - id: sec_synthesis_and_advanced_problems
    type: markdown_section
    title: '5. Synthesis: Connecting Microscopic Fluctuations, Scattering, and Transport'
    body_markdown: |-
      ### Summary of Key Dynamical Identities
      1. **Static Susceptibility & Structure Factor:**
       $$\left.\frac{\partial \langle B \rangle_\lambda}{\partial \lambda}\right|_{\lambda=0} = -\beta \langle \delta B\, \delta A \rangle_0, \qquad \left.\frac{\partial \langle \rho_{-\mathbf{k}} \rangle}{\partial \lambda_{\mathbf{k}}}\right|_{\lambda=0} = -\beta N S(\mathbf{k})$$
      2. **Self-Part of Intermediate Scattering Function $F_s(\mathbf{k}, t)$ in the Diffusive Limit:**
       For a tagged diffusing particle whose displacement $\Delta\mathbf{r}(t) = \mathbf{r}_i(t) - \mathbf{r}_i(0)$ is Gaussian with $\langle |\Delta\mathbf{r}(t)|^2 \rangle = 6Dt$ (in 3D), the self-intermediate scattering function is:
       $$F_s(k, t) = \left\langle e^{i\mathbf{k}\cdot[\mathbf{r}_i(t) - \mathbf{r}_i(0)]} \right\rangle = \exp\!\left(-\frac{1}{6} k^2 \langle |\Delta\mathbf{r}(t)|^2 \rangle\right) = e^{-D k^2 t}$$
       Taking the time Fourier transform gives a **Lorentzian quasielastic peak** in $S_s(k, \omega)$ of half-width at half-maximum (HWHM) $\Gamma(k) = D k^2$:
       $$S_s(k, \omega) = \frac{1}{\pi} \frac{D k^2}{\omega^2 + (D k^2)^2}$$
      3. **Einstein–Green-Kubo Equivalence & Nernst-Einstein Relation:**
       - Self-diffusion (3D): $D = \lim_{t\to\infty} \frac{1}{6t}\langle |\mathbf{r}_i^{\text{unwrap}}(t) - \mathbf{r}_i(0)|^2 \rangle = \frac{1}{3}\int_0^\infty \langle \mathbf{v}_i(t)\cdot\mathbf{v}_i(0)\rangle dt$.
       - If ion velocities in an electrolyte are uncorrelated between distinct ions ($i \neq j$), the electrical conductivity Green-Kubo integral $\sigma_{\text{el}} = \frac{1}{3\Omega k_B T}\int_0^\infty \langle \mathbf{J}(t)\cdot\mathbf{J}(0)\rangle dt$ simplifies to the **Nernst-Einstein relation** $\sigma_{\text{el}} = \frac{\rho q^2 D}{k_B T}$ (equivalently, mobility $\mu = D / (k_B T)$).
  - id: q35_self_isf_gaussian_diffusion
    type: problem
    taught_by: sec_synthesis_and_advanced_problems
    difficulty: medium
    question_type: single_select
    prompt_markdown: In the hydrodynamic diffusive regime ($k \to 0, t \gg \tau_c$),
