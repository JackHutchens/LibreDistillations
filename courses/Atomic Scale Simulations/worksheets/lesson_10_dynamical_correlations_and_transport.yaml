      = C_{AA}(t)$ imply for its initial time derivative $\left.\frac{d C_{AA}(t)}{dt}\right|_{t=0}$
      (for smooth Hamiltonian trajectories) and its Fourier transform $C_{AA}(\omega)$?
    hint_markdown: What is the slope at $t = 0$ of any smooth even function $f(-t)
      = f(t)$ (such as $\cos(\omega t)$ or $1 - a t^2$)?
    options:
    - id: a
      text: $C_{AA}(t)$ must increase linearly with $t$ near $t = 0$.
      text_markdown: $C_{AA}(t)$ must increase linearly with $t$ near $t = 0$.
    - id: b
      text: $C_{AA}(\omega)$ is purely imaginary and odd in $\omega$.
      text_markdown: $C_{AA}(\omega)$ is purely imaginary and odd in $\omega$.
    - id: c
      text: The initial value $C_{AA}(0)$ must be zero.
      text_markdown: The initial value $C_{AA}(0)$ must be zero.
    - id: d
      text: The initial slope at $t = 0$ vanishes ($\dot{C}_{AA}(0) = 0$, so $C_{AA}(t)$
        starts with a flat parabolic top $C_{AA}(0) - \frac{1}{2}\langle \dot{A}^2\rangle
        t^2$), and $C_{AA}(\omega)$ is purely real and even in $\omega$.
      text_markdown: The initial slope at $t = 0$ vanishes ($\dot{C}_{AA}(0) = 0$,
        so $C_{AA}(t)$ starts with a flat parabolic top $C_{AA}(0) - \frac{1}{2}\langle
        \dot{A}^2\rangle t^2$), and $C_{AA}(\omega)$ is purely real and even in $\omega$.
    correct: d
    rationale_markdown: 'Under smooth Hamiltonian dynamics, any classical autocorrelation
      function $C_{AA}(t) = \langle \delta A(0)\delta A(t)\rangle$ is an even function
      of $t$: $\dot{C}_{AA}(0) = \langle \delta A(0)\dot{A}(0)\rangle = \frac{1}{2}\frac{d}{dt}\langle
      (\delta A)^2\rangle = 0$. Therefore, $C_{AA}(t)$ starts out flat at $t = 0$
      ($C_{AA}(t) = C_{AA}(0) - \frac{1}{2}\langle \dot{A}^2\rangle t^2 + \dots$)
      and its Fourier transform $C_{AA}(\omega)$ is real, even, and non-negative (**A**).'
