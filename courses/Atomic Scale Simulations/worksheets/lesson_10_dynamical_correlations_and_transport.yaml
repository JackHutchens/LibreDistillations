    options:
    - id: a
      text: Both $\hat{c}_{vv}(0)$ and the peak height are identically zero in a liquid.
      text_markdown: Both $\hat{c}_{vv}(0)$ and the peak height are identically zero
        in a liquid.
    - id: b
      text: The zero-frequency intercept $\hat{c}_{vv}(0)$ is the shear viscosity
        $\eta$, and the peak is the ideal-gas pressure.
      text_markdown: The zero-frequency intercept $\hat{c}_{vv}(0)$ is the shear viscosity
        $\eta$, and the peak is the ideal-gas pressure.
    - id: c
      text: The zero-frequency intercept $\hat{c}_{vv}(0)$ is directly proportional
        to the self-diffusion constant $D$, while the finite-frequency peak reflects
        oscillatory rattling of atoms inside their transient neighbor cages.
      text_markdown: The zero-frequency intercept $\hat{c}_{vv}(0)$ is directly proportional
