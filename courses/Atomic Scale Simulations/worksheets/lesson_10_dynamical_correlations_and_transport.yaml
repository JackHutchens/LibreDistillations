  - id: sec_diffusion_einstein_and_green_kubo
    type: markdown_section
    title: 3. Fick's Laws and the Two Equivalent Routes to Self-Diffusion (Einstein
      MSD vs. Green-Kubo VACF)
    body_markdown: |-
      ### Macroscopic Diffusion: Fick's 1st and 2nd Laws
      When a tagged particle concentration gradient $\nabla \rho(\mathbf{r}, t)$ exists, **Fick's First Law** states that the diffusive particle flux $\mathbf{j}(\mathbf{r}, t)$ is proportional to the negative gradient:
      $$\mathbf{j}(\mathbf{r}, t) = -D\, \nabla \rho(\mathbf{r}, t)$$
      Combining Fick's First Law with local **conservation of mass** (the continuity equation $\frac{\partial \rho}{\partial t} + \nabla\cdot\mathbf{j} = 0$) yields **Fick's Second Law** (the diffusion equation):
      $$\frac{\partial \rho(\mathbf{r}, t)}{\partial t} = D\, \nabla^2 \rho(\mathbf{r}, t)$$
      In $d$ spatial dimensions, a point source $\rho(\mathbf{r}, 0) = \delta(\mathbf{r})$ spreads as a Gaussian packet $P(\mathbf{r}, t) = (4\pi D t)^{-d/2} \exp\!\left(-\frac{r^2}{4Dt}\right)$ whose second moment grows linearly with time:
      $$\left\langle |\mathbf{r}(t) - \mathbf{r}(0)|^2 \right\rangle = \int d^d r\, r^2 P(\mathbf{r}, t) = 2 d D t$$

      ### Route 1: The Einstein Mean-Squared Displacement (MSD) Relation
      In $d$ dimensions ($2d = 6$ in 3D, $4$ in 2D, $2$ in 1D), the self-diffusion constant $D$ is determined by the long-time slope of the **mean-squared displacement (MSD)**:
      $$D = \lim_{t \to \infty} \frac{1}{2 d t} \left\langle \left|\mathbf{r}_i(t) - \mathbf{r}_i(0)\right|^2 \right\rangle \quad \xrightarrow{d=3} \quad D = \lim_{t \to \infty} \frac{1}{6 t} \left\langle \left|\mathbf{r}_i(t) - \mathbf{r}_i(0)\right|^2 \right\rangle$$
      - **Short-Time Ballistic Regime ($t \ll \tau_c$):** Before colliding with neighbors, a particle moves at constant velocity $\mathbf{r}_i(t) - \mathbf{r}_i(0) \approx \mathbf{v}_i(0) t$, so $\text{MSD}(t) \approx \langle v^2 \rangle t^2 = \left(\frac{d k_B T}{m}\right) t^2$ (quadratic in $t$!).
      - **CRITICAL PBC RULE — Use Unwrapped ("Unwound") Positions:** In an MD simulation with periodic boundary conditions, whenever an atom crosses a box boundary its wrapped coordinate jumps by $\pm L$. If you plug PBC-wrapped coordinates $\mathbf{r}_{\text{wrapped}} \in [0, L)^3$ into the Einstein formula, $|\mathbf{r}_{\text{wrapped}}(t) - \mathbf{r}_{\text{wrapped}}(0)|^2$ **cannot exceed $3 L^2$** and saturates to a flat plateau $\sim L^2/2$, falsely giving $D = 0$! You **must** accumulate continuous, **unwound (unwrapped)** positions $\mathbf{r}_i^{\text{unwrap}}(t) = \mathbf{r}_i(0) + \int_0^t \mathbf{v}_i(t')\, dt'$.

      ### Route 2: The Green-Kubo Velocity Autocorrelation (VACF) Integral
      Writing the unwrapped displacement as the time integral of velocity, $\mathbf{r}_i(t) - \mathbf{r}_i(0) = \int_0^t dt'\, \mathbf{v}_i(t')$, we can prove the exact mathematical equivalence between the Einstein MSD and the **Green-Kubo** formula:
      $$\left\langle |\Delta\mathbf{r}(t)|^2 \right\rangle = \int_0^t dt' \int_0^t dt''\, \left\langle \mathbf{v}_i(t')\cdot\mathbf{v}_i(t'') \right\rangle = 2 \int_0^t dt' \int_0^{t'} d\tau\, \left\langle \mathbf{v}_i(\tau)\cdot\mathbf{v}_i(0) \right\rangle$$
      Differentiating with respect to $t$ and dividing by $2d$ (with $d=3$ in 3D) yields the **Green-Kubo formula for self-diffusion**:
      $$D = \frac{1}{d} \int_0^\infty dt\, \left\langle \mathbf{v}_i(t)\cdot\mathbf{v}_i(0) \right\rangle \quad \xrightarrow{d=3} \quad D = \frac{1}{3} \int_0^\infty dt\, \left\langle \mathbf{v}_i(t)\cdot\mathbf{v}_i(0) \right\rangle$$
      - **Dilute Gas:** Uncorrelated binary collisions cause $\langle \mathbf{v}(t)\cdot\mathbf{v}(0)\rangle = \frac{3k_B T}{m} e^{-t/\tau_c}$ to decay monotonically.
      - **Dense Liquid (Cage Effect):** Near the triple point, a moving atom quickly collides with its surrounding shell of nearest neighbors and rebounds backward, producing a pronounced **negative dip** ($\langle \mathbf{v}(t)\cdot\mathbf{v}(0)\rangle < 0$) before decaying to zero.
      - **Crystalline Solid:** Atoms oscillate harmonically around fixed lattice sites; positive and negative lobes of $\langle \mathbf{v}(t)\cdot\mathbf{v}(0)\rangle$ cancel so that the integral equals $D = 0$.
