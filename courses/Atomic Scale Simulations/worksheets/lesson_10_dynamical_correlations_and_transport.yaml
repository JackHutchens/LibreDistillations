worksheet:
  id: lesson_10_dynamical_correlations_and_transport
  title: Lesson 10 — Dynamical Correlations, Linear Response, and Transport Coefficients
  estimated_minutes: 115
  learning_objectives:
  - Derive static linear response from perturbation theory and explain why the static
    structure factor S(k) governs the linear density response to an external field.
  - Apply stationarity, Cauchy-Schwarz bounds, the Onsager regression hypothesis,
    and the Fluctuation-Dissipation Theorem to equilibrium time correlation functions.
  - Relate the intermediate scattering function F(k, t) and dynamical structure factor
    S(k, ω) to inelastic scattering, collective sound modes, Kramers-Kronig relations,
    and quantum detailed balance.
  - Compute self-diffusion coefficients via both the Einstein unwrapped mean-squared
    displacement (MSD) route and the Green-Kubo velocity autocorrelation (VACF) integral,
    and explain Alder-Wainwright hydrodynamic long-time tails.
  sections:
  - id: sec_static_perturbation_and_time_correlations
    type: markdown_section
    title: 1. Static Perturbation Theory, Linear Response, and Time Correlation Functions
    body_markdown: |-
      Why perform **Molecular Dynamics (MD)** rather than **Monte Carlo (MC)**? While both methods sample static equilibrium averages, **only MD propagates Newton's equations in real physical time $t$**, unlocking dynamical correlation functions, collective excitations, and transport coefficients (diffusion, viscosity, thermal and electrical conductivity).

      ### Static Perturbation Theory & Linear Susceptibility
      Suppose we perturb the potential energy $V(\mathbf{R})$ of a canonical ensemble by a weak external field $\lambda A(\mathbf{R})$:
      $$H(\lambda) = V(\mathbf{R}) + \lambda A(\mathbf{R}), \qquad e^{-\beta F(\lambda)} = \int d^{3N}r\, e^{-\beta V(\mathbf{R}) - \beta \lambda A(\mathbf{R})}$$
      Expanding $e^{-\beta\lambda A}$ in powers of $\beta\lambda$ and taking the logarithm yields the cumulant expansion of the free energy:
      $$F(\lambda) = F(0) + \lambda \langle A \rangle_0 - \frac{1}{2}\beta \lambda^2 \left[\langle A^2 \rangle_0 - \langle A \rangle_0^2\right] + \cdots$$
      Similarly, the expectation value of any observable $B(\mathbf{R})$ in the perturbed system is:
      $$\langle B \rangle_\lambda = \langle B \rangle_0 - \beta \lambda \left[\langle B A \rangle_0 - \langle B \rangle_0 \langle A \rangle_0\right] + O(\lambda^2) \implies \left.\frac{\partial \langle B \rangle_\lambda}{\partial \lambda}\right|_{\lambda=0} = -\beta \langle \delta B\, \delta A \rangle_0$$
      **Density Response Example:** Let the external perturbation couple to Fourier mode $\mathbf{k}$ of the density ($A = \rho_{\mathbf{k}}$) and measure the induced density wave $B = \rho_{-\mathbf{k}}$ (with $\langle \rho_{\mathbf{k}} \rangle_0 = 0$ for $\mathbf{k} \neq \mathbf{0}$ in a fluid):
      $$\left.\frac{\partial \langle \rho_{-\mathbf{k}} \rangle}{\partial \lambda_{\mathbf{k}}}\right|_{\lambda=0} = -\beta \left\langle |\rho_{\mathbf{k}}|^2 \right\rangle_0 = -\beta N S(\mathbf{k})$$
      Thus, the **static structure factor $S(\mathbf{k})$ is directly proportional to the static linear density susceptibility**, which is why X-ray and neutron scattering measure $S(\mathbf{k})$.

      ### Dynamical Correlation Functions $C_{AB}(t)$
      For two observables $A$ and $B$ with fluctuations $\delta A(t) = A(t) - \langle A \rangle$, the equilibrium **time correlation function** is:
      $$C_{AB}(t) = \left\langle \delta A(t_0)\, \delta B(t_0 + t) \right\rangle = \left\langle \delta A(0)\, \delta B(t) \right\rangle$$
      - **Stationarity & Ergodicity:** In thermal equilibrium, ensemble averages are invariant under time translation ($t_0 \to 0$). If the system is **ergodic**, we can average over many time origins $t_0$ along a single long MD trajectory to dramatically reduce statistical noise.
      - **Decorrelation at Long Times:** In an ergodic mixing system, observables become statistically independent as $t \to \infty$, so $\lim_{t\to\infty} C_{AB}(t) = \langle \delta A\rangle \langle \delta B\rangle = 0$.
      - **Autocorrelation Bounds & Wiener-Khinchin Positivity ($B = A^*$):** By the Cauchy-Schwarz inequality, an autocorrelation function never exceeds its zero-time variance:
       $$\left| C_{AA}(t) \right| \le C_{AA}(0) = \langle |\delta A|^2 \rangle$$
       Moreover, by the Wiener-Khinchin theorem, its temporal Fourier transform (power spectral density) is strictly non-negative at all frequencies:
       $$C_{AA}(\omega) = \int_{-\infty}^\infty \frac{dt}{2\pi}\, e^{i\omega t} C_{AA}(t) \ge 0$$
  - id: q01_why_md_over_mc
    type: problem
    taught_by: sec_static_perturbation_and_time_correlations
    difficulty: easy
    question_type: single_select
    prompt_markdown: What is the primary physical motivation for performing **Molecular
      Dynamics (MD)** simulations rather than equilibrium **Monte Carlo (MC)** simulations
      when studying transport and relaxation phenomena?
    hint_markdown: Compare deterministic Newtonian time evolution in MD with stochastic
      Markov chain trial moves in MC.
    options:
    - id: a
      text: MD integrates the physical equations of motion in real time $t$, allowing
        direct evaluation of time correlation functions $C_{AB}(t)$, collective excitations
        $S(k, \omega)$, and transport coefficients.
      text_markdown: MD integrates the physical equations of motion in real time $t$,
        allowing direct evaluation of time correlation functions $C_{AB}(t)$, collective
        excitations $S(k, \omega)$, and transport coefficients.
    - id: b
      text: MC cannot compute static equilibrium properties such as pressure $P$ or
        radial distribution function $g(r)$.
      text_markdown: MC cannot compute static equilibrium properties such as pressure
        $P$ or radial distribution function $g(r)$.
    - id: c
      text: MD does not require an interatomic potential energy function $V(\mathbf{R})$.
      text_markdown: MD does not require an interatomic potential energy function
        $V(\mathbf{R})$.
    - id: d
      text: MC simulations are restricted to 1D systems.
      text_markdown: MC simulations are restricted to 1D systems.
    correct: a
    rationale_markdown: Monte Carlo generates a stochastic sequence of configurations
      without physical momenta or real time $t$. Molecular Dynamics integrates Newton's
      equations of motion, providing true dynamical trajectories needed for time correlation
      functions and transport coefficients (**A**).
  - id: q02_static_perturbation_free_energy
    type: problem
    taught_by: sec_static_perturbation_and_time_correlations
    difficulty: medium
    question_type: single_select
    prompt_markdown: |-
      When the Hamiltonian is perturbed by $\lambda A(\mathbf{R})$, static perturbation theory yields the Taylor expansion of the Helmholtz free energy:
      $$F(\lambda) = F(0) + \lambda \langle A \rangle_0 - \frac{1}{2}\beta \lambda^2 \left[\langle A^2 \rangle_0 - \langle A \rangle_0^2\right] + \cdots$$
      Since variance $\langle A^2 \rangle_0 - \langle A \rangle_0^2 = \langle (\delta A)^2 \rangle_0 \ge 0$ is always non-negative, what is the sign of the second-order free-energy shift $\Delta F^{(2)} = -\frac{1}{2}\beta \lambda^2 \langle (\delta A)^2 \rangle_0$?
    hint_markdown: Note that $\beta = 1/(k_B T) > 0$, $\lambda^2 > 0$, and $\langle
      (\delta A)^2 \rangle_0 \ge 0$.
    options:
    - id: a
      text: It is always strictly positive ($\Delta F^{(2)} > 0$).
      text_markdown: It is always strictly positive ($\Delta F^{(2)} > 0$).
    - id: b
      text: It is always negative or zero ($\Delta F^{(2)} \le 0$), meaning thermal
        fluctuations allow the system to relax into states that lower its free energy
        in response to the perturbation.
      text_markdown: It is always negative or zero ($\Delta F^{(2)} \le 0$), meaning
        thermal fluctuations allow the system to relax into states that lower its
        free energy in response to the perturbation.
    - id: c
      text: Its sign alternates randomly with particle number $N$.
      text_markdown: Its sign alternates randomly with particle number $N$.
    - id: d
      text: It is identically zero at all temperatures.
      text_markdown: It is identically zero at all temperatures.
    correct: b
    rationale_markdown: Because $\beta > 0$, $\lambda^2 \ge 0$, and the variance $\langle
      (\delta A)^2\rangle_0 \ge 0$, the second-order correction $-\frac{1}{2}\beta\lambda^2
      \langle (\delta A)^2\rangle_0$ is always $\le 0$ (**A**), making $F(\lambda)$
      a concave function of the field $\lambda$.
  - id: q03_density_susceptibility_sk_numeric
    type: problem
    taught_by: sec_static_perturbation_and_time_correlations
    difficulty: medium
    question_type: numeric
    prompt_markdown: |-
      In a liquid of $N = 400$ atoms at inverse temperature $\beta = (k_B T)^{-1} = 0.50\,\varepsilon^{-1}$, the static structure factor at wavevector $k_1$ has its main peak value $S(k_1) = 2.50$. Using the static linear response relation:
      $$\left.\frac{d\langle \rho_{-k_1} \rangle}{d\lambda_{k_1}}\right|_{\lambda=0} = -\beta N S(k_1)$$
      calculate the magnitude $\left|\frac{d\langle \rho_{-k_1}\rangle}{d\lambda_{k_1}}\right|$ (in units of $\varepsilon^{-1}$).
    hint_markdown: Evaluate the product of inverse temperature, total particle number,
      and the peak structure factor.
    correct:
      value: 500.0
      tolerance: 0.5
    rationale_markdown: |-
      Substituting $\beta = 0.50\,\varepsilon^{-1}$, $N = 400$, and $S(k_1) = 2.50$:
      $$\left|\frac{d\langle \rho_{-k_1} \rangle}{d\lambda_{k_1}}\right| = \beta N S(k_1) = 0.50 \times 400 \times 2.50 = 500.0\,\varepsilon^{-1}$$
  - id: q04_time_correlation_stationarity
    type: problem
    taught_by: sec_static_perturbation_and_time_correlations
    difficulty: easy
    question_type: single_select
    prompt_markdown: Why can an equilibrium MD simulation improve the statistical
      precision of a time correlation function $C_{AB}(t) = \langle \delta A(t_0)\,
      \delta B(t_0 + t) \rangle$ by averaging over many different starting times $t_0$
      along a single trajectory?
    hint_markdown: Does an equilibrium ensemble depend on the absolute clock time
      $t_0$, or only on the time lag $t$?
    options:
    - id: a
      text: Because energy is not conserved in Molecular Dynamics.
      text_markdown: Because energy is not conserved in Molecular Dynamics.
    - id: b
      text: Because $C_{AB}(t)$ is independent of the lag time $t$.
      text_markdown: Because $C_{AB}(t)$ is independent of the lag time $t$.
    - id: c
      text: Because an equilibrium system is stationary (time-translation invariant)
        and ergodic, so $\langle \delta A(t_0)\delta B(t_0 + t)\rangle$ depends only
        on the lag time $t$ and not on the time origin $t_0$.
      text_markdown: Because an equilibrium system is stationary (time-translation
        invariant) and ergodic, so $\langle \delta A(t_0)\delta B(t_0 + t)\rangle$
        depends only on the lag time $t$ and not on the time origin $t_0$.
    - id: d
      text: Because $t_0$ must always be set to $+\infty$.
      text_markdown: Because $t_0$ must always be set to $+\infty$.
    correct: c
    rationale_markdown: In thermal equilibrium, the Liouville distribution is stationary
      under time translation, so $\langle \delta A(t_0)\delta B(t_0+t)\rangle = \langle
      \delta A(0)\delta B(t)\rangle$. By ergodicity, averaging over thousands of time
      origins $t_0$ along an equilibrium trajectory converges to the ensemble average
      (**A**).
  - id: q05_autocorrelation_properties
    type: problem
    taught_by: sec_static_perturbation_and_time_correlations
    difficulty: medium
    question_type: multi_select
    prompt_markdown: Which of the following mathematical properties must hold for
      any classical equilibrium autocorrelation function $C_{AA}(t) = \langle \delta
      A(0)\, \delta A^*(t) \rangle$ in an ergodic mixing system? (Select all that
      apply.)
    hint_markdown: Check for the large-time limit, the upper bound at $t=0$, and the
      sign of the Fourier transform $C_{AA}(\omega)$.
    options:
    - id: a
      text: 'Cauchy-Schwarz upper bound: $|C_{AA}(t)| \le C_{AA}(0)$ for all $t$.'
      text_markdown: 'Cauchy-Schwarz upper bound: $|C_{AA}(t)| \le C_{AA}(0)$ for
        all $t$.'
    - id: b
      text: 'Long-time decorrelation: $\lim_{t \to \infty} C_{AA}(t) = 0$.'
      text_markdown: 'Long-time decorrelation: $\lim_{t \to \infty} C_{AA}(t) = 0$.'
    - id: c
      text: 'Non-negative power spectrum: $C_{AA}(\omega) = \int_{-\infty}^\infty
        \frac{dt}{2\pi} e^{i\omega t} C_{AA}(t) \ge 0$ for all $\omega$.'
      text_markdown: 'Non-negative power spectrum: $C_{AA}(\omega) = \int_{-\infty}^\infty
        \frac{dt}{2\pi} e^{i\omega t} C_{AA}(t) \ge 0$ for all $\omega$.'
    - id: d
      text: 'Strict monotonicity: $C_{AA}(t)$ can never become negative at intermediate
        times $t > 0$.'
      text_markdown: 'Strict monotonicity: $C_{AA}(t)$ can never become negative at
        intermediate times $t > 0$.'
    correct:
    - a
    - b
    - c
    rationale_markdown: 'Properties **A** ($|C_{AA}(t)| \le C_{AA}(0)$), **B** ($\lim_{t\to\infty}
      C_{AA}(t) = 0$), and **C** ($C_{AA}(\omega) \ge 0$) are fundamental theorems
      shown. Statement **D** is false: autocorrelation functions (such as the velocity
      autocorrelation function in a dense liquid or solid) frequently oscillate and
      dip negative ($-C_{AA}(0) \le C_{AA}(t) < 0$) due to cage rebounding or vibrations!'
  - id: sec_fdt_and_onsager_and_scattering
    type: markdown_section
    title: 2. Fluctuation-Dissipation Theorem, Onsager Regression, and Dynamical Structure
      Factor S(k, ω)
    body_markdown: |-
      ### Onsager's Regression Hypothesis & Fluctuation-Dissipation Theorem (FDT)
      How does a system disturbed slightly out of equilibrium relax back toward equilibrium? Lars Onsager (1931, Nobel Prize 1968) formulated the **Onsager Regression Hypothesis**:
      > *The relaxation of macroscopic non-equilibrium disturbances is governed by the exact same laws as the regression of spontaneous microscopic fluctuations in an unperturbed equilibrium system.*

      Mathematically, if a weak time-dependent field $f(t) = f_\omega e^{-i\omega t}$ couples to observable $A$, the linear response of observable $B$ is $\delta\langle B(\omega)\rangle = \chi_{BA}(\omega) f_\omega$, where the **dynamical susceptibility** $\chi(\omega) = \chi'(\omega) + i\chi''(\omega)$ is given by the **Fluctuation-Dissipation Theorem (FDT)**:
      $$\chi_{BA}(\omega) = \beta \int_0^\infty dt\, e^{i\omega t} \left\langle B(t) \left.\frac{dA}{dt}\right|_{t=0} \right\rangle_0$$
      - **Causality & Kramers-Kronig Relations:** Because the response cannot precede the perturbation ($\chi(t < 0) = 0$), $\chi(\omega)$ is analytic in the upper half of the complex frequency plane, so its dispersive real part $\chi'(\omega)$ and dissipative imaginary part $\chi''(\omega)$ determine each other via the **Kramers-Kronig principal-value integrals**:
       $$\chi'(\omega) = \frac{1}{\pi} \mathcal{P}\!\int_{-\infty}^\infty d\omega'\, \frac{\chi''(\omega')}{\omega' - \omega}, \qquad \chi''(\omega) = -\frac{1}{\pi} \mathcal{P}\!\int_{-\infty}^\infty d\omega'\, \frac{\chi'(\omega')}{\omega' - \omega}$$
      - **Energy Dissipation & Quantum FDT:** The average power absorbed by the system from a harmonic drive of amplitude $A(\omega)$ at frequency $\omega$ is proportional to the imaginary part $\chi''(\omega)$:
       $$P_{\text{diss}}(\omega) = \frac{\omega}{2}\, \chi''(\omega)\, A^2(\omega)$$
       In quantum mechanics, the dissipative susceptibility is linked to the equilibrium correlation function by:
       $$\chi''(\omega) = \frac{1}{2\hbar}\left(e^{\beta\hbar\omega} - 1\right) \int_{-\infty}^\infty dt\, e^{-i\omega t} \langle \delta B(t)\,\delta A(0)\rangle \;\;\xrightarrow{\hbar\to 0}\;\; \frac{1}{2}\beta\omega \int_{-\infty}^\infty dt\, e^{-i\omega t} \langle \delta B(t)\,\delta A(0)\rangle$$
       In inelastic scattering, the quantum factor $e^{\beta\hbar\omega}$ produces the **detailed balance asymmetry** $S(\mathbf{k}, -\omega) = e^{-\beta\hbar\omega} S(\mathbf{k}, \omega)$ between neutron/photon energy loss (Stokes, $\omega > 0$) and energy gain (anti-Stokes, $\omega < 0$).

      ### Intermediate Scattering Function $F(\mathbf{k}, t)$ and Dynamical Structure Factor $S(\mathbf{k}, \omega)$
      To probe collective density excitations at wavevector $\mathbf{k}$, we correlate $\rho_{\mathbf{k}}(t)$ with $\rho_{-\mathbf{k}}(0)$ to form the **intermediate scattering function** $F(\mathbf{k}, t)$ (normalized by $1/N$, or $1/2$ in standard convention):
      $$F(\mathbf{k}, t) = \frac{1}{N}\left\langle \rho_{\mathbf{k}}(t)\, \rho_{-\mathbf{k}}(0) \right\rangle, \qquad F(\mathbf{k}, t=0) = S(\mathbf{k})$$
      Its temporal Fourier transform is the **dynamical structure factor** $S(\mathbf{k}, \omega)$, measured directly by **inelastic neutron scattering (INS)** and inelastic X-ray scattering:
      $$S(\mathbf{k}, \omega) = \int_{-\infty}^\infty \frac{dt}{2\pi}\, e^{i\omega t} F(\mathbf{k}, t), \qquad \int_{-\infty}^\infty d\omega\, S(\mathbf{k}, \omega) = F(\mathbf{k}, 0) = S(\mathbf{k})$$
      - **Sound Waves & Damping:** A propagating acoustic sound wave $\delta\rho(x,t) = \varepsilon \cos(qx - c_s q t)$ creates sharp **Brillouin side-peaks** in $S(k, \omega)$ at $\omega = \pm c_s k$. Viscous and thermal damping of the sound wave broadens these delta peaks into Lorentzians of width $\Gamma_s \propto k^2$, while diffusive heat/entropy relaxation produces a central **Rayleigh peak** around $\omega = 0$.
  - id: q06_onsager_regression_hypothesis
    type: problem
    taught_by: sec_fdt_and_onsager_and_scattering
    difficulty: easy
    question_type: single_select
    prompt_markdown: What is the central physical statement of **Onsager's regression
      hypothesis** (1930s, Nobel Prize 1968)?
    hint_markdown: Compare how a small non-equilibrium perturbation relaxes back to
      equilibrium with how spontaneous thermal fluctuations decay inside an unperturbed
      equilibrium system.
    options:
    - id: a
      text: Transport coefficients can only be measured at infinite temperature.
      text_markdown: Transport coefficients can only be measured at infinite temperature.
    - id: b
      text: A system in thermal equilibrium never experiences any microscopic fluctuations.
      text_markdown: A system in thermal equilibrium never experiences any microscopic
        fluctuations.
    - id: c
      text: Non-equilibrium systems always relax instantaneously in zero time.
      text_markdown: Non-equilibrium systems always relax instantaneously in zero
        time.
    - id: d
      text: The relaxation of a macroscopic system from a weak non-equilibrium perturbation
        follows the exact same time-decay law as the regression of spontaneous microscopic
        fluctuations in thermal equilibrium.
      text_markdown: The relaxation of a macroscopic system from a weak non-equilibrium
        perturbation follows the exact same time-decay law as the regression of spontaneous
        microscopic fluctuations in thermal equilibrium.
    correct: d
    rationale_markdown: Onsager's regression hypothesis states that a system cannot
      tell whether a small deviation $\delta A$ from the mean arose from a weak external
      perturbation just turned off or from a spontaneous thermal fluctuation; therefore,
      macroscopic non-equilibrium relaxation obeys the same time correlation decay
      as equilibrium fluctuations (**A**).
  - id: q07_kramers_kronig_physical_origin
    type: problem
    taught_by: sec_fdt_and_onsager_and_scattering
    difficulty: medium
    question_type: single_select
    prompt_markdown: In linear response theory, the **Kramers-Kronig relations** allow
      you to compute the real (dispersive) part $\chi'(\omega)$ of the dynamical susceptibility
      from an integral over the imaginary (dissipative) part $\chi''(\omega')$, and
      vice versa. What fundamental physical principle guarantees the Kramers-Kronig
      relations?
    hint_markdown: Why is the time-domain response function $\chi(t)$ strictly zero
      for $t < 0$ (making $\chi(\omega)$ analytic in the upper half-plane)?
    options:
    - id: a
      text: 'Causality: the response of the system cannot precede the applied perturbation
        in time ($\chi(t) = 0$ for $t < 0$).'
      text_markdown: 'Causality: the response of the system cannot precede the applied
        perturbation in time ($\chi(t) = 0$ for $t < 0$).'
    - id: b
      text: Periodic boundary conditions in a cubic box.
      text_markdown: Periodic boundary conditions in a cubic box.
    - id: c
      text: The ideal-gas law $P\Omega = N k_B T$.
      text_markdown: The ideal-gas law $P\Omega = N k_B T$.
    - id: d
      text: Absence of interatomic forces.
      text_markdown: Absence of interatomic forces.
    correct: a
    rationale_markdown: Because a physical system cannot respond before a perturbation
      is applied (**causality**, $\chi(t) = 0$ for $t < 0$), the one-sided Fourier
      integral $\chi(\omega) = \int_0^\infty dt\, e^{i\omega t}\chi(t)$ is analytic
      in the upper half of the complex $\omega$-plane. Cauchy's integral theorem then
      yields the Kramers-Kronig relations between $\chi'(\omega)$ and $\chi''(\omega)$
      (**A**).
  - id: q08_power_dissipation_formula
    type: problem
    taught_by: sec_fdt_and_onsager_and_scattering
    difficulty: easy
    question_type: single_select
    prompt_markdown: When an external monochromatic field of amplitude $A(\omega)$
      and frequency $\omega$ drives a system with complex susceptibility $\chi(\omega)
      = \chi'(\omega) + i\chi''(\omega)$, which component of $\chi(\omega)$ governs
      the net **power dissipation** (energy absorption per unit time, $\text{Power}
      = \frac{\omega}{2}\chi''(\omega) A^2(\omega)$)?
    hint_markdown: Check for the formula for Power dissipation.
    options:
    - id: a
      text: The real (in-phase) part $\chi'(\omega)$.
      text_markdown: The real (in-phase) part $\chi'(\omega)$.
    - id: b
      text: The imaginary (out-of-phase) part $\chi''(\omega)$.
      text_markdown: The imaginary (out-of-phase) part $\chi''(\omega)$.
    - id: c
      text: The zero-frequency static susceptibility $\chi'(0)$ only.
      text_markdown: The zero-frequency static susceptibility $\chi'(0)$ only.
    - id: d
      text: Neither; linear response never dissipates energy.
      text_markdown: Neither; linear response never dissipates energy.
    correct: b
    rationale_markdown: The in-phase response $\chi'(\omega)$ represents reversible
      reactive energy storage over a cycle, whereas the out-of-phase imaginary part
      $\chi''(\omega)$ governs irreversible energy absorption (dissipation) $\text{Power}
      = \frac{\omega}{2}\chi''(\omega)A^2(\omega)$ (**A**).
  - id: q09_quantum_classical_fdt_limit
    type: problem
    taught_by: sec_fdt_and_onsager_and_scattering
    difficulty: medium
    question_type: numeric
    prompt_markdown: |-
      In the quantum Fluctuation-Dissipation Theorem, the prefactor relating $\chi''(\omega)$ to the correlation spectrum is $\frac{1}{2\hbar}(e^{\beta\hbar\omega} - 1)$. In the classical / low-frequency limit where $\beta\hbar\omega \ll 1$, Taylor-expanding $e^{\beta\hbar\omega} - 1 \approx \beta\hbar\omega$ reduces this prefactor to $\frac{1}{2}\beta\omega$.

      What is the exact value of the dimensionless ratio $\frac{(e^{\beta\hbar\omega} - 1) / (2\hbar)}{\frac{1}{2}\beta\omega} = \frac{e^x - 1}{x}$ when $x = \beta\hbar\omega = 1.0$? (Round to two decimal places.)
    hint_markdown: Compute the ratio $(e^x - 1)/x$ at the specified dimensionless
      argument.
    correct:
      value: 1.72
      tolerance: 0.02
    rationale_markdown: |-
      For $x = \beta\hbar\omega = 1.0$:
      $$\frac{e^{1.0} - 1}{1.0} = e - 1 \approx 2.718 - 1 = 1.72$$
      When $\hbar\omega \gtrsim k_B T$, quantum Bose/detailed-balance factors significantly modify the classical susceptibility prefactor.
  - id: q10_detailed_balance_neutron_scattering
    type: problem
    taught_by: sec_fdt_and_onsager_and_scattering
    difficulty: medium
    question_type: numeric
    prompt_markdown: |-
      In an inelastic neutron scattering experiment on liquid water, quantum detailed balance requires that the dynamical structure factor obey:
      $$\frac{S(\mathbf{k}, +\omega)}{S(\mathbf{k}, -\omega)} = e^{+\beta\hbar\omega}$$
      where $+\omega$ corresponds to neutron energy loss (creating an excitation) and $-\omega$ corresponds to neutron energy gain (absorbing a thermally populated excitation). If an excitation has energy $\hbar\omega = 2.0\,k_B T$ ($\beta\hbar\omega = 2.0$), what is the intensity ratio $S(\mathbf{k}, +\omega) / S(\mathbf{k}, -\omega)$? (Round to two decimal places.)
    hint_markdown: Apply the detailed balance relation using the ratio of excitation
      energy to thermal energy.
    correct:
      value: 7.39
      tolerance: 0.05
    rationale_markdown: |-
      By quantum detailed balance, the Stokes to anti-Stokes intensity ratio at $\beta\hbar\omega = 2.0$ is:
      $$\frac{S(\mathbf{k}, +\omega)}{S(\mathbf{k}, -\omega)} = e^{2.0} \approx 7.39$$
      This explains why the experimental neutron scattering spectra are noticeably taller on the positive energy-transfer side than on the negative side at low temperatures.
  - id: q11_f_kt_sum_rule
    type: problem
    taught_by: sec_fdt_and_onsager_and_scattering
    difficulty: easy
    question_type: single_select
    prompt_markdown: How is the **static structure factor** $S(\mathbf{k}) = \frac{1}{N}\langle
      |\rho_{\mathbf{k}}|^2 \rangle$ obtained from the intermediate scattering function
      $F(\mathbf{k}, t) = \frac{1}{N}\langle \rho_{\mathbf{k}}(t)\rho_{-\mathbf{k}}(0)\rangle$
      and the dynamical structure factor $S(\mathbf{k}, \omega) = \int_{-\infty}^\infty
      \frac{dt}{2\pi} e^{i\omega t} F(\mathbf{k}, t)$?
    hint_markdown: Evaluate $F(\mathbf{k}, t)$ at $t = 0$ using inverse Fourier transformation
      of $S(\mathbf{k}, \omega)$.
    options:
    - id: a
      text: $S(\mathbf{k}) = \frac{d}{dt} F(\mathbf{k}, t)\big|_{t=0}$
      text_markdown: $S(\mathbf{k}) = \frac{d}{dt} F(\mathbf{k}, t)\big|_{t=0}$
    - id: b
      text: $S(\mathbf{k}) = \lim_{t \to \infty} F(\mathbf{k}, t) = S(\mathbf{k},
        \omega=0)$
      text_markdown: $S(\mathbf{k}) = \lim_{t \to \infty} F(\mathbf{k}, t) = S(\mathbf{k},
        \omega=0)$
    - id: c
      text: $S(\mathbf{k}) = F(\mathbf{k}, t=0) = \int_{-\infty}^\infty d\omega\,
        S(\mathbf{k}, \omega)$
      text_markdown: $S(\mathbf{k}) = F(\mathbf{k}, t=0) = \int_{-\infty}^\infty d\omega\,
        S(\mathbf{k}, \omega)$
    - id: d
      text: $S(\mathbf{k})$ and $S(\mathbf{k}, \omega)$ are completely unrelated.
      text_markdown: $S(\mathbf{k})$ and $S(\mathbf{k}, \omega)$ are completely unrelated.
    correct: c
    rationale_markdown: By the inverse Fourier transform $F(\mathbf{k}, t) = \int_{-\infty}^\infty
      d\omega\, e^{-i\omega t} S(\mathbf{k}, \omega)$, setting $t = 0$ gives the zeroth-moment
      sum rule $S(\mathbf{k}) = F(\mathbf{k}, 0) = \int_{-\infty}^\infty d\omega\,
      S(\mathbf{k}, \omega)$ (**A**). That is why conventional X-ray diffraction (which
      integrates over all scattered photon energies $\hbar\omega$) measures $S(\mathbf{k})$.
