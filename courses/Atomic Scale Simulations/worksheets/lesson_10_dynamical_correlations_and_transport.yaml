  - id: sec_green_kubo_transport_and_hydro_tails
    type: markdown_section
    title: 4. General Green-Kubo Transport Coefficients & Alder-Wainwright Hydrodynamic
      Tails
    body_markdown: |-
      ### The Green-Kubo Family of Transport Coefficients
      Taking the zero-frequency, long-wavelength limit ($\omega \to 0, k \to 0$) of the Fluctuation-Dissipation Theorem shows that **every linear transport coefficient $\mu$ can be written in Green-Kubo form as the time integral of a microscopic flux/current autocorrelation function**:
      $$\mu \propto \int_0^\infty dt\, \left\langle J(t_0)\, J(t_0 + t) \right\rangle_0$$

      | Transport Coefficient | Macroscopic Law | Microscopic Flux / Current $J(t)$ | Green-Kubo Formula (3D) |
      |:--- |:--- |:--- |:--- |
      | **Self-Diffusion** $D$ | $\mathbf{j} = -D\nabla\rho$ | Tagged particle velocity $\mathbf{v}_i(t)$ | $D = \frac{1}{3}\int_0^\infty dt\, \langle \mathbf{v}_i(t)\cdot\mathbf{v}_i(0)\rangle$ |
      | **Shear Viscosity** $\eta$ | $\sigma_{xy} = -\eta \frac{\partial u_x}{\partial y}$ | Off-diagonal stress tensor $\sigma_{xy}(t)$ | $\eta = \frac{\Omega}{k_B T} \int_0^\infty dt\, \langle \sigma_{xy}(t)\,\sigma_{xy}(0)\rangle$ |
      | **Thermal Conductivity** $\lambda_T$ | $\mathbf{J}^Q = -\lambda_T \nabla T$ | Microscopic heat/energy current $\mathbf{J}^Q(t)$ | $\lambda_T = \frac{\Omega}{3 k_B T^2} \int_0^\infty dt\, \langle \mathbf{J}^Q(t)\cdot\mathbf{J}^Q(0)\rangle$ |
      | **Electrical Conductivity** $\sigma_{\text{el}}$ | $\mathbf{J}^e = \sigma_{\text{el}} \mathbf{E}$ | Total electric current $\mathbf{J}(t) = \sum_i q_i \mathbf{v}_i(t)$ | $\sigma_{\text{el}} = \frac{1}{3\Omega k_B T} \int_0^\infty dt\, \langle \mathbf{J}(t)\cdot\mathbf{J}(0)\rangle$ |

      ### Non-Equilibrium Molecular Dynamics (NEMD) & Thermostats
      Instead of integrating equilibrium fluctuations via Green-Kubo, we can also measure transport coefficients using **Non-Equilibrium MD (NEMD)** by directly imposing a finite shear rate, temperature gradient, or electric field and measuring the steady-state response flux.
      - **Why NEMD Requires a Thermostat:** Driving a steady current or shear flow performs continuous mechanical/electrical work on the system, generating irreversible **Joule/viscous heating** ($P_{\text{diss}} > 0$). Without a **thermostat** to remove this heat, the total energy and temperature of the simulation would rise indefinitely and a steady state could never be reached!

      ### Alder–Wainwright Hydrodynamic Long-Time Tails ($t^{-d/2}$)
      Before computer simulations, kinetic theory (Boltzmann/Enskog "molecular chaos") assumed that successive collisions are uncorrelated, predicting that the velocity autocorrelation function $C_{vv}(t)$ decays **exponentially** ($e^{-t/\tau_E}$) at long times.
      - In 1967–1970, **Berni Alder and Thomas Wainwright** used hard-sphere MD simulations to discover a shocking result: at long times, $C_{vv}(t)$ does **not** decay exponentially, but instead exhibits a positive **algebraic power-law tail**:
       $$C_{vv}(t) = \langle \mathbf{v}_i(t)\cdot\mathbf{v}_i(0) \rangle \propto t^{-d/2} \qquad (t \gg \tau_E)$$
      - **Physical Mechanism (Vortex & Train Effects):** A moving particle pushes fluid ahead of it and leaves a low-pressure wake behind it. Momentum conservation in the surrounding fluid creates a pair of circulating **hydrodynamic vortices** that loop around and push the particle from behind in its original direction (**train/vortex effect**)! Because vorticity diffuses hydrodynamically over a volume $\sim (\nu t)^{d/2}$, the recirculated velocity decays as $t^{-d/2}$.
      - **Catastrophic Consequence in 2D ($d = 2$):**
       - In **3D ($d = 3$)**, the tail scales as $t^{-3/2}$, whose Green-Kubo integral $\int^\infty t^{-3/2} dt < \infty$ **converges** to a finite diffusion constant $D$.
       - In **2D ($d = 2$)**, the tail scales as $t^{-2/2} = t^{-1}$, so the Green-Kubo integral $\int_0^t (t')^{-1} dt' \propto \ln(t)$ **diverges logarithmically** as $t \to \infty$ (and scales as $\ln L$ with box size)! Strictly speaking, **Fickian transport coefficients do not exist in infinite 2D fluids** because of hydrodynamic long-time tails.
  - id: concept_alder_wainwright_explorer
    type: concept_cell
    title: 'Interactive Explorer: Alder–Wainwright Hydrodynamic Long-Time Tails (t^{-d/2})'
    description_markdown: Compare the classical Boltzmann/Enskog exponential prediction
      ($e^{-t/\tau_E}$) against the true **Alder–Wainwright hydrodynamic vortex tails**
      ($\propto t^{-d/2}$) in 2D ($t^{-1}$) and 3D ($t^{-3/2}$). Switch `panel_mode`
      to see how the running Green-Kubo integral $D(t)$ converges in 3D but diverges
      logarithmically ($\propto \ln t$) in 2D!
    render_function: render_alder_wainwright_tails
    layout: figure_left
    controls:
      dimension:
        kind: dropdown
        label: Spatial Dimension d
        default: 2
        options:
        - label: 2D Fluid (Tail ~ t⁻¹, D(t) ~ ln(t) Diverges!)
          value: 2
        - label: 3D Fluid (Tail ~ t⁻³/², D(t) Converges)
          value: 3
      panel_mode:
        kind: dropdown
        label: Plot Mode
        default: loglog_vacf
        options:
        - label: Log-Log VACF Decay C_vv(t)
          value: loglog_vacf
        - label: Semi-Log Running Green-Kubo Integral D(t)
          value: running_integral
      collision_time:
        kind: slider
        label: Mean Collision Time τ_E
        min: 0.5
        max: 2.0
        step: 0.25
        default: 1.0
    takeaway_markdown: '**Key Takeaway:** On a log-log plot, a power law $t^{-d/2}$
      is a straight line with slope $-1$ (in 2D) or $-1.5$ (in 3D), completely dominating
      over the plunging exponential curve $e^{-t/\tau_E}$ for $t \gtrsim 10\tau_E$.
      Even simple hard-sphere collisions reproduce this collective hydrodynamic vortex
      effect!'
  - id: q27_green_kubo_flux_matching
    type: problem
    taught_by: sec_green_kubo_transport_and_hydro_tails
    difficulty: easy
    question_type: single_select
    prompt_markdown: In the Green-Kubo formulation of linear transport coefficients
      $\mu \propto \int_0^\infty dt\, \langle A(0) A(t) \rangle$, which microscopic
      observable $A(t)$ is autocorrelated to obtain the **shear viscosity** $\eta$?
    hint_markdown: Check and for the microscopic conjugate flux paired with Viscosity.
    options:
    - id: a
      text: The total electric current $\mathbf{J}^e(t) = \sum_i q_i \mathbf{v}_i(t)$.
      text_markdown: The total electric current $\mathbf{J}^e(t) = \sum_i q_i \mathbf{v}_i(t)$.
    - id: b
      text: The off-diagonal component of the microscopic stress (pressure) tensor
        $\sigma_{xy}(t)$.
      text_markdown: The off-diagonal component of the microscopic stress (pressure)
        tensor $\sigma_{xy}(t)$.
    - id: c
      text: The microscopic heat/energy current $\mathbf{J}^Q(t)$.
      text_markdown: The microscopic heat/energy current $\mathbf{J}^Q(t)$.
    - id: d
      text: The static radial distribution function $g(r)$.
      text_markdown: The static radial distribution function $g(r)$.
    correct: b
    rationale_markdown: 'Shear viscosity $\eta$ measures momentum flux perpendicular
      to the flow direction, so its Green-Kubo integral autocorrelates the off-diagonal
      stress tensor $\sigma_{xy}(t)$: $\eta = \frac{\Omega}{k_B T}\int_0^\infty \langle
      \sigma_{xy}(t)\sigma_{xy}(0)\rangle dt$ (**A**).'
  - id: q28_green_kubo_heat_and_electrical_flux
    type: problem
    taught_by: sec_green_kubo_transport_and_hydro_tails
    difficulty: easy
    question_type: single_select
    prompt_markdown: Which pair of microscopic currents $(J_{\text{heat}}, J_{\text{elec}})$
