      > 0$ arises from damped oscillatory rattling in local liquid cages (**A**).
  - id: q24_vacf_crystalline_solid_integral
    type: problem
    taught_by:
    - sec_diffusion_einstein_and_green_kubo
    - concept_vacf_msd_duality
    difficulty: medium
    question_type: numeric
    prompt_markdown: |-
      In a defect-free harmonic crystalline solid at thermal equilibrium, atoms vibrate around fixed lattice sites without long-range diffusive hopping, so the mean-squared displacement saturates to a bounded constant $\lim_{t\to\infty} \langle |\mathbf{r}_i(t) - \mathbf{r}_i(0)|^2 \rangle = 2\langle u^2 \rangle < \infty$.

      What is the exact value of the Green-Kubo integral $\frac{1}{3}\int_0^\infty \langle \mathbf{v}_i(t)\cdot\mathbf{v}_i(0) \rangle dt$ in this crystalline solid?
    hint_markdown: Consider the long-time growth rate of the mean-squared displacement
      in a system without macroscopic diffusion.
    correct:
      value: 0.0
      tolerance: 0.001
    rationale_markdown: Because $\text{MSD}(t)$ approaches a finite constant $2\langle
      u^2\rangle$ as $t \to \infty$, dividing by $6t$ gives $D = \lim_{t\to\infty}
      \frac{2\langle u^2\rangle}{6t} = 0$. Equivalently, the positive and negative
      vibrational lobes of the phonon velocity autocorrelation function cancel exactly
      so that $\frac{1}{3}\int_0^\infty C_{vv}(t)\,dt = 0.0$.
