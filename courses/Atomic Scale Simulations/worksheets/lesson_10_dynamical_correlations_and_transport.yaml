  - id: q19_pbc_wrapped_msd_saturation_numeric
    type: problem
    taught_by:
    - sec_diffusion_einstein_and_green_kubo
    - concept_pbc_unwrapping_bug
    difficulty: hard
    question_type: numeric
    prompt_markdown: |-
      Suppose a student forgets to unwrap periodic boundary crossings in a 3D cubic box of side length $L = 10.0\,\text{Å}$ and computes the long-time limit of $\langle |\mathbf{r}_{\text{wrapped}}(t) - \mathbf{r}_{\text{wrapped}}(0)|^2 \rangle$, where $\mathbf{r}_{\text{wrapped}} \in [0, L)^3$.

      As $t \to \infty$, $\mathbf{r}_{\text{wrapped}}(t)$ and $\mathbf{r}_{\text{wrapped}}(0)$ become two independent, uniformly distributed points in $[0, L)^3$. Since for a single coordinate $x \sim \text{Uniform}(0, L)$ the mean-squared difference between two independent draws is $\langle (x_1 - x_2)^2 \rangle = 2 \text{Var}(x) = 2(L^2 / 12) = L^2 / 6$, what plateau value (in $\text{Å}^2$) does the 3D wrapped MSD saturate to as $t \to \infty$?
    hint_markdown: Sum the independent mean-squared coordinate separation across all
      three Cartesian directions.
    correct:
      value: 50.0
      tolerance: 0.5
    rationale_markdown: |-
      In 3D, the three independent coordinates $x, y, z$ each contribute $L^2 / 6$ as $t \to \infty$, so the wrapped MSD saturates at:
      $$\lim_{t\to\infty} \left\langle |\mathbf{r}_{\text{wrapped}}(t) - \mathbf{r}_{\text{wrapped}}(0)|^2 \right\rangle = 3 \times \frac{L^2}{6} = \frac{L^2}{2} = \frac{(10.0)^2}{2} = 50.0\,\text{Å}^2$$
      You can verify this directly in the **PBC Unwrapping Explorer** above!
  - id: q20_vacf_t0_equipartition_numeric
    type: problem
    taught_by:
    - sec_diffusion_einstein_and_green_kubo
    - concept_vacf_msd_duality
    difficulty: medium
    question_type: numeric
    prompt_markdown: At lag time $t = 0$, the 3D velocity autocorrelation function
      $C_{vv}(0) = \langle \mathbf{v}_i(0)\cdot\mathbf{v}_i(0) \rangle = \langle v_i^2
      \rangle$ is fixed purely by equilibrium statistical mechanics (independent of
      density or interatomic forces!). For a classical particle of mass $m = 2.0$
      (in reduced units) at temperature $k_B T = 1.5$, what is the exact value of
      $C_{vv}(0) = \langle \mathbf{v}_i(0)\cdot\mathbf{v}_i(0) \rangle$?
    hint_markdown: Relate the mean-squared velocity of a particle to the temperature
      and particle mass using equipartition across the three translational degrees
      of freedom.
    correct:
      value: 2.25
      tolerance: 0.01
    rationale_markdown: |-
      By the classical equipartition theorem, each of the 3 translational velocity components has $\langle v_\alpha^2 \rangle = k_B T / m$, so:
      $$C_{vv}(0) = \langle \mathbf{v}_i(0)\cdot\mathbf{v}_i(0) \rangle = \frac{3 k_B T}{m} = \frac{3 \times 1.5}{2.0} = 2.25$$
  - id: q21_vacf_exponential_green_kubo_numeric
    type: problem
    taught_by:
    - sec_diffusion_einstein_and_green_kubo
    - concept_vacf_msd_duality
    difficulty: medium
    question_type: numeric
    prompt_markdown: |-
      In a moderately dilute 3D gas where the velocity autocorrelation function decays exponentially as:
      $$\langle \mathbf{v}_i(t)\cdot\mathbf{v}_i(0) \rangle = \left(\frac{3 k_B T}{m}\right) e^{-t / \tau_c}$$
      with $\frac{k_B T}{m} = 1.20\,\text{Å}^2/\text{ps}^2$ and collision relaxation time $\tau_c = 0.50\,\text{ps}$, calculate the self-diffusion coefficient $D$ (in $\text{Å}^2/\text{ps}$) using the 3D Green-Kubo formula $D = \frac{1}{3}\int_0^\infty \langle \mathbf{v}_i(t)\cdot\mathbf{v}_i(0)\rangle dt$.
    hint_markdown: Integrate the exponential correlation decay over positive time
      and apply the Green-Kubo prefactor.
    correct:
      value: 0.6
      tolerance: 0.01
    rationale_markdown: |-
      Evaluating the Green-Kubo integral:
      $$D = \frac{1}{3} \int_0^\infty \left(\frac{3 k_B T}{m}\right) e^{-t/\tau_c} dt = \left(\frac{k_B T}{m}\right) \tau_c = 1.20 \times 0.50 = 0.60\,\text{Å}^2/\text{ps}$$
  - id: q22_vacf_negative_dip_cage_effect
