    - id: d
      text: $\hat{c}_{vv}(0)$ measures the crystal lattice constant.
      text_markdown: $\hat{c}_{vv}(0)$ measures the crystal lattice constant.
    correct: c
    rationale_markdown: By the Green-Kubo relation, $D = \frac{1}{3}\int_0^\infty
      \langle \mathbf{v}(t)\cdot\mathbf{v}(0)\rangle dt$, so the zero-frequency value
      $\hat{c}_{vv}(\omega = 0)$ of the velocity power spectrum (vibrational density
