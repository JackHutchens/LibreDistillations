  - id: q19_36
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_19_5_cpmd_orthonormality
    prompt_markdown: |-
      Suppose two normalized trial wave functions $\phi_1$ and $\phi_2$ ($\langle\phi_1|\phi_1\rangle = \langle\phi_2|\phi_2\rangle = 1$) have a small initial overlap $\epsilon = \langle\phi_2|\phi_1\rangle = 0.10$ after an unconstrained CPMD step. After applying **one** symmetric SHAKE orthogonalization iteration:
      $$\phi_1^{(1)} = \phi_1 - \frac{1}{2}\epsilon\,\phi_2, \qquad \phi_2^{(1)} = \phi_2 - \frac{1}{2}\epsilon\,\phi_1,$$
      what is the remaining overlap $\langle\phi_2^{(1)} | \phi_1^{(1)}\rangle$ before re-normalization? (Report your answer to 5 decimal places, e.g., `0.00025`.)
    hint_markdown: Expand the inner product between the two updated trial states and
      observe which powers of $\epsilon$ survive after first-order terms cancel.
    correct:
      value: 0.00025
      tolerance: 2.0e-05
    rationale_markdown: |-
      Expanding the inner product gives:
      $$\langle\phi_2^{(1)}|\phi_1^{(1)}\rangle = \langle\phi_2|\phi_1\rangle - \frac{1}{2}\epsilon\langle\phi_2|\phi_2\rangle - \frac{1}{2}\epsilon\langle\phi_1|\phi_1\rangle + \frac{1}{4}\epsilon^2\langle\phi_1|\phi_2\rangle = \epsilon - \frac{1}{2}\epsilon(1) - \frac{1}{2}\epsilon(1) + \frac{1}{4}\epsilon^3 = \frac{1}{4}\epsilon^3.$$
      For $\epsilon = 0.10$, the residual overlap after just one iteration is $\frac{1}{4}(0.10)^3 = 0.00025$ ($2.5\times 10^{-4}$), demonstrating the rapid convergence of iterative SHAKE!
  - id: q19_37
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_19_4_shake_algorithm
    prompt_markdown: What happens in the SHAKE algorithm if the unconstrained Verlet
      step $\mathbf{R}^{\mathrm{unc}}(t+h)$ is so large (e.g., due to an excessively
      large timestep $\Delta t$ or an atomic core overlap) that the predicted bond
      vector $\mathbf{r}_{ij}^{\mathrm{unc}}(t+h)$ becomes nearly perpendicular to
