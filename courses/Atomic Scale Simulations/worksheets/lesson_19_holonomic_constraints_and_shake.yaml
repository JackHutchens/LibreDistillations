worksheet:
  id: lesson_19_holonomic_constraints_and_shake
  title: 'Lesson 19: Holonomic Constraints, Rigid Bodies & The SHAKE Algorithm'
  estimated_minutes: 120
  learning_objectives:
  - Explain why high-frequency intramolecular bond stretches create a severe molecular
    dynamics (MD) timestep bottleneck and why they are quantum-mechanically frozen
    at room temperature ($\hbar\omega \gg k_B T$).
  - Analyze the statistical-mechanical difference between a stiff harmonic spring
    ($k_{\mathrm{bond}}\to\infty$) and a holonomic rigid constraint ($\sigma(\mathbf{R})=0,
    \dot{\sigma}(\mathbf{R})=0$) via the phase-space metric determinant and Fixman
    potential.
  - Compare generalized coordinate representations for rigid molecules, contrasting
    the gimbal-lock coordinate singularity ($\frac{1}{\sin\theta}\to\infty$) of Euler
    angles against globally smooth 4-component unit quaternions.
  - Derive and apply the Method of Lagrange Multipliers and the SHAKE algorithm (Ryckaert,
    Ciccotti & Berendsen 1977) within Verlet integration, including time-reversible
    projection along old bond vectors $\mathbf{r}_{ij}(t)$ and iterative Gauss–Seidel/Newton
    relaxation.
  - Formulate the $N_e(N_e+1)/2$ holonomic wave-function orthonormality constraints
    $S_{ij} = \langle\phi_i|\phi_j\rangle - \delta_{ij} = 0$ in Car–Parrinello Ab
    Initio Molecular Dynamics (CPMD) and solve them via iterative matrix SHAKE.
  sections:
  - id: sec_19_1_timescales_and_motivation
    type: markdown_section
    title: 1. Intramolecular Timescale Separation & Quantum Freezing of Fast Vibrations
    body_markdown: |-
      In molecular liquids, polymers, and biomolecular systems, atomic motions span many orders of magnitude in timescale:

      1. **Covalent bond-stretching vibrations** (e.g., $\mathrm{O{-}H}$, $\mathrm{C{-}H}$, $\mathrm{C{=}O}$): highest frequencies ($\tilde{\nu} \approx 1600\text{–}3600\,\mathrm{cm}^{-1}$), corresponding to vibrational periods of only $T_{\mathrm{vib}} \approx 9\text{–}20\,\mathrm{fs}$ and excitation energies $\hbar\omega / k_B \approx 2300\text{–}5200\,\mathrm{K}$, far above room temperature ($300\,\mathrm{K}$).
      2. **Bond-angle bending & molecular rotations**: intermediate timescales ($\sim 50\text{–}500\,\mathrm{fs}$).
      3. **Internal torsional / dihedral reorientation**: barrier-crossing events ($\sim 1\text{–}100\,\mathrm{ps}$).
      4. **Translational diffusion, conformational folding, and phase transitions (melting)**: long collective timescales ($\sim 100\,\mathrm{ps}\text{–}\mu\mathrm{s}$).

      ### Why Constrain Bond Lengths in Classical MD?
      - **The Timestep Bottleneck:** Accurate Verlet integration requires roughly $15\text{–}20$ steps per shortest vibrational period ($\Delta t \approx T_{\mathrm{vib}}/20 \approx 0.5\text{–}1.0\,\mathrm{fs}$). Yet high-frequency bond stretches are dynamically **decoupled** from slower diffusive and conformational modes and rarely affect long-time transport or structural properties.
      - **Quantum Freezing ($\hbar\omega \gg k_B T$):** For a $\mathrm{C{-}H}$ or $\mathrm{O{-}H}$ stretch with $\tilde{\nu} \approx 3000\,\mathrm{cm}^{-1}$, the vibrational quantum is $\hbar\omega \approx 0.37\,\mathrm{eV}$, so the characteristic vibrational temperature is $\Theta_{\mathrm{vib}} = \hbar\omega / k_B \approx 4300\,\mathrm{K}$. At $T = 300\,\mathrm{K}$, the mean Bose–Einstein occupancy is $\langle n\rangle = (e^{\hbar\omega/k_B T} - 1)^{-1} \approx 6\times 10^{-7}$. Physically, the bond is locked in its quantum ground state ($n=0$) rather than oscillating with classical equipartition energy $k_B T$!
      - **Force-Field Simplification & Efficiency:** Replacing stiff harmonic springs with rigid holonomic bond constraints eliminates the need to parameterize high-frequency stretching force constants and allows a **$3\text{–}5\times$ larger MD timestep** ($\Delta t \approx 2\text{–}5\,\mathrm{fs}$).
  - id: concept_19_1_timescales
    type: concept_cell
    title: 'Interactive Explorer: Vibrational Quantum Occupancy & MD Timestep Limits'
    description_markdown: Adjust the temperature $T$ and vibrational wavenumber $\tilde{\nu}$
      to inspect the dimensionless quantum ratio $\hbar\omega / k_B T$, the quantum
      vs. Classical vibrational heat capacity $C_{\mathrm{vib}}/k_B$, and the maximum
      stable Verlet timestep $\Delta t \approx T_{\mathrm{vib}}/20$.
    render_function: render_timescale_and_quantum_freeze
    layout: figure_left
    controls:
      temperature_K:
        kind: slider
        label: Temperature T (K)
        min: 100.0
        max: 1500.0
        step: 50.0
        default: 300.0
      wavenumber_cm:
        kind: slider
        label: Vibrational Wavenumber ν̃ (cm⁻¹)
        min: 200.0
        max: 3800.0
        step: 100.0
        default: 3000.0
      view_mode:
        kind: dropdown
        label: Display Mode
        default: quantum_ratio
        options:
        - label: Quantum Heat Capacity & Occupancy vs. ν̃
          value: quantum_ratio
        - label: Maximum Stable MD Timestep Δt by Mode
          value: timestep_bars
    takeaway_markdown: '**Key Takeaway:** High-frequency covalent stretches ($\tilde{\nu}
      > 2500\,\mathrm{cm}^{-1}$) have $\hbar\omega / k_B T > 12$ at $300\,\mathrm{K}$,
      meaning they are quantum-mechanically frozen in their ground state while dictating
      a tiny $\sim 0.5\,\mathrm{fs}$ classical MD timestep if left unconstrained.'
  - id: q19_01
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_19_1_timescales_and_motivation
    prompt_markdown: In an all-atom molecular dynamics simulation of liquid water
      or an alkane polymer at $T = 300\,\mathrm{K}$, which physical degree of freedom
      sets the strictest upper bound on the integration timestep $\Delta t$ if no
      constraints are applied?
    hint_markdown: Recall that Verlet stability is governed by the highest natural
      frequency $\omega_{\max}$ in the system ($\omega_{\max}\Delta t < 2$).
    options:
    - id: a
      text: Intramolecular covalent bond-stretching vibrations (e.g., O–H or C–H stretches
        with periods ~10 fs)
      text_markdown: Intramolecular covalent bond-stretching vibrations (e.g., O–H
        or C–H stretches with periods ~10 fs)
    - id: b
      text: Dihedral angle (torsional) barrier crossings along the polymer backbone
        (~10–100 ps)
      text_markdown: Dihedral angle (torsional) barrier crossings along the polymer
        backbone (~10–100 ps)
    - id: c
      text: Center-of-mass translational diffusion of molecules across the periodic
        box (~ns)
      text_markdown: Center-of-mass translational diffusion of molecules across the
        periodic box (~ns)
    - id: d
      text: Collective density fluctuations associated with melting or crystallization
      text_markdown: Collective density fluctuations associated with melting or crystallization
    correct: a
    rationale_markdown: The stability and accuracy of a Verlet integrator are limited
      by the fastest oscillatory mode in the system ($\Delta t \lesssim T_{\min}/20$).
      Light-atom covalent bond stretches ($\mathrm{O{-}H}$, $\mathrm{C{-}H}$) have
      vibrational periods around $9\text{–}11\,\mathrm{fs}$, requiring $\Delta t \approx
      0.5\,\mathrm{fs}$ unless constrained.
  - id: q19_02
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: concept_19_1_timescales
    prompt_markdown: A covalent $\mathrm{C{-}H}$ stretching mode has a vibrational
      wavenumber of $\tilde{\nu} = 3000\,\mathrm{cm}^{-1}$. Using the fundamental
      constant ratio $hc / k_B = 1.4388\,\mathrm{cm\cdot K}$, calculate the dimensionless
      quantum parameter $x = \frac{\hbar\omega}{k_B T}$ at room temperature ($T =
      300\,\mathrm{K}$). (Report your answer to 2 decimal places.)
    hint_markdown: Relate the characteristic vibrational temperature to the wavenumber
      and evaluate the ratio relative to the thermal energy.
    correct:
      value: 14.39
      tolerance: 0.05
    rationale_markdown: The characteristic vibrational temperature is $\Theta_{\mathrm{vib}}
      = \frac{\hbar\omega}{k_B} = \frac{hc}{k_B}\tilde{\nu} = (1.4388\,\mathrm{cm\cdot
      K})(3000\,\mathrm{cm}^{-1}) = 4316.4\,\mathrm{K}$. Dividing by $T = 300\,\mathrm{K}$
      gives $x = \frac{\hbar\omega}{k_B T} = \frac{4316.4}{300} = 14.388 \approx 14.39$.
      Because $x \gg 1$, the mode is deep in the quantum ground-state regime.
  - id: q19_03
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_19_1_timescales_and_motivation
    prompt_markdown: Why is freezing a high-frequency bond stretch ($\hbar\omega \gg
      k_B T$) via a holonomic constraint often physically *more* realistic at room
      temperature than simulating it as a classical flexible harmonic spring?
    hint_markdown: Compare classical equipartition energy $k_B T$ with the quantum
      occupancy $\langle n\rangle = (e^{\hbar\omega/k_B T}-1)^{-1}$.
    options:
    - id: a
      text: Quantum mechanics forbids covalent bonds from having zero-point energy,
        so bond lengths are strictly constant in nature
      text_markdown: Quantum mechanics forbids covalent bonds from having zero-point
        energy, so bond lengths are strictly constant in nature
    - id: b
      text: A classical harmonic spring artificially populates the mode with $k_B
        T$ of thermal energy, whereas quantum mechanically the bond is frozen in its
        $n=0$ vibrational ground state with almost zero thermal excitation
      text_markdown: A classical harmonic spring artificially populates the mode with
        $k_B T$ of thermal energy, whereas quantum mechanically the bond is frozen
        in its $n=0$ vibrational ground state with almost zero thermal excitation
    - id: c
      text: Classical springs violate conservation of total linear momentum in periodic
        boundary conditions
      text_markdown: Classical springs violate conservation of total linear momentum
        in periodic boundary conditions
    - id: d
      text: High-frequency vibrations couple strongly to center-of-mass translation
        and cause immediate crystallization
      text_markdown: High-frequency vibrations couple strongly to center-of-mass translation
        and cause immediate crystallization
    correct: b
    rationale_markdown: In classical statistical mechanics, equipartition assigns
      an average energy of $k_B T$ to every quadratic harmonic mode regardless of
      how high its frequency $\omega$ is. In reality, when $\hbar\omega \gg k_B T$,
      the excited vibrational states ($n \ge 1$) are thermally inaccessible ($\langle
      n\rangle \sim e^{-\hbar\omega/k_B T} \ll 1$), so locking the bond in its ground
      state via a constraint better reflects its lack of thermal excitation and avoids
      spurious classical energy transfer.
  - id: q19_04
    type: problem
    question_type: multi_select
    difficulty: easy
    taught_by: sec_19_1_timescales_and_motivation
    prompt_markdown: 'Select **all** valid advantages of replacing stiff intramolecular
      bond-stretching potentials with holonomic constraints in a molecular dynamics
      simulation:'
    hint_markdown: consider timestep size, force-field construction, and quantum behavior.
    options:
    - id: a
      text: Allows a 3–5× larger integration timestep $\Delta t$ by removing the fastest
        vibrational frequencies
      text_markdown: Allows a 3–5× larger integration timestep $\Delta t$ by removing
        the fastest vibrational frequencies
    - id: b
      text: Simplifies the construction of the empirical force field by eliminating
        stiff bond-stretching parameters
      text_markdown: Simplifies the construction of the empirical force field by eliminating
        stiff bond-stretching parameters
    - id: c
      text: Avoids unphysical classical thermal excitation of quantum-frozen high-frequency
        stretches ($\hbar\omega \gg k_B T$)
      text_markdown: Avoids unphysical classical thermal excitation of quantum-frozen
        high-frequency stretches ($\hbar\omega \gg k_B T$)
    - id: d
      text: Eliminates the need to compute non-bonded intermolecular Lennard-Jones
        or Coulomb forces
      text_markdown: Eliminates the need to compute non-bonded intermolecular Lennard-Jones
        or Coulomb forces
    correct:
    - a
    - b
    - c
    rationale_markdown: Holonomic bond constraints remove the $\sim 10\,\mathrm{fs}$
      vibrational bottleneck (allowing a $3\text{–}5\times$ larger $\Delta t$), simplify
      potential construction, and better represent quantum-frozen modes. Non-bonded
      intermolecular forces between atoms on different molecules must still be computed
      at every MD step.
  - id: q19_05
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: concept_19_1_timescales
    prompt_markdown: In an unconstrained alkane simulation, the $\mathrm{C{-}H}$ stretch
      ($\tilde{\nu} = 3000\,\mathrm{cm}^{-1}$, period $T_{\mathrm{vib}} \approx 11.1\,\mathrm{fs}$)
      restricts the timestep to $\Delta t_{\mathrm{unc}} = 0.55\,\mathrm{fs}$. If
      constraining all covalent bond lengths shifts the highest remaining frequency
      to the $\mathrm{C{-}C{-}C}$ bond-angle bend ($\tilde{\nu} = 750\,\mathrm{cm}^{-1}$),
      by what multiplicative factor does the maximum stable timestep $\Delta t$ increase?
    hint_markdown: Since $T_{\mathrm{vib}} \propto 1/\tilde{\nu}$, the maximum stable
      timestep scales inversely with the highest active wavenumber $\tilde{\nu}_{\max}$.
    correct:
      value: 4.0
      tolerance: 0.05
    rationale_markdown: Because $\Delta t_{\max} \propto T_{\min} \propto 1/\tilde{\nu}_{\max}$,
      lowering the highest active vibrational wavenumber from $3000\,\mathrm{cm}^{-1}$
      to $750\,\mathrm{cm}^{-1}$ increases the maximum stable timestep by a factor
      of $\frac{3000}{750} = 4.0$ (from $0.55\,\mathrm{fs}$ to $2.20\,\mathrm{fs}$).
  - id: sec_19_2_ensemble_metric_fixman
    type: markdown_section
    title: '2. Effects on the Statistical Ensemble: Stiff Springs vs. Holonomic Constraints'
    body_markdown: |-
      A crucial warning in molecular simulations (first analyzed by Gibbs and Fixman, 1974):
      > **Taking the limit of a stiff harmonic spring ($k_{\mathrm{bond}} \to \infty$) does NOT yield the exact same equilibrium configurational distribution as simulating dynamics on a holonomically constrained surface ($\sigma(\mathbf{R}) = 0$ and $\dot{\sigma}(\mathbf{R}) = 0$)!**

      ### Why Do the Ensembles Differ? (The Metric Tensor / Jacobian Effect)
      Suppose we transform from $3N$ Cartesian coordinates $\mathbf{R}$ to generalized coordinates $\mathbf{q} = (\mathbf{u}, \boldsymbol{\sigma})$, where $\mathbf{u}$ are the $3N - n_c$ unconstrained internal/translational coordinates and $\boldsymbol{\sigma} = (\sigma_1, \dots, \sigma_{n_c})$ are the $n_c$ constraint coordinates. The kinetic energy is:
      $$K = \frac{1}{2}\dot{\mathbf{R}}^T \mathbf{M} \dot{\mathbf{R}} = \frac{1}{2}\dot{\mathbf{q}}^T \mathbf{G}(\mathbf{q})\dot{\mathbf{q}} = \frac{1}{2}\mathbf{p}_q^T \mathbf{G}^{-1}(\mathbf{q})\mathbf{p}_q$$
      where $\mathbf{G}(\mathbf{q}) = \mathbf{J}^T \mathbf{M} \mathbf{J}$ is the covariant **mass-metric tensor** and $\det\mathbf{G}(\mathbf{q}) \propto (\det\mathbf{J})^2$.

      1. **Stiff Harmonic Spring Limit ($k_{\mathrm{bond}} \to \infty$):**
       Both the constraint coordinate $\boldsymbol{\sigma}$ and its conjugate momentum $\mathbf{p}_\sigma$ remain active degrees of freedom in the $6N$-dimensional phase space. Integrating over *all* $3N$ momenta $\mathbf{p}_q$ produces $(\det\mathbf{G})^{1/2}$, which **exactly cancels** the coordinate Jacobian $\det\mathbf{J} \propto (\det\mathbf{G})^{1/2}$! In the limit $k_{\mathrm{bond}} \to \infty$, $\sigma_k \to 0$ with uniform kinetic weight. For a triatomic molecule $\mathrm{A{-}B{-}C}$ with no bending potential ($V(\theta)=0$), the bond-angle distribution is purely geometric:
       $$P_{\mathrm{spring}}(\theta) = \frac{1}{2}\sin\theta$$
      2. **Holonomic Rigid Constraint ($\sigma_k(\mathbf{R}) = 0$ AND $\dot{\sigma}_k(\mathbf{R}) = 0$):**
       A true mechanical constraint sets the velocity $\dot{\boldsymbol{\sigma}} = \mathbf{0}$, which is **not** equivalent to setting the conjugate momentum $\mathbf{p}_\sigma = \mathbf{0}$ cleanly without coupling, so integrating out only the $3N - n_c$ unconstrained momenta $\mathbf{p}_u$ on the submanifold $\boldsymbol{\sigma}=\mathbf{0}$ leaves behind an uncancelled mass-metric determinant factor $|\det \mathbf{M}_{\mathrm{sub}}(\mathbf{u})|^{1/2} \propto |\det \mathbf{Z}(\mathbf{R})|^{-1/2}$, where:
       $$Z_{kl}(\mathbf{R}) = \sum_{i=1}^N \frac{1}{m_i} \nabla_{\mathbf{r}_i}\sigma_k(\mathbf{R}) \cdot \nabla_{\mathbf{r}_i}\sigma_l(\mathbf{R})$$
       For a symmetric triatomic molecule ($\mathrm{A{-}B{-}C}$) with outer masses $m$ and central mass $m_B$ (defining $\gamma = \frac{m}{m + m_B}$, so $\gamma = \frac{1}{2}$ for equal masses), the two bond constraints share the central atom $\mathrm{B}$, giving:
       $$P_{\mathrm{rigid}}(\theta) \propto \sin\theta \sqrt{1 - \gamma^2\cos^2\theta}$$
       Because $\sqrt{1 - \gamma^2\cos^2\theta}$ is maximized at $\theta = 90^\circ$ and minimized at $\theta = 0^\circ, 180^\circ$, **holonomic bond constraints bias the triatomic angle toward perpendicular ($\theta=90^\circ$) configurations!**

      ### The Fixman Compensating Potential
      If one wishes a holonomically constrained MD simulation to sample the exact stiff-spring equilibrium distribution $P_{\mathrm{spring}}(\mathbf{u})$, one adds the **Fixman potential** to the Hamiltonian:
      $$U_{\mathrm{Fixman}}(\mathbf{R}) = \frac{1}{2}k_B T \ln\det\mathbf{Z}(\mathbf{R}) = -\frac{1}{2}k_B T \ln(1 - \gamma^2\cos^2\theta)$$
      Note that for a single isolated diatomic molecule (only 1 bond constraint) or a completely rigid molecule, $\det\mathbf{Z}$ is a constant independent of internal angles, so there is **no** metric tensor distortion!
  - id: concept_19_2_ensemble_metric
    type: concept_cell
    title: 'Interactive Explorer: Stiff-Spring vs. Rigid-Constraint Bond Angle Distribution'
    description_markdown: Vary the outer-to-central atomic mass ratio $m / m_B$ of
      a triatomic molecule $\mathrm{A{-}B{-}C}$ to see how the shared central atom
      couples the two bond constraints and distorts the equilibrium bond-angle probability
      density $P_{\mathrm{rigid}}(\theta)$ relative to the stiff-spring limit $P_{\mathrm{spring}}(\theta)
      = \frac{1}{2}\sin\theta$.
    render_function: render_stiff_spring_vs_rigid_ensemble
    layout: figure_left
    controls:
      mass_ratio_m_over_mB:
        kind: slider
        label: Mass Ratio m_outer / m_central (m / m_B)
        min: 0.05
        max: 5.0
        step: 0.05
        default: 1.0
      plot_mode:
        kind: dropdown
        label: Plot View
        default: distributions
        options:
        - label: Angle Probability Densities P_spring(θ) vs. P_rigid(θ)
          value: distributions
        - label: Metric Determinant Factor & Fixman Potential U_Fixman(θ)
          value: metric_and_fixman
    takeaway_markdown: '**Key Takeaway:** Because bond constraints are non-linear
      in Cartesian coordinates and share atoms, suppressing motion normal to the constraint
      surface changes the phase-space volume element by $\sqrt{1 - \gamma^2\cos^2\theta}$.
      Only when the central atom is infinitely heavy ($m/m_B \to 0 \implies \gamma
      \to 0$) do the two bond constraints decouple!'
  - id: q19_06
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_19_2_ensemble_metric_fixman
    prompt_markdown: What is the fundamental statistical-mechanical reason that a
      molecular dynamics trajectory on a holonomically constrained surface ($\sigma(\mathbf{R})
      = 0, \dot{\sigma}(\mathbf{R}) = 0$) generates a different equilibrium configurational
      distribution than a flexible bond model in the stiff-spring limit ($k_{\mathrm{bond}}
      \to \infty$)?
    hint_markdown: Consider what happens when you integrate over the momenta in generalized
      coordinates when $\dot{\sigma} = 0$ is enforced vs. When $\dot{\sigma}$ fluctuates
      thermally in a harmonic well.
    options:
    - id: a
      text: Stiff harmonic springs change the molecular stoichiometry, whereas holonomic
        constraints conserve particle number
      text_markdown: Stiff harmonic springs change the molecular stoichiometry, whereas
        holonomic constraints conserve particle number
    - id: b
      text: The Verlet algorithm violates conservation of total energy whenever spring
        constants exceed $10^3\\,\text{eV/Å}^2$
      text_markdown: The Verlet algorithm violates conservation of total energy whenever
        spring constants exceed $10^3\\,\text{eV/Å}^2$
    - id: c
      text: Constraints are non-linear in Cartesian coordinates, so setting the velocity
        normal to the constraint surface to zero ($\dot{\sigma}=0$) removes the momentum-space
        Gaussian integral factor that would otherwise cancel the configuration-dependent
        Jacobian metric determinant
      text_markdown: Constraints are non-linear in Cartesian coordinates, so setting
        the velocity normal to the constraint surface to zero ($\dot{\sigma}=0$) removes
        the momentum-space Gaussian integral factor that would otherwise cancel the
        configuration-dependent Jacobian metric determinant
    - id: d
      text: Holonomic constraints continuously inject kinetic energy into the system
        via non-conservative friction
      text_markdown: Holonomic constraints continuously inject kinetic energy into
        the system via non-conservative friction
    correct: c
    rationale_markdown: In unconstrained generalized coordinates, integrating over
      all $3N$ momenta yields $(\det\mathbf{G})^{1/2}$, canceling the coordinate transformation
      Jacobian $\det\mathbf{J}$. When $\dot{\boldsymbol{\sigma}}=\mathbf{0}$ is imposed
      holonomically, the momentum integral is restricted to the $3N-n_c$ tangent space
      on the constraint manifold, leaving an uncancelled configuration-dependent metric
      determinant factor $|\det\mathbf{Z}(\mathbf{R})|^{-1/2}$.
  - id: q19_07
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: concept_19_2_ensemble_metric
    prompt_markdown: Consider a homonuclear triatomic molecule ($\mathrm{A{-}A{-}A}$,
      equal atomic masses $m_1=m_2=m_3=m$, so $\gamma = \frac{m}{m+m} = \frac{1}{2}$)
      with zero bending potential ($V(\theta)=0$). Compared to the stiff-spring distribution
      $P_{\mathrm{spring}}(\theta) = \frac{1}{2}\sin\theta$, how does the holonomically
      constrained rigid-bond distribution $P_{\mathrm{rigid}}(\theta) \propto \sin\theta\sqrt{1
      - \frac{1}{4}\cos^2\theta}$ behave?
    hint_markdown: Evaluate $\sqrt{1 - \frac{1}{4}\cos^2\theta}$ at $\theta = 90^\circ$
      ($\cos\theta = 0$) versus $\theta = 0^\circ, 180^\circ$ ($\cos^2\theta = 1$).
    options:
    - id: a
      text: It forces the bond angle $\theta$ to remain fixed at its initial value
        $\theta(0)$
      text_markdown: It forces the bond angle $\theta$ to remain fixed at its initial
        value $\theta(0)$
    - id: b
      text: It enhances the probability of collinear configurations ($\theta = 0^\circ,
        180^\circ$) relative to right-angle configurations ($\theta = 90^\circ$)
      text_markdown: It enhances the probability of collinear configurations ($\theta
        = 0^\circ, 180^\circ$) relative to right-angle configurations ($\theta = 90^\circ$)
    - id: c
      text: It is identical to $P_{\mathrm{spring}}(\theta)$ at all angles $\theta$
      text_markdown: It is identical to $P_{\mathrm{spring}}(\theta)$ at all angles
        $\theta$
    - id: d
      text: It enhances the probability of right-angle configurations ($\theta = 90^\circ$)
        relative to collinear configurations ($\theta = 0^\circ, 180^\circ$)
      text_markdown: It enhances the probability of right-angle configurations ($\theta
        = 90^\circ$) relative to collinear configurations ($\theta = 0^\circ, 180^\circ$)
    correct: d
    rationale_markdown: The metric factor $\sqrt{1 - \frac{1}{4}\cos^2\theta}$ equals
      $1$ at $\theta = 90^\circ$ ($\cos 90^\circ = 0$) and drops to $\sqrt{3/4} \approx
      0.866$ as $\theta \to 0^\circ$ or $180^\circ$ ($\cos^2\theta \to 1$). Thus,
      right-angle configurations are statistically favored over collinear ones in
      the rigid-bond ensemble.
  - id: q19_08
    type: problem
    question_type: numeric
    difficulty: hard
    taught_by: concept_19_2_ensemble_metric
    prompt_markdown: |-
      For the equal-mass triatomic chain ($\gamma = 0.5$) with holonomic bond constraints $\sigma_{12} = r_{12}^2 - d^2 = 0$ and $\sigma_{23} = r_{23}^2 - d^2 = 0$, compute the ratio of the metric determinant weighting factor $|\det\mathbf{M}(\theta)|^{1/2}$ at $\theta = 90^\circ$ to that at $\theta \to 0^\circ$:
      $$\frac{|\det\mathbf{M}(90^\circ)|^{1/2}}{|\det\mathbf{M}(0^\circ)|^{1/2}} = \frac{1}{\sqrt{1 - \gamma^2}}$$
      (Report your numerical answer to 4 decimal places.)
    hint_markdown: Evaluate the metric determinant ratio at the given mass-coupling
      parameter $\gamma = 0.5$.
    correct:
      value: 1.1547
      tolerance: 0.002
    rationale_markdown: With $\gamma = \frac{1}{2}$, $\gamma^2 = \frac{1}{4} = 0.25$.
      Therefore, $\frac{1}{\sqrt{1 - 0.25}} = \frac{1}{\sqrt{0.75}} = \frac{2}{\sqrt{3}}
      \approx 1.1547$, a $15.5\%$ relative statistical bias between perpendicular
      and collinear bond angles!
  - id: q19_09
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: concept_19_2_ensemble_metric
    prompt_markdown: In the triatomic molecule $\mathrm{A{-}B{-}C}$ with two constrained
      bonds ($\mathrm{A{-}B}$ and $\mathrm{B{-}C}$), in what physical mass limit does
      the metric-tensor ensemble bias vanish ($\gamma = \frac{m_{\mathrm{outer}}}{m_{\mathrm{outer}}
      + m_{\mathrm{central}}} \to 0$) so that $P_{\mathrm{rigid}}(\theta) = P_{\mathrm{spring}}(\theta)$?
    hint_markdown: 'Use the Mass Ratio slider in the interactive explorer above: what
      happens as $m_{\mathrm{outer}} / m_{\mathrm{central}} \to 0$?'
    options:
    - id: a
      text: When the central shared atom B is much heavier than the outer atoms A
        and C ($m_B \gg m_A, m_C$)
      text_markdown: When the central shared atom B is much heavier than the outer
        atoms A and C ($m_B \gg m_A, m_C$)
    - id: b
      text: When the central shared atom B is much lighter than the outer atoms A
        and C ($m_B \ll m_A, m_C$)
      text_markdown: When the central shared atom B is much lighter than the outer
        atoms A and C ($m_B \ll m_A, m_C$)
    - id: c
      text: When all three atoms have equal mass ($m_A = m_B = m_C$)
      text_markdown: When all three atoms have equal mass ($m_A = m_B = m_C$)
    - id: d
      text: The metric bias is a universal geometric constant independent of atomic
        masses
      text_markdown: The metric bias is a universal geometric constant independent
        of atomic masses
    correct: a
    rationale_markdown: The coupling between the two bond constraints arises because
      both bonds pull on the shared central atom $\mathrm{B}$ (off-diagonal element
      $Z_{12} \propto \frac{1}{m_B}\mathbf{r}_{12}\cdot\mathbf{r}_{23}$). When $m_B
      \to \infty$, $\gamma = \frac{m}{m + m_B} \to 0$, atom $\mathrm{B}$ acts as an
      immovable pivot, the two constraints kinetically decouple, and the metric factor
      $\sqrt{1 - \gamma^2\cos^2\theta} \to 1$.
