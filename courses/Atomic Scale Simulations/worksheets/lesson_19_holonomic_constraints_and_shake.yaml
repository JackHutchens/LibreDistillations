  - id: sec_19_3_rigid_bodies_quaternions
    type: markdown_section
    title: '3. Constrained Coordinate Systems: Linear Molecules, Euler Angles & Quaternions'
    body_markdown: |-
      Instead of enforcing constraints in Cartesian coordinates, can we simply rewrite the equations of motion directly in **generalized (internal) coordinates** that automatically satisfy the constraints?

      ### Linear and Completely Rigid Molecules
      - **Linear Molecule (e.g., $\mathrm{CO_2}$, $\mathrm{N_2}$):** Has $3N$ Cartesian coordinates reduced to **5 degrees of freedom per molecule**: 3 coordinates for the Center of Mass ($\mathbf{R}_{\mathrm{COM}}$, which moves via $\mathbf{F}_{\mathrm{tot}} = M\ddot{\mathbf{R}}_{\mathrm{COM}}$) and 2 rotational coordinates represented by a unit orientation vector $\hat{\mathbf{u}}$ ($|\hat{\mathbf{u}}|=1$), which rotates under applied torque $\boldsymbol{\tau}$.
      - **General 3D Rigid Nonlinear Molecule (e.g., rigid $\mathrm{H_2O}$, benzene):** Has **6 degrees of freedom per molecule**: 3 translational ($\mathbf{R}_{\mathrm{COM}}$) and 3 rotational orientation angles.

      ### The Fatal Flaw of Euler Angles: Coordinate Singularity (Gimbal Lock)
      If we represent the 3D orientation of a rigid body using the three **Euler angles** $(\phi, \theta, \psi)$ (precession, nutation/tilt from the $z$-axis, and body spin), the kinematic equations relating $(\dot{\phi}, \dot{\theta}, \dot{\psi})$ to the angular velocity $\boldsymbol{\omega}$ contain factors of $\frac{1}{\sin\theta}$:
      $$\dot{\phi} = \frac{\omega_x\sin\psi + \omega_y\cos\psi}{\sin\theta}, \qquad \dot{\psi} = \omega_z - \cot\theta\,(\omega_x\sin\psi + \omega_y\cos\psi)$$
      When the molecular axis aligns with the laboratory $z$-axis (**the North or South Pole**, $\theta \to 0$ or $\theta \to \pi$), $\sin\theta \to 0$! At the pole, $\phi$ and $\psi$ become degenerate (**gimbal lock**), and $\dot{\phi}, \dot{\psi} \to \infty$, causing numerical integration to blow up even though the physical motion is completely smooth!

      ### The Solution: 4-Component Unit Quaternions (Evans 1977)
      To eliminate coordinate singularities everywhere on the rotation group $SO(3)$, we parameterize orientation using a **4-component unit quaternion** $\mathbf{Q} = (q_0, q_1, q_2, q_3)$ subject to a **single normalization constraint**:
      $$q_0^2 + q_1^2 + q_2^2 + q_3^2 = 1$$
      In terms of a rotation by angle $\alpha$ about a unit axis $\hat{\mathbf{n}}$, $q_0 = \cos(\alpha/2)$ and $(q_1, q_2, q_3) = \hat{\mathbf{n}}\sin(\alpha/2)$. The quaternion time derivatives are linear, bilinear, and **completely free of $\frac{1}{\sin\theta}$ singularities**:
      $$\begin{pmatrix}\dot{q}_0 \\ \dot{q}_1 \\ \dot{q}_2 \\ \dot{q}_3\end{pmatrix} = \frac{1}{2}\begin{pmatrix} 0 & -\omega_{bx} & -\omega_{by} & -\omega_{bz} \\ \omega_{bx} & 0 & \omega_{bz} & -\omega_{by} \\ \omega_{by} & -\omega_{bz} & 0 & \omega_{bx} \\ \omega_{bz} & \omega_{by} & -\omega_{bx} & 0 \end{pmatrix}\begin{pmatrix}q_0 \\ q_1 \\ q_2 \\ q_3\end{pmatrix}$$

      ### Why Not Use Generalized Coordinates for Partially Rigid Molecules?
      1. For **partially rigid molecules** (like polymers with fixed bond lengths but flexible bond angles and torsions), deriving and inverting the $M(\mathbf{q})\ddot{\mathbf{q}}$ mass matrix in generalized coordinates becomes algebraically intractable and scales as $\mathcal{O}(n_c^3)$ per molecule.
      2. **Reducing the number of degrees of freedom (D.O.F.) does NOT *per se* save computer time**, because CPU time is dominated by the $\mathcal{O}(N^2)$ or $\mathcal{O}(N)$ pairwise intermolecular force evaluation in Cartesian coordinates, and transforming back and forth between curvilinear generalized coordinates and Cartesian positions adds heavy trigonometric overhead.
