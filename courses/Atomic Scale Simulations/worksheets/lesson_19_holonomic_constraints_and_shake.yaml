    correct: a
    rationale_markdown: Because SHAKE displaces atoms along the *old* bond direction
      $\mathbf{r}_{ij}(t)$ to fix the length of $\mathbf{r}_{ij}(t+h)$, the linearized
      Newton denominator contains the dot product $\mathbf{r}_{ij}(t+h)\cdot\mathbf{r}_{ij}(t)$.
      If a bond rotates by $\sim 90^\circ$ in a single step (or stretches past the
      saddle point of the quadratic equation in $\lambda$), the projection vanishes
      and SHAKE fails to converge—a classic diagnostic of an unstable MD timestep
      or bad initial geometry.
