  - id: sec_19_5_cpmd_orthonormality
    type: markdown_section
    title: 5. Constraints in Ab Initio (Car–Parrinello) Molecular Dynamics (CPMD)
    body_markdown: |-
      Holonomic constraints play an equally foundational role in **Ab Initio Molecular Dynamics (Car–Parrinello MD, 1985)**, where we combine quantum-mechanical Density Functional Theory (DFT) for the electrons with classical MD for the ions.

      ### 1. Dynamical Electronic Wave Functions & Orthonormality Constraints
      In Car–Parrinello MD, instead of diagonalizing the Kohn–Sham Hamiltonian from scratch at every ionic step, the single-particle electronic orbitals $\{\phi_i(\mathbf{r})\}_{i=1}^N$ are treated as fictitious classical dynamical fields with fictitious mass $\mu$ that evolve via MD equations of motion alongside the ions.
      - Because electrons are fermions obeying the Pauli exclusion principle, the $N$ single-particle electronic wave functions must remain **mutually orthonormal** at every timestep:
       $$S_{ij} = \langle \phi_j | \phi_i \rangle = \int d\mathbf{r}\,\phi_j^*(\mathbf{r})\phi_i(\mathbf{r}) = \delta_{ij}$$
      - Expanding each orbital in a basis of $M$ functions $\{f_\alpha(\mathbf{r})\}_{\alpha=1}^M$:
       $$\phi_j(\mathbf{r}) = \sum_{\alpha=1}^M c_{j\alpha}\,f_\alpha(\mathbf{r})$$
       where $\mathbf{c}$ is an $N \times M$ coefficient matrix ($N$ occupied orbitals, $M$ basis functions), the orthonormality condition becomes the matrix holonomic constraint:
       $$\mathbf{c}^*\,\mathbf{T}\,\mathbf{c}^T = \mathbf{I}_{N\times N}, \qquad \text{where } T_{\alpha\beta} = \int d\mathbf{r}\,f_\alpha^*(\mathbf{r})f_\beta(\mathbf{r}) \text{ is the basis overlap matrix.}$$
       (For an orthonormal plane-wave basis, $T_{\alpha\beta} = \delta_{\alpha\beta}$, so $\mathbf{c}^*\mathbf{c}^T = \mathbf{I}$.)

      ### 2. Counting the Orthonormality Constraints
      How many independent holonomic constraints are contained in $S_{ij} = \langle \phi_j | \phi_i \rangle = \delta_{ij}$ for $N$ real (or Hermitian-symmetric) orbitals?
      - There are $N$ **normalization** constraints on the diagonal ($i = j$): $\langle \phi_i | \phi_i \rangle = 1$.
      - There are $\frac{N(N-1)}{2}$ **orthogonality** constraints off the diagonal ($i < j$): $\langle \phi_j | \phi_i \rangle = 0$.
      - Total number of independent holonomic constraints:
       $$n_c = N + \frac{N(N-1)}{2} = \frac{N(N+1)}{2}$$

      ### 3. Enforcing Wave-Function Orthogonality with SHAKE
      Just as in atomic SHAKE, we advance the orbital coefficients $\phi_i(\mathbf{r}, t+h)$ with an unconstrained Verlet step and then apply an iterative SHAKE projection using an $N\times N$ Hermitian matrix of Lagrange multipliers $\Lambda_{ij}$ to enforce $\langle \phi_j | \phi_i \rangle = \delta_{ij}$:
      $$\phi_i \longleftarrow \phi_i - \frac{1}{2}\sum_{j \ne i} \phi_j \langle \phi_j | \phi_i \rangle \quad (\text{plus diagonal normalization } \phi_i \leftarrow \phi_i / \|\phi_i\|)$$
      This iterative matrix SHAKE loop rapidly orthogonalizes all $N$ electronic wave functions at every MD step without requiring an $\mathcal{O}(M^3)$ full Hamiltonian diagonalization!
