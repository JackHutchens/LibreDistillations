      text_markdown: The denominator $\nabla\sigma_k(\mathbf{R}(t+h))\cdot\nabla\sigma_k(\mathbf{R}(t))$
        vanishes, causing the Newton step $\delta\lambda_k$ to diverge and the SHAKE
