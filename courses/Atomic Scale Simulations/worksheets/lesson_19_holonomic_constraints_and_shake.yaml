  - id: sec_19_4_shake_algorithm
    type: markdown_section
    title: '4. The SHAKE Algorithm: Holonomic Constraints in Cartesian Verlet Dynamics'
    body_markdown: |-
      Introduced by **Ryckaert, Ciccotti & Berendsen (1977)**, the **SHAKE algorithm** works directly with **Cartesian atomic coordinates**: at each timestep, the dynamics first move forward *without* constraints, and the algorithm then iteratively readjusts atomic positions to satisfy all constraints $\sigma_k(\mathbf{R}) = 0$.

      ### 1. Quadratic Form of Bond Constraints & Constrained Equations of Motion
      For a fixed bond length $a_{ij}$ between atoms $i$ and $j$, we write the holonomic constraint in **squared form** (avoiding costly square roots and keeping $\nabla\sigma$ linear!):
      $$\sigma_k(\mathbf{R}) = |\mathbf{r}_i - \mathbf{r}_j|^2 - a_{ij}^2 = r_{ij}^2 - a_{ij}^2 = 0$$
      whose gradients with respect to $\mathbf{r}_i$ and $\mathbf{r}_j$ are simply:
      $$\nabla_{\mathbf{r}_i}\sigma_k = 2(\mathbf{r}_i - \mathbf{r}_j) = -\nabla_{\mathbf{r}_j}\sigma_k$$
      From Hamilton's principle of least action with Lagrange multipliers $\lambda_k(t)$, the constrained Cartesian equation of motion is:
      $$m_i \mathbf{a}_i(t) = m_i \ddot{\mathbf{r}}_i(t) = \mathbf{F}_i(t) - \sum_{k=1}^{n_c} \lambda_k(t)\,\nabla_{\mathbf{r}_i}\sigma_k(\mathbf{R}(t))$$
      > **Why not solve the analytical differential equation for $\lambda_k(t)$ from $\ddot{\sigma}_k = 0$?**
      > Because finite-timestep numerical integration errors ($\mathcal{O}(h^4)$ per step) accumulate rapidly, causing the trajectory to **drift away from the constraint surface** ($\sigma_k(\mathbf{R}) \ne 0$). Instead, SHAKE determines $\lambda_k(t)$ algebraically at every step so that $\sigma_k[\mathbf{R}(t+h)] = 0$ is satisfied to machine precision!

      ### 2. Verlet Integration with SHAKE & Time Reversibility
      Inserting the total force into the Verlet algorithm with timestep $h = \Delta t$:
      $$\mathbf{r}_i(t+h) = \underbrace{2\mathbf{r}_i(t) - \mathbf{r}_i(t-h) + \frac{h^2}{m_i}\mathbf{F}_i(t)}_{\equiv\,\mathbf{r}_i^{\mathrm{unc}}(t+h)\text{ (unconstrained Verlet step)}} - \frac{h^2}{m_i}\sum_{k=1}^{n_c} \lambda_k(t)\,\nabla_{\mathbf{r}_i}\sigma_k(\mathbf{R}(t))$$
      Notice a crucial design feature: the constraint force direction $\nabla_{\mathbf{r}_i}\sigma_k(\mathbf{R}(t)) = 2(\mathbf{r}_i(t) - \mathbf{r}_j(t))$ is evaluated at the **old configuration $\mathbf{R}(t)$** (the midpoint of the Verlet step from $t-h$ to $t+h$), while the multiplier $\lambda_k(t)$ is chosen so that the **new configuration $\mathbf{R}(t+h)$** satisfies $\sigma_k(\mathbf{R}(t+h)) = 0$.
      - Evaluating $\nabla\sigma_k$ at $\mathbf{R}(t)$ ensures that the constraint update is symmetric under $t-h \leftrightarrow t+h$, making the SHAKE-Verlet algorithm **strictly time-reversible and symplectic**!

      ### 3. Single Constraint vs. Multiple Coupled Constraints (Iterative Newton / Gauss–Seidel Cycle)
      Define $\mathbf{R}_0 \equiv \mathbf{R}^{\mathrm{unc}}(t+h)$ and $\mathbf{G}_{0,i} \equiv \frac{h^2}{m_i}\nabla_{\mathbf{r}_i}\sigma(\mathbf{R}(t))$. We want $\sigma(\mathbf{R}_0 - \lambda\mathbf{G}_0) = 0$. Since $\sigma$ is quadratic in $\mathbf{R}$, this is a non-linear equation in $\lambda$. Expanding to first order about iterate $\lambda_n$ (Newton's method):
      $$0 \approx \sigma(\mathbf{R}_n) - (\lambda_{n+1} - \lambda_n)\,\nabla\sigma(\mathbf{R}_n)\cdot\mathbf{G}_0 \implies \delta\lambda = \lambda_{n+1} - \lambda_n = \frac{\sigma(\mathbf{R}_n)}{\nabla\sigma(\mathbf{R}_n)\cdot\mathbf{G}_0}$$
      For **multiple constraints** $\sigma_k$, adjusting bond $k$ moves shared atoms and perturbs adjacent bonds. SHAKE loops cyclically over all constraints $k = 1, \dots, n_c$, updating the positions of the atoms in constraint $k$ at each inner step:
      $$\mathbf{r}_i^{\mathrm{new}}(t+h) = \mathbf{r}_i(t+h) - \frac{\nabla_{\mathbf{r}_i}\sigma_k(\mathbf{R}(t))\,\sigma_k(\mathbf{R}(t+h))}{\sum_j \frac{m_i}{m_j}\,\nabla_{\mathbf{r}_j}\sigma_k(\mathbf{R}(t+h))\cdot\nabla_{\mathbf{r}_j}\sigma_k(\mathbf{R}(t))}$$
      Specifically, for a bond constraint $\sigma_k = |\mathbf{r}_{ij}|^2 - a_{ij}^2$ between atoms $i$ and $j$, with $\nabla_{\mathbf{r}_i}\sigma_k = 2\mathbf{r}_{ij}$, the linearized SHAKE update shifts atoms $i$ and $j$ along the old bond vector $\mathbf{r}_{ij}(t)$ by:
      $$\delta\mathbf{r}_i = -\frac{g_k}{m_i}\mathbf{r}_{ij}(t), \qquad \delta\mathbf{r}_j = +\frac{g_k}{m_j}\mathbf{r}_{ij}(t), \qquad g_k = \frac{|\mathbf{r}_{ij}^{\mathrm{cur}}(t+h)|^2 - a_{ij}^2}{2\left(\frac{1}{m_i} + \frac{1}{m_j}\right)\mathbf{r}_{ij}^{\mathrm{cur}}(t+h)\cdot\mathbf{r}_{ij}(t)}$$
      We sweep over all constraints $\sigma_k$ until $\max_k |\sigma_k(\mathbf{R}(t+h))| < \varepsilon$.

      ### 4. Computational Cost & Efficiency of SHAKE
      - Typically, one must iterate the SHAKE Newton cycle **about 25 times** per MD step.
      - However, **because the expensive intermolecular force $\mathbf{F}_i(t)$ is NEVER re-evaluated inside the SHAKE loop** (only simple geometric dot products of constraint bonds are computed!), the entire SHAKE cycle takes only **$\sim 25\%$ of the total CPU time**, while enabling a $3\text{–}5\times$ larger timestep $\Delta t$—yielding a massive net speedup!
