    text_markdown: $v_{\text{short}}(r)$ decays faster so $r_c$ decreases (less real-space work), while $v_{\text{long}}(k)$
      decays slower so $k_c$ increases (more $k$-space work).
  - id: b
    text: Both $r_c$ and $k_c$ decrease simultaneously, reducing total work to $\mathcal{O}(1)$.
    text_markdown: Both $r_c$ and $k_c$ decrease simultaneously, reducing total work to $\mathcal{O}(1)$.
  - id: c
    text: $v_{\text{short}}(r)$ decays slower so $r_c$ increases, while $v_{\text{long}}(k)$ decays faster so $k_c$ decreases.
    text_markdown: $v_{\text{short}}(r)$ decays slower so $r_c$ increases, while $v_{\text{long}}(k)$ decays faster so $k_c$
      decreases.
  - id: d
    text: Neither $r_c$ nor $k_c$ depends on $\kappa$.
    text_markdown: Neither $r_c$ nor $k_c$ depends on $\kappa$.
  correct: a
  rationale_markdown: In real space, $\text{erfc}(\kappa r_c) \le \epsilon$ requires $\kappa r_c = \text{const} \implies r_c
    \propto 1/\kappa$ (shrinks as $\kappa$ increases). In $k$-space, $e^{-k_c^2/(4\kappa^2)} \le \epsilon$ requires $k_c /
    (2\kappa) = \text{const} \implies k_c \propto \kappa$ (grows as $\kappa$ increases).
- id: q18_ewald_self_energy_origin
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by: sec_ewald_summation_method
  prompt_markdown: Why must the constant self-energy term $V_{\text{self}} = -\frac{\kappa}{\sqrt{\pi}}\sum_{i=1}^N q_i^2$
    be subtracted from the reciprocal-space Ewald sum?
  hint_markdown: Notice that the $k$-space structure factor product $|\rho_{\mathbf{k}}|^2 = \sum_{i,j} q_i q_j e^{i\mathbf{k}\cdot(\mathbf{r}_i
    - \mathbf{r}_j)}$ includes the diagonal $i = j$ terms.
  options:
  - id: a
    text: Because factoring the $k$-space double sum into $|\rho_{\mathbf{k}}|^2$ includes the $i = j$ interaction of each
      point charge with its own compensating Gaussian cloud at $r = 0$, where $\lim_{r\to 0} \frac{\operatorname{erf}(\kappa
      r)}{r} = \frac{2\kappa}{\sqrt{\pi}}$.
    text_markdown: Because factoring the $k$-space double sum into $|\rho_{\mathbf{k}}|^2$ includes the $i = j$ interaction
      of each point charge with its own compensating Gaussian cloud at $r = 0$, where $\lim_{r\to 0} \frac{\operatorname{erf}(\kappa
      r)}{r} = \frac{2\kappa}{\sqrt{\pi}}$.
  - id: b
    text: Because $\frac{\operatorname{erfc}(\kappa r)}{r}$ approaches $\frac{2\kappa}{\sqrt{\pi}}$ at $r = \infty$.
    text_markdown: Because $\frac{\operatorname{erfc}(\kappa r)}{r}$ approaches $\frac{2\kappa}{\sqrt{\pi}}$ at $r = \infty$.
  - id: c
    text: Because the minimum image convention double-counts pairs at $r = L/2$.
    text_markdown: Because the minimum image convention double-counts pairs at $r = L/2$.
  - id: d
    text: Because the total charge $\sum q_i$ of an ionic crystal is always nonzero.
    text_markdown: Because the total charge $\sum q_i$ of an ionic crystal is always nonzero.
  correct: a
  rationale_markdown: Writing $\frac{1}{2}\sum_{i,j} q_i q_j e^{i\mathbf{k}\cdot(\mathbf{r}_i - \mathbf{r}_j)} v_{\mathbf{k}}
    = \frac{1}{2}\sum_{\mathbf{k}} |\rho_{\mathbf{k}}|^2 v_{\mathbf{k}}$ includes the $i=j$ terms $\frac{1}{2}\sum_i q_i^2
    v_{\text{long}}(r=0)$. Since $\lim_{r\to 0} \frac{\text{erf}(\kappa r)}{r} = \frac{2\kappa}{\sqrt{\pi}}$, subtracting
    this unphysical self-interaction gives $V_{\text{self}} = -\frac{\kappa}{\sqrt{\pi}}\sum_i q_i^2$.
- id: q19_ewald_self_energy_numeric
  type: problem
  question_type: numeric
  difficulty: medium
  taught_by: sec_ewald_summation_method
  prompt_markdown: An Ewald simulation box contains $N = 100$ monovalent ions ($50$ cations with $q_i = +1$ and $50$ anions
    with $q_i = -1$, in electrostatic units where $4\pi\varepsilon_0 = 1$). If the Ewald screening parameter is set to $\kappa
    = 0.5\sqrt{\pi}\text{ Å}^{-1} \approx 0.8862\text{ Å}^{-1}$, what is the exact value of the Ewald self-energy correction
    $V_{\text{self}} = -\frac{\kappa}{\sqrt{\pi}}\sum_{i=1}^N q_i^2$ (in $\text{e}^2/\text{Å}$)?
  hint_markdown: Evaluate the self-energy formula using the ratio $\kappa / \sqrt{\pi}$ and the sum of squared charges.
  correct:
    value: -50.0
    tolerance: 0.1
  rationale_markdown: Since $q_i^2 = (\pm 1)^2 = 1$ for every ion, $\sum_{i=1}^{100} q_i^2 = 100$. With $\kappa / \sqrt{\pi}
    = 0.5$, the self-energy correction is $V_{\text{self}} = -0.5 \times 100 = -50.0\text{ e}^2/\text{Å}$.
- id: q20_ewald_dipole_boundary_conditions
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by: sec_ewald_summation_method
  prompt_markdown: In the Ewald summation for a macroscopically spherical assembly of periodic boxes embedded in an external
    medium of dielectric constant $\varepsilon$, the surface dipole correction is $V_{\text{dipole}} = \frac{2\pi}{(2\varepsilon
    + 1)\Omega}\left|\sum_i \boldsymbol{\mu}_i\right|^2$. How does $V_{\text{dipole}}$ behave for (i) a surrounding **conducting
    metal ('tin-foil' boundary, $\varepsilon \to \infty$)** versus (ii) a surrounding **vacuum (insulator in vacuum, $\varepsilon
    = 1$)**?
  hint_markdown: Evaluate $\frac{2\pi}{(2\varepsilon + 1)\Omega}$ as $\varepsilon \to \infty$ and at $\varepsilon = 1$.
  options:
  - id: a
    text: For a conducting boundary ($\varepsilon \to \infty$), $V_{\text{dipole}} = 0$; for vacuum boundary conditions ($\varepsilon
      = 1$), $V_{\text{dipole}} = \frac{2\pi}{3\Omega} |\sum \boldsymbol{\mu}_i|^2$.
    text_markdown: For a conducting boundary ($\varepsilon \to \infty$), $V_{\text{dipole}} = 0$; for vacuum boundary conditions
      ($\varepsilon = 1$), $V_{\text{dipole}} = \frac{2\pi}{3\Omega} |\sum \boldsymbol{\mu}_i|^2$.
  - id: b
    text: For a conducting boundary ($\varepsilon \to \infty$), $V_{\text{dipole}} \to \infty$; for vacuum ($\varepsilon =
      1$), $V_{\text{dipole}} = 0$.
    text_markdown: For a conducting boundary ($\varepsilon \to \infty$), $V_{\text{dipole}} \to \infty$; for vacuum ($\varepsilon
      = 1$), $V_{\text{dipole}} = 0$.
  - id: c
    text: In both cases, $V_{\text{dipole}} = \frac{4\pi}{\Omega} |\sum \boldsymbol{\mu}_i|^2$.
    text_markdown: In both cases, $V_{\text{dipole}} = \frac{4\pi}{\Omega} |\sum \boldsymbol{\mu}_i|^2$.
  - id: d
    text: $V_{\text{dipole}}$ is negative in vacuum and positive in a conductor.
    text_markdown: $V_{\text{dipole}}$ is negative in vacuum and positive in a conductor.
  correct: a
  rationale_markdown: When surrounded by a perfect conductor ('tin-foil' BCs, $\varepsilon \to \infty$), induced surface charges
    neutralize any macroscopic surface depolarization field so $V_{\text{dipole}} = 0$. In vacuum ($\varepsilon = 1$), $2\varepsilon
    + 1 = 3$, yielding the depolarization energy $V_{\text{dipole}} = \frac{2\pi}{3\Omega}|\sum_i \boldsymbol{\mu}_i|^2$.
- id: q21_ewald_dipole_term_numeric
  type: problem
  question_type: numeric
  difficulty: medium
  taught_by: sec_ewald_summation_method
  prompt_markdown: A cubic simulation box of volume $\Omega = 100\text{ nm}^3$ with **vacuum boundary conditions** ($\varepsilon
    = 1$) has an instantaneous total dipole moment of magnitude $|\sum_i \boldsymbol{\mu}_i| = 15.0$ (in reduced charge$\cdot\text{nm}$
    units). Calculate the surface dipole energy $V_{\text{dipole}} = \frac{2\pi}{(2\varepsilon + 1)\Omega}\left|\sum_i \boldsymbol{\mu}_i\right|^2$
    (round to 3 decimal places).
  hint_markdown: Evaluate the prefactor for vacuum conditions ($\varepsilon = 1$) and scale by the square of the total dipole
    moment divided by box volume.
  correct:
    value: 4.712
    tolerance: 0.01
  rationale_markdown: With $\varepsilon = 1$ and $\Omega = 100$, $V_{\text{dipole}} = \frac{2\pi}{3 \times 100} (15.0)^2 =
    \frac{2\pi}{300} \times 225 = 1.5\pi \approx 4.7124$.
- id: q22_ewald_kspace_damping_numeric
  type: problem
  question_type: numeric
  difficulty: easy
  taught_by:
  - sec_ewald_summation_method
  - concept_ewald_splitting
  prompt_markdown: In reciprocal space, the Ewald long-range potential is damped by the Gaussian factor $e^{-k^2 / (4\kappa^2)}$.
