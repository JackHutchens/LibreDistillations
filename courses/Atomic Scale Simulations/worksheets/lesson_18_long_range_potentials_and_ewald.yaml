- id: q36_one_component_plasma_background
  type: problem
  question_type: single_select
  difficulty: easy
  taught_by: sec_long_range_definition_and_stillinger_lovett
  prompt_markdown: If you want to simulate a **one-component charged system** (such as an electron gas or a lattice of $+1$
    ions with no counter-ions) in periodic boundary conditions, what must be added to prevent the electrostatic energy ($\mathbf{k}
    = \mathbf{0}$ term) from diverging to infinity?
  hint_markdown: Check and ('For one component system, need to add a background to make it neutral').
  options:
  - id: a
    text: A uniform neutralizing background charge density of opposite sign (jellium background), which exactly cancels the
      $k = 0$ divergence.
    text_markdown: A uniform neutralizing background charge density of opposite sign (jellium background), which exactly cancels
      the $k = 0$ divergence.
  - id: b
    text: A global Langevin friction term with $\zeta \to \infty$.
    text_markdown: A global Langevin friction term with $\zeta \to \infty$.
  - id: c
    text: An extra repulsive $1/r^{12}$ Lennard-Jones core at $r = 0$.
    text_markdown: An extra repulsive $1/r^{12}$ Lennard-Jones core at $r = 0$.
  - id: d
    text: Nothing; the sum $\sum_{\mathbf{L}\ne 0} 1/|\mathbf{r} - \mathbf{L}|$ converges to zero on its own.
    text_markdown: Nothing; the sum $\sum_{\mathbf{L}\ne 0} 1/|\mathbf{r} - \mathbf{L}|$ converges to zero on its own.
  correct: a
  rationale_markdown: A non-neutral periodic system has infinite total charge and an infinite $\mathbf{k} = \mathbf{0}$ Fourier
    component ($\int 4\pi r^2 (\rho/r)\,dr = \infty$). Adding a uniform neutralizing background charge density cancels the
    $\mathbf{k} = \mathbf{0}$ term and yields a well-defined finite energy (e.g., $-1.4186487/a$ for a simple cubic lattice).
- id: q37_cubic_lattice_wigner_check
  type: problem
  question_type: single_select
