  prompt_markdown: Calculate the exact Madelung constant $\alpha_{\text{1D}} = 2\sum_{n=1}^{\infty} \frac{(-1)^{n-1}}{n}$
    for an infinite 1D chain of alternating $\pm q$ ions with nearest-neighbor spacing $R$ (round to 4 decimal places).
  hint_markdown: Recognize the alternating harmonic series expansion of the natural logarithm of 2.
  correct:
    value: 1.3863
    tolerance: 0.001
  rationale_markdown: Using $\ln(1+x) = x - x^2/2 + x^3/3 - x^4/4 + \cdots$ at $x = 1$, the symmetric left-and-right sum is
    $\alpha_{\text{1D}} = 2(1 - 1/2 + 1/3 - 1/4 + \cdots) = 2\ln 2 \approx 1.386294$.
