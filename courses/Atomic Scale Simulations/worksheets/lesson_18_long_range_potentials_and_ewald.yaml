- id: q30_ewald_step_by_step_complexities
  type: problem
  question_type: single_select
  difficulty: hard
  taught_by: sec_kspace_algorithm_natoli_and_scaling
  prompt_markdown: 'In an optimally tuned Ewald sum ($\mathcal{O}(N^{3/2})$ overall, where the number of $\mathbf{k}$-vectors
    scales as $M_k \propto N^{1/2}$), what are the individual asymptotic scalings of: (1) computing the fundamental 1D phases
    $\exp(ik_0 x_i)$ for all particles, (3) summing over all $N$ particles to get $\rho_{\mathbf{k}}$ for all $M_k$ wavevectors,
    and (4) summing $|\rho_{\mathbf{k}}|^2 v_{\mathbf{k}}$ over the $M_k$ wavevectors to get the total reciprocal-space potential?'
  hint_markdown: Check the right-hand column of ('How to do it').
  options:
  - id: a
    text: Step (1) is $\mathcal{O}(N)$; Step (3) is $\mathcal{O}(N^{3/2})$; Step (4) is $\mathcal{O}(N^{1/2})$.
    text_markdown: Step (1) is $\mathcal{O}(N)$; Step (3) is $\mathcal{O}(N^{3/2})$; Step (4) is $\mathcal{O}(N^{1/2})$.
  - id: b
    text: Step (1) is $\mathcal{O}(N^{3/2})$; Step (3) is $\mathcal{O}(N^2)$; Step (4) is $\mathcal{O}(N)$.
    text_markdown: Step (1) is $\mathcal{O}(N^{3/2})$; Step (3) is $\mathcal{O}(N^2)$; Step (4) is $\mathcal{O}(N)$.
  - id: c
    text: Step (1) is $\mathcal{O}(1)$; Step (3) is $\mathcal{O}(N)$; Step (4) is $\mathcal{O}(N^{3/2})$.
    text_markdown: Step (1) is $\mathcal{O}(1)$; Step (3) is $\mathcal{O}(N)$; Step (4) is $\mathcal{O}(N^{3/2})$.
  - id: d
    text: All three steps scale as $\mathcal{O}(N^{3/2})$.
    text_markdown: All three steps scale as $\mathcal{O}(N^{3/2})$.
  correct: a
  rationale_markdown: (1) computing the 3 base phases $\exp(ik_0 x_i)$ per particle costs $\mathcal{O}(N)$; (3) accumulating
    $\rho_{\mathbf{k}}$ over $N$ particles for $M_k \propto N^{1/2}$ wavevectors costs $N \times N^{1/2} = \mathcal{O}(N^{3/2})$;
    and (4) summing $\rho_{\mathbf{k}}\rho_{-\mathbf{k}}v_{\mathbf{k}}$ over the $M_k$ wavevectors costs $\mathcal{O}(M_k)
    = \mathcal{O}(N^{1/2})$.
