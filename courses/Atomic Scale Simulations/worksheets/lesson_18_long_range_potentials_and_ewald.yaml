- id: q40_lj_total_tail_correction_zero_crossing_numeric
  type: problem
  question_type: numeric
  difficulty: hard
  taught_by: sec_pbc_tail_corrections_and_neighbor_lists
  prompt_markdown: 'For the full 12-6 Lennard-Jones potential $V_{\text{LJ}}(r) = 4\varepsilon[(\sigma/r)^{12} - (\sigma/r)^6]$
    truncated at $r_c = 2.0\,\sigma$ in a 3D fluid of reduced density $\rho\sigma^3 = 0.75$ and $\varepsilon = 1.0$, calculate
    the complete per-particle energy tail correction:


    $$\frac{\Delta E_{\text{tail}}^{\text{LJ}}}{N} = \frac{8\pi\rho\varepsilon\sigma^3}{3}\left[ \frac{1}{3}\left(\frac{\sigma}{r_c}\right)^9
    - \left(\frac{\sigma}{r_c}\right)^3 \right]$$


    (Round to 3 decimal places; notice how small the $r^{-12}$ repulsive tail is compared to the $r^{-6}$ attractive tail
    at $r_c = 2\sigma$!)'
  hint_markdown: Substitute the density and cutoff ratio into the integrated Lennard-Jones tail formula.
  correct:
    value: -0.781
    tolerance: 0.005
  rationale_markdown: With $\frac{8\pi\rho\varepsilon\sigma^3}{3} = \frac{8\pi(0.75)}{3} = 2\pi \approx 6.283185$ and $\sigma/r_c
    = 0.5$, the bracket is $\frac{1}{3}(0.5)^9 - (0.5)^3 = \frac{1}{1536} - \frac{1}{8} = -0.124349$. Multiplying by $2\pi$
    gives $\Delta E_{\text{tail}}^{\text{LJ}}/N = -0.7813\,\varepsilon$.
- id: q41_optimal_kspace_vectors_scaling_numeric
  type: problem
  question_type: numeric
  difficulty: medium
  taught_by: sec_kspace_algorithm_natoli_and_scaling
  prompt_markdown: In an optimally tuned Ewald simulation ($\kappa \propto N^{1/6}/L$), the number of reciprocal-space wavevectors
    $M_k$ inside the cutoff sphere $|\mathbf{k}| < k_c$ scales as $M_k \propto \Omega \kappa^3 \propto N^{1/2}$. If an optimal
    Ewald simulation of $N_1 = 500$ ions uses $M_{k,1} = 120$ wavevectors, how many wavevectors $M_{k,2}$ should be used for
    a system $9$ times larger ($N_2 = 4{,}500$ ions at the same density) to maintain optimal $\mathcal{O}(N^{3/2})$ balance?
  hint_markdown: Scale the initial wavevector count by the square root of the system size expansion ratio.
  correct:
    value: 360.0
    tolerance: 1.0
  rationale_markdown: Because $M_k \propto N^{1/2}$ at optimal $\kappa$, increasing $N$ by a factor of $9$ increases the optimal
    number of $\mathbf{k}$-vectors by $\sqrt{9} = 3$, giving $M_{k,2} = 3 \times 120 = 360$.
