- id: sec_kspace_algorithm_natoli_and_scaling
  type: markdown_section
  title: 4. Fast k-Space Evaluation, Natoli–Ceperley Optimal Breakup, and O(N^(3/2)) vs. PME vs. FMM
  body_markdown: "### Optimizing Breakup: The Natoli–Ceperley (1995) Method\nIn the conventional Gaussian Ewald breakup, truncating\
    \ $v_{\\text{short}}(r)$ at $r = L/2$ leaves a small residual jump $v_{\\text{short}}(L/2) = \\frac{2q_1 q_2}{L}\\text{erfc}(\\\
    kappa L/2) \\ne 0$, and the Gaussian is not the mathematically optimal splitting function for a given $(r_c, k_c)$ budget.\n\
    \n**Natoli and Ceperley (1995)** showed how to achieve machine-precision accuracy with minimal $k$-vectors by expanding\
    \ the short-range (or long-range) potential in a set of local basis functions (e.g., polynomial splines $h_n(r)$ that\
    \ vanish smoothly at $r_c = L/2$):\n\n$$v_{\\text{short}}(r) = \\sum_{n} c_n h_n(r)$$\n\n1. Require $h_n(r)$ to satisfy\
    \ the boundary conditions ($v_{\\text{short}}(r_c) = v'_{\\text{short}}(r_c) = 0$).\n2. Choose a desired reciprocal-space\
    \ cutoff $k_c$.\n3. Write down the mean-square $\\chi^2$ error coming from neglecting higher wavevectors $|\\mathbf{k}|\
    \ > k_c$ and **minimize $\\chi^2$ with respect to the expansion coefficients $c_n$**. The Natoli–Ceperley optimized breakup\
    \ reduces the error $\\ln[\\chi/(e^2/L)]$ by several orders of magnitude compared to classic Gaussian Ewald at the same\
    \ $k_c r_c$!\n\n---\n\n### Look at $k$-Space: Factoring the Double Sum & Avoiding Complex Exponentiation\nNaively, the\
    \ reciprocal-space sum $\\frac{1}{2}\\sum_{\\mathbf{k}} \\sum_{i \\ne j} q_i q_j e^{i\\mathbf{k}\\cdot(\\mathbf{r}_i -\
    \ \\mathbf{r}_j)} v_{\\mathbf{k}}$ looks like an $\\mathcal{O}(M_k N^2)$ calculation for $M_k$ wavevectors. However, we\
    \ can factor the double sum over $(i, j)$ into the product of **single-particle structure factors** $\\rho_{\\mathbf{k}}$:\n\
    \n$$V_{\\text{long}} = \\frac{1}{2}\\sum_{\\mathbf{k}} \\left[\\sum_{i=1}^N q_i e^{i\\mathbf{k}\\cdot\\mathbf{r}_i}\\\
    right]\\left[\\sum_{j=1}^N q_j e^{-i\\mathbf{k}\\cdot\\mathbf{r}_j}\\right] v_{\\mathbf{k}} + C = \\frac{1}{2}\\sum_{\\\
    mathbf{k}} \\rho_{\\mathbf{k}} \\rho_{-\\mathbf{k}} v_{\\mathbf{k}} + C$$\n\n* **Hermitian Symmetry ($\\rho_{-\\mathbf{k}}\
    \ = \\rho_{\\mathbf{k}}^*$):** Because particle positions $\\mathbf{r}_i$ are real, $\\rho_{-\\mathbf{k}} = \\rho_{\\\
    mathbf{k}}^*$, so we only need to compute half of the $\\mathbf{k}$-space sphere!\n* **Linear Scaling in $N$ per $\\mathbf{k}$-vector\
    \ ($\\mathcal{O}(N M_k)$):** Computing $\\rho_{\\mathbf{k}} = \\sum_{i=1}^N q_i e^{i\\mathbf{k}\\cdot\\mathbf{r}_i}$ for\
    \ $M_k$ wavevectors takes **$\\mathcal{O}(N M_k)$** operations instead of $\\mathcal{O}(N^2 M_k)$.\n* **Fast Single-Particle\
    \ MC Updates ($\\mathcal{O}(M_k)$):** If only one or a few particles move (as in Monte Carlo), we do not recompute $\\\
    rho_{\\mathbf{k}}$ from scratch! We simply update $\\Delta \\rho_{\\mathbf{k}} = q_i (e^{i\\mathbf{k}\\cdot\\mathbf{r}_i^{\\\
    text{new}}} - e^{i\\mathbf{k}\\cdot\\mathbf{r}_i^{\\text{old}}})$ in $\\mathcal{O}(M_k)$ time.\n* **Recursive Complex\
    \ Multiplication Trick:** Calling `exp(i k·r)` or `sin`/`cos` from scratch for every $(i, \\mathbf{k})$ pair is slow.\
    \ Instead, for $\\mathbf{k} = \\left(m_1 \\frac{2\\pi}{L_x}, m_2 \\frac{2\\pi}{L_y}, m_3 \\frac{2\\pi}{L_z}\\right)$,\
    \ we factor:\n $$e^{i\\mathbf{k}\\cdot\\mathbf{r}_i} = \\left[e^{i\\frac{2\\pi}{L_x}r_{ix}}\\right]^{m_1} \\left[e^{i\\\
    frac{2\\pi}{L_y}r_{iy}}\\right]^{m_2} \\left[e^{i\\frac{2\\pi}{L_z}r_{iz}}\\right]^{m_3}$$\n For each particle $i$, we\
    \ compute the fundamental base phase $C_j = \\exp(i k_{0j} r_{ij}) = (\\cos(k_{0j}r_{ij}), \\sin(k_{0j}r_{ij}))$ only\
    \ **3 times** ($\\mathcal{O}(N)$ total), generate integer powers $C_{j,m} = (C_j)^m$ iteratively by fast **complex multiplication**\
    \ $e^{i m k_0 x} = e^{i(m-1)k_0 x}\\cdot e^{i k_0 x}$, and multiply the three Cartesian factors together!\n\n---\n\n###\
    \ Derivation of Optimal Ewald $\\mathcal{O}(N^{3/2})$ Scaling vs. PME $\\mathcal{O}(N\\ln N)$ vs. FMM $\\mathcal{O}(N)$\n\
    At fixed liquid density $\\rho = N / \\Omega$ ($\\Omega = L^3 \\propto N$) and fixed target accuracy $\\epsilon = e^{-p}$:\n\
    * **Real-space work:** Cutoff $r_c \\sim \\sqrt{p}/\\kappa$. Using a neighbor list, each of the $N$ particles interacts\
    \ with $\\frac{4}{3}\\pi\\rho r_c^3$ neighbors:\n $$W_{\\text{real}} \\propto N \\rho r_c^3 \\propto \\frac{N^2}{\\Omega\
    \ \\kappa^3}$$\n* **Reciprocal-space work:** Cutoff $k_c \\sim 2\\kappa\\sqrt{p}$. The number of discrete $\\mathbf{k}$-vectors\
    \ inside radius $k_c$ is $M_k \\propto \\Omega k_c^3 \\propto \\Omega \\kappa^3$. Summing $\\rho_{\\mathbf{k}}$ over $N$\
    \ particles for each of the $M_k$ wavevectors costs:\n $$W_{\\text{recip}} \\propto N M_k \\propto N \\Omega \\kappa^3$$\n\
    \n#### Balancing Real and Reciprocal Work\n* **Unoptimized $\\kappa$ (fixing $r_c = L/2$, $\\kappa \\propto 1/L \\propto\
    \ N^{-1/3}$):** Then $W_{\\text{real}} \\propto \\mathcal{O}(N^2)$ and $W_{\\text{recip}} \\propto \\mathcal{O}(N)$, so\
    \ unoptimized Ewald scales as **$\\mathcal{O}(N^2)$**!\n* **Optimized $\\kappa$:** Setting $W_{\\text{real}} \\sim W_{\\\
    text{recip}}$ requires:\n $$\\frac{N^2}{\\Omega \\kappa^3} \\sim N \\Omega \\kappa^3 \\implies \\kappa_{\\text{opt}} \\\
    propto \\frac{N^{1/6}}{\\Omega^{1/3}} = \\frac{N^{1/6}}{L} \\propto \\rho^{1/3} N^{-1/6}$$\n Substituting $\\Omega \\\
    kappa_{\\text{opt}}^3 \\propto N^{1/2}$ into both work expressions gives the celebrated **Optimal Ewald complexity**:\n\
    \ $$W_{\\text{real}} \\sim W_{\\text{recip}} \\sim N \\cdot N^{1/2} = \\mathcal{O}(N^{3/2}), \\qquad M_k \\propto \\mathcal{O}(N^{1/2})$$\n\
    \ *( step breakdown at optimal $\\kappa$: 1. Base $\\exp(ik_0 x_i)$ is $\\mathcal{O}(N)$; 2. Powers & products $\\mathcal{O}(N^{3/2})$;\
    \ 3. Sum over particles for $\\rho_{\\mathbf{k}}$ is $\\mathcal{O}(N^{3/2})$; 4. Sum over $\\mathbf{k}$ for potential\
    \ is $\\mathcal{O}(M_k) = \\mathcal{O}(N^{1/2})$; 5. Forces via gradients $\\mathcal{O}(N^{3/2})$; 6. Self/constant terms\
    \ $\\mathcal{O}(1)$. Code verification check: a unit-charge simple cubic lattice in a neutralizing background has Wigner\
    \ energy $V = -1.4186487 / a$.)*\n\n#### Faster Asymptotic Methods for Large $N$\n1. **Particle-Mesh / Particle-Cell Methods\
    \ (Hockney PPPM, Darden PME — $\\mathcal{O}(N \\ln N)$):**\n Instead of evaluating $\\rho_{\\mathbf{k}}$ by direct $\\\
    mathcal{O}(N M_k)$ summation, charges are interpolated onto a 3D regular grid and Poisson's equation is solved in $k$-space\
    \ using the **3D Fast Fourier Transform (FFT)**, reducing reciprocal-space cost to **$\\mathcal{O}(N \\ln N)$**.\n2. **Fast\
    \ Multipole Method (Greengard & Rokhlin FMM — $\\mathcal{O}(N)$):**\n Divides space recursively into an octree of cells,\
    \ computes multipole (monopole, dipole, quadrupole, $\\dots$) moments of each cell, and translates moments hierarchically\
    \ between parent supercells and child cells, achieving true linear **$\\mathcal{O}(N)$** complexity for very large $N$.\n\
    \n---\n\n### Artifacts of Periodic Image Potentials in Inhomogeneous / Slab Systems: Ewald summation assumes the simulation\
    \ cell is replicated periodically in all 3 directions to infinity. For an **inhomogeneous system** such as a **2D charged\
    \ surface, membrane, or liquid–vapor interface (charge layer)**, 3D periodic images impose an artificial long-range crystal\
    \ lattice of parallel dipole layers! Whereas a real nearby fluid would be **anticorrelated** (screening the local dipole),\
    \ periodic images are **perfectly correlated** replicas, artificially **penalizing** localized dipole fluctuations unless\
    \ a 2D slab dipole correction or vacuum gap is applied."
- id: concept_electrostatic_scaling
  type: concept_cell
  title: 'Interactive Explorer: Electrostatic Solver Complexity — O(N²) vs. O(N^(3/2)) vs. O(N ln N) vs. O(N)'
  description_markdown: Compare the per-step CPU time on log–log axes across five orders of magnitude in particle count $N$
    ($10^2$ to $10^7$) for Direct/Unoptimized Ewald $\mathcal{O}(N^2)$, Optimized Ewald $\mathcal{O}(N^{3/2})$, Particle-Mesh
    Ewald (PME/PPPM) $\mathcal{O}(N\ln N)$, and the Fast Multipole Method (FMM) $\mathcal{O}(N)$.
  render_function: render_electrostatic_algorithm_scaling
  layout: figure_left
  controls:
    log10_n:
      kind: slider
      label: Log₁₀(Particle Count N)
      min: 2.0
      max: 7.0
      step: 0.5
      default: 4.0
      format: .1f
