- id: q32_image_potential_slab_artifact
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by: sec_kspace_algorithm_natoli_and_scaling
  prompt_markdown: what physical artifact arises when standard 3D periodic Ewald summation is applied to an inhomogeneous
    **charge layer or dipolar surface**?
  hint_markdown: Compare how a real surrounding fluid responds to a local dipole/charge layer versus what periodic replicas
    do.
  options:
  - id: a
    text: 3D periodic images force the charge/dipole structure to repeat identically at large r (correlated replicas), whereas
      a real nearby fluid would be anticorrelated (screening); thus such structures are artificially penalized.
    text_markdown: 3D periodic images force the charge/dipole structure to repeat identically at large r (correlated replicas),
      whereas a real nearby fluid would be anticorrelated (screening); thus such structures are artificially penalized.
  - id: b
    text: The Ewald sum sets all forces perpendicular to the layer to zero.
    text_markdown: The Ewald sum sets all forces perpendicular to the layer to zero.
  - id: c
    text: The self-interaction term $V_{\text{self}}$ becomes infinite whenever a surface is present.
    text_markdown: The self-interaction term $V_{\text{self}}$ becomes infinite whenever a surface is present.
  - id: d
    text: Periodic boundary conditions cause all ions to evaporate into vacuum immediately.
    text_markdown: Periodic boundary conditions cause all ions to evaporate into vacuum immediately.
  correct: a
  rationale_markdown: Standard Ewald summation replicates the central cell's dipole/charge layer with identical orientation
    across all periodic images. In reality, a nearby fluid would polarize in the opposite direction (anticorrelated screening),
    so artificial periodic image alignment penalizes polarized surface structures.
- id: q33_verlet_neighbor_count_numeric
  type: problem
  question_type: numeric
  difficulty: medium
  taught_by:
  - sec_pbc_tail_corrections_and_neighbor_lists
  - concept_neighbor_skin
  prompt_markdown: A 3D liquid has number density $\rho = 0.75\,\sigma^{-3}$. If a Verlet neighbor list is constructed with
    potential cutoff $r_c = 2.5\,\sigma$ and skin depth $\Delta = 0.5\,\sigma$ (so $r_{\text{list}} = r_c + \Delta = 3.0\,\sigma$),
    what is the average number of neighbors $m$ stored per particle (assuming $g(r) \approx 1$, round to 1 decimal place)?
  hint_markdown: Calculate the expected number of particles inside a sphere of radius $r_c + \Delta$ at the given number density.
  correct:
    value: 84.8
    tolerance: 0.3
  rationale_markdown: With $r_{\text{list}} = 2.5 + 0.5 = 3.0\,\sigma$, the average number of particles inside the sphere
    is $m = \frac{4}{3}\pi \rho r_{\text{list}}^3 = \frac{4}{3}\pi (0.75)(27) = 27\pi \approx 84.82$ neighbors per particle,
    regardless of whether $N = 10^3$ or $N = 10^7$!
