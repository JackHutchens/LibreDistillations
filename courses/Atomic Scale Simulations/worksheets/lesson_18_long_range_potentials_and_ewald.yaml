- id: q13_conditional_convergence_meaning
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by: sec_long_range_definition_and_stillinger_lovett
  prompt_markdown: What does it mean mathematically and physically that the electrostatic lattice sum $\sum_{j\ne i} q_i q_j
    / r_{ij}$ in a neutral crystal is **conditionally convergent**?
  hint_markdown: Recall the definition of conditional convergence for an infinite series whose absolute values diverge ($\sum
    1/r = \infty$).
  options:
  - id: a
    text: The sum of absolute values diverges ($\sum |q_i q_j|/r_{ij} = \infty$), so the series only converges if positive
      and negative terms are grouped to nearly cancel, and its limiting value depends on the summation order / macroscopic
      surface shape and boundary conditions.
    text_markdown: The sum of absolute values diverges ($\sum |q_i q_j|/r_{ij} = \infty$), so the series only converges if
      positive and negative terms are grouped to nearly cancel, and its limiting value depends on the summation order / macroscopic
      surface shape and boundary conditions.
  - id: b
    text: The sum converges only when the temperature $T$ is below the Debye temperature.
    text_markdown: The sum converges only when the temperature $T$ is below the Debye temperature.
  - id: c
    text: Every rearrangement of the terms in the series converges to the exact same number.
    text_markdown: Every rearrangement of the terms in the series converges to the exact same number.
  - id: d
    text: The sum is finite only when all charges have the same sign ($+q$).
    text_markdown: The sum is finite only when all charges have the same sign ($+q$).
  correct: a
  rationale_markdown: Because $\sum |q_i q_j|/r_{ij}$ diverges, Riemann's rearrangement theorem implies that the alternating
    sum depends on the order of summation (e.g., spherical shells vs. Neutral fractional Evjen cubes), which physically corresponds
    to different macroscopic surface dipole layers on the crystal boundary.
- id: sec_ewald_summation_method
  type: markdown_section
  title: '3. The Classic Ewald Summation Method (1921): Real, Reciprocal, Self, and Dipole Terms'
  body_markdown: "### Origin of the Convergence Problem in $r$-Space vs. $k$-Space\nFor a periodic function $f(\\mathbf{r}\
    \ + \\mathbf{L}_n) = f(\\mathbf{r})$ in a box of volume $\\Omega = L_x L_y L_z$, the discrete Fourier expansion uses reciprocal\
    \ lattice vectors $\\mathbf{k} = 2\\pi\\left(\\frac{m_x}{L_x}\\hat{\\mathbf{x}} + \\frac{m_y}{L_y}\\hat{\\mathbf{y}} +\
    \ \\frac{m_z}{L_z}\\hat{\\mathbf{z}}\\right)$ with $m_x, m_y, m_z \\in \\mathbb{Z}$:\n\n$$v(\\mathbf{r}) = \\frac{e^2}{r}\
    \ \\Longleftrightarrow v_{\\mathbf{k}} = \\frac{1}{\\Omega}\\int d^3r\\, e^{-i\\mathbf{k}\\cdot\\mathbf{r}} \\frac{e^2}{r}\
    \ = \\frac{4\\pi e^2}{\\Omega k^2}$$\n\nWhy can't we just do the entire sum in real space *or* the entire sum in $k$-space?\n\
    * **$r$-space convergence issue comes from $r \\to \\infty$ ($k \\to 0$):** $1/r$ has a long tail at large $r$.\n* **$k$-space\
    \ convergence issue comes from $k \\to \\infty$ ($r \\to 0$):** Because $1/r$ has a sharp $r \\to 0$ singularity in real\
    \ space, its Fourier transform $4\\pi e^2 / k^2$ decays slowly at large $k$!\n\n---\n\n### Ewald's Physical Trick: Screening\
    \ with Neutralizing Gaussian Clouds\nBecause **Poisson's equation is linear**, we can split the Coulomb potential into\
    \ a rapidly decaying **short-range real-space part** and a smooth **long-range reciprocal-space part** by surrounding\
    \ every point charge $q_i$ with a diffuse, neutralizing **Gaussian charge distribution** of width $1/\\kappa$:\n\n$$\\\
    rho_i^{\\text{Gauss}}(\\mathbf{r}) = -q_i \\left(\\frac{\\kappa^2}{\\pi}\\right)^{3/2} e^{-\\kappa^2 |\\mathbf{r} - \\\
    mathbf{r}_i|^2}$$\n\nand then **adding back** the exact same compensating Gaussian charge distribution $+\\rho_i^{\\text{Gauss}}(\\\
    mathbf{r})$ to be summed in $k$-space! Using the error function $\\text{erf}(z) = \\frac{2}{\\sqrt{\\pi}}\\int_0^z e^{-t^2}\\\
    ,dt$ and its complement $\\text{erfc}(z) = 1 - \\text{erf}(z)$, the identity $\\frac{1}{r} = \\frac{\\text{erfc}(\\kappa\
    \ r)}{r} + \\frac{\\text{erf}(\\kappa r)}{r}$ splits the pair interaction into:\n\n1. **Short-Range Real-Space Potential\
    \ ($v_{\\text{short}}$):**\n $$v_{\\text{short}}(r) = \\frac{q_1 q_2}{r}\\text{erfc}(\\kappa r) \\qquad (\\text{decays\
    \ exponentially fast as } e^{-\\kappa^2 r^2}\\text{ at large } r)$$\n We choose the **Ewald parameter $\\kappa$** large\
    \ enough that $v_{\\text{short}}(L/2) = \\frac{2q_1 q_2}{L}\\text{erfc}(\\kappa L/2) \\approx 0$ at the minimum-image\
    \ boundary $r = L/2$, so we need **only the minimum image** in real space!\n2. **Long-Range Reciprocal-Space Potential\
    \ ($v_{\\text{long}}$):**\n $$v_{\\text{long}}(r) = \\frac{q_1 q_2}{r}\\text{erf}(\\kappa r) \\Longleftrightarrow v_{\\\
    text{long},\\mathbf{k}} = \\frac{4\\pi q_1 q_2}{\\Omega k^2} e^{-k^2 / (4\\kappa^2)} \\qquad (\\text{decays exponentially\
    \ fast at large } k)$$\n Because $\\text{erf}(\\kappa r)/r \\to \\frac{2\\kappa}{\\sqrt{\\pi}}$ is completely smooth and\
    \ non-singular as $r \\to 0$, its Fourier transform acquires the Gaussian damping factor $e^{-k^2/(4\\kappa^2)}$, allowing\
    \ truncation at a modest wavevector cutoff $|\\mathbf{k}| < k_c$!\n\n---\n\n### The Four Complete Ewald Energy Terms\n\
    Combining all pairs and periodic images in a charge-neutral cell ($\\sum_i q_i = 0$ removes the $\\mathbf{k} = \\mathbf{0}$\
    \ divergence) yields the complete Ewald electrostatic energy:\n\n$$V_{\\text{Ewald}} = V_{\\text{real}} + V_{\\text{recip}}\
    \ + V_{\\text{self}} + V_{\\text{dipole}}$$\n\n* **1. Real-Space Term:**\n $$V_{\\text{real}} = \\frac{1}{2} \\sum_{i\
    \ \\ne j}^N \\frac{q_i q_j}{r_{ij}} \\text{erfc}(\\kappa r_{ij}), \\qquad r_{ij} = \\min_{\\mathbf{L}} |\\mathbf{r}_i\
    \ - \\mathbf{r}_j - \\mathbf{L}| < r_c$$\n* **2. Reciprocal-Space Term:**\n $$V_{\\text{recip}} = \\frac{1}{2\\Omega}\
    \ \\sum_{\\mathbf{k} \\ne \\mathbf{0}, |\\mathbf{k}| < k_c} \\frac{4\\pi}{k^2} e^{-k^2/(4\\kappa^2)} \\left| \\sum_{j=1}^N\
    \ q_j e^{i\\mathbf{k}\\cdot\\mathbf{r}_j} \\right|^2$$\n* **3. Self-Interaction Subtraction Term ($C = V_{\\text{self}}$):**\n\
    \ When we write the unrestricted double sum $\\frac{1}{2}\\sum_{i,j} q_i q_j e^{i\\mathbf{k}\\cdot(\\mathbf{r}_i - \\\
    mathbf{r}_j)} v_{\\text{long},\\mathbf{k}} = \\frac{1}{2}\\sum_{\\mathbf{k}} |\\rho_{\\mathbf{k}}|^2 v_{\\mathbf{k}}$\
    \ in $k$-space, we inadvertently include the $i = j$ self-interaction of each point charge with its own compensating Gaussian\
    \ cloud at $r = 0$. Since $\\lim_{r\\to 0} \\frac{\\text{erf}(\\kappa r)}{r} = \\frac{2\\kappa}{\\sqrt{\\pi}}$, we must\
    \ subtract this constant self-energy:\n $$V_{\\text{self}} = -\\frac{1}{2}\\sum_{i=1}^N q_i^2 \\lim_{r\\to 0} \\frac{\\\
    text{erf}(\\kappa r)}{r} = -\\frac{\\kappa}{\\sqrt{\\pi}} \\sum_{i=1}^N q_i^2$$\n* **4. Macroscopic Surface Dipole Term\
    \ ($V_{\\text{dipole}}$ for Insulators):**\n For a macroscopic sphere of periodic replicas embedded in an external medium\
    \ of dielectric constant $\\varepsilon_{\\text{ext}}$, surface polarization adds a depolarization energy proportional\
    \ to the square of the total simulation cell dipole moment $\\mathbf{M} = \\sum_i \\boldsymbol{\\mu}_i = \\sum_{i=1}^N\
    \ q_i \\mathbf{r}_i$:\n $$V_{\\text{dipole}} = \\frac{2\\pi}{(2\\varepsilon_{\\text{ext}} + 1)\\Omega} \\left| \\sum_{i=1}^N\
    \ q_i \\mathbf{r}_i \\right|^2$$\n * **Tin-foil (conducting metal) boundary conditions ($\\varepsilon_{\\text{ext}} \\\
    to \\infty$):** Surface charges on the surrounding conductor screen out the macroscopic dipole field completely, so **$V_{\\\
    text{dipole}} = 0$**.\n * **Vacuum boundary conditions ($\\varepsilon_{\\text{ext}} = 1$):** $V_{\\text{dipole}} = \\\
    frac{2\\pi}{3\\Omega}\\left|\\sum_i q_i \\mathbf{r}_i\\right|^2$."
- id: concept_ewald_splitting
  type: concept_cell
  title: 'Interactive Explorer: Ewald Screening Parameter κ — Real Space, k-Space, and CPU Tradeoff'
  description_markdown: Vary the Ewald screening parameter $\kappa$ and switch between the real-space potential split ($v_{\text{short}}$
    vs. $v_{\text{long}}$), the $k$-space Gaussian envelope $v_{\text{long},k}$, and the total CPU operation count.
  render_function: render_ewald_splitting_tradeoff
  layout: figure_left
  controls:
    kappa:
      kind: slider
      label: Ewald Screening Parameter κ
      min: 0.4
      max: 2.6
      step: 0.2
      default: 1.2
      format: .1f
    view_mode:
      kind: dropdown
      label: Visualization Panel
      default: real_potentials
      options:
      - label: 'Real-Space Split: erfc(κr)/r vs. erf(κr)/r'
        value: real_potentials
      - label: 'Reciprocal-Space Envelope: (4π/k²) exp(-k²/4κ²)'
        value: k_space
      - label: 'CPU Cost Balance: Real O(κ⁻³) vs. Reciprocal O(κ³)'
        value: cpu_balance
  takeaway_markdown: '**Key Takeaway:** Increasing $\kappa$ makes the Gaussian screening cloud narrower in real space (so
    $\text{erfc}(\kappa r)/r$ decays faster and needs a smaller real-space cutoff $r_c$), but wider in $k$-space (so $e^{-k^2/(4\kappa^2)}$
    decays slower and requires more $\mathbf{k}$-vectors).'
- id: q14_convergence_origin_r_vs_k
  type: problem
  question_type: single_select
  difficulty: easy
  taught_by: sec_ewald_summation_method
  prompt_markdown: For the bare Coulomb potential $v(r) = e^2/r$ with Fourier transform $v_k = 4\pi e^2/(\Omega k^2)$, where
    do the slow convergence problems originate in real space ($r$-space) versus reciprocal space ($k$-space)?
  hint_markdown: Recall 'Origin of Convergence Problem'.
  options:
  - id: a
    text: The real-space convergence issue comes from $r \to \infty$ ($k \to 0$), whereas the reciprocal-space convergence
      issue comes from $k \to \infty$ (the sharp $1/r$ singularity at $r \to 0$).
    text_markdown: The real-space convergence issue comes from $r \to \infty$ ($k \to 0$), whereas the reciprocal-space convergence
      issue comes from $k \to \infty$ (the sharp $1/r$ singularity at $r \to 0$).
  - id: b
    text: Both the real-space and reciprocal-space convergence issues come solely from $r \to \infty$.
    text_markdown: Both the real-space and reciprocal-space convergence issues come solely from $r \to \infty$.
  - id: c
    text: The real-space convergence issue comes from $r \to 0$, whereas the reciprocal-space convergence issue comes from
      $k \to 0$.
    text_markdown: The real-space convergence issue comes from $r \to 0$, whereas the reciprocal-space convergence issue comes
      from $k \to 0$.
  - id: d
    text: Neither r-space nor k-space has any convergence issue in 3D.
    text_markdown: Neither r-space nor k-space has any convergence issue in 3D.
  correct: a
  rationale_markdown: In real space, $1/r$ decays too slowly as $r \to \infty$ (corresponding to $k \to 0$). In $k$-space,
    the sharp $1/r$ cusp at $r \to 0$ produces a slowly decaying $4\pi e^2/k^2$ tail as $k \to \infty$.
- id: q15_ewald_gaussian_screening_idea
  type: problem
  question_type: single_select
  difficulty: easy
  taught_by:
  - sec_ewald_summation_method
  - concept_ewald_splitting
  prompt_markdown: What is the physical 'trick' behind the classic Ewald summation breakup of the Coulomb potential?
  hint_markdown: 'Recall ''Classic Ewald'': why are we free to add and subtract Gaussian charge clouds?'
  options:
  - id: a
    text: Because Poisson's equation is linear, we add a neutralizing Gaussian charge cloud around each point charge to screen
      out the long-range part in real space, and subtract the same Gaussian cloud in smooth k-space.
    text_markdown: Because Poisson's equation is linear, we add a neutralizing Gaussian charge cloud around each point charge
      to screen out the long-range part in real space, and subtract the same Gaussian cloud in smooth k-space.
  - id: b
    text: We replace all point charges with neutral hard spheres of diameter $L/2$.
    text_markdown: We replace all point charges with neutral hard spheres of diameter $L/2$.
  - id: c
    text: We set the permittivity of free space to infinity inside a radius $r_c$ and zero outside $r_c$.
    text_markdown: We set the permittivity of free space to infinity inside a radius $r_c$ and zero outside $r_c$.
  - id: d
    text: We multiply all ionic charges by $\exp(-t/\tau)$ so that the system becomes uncharged at long times.
    text_markdown: We multiply all ionic charges by $\exp(-t/\tau)$ so that the system becomes uncharged at long times.
  correct: a
  rationale_markdown: By linearity of Poisson's equation, adding a screening Gaussian cloud $-q_i(\kappa^2/\pi)^{3/2}e^{-\kappa^2
    r^2}$ around each point charge makes the real-space potential $\text{erfc}(\kappa r)/r$ short-ranged, while the compensating
    Gaussian cloud $+q_i(\kappa^2/\pi)^{3/2}e^{-\kappa^2 r^2}$ is smooth and converges rapidly in $k$-space.
