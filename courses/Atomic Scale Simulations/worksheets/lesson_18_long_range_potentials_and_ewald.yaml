    text: Verify that the total electrostatic energy is proportional to $\kappa^3$ when $\kappa$ is varied.
    text_markdown: Verify that the total electrostatic energy is proportional to $\kappa^3$ when $\kappa$ is varied.
  - id: c
    text: Check that setting all charges $q_i = +1$ gives $V = +\infty$.
