  rationale_markdown: Screening a point charge with a Gaussian of width $1/\kappa$ produces $v_{\text{short}}(r) = \frac{q_1
    q_2}{r}\text{erfc}(\kappa r)$ in real space, while the compensating Gaussian interaction $v_{\text{long}}(r) = \frac{q_1
