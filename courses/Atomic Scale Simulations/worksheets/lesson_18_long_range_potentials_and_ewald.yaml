    systems ($N \lesssim 10^3$), PME/PPPM ($\mathcal{O}(N\ln N)$) dominates intermediate biomolecular and materials simulations
    ($10^3 \lesssim N \lesssim 10^5$), and FMM ($\mathcal{O}(N)$) wins at ultra-large scales ($N \gtrsim 10^5$–$10^6$) depending
    on multipole order $p$.'
- id: q23_kspace_factorization_trick
  type: problem
  question_type: single_select
  difficulty: easy
  taught_by: sec_kspace_algorithm_natoli_and_scaling
  prompt_markdown: How does the Ewald algorithm avoid an $\mathcal{O}(N^2)$ double loop over particle pairs $(i, j)$ when
    evaluating the reciprocal-space energy $V_{\text{long}}$ for a given wavevector $\mathbf{k}$?
  hint_markdown: 'Recall ''Look at k-space: the algorithm''.'
  options:
  - id: a
    text: It factors $\exp(i\mathbf{k}\cdot(\mathbf{r}_i - \mathbf{r}_j))$ into the single-particle sum $\rho_{\mathbf{k}}
      = \sum_i q_i \exp(i\mathbf{k}\cdot\mathbf{r}_i)$ and its complex conjugate $\rho_{-\mathbf{k}} = \rho_{\mathbf{k}}^*$,
      reducing the cost per $k$-vector from $\mathcal{O}(N^2)$ to $\mathcal{O}(N)$.
    text_markdown: It factors $\exp(i\mathbf{k}\cdot(\mathbf{r}_i - \mathbf{r}_j))$ into the single-particle sum $\rho_{\mathbf{k}}
      = \sum_i q_i \exp(i\mathbf{k}\cdot\mathbf{r}_i)$ and its complex conjugate $\rho_{-\mathbf{k}} = \rho_{\mathbf{k}}^*$,
      reducing the cost per $k$-vector from $\mathcal{O}(N^2)$ to $\mathcal{O}(N)$.
  - id: b
    text: It truncates the sum over i and j after the first 10 particles in the array.
    text_markdown: It truncates the sum over i and j after the first 10 particles in the array.
  - id: c
    text: It sets $\exp(i\mathbf{k}\cdot(\mathbf{r}_i - \mathbf{r}_j)) = 1$ for all pairs in $k$-space.
    text_markdown: It sets $\exp(i\mathbf{k}\cdot(\mathbf{r}_i - \mathbf{r}_j)) = 1$ for all pairs in $k$-space.
  - id: d
    text: It uses a Verlet skin list in k-space so each particle only interacts with 12 k-vectors.
    text_markdown: It uses a Verlet skin list in k-space so each particle only interacts with 12 k-vectors.
  correct: a
  rationale_markdown: Because $e^{i\mathbf{k}\cdot(\mathbf{r}_i - \mathbf{r}_j)} = e^{i\mathbf{k}\cdot\mathbf{r}_i} e^{-i\mathbf{k}\cdot\mathbf{r}_j}$,
    the double sum factors into $\left(\sum_i q_i e^{i\mathbf{k}\cdot\mathbf{r}_i}\right)\left(\sum_j q_j e^{-i\mathbf{k}\cdot\mathbf{r}_j}\right)
    = \rho_{\mathbf{k}}\rho_{-\mathbf{k}} = |\rho_{\mathbf{k}}|^2$, which takes only a single $\mathcal{O}(N)$ pass per $\mathbf{k}$-vector.
- id: q24_rho_k_hermitian_symmetry
  type: problem
  question_type: single_select
  difficulty: easy
  taught_by: sec_kspace_algorithm_natoli_and_scaling
  prompt_markdown: Because particle coordinates $\mathbf{r}_i$ and charges $q_i$ are real numbers, how is the structure factor
    at $-\mathbf{k}$ related to $\rho_{\mathbf{k}} = \sum_{j=1}^N q_j e^{i\mathbf{k}\cdot\mathbf{r}_j}$, and what computational
    savings does this provide?
  hint_markdown: Take the complex conjugate of $\rho_{\mathbf{k}}$.
  options:
  - id: a
    text: $\rho_{-\mathbf{k}} = \rho_{\mathbf{k}}^*$ (complex conjugate), so we only need to compute $\rho_{\mathbf{k}}$ over
      half of the reciprocal-space $k$-vectors.
    text_markdown: $\rho_{-\mathbf{k}} = \rho_{\mathbf{k}}^*$ (complex conjugate), so we only need to compute $\rho_{\mathbf{k}}$
      over half of the reciprocal-space $k$-vectors.
  - id: b
    text: $\rho_{-\mathbf{k}} = -\rho_{\mathbf{k}}$, so $\rho_{\mathbf{k}} \rho_{-\mathbf{k}}$ cancels to zero for every $\mathbf{k}$.
    text_markdown: $\rho_{-\mathbf{k}} = -\rho_{\mathbf{k}}$, so $\rho_{\mathbf{k}} \rho_{-\mathbf{k}}$ cancels to zero for
      every $\mathbf{k}$.
  - id: c
    text: $\rho_{-\mathbf{k}} = 1 / \rho_{\mathbf{k}}$, so $\rho_{\mathbf{k}} \rho_{-\mathbf{k}} = 1$ identically.
    text_markdown: $\rho_{-\mathbf{k}} = 1 / \rho_{\mathbf{k}}$, so $\rho_{\mathbf{k}} \rho_{-\mathbf{k}} = 1$ identically.
  - id: d
    text: $\rho_{-\mathbf{k}}$ is independent of $\rho_{\mathbf{k}}$ and requires doubling the $k$-space cutoff.
    text_markdown: $\rho_{-\mathbf{k}}$ is independent of $\rho_{\mathbf{k}}$ and requires doubling the $k$-space cutoff.
  correct: a
  rationale_markdown: Taking the complex conjugate gives $\rho_{\mathbf{k}}^* = \sum_j q_j e^{-i\mathbf{k}\cdot\mathbf{r}_j}
    = \rho_{-\mathbf{k}}$, cutting the number of required $\rho_{\mathbf{k}}$ evaluations in half.
- id: q25_fast_complex_multiply_algorithm
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by: sec_kspace_algorithm_natoli_and_scaling
  prompt_markdown: When computing $e^{i\mathbf{k}\cdot\mathbf{r}_i}$ across hundreds of reciprocal lattice vectors $\mathbf{k}
    = \left(m_1 \frac{2\pi}{L_x}, m_2 \frac{2\pi}{L_y}, m_3 \frac{2\pi}{L_z}\right)$, how do efficient Ewald codes avoid calling
    slow trigonometric or complex exponential library functions inside the inner loop over $\mathbf{k}$?
  hint_markdown: Check on factoring $e^{i\mathbf{k}\cdot\mathbf{r}}$ into powers of fundamental phases $[e^{i(2\pi/L_x)r_x}]^{m_1}$.
  options:
  - id: a
    text: They compute the base phases $\exp(i k_0 x_i) = (\cos(k_0 x_i), \sin(k_0 x_i))$ once per particle in $\mathcal{O}(N)$
      time and generate all higher harmonics $m_1, m_2, m_3$ and 3D products purely by fast complex multiplications.
    text_markdown: They compute the base phases $\exp(i k_0 x_i) = (\cos(k_0 x_i), \sin(k_0 x_i))$ once per particle in $\mathcal{O}(N)$
      time and generate all higher harmonics $m_1, m_2, m_3$ and 3D products purely by fast complex multiplications.
  - id: b
    text: They replace $\exp(i\mathbf{k}\cdot\mathbf{r})$ with its first-order Taylor expansion $1 + i\mathbf{k}\cdot\mathbf{r}$
      for all $\mathbf{k}$.
    text_markdown: They replace $\exp(i\mathbf{k}\cdot\mathbf{r})$ with its first-order Taylor expansion $1 + i\mathbf{k}\cdot\mathbf{r}$
      for all $\mathbf{k}$.
  - id: c
    text: They round all particle coordinates $\mathbf{r}_i$ to integers so $\exp(i\mathbf{k}\cdot\mathbf{r})$ is always $\pm
