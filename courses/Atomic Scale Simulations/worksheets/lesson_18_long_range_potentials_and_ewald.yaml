- id: q38_ewald_independence_of_kappa
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by:
  - sec_ewald_summation_method
  - concept_ewald_splitting
  prompt_markdown: When both the real-space sum ($r < r_c$) and reciprocal-space sum ($|\mathbf{k}| < k_c$) are converged
    to high accuracy, how should the **total** Ewald potential energy $V_{\text{Ewald}} = V_{\text{real}}(\kappa) + V_{\text{recip}}(\kappa)
    + V_{\text{self}}(\kappa) + V_{\text{dipole}}$ depend on the screening parameter $\kappa$?
  hint_markdown: Remember that $\kappa$ only controls how we split $\frac{1}{r} = \frac{\text{erfc}(\kappa r)}{r} + \frac{\text{erf}(\kappa
    r)}{r}$.
  options:
  - id: a
    text: $V_{\text{Ewald}}$ is completely independent of $\kappa$ ($\partial V_{\text{Ewald}} / \partial\kappa = 0$), even
      though $V_{\text{real}}$, $V_{\text{recip}}$, and $V_{\text{self}}$ each vary strongly with $\kappa$.
    text_markdown: $V_{\text{Ewald}}$ is completely independent of $\kappa$ ($\partial V_{\text{Ewald}} / \partial\kappa =
      0$), even though $V_{\text{real}}$, $V_{\text{recip}}$, and $V_{\text{self}}$ each vary strongly with $\kappa$.
  - id: b
    text: $V_{\text{Ewald}}$ increases linearly with $\kappa$ because $V_{\text{self}} \propto -\kappa$.
    text_markdown: $V_{\text{Ewald}}$ increases linearly with $\kappa$ because $V_{\text{self}} \propto -\kappa$.
  - id: c
    text: $V_{\text{Ewald}}$ is proportional to $1/\kappa^2$.
    text_markdown: $V_{\text{Ewald}}$ is proportional to $1/\kappa^2$.
  - id: d
    text: $V_{\text{Ewald}}$ oscillates sinusoidally with $\kappa$.
    text_markdown: $V_{\text{Ewald}}$ oscillates sinusoidally with $\kappa$.
  correct: a
  rationale_markdown: Because $\text{erfc}(\kappa r) + \text{erf}(\kappa r) = 1$ is an exact identity for any $\kappa > 0$,
    the exact total Ewald energy is invariant with respect to $\kappa$; $\kappa$ only shifts work between real space and reciprocal
    space.
- id: q39_fast_multipole_hierarchical_steps
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by: sec_kspace_algorithm_natoli_and_scaling
  prompt_markdown: Which sequence of steps describes how the **Fast Multipole Method (FMM)** achieves $\mathcal{O}(N)$ complexity
    for long-range Coulomb interactions?
  hint_markdown: Check the bullet points under 'Fast Multipole Methods are O(N) for large N'.
  options:
  - id: a
    text: Divide space into cells recursively, compute the multipole (dipole, quadrupole,...) moments of each small cell,
      and apply translation rules relating supercell moments to smaller cell moments.
    text_markdown: Divide space into cells recursively, compute the multipole (dipole, quadrupole,...) moments of each small
      cell, and apply translation rules relating supercell moments to smaller cell moments.
  - id: b
    text: Truncate the Coulomb potential at nearest neighbors and add a constant density tail correction.
    text_markdown: Truncate the Coulomb potential at nearest neighbors and add a constant density tail correction.
  - id: c
    text: Diagonalize the 3N × 3N Oseen matrix via Cholesky decomposition at every timestep.
    text_markdown: Diagonalize the 3N × 3N Oseen matrix via Cholesky decomposition at every timestep.
