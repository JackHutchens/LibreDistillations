    text_markdown: They round all particle coordinates $\mathbf{r}_i$ to integers so $\exp(i\mathbf{k}\cdot\mathbf{r})$ is
      always $\pm 1$.
  - id: d
    text: They evaluate $\exp(i\mathbf{k}\cdot\mathbf{r})$ using a 100-term series of Bessel functions at each $k$-vector.
    text_markdown: They evaluate $\exp(i\mathbf{k}\cdot\mathbf{r})$ using a 100-term series of Bessel functions at each $k$-vector.
  correct: a
  rationale_markdown: By factoring $e^{i\mathbf{k}\cdot\mathbf{r}} = [e^{i(2\pi/L_x)r_x}]^{m_1}[e^{i(2\pi/L_y)r_y}]^{m_2}[e^{i(2\pi/L_z)r_z}]^{m_3}$,
    an Ewald code evaluates `cos` and `sin` only 3 times per particle ($\mathcal{O}(N)$) and builds all powers $C_{j,m} =
    C_j^m$ and 3D wavevectors via fast complex multiplications.
- id: q26_single_particle_mc_ewald_update
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by: sec_kspace_algorithm_natoli_and_scaling
  prompt_markdown: In a Monte Carlo simulation of $N$ ions using Ewald summation with $M_k$ reciprocal-space wavevectors,
    suppose a trial move displaces only **a single ion $i$** from $\mathbf{r}_i^{\text{old}}$ to $\mathbf{r}_i^{\text{new}}$.
    How many operations are needed to update the reciprocal-space energy $V_{\text{long}}$?
  hint_markdown: 'Look at the bottom of: ''Changes due to moving a few particles can be calculated more quickly''.'
  options:
  - id: a
    text: $\mathcal{O}(M_k)$ operations (or $\mathcal{O}(N^{1/2})$ at optimal $\kappa$), by updating $\rho_{\mathbf{k}}^{\text{new}}
      = \rho_{\mathbf{k}}^{\text{old}} + q_i [\exp(i\mathbf{k}\cdot\mathbf{r}_i^{\text{new}}) - \exp(i\mathbf{k}\cdot\mathbf{r}_i^{\text{old}})]$
      for each $k$-vector without re-summing the other $N - 1$ particles.
    text_markdown: $\mathcal{O}(M_k)$ operations (or $\mathcal{O}(N^{1/2})$ at optimal $\kappa$), by updating $\rho_{\mathbf{k}}^{\text{new}}
      = \rho_{\mathbf{k}}^{\text{old}} + q_i [\exp(i\mathbf{k}\cdot\mathbf{r}_i^{\text{new}}) - \exp(i\mathbf{k}\cdot\mathbf{r}_i^{\text{old}})]$
      for each $k$-vector without re-summing the other $N - 1$ particles.
  - id: b
    text: $\mathcal{O}(N^2 M_k)$ operations, because every pair distance $r_{jk}$ must be Fourier transformed from scratch.
    text_markdown: $\mathcal{O}(N^2 M_k)$ operations, because every pair distance $r_{jk}$ must be Fourier transformed from
      scratch.
  - id: c
    text: $\mathcal{O}(N^3)$ operations via Cholesky decomposition of the $k$-space matrix.
    text_markdown: $\mathcal{O}(N^3)$ operations via Cholesky decomposition of the $k$-space matrix.
  - id: d
    text: Zero operations, because $V_{\text{long}}$ does not depend on individual particle positions.
    text_markdown: Zero operations, because $V_{\text{long}}$ does not depend on individual particle positions.
  correct: a
  rationale_markdown: Because $\rho_{\mathbf{k}} = \sum_j q_j e^{i\mathbf{k}\cdot\mathbf{r}_j}$ is an additive single-particle
    sum, moving one particle $i$ only changes $\rho_{\mathbf{k}}$ by $\Delta\rho_{\mathbf{k}} = q_i(e^{i\mathbf{k}\cdot\mathbf{r}_i^{\text{new}}}
    - e^{i\mathbf{k}\cdot\mathbf{r}_i^{\text{old}}})$, which costs $\mathcal{O}(M_k)$ instead of $\mathcal{O}(N M_k)$!
- id: q27_natoli_ceperley_optimized_breakup
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by: sec_kspace_algorithm_natoli_and_scaling
  prompt_markdown: How does the **Natoli–Ceperley (1995) optimized breakup** improve upon the conventional Gaussian Ewald
    splitting?
  hint_markdown: 'Recall ''Ewald: optimizing breakup''.'
  options:
  - id: a
    text: It expands $v_{\text{short}}(r) = \sum_n c_n h_n(r)$ in basis functions satisfying boundary conditions at $r_c =
      L/2$ and optimizes the coefficients $c_n$ to minimize the $k$-space truncation error from neglecting $|\mathbf{k}| >
      k_c$.
    text_markdown: It expands $v_{\text{short}}(r) = \sum_n c_n h_n(r)$ in basis functions satisfying boundary conditions
      at $r_c = L/2$ and optimizes the coefficients $c_n$ to minimize the $k$-space truncation error from neglecting $|\mathbf{k}|
      > k_c$.
  - id: b
    text: It replaces the Coulomb potential $1/r$ with a hard-sphere potential at all distances.
    text_markdown: It replaces the Coulomb potential $1/r$ with a hard-sphere potential at all distances.
  - id: c
    text: It sets the $k$-space cutoff $k_c = 0$ so that no Fourier vectors are ever needed.
    text_markdown: It sets the $k$-space cutoff $k_c = 0$ so that no Fourier vectors are ever needed.
  - id: d
    text: It uses a wider Gaussian so that $v_{\text{short}}(L/2)$ is maximized at the box boundary.
    text_markdown: It uses a wider Gaussian so that $v_{\text{short}}(L/2)$ is maximized at the box boundary.
  correct: a
  rationale_markdown: Classic Gaussian Ewald leaves a nonzero boundary error $v_{\text{short}}(L/2) = \frac{2q_1q_2}{L}\text{erfc}(\kappa
    L/2) \ne 0$ and uses a fixed Gaussian shape. Natoli & Ceperley expand $v_{\text{short}}(r) = \sum_n c_n h_n(r)$ in basis
    functions that vanish smoothly at $L/2$ and variationally choose $c_n$ to minimize the error from neglected $|\mathbf{k}|
    > k_c$ terms.
- id: q28_optimal_ewald_complexity_derivation
  type: problem
  question_type: single_select
  difficulty: medium
  taught_by:
  - sec_kspace_algorithm_natoli_and_scaling
  - concept_electrostatic_scaling
  prompt_markdown: When simulating $N$ charges at constant density ($\Omega \propto N$), what is the per-step computational
    complexity of the Ewald sum if (i) $\kappa$ is **not** re-optimized with $N$ ($r_c = L/2$ fixed fraction of box) versus
    (ii) $\kappa$ **is** optimally tuned ($\kappa \propto N^{1/6}/L$) together with neighbor lists?
  hint_markdown: Recall 'Use neighbor tables and optimize κ, Ewald is O(N^(3/2)); If we do not reoptimize, then O(N²)'.
  options:
  - id: a
    text: $\mathcal{O}(N^2)$ if $\kappa$ is not re-optimized; $\mathcal{O}(N^{3/2})$ when $\kappa$ is optimally tuned and
      neighbor lists are used.
    text_markdown: $\mathcal{O}(N^2)$ if $\kappa$ is not re-optimized; $\mathcal{O}(N^{3/2})$ when $\kappa$ is optimally tuned
      and neighbor lists are used.
  - id: b
    text: $\mathcal{O}(N^3)$ if $\kappa$ is not re-optimized; $\mathcal{O}(N^2)$ when $\kappa$ is optimally tuned.
    text_markdown: $\mathcal{O}(N^3)$ if $\kappa$ is not re-optimized; $\mathcal{O}(N^2)$ when $\kappa$ is optimally tuned.
  - id: c
    text: $\mathcal{O}(N\ln N)$ in both cases.
    text_markdown: $\mathcal{O}(N\ln N)$ in both cases.
  - id: d
    text: $\mathcal{O}(N)$ if $\kappa$ is not re-optimized; $\mathcal{O}(N^{3/2})$ when $\kappa$ is optimally tuned.
    text_markdown: $\mathcal{O}(N)$ if $\kappa$ is not re-optimized; $\mathcal{O}(N^{3/2})$ when $\kappa$ is optimally tuned.
  correct: a
  rationale_markdown: If $\kappa \propto 1/L$ is not re-optimized as $N$ grows, the real-space cutoff $r_c = L/2$ encompasses
    the entire box ($\mathcal{O}(N)$ neighbors per particle), giving $\mathcal{O}(N^2)$ scaling. Tuning $\kappa \propto N^{1/6}/L$
    (so $r_c \propto N^{-1/6}L$ and $M_k \propto N^{1/2}$) balances real and $k$-space costs at $\mathcal{O}(N^{3/2})$.
- id: q29_ewald_scaling_factor_numeric
