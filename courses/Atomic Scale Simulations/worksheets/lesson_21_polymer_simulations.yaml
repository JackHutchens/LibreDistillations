      text_markdown: Mixing two non-Boltzmann moves that violate detailed balance always cancels out their bias without needing
        Metropolis acceptance tests.
    correct:
    - a
    - b
    - c
    rationale_markdown: 'Mixing move types solves both **ergodicity** (a: local moves break up cul-de-sac traps that freeze
      reptation) and **multi-scale relaxation** (b: pivot relaxes global modes in $\mathcal{O}(N^{0.2})$ while crankshaft/kink-jump
      relaxes local bond correlations), while preserving exact canonical sampling because a probabilistic mixture $\sum_\alpha
      p_\alpha T_\alpha$ of detailed-balanced kernels remains in detailed balance (c). Option (d) is false: each move kernel
      must properly account for detailed balance.'
  - id: sec_rosenbluth_and_cbmc
    type: markdown_section
    title: 4. Exponential Attrition, Rosenbluth Look-Ahead Growth & Configurational Bias MC (CBMC)
    body_markdown: "### 1. The Attrition Problem in Simple (\"Blind\") Polymer Growth\nSuppose we try to generate an $N$-step\
      \ Self-Avoiding Walk (SAW) from scratch on a lattice of coordination number $q$ by starting at the origin and blindly\
      \ picking one of the $q$ neighbor directions (or $q-1$ non-reversing directions) at each step, throwing away the entire\
      \ walk whenever an overlap occurs:\n- Because each step has a finite probability of colliding with an already visited\
      \ site, the fraction of walks that survive to length $N$ decays **exponentially**:\n $$P_{\\text{survive}}(N) \\propto\
      \ e^{-\\lambda N}$$\n- This is the **exponential attrition problem**: for $N \\sim 100$–$1000$, virtually $100\\%$ of\
      \ blind walks terminate in self-intersections before reaching length $N$.\n\n### 2. The Rosenbluth–Rosenbluth (1955)\
      \ Biased Growth Method\nTo avoid stepping onto occupied sites, Rosenbluth and Rosenbluth introduced **look-ahead importance\
      \ sampling**:\n1. At growth step $i$ (adding monomer $i$ onto monomer $i-1$), scan all $q$ nearest-neighbor lattice\
      \ sites around monomer $i-1$ and count the number of **unoccupied (\"open\") moves** $q_i \\in \\{0, 1, \\dots, q\\\
      }$.\n2. If $q_i = 0$, the walk has hit a dead-end trap; set weight $W_n = 0$ and terminate.\n3. If $q_i > 0$, choose\
      \ one of the $q_i$ unoccupied neighbor sites uniformly at random with selection probability $p_{\\text{select}}(i) =\
      \ \\frac{1}{q_i}$ (instead of the unbiased blind probability $\\frac{1}{q}$).\n4. **Correcting the Bias with the Rosenbluth\
      \ Weight $W_n$:**\n Because we forced the walk into open sites with probability $\\prod_{i=1}^n (1/q_i)$ instead of\
      \ the uniform prior $(1/q)^n$, conformations running through crowded regions (small $q_i$) are **over-sampled** relative\
      \ to open conformations (large $q_i$). To obtain unbiased ensemble averages $\\langle A \\rangle$ over all SAWs, each\
      \ generated $n$-step chain $j$ must be weighted by its **Rosenbluth weight**:\n $$W_n = W_{n-1} \\left[\\frac{q_i}{q}\\\
      right] = \\prod_{i=1}^n \\left(\\frac{q_i}{q}\\right), \\qquad \\langle R^2 \\rangle = \\frac{\\sum_j W^{(j)}_n R_j^2}{\\\
      sum_j W^{(j)}_n}$$\n *(Note: Some conventions define $w_i = q_i$ without the constant $q^{-n}$ denominator since $q^n$\
      \ cancels in any ratio $\\sum_j W_j A_j / \\sum_j W_j$ or $W_{\\text{new}}/W_{\\text{old}}$.)*\n5. **High-Variance Limitation\
      \ for Very Long Chains & Branching (PERM):**\n For very long chains ($N \\gg 100$), the product $W_n = \\prod_{i=1}^n\
      \ (q_i/q)$ is a product of many random factors, so its distribution becomes extremely broad (log-normal): a tiny handful\
      \ of high-weight chains dominate the average $\\sum W_j R_j^2 / \\sum W_j$. As noted, algorithms like **PERM (Pruned-Enriched\
      \ Rosenbluth Method)** clone/branch high-weight walks (halving each clone's weight) and prune low-weight walks to keep\
      \ weight fluctuations bounded!\n\n### 3. Configurational Bias Monte Carlo (CBMC — Siepmann & Frenkel, 1992)\nInstead\
      \ of growing full chains independently from scratch, **Configurational Bias Monte Carlo (CBMC)** embeds Rosenbluth look-ahead\
      \ growth *inside* a Markov Chain Monte Carlo update (; Frenkel & Smit Chapters 11 & 13):\n1. **Select a Chain Segment\
      \ to Regrow:** Pick a polymer chain and cut off a terminal segment of $m$ monomers (or an interior segment).\n2. **Grow\
      \ the New Segment ($\\text{new}$):** Regrow the $m$ monomers step-by-step using Rosenbluth look-ahead sampling, recording\
      \ its new Rosenbluth weight:\n $$W_{\\text{new}} = \\prod_{i=1}^m \\left(\\frac{q_i^{(\\text{new})}}{q}\\right) \\quad\
      \ \\left(\\text{or in continuum/thermal systems: } W_{\\text{new}} = \\prod_{i=1}^m \\left[\\frac{1}{k}\\sum_{j=1}^k\
      \ e^{-\\beta u_i(\\mathbf{b}_j)}\\right]\\right)$$\n where at each step $i$, $k$ trial bond directions $\\{\\mathbf{b}_1,\
      \ \\dots, \\mathbf{b}_k\\}$ are proposed and direction $\\mathbf{b}_j$ is selected with probability $P_i(\\mathbf{b}_j)\
      \ = \\frac{e^{-\\beta u_i(\\mathbf{b}_j)}}{\\sum_{\\ell=1}^k e^{-\\beta u_i(\\mathbf{b}_\\ell)}}$.\n3. **Retrace the\
      \ Old Segment ($\\text{old}$):** Compute the Rosenbluth weight $W_{\\text{old}} = \\prod_{i=1}^m \\left(q_i^{(\\text{old})}\
      \ / q\\right)$ that the *existing* old segment would have had (generating $k-1$ phantom trial directions plus the 1\
      \ actual old bond at each step $i$ in the thermal/continuum case).\n4. **Super-Detailed Balance Acceptance Rule:**\n\
      \ Because the probability of proposing the new path is $\\mathcal{P}_{\\text{gen}}(\\text{new}) = \\prod_{i=1}^m \\\
      frac{1}{q_i^{(\\text{new})}} = \\frac{1}{q^m W_{\\text{new}}}$ while its equilibrium weight is constant (or $\\propto\
      \ \\prod e^{-\\beta u_i}$), detailed balance $\\pi(\\text{old})\\mathcal{P}_{\\text{gen}}(\\text{new}) A(\\text{old}\\\
      to\\text{new}) = \\pi(\\text{new})\\mathcal{P}_{\\text{gen}}(\\text{old}) A(\\text{new}\\to\\text{old})$ simplifies\
      \ miraculously to:\n $$\\boxed{\\text{acc. Prob} = A(\\text{old} \\to \\text{new}) = \\min\\!\\left[1,\\, \\frac{W_{\\\
      text{new}}}{W_{\\text{old}}}\\right]}$$\n Every factor of the look-ahead selection probability cancels against the Boltzmann\
      \ factor, yielding an **exact, ergodic Markov chain** that threads long polymer segments into dense melts and porous\
      \ media with high acceptance!"
  - id: concept_cbmc_rosenbluth
    type: concept_cell
    title: 'Interactive Explorer: Rosenbluth Weights & Configurational Bias MC (CBMC) Acceptance'
    description_markdown: Explore how Rosenbluth look-ahead growth accumulates step weights $W_n = \prod_{i=1}^n (q_i/q)$
      compared to blind growth attrition, and adjust the weight ratio $W_{\mathrm{new}}/W_{\mathrm{old}}$ to see how CBMC
      computes its exact Metropolis-like acceptance probability $A = \min(1, W_{\mathrm{new}}/W_{\mathrm{old}})$.
    render_function: render_cbmc_rosenbluth_growth
    layout: figure_left
    controls:
      regrow_steps:
