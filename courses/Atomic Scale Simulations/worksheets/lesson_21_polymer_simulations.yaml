      tolerance: 0.1
    rationale_markdown: 'For $N = 1000 = 10^3$:

      - In a good solvent ($\nu = 0.6$): $R_g^{\text{good}} \sim (10^3)^{0.6} = 10^{1.8} \approx 63.10\,a$.

      - In a poor solvent ($\nu = 1/3$): $R_g^{\text{poor}} \sim (10^3)^{1/3} = 10^{1.0} = 10.00\,a$.

      The linear size ratio is $\frac{63.10}{10.00} = 10^{0.8} \approx 6.31$, corresponding to a pervaded volume reduction
      $(R_g^{\text{good}}/R_g^{\text{poor}})^3 = 10^{2.4} \approx 251\times$!'
  - id: q36_cbmc_detailed_balance_derivation
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by:
    - sec_rosenbluth_and_cbmc
    - concept_cbmc_rosenbluth
    prompt_markdown: Let us verify why $A(\text{old} \to \text{new}) = \min(1, W_{\text{new}}/W_{\text{old}})$ satisfies **detailed
      balance** for an athermal lattice SAW where every valid configuration has equal equilibrium probability $\pi(\text{old})
      = \pi(\text{new})$. If an $m$-bond segment is regrown by choosing among $q_i$ open neighbors at each step $i$, what
      is the exact transition proposal probability $\mathcal{P}_{\text{gen}}(\text{old} \to \text{new})$ of generating a specific
      new path, expressed in terms of $q$ and $W_{\text{new}} = \prod_{i=1}^m (q_i^{(\text{new})} / q)$?
    hint_markdown: At each step $i = 1, \dots, m$, the specific bond along the new path is chosen with probability $1 / q_i^{(\text{new})}$.
      Multiply these $m$ probabilities together and substitute $W_{\text{new}} = \prod_{i=1}^m q_i^{(\text{new})} / q^m$.
    options:
    - id: a
      text: $\mathcal{P}_{\text{gen}}(\text{old} \to \text{new}) = \prod_{i=1}^m \frac{1}{q_i^{(\text{new})}} = \frac{1}{q^m
        W_{\text{new}}}$, so $\frac{\mathcal{P}_{\text{gen}}(\text{new} \to \text{old})}{\mathcal{P}_{\text{gen}}(\text{old}
        \to \text{new})} = \frac{W_{\text{new}}}{W_{\text{old}}}$.
      text_markdown: $\mathcal{P}_{\text{gen}}(\text{old} \to \text{new}) = \prod_{i=1}^m \frac{1}{q_i^{(\text{new})}} = \frac{1}{q^m
        W_{\text{new}}}$, so $\frac{\mathcal{P}_{\text{gen}}(\text{new} \to \text{old})}{\mathcal{P}_{\text{gen}}(\text{old}
        \to \text{new})} = \frac{W_{\text{new}}}{W_{\text{old}}}$.
    - id: b
      text: $\mathcal{P}_{\text{gen}}(\text{old} \to \text{new}) = q^m W_{\text{new}}$, so the ratio of proposal probabilities
        is $W_{\text{old}} / W_{\text{new}}$.
      text_markdown: $\mathcal{P}_{\text{gen}}(\text{old} \to \text{new}) = q^m W_{\text{new}}$, so the ratio of proposal
        probabilities is $W_{\text{old}} / W_{\text{new}}$.
    - id: c
      text: $\mathcal{P}_{\text{gen}}(\text{old} \to \text{new}) = q^{-m}$ regardless of $W_{\text{new}}$.
      text_markdown: $\mathcal{P}_{\text{gen}}(\text{old} \to \text{new}) = q^{-m}$ regardless of $W_{\text{new}}$.
    - id: d
      text: $\mathcal{P}_{\text{gen}}(\text{old} \to \text{new}) = 1 - W_{\text{new}}$.
      text_markdown: $\mathcal{P}_{\text{gen}}(\text{old} \to \text{new}) = 1 - W_{\text{new}}$.
    correct: a
    rationale_markdown: 'At each step $i \in \{1, \dots, m\}$, the specific direction leading to the new configuration is
      chosen with probability $\frac{1}{q_i^{(\text{new})}}$. Across $m$ steps, the probability of proposing that exact new
      path is:

      $$\mathcal{P}_{\text{gen}}(\text{old} \to \text{new}) = \prod_{i=1}^m \frac{1}{q_i^{(\text{new})}} = \frac{1}{q^m \prod_{i=1}^m
      (q_i^{(\text{new})}/q)} = \frac{1}{q^m W_{\text{new}}}$$

      Substituting into the Metropolis-Hastings ratio with $\pi(\text{new}) = \pi(\text{old})$ gives:

      $$\frac{\pi(\text{new})\mathcal{P}_{\text{gen}}(\text{new} \to \text{old})}{\pi(\text{old})\mathcal{P}_{\text{gen}}(\text{old}
      \to \text{new})} = \frac{1 / (q^m W_{\text{old}})}{1 / (q^m W_{\text{new}})} = \frac{W_{\text{new}}}{W_{\text{old}}}$$

      proving that $A(\text{old}\to\text{new}) = \min(1, W_{\text{new}}/W_{\text{old}})$ satisfies exact detailed balance!'
