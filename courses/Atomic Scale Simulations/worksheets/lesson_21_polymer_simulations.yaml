  - id: sec_reptation_pivot_and_ergodicity
    type: markdown_section
    title: '3. Polymer Monte Carlo Move Menus: Reptation, Pivot & Ergodicity Traps'
    body_markdown: "If we only care about **equilibrium statistical mechanics** (coil dimensions, structure factors, phase\
      \ coexistence, osmotic equation of state) rather than exact Newtonian trajectories, we can abandon Molecular Dynamics\
      \ and design **unphysical Monte Carlo (MC) trial moves** that leap across conformational space orders of magnitude faster\
      \ while rigorously obeying detailed balance!\n\n### 1. Local Moves (End-Bond Rotation, Kink-Jump / Corner Flip, Crankshaft)\n\
      - **End-bond move:** Rotate the first or last bond to a new neighbor site.\n- **Kink-jump (corner flip):** If monomer\
      \ $i$ forms a $90^\\circ$ corner between $i-1$ and $i+1$, flip monomer $i$ across the diagonal to the opposite corner\
      \ of the elementary square.\n- **Crankshaft move:** Rotate a 2-monomer U-shaped segment by $90^\\circ$ or $180^\\circ$\
      \ around the axis connecting its flanking monomers.\n- **Limitation:** Because local moves only displace $1$–$2$ monomers\
      \ at a time, they mimic physical Rouse dynamics and suffer the same slow global decorrelation time $\\tau_{\\text{local}}\
      \ \\sim \\mathcal{O}(N^{2\\nu+1}) \\approx \\mathcal{O}(N^{2.2})$ (or $\\mathcal{O}(N^3)$ in melts).\n\n### 2. Reptation\
      \ (\"Slithering Snake\" Algorithm — Wall & Mandel, 1975)\nInspired by de Gennes' reptation theory of entangled melts:\n\
      - **Trial Move:** Pick one of the two chain ends at random (head or tail), **delete** the terminal monomer at that end,\
      \ and **append** a new monomer onto the *other* end in a randomly chosen bond direction $\\theta$ (or lattice neighbor).\n\
      - **Detailed Balance Subtlety:** To preserve time-reversal symmetry (detailed balance), you must either choose which\
      \ end acts as the growing head with equal $50/50$ probability at every step, or implement a symmetric \"bounce\" rule\
      \ (staying in the old state and recording it again in the Markov chain whenever the proposed site is occupied).\n- **Computational\
      \ Efficiency:** Every accepted step shifts all monomer indices along the existing chain contour in $\\mathcal{O}(1)$\
      \ operations, sampling the bonding interaction directly while the Metropolis acceptance probability depends *only* on\
      \ the change in non-bonded potential at the deleted/added ends!\n- **Scaling Advantage:** Because the chain slithers\
      \ along its own contour of length $N$ in random forward/backward steps of $\\pm 1$ monomer, it vacates its initial tube\
      \ after $\\sim N^2$ elementary steps, reducing the conformational decorrelation time to **$\\tau_{\\text{reptation}}\
      \ \\sim \\mathcal{O}(N^2)$**—and crucially, **it still works in dense multi-chain melts!**\n- **The Non-Ergodicity Trap\
      \ (\"Double Cul-de-Sac\"):** Is pure lattice reptation ergodic? **No!** As noted \"*), a single chain (or multi-chain\
      \ system) can slither into a **\"double cul-de-sac\" (double dead-end)** configuration where *both* chain ends are completely\
      \ surrounded by already-occupied interior monomers of the chain ($q_{\\text{open}} = 0$ at both ends). Once in a double\
      \ cul-de-sac, no valid reptation move exists—nor can pure reptation ever enter such a valid SAW configuration from outside—violating\
      \ ergodicity!\n\n### 3. The Pivot Algorithm (Lal 1969; Madras & Sokal 1988)\nFor a **single isolated polymer chain in\
      \ dilute solution**:\n- **Trial Move:** Pick a monomer $k \\in \\{1, \\dots, N-1\\}$ uniformly at random as a **pivot\
      \ point**, and apply a random global symmetry transformation (rotation by $\\pm 90^\\circ, 180^\\circ$, reflection,\
      \ or continuous 3D angle $\\theta$) to the entire subchain $(k+1, \\dots, N)$ relative to monomer $k$.\n- **Accept or\
      \ Reject:** Check whether the rotated subchain overlaps with the unrotated subchain $(1, \\dots, k)$ (or changes non-bonded\
      \ energy $\\Delta U$); accept with the standard Metropolis probability $\\min(1, e^{-\\beta \\Delta U})$.\n- **Spectacular\
      \ Efficiency for Global Observables:** Because a single accepted pivot move reorients $\\mathcal{O}(N)$ monomers simultaneously,\
      \ the end-to-end vector decorrelates in **$\\tau_{\\text{pivot}} \\sim \\mathcal{O}(N^{0.2})$** accepted moves (measured\
      \ in macroscopic sweeps)—making the pivot algorithm the **most efficient method known for single-chain global equilibrium\
      \ properties**!\n- **Limitations of Pure Pivot:**\n 1. In **dense polymer melts** or compact poor-solvent globules,\
      \ rotating half a chain almost always collides with surrounding chains, driving the acceptance probability to zero ($A\
      \ \\to 0$).\n 2. Because pivot moves apply rigid-body rotations on a lattice, they never alter bond lengths or local\
      \ 1-step bond vectors if not combined with local moves.\n\n### 4. The Hybrid Move Menu Rule\nTo guarantee **ergodicity**\
      \ (reaching every valid conformation in chain space) while relaxing *both* short-wavelength local bond modes and long-wavelength\
      \ global coil vectors, practical polymer MC simulations always employ a **mixture of moves** (e.g., combining Pivot\
      \ + Reptation + Crankshaft/Kink-jump)."
