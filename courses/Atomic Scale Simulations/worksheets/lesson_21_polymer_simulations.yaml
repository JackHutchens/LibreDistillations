      text_markdown: Any convex combination (probabilistic mixture) of transition kernels that individually satisfy detailed
        balance with respect to the Boltzmann distribution also satisfies detailed balance.
    - id: d
      text: Mixing two non-Boltzmann moves that violate detailed balance always cancels out their bias without needing Metropolis
