worksheet:
  id: lesson_21_polymer_simulations
  title: 'Atomic Scale Simulations · Lesson 21: Polymer Physics, Coarse-Grained Models & Advanced Polymer Monte Carlo'
  estimated_minutes: 115
  learning_objectives:
  - Quantify the extreme spatial and temporal scale bridge in macromolecular dynamics—from femtosecond covalent bond vibrations
    to Rouse ($N^{2.2}$) and reptation ($N^{3.4}$) coil relaxation—and explain why brute-force atomistic MD is computationally
    intractable.
  - Formulate coarse-grained polymer Hamiltonians on lattices (Self-Avoiding Walks) and in the continuum (Kremer–Grest bead-spring
    model with WCA excluded volume and FENE logarithmic bonds that prevent chain crossing).
  - Derive and apply Flory scaling laws $\langle R^2 \rangle \propto N^{2\nu}$ across Good Solvent ($\nu \approx 0.588$, Flory
    $\nu = 3/(d+2)$), $\Theta$-Solvent ($\nu = 1/2$), and Poor Solvent ($\nu = 1/3$ collapsed globule) regimes.
  - Analyze specialized polymer Monte Carlo move sets—Reptation ("slithering snake"), Pivot global symmetry rotations, and
    local kink-jump/crankshaft flips—including their correlation-time exponents and the "double cul-de-sac" non-ergodicity
    trap.
  - Calculate Rosenbluth look-ahead weights $W_n = \prod_{i=1}^n (q_i/q)$ to overcome exponential attrition in chain growth
    and enforce exact detailed balance via Configurational Bias Monte Carlo (CBMC) acceptance $A = \min(1, W_{\mathrm{new}}/W_{\mathrm{old}})$.
  sections:
  - id: sec_timescale_and_coarse_graining
    type: markdown_section
    title: 1. The Macromolecular Timescale Chasm & Coarse-Grained Polymer Hamiltonians
    body_markdown: "Simulating long-chain polymers (`N` covalently bonded monomers) exposes one of the sharpest **multi-scale\
      \ bottlenecks** in computational materials science:\n\n1. **The Atomistic MD Timescale Chasm:**\n - Local covalent bond\
      \ stretching and angle oscillations occur on a period of $\\tau_{\\text{vib}} \\sim 10^{-13}\\text{ s}$, forcing a Molecular\
      \ Dynamics (MD) integration time step of $\\Delta t \\approx 10^{-14}\\text{ s}$ ($10\\text{ fs}$).\n - Yet macroscopic\
      \ conformational equilibration, coil untangling, and viscosity relaxation in polymers take **seconds to hours** of real\
      \ laboratory time—requiring $10^{14}$ to $10^{18}$ sequential MD force evaluations!\n - **Lecture Benchmark Estimate:**\
      \ Even for a modest system of $100$ chains of $50$ monomers each ($\\sim 20{,}000$ atoms including solvent) running\
      \ at $1\\text{ MD step/s}$, simulating just $10^{-4}\\text{ s}$ ($0.1\\text{ ms}$) of real time requires $10^{10}\\\
      text{ steps} \\approx 10^{10}\\text{ s} \\approx \\mathbf{300\\text{ years}}$ of continuous CPU time!\n - Simultaneously,\
      \ spatial scales span from monomeric bond lengths ($\\sim 1\\,\\text{Å}$) to whole-coil pervaded volumes of $(100\\\
      ,\\text{Å})^3$ or larger, where solvent-mediated **hydrodynamic interactions** dominate dilute-solution transport.\n\
      \n2. **Coarse-Graining Strategy:**\n To bridge 14+ orders of magnitude in time, we integrate out fast atomic degrees\
      \ of freedom and replace chemical repeat units with coarse-grained **blobs** or **beads**:\n - **Lattice Self-Avoiding\
      \ Walk (SAW):** A polymer is represented as a connected walk of $N$ steps on a regular lattice (coordination number\
      \ $q = 2d$, e.g., $q=4$ on a 2D square lattice or $q=6$ on a 3D simple cubic lattice) subject to strict **single-site\
      \ occupancy** (excluded volume: no two monomers may occupy the same lattice site). Attractive nearest-neighbor non-bonded\
      \ contacts $-\\epsilon$ can be added to model poor solvents.\n - **Continuum Bead–Spring (Kremer–Grest) Model:** Each\
      \ bead represents a Kuhn segment (\"blob\" of several chemical monomers). All bead pairs $(i < j)$ interact via a non-bonded\
      \ excluded-volume potential (typically a truncated-and-shifted purely repulsive Weeks–Chandler–Andersen / Lennard-Jones\
      \ core $\\phi_{\\text{LJ}}(r_{ij})$), while adjacent beads $(i, i+1)$ along the backbone are linked by a bonding potential:\n\
      \ $$V(\\{\\mathbf{r}_i\\}) = \\sum_{i < j} \\phi_{\\text{LJ}}(r_{ij}) + \\sum_{i=1}^{N-1} U_{\\text{bond}}(|\\mathbf{r}_i\
      \ - \\mathbf{r}_{i+1}|)$$\n\n3. **Why Harmonic Springs Fail & Why FENE Bonds Are Essential:**\n A naive harmonic spring\
      \ $\\gamma(r) = \\frac{1}{2}\\kappa (r - r_0)^2$ allows large thermal bond extensions at finite $k_B T$. If two chains\
      \ collide, a harmonic bond can stretch wide enough for one chain backbone to **pass directly through another chain**\
      \ (\"phantom chain crossing\"), destroying topological entanglement and ring-polymer knotting!\n Instead, continuum\
      \ polymer simulations use the **FENE (Finitely Extensible Nonlinear Elastic)** logarithmic bond potential (annotated\
      \ on Lecture as a modified harmonic potential with $k = 20$ and $\\sigma = 1.94\\,\\sigma_{\\text{HS}}$, or more generally\
      \ maximum extension $R_0 \\approx 1.5\\,\\sigma$):\n $$U_{\\text{FENE}}(r) = -\\frac{1}{2} k R_0^2 \\ln\\!\\left[1 -\
      \ \\left(\\frac{r}{R_0}\\right)^2\\right] \\quad (r < R_0)$$\n - **Small-extension limit ($r \\ll R_0$):** Taylor expanding\
      \ $-\\ln(1 - x) = x + \\frac{x^2}{2} + \\frac{x^3}{3} + \\cdots$ with $x = (r/R_0)^2$ yields:\n $$U_{\\text{FENE}}(r)\
      \ = \\frac{1}{2}k r^2 + \\frac{1}{4}\\frac{k}{R_0^2} r^4 + \\mathcal{O}(r^6)$$\n which reproduces a harmonic spring\
      \ of stiffness $k$ near $r \\to 0$.\n - **Finite extensibility wall ($r \\to R_0^-$):** As $r \\to R_0$, the argument\
      \ $1 - (r/R_0)^2 \\to 0^+$ and $U_{\\text{FENE}}(r) \\to +\\infty$, erecting an **impenetrable logarithmic barrier**\
      \ that strictly prevents any bond from stretching beyond $R_0$ and prevents chains from crossing through one another."
  - id: concept_fene_bonds
    type: concept_cell
    title: 'Interactive Explorer: Kremer–Grest FENE Bond Potential vs. Harmonic Springs'
    description_markdown: Adjust the spring constant $k$, maximum bond extensibility $R_0$, and toggle the Weeks–Chandler–Andersen
      (WCA) hard-core repulsion to inspect how the logarithmic FENE barrier prevents phantom chain crossing while stabilizing
      a well-defined equilibrium bond length $r_{\mathrm{eq}} \approx 0.96\,\sigma$.
    render_function: render_fene_vs_harmonic_bonds
    layout: figure_left
    controls:
      k_spring:
        kind: slider
        label: Bond stiffness k (ε/σ²)
        min: 10.0
        max: 45.0
        step: 5.0
        default: 30.0
      r0_max:
        kind: slider
        label: Max extensibility R₀ (σ)
        min: 1.25
        max: 1.85
        step: 0.05
        default: 1.5
      show_wca:
        kind: dropdown
        label: Non-bonded WCA Core
        default: 1
        options:
        - label: Include WCA Repulsion (Total Kremer–Grest Bond)
          value: 1
        - label: Pure Attractive Bond Potential Only
          value: 0
    takeaway_markdown: '**Key Takeaway:** Even a stiff harmonic bond ($\frac{1}{2}k R_0^2$) has a finite energy at $r = R_0$,
      whereas $U_{\mathrm{FENE}}(r) = -\frac{1}{2}k R_0^2 \ln[1 - (r/R_0)^2]$ diverges to $+\infty$ at $r = R_0$, rigorously
      preserving chain connectivity and entanglement topology.'
  - id: q01_md_timescale_bottleneck
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_timescale_and_coarse_graining
    prompt_markdown: In an all-atom Molecular Dynamics (MD) simulation of a polymer melt or solution, what physical motion
      dictates the maximum stable integration time step $\Delta t \approx 10^{-14}\text{ s}$, and how many total MD steps
      are required to reach macroscopic coil relaxation times of $1\text{ s}$ to $1\text{ hour}$?
    hint_markdown: 'Recall ''Time estimate for MD'': compare the period of local covalent vibrations ($10^{-13}\text{ s}$)
      against $1\text{ s} - 3600\text{ s}$ divided by $\Delta t = 10^{-14}\text{ s}$.'
    options:
    - id: a
      text: Fast local covalent bond oscillations ($\tau_{\text{vib}} \sim 10^{-13}\text{ s}$) fix $\Delta t \approx 10^{-14}\text{
        s}$, requiring $10^{14}$ to $10^{18}$ sequential MD steps to reach seconds-to-hours polymer relaxation.
      text_markdown: Fast local covalent bond oscillations ($\tau_{\text{vib}} \sim 10^{-13}\text{ s}$) fix $\Delta t \approx
        10^{-14}\text{ s}$, requiring $10^{14}$ to $10^{18}$ sequential MD steps to reach seconds-to-hours polymer relaxation.
    - id: b
      text: Whole-chain center-of-mass diffusion fixes $\Delta t \approx 10^{-9}\text{ s}$, requiring $10^6$ to $10^9$ steps.
      text_markdown: Whole-chain center-of-mass diffusion fixes $\Delta t \approx 10^{-9}\text{ s}$, requiring $10^6$ to $10^9$
        steps.
    - id: c
      text: Electronic orbital transitions fix $\Delta t \approx 10^{-18}\text{ s}$, requiring $10^{24}$ steps.
      text_markdown: Electronic orbital transitions fix $\Delta t \approx 10^{-18}\text{ s}$, requiring $10^{24}$ steps.
    - id: d
      text: Rotational isomerization of side groups fixes $\Delta t \approx 10^{-6}\text{ s}$, requiring $10^6$ to $10^{10}$
        steps.
      text_markdown: Rotational isomerization of side groups fixes $\Delta t \approx 10^{-6}\text{ s}$, requiring $10^6$ to
        $10^{10}$ steps.
    correct: a
    rationale_markdown: Local covalent bond vibrations occur on a timescale of $\sim 10^{-13}\text{ s}$, requiring an MD time
      step $\Delta t \approx 10^{-14}\text{ s}$ ($10\text{ fs}$) to resolve the fastest harmonic modes stably. Reaching macroscopic
      conformational changes that take seconds ($1\text{ s} / 10^{-14}\text{ s} = 10^{14}$ steps) to hours ($\sim 10^{18}$
      steps) is therefore impossible by brute-force atomistic MD without coarse-graining.
  - id: q02_md_cpu_years_estimate
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_timescale_and_coarse_graining
    prompt_markdown: Consider the lecture benchmark system of $100$ polymer chains of $50$ monomers each ($\sim 20{,}000$
      particles including solvent) integrated with time step $\Delta t = 10^{-14}\text{ s}$ at a computational throughput
      of $1\text{ step/s}$. Approximately how many **years** of wall-clock CPU time are required to simulate just $10^{-4}\text{
      s}$ ($0.1\text{ ms}$) of physical real time? (Use the lecture conversion $10^{10}\text{ s} \approx 300\text{ years}$
      and enter the integer number of years.)
    hint_markdown: Determine the total number of integration steps required to reach the target physical time and convert
      the resulting wall-clock time into years.
    correct:
      value: 300.0
      tolerance: 20.0
    rationale_markdown: To reach $t_{\text{phys}} = 10^{-4}\text{ s}$ with $\Delta t = 10^{-14}\text{ s}$ requires $N_{\text{steps}}
      = 10^{-4} / 10^{-14} = 10^{10}$ steps. At $1\text{ step/s}$, this takes $10^{10}\text{ s} \approx \frac{10^{10}}{3.156
      \times 10^7\text{ s/yr}} \approx 317\text{ years}$ (quoted as **$300\text{ years}$** ).
  - id: q03_coarse_grained_bead_meaning
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_timescale_and_coarse_graining
    prompt_markdown: In a coarse-grained bead-spring polymer model (such as the Kremer–Grest model), what does a single simulated
      "bead" physically represent?
    hint_markdown: 'Recall ''Bead spring model'': does a bead correspond to a single carbon atom or a larger collective sub-unit?'
    options:
    - id: a
      text: A coarse-grained 'blob' (Kuhn segment) encompassing a section of several chemical monomers along the polymer chain.
      text_markdown: A coarse-grained 'blob' (Kuhn segment) encompassing a section of several chemical monomers along the
        polymer chain.
    - id: b
      text: A single valence electron shared along the conjugated polymer backbone.
      text_markdown: A single valence electron shared along the conjugated polymer backbone.
    - id: c
      text: An entire entangled polymer chain collapsed into a single point particle.
      text_markdown: An entire entangled polymer chain collapsed into a single point particle.
    - id: d
      text: A solvent cage molecule that permanently binds to one specific carbon atom.
      text_markdown: A solvent cage molecule that permanently binds to one specific carbon atom.
    correct: a
    rationale_markdown: '*"A bead does not represent an atom, but a blob—a section of the chain."* Grouping several chemical
      repeat units into a single effective Kuhn bead averages over stiff local bond lengths and angles while preserving universal
      long-wavelength coil statistics and entanglement topology.'
  - id: q04_fene_taylor_expansion
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_timescale_and_coarse_graining
    - concept_fene_bonds
    prompt_markdown: Consider the FENE bond potential $U_{\text{FENE}}(r) = -\frac{1}{2}k R_0^2 \ln\!\left[1 - (r/R_0)^2\right]$
      for $r < R_0$. Using the Maclaurin expansion $-\ln(1 - x) = x + \frac{1}{2}x^2 + \frac{1}{3}x^3 + \cdots$, what are
      the leading two terms of $U_{\text{FENE}}(r)$ at small bond extensions ($r \ll R_0$)?
    hint_markdown: Substitute $x = (r/R_0)^2$ into $-\frac{1}{2}k R_0^2 [-\ln(1-x)] = \frac{1}{2}k R_0^2 (x + \frac{1}{2}x^2
      + \cdots)$.
    options:
    - id: a
      text: $U_{\text{FENE}}(r) = \frac{1}{2}k r^2 + \frac{k}{4 R_0^2} r^4 + \mathcal{O}(r^6)$
      text_markdown: $U_{\text{FENE}}(r) = \frac{1}{2}k r^2 + \frac{k}{4 R_0^2} r^4 + \mathcal{O}(r^6)$
    - id: b
      text: $U_{\text{FENE}}(r) = k R_0 r - \frac{1}{2}k r^2 + \mathcal{O}(r^3)$
      text_markdown: $U_{\text{FENE}}(r) = k R_0 r - \frac{1}{2}k r^2 + \mathcal{O}(r^3)$
    - id: c
      text: $U_{\text{FENE}}(r) = \frac{1}{2}k R_0^2 r^2 + \frac{1}{2}k R_0^4 r^4 + \mathcal{O}(r^6)$
      text_markdown: $U_{\text{FENE}}(r) = \frac{1}{2}k R_0^2 r^2 + \frac{1}{2}k R_0^4 r^4 + \mathcal{O}(r^6)$
    - id: d
      text: $U_{\text{FENE}}(r) = -\frac{1}{2}k r^2 + \frac{k}{2 R_0^2} r^4 + \mathcal{O}(r^6)$
      text_markdown: $U_{\text{FENE}}(r) = -\frac{1}{2}k r^2 + \frac{k}{2 R_0^2} r^4 + \mathcal{O}(r^6)$
    correct: a
    rationale_markdown: 'Setting $x = (r/R_0)^2$ in $-\ln(1-x) = x + \frac{1}{2}x^2 + \cdots$ and multiplying by $\frac{1}{2}k
      R_0^2$ gives:

      $$U_{\text{FENE}}(r) = \frac{1}{2}k R_0^2 \left[\frac{r^2}{R_0^2} + \frac{1}{2}\frac{r^4}{R_0^4} + \cdots\right] = \frac{1}{2}k
      r^2 + \frac{k}{4 R_0^2} r^4 + \mathcal{O}(r^6)$$

      Thus $U_{\text{FENE}}(r)$ reduces smoothly to a harmonic spring of constant $k$ at small $r$, while stiffening anharmonically
      as $r$ approaches $R_0$.'
  - id: q05_fene_energy_numerical
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_timescale_and_coarse_graining
    - concept_fene_bonds
    prompt_markdown: Using the lecture FENE bond potential $U_{\text{FENE}}(r) = -\frac{1}{2}k R_0^2 \ln\!\left[1 - (r/R_0)^2\right]$
      with spring constant $k = 20$ and maximum extensibility $R_0 = 2.0$ (in reduced units), calculate $U_{\text{FENE}}(r)$
      when the bond is stretched to $r = 1.6$.
    hint_markdown: Evaluate the dimensionless extension ratio $r/R_0$ and compute the logarithmic energy potential using the
      given spring constant.
    correct:
      value: 40.87
      tolerance: 0.25
    rationale_markdown: 'Substituting $k = 20$, $R_0 = 2.0$, and $r/R_0 = 1.6/2.0 = 0.8$ gives:

      $$U_{\text{FENE}}(1.6) = -\frac{1}{2}(20)(2.0)^2 \ln(1 - 0.8^2) = -40 \ln(0.36) \approx -40 \times (-1.02165) \approx
      40.87$$

      Notice that a harmonic spring $\frac{1}{2}k r^2$ at the same extension would have energy $\frac{1}{2}(20)(1.6)^2 = 25.6$,
      already $15.3$ energy units lower than the stiffening FENE bond.'
  - id: q06_fene_prevents_chain_crossing
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_timescale_and_coarse_graining
    - concept_fene_bonds
    prompt_markdown: Why is the logarithmic divergence of $U_{\text{FENE}}(r \to R_0) \to +\infty$ (combined with a hard-core
      WCA excluded-volume repulsion of diameter $\sigma$ and $R_0 \approx 1.5\,\sigma$) critical for simulating entangled
      polymer melts and ring polymers?
    hint_markdown: 'Think about what happens to two colliding chains if a bond can stretch past $\sqrt{2}\sigma$ or $2\sigma$:
      can one chain pass through the bond of another?'
    options:
    - id: a
      text: It strictly bounds the maximum bond length below $R_0$, making it energetically impossible for two chains to stretch
        wide enough to pass through one another ('phantom chain crossing') and thereby preserving topological entanglement.
      text_markdown: It strictly bounds the maximum bond length below $R_0$, making it energetically impossible for two chains
        to stretch wide enough to pass through one another ('phantom chain crossing') and thereby preserving topological entanglement.
    - id: b
      text: It eliminates all attractive and repulsive forces between non-bonded monomers so the melt behaves as an ideal
        gas.
      text_markdown: It eliminates all attractive and repulsive forces between non-bonded monomers so the melt behaves as
        an ideal gas.
    - id: c
      text: It forces all bond angles to remain fixed at exactly $180^\circ$, converting every coil into a rigid rod.
      text_markdown: It forces all bond angles to remain fixed at exactly $180^\circ$, converting every coil into a rigid
        rod.
    - id: d
      text: It allows the MD time step $\Delta t$ to be increased to $1\text{ s}$ without numerical instability.
      text_markdown: It allows the MD time step $\Delta t$ to be increased to $1\text{ s}$ without numerical instability.
    correct: a
    rationale_markdown: In an entangled melt or linked ring polymer system, topological constraints (chains cannot pass through
      one another) govern reptation dynamics and viscoelasticity. Because $U_{\text{FENE}}(r) \to +\infty$ as $r \to R_0 \approx
      1.5\,\sigma$ while non-bonded beads repel strongly inside $r < 2^{1/6}\sigma$, the gap between two bonded beads can
      never open wide enough for another bead to slip through.
  - id: q07_lattice_saw_definition
    type: problem
    question_type: multi_select
    difficulty: easy
    taught_by: sec_timescale_and_coarse_graining
    prompt_markdown: Which of the following statements accurately describe the **Lattice Self-Avoiding Walk (SAW)** model
      of a polymer? *(Select all that apply.)*
    hint_markdown: 'Check and 7: how are connectivity, excluded volume, the partition function, and solvent attraction represented
      on a lattice?'
    options:
    - id: a
      text: Sequential monomers $i$ and $i+1$ occupy nearest-neighbor sites on a regular lattice, enforcing fixed bond connectivity.
      text_markdown: Sequential monomers $i$ and $i+1$ occupy nearest-neighbor sites on a regular lattice, enforcing fixed
        bond connectivity.
    - id: b
      text: No lattice site may be visited more than once by the walk, capturing hard-core excluded-volume repulsion.
      text_markdown: No lattice site may be visited more than once by the walk, capturing hard-core excluded-volume repulsion.
    - id: c
      text: For an athermal SAW (excluded volume only), the canonical partition function $Z_N$ is simply the total number
        of distinct valid $N$-step self-avoiding walks.
      text_markdown: For an athermal SAW (excluded volume only), the canonical partition function $Z_N$ is simply the total
        number of distinct valid $N$-step self-avoiding walks.
    - id: d
      text: An attractive energy $-\epsilon$ between non-bonded nearest-neighbor occupied sites can be added to model poor-solvent
        coil-to-globule collapse.
      text_markdown: An attractive energy $-\epsilon$ between non-bonded nearest-neighbor occupied sites can be added to model
        poor-solvent coil-to-globule collapse.
    correct:
    - a
    - b
    - c
    - d
    rationale_markdown: 'All four statements are foundational properties of the lattice SAW model: nearest-neighbor steps
      enforce connectivity (a), single occupancy enforces excluded volume (b), equal-weight valid walks make $Z_N$ a combinatorial
      sum over all $N$-step SAWs (c), and non-bonded nearest-neighbor attractions drive $\Theta$-point collapse into a compact
      globule (d).'
  - id: sec_flory_scaling_and_phases
    type: markdown_section
    title: 2. Polymer Phase Diagrams, Universal Flory Scaling & Rouse Relaxation
    body_markdown: "The macroscopic size of an $N$-monomer polymer coil is characterized by its **mean-square end-to-end distance**\
      \ $\\langle R_{ee}^2 \\rangle = \\langle (\\mathbf{r}_N - \\mathbf{r}_0)^2 \\rangle$ or its **mean-square radius of\
      \ gyration**:\n$$\\langle R_g^2 \\rangle = \\frac{1}{N}\\sum_{i=1}^N \\left\\langle (\\mathbf{r}_i - \\mathbf{r}_{\\\
      text{cm}})^2 \\right\\rangle = \\frac{1}{2N^2}\\sum_{i=1}^N \\sum_{j=1}^N \\left\\langle (\\mathbf{r}_i - \\mathbf{r}_j)^2\
      \ \\right\\rangle$$\nIn the asymptotic long-chain limit ($N \\gg 1$), both length scales obey the universal **Flory\
      \ scaling law**:\n$$\\langle R_{ee}^2 \\rangle \\propto N^{2\\nu} \\quad \\Longleftrightarrow \\quad R_g \\equiv \\\
      sqrt{\\langle R_g^2 \\rangle} \\propto a\\,N^\\nu$$\nwhere $\\nu$ is the universal **Flory size exponent**, which depends\
      \ only on spatial dimensionality $d$ and the balance between monomer–monomer excluded volume and solvent-mediated attraction:\n\
      \n| Polymer Phase / Solvent Regime | Physical Balance | Exact / Numerical $\\nu$ ($d=3$) | Flory Mean-Field $\\nu$ |\
      \ $\\langle R^2 \\rangle$ Scaling ($d=3$) |\n|:--- |:--- |:---: |:---: |:---: |\n| **Good Solvent (Swollen SAW)** |\
      \ Repulsive excluded volume dominates; coil swells | $\\nu \\approx \\mathbf{0.588}$ | $\\nu_{\\text{F}} = \\frac{3}{d+2}\
      \ = \\frac{3}{5} = \\mathbf{0.60}$ | $\\langle R^2 \\rangle \\propto N^{1.176}$ |\n| **$\\Theta$-Solvent (Theta Point)**\
      \ | Attraction exactly cancels two-body repulsion (ideal RW) | $\\nu = \\mathbf{0.500}$ ($1/2$) | $\\nu = 1/2$ | $\\\
      langle R^2 \\rangle = N a^2$ |\n| **Poor Solvent (Collapsed Globule)** | Monomer attraction dominates; dense liquid-like\
      \ drop | $\\nu = \\frac{1}{d} = \\mathbf{0.333}$ ($1/3$) | $\\nu = 1/3$ | $\\langle R^2 \\rangle \\propto N^{2/3}$ |\n\
      | **Rigid Rod / 1D Walk** | Fully stretched chain or $d=1$ SAW | $\\nu = \\mathbf{1.000}$ | $\\nu = 1$ | $\\langle R^2\
      \ \\rangle \\propto N^2$ |\n\n### Flory's Mean-Field Free Energy Derivation of $\\nu = \\frac{3}{d+2}$\nFlory estimated\
      \ the equilibrium coil size $R$ in a good solvent by balancing two competing free-energy contributions in $d$ dimensions:\n\
      1. **Entropic Elastic Stretching Penalty:** Stretching an ideal Gaussian chain ($\\langle R_0^2 \\rangle = N a^2$) to\
      \ radius $R$ reduces conformational entropy:\n $$\\frac{F_{\\text{el}}(R)}{k_B T} \\sim \\frac{R^2}{N a^2}$$\n2. **Excluded-Volume\
      \ Two-Body Repulsion:** Inside the coil volume $V \\sim R^d$, the mean monomer density is $\\rho \\sim N / R^d$, so\
      \ the repulsive two-body interaction energy scales as $V v_{\\text{excl}} \\rho^2$:\n $$\\frac{F_{\\text{rep}}(R)}{k_B\
      \ T} \\sim v_{\\text{excl}} R^d \\left(\\frac{N}{R^d}\\right)^2 = v_{\\text{excl}} \\frac{N^2}{R^d}$$\nMinimizing $F_{\\\
      text{tot}}(R) = F_{\\text{el}}(R) + F_{\\text{rep}}(R)$ with respect to $R$ ($\\partial F_{\\text{tot}}/\\partial R\
      \ = 0$) gives:\n$$\\frac{R}{N a^2} \\sim \\frac{N^2}{R^{d+1}} \\quad \\Longrightarrow \\quad R^{d+2} \\propto N^3 \\\
      quad \\Longrightarrow \\quad \\boxed{R \\propto N^{\\frac{3}{d+2}} \\implies \\nu_{\\text{Flory}} = \\frac{3}{d+2} \\\
      quad (1 \\le d \\le 4)}$$\n- For **$d = 1$**: $\\nu_{\\text{Flory}} = 3/3 = 1$ (exact; a 1D self-avoiding walk cannot\
      \ turn back!).\n- For **$d = 2$**: $\\nu_{\\text{Flory}} = 3/4 = 0.75$ (exact in 2D!).\n- For **$d = 3$**: $\\nu_{\\\
      text{Flory}} = 3/5 = 0.60$, remarkably close to the renormalization-group / Monte Carlo value $\\nu \\approx 0.588$.\n\
      - For **$d \\ge 4$ (upper critical dimension $d_c = 4$)**: two random walks rarely intersect, so excluded volume becomes\
      \ irrelevant and $\\nu = 1/2$.\n\n### Dynamical Scaling & Rouse / Reptation Relaxation Times\nWhy does coil swelling\
      \ make Molecular Dynamics and local Monte Carlo so slow?\n- In an unentangled **Rouse chain**, a monomer diffuses with\
      \ local mobility $\\sim 1/N$ over a distance $R \\sim N^\\nu$, requiring a global conformational **relaxation time**:\n\
      \ $$\\tau_{\\text{Rouse}} \\sim \\frac{R^2}{D_{\\text{cm}}} \\sim \\frac{N^{2\\nu}}{N^{-1}} = N^{2\\nu + 1}$$\n For\
      \ a 3D SAW ($\\nu \\approx 0.588 \\approx 0.6$), this gives the lecture scaling **$\\tau_{\\text{relax}} \\sim N^{2.2}$**\
      \ (or $N^2$ for an ideal $\\Theta$-chain).\n- In an **entangled polymer melt** ($N > N_e$, de Gennes tube model), chains\
      \ are confined to topological tubes of contour length $L_{\\text{tube}} \\propto N$ with curvilinear tube diffusivity\
      \ $D_{\\text{tube}} \\propto N^{-1}$, giving $\\tau_{\\text{rep}} \\sim L_{\\text{tube}}^2 / D_{\\text{tube}} \\propto\
      \ N^3$ (and experimentally $\\tau_{\\text{relax}} \\propto N^{3.4}$ due to contour-length fluctuations).\n- Beyond linear\
      \ chains, polymer physics explores diverse **macromolecular topologies**, including **ring polymers** (no free ends!)\
      \ and **star/branched polymers** ($f$ arms radiating from a central core)."
