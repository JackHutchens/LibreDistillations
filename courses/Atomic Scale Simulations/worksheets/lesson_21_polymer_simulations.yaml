    hint_markdown: What happens when you rigidly swing a subchain of hundreds of monomers through a densely packed box filled
      with other monomers?
    options:
    - id: a
      text: Rigidly rotating a macroscopic subchain of $\sim N/2$ monomers through a dense melt or compact globule almost
        always causes hard-core steric overlaps with neighboring monomers, driving the acceptance probability exponentially
        to zero.
      text_markdown: Rigidly rotating a macroscopic subchain of $\sim N/2$ monomers through a dense melt or compact globule
        almost always causes hard-core steric overlaps with neighboring monomers, driving the acceptance probability exponentially
        to zero.
    - id: b
      text: Pivot moves do not conserve the total number of monomers $N$ in a multi-chain box.
      text_markdown: Pivot moves do not conserve the total number of monomers $N$ in a multi-chain box.
    - id: c
      text: In a dense melt, the Flory exponent becomes $\nu = 0$, so rotation angles are undefined.
      text_markdown: In a dense melt, the Flory exponent becomes $\nu = 0$, so rotation angles are undefined.
