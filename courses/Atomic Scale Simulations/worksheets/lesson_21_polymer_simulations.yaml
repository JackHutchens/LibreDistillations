      text_markdown: The Pivot algorithm (mixed with occasional local moves), because its global end-to-end autocorrelation
        time scales as $\mathcal{O}(N^{0.2})$ in dilute solution.
    - id: b
      text: All-atom Molecular Dynamics with explicit water molecules and $\Delta t = 10^{-14}\text{ s}$.
