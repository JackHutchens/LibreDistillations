  - id: q38_upper_critical_dimension_flory
    type: problem
    question_type: numeric
    difficulty: hard
    taught_by: sec_flory_scaling_and_phases
    prompt_markdown: According to Flory's formula $\nu_{\text{Flory}} = \frac{3}{d+2}$, at what **upper critical spatial dimension
      $d_c$** does the swollen self-avoiding walk exponent $\nu_{\text{Flory}}$ drop down to match the ideal random walk exponent
      $\nu_{\text{RW}} = \frac{1}{2}$ (above which excluded-volume interactions become asymptotically irrelevant for long
      chains)?
    hint_markdown: Equate Flory's dimensional formula for the swollen coil exponent to the ideal random walk value and solve
      for the dimension.
    correct:
      value: 4.0
      tolerance: 0.01
    rationale_markdown: Setting $\nu_{\text{Flory}} = \frac{3}{d_c + 2} = \frac{1}{2}$ yields $d_c + 2 = 6 \implies \mathbf{d_c
      = 4}$. Geometrically, an ideal random walk has fractal Hausdorff dimension $d_f = 1/\nu = 2$. In space of dimension
      $d \ge 4 = 2 d_f$, two 2-dimensional random-walk manifolds generically do not intersect at long distances, so excluded
      volume no longer swells the asymptotic scaling exponent ($\nu = 1/2$ for all $d \ge 4$).
