      text_markdown: Pivot moves require calculating hydrodynamic Oseen tensors at every step.
    correct: a
    rationale_markdown: In a dense melt (volume fraction $\phi \sim 1$) or collapsed globule, virtually every lattice site
      or continuum volume element surrounding the chain is occupied. Swinging a large subchain $(k+1 \dots N)$ rigidly around
