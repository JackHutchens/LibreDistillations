    hint_markdown: 'Recall ''Ergodic questions arise: Can you go everywhere in chain space? Make a mixture of moves.'''
    options:
    - id: a
      text: Combining local interior flips (crankshaft/kink-jump) with reptation or pivot moves eliminates non-ergodic traps
        such as double cul-de-sacs, ensuring the Markov chain can reach all valid conformations.
      text_markdown: Combining local interior flips (crankshaft/kink-jump) with reptation or pivot moves eliminates non-ergodic
        traps such as double cul-de-sacs, ensuring the Markov chain can reach all valid conformations.
    - id: b
      text: Global pivot moves rapidly decorrelate long-wavelength observables (like $R_{ee}$ and $R_g$), while local crankshaft/kink-jump
