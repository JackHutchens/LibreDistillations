      among the $q_i$ open neighbor sites, and CBMC removes that look-ahead bias inside a Markov chain by accepting the regrown
      segment with $A(\mathrm{old}\to\mathrm{new}) = \min(1, W_{\mathrm{new}}/W_{\mathrm{old}})$.'
  - id: q22_blind_growth_attrition
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by:
    - sec_rosenbluth_and_cbmc
    - concept_cbmc_rosenbluth
    prompt_markdown: Why does the naive ("blind") polymer growth algorithm—which grows a chain step-by-step at random and
      discards the entire walk whenever a self-intersection occurs—fail for long chains ($N \gg 100$)?
    hint_markdown: Consider how the survival probability $P_{\text{survive}}(N)$ scales as $N$ increases when each step has
      a nonzero probability of overlap.
    options:
    - id: a
      text: Because the probability that a blind walk avoids all self-intersections decays exponentially with chain length
        ($P_{\text{survive}} \propto e^{-\lambda N}$), a phenomenon known as exponential attrition.
      text_markdown: Because the probability that a blind walk avoids all self-intersections decays exponentially with chain
        length ($P_{\text{survive}} \propto e^{-\lambda N}$), a phenomenon known as exponential attrition.
    - id: b
      text: Because blind growth biases the surviving walks toward collapsed globules with $\nu = 1/3$.
      text_markdown: Because blind growth biases the surviving walks toward collapsed globules with $\nu = 1/3$.
    - id: c
      text: Because a lattice of coordination number $q$ can only hold at most $q^2$ monomers.
      text_markdown: Because a lattice of coordination number $q$ can only hold at most $q^2$ monomers.
    - id: d
      text: Because blind growth requires computing the full $N \times N$ Hessian matrix at every step.
      text_markdown: Because blind growth requires computing the full $N \times N$ Hessian matrix at every step.
    correct: a
    rationale_markdown: Although the rare walks that survive blind growth without overlap are distributed uniformly among
      all valid $N$-step SAWs, the survival probability decays exponentially as $P_{\text{survive}}(N) \propto (\mu_{\text{eff}}/q)^N
      = e^{-\lambda N}$. For $N = 1000$, virtually zero blind trials survive to completion.
  - id: q23_rosenbluth_weight_definition
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by:
    - sec_rosenbluth_and_cbmc
    - concept_cbmc_rosenbluth
    prompt_markdown: In the lattice **Rosenbluth growth algorithm**, suppose the lattice coordination number is $q$, and at
      growth step $i$ there are $q_i$ unoccupied ("open") nearest-neighbor sites available. How is the next site chosen, and
      how is the cumulative **Rosenbluth weight** $W_n$ updated?
    hint_markdown: 'Check the formula: $W_n = W_{n-1} [q_i / q]$ where $q_i = \text{# of open moves}$.'
    options:
    - id: a
      text: One of the $q_i$ open sites is chosen with probability $1/q_i$, and the weight is updated via $W_n = W_{n-1} \left(\frac{q_i}{q}\right)
        = \prod_{i=1}^n \left(\frac{q_i}{q}\right)$.
      text_markdown: One of the $q_i$ open sites is chosen with probability $1/q_i$, and the weight is updated via $W_n =
        W_{n-1} \left(\frac{q_i}{q}\right) = \prod_{i=1}^n \left(\frac{q_i}{q}\right)$.
    - id: b
      text: One of all $q$ neighbor sites is chosen with probability $1/q$, and $W_n = W_{n-1} + q_i$.
      text_markdown: One of all $q$ neighbor sites is chosen with probability $1/q$, and $W_n = W_{n-1} + q_i$.
    - id: c
      text: The open site closest to the origin is chosen deterministically, and $W_n = (q / q_i)^n$.
      text_markdown: The open site closest to the origin is chosen deterministically, and $W_n = (q / q_i)^n$.
    - id: d
      text: One of the $q_i$ open sites is chosen with probability $q_i / q$, and $W_n = 1$ for all chains.
      text_markdown: One of the $q_i$ open sites is chosen with probability $q_i / q$, and $W_n = 1$ for all chains.
    correct: a
    rationale_markdown: At step $i$, Rosenbluth growth restricts selection to the $q_i$ unoccupied neighbor sites, choosing
      one with uniform probability $1/q_i$. Because the probability of generating a specific path is $\prod_{i=1}^n (1/q_i)$
      instead of the unbiased $(1/q)^n$, multiplying the cumulative weight by $q_i/q$ at each step ($W_n = \prod_{i=1}^n (q_i/q)$)
      exactly compensates for the look-ahead selection bias.
  - id: q24_rosenbluth_weight_numerical
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_rosenbluth_and_cbmc
    - concept_cbmc_rosenbluth
    prompt_markdown: A 3-step self-avoiding polymer segment is grown on a **2D square lattice ($q = 4$)** using the Rosenbluth
      algorithm with $W_0 = 1$. Suppose the number of open neighbor sites at steps $i = 1, 2, 3$ is $q_1 = 4$, $q_2 = 3$,
      and $q_3 = 2$. What is the resulting Rosenbluth weight $W_3 = \prod_{i=1}^3 (q_i / q)$?
    hint_markdown: Multiply the step survival fractions $q_i / q$ over the three growth steps.
    correct:
      value: 0.375
      tolerance: 0.005
    rationale_markdown: 'Using $W_n = \prod_{i=1}^n (q_i / q)$ with $q = 4$ and $(q_1, q_2, q_3) = (4, 3, 2)$:

      $$W_3 = \left(\frac{4}{4}\right)\left(\frac{3}{4}\right)\left(\frac{2}{4}\right) = 1 \times 0.75 \times 0.50 = \frac{3}{8}
      = 0.375$$'
  - id: q25_rosenbluth_why_reweight
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_rosenbluth_and_cbmc
    - concept_cbmc_rosenbluth
    prompt_markdown: Suppose two valid $N$-step self-avoiding walks, Walk A and Walk B, are generated by the Rosenbluth growth
      algorithm. Walk A passes through a very crowded, tightly coiled region where most steps only had $q_i = 1$ open site,
      whereas Walk B passes through an open region where most steps had $q_i = 3$ open sites. Before reweighting by $W_N$,
      which walk is **more likely to be generated** by the Rosenbluth sampling procedure, and how does $W_N$ correct this?
    hint_markdown: Compare the path generation probability $P_{\text{gen}} = \prod_{i=1}^N (1/q_i)$ for small $q_i$ vs. Large
      $q_i$.
    options:
    - id: a
      text: Walk A is generated with higher probability ($P_{\text{gen}} = \prod (1/q_i)$ is larger when $q_i$ is small),
        so Rosenbluth reweighting assigns Walk A a correspondingly smaller weight $W_N = \prod (q_i/q) = (q^N P_{\text{gen}})^{-1}$
        so that $P_{\text{gen}} W_N = q^{-N}$ is equal for all valid SAWs.
      text_markdown: Walk A is generated with higher probability ($P_{\text{gen}} = \prod (1/q_i)$ is larger when $q_i$ is
        small), so Rosenbluth reweighting assigns Walk A a correspondingly smaller weight $W_N = \prod (q_i/q) = (q^N P_{\text{gen}})^{-1}$
        so that $P_{\text{gen}} W_N = q^{-N}$ is equal for all valid SAWs.
    - id: b
      text: Walk B is generated with higher probability, so Walk B receives a smaller Rosenbluth weight $W_N$.
      text_markdown: Walk B is generated with higher probability, so Walk B receives a smaller Rosenbluth weight $W_N$.
    - id: c
      text: Both walks are generated with identical probability $q^{-N}$, so $W_N$ is only needed when non-bonded attractions
        are nonzero.
      text_markdown: Both walks are generated with identical probability $q^{-N}$, so $W_N$ is only needed when non-bonded
        attractions are nonzero.
    - id: d
      text: Walk A has zero probability of being generated because $q_i = 1$ terminates the walk.
      text_markdown: Walk A has zero probability of being generated because $q_i = 1$ terminates the walk.
    correct: a
    rationale_markdown: Because the algorithm is forced to pick the single available open site whenever $q_i = 1$ (with conditional
      probability $1/1 = 1$), crowded conformations like Walk A have a much *higher* path generation probability $P_{\text{gen}}
      = \prod_{i=1}^N (1/q_i)$ than open conformations like Walk B ($P_{\text{gen}} \sim 3^{-N}$). Multiplying by $W_N = \prod_{i=1}^N
      (q_i/q)$ guarantees that $P_{\text{gen}}(\text{walk}) \times W_N(\text{walk}) = q^{-N}$ is strictly uniform across every
      valid $N$-step SAW!
  - id: q26_rosenbluth_weighted_estimator
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_rosenbluth_and_cbmc
    - concept_cbmc_rosenbluth
    prompt_markdown: 'In a Rosenbluth growth simulation of $M = 3$ polymer chains, you record the following Rosenbluth weights
      $W_j$ and squared end-to-end distances $R_j^2$:

      - Chain 1: $W_1 = 0.20$, $R_1^2 = 10.0$

      - Chain 2: $W_2 = 0.50$, $R_2^2 = 20.0$

      - Chain 3: $W_3 = 0.30$, $R_3^2 = 30.0$


      Using the lecture estimator $\langle R^2 \rangle = \frac{\sum_j W_j R_j^2}{\sum_j W_j}$, what is the unbiased estimate
      of $\langle R^2 \rangle$?'
    hint_markdown: Compute the weighted average of the squared end-to-end distances normalized by the sum of weights.
    correct:
      value: 21.0
      tolerance: 0.1
    rationale_markdown: 'Evaluating the weighted average:

      $$\langle R^2 \rangle = \frac{0.20(10.0) + 0.50(20.0) + 0.30(30.0)}{0.20 + 0.50 + 0.30} = \frac{2.0 + 10.0 + 9.0}{1.00}
      = 21.0$$'
  - id: q27_rosenbluth_branching_perm
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_rosenbluth_and_cbmc
    prompt_markdown: When growing very long polymers with the standalone Rosenbluth method, the weights $W_n = \prod_{i=1}^n
      (q_i/q)$ fluctuate over many orders of magnitude so that a few rare trajectories dominate the sample average. What algorithmic
      technique is introduced to overcome this weight-fluctuation bottleneck?
    hint_markdown: 'Read the fourth bullet: ''Use... When weights fluctuate too much.'''
    options:
    - id: a
      text: Branching (cloning/enriching trajectories whose weights grow too large and pruning trajectories whose weights
        fall too low, as in PERM).
      text_markdown: Branching (cloning/enriching trajectories whose weights grow too large and pruning trajectories whose
        weights fall too low, as in PERM).
    - id: b
      text: Replacing the Rosenbluth weight $W_n$ with $\ln W_n$ inside the numerator of $\langle R^2 \rangle$.
      text_markdown: Replacing the Rosenbluth weight $W_n$ with $\ln W_n$ inside the numerator of $\langle R^2 \rangle$.
    - id: c
      text: Freezing the first $90\\%$ of the chain into a straight rod.
      text_markdown: Freezing the first $90\\%$ of the chain into a straight rod.
    - id: d
      text: Increasing the MD integration time step $\Delta t$.
      text_markdown: Increasing the MD integration time step $\Delta t$.
    correct: a
    rationale_markdown: As stated, population control / **branching** (such as Grassberger's Pruned-Enriched Rosenbluth Method,
      PERM) splits a high-weight partial chain into $m$ independent copies (each assigned weight $W_n/m$) and probabilistically
      prunes low-weight partial chains, concentrating computational effort on statistically important conformations.
  - id: q28_cbmc_acceptance_formula
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by:
    - sec_rosenbluth_and_cbmc
    - concept_cbmc_rosenbluth
    prompt_markdown: In **Configurational Bias Monte Carlo (CBMC)**, a section of a polymer chain is regrown using Rosenbluth
      look-ahead sampling with weight $W_{\text{new}}$, while the old section has retraced Rosenbluth weight $W_{\text{old}}$.
      What is the exact CBMC acceptance probability $A(\text{old} \to \text{new})$ shown?
    hint_markdown: Check the boxed formula at the bottom of.
    options:
    - id: a
      text: $A(\text{old} \to \text{new}) = \min\\!\left[1,\\, \frac{W_{\text{new}}}{W_{\text{old}}}\right]$
      text_markdown: $A(\text{old} \to \text{new}) = \min\\!\left[1,\\, \frac{W_{\text{new}}}{W_{\text{old}}}\right]$
    - id: b
      text: $A(\text{old} \to \text{new}) = \min\\!\left[1,\\, \frac{W_{\text{old}}}{W_{\text{new}}}\right]$
      text_markdown: $A(\text{old} \to \text{new}) = \min\\!\left[1,\\, \frac{W_{\text{old}}}{W_{\text{new}}}\right]$
    - id: c
      text: $A(\text{old} \to \text{new}) = \frac{W_{\text{new}}}{W_{\text{new}} + W_{\text{old}}} e^{-\beta (W_{\text{new}}
        - W_{\text{old}})}$
      text_markdown: $A(\text{old} \to \text{new}) = \frac{W_{\text{new}}}{W_{\text{new}} + W_{\text{old}}} e^{-\beta (W_{\text{new}}
        - W_{\text{old}})}$
    - id: d
      text: $A(\text{old} \to \text{new}) = 1$ always, because Rosenbluth growth never overlaps.
      text_markdown: $A(\text{old} \to \text{new}) = 1$ always, because Rosenbluth growth never overlaps.
    correct: a
    rationale_markdown: Because the probability of generating the new path is inversely proportional to its Rosenbluth weight,
      $\mathcal{P}_{\text{gen}}(\text{new}) \propto 1/W_{\text{new}}$ (or $\propto e^{-\beta U(\text{new})}/W_{\text{new}}$
      in thermal systems), the Metropolis-Hastings acceptance ratio $\frac{\pi(\text{new})\mathcal{P}_{\text{gen}}(\text{old})}{\pi(\text{old})\mathcal{P}_{\text{gen}}(\text{new})}$
      simplifies directly to $\frac{W_{\text{new}}}{W_{\text{old}}}$, giving $A(\text{old}\to\text{new}) = \min(1, W_{\text{new}}/W_{\text{old}})$.
  - id: q29_cbmc_acceptance_numerical
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by:
    - sec_rosenbluth_and_cbmc
    - concept_cbmc_rosenbluth
    prompt_markdown: During a Configurational Bias Monte Carlo (CBMC) update on a 3D cubic lattice ($q = 6$), you regrow a
      3-bond end segment. The newly grown segment has open-site counts $(q_1, q_2, q_3)_{\text{new}} = (3, 4, 3)$, while retracing
      the old segment yields $(q_1, q_2, q_3)_{\text{old}} = (5, 4, 3)$. What is the CBMC acceptance probability $A(\text{old}
      \to \text{new}) = \min(1, W_{\text{new}}/W_{\text{old}})$?
    hint_markdown: Evaluate the ratio of the product of open neighbors along the new trial path to that along the old path.
    correct:
      value: 0.6
      tolerance: 0.01
    rationale_markdown: 'Computing the ratio of Rosenbluth weights:

      $$\frac{W_{\text{new}}}{W_{\text{old}}} = \frac{(3/6)(4/6)(3/6)}{(5/6)(4/6)(3/6)} = \frac{36}{60} = \frac{3}{5} = 0.60$$

      Hence $A(\text{old} \to \text{new}) = \min(1, 0.60) = 0.60$.'
  - id: q30_cbmc_continuum_generalization
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_rosenbluth_and_cbmc
    prompt_markdown: notes that CBMC is *"Easily generalized to continuum models."* In a continuum bead-spring polymer at
      inverse temperature $\beta = 1/(k_B T)$, there are infinitely many possible bond directions rather than $q$ discrete
      lattice sites. How does continuum CBMC perform step $i$ of the Rosenbluth regrowth?
    hint_markdown: 'Recall Frenkel & Smit Chapters 11 & 13: how do we replace summing over all $q$ lattice neighbors when
      directions are continuous?'
    options:
    - id: a
      text: It generates a finite set of $k$ random trial bond directions $\\{\mathbf{b}_1, \dots, \mathbf{b}_k\\}$ (sampled
        from the bonded distribution), selects one direction $\mathbf{b}_j$ with Boltzmann probability $e^{-\beta u_i(\mathbf{b}_j)}
        / \sum_{\ell=1}^k e^{-\beta u_i(\mathbf{b}_\ell)}$, and accumulates the step Rosenbluth factor $w_i = \frac{1}{k}\sum_{\ell=1}^k
        e^{-\beta u_i(\mathbf{b}_\ell)}$.
      text_markdown: It generates a finite set of $k$ random trial bond directions $\\{\mathbf{b}_1, \dots, \mathbf{b}_k\\}$
        (sampled from the bonded distribution), selects one direction $\mathbf{b}_j$ with Boltzmann probability $e^{-\beta
        u_i(\mathbf{b}_j)} / \sum_{\ell=1}^k e^{-\beta u_i(\mathbf{b}_\ell)}$, and accumulates the step Rosenbluth factor
        $w_i = \frac{1}{k}\sum_{\ell=1}^k e^{-\beta u_i(\mathbf{b}_\ell)}$.
    - id: b
      text: It discretizes all of 3D space into a cubic grid of spacing $0.001\\,\text{Å}$ and sums over all grid points in
        the box.
      text_markdown: It discretizes all of 3D space into a cubic grid of spacing $0.001\\,\text{Å}$ and sums over all grid
        points in the box.
    - id: c
      text: It integrates the Newtonian equations of motion for $k$ femtoseconds and sets $W_{\text{new}} = 1$.
      text_markdown: It integrates the Newtonian equations of motion for $k$ femtoseconds and sets $W_{\text{new}} = 1$.
    - id: d
      text: It chooses the single direction of steepest descent $-\nabla U$ deterministically with zero random trials.
      text_markdown: It chooses the single direction of steepest descent $-\nabla U$ deterministically with zero random trials.
    correct: a
    rationale_markdown: In continuum CBMC (Frenkel & Smit Ch. 13), at each growth step $i$ we draw $k$ trial bond vectors
      $\{\mathbf{b}_1, \dots, \mathbf{b}_k\}$ from the internal bond/angle prior, evaluate the external non-bonded Boltzmann
      weight $e^{-\beta u_i(\mathbf{b}_\ell)}$ for each trial, pick direction $j$ with probability $P_j = e^{-\beta u_i(\mathbf{b}_j)}
      / \sum_{\ell=1}^k e^{-\beta u_i(\mathbf{b}_\ell)}$, and multiply the Rosenbluth weight by $w_i = \frac{1}{k}\sum_{\ell=1}^k
      e^{-\beta u_i(\mathbf{b}_\ell)}$ (while retracing the old segment using its actual bond $\mathbf{b}_{\text{old}}$ plus
      $k-1$ random trial directions).
  - id: sec_synthesis_and_comparison
    type: markdown_section
    title: '5. Synthesis: Choosing the Right Polymer Simulation Method Across Regimes'
    body_markdown: 'Let us synthesize the scaling laws and algorithmic trade-offs covered across Lesson 21:


      | Simulation Method | Primary Use Case | Conformational Relaxation Scaling $\tau_{\text{relax}}$ | Key Advantage | Primary
      Limitation |

      |:--- |:--- |:---: |:--- |:--- |

      | **All-Atom MD** | Local chemistry, solvation shells, $<100\text{ ns}$ kinetics | $\tau \sim N^{2.2}$ to $N^{3.4}$
      ($\Delta t = 10^{-14}\text{ s}$) | Exact physical dynamics & explicit solvent | $\sim 300\text{ CPU years}$ for $10^{-4}\text{
      s}$ of $20{,}000$ atoms |

      | **Coarse-Grained MD (Kremer–Grest FENE + WCA)** | Entangled melt rheology, tube reptation dynamics | $\tau_{\text{Rouse}}
      \sim N^{2.2}$, $\tau_{\text{rep}} \sim N^{3}$–$N^{3.4}$ | Preserves real topological entanglement dynamics | Still slow
      for very large $N$ equilibration |

      | **Local Lattice MC (Kink-jump / Crankshaft)** | Short-scale bond relaxation & Rouse dynamics | $\tau \sim \mathcal{O}(N^{2\nu+1})
      \approx \mathcal{O}(N^{2.2})$ | Simple, physical Rouse-like local dynamics | Slow global coil decorrelation |

      | **Reptation MC ("Slithering Snake")** | Dense polymer melts & concentrated solutions | $\tau \sim \mathcal{O}(N^2)$
      elementary steps | $\mathcal{O}(1)$ update cost; works in dense melts | Unphysical dynamics; **non-ergodic** alone (double
      cul-de-sac) |

      | **Pivot Algorithm** | Single isolated chain in dilute good/$\Theta$ solvent | $\tau \sim \mathcal{O}(N^{0.2})$ sweeps
      | Fastest global decorrelation known | Acceptance $\to 0$ in dense melts / globules; doesn''t relax bond lengths |

      | **Rosenbluth + CBMC** | Regrowing segments in dense melts, branched chains, phase equilibria | High acceptance for
      $m$-segment regrowth | Overcomes exponential attrition; exact detailed balance $A = \min(1, W_{\text{new}}/W_{\text{old}})$
      | Weight variance grows for very large $m$ without branching |'
  - id: q31_method_selection_dilute_saw
