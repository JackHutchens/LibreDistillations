  - id: q32_method_selection_dense_melt_dynamics
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_synthesis_and_comparison
    prompt_markdown: Suppose your research goal is to measure the **physical time-dependent mean-square displacement $g_1(t)
      = \langle [\mathbf{r}_i(t) - \mathbf{r}_i(0)]^2 \rangle$ and viscosity** of an entangled polymer melt to test de Gennes'
      tube reptation theory. Why must you use **coarse-grained Molecular Dynamics (with FENE + WCA potentials)** or purely
      **local MC moves** rather than the Pivot or CBMC algorithms?
    hint_markdown: Do Pivot and CBMC moves follow physical continuous trajectories, or do they teleport chains across topological
      obstacles?
    options:
    - id: a
      text: Because Pivot and CBMC perform non-local, unphysical conformational jumps that bypass topological entanglement
        barriers; measuring real physical transport and entanglement kinetics requires continuous FENE+WCA MD trajectories
        (or strictly local non-crossing moves).
      text_markdown: Because Pivot and CBMC perform non-local, unphysical conformational jumps that bypass topological entanglement
        barriers; measuring real physical transport and entanglement kinetics requires continuous FENE+WCA MD trajectories
        (or strictly local non-crossing moves).
    - id: b
      text: Because Pivot and CBMC do not sample the canonical Boltzmann distribution at equilibrium.
      text_markdown: Because Pivot and CBMC do not sample the canonical Boltzmann distribution at equilibrium.
    - id: c
      text: Because FENE+WCA Molecular Dynamics has a relaxation time of $\mathcal{O}(N^{0.2})$.
      text_markdown: Because FENE+WCA Molecular Dynamics has a relaxation time of $\mathcal{O}(N^{0.2})$.
    - id: d
      text: Because CBMC can only be applied to 1D chains.
      text_markdown: Because CBMC can only be applied to 1D chains.
    correct: a
    rationale_markdown: Non-local Monte Carlo moves (Pivot, CBMC, and multi-chain reptation jumps) are designed to accelerate
      **equilibrium ensemble averages** by bypassing physical kinetic barriers, which means their Markov-chain "time" does
      not represent physical Newtonian/Brownian dynamics and allows chains to bypass entanglement tubes. To study physical
      entanglement dynamics, one must use coarse-grained MD with non-crossing FENE+WCA potentials (or strictly local dynamic
      MC moves).
  - id: q33_hydrodynamic_solvent_effects
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_timescale_and_coarse_graining
    prompt_markdown: 'Note that: *"Solvent is important. Hydrodynamic effects dominate."* In a dilute polymer solution, why
      does omitting explicit solvent molecules (or hydrodynamic coupling) alter the physical relaxation time scaling of a
      polymer coil?'
    hint_markdown: In a real fluid, moving one monomer creates a velocity field that drags nearby monomers along (Zimm hydrodynamics),
      whereas without solvent momentum transport each bead feels independent friction (Rouse model).
    options:
    - id: a
      text: Moving a monomer in a real solvent induces long-range velocity fields (hydrodynamic interactions) that couple
        the motion of distant segments of the coil, whereas naive vacuum/implicit-solvent dynamics treats friction as purely
        local and independent.
      text_markdown: Moving a monomer in a real solvent induces long-range velocity fields (hydrodynamic interactions) that
        couple the motion of distant segments of the coil, whereas naive vacuum/implicit-solvent dynamics treats friction
        as purely local and independent.
    - id: b
      text: Solvent molecules change the spatial dimensionality of the simulation box from $d=3$ to $d=2$.
      text_markdown: Solvent molecules change the spatial dimensionality of the simulation box from $d=3$ to $d=2$.
    - id: c
      text: Without explicit solvent molecules, the FENE potential $U_{\text{FENE}}(r)$ no longer diverges at $r = R_0$.
      text_markdown: Without explicit solvent molecules, the FENE potential $U_{\text{FENE}}(r)$ no longer diverges at $r
        = R_0$.
    - id: d
      text: Hydrodynamic momentum conservation alters the static equilibrium Flory exponent $\nu$ of an athermal SAW.
      text_markdown: Hydrodynamic momentum conservation alters the static equilibrium Flory exponent $\nu$ of an athermal
        SAW.
    correct: a
    rationale_markdown: In a dilute polymer solution, momentum transport through the solvent creates long-range **hydrodynamic
      interactions** (Zimm dynamics, $\tau_{\text{Zimm}} \sim R^3 \sim N^{3\nu}$), so a moving monomer drags surrounding solvent
      and nearby chain segments along with it. Standard implicit-solvent Langevin/Rouse dynamics neglects this hydrodynamic
      backflow, while keeping explicit solvent atoms drastically increases the particle count $N_{\text{atoms}}$. (Note that
      static equilibrium exponents like $\nu$ depend only on the configurational Hamiltonian, not on momenta!)
  - id: q34_saw_partition_function_temperature
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_timescale_and_coarse_graining
    - sec_flory_scaling_and_phases
    prompt_markdown: In a pure **athermal Lattice Self-Avoiding Walk (SAW)** where the potential energy is $U = 0$ for every
      non-overlapping walk and $U = +\infty$ for any overlapping walk, how does the equilibrium Flory exponent $\nu$ depend
      on temperature $T$?
    hint_markdown: Write down the Boltzmann factor $e^{-U / (k_B T)}$ when $U$ can only take the values $0$ or $+\infty$.
    options:
    - id: a
      text: It is completely independent of temperature $T$ ($\nu \approx 0.588$ at all $T > 0$), because $e^{-0/k_B T} =
        1$ and $e^{-\infty/k_B T} = 0$, so every valid SAW has identical weight regardless of $T$; temperature dependence
        only enters when finite non-bonded attractions $-\epsilon$ are added.
      text_markdown: It is completely independent of temperature $T$ ($\nu \approx 0.588$ at all $T > 0$), because $e^{-0/k_B
        T} = 1$ and $e^{-\infty/k_B T} = 0$, so every valid SAW has identical weight regardless of $T$; temperature dependence
        only enters when finite non-bonded attractions $-\epsilon$ are added.
    - id: b
      text: It decreases linearly with temperature as $\nu(T) = 1 - k_B T$.
      text_markdown: It decreases linearly with temperature as $\nu(T) = 1 - k_B T$.
    - id: c
      text: It jumps from $\nu = 0.588$ to $\nu = 1/3$ at $k_B T = 1$ even when $\epsilon = 0$.
      text_markdown: It jumps from $\nu = 0.588$ to $\nu = 1/3$ at $k_B T = 1$ even when $\epsilon = 0$.
    - id: d
      text: It diverges to infinity as $T \to 0$.
      text_markdown: It diverges to infinity as $T \to 0$.
    correct: a
    rationale_markdown: In a pure hard-core excluded-volume SAW ($U \in \{0, +\infty\}$), the Boltzmann weight $e^{-\beta
      U}$ is simply an indicator function ($1$ if self-avoiding, $0$ if overlapping) for any finite temperature $0 < T < \infty$.
      The coil swelling is driven purely by **conformational entropy** (entropic excluded volume). Temperature-driven $\Theta$-collapse
      only occurs when a finite energetic interaction $-\epsilon$ between non-bonded nearest neighbors is included.
  - id: q35_radius_of_gyration_ratio_good_vs_poor
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_flory_scaling_and_phases
    - concept_flory_scaling
    prompt_markdown: Consider a long polymer chain of $N = 1000$ monomers in $d = 3$ dimensions. Using the Flory scaling relation
      $R_g \approx a N^\nu$ (with unit prefactor $a = 1$), calculate the ratio $\frac{R_g(\text{Good Solvent, }\nu = 0.6)}{R_g(\text{Poor
