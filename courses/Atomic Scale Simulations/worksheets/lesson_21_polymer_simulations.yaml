  - id: q15_reptation_move_mechanism
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by:
    - sec_reptation_pivot_and_ergodicity
    - concept_reptation_pivot
    prompt_markdown: How does an elementary trial step of the **Reptation ("slithering snake") Monte Carlo** algorithm update
      an $N$-monomer polymer chain?
    hint_markdown: '''Cut off one end and stick onto the other end.'''
    options:
    - id: a
      text: It deletes one terminal monomer from a randomly chosen chain end and appends a new monomer in a random bond direction
        onto the opposite chain end.
      text_markdown: It deletes one terminal monomer from a randomly chosen chain end and appends a new monomer in a random
        bond direction onto the opposite chain end.
    - id: b
      text: It translates all $N$ monomers rigidly by the same random Cartesian vector $\Delta \mathbf{r}$.
      text_markdown: It translates all $N$ monomers rigidly by the same random Cartesian vector $\Delta \mathbf{r}$.
    - id: c
      text: It cuts the polymer in half at monomer $N/2$ and swaps the two halves.
      text_markdown: It cuts the polymer in half at monomer $N/2$ and swaps the two halves.
    - id: d
      text: It simultaneously perturbs the $(x,y,z)$ coordinates of all $N$ monomers using Gaussian white noise.
      text_markdown: It simultaneously perturbs the $(x,y,z)$ coordinates of all $N$ monomers using Gaussian white noise.
    correct: a
    rationale_markdown: In Wall–Mandel reptation MC, a terminal monomer is removed from one end of the chain and attached
      in a random direction at the other end. All interior monomers simply shift their index by $\pm 1$ along the existing
      backbone contour, advancing the polymer by one monomer step along its own tube in $\mathcal{O}(1)$ operations.
  - id: q16_reptation_decorrelation_scaling
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_reptation_pivot_and_ergodicity
    - concept_reptation_pivot
    prompt_markdown: Why does the conformational decorrelation time (in elementary MC steps) of the **reptation algorithm**
      scale as $\mathcal{O}(N^2)$?
    hint_markdown: Each elementary slithering step shifts the chain contour by $\pm 1$ monomer along a tube of length $N$
      monomers. How many random $\pm 1$ steps are required to diffuse a distance of $N$ monomers along the 1D contour?
    options:
    - id: a
      text: Because choosing either end at random causes the chain to perform a 1D random walk of step size $\pm 1$ monomer
        along its contour of length $N$, requiring $\sim N^2$ steps to diffuse completely out of its initial tube.
      text_markdown: Because choosing either end at random causes the chain to perform a 1D random walk of step size $\pm
        1$ monomer along its contour of length $N$, requiring $\sim N^2$ steps to diffuse completely out of its initial tube.
    - id: b
      text: Because evaluating the distance between the two chain ends requires an $N \times N$ matrix multiplication at every
        step.
      text_markdown: Because evaluating the distance between the two chain ends requires an $N \times N$ matrix multiplication
        at every step.
    - id: c
      text: Because only $1/N^2$ of proposed end moves avoid overlapping with the immediately adjacent monomer.
      text_markdown: Because only $1/N^2$ of proposed end moves avoid overlapping with the immediately adjacent monomer.
    - id: d
      text: Because the radius of gyration scales as $R_g \propto N^2$ in a good solvent.
      text_markdown: Because the radius of gyration scales as $R_g \propto N^2$ in a good solvent.
    correct: a
    rationale_markdown: In reptation MC, each step randomly advances or retreats the chain by $\pm 1$ monomer along its contour
      of $N$ segments. By standard 1D diffusion ($\langle \Delta s^2 \rangle \sim t_{\text{steps}}$), vacating the entire
      $N$-monomer initial tube ($\Delta s \sim N$) takes $\tau \sim \mathcal{O}(N^2)$ elementary steps—a major speedup over
      physical entanglement dynamics ($\tau_{\text{phys}} \sim N^3$ to $N^{3.4}$ in sweeps, or $N^4$ to $N^{4.4}$ in elementary
      operations).
  - id: q17_reptation_double_cul_de_sac
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_reptation_pivot_and_ergodicity
    - concept_reptation_pivot
    prompt_markdown: Why is the pure **lattice reptation algorithm** strictly **non-ergodic** for self-avoiding walks?
    hint_markdown: Recall 'But Ergodic? Not always (what if both ends get trapped?)' and inspect the 'Double Cul-de-Sac Trap'
      in the interactive explorer above.
    options:
    - id: a
      text: Because there exist valid self-avoiding configurations ('double cul-de-sac' traps) in which all nearest-neighbor
        sites of both chain ends are occupied by interior monomers, preventing the chain from ever entering or leaving those
        states via end-slithering alone.
      text_markdown: Because there exist valid self-avoiding configurations ('double cul-de-sac' traps) in which all nearest-neighbor
        sites of both chain ends are occupied by interior monomers, preventing the chain from ever entering or leaving those
        states via end-slithering alone.
    - id: b
      text: Because reptation violates conservation of total monomer number $N$.
      text_markdown: Because reptation violates conservation of total monomer number $N$.
    - id: c
      text: Because reptation can only move the chain forward and never backward, violating microscopic reversibility.
      text_markdown: Because reptation can only move the chain forward and never backward, violating microscopic reversibility.
    - id: d
      text: Because reptation always collapses a good-solvent chain into a $\nu = 1/3$ globule.
      text_markdown: Because reptation always collapses a good-solvent chain into a $\nu = 1/3$ globule.
    correct: a
    rationale_markdown: Ergodicity requires that every valid configuration in the ensemble can be reached from every other
      valid configuration in a finite number of Markov steps. On a lattice, a chain can form a valid self-avoiding "double
      cul-de-sac" where all $q$ neighbor sites around *both* ends are occupied by interior beads ($q_{\text{open}} = 0$).
      Pure reptation can neither escape nor enter such states, partitioning configuration space into disconnected components.
  - id: q18_reptation_bounce_detailed_balance
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_reptation_pivot_and_ergodicity
    prompt_markdown: 'the lecture notes state: *"Choose end at random or ''bounce'' with rejection."* Why does a naive reptation
      scheme that **always** grows at end $N$ (moving strictly forward along the chain) violate detailed balanceunless ends
      are chosen at random (or reversed upon rejection)?'
    hint_markdown: 'Recall the detailed balance condition $\pi(o) T(o \to n) = \pi(n) T(n \to o)$: if state $n$ is obtained
      from state $o$ by deleting monomer $1$ and adding monomer $N+1$, how can the Markov chain return directly from $n$ to
      $o$ in one step?'
    options:
    - id: a
      text: Because moving from state $o$ to state $n$ by deleting the tail and growing at the head can only be reversed in
        a single step ($n \to o$) if the algorithm is also allowed to delete the newly grown head monomer and regrow at the
        old tail!
      text_markdown: Because moving from state $o$ to state $n$ by deleting the tail and growing at the head can only be reversed
        in a single step ($n \to o$) if the algorithm is also allowed to delete the newly grown head monomer and regrow at
        the old tail!
    - id: b
      text: Because always growing at the head causes the chain length $N$ to grow to infinity.
      text_markdown: Because always growing at the head causes the chain length $N$ to grow to infinity.
    - id: c
      text: Because the Boltzmann factor $e^{-\beta E}$ is different for the head monomer than for the tail monomer.
      text_markdown: Because the Boltzmann factor $e^{-\beta E}$ is different for the head monomer than for the tail monomer.
    - id: d
      text: Because forward-only growth changes the lattice coordination number $q$.
      text_markdown: Because forward-only growth changes the lattice coordination number $q$.
    correct: a
    rationale_markdown: Detailed balance requires $\pi(o) P(o \to n) = \pi(n) P(n \to o)$ between pairs of states. If state
      $n$ is generated from state $o$ by removing the tail monomer and adding a head monomer, the reverse transition $n \to
      o$ requires removing the head monomer and restoring the tail monomer. If the algorithm only ever moves forward, $P(n
      \to o) = 0$ while $P(o \to n) > 0$, violating detailed balance (and getting permanently stuck at the very first dead-end
      encountered!).
  - id: q19_pivot_algorithm_relaxation_exponent
