  - id: q26_linear_pdf_inverse_numeric
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_inverse_transform_and_box_muller
    prompt_markdown: Suppose a random variable $y \in [0, 2]$ has the normalized linear PDF $p(y) = \frac{1}{2}y$ for $0 \le
      y \le 2$. Find the cumulative distribution function $C(y) = \int_0^y \frac{1}{2}t\,dt$, invert $C(y) = u$, and compute
      the sampled deviate $y$ when $u = 0.36$.
    hint_markdown: Integrate the linear density to find the CDF on $[0, 2]$, invert the relation, and solve for $y$ given
      $u$.
    correct:
      value: 1.2
      tolerance: 0.01
    rationale_markdown: 'The CDF on $[0, 2]$ is:

      $$C(y) = \int_0^y \frac{1}{2}t\,dt = \frac{y^2}{4}$$

      Setting $\frac{y^2}{4} = u \implies y = 2\sqrt{u}$. For $u = 0.36$:

      $$y = 2\sqrt{0.36} = 2 \times 0.60 = 1.20$$'
  - id: q27_cauchy_inverse_transform
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_inverse_transform_and_box_muller
    - concept_inverse_and_box_muller
    prompt_markdown: The standard **Cauchy (Lorentzian)** distribution $p(y) = \frac{1}{\pi(1 + y^2)}$ on $-\infty < y < \infty$
      has cumulative distribution function $C(y) = \frac{1}{2} + \frac{1}{\pi}\arctan(y)$. If $u \sim \text{Uniform}(0, 1)$,
      what is the exact Inverse Transform Sampling formula $y(u) = C^{-1}(u)$?
    hint_markdown: Invert the cumulative distribution function by isolating the inverse tangent term.
    options:
    - id: a
      text: $y = \tan\!\left[\pi\left(u - \frac{1}{2}\right)\right]$
      text_markdown: $y = \tan\!\left[\pi\left(u - \frac{1}{2}\right)\right]$
    - id: b
      text: $y = \arctan(\pi u)$
      text_markdown: $y = \arctan(\pi u)$
    - id: c
      text: $y = \frac{1}{\pi(1 + u^2)}$
      text_markdown: $y = \frac{1}{\pi(1 + u^2)}$
    - id: d
      text: $y = \sin(2\pi u)$
      text_markdown: $y = \sin(2\pi u)$
    correct: a
    rationale_markdown: 'Rearranging $u = \frac{1}{2} + \frac{1}{\pi}\arctan(y)$ gives $\arctan(y) = \pi\left(u - \frac{1}{2}\right)$,
      and taking the tangent of both sides yields:

      $$y = \tan\!\left[\pi\left(u - \frac{1}{2}\right)\right]$$'
  - id: q28_cauchy_numeric
