      tolerance: 0.01
    rationale_markdown: 'Substituting $u = 0.75$ and $\gamma = 2.0$:

      $$y = 2.0 \tan\!\left[\pi(0.75 - 0.50)\right] = 2.0 \tan\!\left(\frac{\pi}{4}\right) = 2.0 \times 1.0 = 2.00$$'
  - id: q29_why_gaussian_needs_box_muller
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_inverse_transform_and_box_muller
    prompt_markdown: Why can we **not** use simple 1D analytical Inverse Transform Sampling $y = C^{-1}(x)$ to draw Normal
      Gaussian random numbers $p(y) = \frac{1}{\sqrt{2\pi}}e^{-y^2/2}$, motivating the 2D **Box–Muller** method instead?
    hint_markdown: Can the 1D Gaussian integral $\Phi(y) = \int_{-\infty}^y \frac{1}{\sqrt{2\pi}}e^{-u^2/2}\,du$ be expressed
      and inverted in terms of elementary functions?
    options:
    - id: a
      text: Because the 1D Gaussian cumulative distribution function $\Phi(y)$ (the error function $\text{erf}$) cannot be
        written or inverted in closed form using elementary functions, whereas the 2D Gaussian integral in polar coordinates
        $r\,dr\,d\theta\,e^{-r^2/2}$ integrates and inverts analytically.
      text_markdown: Because the 1D Gaussian cumulative distribution function $\Phi(y)$ (the error function $\text{erf}$)
        cannot be written or inverted in closed form using elementary functions, whereas the 2D Gaussian integral in polar
        coordinates $r\,dr\,d\theta\,e^{-r^2/2}$ integrates and inverts analytically.
    - id: b
      text: Because the Gaussian PDF $p(y)$ can be negative for $y < 0$.
      text_markdown: Because the Gaussian PDF $p(y)$ can be negative for $y < 0$.
    - id: c
      text: Because the 1D Gaussian integral $\int_{-\infty}^\infty e^{-y^2/2}\,dy$ diverges to infinity.
      text_markdown: Because the 1D Gaussian integral $\int_{-\infty}^\infty e^{-y^2/2}\,dy$ diverges to infinity.
    - id: d
      text: Because 1D Inverse Transform Sampling only works for discrete variables.
      text_markdown: Because 1D Inverse Transform Sampling only works for discrete variables.
    correct: a
    rationale_markdown: While $\int e^{-y^2/2}\,dy$ has no elementary antiderivative in 1D, squaring the integral into 2D
      gives $\iint e^{-(y_1^2+y_2^2)/2}\,dy_1\,dy_2 = \int_0^{2\pi} d\theta \int_0^\infty e^{-r^2/2}\,r\,dr$. The extra factor
      of $r$ from the polar Jacobian $dy_1\,dy_2 = r\,dr\,d\theta$ makes the radial integral an elementary exponential $x_1
      = e^{-r^2/2}$ that inverts immediately to $r = \sqrt{-2\ln x_1}$!
  - id: q30_box_muller_formulas
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_inverse_transform_and_box_muller
    prompt_markdown: Given two independent uniform deviates $x_1, x_2 \in (0, 1)$, what are the **Box–Muller transformation
      formulas** that produce two independent standard normal deviates $y_1, y_2 \sim \mathcal{N}(0, 1)$?
    hint_markdown: Check the orange equations for the Box-Muller transformation.
    options:
    - id: a
      text: $y_1 = \sqrt{-2\ln x_1}\cos(2\pi x_2)$ and $y_2 = \sqrt{-2\ln x_1}\sin(2\pi x_2)$
      text_markdown: $y_1 = \sqrt{-2\ln x_1}\cos(2\pi x_2)$ and $y_2 = \sqrt{-2\ln x_1}\sin(2\pi x_2)$
    - id: b
      text: $y_1 = -\ln(x_1)\cos(x_2)$ and $y_2 = -\ln(x_1)\sin(x_2)$
      text_markdown: $y_1 = -\ln(x_1)\cos(x_2)$ and $y_2 = -\ln(x_1)\sin(x_2)$
    - id: c
      text: $y_1 = x_1 \cos(2\pi x_2)$ and $y_2 = x_1 \sin(2\pi x_2)$
      text_markdown: $y_1 = x_1 \cos(2\pi x_2)$ and $y_2 = x_1 \sin(2\pi x_2)$
    - id: d
      text: $y_1 = \sqrt{x_1 + x_2}$ and $y_2 = \sqrt{x_1 - x_2}$
      text_markdown: $y_1 = \sqrt{x_1 + x_2}$ and $y_2 = \sqrt{x_1 - x_2}$
    correct: a
    rationale_markdown: 'In Box–Muller, $r = \sqrt{-2\ln x_1}$ generates the Rayleigh radial distribution and $\theta = 2\pi
      x_2$ generates a uniform polar angle on $[0, 2\pi)$, giving:

      $$y_1 = \sqrt{-2\ln x_1}\cos(2\pi x_2), \qquad y_2 = \sqrt{-2\ln x_1}\sin(2\pi x_2)$$'
  - id: q31_box_muller_numeric
