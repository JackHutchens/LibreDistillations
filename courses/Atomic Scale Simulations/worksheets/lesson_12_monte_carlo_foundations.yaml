  - id: q33_box_muller_jacobian_factorization
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_inverse_transform_and_box_muller
    prompt_markdown: 'the $2\times 2$ Jacobian determinant of the Box–Muller transformation is shown to be:

      $$\frac{\partial(x_1, x_2)}{\partial(y_1, y_2)} = -\left[\frac{1}{\sqrt{2\pi}}e^{-y_1^2/2}\right]\left[\frac{1}{\sqrt{2\pi}}e^{-y_2^2/2}\right]$$

      Why does the fact that the joint density $p(y_1, y_2) = \left|\frac{\partial(x_1, x_2)}{\partial(y_1, y_2)}\right|$
      factors into the product $p(y_1)\,p(y_2)$ have such an important practical consequence?'
    hint_markdown: In probability theory, what does $p(y_1, y_2) = p(y_1)p(y_2)$ prove about the random variables $y_1$ and
      $y_2$?
    options:
    - id: a
      text: It proves that $y_1$ and $y_2$ are statistically independent Normal Gaussian variables, so both can be used as
        independent draws in a simulation.
      text_markdown: It proves that $y_1$ and $y_2$ are statistically independent Normal Gaussian variables, so both can be
        used as independent draws in a simulation.
    - id: b
      text: It proves that $y_1$ and $y_2$ are always equal to each other ($y_1 = y_2$).
      text_markdown: It proves that $y_1$ and $y_2$ are always equal to each other ($y_1 = y_2$).
    - id: c
      text: It proves that $y_1 + y_2 = 0$.
      text_markdown: It proves that $y_1 + y_2 = 0$.
    - id: d
      text: It shows that one of the two variables must be discarded.
      text_markdown: It shows that one of the two variables must be discarded.
    correct: a
    rationale_markdown: 'Two random variables are **statistically independent** if and only if their joint PDF factors into
      the product of their marginal PDFs: $p(y_1, y_2) = p_1(y_1)p_2(y_2)$. Thus every Box–Muller evaluation produces **two**
      independent standard normal deviates!'
  - id: q34_marsaglia_polar_advantage
