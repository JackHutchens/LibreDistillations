        - label: 'Exponential / Poisson: y = -ln(1-u)/λ'
          value: exponential
        - label: 2D Box–Muller Normal Gaussian
          value: box_muller
        - label: 'Cauchy / Lorentzian: y = γ tan(π(u-1/2))'
