    prompt_markdown: In the Box–Muller algorithm, suppose your uniform random number generator produces the pair $x_1 = e^{-2}
      \approx 0.135335$ and $x_2 = \frac{1}{6} \approx 0.166667$. Compute the first standard normal deviate $y_1 = \sqrt{-2\ln
