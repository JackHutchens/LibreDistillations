    takeaway_markdown: '**Key Takeaway:** 1D Inverse Transform Sampling works whenever the indefinite integral $C(y) = \int_{-\infty}^y
      f(u)\,du$ is analytically known and invertible. When $C^{-1}$ has no closed form—as for the Gaussian—2D coordinate transformations
      like **Box–Muller** make exact analytical inversion possible!'
  - id: q19_inverse_transform_requirements
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_inverse_transform_and_box_muller
    prompt_markdown: what mathematical condition must the target probability density $p(y)$ satisfy in order to directly apply
      1D **Inverse Transform Sampling** $y = C^{-1}(x)$?
    hint_markdown: Read the second bullet point in the yellow box at the bottom of.
    options:
    - id: a
      text: The definite/indefinite integral $C(y) = \int_{-\infty}^y du\,p(u)$ must be known and analytically (or efficiently
        numerically) invertible.
      text_markdown: The definite/indefinite integral $C(y) = \int_{-\infty}^y du\,p(u)$ must be known and analytically (or
        efficiently numerically) invertible.
    - id: b
      text: The target distribution $p(y)$ must be symmetric about $y = 0$.
      text_markdown: The target distribution $p(y)$ must be symmetric about $y = 0$.
    - id: c
      text: The target distribution $p(y)$ must be a constant function.
      text_markdown: The target distribution $p(y)$ must be a constant function.
    - id: d
      text: The second derivative $p''(y)$ must be zero everywhere.
      text_markdown: The second derivative $p''(y)$ must be zero everywhere.
    correct: a
    rationale_markdown: Direct 1D Inverse Transform Sampling sets $x = C(y) = \int_{-\infty}^y p(u)\,du$ and solves for $y
      = C^{-1}(x)$, which requires that the cumulative distribution function $C(y)$ be known and invertible.
  - id: q20_inverse_transform_quantile_meaning
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by:
    - sec_inverse_transform_and_box_muller
    - concept_inverse_and_box_muller
    prompt_markdown: In 1D Inverse Transform Sampling, suppose the uniform random number generator returns $x = 0.25$. Geometrically,
      how is the output deviate $y = C^{-1}(0.25)$ related to the target probability density curve $p(y)$?
    hint_markdown: Since $C(y) = \int_{-\infty}^y p(u)\,du$ is the area under $p(y)$ to the left of $y$, what does $C(y) =
      0.25$ mean?
    options:
    - id: a
      text: $y$ is the value (first quartile) such that exactly fraction $x = 0.25$ ($25\%$) of the total area under $p(y)$
        lies to the left of $y$.
      text_markdown: $y$ is the value (first quartile) such that exactly fraction $x = 0.25$ ($25\%$) of the total area under
        $p(y)$ lies to the left of $y$.
    - id: b
      text: $y$ is the point where the height of the PDF equals $p(y) = 0.25$.
      text_markdown: $y$ is the point where the height of the PDF equals $p(y) = 0.25$.
    - id: c
      text: $y$ is always equal to $0.25$ times the mean $\langle y \rangle$.
      text_markdown: $y$ is always equal to $0.25$ times the mean $\langle y \rangle$.
    - id: d
      text: $y$ is the point where the slope $dp/dy = 0.25$.
      text_markdown: $y$ is the point where the slope $dp/dy = 0.25$.
    correct: a
    rationale_markdown: As explained, $C(y)$ is the cumulative area under $p(y)$ to the left of $y$. Solving $C(y) = x = 0.25$
      returns the exact quantile $y$ that has $25\%$ of the probability distribution's area to its left.
  - id: q21_exponential_sampling_formula
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_inverse_transform_and_box_muller
    prompt_markdown: Given a uniform deviate $x \in (0, 1]$, which formula generates a random waiting time $y \ge 0$ drawn
      from the exponential (Poisson event) distribution $p(y) = \lambda e^{-\lambda y}$?
    hint_markdown: Invert $x = C(y) = 1 - e^{-\lambda y}$ and note that $x' = 1 - x$ is also uniform on $(0, 1]$.
    options:
    - id: a
      text: $y = -\frac{1}{\lambda}\ln(x)$ (or equivalently $-\frac{1}{\lambda}\ln(1 - x)$)
      text_markdown: $y = -\frac{1}{\lambda}\ln(x)$ (or equivalently $-\frac{1}{\lambda}\ln(1 - x)$)
    - id: b
      text: $y = \lambda e^{-\lambda x}$
      text_markdown: $y = \lambda e^{-\lambda x}$
    - id: c
      text: $y = \sqrt{-2\lambda \ln x}$
      text_markdown: $y = \sqrt{-2\lambda \ln x}$
    - id: d
      text: $y = -\lambda \ln(x)$
      text_markdown: $y = -\lambda \ln(x)$
    correct: a
    rationale_markdown: 'Integrating $p(y) = \lambda e^{-\lambda y}$ gives $C(y) = 1 - e^{-\lambda y}$. Setting $1 - e^{-\lambda
      y} = x \implies e^{-\lambda y} = 1 - x = x''$, and taking the natural logarithm yields:

      $$y = -\frac{\ln(x'')}{\lambda}$$'
  - id: q22_exponential_deviate_numeric
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by:
    - sec_inverse_transform_and_box_muller
    - concept_inverse_and_box_muller
    prompt_markdown: For an exponential Poisson waiting-time distribution with decay rate $\lambda = 2.0\text{ ps}^{-1}$,
      what waiting time $y$ (in $\text{ps}$, to three decimal places) is generated via inverse transform sampling when the
      uniform random deviate is $x = e^{-3} \approx 0.049787$?
    hint_markdown: Apply the inverse cumulative distribution function for an exponential decay to the given uniform random
      deviate.
    correct:
      value: 1.5
      tolerance: 0.01
    rationale_markdown: 'Substituting $x = e^{-3}$ and $\lambda = 2.0\text{ ps}^{-1}$ gives:

      $$y = -\frac{\ln(e^{-3})}{2.0} = -\frac{-3.0}{2.0} = 1.500\text{ ps}$$'
  - id: q23_exponential_complement_trick
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_inverse_transform_and_box_muller
    prompt_markdown: When inverting the exponential CDF $x = 1 - e^{-\lambda y}$, algebra gives $y = -\frac{1}{\lambda}\ln(1
      - x)$, yet codes almost always write $y = -\frac{1}{\lambda}\ln(x)$ directly. Why is replacing $1 - x$ with $x$ mathematically
      valid, and why must $x$ be drawn from $(0, 1]$ rather than $[0, 1)$?
    hint_markdown: If $x \sim \text{Uniform}(0, 1)$, what is the distribution of $x' = 1 - x$? And what happens to $\ln(x)$
      if $x = 0$?
    options:
    - id: a
      text: If $x$ is uniform on $(0, 1)$, then $x' = 1 - x$ has the exact same $\text{Uniform}(0, 1)$ distribution; furthermore,
        $x = 0$ must be excluded so $\ln(x)$ does not diverge to $-\infty$.
      text_markdown: If $x$ is uniform on $(0, 1)$, then $x' = 1 - x$ has the exact same $\text{Uniform}(0, 1)$ distribution;
        furthermore, $x = 0$ must be excluded so $\ln(x)$ does not diverge to $-\infty$.
    - id: b
      text: Because $\ln(1 - x) = \ln(x)$ for all real numbers $x$.
      text_markdown: Because $\ln(1 - x) = \ln(x)$ for all real numbers $x$.
    - id: c
      text: Because $1 - x$ is only approximately uniform when $\lambda \gg 1$.
      text_markdown: Because $1 - x$ is only approximately uniform when $\lambda \gg 1$.
    - id: d
      text: Replacing $1 - x$ with $x$ changes the mean of $y$ from $1/\lambda$ to $2/\lambda$.
      text_markdown: Replacing $1 - x$ with $x$ changes the mean of $y$ from $1/\lambda$ to $2/\lambda$.
    correct: a
    rationale_markdown: For $x \sim \text{Uniform}(0, 1)$, the reflected variable $x' = 1 - x$ is identically distributed
      as $\text{Uniform}(0, 1)$, saving one subtraction per sample. Excluding $0$ (using $x' \in (0, 1]$ as noted ) prevents
      `log(0)` floating-point overflow.
  - id: q24_power_law_inverse_cdf
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_inverse_transform_and_box_muller
    prompt_markdown: You want to sample a continuous random variable $y \in [0, 1]$ from the cubic probability density $p(y)
      = 4y^3$ using a uniform random deviate $u \sim \text{Uniform}(0, 1)$. What is the Inverse Transform Sampling formula
      $y(u) = C^{-1}(u)$?
    hint_markdown: Integrate the PDF to determine the cumulative distribution function on $[0, 1]$ and invert the resulting
      relationship.
    options:
    - id: a
      text: $y = u^{1/4}$
      text_markdown: $y = u^{1/4}$
    - id: b
      text: $y = u^4$
      text_markdown: $y = u^4$
    - id: c
      text: $y = \frac{1}{4}u^{1/3}$
      text_markdown: $y = \frac{1}{4}u^{1/3}$
    - id: d
      text: $y = -\frac{1}{4}\ln u$
      text_markdown: $y = -\frac{1}{4}\ln u$
    correct: a
    rationale_markdown: 'Integrating the PDF gives the cumulative distribution function:

      $$C(y) = \int_0^y 4t^3\,dt = y^4$$

      Setting $C(y) = u$ and inverting on $y \in [0, 1]$ yields:

      $$y = u^{1/4}$$'
  - id: q25_power_law_inverse_numeric
