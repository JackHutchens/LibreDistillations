worksheet:
  id: lesson_12_monte_carlo_foundations
  title: Lesson 12 — Monte Carlo Foundations, Curse of Dimensionality & Non-Uniform Sampling
  estimated_minutes: 115
  learning_objectives:
  - Explain the historical origin and core philosophy of Monte Carlo methods (Ulam, von Neumann, and Metropolis at Los Alamos
    in the 1940s; Buffon's needle; stochastic vs. deterministic evaluation of integrals).
  - Derive and apply hit-or-miss Monte Carlo estimation of π in the unit square, including its binomial hit probability p
    = π/4 and statistical standard error scaling σ ∝ M^(-1/2).
  - Prove the Curse of Dimensionality scaling law for order-α deterministic quadrature in D dimensions (CPU time ∝ ε^(-D/α))
    versus Monte Carlo integration (CPU time ∝ ε^(-2)), and identify the exact crossover dimension D* = 2α.
  - Compute moments, expectations, cumulative distribution functions (CDFs), and apply the fundamental Jacobian transformation
    law p_y(y)|dy| = p_x(x)|dx| for 1D and multivariate random variable mappings.
  - Derive and execute Inverse Transform Sampling x = C^(-1)(u) for exponential/Poisson, power-law, and Lorentzian/Cauchy
    distributions, as well as the 2D Box–Muller and Marsaglia polar transforms for Normal Gaussian deviates.
  sections:
  - id: sec_mc_intro_and_pi
    type: markdown_section
    title: 1. What Is Monte Carlo? History & Hit-or-Miss Estimation of π
    body_markdown: "### Origins and Philosophy of Monte Carlo\nIn the 1940s at Los Alamos National Laboratory, **Stanislaw\
      \ Ulam**, **John von Neumann**, and **Nicholas Metropolis** coined the name **Monte Carlo**—after the famous casino\
      \ in Monaco where Ulam's uncle borrowed money to gamble—to describe **any numerical algorithm that uses (pseudo)random\
      \ numbers as an essential part of the calculation**.\n\nUnlike deterministic Molecular Dynamics (which integrates Newton's\
      \ equations of motion along a time-ordered trajectory), Monte Carlo (MC) is fundamentally **stochastic**:\n- It evaluates\
      \ **high-dimensional integrals** (such as the canonical configurational partition function $Z = \\int d\\mathbf{r}_1\
      \ \\cdots d\\mathbf{r}_N\\, e^{-\\beta V(\\mathbf{r}^N)}$ in $D = 3N$ dimensions) by randomly sampling points in the\
      \ integration domain.\n- In statistical physics, it is most often implemented as a **Markov chain** known as **Metropolis\
      \ Monte Carlo**.\n- Its earliest forerunner is **Buffon's Needle** (1777), which estimated $\\pi$ from the probability\
      \ that a dropped needle crosses parallel floorboard lines.\n\n### Simple Monte Carlo: Throwing Darts to Estimate $\\\
      pi$\nconsider a circle of radius $r = 1$ inscribed inside a square, and focus on **one quadrant** in the unit square\
      \ $[0, 1] \\times [0, 1]$:\n$$\\frac{\\text{Area of } 1/4\\text{ circle}}{\\text{Area of unit square}} = \\frac{\\pi\
      \ r^2 / 4}{r^2} = \\frac{\\pi}{4} \\approx 0.785398$$\n\nIf we throw $M$ independent random darts $(x_n, y_n)$ with\
      \ $x_n \\sim \\text{Uniform}(0, 1)$ and $y_n \\sim \\text{Uniform}(0, 1)$:\n```python\nhits = 0\nfor n in range(1, M\
      \ + 1):\n x = rng.random\n y = rng.random\n if (x**2 + y**2 <= 1.0):\n hits += 1\npi_est = 4.0 * hits / M\n```\nEach\
      \ dart is an independent Bernoulli trial with success probability $p = \\frac{\\pi}{4}$ and variance per trial $\\sigma_1^2\
      \ = p(1 - p) = \\frac{\\pi}{4}\\left(1 - \\frac{\\pi}{4}\\right)$. After $M$ throws:\n- Expected fraction of hits: $\\\
      langle \\text{hits}/M \\rangle = p = \\frac{\\pi}{4} \\implies \\langle \\hat{\\pi} \\rangle = 4p = \\pi$.\n- Variance\
      \ of the hit fraction: $\\text{Var}(\\hat{p}) = \\frac{p(1-p)}{M}$.\n- **Standard error of $\\hat{\\pi} = 4\\hat{p}$:**\n\
      \ $$\\sigma_{\\hat{\\pi}} = 4\\sqrt{\\frac{p(1-p)}{M}} = \\sqrt{\\frac{\\pi(4 - \\pi)}{M}} \\approx \\frac{1.642}{\\\
      sqrt{M}}$$"
  - id: concept_hit_or_miss_pi
    type: concept_cell
    title: 'Interactive Explorer: Hit-or-Miss Dartboard & M^(-1/2) Convergence of π'
    description_markdown: Throw $M$ random darts into the unit square $[0, 1]^2$. Switch between the **2D Dartboard View**
      and the **Running Convergence View** to see how $\hat{\pi}(M) = 4 N_{\text{hit}}/M$ converges inside the theoretical
      $\pm 1.96\sqrt{\pi(4-\pi)/M}$ confidence band.
    render_function: render_hit_or_miss_pi
    layout: figure_left
    controls:
      panel_mode:
        kind: dropdown
        label: Visualization Mode
        options:
        - label: 2D Quarter-Circle Dartboard
          value: dartboard
        - label: Running Estimate π̂(M) & 95% Band
          value: convergence
        default: dartboard
      M_samples:
        kind: slider
        label: Number of Darts M
        min: 50
        max: 2500
        step: 50
        default: 500
      seed:
        kind: slider
        label: Random Seed
        min: 1
        max: 100
        step: 1
        default: 42
    takeaway_markdown: '**Key Takeaway:** Because the Monte Carlo statistical error decays as $\varepsilon \propto M^{-1/2}$,
      reducing the error by a factor of $10$ (gaining **one extra decimal place** of precision) requires **$10^2 = 100$ times
      more samples**!'
  - id: q01_mc_definition_history
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_mc_intro_and_pi
    prompt_markdown: What is the defining characteristic of a **Monte Carlo method** (named at Los Alamos in the 1940s), as
      contrasted with deterministic grid or trajectory methods?
    hint_markdown: what is an essential ingredient of every Monte Carlo algorithm?
    options:
    - id: a
      text: It is a stochastic algorithm that uses (pseudo)random numbers as an essential part of evaluating integrals or
        sampling probability distributions.
      text_markdown: It is a stochastic algorithm that uses (pseudo)random numbers as an essential part of evaluating integrals
        or sampling probability distributions.
    - id: b
      text: It is a deterministic finite-difference solver for Newton's second law $F = ma$.
      text_markdown: It is a deterministic finite-difference solver for Newton's second law $F = ma$.
    - id: c
      text: It requires laying out a uniform $L^D$ mesh across all dimensions.
      text_markdown: It requires laying out a uniform $L^D$ mesh across all dimensions.
    - id: d
      text: It can only be applied to 1D or 2D geometric problems.
      text_markdown: It can only be applied to 1D or 2D geometric problems.
    correct: a
    rationale_markdown: a **Monte Carlo method** is any stochastic (non-deterministic) method that uses (pseudo)random numbers
      as an essential part of the algorithm, especially for evaluating high-dimensional integrals by sampling the integrand.
  - id: q02_pi_hit_probability
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_mc_intro_and_pi
    prompt_markdown: In the hit-or-miss Monte Carlo estimation of $\pi$ on the unit quadrant $(x, y) \in [0, 1]^2$, what is
      the exact theoretical probability $p$ that a single uniformly chosen dart lands inside the quarter-circle $x^2 + y^2
      \le 1$ (to four decimal places)?
    hint_markdown: Determine the ratio of the area of the unit quarter-circle to the area of the bounding unit square.
    correct:
      value: 0.7854
      tolerance: 0.0005
    rationale_markdown: 'The ratio of the quarter-circle area $\frac{1}{4}\pi r^2$ to the unit square area $r^2$ is:

      $$p = \frac{\pi}{4} \approx 0.7854$$'
  - id: q03_pi_estimate_from_hits
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by:
    - sec_mc_intro_and_pi
    - concept_hit_or_miss_pi
    prompt_markdown: You run the quarter-circle dartboard Monte Carlo simulation with $N = 2000$ independent random points
      uniformly chosen in the unit square $[0, 1]^2$ and record `hits = 1573` points landing inside the quarter-circle $x^2
      + y^2 \le 1$. What is the resulting Monte Carlo estimate $\hat{\pi}$ of $\pi$?
    hint_markdown: Relate the empirical acceptance ratio to the quarter-circle area, and scale appropriately to estimate the
      full circle's area.
    correct:
      value: 3.146
      tolerance: 0.001
    rationale_markdown: 'Directly applying the estimator `pi = 4 * hits / N` gives:

      $$\hat{\pi} = \frac{4 \times 1573}{2000} = \frac{6292}{2000} = 3.146$$'
  - id: q04_pi_std_error_numeric
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_mc_intro_and_pi
    - concept_hit_or_miss_pi
    prompt_markdown: For the hit-or-miss quarter-circle dartboard estimator of $\pi$ based on a Bernoulli indicator with probability
      $p = \pi / 4$, what is the theoretical standard error $\sigma_{\hat{\pi}}$ when $M = 10{,}000$ independent trials are
      evaluated? (Enter to four decimal places, e.g., `0.0164`.)
    hint_markdown: Propagate the standard error of a binomial proportion with success probability $p = \pi/4$ when multiplied
      by the geometric scale factor 4.
    correct:
      value: 0.0164
      tolerance: 0.0005
    rationale_markdown: 'For $M = 10{,}000$ binomial trials with $p = \pi/4$ and $\hat{\pi} = 4\hat{p}$:

      $$\sigma_{\hat{\pi}} = 4\sqrt{\frac{(\pi/4)(1 - \pi/4)}{10{,}000}} = \frac{\sqrt{\pi(4 - \pi)}}{100} \approx \frac{1.6422}{100}
      \approx 0.0164$$'
  - id: q05_extra_decimal_place_cost
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by:
    - sec_mc_intro_and_pi
    - concept_hit_or_miss_pi
    prompt_markdown: As highlighted, if a Monte Carlo simulation currently achieves a statistical error of $\varepsilon =
      0.01$ in $T_{\text{CPU}} = 1\text{ minute}$, how many **minutes** of CPU time are required to reduce the statistical
      error by a factor of $10$ to $\varepsilon = 0.001$ (one additional decimal place)?
    hint_markdown: Recall the inverse square-root convergence rate of independent Monte Carlo sampling with respect to the
      number of samples.
    correct:
      value: 100.0
      tolerance: 0.1
    rationale_markdown: Because Monte Carlo error scales as $\varepsilon \propto M^{-1/2}$ and CPU time scales linearly with
      sample count ($T_{\text{CPU}} \propto M \propto \varepsilon^{-2}$), reducing $\varepsilon$ by a factor of $10$ requires
      $10^2 = 100$ times as many samples, or $100\text{ minutes}$.
  - id: sec_curse_of_dimensionality
    type: markdown_section
    title: '2. The Curse of Dimensionality: Deterministic Quadrature vs. Monte Carlo Scaling'
    body_markdown: "Why use a slow $M^{-1/2}$ method when deterministic 1D quadrature rules (like the Trapezoidal rule or\
      \ Simpson's rule) converge much faster in 1D? The answer lies in the **Curse of Dimensionality** when integrating over\
      \ a $D$-dimensional hypercube:\n$$I = \\int_0^1 dx_1 \\cdots \\int_0^1 dx_D\\, f(x_1, \\dots, x_D)$$\n\n### Scaling\
      \ of Conventional Deterministic Grid Quadrature\nSuppose we lay out a uniform grid with $L$ points along each of the\
      \ $D$ coordinate axes, so the grid spacing is $h = 1/L$:\n- **Total number of grid points (and CPU time):**\n $$N =\
      \ L^D = h^{-D} \\sim T_{\\text{CPU}} \\quad \\Longleftrightarrow \\quad h = N^{-1/D}$$\n- **Truncation error of an order-$\\\
      alpha$ quadrature rule:**\n - **Trapezoidal Rule ($\\alpha = 2$):** From the Taylor expansion $f(x) = f(x_0) + f'(x_0)h\
      \ + \\frac{1}{2}f''(x_0)h^2 + \\dots$, the leading integration error scales as $\\varepsilon \\sim f^{(2)}(x)\\,h^2$.\n\
      \ - **Simpson's Rule ($\\alpha = 4$):** Error scales as $\\varepsilon \\sim f^{(4)}(x)\\,h^4$.\n - **General Order-$\\\
      alpha$ Rule:**\n $$\\varepsilon_{\\text{quad}} \\sim f^{(\\alpha)}(x)\\,h^\\alpha = N^{-\\alpha / D}$$\n- **CPU Time\
      \ as a function of target accuracy $\\varepsilon$:** Inverting $\\varepsilon \\sim h^\\alpha \\implies h \\sim \\varepsilon^{1/\\\
      alpha}$ and substituting into $T_{\\text{CPU}} \\sim N = h^{-D}$ gives:\n $$T_{\\text{quad}} \\sim \\varepsilon^{-D\
      \ / \\alpha}$$\n\n### Scaling of Stochastic Integration (Monte Carlo)\nBy the Central Limit Theorem, averaging $M$ random\
      \ evaluations of $f(\\mathbf{x})$ yields a statistical uncertainty governed solely by the integrand variance $\\sigma_f^2$:\n\
      $$\\varepsilon_{\\text{MC}} = \\frac{\\sigma_f}{\\sqrt{M}} \\sim M^{-1/2} \\quad \\Longrightarrow \\quad T_{\\text{MC}}\
      \ \\sim M \\sim \\varepsilon^{-2}$$\nCrucially, the exponent $-2$ in $T_{\\text{MC}} \\sim \\varepsilon^{-2}$ is **completely\
      \ independent of the spatial dimension $D$!**\n\n### The Exact Crossover Dimension $D^* = 2\\alpha$\nComparing the CPU\
      \ time exponents for small $\\varepsilon \\to 0$:\n$$\\text{Monte Carlo beats an order-}\\alpha\\text{ grid rule whenever\
      \ } \\frac{D}{\\alpha} > 2 \\quad \\Longleftrightarrow \\quad \\mathbf{D > 2\\alpha}$$\n- Against the **Trapezoidal\
      \ Rule ($\\alpha = 2$)**: MC wins for **$D > 4$** (and ties at $D = 4$).\n- Against **Simpson's Rule ($\\alpha = 4$)**:\
      \ MC wins for **$D > 8$** (and ties at $D = 8$).\n- In an atomistic simulation of just $100$ atoms in 3D, $D = 3N =\
      \ 300 \\gg 2\\alpha$. Even a crude $L = 10$ grid per axis would require $N = 10^{300}$ function evaluations (vastly\
      \ exceeding the $\\sim 10^{80}$ atoms in the observable universe!), making Monte Carlo the **only** viable general integration\
      \ method!\n\nAs summarizes, two further practical advantages of Monte Carlo are that it is **conceptually and practically\
      \ simple** to code in any geometry, and it **comes with built-in statistical error bars**."
  - id: concept_dimensionality_crossover
    type: concept_cell
    title: 'Interactive Explorer: Quadrature vs. Monte Carlo Scaling & Crossover Dimension D* = 2α'
    description_markdown: Select a deterministic quadrature rule (**Trapezoidal $\alpha=2$**, **Simpson's $\alpha=4$**, or
      **Gauss–Legendre $\alpha=6$**) and vary the **integration dimension $D$**. Toggle between **Error vs. Evaluations $\varepsilon(N)$**
      and **Log(CPU Time) vs. Dimension $D$** to see the exact crossover at $D^* = 2\alpha$.
    render_function: render_dimensionality_crossover
    layout: figure_left
    controls:
      quadrature_rule:
        kind: dropdown
        label: Deterministic Quadrature Rule
        options:
        - label: Trapezoidal Rule (α = 2, D* = 4)
          value: trapezoidal
        - label: Simpson's Rule (α = 4, D* = 8)
          value: simpson
        - label: 3-Pt Gauss–Legendre (α = 6, D* = 12)
          value: gauss6
        default: trapezoidal
      dimension_D:
        kind: slider
        label: Integration Dimension D
        min: 1
        max: 16
        step: 1
        default: 6
      view_mode:
        kind: dropdown
        label: Plot View
        options:
        - label: Log-Log Error ε(N) vs. Evaluations N
          value: error_vs_N
        - label: CPU Cost Exponent vs. Dimension D
          value: cpu_vs_D
        default: error_vs_N
    takeaway_markdown: '**Key Takeaway:** On a log-log plot of CPU time vs. Error, the Monte Carlo curve has a fixed slope
      of $-2$ regardless of $D$, whereas the grid quadrature slope $-D/\alpha$ steepens relentlessly with dimension, crossing
      MC at $D^* = 2\alpha$.'
  - id: q06_grid_points_hypercube
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_curse_of_dimensionality
    prompt_markdown: You lay out a uniform deterministic grid with $L = 10$ points along each coordinate direction to integrate
      a function in a $D = 6$-dimensional hypercube. What is the total number of grid points $N$ in the tensor product grid?
    hint_markdown: Determine the total number of points in a multidimensional Cartesian product grid.
    correct:
      value: 1000000.0
      tolerance: 1.0
    rationale_markdown: 'With $L = 10$ points along each of the $D = 6$ axes, the tensor-product grid requires

      $$N = L^D = 10^6 = 1{,}000{,}000\text{ points}$$'
  - id: q07_trapezoidal_crossover_dim
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by:
    - sec_curse_of_dimensionality
    - concept_dimensionality_crossover
    prompt_markdown: For the **Trapezoidal Rule** ($\varepsilon \sim h^2$, order $\alpha = 2$), above what exact spatial dimension
      $D^*$ does Monte Carlo integration ($\varepsilon \sim M^{-1/2}$) asymptotically beat deterministic grid quadrature in
      the limit of small error $\varepsilon \to 0$ (i.e., $D > D^*$)?
    hint_markdown: Equate the error scaling exponents with respect to total computational evaluations $N$ for deterministic
      grid quadrature and Monte Carlo sampling.
    correct:
      value: 4.0
      tolerance: 0.01
    rationale_markdown: 'For the Trapezoidal rule ($\alpha = 2$), $T_{\text{quad}} \sim \varepsilon^{-D/2}$ while $T_{\text{MC}}
      \sim \varepsilon^{-2}$. Comparing exponents $D/2 > 2$ gives the crossover dimension:

      $$D^* = 2\alpha = 2(2) = 4$$

      Thus Monte Carlo wins for all $D > 4$.'
  - id: q08_simpsons_crossover_dim
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by:
    - sec_curse_of_dimensionality
    - concept_dimensionality_crossover
    prompt_markdown: For **Simpson's Rule** ($\varepsilon \sim f^{(4)}(x) h^4$, order $\alpha = 4$), above what crossover
      dimension $D^*$ does Monte Carlo integration asymptotically require less computational work than Simpson's rule as $\varepsilon
      \to 0$?
    hint_markdown: Find the dimensionality where the error scaling exponent of grid quadrature matches the universal $-1/2$
      exponent of Monte Carlo.
    correct:
      value: 8.0
      tolerance: 0.01
    rationale_markdown: 'For Simpson''s rule ($\alpha = 4$), $T_{\text{quad}} \sim \varepsilon^{-D/4}$ while $T_{\text{MC}}
      \sim \varepsilon^{-2}$. Setting $D/4 = 2$ gives:

      $$D^* = 2\alpha = 2(4) = 8$$

      Thus Monte Carlo outperforms Simpson''s rule whenever $D > 8$.'
  - id: q09_quad_cpu_scaling_exponent
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_curse_of_dimensionality
    prompt_markdown: Consider an order-$\alpha$ deterministic integration rule ($\varepsilon \sim h^\alpha$) applied to a
      $D$-dimensional integral using $N = L^D = h^{-D}$ grid points. How does the required CPU time $T_{\text{int}} \sim N$
      scale with the target error $\varepsilon$?
    hint_markdown: Since $\varepsilon \sim h^\alpha$, we have $h \sim \varepsilon^{1/\alpha}$. Substitute this into $T_{\text{int}}
      \sim h^{-D}$.
    options:
    - id: a
      text: $T_{\text{int}} \sim \varepsilon^{-D/\alpha}$
      text_markdown: $T_{\text{int}} \sim \varepsilon^{-D/\alpha}$
    - id: b
      text: $T_{\text{int}} \sim \varepsilon^{-\alpha/D}$
      text_markdown: $T_{\text{int}} \sim \varepsilon^{-\alpha/D}$
    - id: c
      text: $T_{\text{int}} \sim \varepsilon^{-2}$
      text_markdown: $T_{\text{int}} \sim \varepsilon^{-2}$
    - id: d
      text: $T_{\text{int}} \sim \varepsilon^{-D \alpha}$
      text_markdown: $T_{\text{int}} \sim \varepsilon^{-D \alpha}$
    correct: a
    rationale_markdown: 'From $\varepsilon \sim h^\alpha$, we have $h \sim \varepsilon^{1/\alpha}$. Because the number of
      grid points in $D$ dimensions is $N = h^{-D}$, the CPU time scales as:

      $$T_{\text{int}} \sim N = h^{-D} \sim \left(\varepsilon^{1/\alpha}\right)^{-D} = \varepsilon^{-D/\alpha}$$'
  - id: q10_trapezoidal_6d_error_exponent
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by:
    - sec_curse_of_dimensionality
    - concept_dimensionality_crossover
    prompt_markdown: Suppose you use the **Trapezoidal Rule** ($\alpha = 2$) in $D = 6$ dimensions with $N$ total grid evaluations.
      The integration error scales with $N$ as $\varepsilon \propto N^{-\gamma}$. What is the numerical value of the positive
      convergence exponent $\gamma$ (to three decimal places)?
    hint_markdown: Express the grid spacing $h$ in terms of total grid points $N$ in $D$ dimensions, and substitute into the
      error order $\varepsilon \propto h^\alpha$.
    correct:
      value: 0.333
      tolerance: 0.005
    rationale_markdown: 'In $D = 6$ dimensions, $N$ total grid points yield $L = N^{1/6}$ points per axis and grid spacing
      $h = N^{-1/6}$. For the Trapezoidal rule ($\alpha = 2$):

      $$\varepsilon \propto h^2 = \left(N^{-1/6}\right)^2 = N^{-2/6} = N^{-1/3} \implies \gamma = \frac{1}{3} \approx 0.333$$

      Notice that $0.333 < 0.500$, confirming that in $D = 6$ the Trapezoidal rule converges more slowly with $N$ than Monte
      Carlo ($\varepsilon \propto N^{-0.5}$)!'
  - id: q11_log_cpu_vs_log_error_plot
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by:
    - sec_curse_of_dimensionality
    - concept_dimensionality_crossover
    prompt_markdown: $\log(\text{CPU Time})$ is plotted against $\log(\text{error})$ (with smaller error to the left, labeled
      "Good", and larger error to the right, labeled "Bad") for Trapezoidal-rule quadrature in $2\text{D}, 4\text{D}, 6\text{D},
      8\text{D}$ alongside a band of orange lines labeled **MC**. Why is the $4\text{D}$ quadrature line parallel to the **MC**
      lines, while $6\text{D}$ and $8\text{D}$ are much steeper?
    hint_markdown: 'Take the logarithm of $T_{\text{quad}} \sim \varepsilon^{-D/2}$ and $T_{\text{MC}} \sim \varepsilon^{-2}$:
      what are the slopes $d(\log T)/d(\log \varepsilon)$?'
    options:
    - id: a
      text: Because $\log T_{\text{quad}} = -(D/2)\log\varepsilon + \text{const}$ has slope $-D/2$, which equals the Monte
        Carlo slope $-2$ at $D = 4$ and becomes steeper ($-3$ and $-4$) for $D = 6$ and $8$.
      text_markdown: Because $\log T_{\text{quad}} = -(D/2)\log\varepsilon + \text{const}$ has slope $-D/2$, which equals
        the Monte Carlo slope $-2$ at $D = 4$ and becomes steeper ($-3$ and $-4$) for $D = 6$ and $8$.
    - id: b
      text: Because Monte Carlo only works in 4 dimensions.
      text_markdown: Because Monte Carlo only works in 4 dimensions.
    - id: c
      text: Because the Trapezoidal rule is exact for all functions in $2\text{D}$.
      text_markdown: Because the Trapezoidal rule is exact for all functions in $2\text{D}$.
    - id: d
      text: Because random number generators run faster in $4\text{D}$ than in $2\text{D}$.
      text_markdown: Because random number generators run faster in $4\text{D}$ than in $2\text{D}$.
    correct: a
    rationale_markdown: Taking logarithms of $T_{\text{quad}} \propto \varepsilon^{-D/2}$ gives $\log T_{\text{quad}} = -\frac{D}{2}\log\varepsilon
      + C$, while $\log T_{\text{MC}} = -2\log\varepsilon + C'$. At $D = 4$, the quadrature slope is $-4/2 = -2$, exactly
      parallel to the MC slope! For $D = 6$ and $8$, the slopes are $-3$ and $-4$, so CPU cost explodes much faster than MC
      as error decreases toward the "Good" (left) side of the plot.
  - id: q12_other_reasons_for_mc
    type: problem
    question_type: multi_select
    difficulty: easy
    taught_by: sec_curse_of_dimensionality
    prompt_markdown: Besides its superior asymptotic scaling in high dimensions ($D > 2\alpha$), what additional practical
      advantages of Monte Carlo integration are highlighted? *(Select all that apply.)*
    hint_markdown: Look at the orange bullet points under 'Other reasons to do Monte Carlo:'.
    options:
    - id: a
      text: It is conceptually and practically simple to implement, even for complex, high-dimensional, or irregularly shaped
        integration domains.
      text_markdown: It is conceptually and practically simple to implement, even for complex, high-dimensional, or irregularly
        shaped integration domains.
    - id: b
      text: It comes with built-in statistical error bars (via the sample variance $\sigma / \sqrt{M}$).
      text_markdown: It comes with built-in statistical error bars (via the sample variance $\sigma / \sqrt{M}$).
    - id: c
      text: It gives zero error with just $M = 1$ sample.
      text_markdown: It gives zero error with just $M = 1$ sample.
    - id: d
      text: It requires knowing the analytical 4th derivative $f^{(4)}(x)$ of the integrand beforehand.
      text_markdown: It requires knowing the analytical 4th derivative $f^{(4)}(x)$ of the integrand beforehand.
    correct:
    - a
    - b
    rationale_markdown: As emphasizes, Monte Carlo is **conceptually and practically simple** and **comes with built-in error
      bars** estimated directly from the variance of the sampled values.
  - id: sec_pdfs_moments_and_mappings
    type: markdown_section
    title: 3. Probability Distributions, Moments, and Mappings of Random Variables
    body_markdown: "### Probability Distribution Functions (PDFs), CDFs, and Moments\nA continuous random variable $x$ is\
      \ governed by its **probability distribution function (p.d.f.)** $P(x)$, where $P(x)\\,dx$ is the probability of observing\
      \ a value in the infinitesimal interval $(x, x + dx)$:\n$$P(x) \\ge 0, \\qquad \\int_{-\\infty}^{\\infty} dx\\, P(x)\
      \ = 1 \\quad \\text{(Normalization)}$$\n\n- **Cumulative Distribution Function (CDF):** The probability of observing\
      \ a value less than or equal to $y$:\n $$C(y) = \\int_{-\\infty}^y dx\\, P(x), \\qquad 0 \\le C(y) \\le 1, \\qquad \\\
      frac{dC(y)}{dy} = P(y)$$\n- **Expectation Value (Average) of an Observable $g(x)$:**\n $$\\langle g(x) \\rangle = \\\
      bar{g} = \\int_{-\\infty}^{\\infty} dx\\, P(x)\\, g(x)$$\n- **Moments $I_n = \\langle x^n \\rangle = \\int_{-\\infty}^{\\\
      infty} dx\\, P(x)\\, x^n$:**\n - **Zeroth moment:** $I_0 = \\langle x^0 \\rangle = 1$ (normalization)\n - **First moment\
      \ (Mean):** $\\langle x \\rangle = I_1$\n - **Variance:** $\\sigma_x^2 = \\left\\langle (x - \\langle x \\rangle)^2\
      \ \\right\\rangle = \\langle x^2 \\rangle - \\langle x \\rangle^2 = I_2 - (I_1)^2$\n\n### Mappings of Random Variables\
      \ & Conservation of Probability\nSuppose we have a random variable $x$ with known distribution $p_x(x)$ (for instance,\
      \ a uniform random number $x \\sim \\text{Uniform}(0, 1)$ where $p_x(x) = 1$) and we map it to a new variable $y = g(x)$.\
      \ What is the probability density $p_y(y)$ of $y$?\n\nBecause the probability of landing in corresponding infinitesimal\
      \ intervals must be conserved ($p_y(y)|dy| = p_x(x)|dx|$):\n$$p_y(y) = p_x(x)\\left|\\frac{dx}{dy}\\right| = p_x(x)\\\
      left|\\frac{dx}{dg(x)}\\right| = p_x(x)\\left|\\frac{dg(x)}{dx}\\right|^{-1}$$\n\n> [!NOTE] What happens when $y = g(x)$\
      \ is NOT monotonic?\n> If multiple distinct values $x^{(1)}, x^{(2)}, \\dots$ map to the same output $y = g(x^{(k)})$,\
      \ all those pre-image intervals contribute to $p_y(y)|dy|$, so we **sum over all branches**:\n> $$p_y(y) = \\sum_{k:\\\
      , g(x^{(k)}) = y} p_x\\!\\left(x^{(k)}\\right) \\left|\\frac{dg}{dx}\\Big|_{x^{(k)}}\\right|^{-1}$$\n\n**Worked Example:**\
      \ Let $x \\sim \\text{Uniform}(0, 1]$ (so $p_x(x) = 1$) and define $y = g(x) = -\\ln(x) \\ge 0$.\nThen $\\frac{dg(x)}{dx}\
      \ = -\\frac{1}{x}$, so $\\left|\\frac{dg}{dx}\\right|^{-1} = x = e^{-y}$. Therefore:\n$$p_y(y)\\,dy = (1)\\cdot e^{-y}\\\
      ,dy = e^{-y}\\,dy \\quad (y \\ge 0)$$\nMore generally, scaling by $\\lambda > 0$ via $y = -\\frac{1}{\\lambda}\\ln(x)$\
      \ produces the **exponential (Poisson waiting-time) distribution** $p_y(y) = \\lambda e^{-\\lambda y}$!"
  - id: q13_pdf_normalization_numeric
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_pdfs_moments_and_mappings
    prompt_markdown: A continuous random variable $x \in [0, 2]$ has probability density function $P(x) = A x^2$ for $0 \le
      x \le 2$ (and $P(x) = 0$ otherwise). Using the normalization condition $I_0 = \int_{-\infty}^\infty P(x)\,dx = 1$, what
      is the numerical value of the normalization constant $A$?
    hint_markdown: Integrate the polynomial PDF over its support and set the total probability to unity.
    correct:
      value: 0.375
      tolerance: 0.002
    rationale_markdown: 'Enforcing normalization $\int_0^2 A x^2\,dx = 1$:

      $$A \left[\frac{x^3}{3}\right]_0^2 = \frac{8}{3}A = 1 \implies A = \frac{3}{8} = 0.375$$'
  - id: q14_variance_from_moments_numeric
    type: problem
    question_type: numeric
    difficulty: easy
    taught_by: sec_pdfs_moments_and_mappings
    prompt_markdown: For a continuous probability distribution $P(x)$, the first moment is $I_1 = \langle x \rangle = 3.0$
      and the second moment is $I_2 = \langle x^2 \rangle = 13.5$. What is the variance $\operatorname{Var}(x) = \langle (x
      - \langle x \rangle)^2 \rangle$?
    hint_markdown: Relate the variance of a distribution to its first two raw moments.
    correct:
      value: 4.5
      tolerance: 0.01
    rationale_markdown: 'By the identity:

      $$\text{Var}(x) = \left\langle (x - \langle x \rangle)^2 \right\rangle = I_2 - (I_1)^2 = 13.5 - (3.0)^2 = 13.5 - 9.0
      = 4.50$$'
  - id: q15_cdf_properties
    type: problem
    question_type: single_select
    difficulty: easy
    taught_by: sec_pdfs_moments_and_mappings
    prompt_markdown: Which of the following statements is **always true** for the cumulative distribution function $C(y) =
      \int_{-\infty}^y dx\,P(x)$ of any valid continuous probability density $P(x) \ge 0$?
    hint_markdown: Since $P(x) \ge 0$ and $\int_{-\infty}^\infty P(x)\,dx = 1$, how does $C(y)$ behave as $y$ increases from
      $-\infty$ to $+\infty$?
    options:
    - id: a
      text: $C(y)$ is monotonically non-decreasing with $0 \le C(y) \le 1$, $C(-\infty) = 0$, $C(+\infty) = 1$, and $\frac{dC(y)}{dy}
        = P(y)$.
      text_markdown: $C(y)$ is monotonically non-decreasing with $0 \le C(y) \le 1$, $C(-\infty) = 0$, $C(+\infty) = 1$, and
        $\frac{dC(y)}{dy} = P(y)$.
    - id: b
      text: $C(y)$ oscillates between $-1$ and $+1$ and integrates to $1$.
      text_markdown: $C(y)$ oscillates between $-1$ and $+1$ and integrates to $1$.
    - id: c
      text: $C(y)$ equals the second derivative of $P(y)$.
      text_markdown: $C(y)$ equals the second derivative of $P(y)$.
    - id: d
      text: $C(y)$ can decrease whenever $P(y)$ decreases.
      text_markdown: $C(y)$ can decrease whenever $P(y)$ decreases.
    correct: a
    rationale_markdown: Because the integrand $P(x) \ge 0$ is non-negative everywhere, accumulating area from $-\infty$ to
      $y$ produces a monotonically non-decreasing function bounded by $0 \le C(y) \le 1$, with fundamental theorem of calculus
      derivative $dC(y)/dy = P(y)$.
  - id: q16_mapping_jacobian_rule
    type: problem
    question_type: single_select
    difficulty: medium
    taught_by: sec_pdfs_moments_and_mappings
    prompt_markdown: Let $x$ be a continuous random variable with PDF $p_x(x)$, and let $y = g(x)$ be a monotonic differentiable
      mapping. Which formula correctly gives the transformed PDF $p_y(y)$?
    hint_markdown: Conservation of probability in corresponding intervals requires $p_y(y)|dy| = p_x(x)|dx|$.
    options:
    - id: a
      text: $p_y(y) = p_x(x)\left|\frac{dx}{dy}\right| = p_x(x)\left|\frac{dg(x)}{dx}\right|^{-1}$
      text_markdown: $p_y(y) = p_x(x)\left|\frac{dx}{dy}\right| = p_x(x)\left|\frac{dg(x)}{dx}\right|^{-1}$
    - id: b
      text: $p_y(y) = p_x(x)\left|\frac{dg(x)}{dx}\right|$
      text_markdown: $p_y(y) = p_x(x)\left|\frac{dg(x)}{dx}\right|$
    - id: c
      text: $p_y(y) = p_x(g(x))$
      text_markdown: $p_y(y) = p_x(g(x))$
    - id: d
      text: $p_y(y) = \frac{d}{dy} p_x(x)$
      text_markdown: $p_y(y) = \frac{d}{dy} p_x(x)$
    correct: a
    rationale_markdown: 'Equating the probability mass in infinitesimal intervals $p_y(y)|dy| = p_x(x)|dx|$ and dividing by
      $|dy|$ yields:

      $$p_y(y) = p_x(x)\left|\frac{dx}{dy}\right| = p_x(x)\left|\frac{dg(x)}{dx}\right|^{-1}$$'
  - id: q17_power_mapping_pdf_numeric
    type: problem
    question_type: numeric
    difficulty: medium
    taught_by: sec_pdfs_moments_and_mappings
    prompt_markdown: Suppose $x \sim \text{Uniform}(0, 1)$ (so $p_x(x) = 1$ on $0 < x < 1$) and we define a new random variable
      through the mapping $y = x^2$. What is the numerical value of the transformed probability density $p_y(y)$ evaluated
      at $y = 0.25$?
    hint_markdown: Apply the transformation law for continuous probability distributions using the derivative of the mapping
      function.
    correct:
      value: 1.0
      tolerance: 0.01
    rationale_markdown: 'Since $y = x^2 \implies x = \sqrt{y}$ and $\frac{dy}{dx} = 2x = 2\sqrt{y}$, we have:

      $$p_y(y) = \frac{1}{2\sqrt{y}} \implies p_y(0.25) = \frac{1}{2\sqrt{0.25}} = \frac{1}{2 \times 0.5} = 1.00$$'
  - id: q18_non_monotonic_mapping
    type: problem
    question_type: single_select
    difficulty: hard
    taught_by: sec_pdfs_moments_and_mappings
    prompt_markdown: 'asks: *"What happens when $g(x)$ is not monotonic?"* Suppose $x$ is distributed uniformly on $[-1, 1]$
      with $p_x(x) = \frac{1}{2}$, and we define the non-monotonic mapping $y = g(x) = x^2 \in (0, 1]$. Because both $x_+
      = +\sqrt{y}$ and $x_- = -\sqrt{y}$ map to the same $y$, what is the resulting PDF $p_y(y)$ on $0 < y \le 1$?'
    hint_markdown: Sum the Jacobian contributions $\sum_{x = \pm\sqrt{y}} p_x(x) |2x|^{-1}$ over both branches!
    options:
    - id: a
      text: $p_y(y) = \frac{1}{2\sqrt{y}}$, because the two branches $x = +\sqrt{y}$ and $x = -\sqrt{y}$ each contribute $\frac{1}{2}
        \cdot \frac{1}{2\sqrt{y}} = \frac{1}{4\sqrt{y}}$.
      text_markdown: $p_y(y) = \frac{1}{2\sqrt{y}}$, because the two branches $x = +\sqrt{y}$ and $x = -\sqrt{y}$ each contribute
        $\frac{1}{2} \cdot \frac{1}{2\sqrt{y}} = \frac{1}{4\sqrt{y}}$.
    - id: b
      text: $p_y(y) = 0$, because the positive and negative branches cancel out.
      text_markdown: $p_y(y) = 0$, because the positive and negative branches cancel out.
    - id: c
      text: $p_y(y) = \frac{1}{4\sqrt{y}}$, because only the positive branch counts.
      text_markdown: $p_y(y) = \frac{1}{4\sqrt{y}}$, because only the positive branch counts.
    - id: d
      text: $p_y(y) = 2\sqrt{y}$.
      text_markdown: $p_y(y) = 2\sqrt{y}$.
    correct: a
    rationale_markdown: 'When $g(x)$ is not monotonic, probability conservation sums the absolute Jacobian contributions from
      all pre-image roots $g(x^{(k)}) = y$:

      $$p_y(y) = p_x(+\sqrt{y})\left|\frac{1}{2\sqrt{y}}\right| + p_x(-\sqrt{y})\left|\frac{1}{-2\sqrt{y}}\right| = \frac{1}{2}\frac{1}{2\sqrt{y}}
      + \frac{1}{2}\frac{1}{2\sqrt{y}} = \frac{1}{2\sqrt{y}}$$

      which properly integrates to $\int_0^1 \frac{dy}{2\sqrt{y}} = [\sqrt{y}]_0^1 = 1$.'
  - id: sec_inverse_transform_and_box_muller
    type: markdown_section
    title: 4. Inverse Transform Sampling, Box–Muller, and Marsaglia Polar Gaussian Sampling
    body_markdown: "### Inverse Transform Sampling: $y = C^{-1}(x)$\nHow do we turn a standard uniform random number generator\
      \ $x \\sim \\text{Uniform}(0, 1)$ (where $p_x(x) = 1$ on $0 \\le x \\le 1$) into a generator for **any** desired target\
      \ distribution $p_y(y) = f(y)$?\n\nSet the mapping relation $\\frac{dx}{dy} = f(y)$ and integrate:\n$$x = C(y) = \\\
      int_{-\\infty}^y du\\, f(u) \\quad \\Longleftrightarrow \\quad y(x) = C^{-1}(x)$$\n**Geometric & Physical Interpretation:**\n\
      1. Draw a uniform random deviate $x \\in (0, 1]$.\n2. Find the value $y$ on the horizontal axis that has **fraction\
      \ $x$ of the total area under $f(y)$ to the left of $y$**, i.e., solve $C(y) = x$.\n3. Return $y = C^{-1}(x)$.\n\n####\
      \ Key Analytical Examples of Inverse Transform Sampling\n1. **Exponential / Poisson Waiting-Time Distribution:**\n -\
      \ Target PDF: $f(y) = \\lambda e^{-\\lambda y}$ for $y \\ge 0$.\n - CDF: $x = C(y) = \\int_0^y \\lambda e^{-\\lambda\
      \ u}\\,du = 1 - e^{-\\lambda y}$.\n - Inversion: $1 - x = e^{-\\lambda y}$. Since $x' = 1 - x$ is also uniformly distributed\
      \ on $(0, 1]$, we obtain:\n $$y = -\\frac{1}{\\lambda}\\ln(1 - x) \\;\\stackrel{d}{=}\\; -\\frac{1}{\\lambda}\\ln(x')$$\n\
      2. **Power-Law Distribution on $[0, 1]$:**\n - Target PDF: $f(y) = (n + 1)y^n$ for $0 \\le y \\le 1$ ($n > -1$).\n -\
      \ CDF: $x = C(y) = y^{n+1} \\implies y = x^{1/(n+1)}$.\n3. **Cauchy / Lorentzian Distribution:**\n - Target PDF: $f(y)\
      \ = \\frac{1}{\\pi}\\frac{\\gamma}{y^2 + \\gamma^2}$ for $-\\infty < y < \\infty$.\n - CDF: $x = C(y) = \\frac{1}{2}\
      \ + \\frac{1}{\\pi}\\arctan(y/\\gamma) \\implies y = \\gamma \\tan\\!\\left[\\pi\\left(x - \\frac{1}{2}\\right)\\right]$.\n\
      \n### Sampling a Normal Gaussian: The Box–Muller Transform\nIn Molecular Dynamics (Lesson 11!), initializing Maxwell–Boltzmann\
      \ velocities or running an Andersen/Langevin thermostat requires drawing Gaussian random numbers:\n$$p(y)\\,dy = \\\
      frac{1}{\\sqrt{2\\pi}}e^{-y^2/2}\\,dy$$\nWhy can't we just use 1D Inverse Transform Sampling? Because the Gaussian indefinite\
      \ integral $C(y) = \\Phi(y) = \\frac{1}{2}\\left[1 + \\text{erf}(y/\\sqrt{2})\\right]$ **cannot be inverted in closed\
      \ form using elementary functions!**\n\n**Box and Muller (1958)** solved this ingeniously by pairing **two** independent\
      \ uniform deviates $x_1, x_2 \\in (0, 1)$ to generate **two** independent standard normal deviates $y_1, y_2$ via 2D\
      \ polar coordinates:\n$$p(y_1, y_2)\\,dy_1\\,dy_2 = \\frac{1}{2\\pi}e^{-(y_1^2 + y_2^2)/2}\\,dy_1\\,dy_2 = p(x_1, x_2)\\\
      left|\\frac{\\partial(x_1, x_2)}{\\partial(y_1, y_2)}\\right| dy_1\\,dy_2$$\nDefine the forward and inverse coordinate\
      \ transformations:\n$$y_1 = \\sqrt{-2\\ln x_1}\\cos(2\\pi x_2), \\qquad y_2 = \\sqrt{-2\\ln x_1}\\sin(2\\pi x_2)$$\n\
      $$x_1 = \\exp\\!\\left(-\\frac{1}{2}[y_1^2 + y_2^2]\\right), \\qquad x_2 = \\frac{1}{2\\pi}\\tan^{-1}\\!\\left(\\frac{y_2}{y_1}\\\
      right)$$\nThe $2\\times 2$ Jacobian determinant factors cleanly into the product of two 1D Gaussians:\n$$\\frac{\\partial(x_1,\
      \ x_2)}{\\partial(y_1, y_2)} = -\\left[\\frac{1}{\\sqrt{2\\pi}}e^{-y_1^2/2}\\right]\\left[\\frac{1}{\\sqrt{2\\pi}}e^{-y_2^2/2}\\\
      right]$$\nproving that $y_1$ and $y_2$ are **statistically independent** standard normal variables! (To obtain mean\
      \ $\\mu$ and standard deviation $\\sigma = \\sqrt{k_B T / m}$, simply set $v = \\mu + \\sigma y$).\n\n### The Marsaglia\
      \ Polar Method: Avoiding $\\sin$ and $\\cos$ ( Bottom)\nEvaluating transcendental functions $\\cos(2\\pi x_2)$ and $\\\
      sin(2\\pi x_2)$ is computationally expensive. At the bottom of (\"Better:\"), we instead pick a random point $(v_1,\
      \ v_2)$ uniformly inside the square $[-1, 1]^2$ and accept it if it lies inside the unit disk:\n$$R^2 = v_1^2 + v_2^2\
      \ \\le 1 \\quad (\\text{and } R^2 > 0)$$\nBecause $R^2$ is uniformly distributed on $(0, 1]$ and the angle $\\theta$\
      \ is uniform on $[0, 2\\pi)$, we can identify $x_1 = R^2$ (or $\\sqrt{R^2}$ in radial parameterization) and replace\
      \ $\\cos(2\\pi x_2)$ and $\\sin(2\\pi x_2)$ with the algebraic ratios $v_1/\\sqrt{R^2}$ and $v_2/\\sqrt{R^2}$:\n$$y_1\
      \ = \\sqrt{-2\\ln(R^2)}\\,\\frac{v_1}{\\sqrt{R^2}}, \\qquad y_2 = \\sqrt{-2\\ln(R^2)}\\,\\frac{v_2}{\\sqrt{R^2}}$$\n\
      - **No $\\sin$ or $\\cos$ evaluation required!**\n- **Two independent Gaussian deviates per calculation** (\"1 for now,\
      \ 2 for next time\")."
  - id: concept_inverse_and_box_muller
    type: concept_cell
    title: 'Interactive Explorer: Inverse Transform Sampling & 2D Box–Muller Gaussian Mapping'
    description_markdown: Switch between **Exponential ($y = -\ln(1-u)/\lambda$)**, **Cauchy/Lorentzian ($y = \gamma\tan(\pi(u-1/2))$)**,
      and the **2D Box–Muller Transform**. Observe how quantile inversion $u \to C^{-1}(u)$ maps uniform draws on $(0,1)$
      into non-uniform densities, and how Box–Muller maps $(x_1, x_2)$ into concentric 2D Gaussian rings.
